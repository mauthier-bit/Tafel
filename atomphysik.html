<!DOCTYPE html><html lang="de"><head>

<style>
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#1f2430;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  /* Reiterleiste über allen vier Ansichten */
  #tabs{flex:none;display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #e6eaf0;overflow-x:auto;}
  #tabs>*{flex:0 0 auto;}
  #tabs button{border:1px solid #cfd6e0;background:#fff;border-radius:8px;padding:5px 11px;font:700 13px -apple-system,sans-serif;cursor:pointer;color:#1f2430;white-space:nowrap;}
  #tabs button.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  #tabs #shotBtns{margin-left:auto;display:inline-flex;gap:5px;}
  #tabs #shotBtns button{font-weight:600;}
  #views{flex:1;position:relative;min-height:0;}
  .view{position:absolute;inset:0;display:none;flex-direction:column;}
  .view.on{display:flex;}
  .view iframe{flex:1;width:100%;border:0;display:block;}
  .bar{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:6px 8px;border-bottom:1px solid #eef1f5;font-size:13px;}
  .bar>*{flex:0 0 auto;}
  .bar button,.bar select{border:1px solid #cfd6e0;background:#fff;border-radius:7px;padding:4px 9px;font:600 13px -apple-system,sans-serif;cursor:pointer;color:#1f2430;white-space:nowrap;}
  .bar button.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .bar b{font-size:13px;white-space:nowrap;}
  .bar .wert{min-width:30px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;}
  .bar label{display:inline-flex;gap:4px;align-items:center;font-weight:600;white-space:nowrap;}
  .bar .trenn{width:1px;height:20px;background:#e3e8ef;}
  .flaeche{flex:1;position:relative;min-height:0;overflow:hidden;}
  .flaeche canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;}

<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>
</head><body>

  <div id="tabs">

    <div class="view on" data-v="pse"><iframe id="fPse" title="Periodensystem"></iframe></div>

    <div class="view" data-v="huelle">
      <div class="bar">

        <button type="button" id="eAll" title="alle Elektronen auf einmal einsetzen">alle</button>

        <button type="button" id="hSchale" class="on" title="Schalenbild rechts zeigen">Schalenbild</button>

    <div class="view" data-v="topf">

        <b>Neutronen</b>
        <button type="button" id="nM">−</button><span class="wert" id="nV">6</span><button type="button" id="nP">+</button>
        <span class="trenn"></span>
        <button type="button" id="kUm" title="Den Zerfall ausführen und zum Tochterkern wechseln">Umwandlung ausführen</button>
        <button type="button" id="kMag" class="on" title="Magische Zahlen (abgeschlossene Schalen) hervorheben">magische Zahlen</button>
      </div>
      <div class="flaeche"><canvas id="cvK"></canvas></div>

  </div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const EL=(window.PSE_DATA||[]).map(a=>({z:a[0],sym:a[1],name:a[2],mass:a[3],cat:a[4],x:a[5],y:a[6],conf:a[10]}));
const NUK=window.NUK_DATA||[];
const NMAP=new Map(); NUK.forEach(e=>NMAP.set(e[0]*1000+e[1],e));
const nukOf=(z,n)=>NMAP.get(z*1000+n)||null;
const ZMAX=EL.length||118;
const elOf=z=>EL[z-1]||{z,sym:'?',name:'',conf:''};

let D={ v:1, tab:'pse', fontSize:13, fontBold:false, fontItalic:false,
        hz:11, he:null, hs:true,            /* Hülle: Ordnungszahl, gesetzte Elektronen (null = alle), Schalenbild */
        kz:6, kn:6, kmag:true,              /* Kernpotentialtopf: Protonen, Neutronen, magische Zahlen */
        pse:null, nuklid:null };

const fontStr=(px,bold)=>(D.fontItalic?'italic ':'')+((bold||D.fontBold)?'800 ':'600 ')+px+'px -apple-system,BlinkMacSystemFont,sans-serif';
const HOCH={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const hoch=n=>String(n).split('').map(c=>HOCH[c]||c).join('');
const JA=3.15576e7;
function hlText(s){
  if(s===0) return 'stabil';
  if(s===-1||s===undefined||s===null) return 'unbekannt';
  const U=[[1e-21,'zs'],[1e-18,'as'],[1e-15,'fs'],[1e-12,'ps'],[1e-9,'ns'],[1e-6,'µs'],[1e-3,'ms'],[1,'s'],
           [60,'min'],[3600,'h'],[86400,'d'],[JA,'a'],[1e3*JA,'ka'],[1e6*JA,'Ma'],[1e9*JA,'Ga']];
  let u=U[0]; for(const x of U){ if(s>=x[0]) u=x; }
  const v=s/u[0], t=v>=100?Math.round(v):v>=10?Math.round(v*10)/10:Math.round(v*100)/100;
  return String(t).replace('.',',')+' '+u[1]; }
const ART={ '':'stabil', 'B-':'β⁻-Zerfall', 'B+':'β⁺-Zerfall / Elektroneneinfang', 'A':'α-Zerfall',
  'SF':'spontane Spaltung', 'P':'Protonen-Emission', 'N':'Neutronen-Emission', 'B-n':'β⁻ mit Neutron', 'IT':'Übergang (IT)' };
function produkt(z,n,art){ switch(art){
  case 'B-': return [z+1,n-1]; case 'B+': return [z-1,n+1]; case 'A': return [z-2,n-2];
  case 'N': return [z,n-1]; case 'P': return [z-1,n]; case 'B-n': return [z+1,n-2]; default: return null; } }

/* ============ Reiter ============ */
function rahmen(t){ return t==='pse'?$('fPse'):t==='nuklid'?$('fNuk'):null; }
function rahmenLaden(t){ const fr=rahmen(t); if(!fr||fr.dataset.auf) return; fr.dataset.auf='1';
  fr.src=(t==='pse')?'pse.html':'nuklid.html'; }
function fuettern(t){ const fr=rahmen(t); if(!fr||!fr.contentWindow) return;
  const d=Object.assign({},(t==='pse'?D.pse:D.nuklid)||{},{fontSize:D.fontSize,fontBold:D.fontBold,fontItalic:D.fontItalic});
  try{ fr.contentWindow.postMessage({type:'embed-data',data:d},'*'); }catch(e){} }
function setTab(t,still){ D.tab=t;
  document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.dataset.v===t));
  $('shotBtns').hidden=(t==='pse'||t==='nuklid');     /* die beiden Karten bringen ihre eigenen Knöpfe mit */
  if(t==='pse'||t==='nuklid') rahmenLaden(t); else resize();
  if(!still) sync(); }
document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

/* ============ Hülle: Schalen und Energien ============ */
/* Aufbaureihenfolge (Madelung): erst kleine Summe n+l, bei gleicher Summe kleines n. */
const ORB=[['1s',0],['2s',0],['2p',1],['3s',0],['3p',1],['4s',0],['3d',2],['4p',1],['5s',0],['4d',2],['5p',1],
           ['6s',0],['4f',3],['5d',2],['6p',1],['7s',0],['5f',3],['6d',2],['7p',1]];
const SCHALENNAME=['K','L','M','N','O','P','Q'];
function besetzung(e){ const L=[]; let rest=e;
  for(const o of ORB){ const cap=2*(2*o[1]+1), k=Math.max(0,Math.min(cap,rest)); rest-=k;
    L.push({nm:o[0], n:+o[0][0], l:o[1], cap, k}); }
  return L; }
function konfText(L){ return L.filter(o=>o.k>0).map(o=>o.nm+hoch(o.k)).join(' '); }
/* Die tatsächliche Konfiguration aus den Elementdaten, Edelgas-Kurzform aufgelöst */
const EDEL={He:2,Ne:10,Ar:18,Kr:36,Xe:54,Rn:86};
function konfMap(z,tiefe){ const c=(elOf(z).conf||'').trim(); if(!c) return null;
  const m=c.match(/^\[(\w+)\]\s*(.*)$/); let map={}, rest=c;
  if(m){ rest=m[2]; const zz=EDEL[m[1]];
    if(zz&&(tiefe||0)<6){ const u=konfMap(zz,(tiefe||0)+1); if(u) map=Object.assign({},u); } }
  rest.split(/\s+/).filter(Boolean).forEach(t=>{ const g=t.match(/^(\d[spdf])(\d+)$/); if(g) map[g[1]]=(map[g[1]]||0)+(+g[2]); });
  return map; }
const ORDNUNG=o=>(+o[0])*10+'spdf'.indexOf(o[1]);
function mapText(map){ return Object.keys(map).filter(k=>map[k]>0).sort((a,b)=>ORDNUNG(a)-ORDNUNG(b))
  .map(k=>k+hoch(map[k])).join(' '); }
function konfGleich(a,b){ if(!a||!b) return true;
  const k=new Set([...Object.keys(a),...Object.keys(b)]);
  for(const x of k){ if((a[x]||0)!==(b[x]||0)) return false; }
  return true; }
function schalen(L){ const s=[0,0,0,0,0,0,0]; L.forEach(o=>{ if(o.k) s[o.n-1]+=o.k; }); return s; }
const hElektronen=()=>{ const z=D.hz; return (D.he===null||D.he===undefined)?z:Math.max(0,Math.min(z,D.he)); };

function zeichneHuelle(){
  const cv=$('cvH'), ctx=cv.getContext('2d'), w=cv.clientWidth, h=cv.clientHeight;
  ctx.clearRect(0,0,w,h); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  const fs=Math.max(10,D.fontSize||13), el=elOf(D.hz), e=hElektronen(), L=besetzung(e), S=schalen(L);
  const textH=fs*6.2, unten=h-textH, diaW=D.hs?Math.max(w*0.52,w-Math.min(w*0.46,unten*0.95)):w;

  /* ---- Energiestufen mit Kästchen ---- */
  const voll=L.filter(o=>o.k>0).length, zeigen=Math.min(ORB.length, Math.max(4, voll+2));
  const padL=fs*2.6, padR=10, padT=10, padB=8;
  const rowH=Math.max(fs*1.5,(unten-padT-padB)/zeigen), box=Math.min(rowH*0.55,fs*1.8);
  ctx.textBaseline='middle';
  for(let i=0;i<zeigen;i++){ const o=L[i], y=unten-padB-rowH*(i+0.5);
    ctx.font=fontStr(fs*0.92,true); ctx.textAlign='right'; ctx.fillStyle='#475569';
    ctx.fillText(o.nm, padL-6, y);
    const anz=2*o.l+1, bw=Math.min(box, (diaW-padL-padR)/Math.max(anz,1)-3);
    let x=padL;
    for(let k=0;k<anz;k++){
      ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.2;
      ctx.strokeRect(x, y-bw/2, bw, bw);
      x+=bw+3; }
    /* Elektronen nach der Hundschen Regel: erst einzeln, dann paaren */
    const einzeln=Math.min(o.k,anz), paare=Math.max(0,o.k-anz);
    ctx.strokeStyle='#1d4ed8'; ctx.lineWidth=Math.max(1.4,bw*0.1); ctx.lineCap='round';
    for(let k=0;k<anz;k++){ const bx=padL+k*(bw+3), m=bx+bw/2;
      const pfeil=(oben,hoch2)=>{ const yy=y+(oben?-1:1)*bw*0.06, l=bw*0.56, sp=bw*0.17, dx=(oben?-sp:sp);
        ctx.beginPath(); ctx.moveTo(m+dx, yy+l/2*(oben?1:-1)); ctx.lineTo(m+dx, yy-l/2*(oben?1:-1));
        ctx.lineTo(m+dx-bw*0.12, yy-l/2*(oben?1:-1)+(oben?bw*0.16:-bw*0.16)); ctx.moveTo(m+dx, yy-l/2*(oben?1:-1));
        ctx.lineTo(m+dx+bw*0.12, yy-l/2*(oben?1:-1)+(oben?bw*0.16:-bw*0.16)); ctx.stroke(); };
      if(k<einzeln) pfeil(true);
      if(k<paare) pfeil(false); }
    /* zuletzt gesetztes Elektron hervorheben */
    if(e<el.z && o.k>0 && (i===voll-1)){ const bx=padL+Math.max(0,Math.min(anz-1,(o.k<=anz?o.k-1:o.k-anz-1)))*(bw+3);
      ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2.4; ctx.strokeRect(bx-1.5,y-bw/2-1.5,bw+3,bw+3); }
    /* Schalenname links an der ersten Stufe jeder Schale */
    if(i===0||L[i-1].n!==o.n){ ctx.font=fontStr(fs*0.8,false); ctx.textAlign='left'; ctx.fillStyle='#94a3b8';
      ctx.fillText(SCHALENNAME[o.n-1]||'', 3, y); }
  }
  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1.4; ctx.beginPath();
  ctx.moveTo(padL-3,unten-padB); ctx.lineTo(padL-3,padT+fs*0.4); ctx.stroke();
  ctx.font=fontStr(fs*0.82,false); ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#94a3b8';
  ctx.fillText('Energie ↑', 3, padT+fs*0.5);

  /* ---- Schalenbild (Bohr) ---- */
  if(D.hs && (w-diaW)>60 && (unten-padT)>60){
    const cx=diaW+(w-diaW)/2, cy=padT+(unten-padT)/2;
    const nmax=Math.max(1,S.reduce((m,v,i)=>v>0?i+1:m,1));
    const R=Math.max(14,Math.min((w-diaW)/2-8,(unten-padT)/2-8));
    ctx.save(); ctx.lineWidth=1.2;
    for(let n=1;n<=nmax;n++){ const r=R*n/nmax;
      ctx.strokeStyle='#cbd5e1'; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke();
      const anz=S[n-1]; if(!anz) continue;
      for(let k=0;k<anz;k++){ const a=-Math.PI/2+2*Math.PI*k/anz;
        ctx.fillStyle='#1d4ed8'; ctx.beginPath(); ctx.arc(cx+r*Math.cos(a), cy+r*Math.sin(a), Math.max(2.2,R*0.035), 0, 7); ctx.fill(); }
      ctx.font=fontStr(fs*0.78,true); ctx.fillStyle='#64748b'; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText((SCHALENNAME[n-1]||'')+' '+anz, cx, cy-r-2); }
    ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(cx,cy,Math.max(9,R*0.14),0,7); ctx.fill();
    ctx.font=fontStr(Math.max(9,R*0.13),true); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('+'+el.z, cx, cy+1);
    ctx.restore(); }

  /* ---- Text unten ---- */
  const per=el.y||1, sp=el.x||1;
  const gruppe=(sp<=2)?('Hauptgruppe '+sp):(sp>=13?('Hauptgruppe '+(sp-10)):('Nebengruppe '+sp));
  const aussen=S[per-1]||0;
  const zeilen=[
    el.name+' '+el.sym+' · Z = '+el.z+' · '+e+' von '+el.z+' Elektronen',
    konfText(L)||'noch kein Elektron',
    'Schalen: '+S.map((v,i)=>v?((SCHALENNAME[i]||'')+' '+v):null).filter(Boolean).join(' · ')||'–',
    'Periode '+per+' · '+gruppe+(e<el.z?(' · noch '+(el.z-e)+' Elektron'+(el.z-e===1?'':'en')+' fehlen')
        :((sp<=2||sp>=13)?(' · '+aussen+' Außenelektron'+(aussen===1?'':'en')):''))
  ];
  if(e===el.z){ const echt=konfMap(el.z);
    const gebaut={}; besetzung(el.z).forEach(o=>{ if(o.k) gebaut[o.nm]=o.k; });
    if(echt && !konfGleich(echt,gebaut)) zeilen.push('Tatsächlich: '+mapText(echt)+'  –  eine Ausnahme von der Reihenfolge'); }
  ctx.textAlign='left'; ctx.textBaseline='top';
  let y=unten+4;
  zeilen.forEach((t,i)=>{ ctx.font=fontStr(i===0?fs*1.08:fs*0.92,i===0);
    ctx.fillStyle=i===0?'#1f2430':(i===4?'#b45309':'#475569');
    ctx.fillText(t,8,y); y+=fs*1.22; });
}

/* ============ Kernpotentialtopf ============ */
const MAGIC=[2,8,20,28,50,82,126];
const KAP=[2,6,12,8,22,32,44];           /* Abstände der magischen Zahlen = Platz je Schale */
function zeichneTopf(){
  const cv=$('cvK'), ctx=cv.getContext('2d'), w=cv.clientWidth, h=cv.clientHeight;
  ctx.clearRect(0,0,w,h); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  const fs=Math.max(10,D.fontSize||13), z=D.kz, n=D.kn, el=elOf(z), e=nukOf(z,n);
  const textH=fs*5.6, unten=h-textH, padT=fs*3.2;        /* Platz für den Coulombwall über dem Rand */
  const tw=Math.max(80,Math.min((w-70)/2, 210)), gap=Math.min(40,Math.max(16,(w-2*tw)/3));
  const x0=(w-2*tw-gap)/2;

  const topf=(x,anz,art)=>{
    const col=art==='p'?'#ef4444':'#2563eb', hell=art==='p'?'#fee2e2':'#dbeafe';
    /* wie viele Schalen zeigen? alle besetzten und eine freie */
    let rest=anz, voll=0; const fuell=[];
    for(let i=0;i<KAP.length;i++){ const k=Math.max(0,Math.min(KAP[i],rest)); rest-=k; fuell.push(k); if(k>0) voll=i; }
    const zeigen=Math.min(KAP.length, voll+2);
    const randOben=padT, grund=unten-fs*1.6, hoeheT=grund-randOben;
    /* Der Protonentopf ist flacher: Die gleichnamigen Ladungen stoßen sich ab, der Boden
       liegt höher. Dadurch sitzen die Protonenstufen über den Neutronenstufen.          */
    const boden=grund-(art==='p'?hoeheT*0.16:0);
    /* Topfwände */
    ctx.save();
    ctx.fillStyle=hell; ctx.globalAlpha=.5; ctx.fillRect(x,randOben,tw,boden-randOben); ctx.globalAlpha=1;
    ctx.strokeStyle='#64748b'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(x-14,randOben); ctx.lineTo(x,randOben); ctx.lineTo(x,boden); ctx.lineTo(x+tw,boden);
    ctx.lineTo(x+tw,randOben); ctx.lineTo(x+tw+14,randOben); ctx.stroke();
    if(art==='p'){                                          /* Coulombwall außen am Rand */
      ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(x-14,randOben); ctx.quadraticCurveTo(x-6,randOben-fs*1.5,x,randOben-fs*1.5);
      ctx.moveTo(x+tw,randOben-fs*1.5); ctx.quadraticCurveTo(x+tw+6,randOben-fs*1.5,x+tw+14,randOben);
      ctx.stroke();
      ctx.font=fontStr(fs*0.72,false); ctx.fillStyle='#b45309'; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText('Coulombwall', x+tw/2, randOben-fs*1.7); }
    /* Stufen */
    const innen=boden-randOben, dy=innen/(zeigen+0.6);
    for(let i=0;i<zeigen;i++){ const y=boden-dy*(i+0.9), k=fuell[i]||0, cap=KAP[i];
      ctx.strokeStyle=(D.kmag&&k===cap)?'#16a34a':'#94a3b8'; ctx.lineWidth=(D.kmag&&k===cap)?2.4:1.3;
      ctx.beginPath(); ctx.moveTo(x+6,y); ctx.lineTo(x+tw-6,y); ctx.stroke();
      const r=Math.max(2.4,Math.min(dy*0.28,(tw-20)/cap/2.3,fs*0.95));
      for(let s=0;s<k;s++){ const px=x+10+ (s+0.5)*((tw-20)/cap);
        ctx.fillStyle=col; ctx.beginPath(); ctx.arc(px,y-r-1.5,r,0,7); ctx.fill(); }
      if(D.kmag){ const summe=MAGIC[i];
        ctx.font=fontStr(fs*0.7,k===cap); ctx.textAlign='right'; ctx.textBaseline='middle';
        ctx.fillStyle=(k===cap)?'#16a34a':'#cbd5e1'; ctx.fillText(String(summe), x+tw-5, y-dy*0.42); } }
    ctx.font=fontStr(fs*0.95,true); ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle=col;
    ctx.fillText((art==='p'?'Protonen ':'Neutronen ')+anz, x+tw/2, grund+4);
    ctx.restore(); };

  topf(x0,z,'p'); topf(x0+tw+gap,n,'n');

  /* ---- Text unten ---- */
  const A=z+n, sym=el.sym||'?';
  const kopf=hoch(A)+sym+'  '+(el.name||'')+' · Z = '+z+' · N = '+n+' · A = '+A;
  const zeilen=[kopf];
  if(!e) zeilen.push(z>94?'Zu diesem Kern liegen hier keine Daten (Tabelle bis Z = 94).':'Dieses Nuklid gibt es in der Tabelle nicht – ein solcher Kern hält nicht zusammen.');
  else if(e[2]===0){ zeilen.push('stabil'+(e[7]?(' · natürliche Häufigkeit '+String(e[7]).replace('.',',')+' %'):''));
    zeilen.push('Beide Töpfe sind etwa gleich hoch gefüllt – das ist der Grund für die Stabilität.'); }
  else { const art=e[3]||'';
    zeilen.push('Halbwertszeit '+hlText(e[2])+' · '+(ART[art]||art||'Umwandlung'));
    const erkl={'B-':'Ein Neutron wird zum Proton: der Neutronentopf ist zu voll.',
                'B+':'Ein Proton wird zum Neutron: der Protonentopf ist zu voll.',
                'A':'Zwei Protonen und zwei Neutronen verlassen den Kern als α-Teilchen.',
                'N':'Ein Neutron verlässt den Kern.','P':'Ein Proton verlässt den Kern.',
                'SF':'Der Kern zerfällt in zwei große Bruchstücke.'}[art];
    if(erkl) zeilen.push(erkl);
    const p=produkt(z,n,art);
    if(p) zeilen.push('Danach: '+hoch(p[0]+p[1])+(elOf(p[0]).sym||'?')+'  (Z = '+p[0]+', N = '+p[1]+')'); }
  const mz=MAGIC.includes(z), mn=MAGIC.includes(n);
  if(mz||mn) zeilen.push((mz&&mn?'Z und N sind magische Zahlen':mz?'Z ist eine magische Zahl':'N ist eine magische Zahl')+' – abgeschlossene Schale, besonders fest gebunden.');
  ctx.textAlign='left'; ctx.textBaseline='top';
  let y=unten+2;
  zeilen.forEach((t,i)=>{ ctx.font=fontStr(i===0?fs*1.08:fs*0.9,i===0);
    ctx.fillStyle=i===0?'#1f2430':(/magische/.test(t)?'#16a34a':'#475569');
    ctx.fillText(t,8,y); y+=fs*1.2; });
}

/* ============ Bedienung ============ */
function setzeHuelle(){ $('hSel').value=String(D.hz); $('eV').textContent=hElektronen();
  $('hSchale').classList.toggle('on',D.hs!==false); }
function setzeTopf(){ $('zV').textContent=D.kz; $('nV').textContent=D.kn;
  $('kMag').classList.toggle('on',D.kmag!==false);
  const e=nukOf(D.kz,D.kn), art=e&&e[2]!==0?(e[3]||''):'';
  const geht=!!(art&&produkt(D.kz,D.kn,art));
  $('kUm').disabled=!geht; $('kUm').style.opacity=geht?'1':'.45'; }
function neu(){ setzeHuelle(); setzeTopf(); resize(); sync(); }

(function(){ const s=$('hSel');
  EL.forEach(el=>{ const o=document.createElement('option'); o.value=String(el.z);
    o.textContent=el.z+'  '+el.sym+' – '+el.name; s.appendChild(o); }); })();
$('hSel').onchange=()=>{ D.hz=Math.max(1,Math.min(ZMAX,+$('hSel').value||1)); D.he=null; neu(); };
$('hM').onclick=()=>{ D.hz=Math.max(1,D.hz-1); D.he=null; neu(); };
$('hP').onclick=()=>{ D.hz=Math.min(ZMAX,D.hz+1); D.he=null; neu(); };
$('eM').onclick=()=>{ D.he=Math.max(0,hElektronen()-1); neu(); };
$('eP').onclick=()=>{ D.he=Math.min(D.hz,hElektronen()+1); neu(); };
$('eAll').onclick=()=>{ D.he=null; neu(); };
$('eNull').onclick=()=>{ D.he=0; neu(); };
$('hSchale').onclick=()=>{ D.hs=!D.hs; neu(); };

$('zM').onclick=()=>{ D.kz=Math.max(0,D.kz-1); neu(); };
$('zP').onclick=()=>{ D.kz=Math.min(118,D.kz+1); neu(); };
$('nM').onclick=()=>{ D.kn=Math.max(0,D.kn-1); neu(); };
$('nP').onclick=()=>{ D.kn=Math.min(180,D.kn+1); neu(); };
$('kMag').onclick=()=>{ D.kmag=!D.kmag; neu(); };
$('kUm').onclick=()=>{ const e=nukOf(D.kz,D.kn); if(!e||e[2]===0) return;
  const p=produkt(D.kz,D.kn,e[3]||''); if(!p) return;
  D.kz=Math.max(0,p[0]); D.kn=Math.max(0,p[1]); neu(); };

/* ============ Größe und Zeichnen ============ */
function resize(){ const dpr=window.devicePixelRatio||1;
  [['cvH',zeichneHuelle],['cvK',zeichneTopf]].forEach(([id,fn])=>{ const cv=$(id);
    const w=cv.clientWidth||320, h=cv.clientHeight||240;
    if(!w||!h) return;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0); fn(); }); }
addEventListener('resize',resize);

if(window.TafelShot) TafelShot.buttons($('shotBtns'),()=>{
  const v=document.querySelector('.view.on'); return TafelShot.rasterize(v,{exclude:'.bar',pad:6}); });

/* ============ Tafel-Anbindung ============ */
function sync(){ if(window.parent===window) return;
  try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
function uebernehmen(d){
  D=Object.assign(D,d);
  if(!(D.hz>=1)) D.hz=11; if(!(D.kz>=0)) D.kz=6; if(!(D.kn>=0)) D.kn=6;
  setTab(D.tab||'pse',true); setzeHuelle(); setzeTopf(); resize();
  if($('fPse').dataset.auf) fuettern('pse');
  if($('fNuk').dataset.auf) fuettern('nuklid'); }
addEventListener('message',e=>{
  const m=e.data; if(!m||typeof m!=='object') return;
  const wPse=$('fPse').contentWindow, wNuk=$('fNuk').contentWindow;
  if(m.type==='embed-ready'){ if(e.source===wPse) fuettern('pse'); else if(e.source===wNuk) fuettern('nuklid'); return; }
  if(m.type!=='embed-data'||!m.data) return;
  if(e.source===wPse){ D.pse=m.data; sync(); return; }     /* Stand der Unterwerkzeuge merken */
  if(e.source===wNuk){ D.nuklid=m.data; sync(); return; }
  if(window.parent!==window&&e.source===window.parent) uebernehmen(m.data);
});
window.addEventListener('load',()=>{ setzeHuelle(); setzeTopf(); setTab(D.tab||'pse',true); resize();
  if(window.ResizeObserver){ new ResizeObserver(resize).observe($('cvH')); new ResizeObserver(resize).observe($('cvK')); }
  try{ if(window.parent!==window) parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
</script>
