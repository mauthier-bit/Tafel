<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Würfel</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;}
  #wrap{height:100%;display:flex;flex-direction:column;padding:10px;gap:10px;}
  #ctrl{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;font-size:14px;}
  #ctrl>*{flex:0 0 auto;}
  #ctrl::-webkit-scrollbar{height:4px;} #ctrl::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  #ctrl label{display:flex;gap:5px;align-items:center;}
  select{font-size:15px;padding:4px 6px;border:1px solid #cfd6e0;border-radius:8px;font-family:inherit;}
  #dice{flex:1;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;min-height:0;}
  .die{background:#fff;border:2px solid #1f2430;border-radius:14%;box-shadow:0 2px 6px rgba(0,0,0,.12);display:grid;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7%;flex:none;cursor:pointer;transition:background .12s ease,border-color .12s ease,color .12s ease;}
  .die.num{display:flex;align-items:center;justify-content:center;font-weight:800;}
  .die>span{display:flex;align-items:center;justify-content:center;}
  .pip{width:82%;aspect-ratio:1;border-radius:50%;background:#1f2430;}
  #roll{font-size:19px;font-weight:800;padding:12px;border:none;border-radius:14px;background:#3b82f6;color:#fff;cursor:pointer;}
  #sum{text-align:center;font-size:16px;color:#334155;min-height:22px;font-weight:700;}
</style>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>
</head>
<body>
<div id="wrap">
  <div id="ctrl">
    <label>Anzahl <select id="n"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
    <label>Seiten <select id="sides"><option>2</option><option>4</option><option selected>6</option><option>8</option><option>10</option><option>12</option><option>20</option></select></label>
  </div>
  <div id="dice"></div>
  <div id="sum"></div>
  <button id="roll">🎲 Würfeln</button>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let data={ n:1, sides:6, colors:[0] };
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const COLORS=[{bg:'#ffffff',fg:'#1f2430'},{bg:'#fee2e2',fg:'#dc2626'},{bg:'#ffedd5',fg:'#ea580c'},{bg:'#fef9c3',fg:'#ca8a04'},{bg:'#dcfce7',fg:'#16a34a'},{bg:'#dbeafe',fg:'#2563eb'},{bg:'#ede9fe',fg:'#7c3aed'},{bg:'#fce7f3',fg:'#db2777'}];
function ensureColors(){ if(!Array.isArray(data.colors))data.colors=[]; for(let i=0;i<data.n;i++) if(data.colors[i]==null)data.colors[i]=0; data.colors.length=data.n; }
function applyDieColor(d,idx){ const c=COLORS[(data.colors[idx]||0)%COLORS.length]; d.style.background=c.bg; }   // nur die Würfelfläche färben; Punkte/Zahl bleiben schwarz
function dieEl(val,sides,size,idx){ const d=document.createElement('div');
  d.className='die'; d.style.width=size+'px'; d.style.height=size+'px';
  if(sides===6){ for(let i=0;i<9;i++){ const cell=document.createElement('span'); if(PIPS[val].includes(i)){ const p=document.createElement('span'); p.className='pip'; cell.appendChild(p);} d.appendChild(cell);} }
  else { d.classList.add('num'); d.style.fontSize=(size*0.5)+'px'; d.textContent=val; }
  applyDieColor(d,idx);
  d.onclick=()=>{ data.colors[idx]=((data.colors[idx]||0)+1)%COLORS.length; applyDieColor(d,idx); sync(); };   // Antippen = nächste Farbe
  return d; }
let lastVals=[1];
function render(vals){ lastVals=vals; ensureColors(); const box=$('dice'); box.innerHTML='';
  const n=vals.length, cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols), gap=14;
  const cw=box.clientWidth||280, ch=box.clientHeight||220;
  const size=Math.max(44, Math.floor(Math.min((cw-gap*(cols+1))/cols, (ch-gap*(rows+1))/rows)));
  vals.forEach((v,i)=>box.appendChild(dieEl(v,data.sides,size,i)));
  const sum=vals.reduce((a,b)=>a+b,0); $('sum').textContent = vals.length>1 ? ('Summe: '+sum) : ''; }
window.addEventListener('resize',()=>render(lastVals));
let rolling=false;
function roll(){ if(rolling)return; rolling=true; const n=data.n, sides=data.sides; let ticks=0;
  const iv=setInterval(()=>{ render(Array.from({length:n},()=>1+Math.floor(Math.random()*sides))); if(++ticks>=10){ clearInterval(iv); rolling=false; } },55); }
$('n').onchange=()=>{ data.n=+$('n').value; ensureColors(); render(Array.from({length:data.n},()=>1)); sync(); };
$('sides').onchange=()=>{ data.sides=+$('sides').value; render(Array.from({length:data.n},()=>1)); sync(); };
$('roll').onclick=roll;
function sync(){ if(window.parent===window) return; /* allein geöffnet: nicht an sich selbst senden */ try{ parent.postMessage({type:'embed-data',data},'*'); }catch(e){} }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return;   // eigene Nachrichten ignorieren
  if(e.data&&e.data.type==='embed-data'&&e.data.data){ const d=e.data.data;
  data={ n:Math.max(1,Math.min(6,d.n||1)), sides:Math.max(2,d.sides||6), colors:Array.isArray(d.colors)?d.colors.slice():[] };
  ensureColors(); $('n').value=data.n; $('sides').value=data.sides; render(Array.from({length:data.n},()=>1)); } });
window.addEventListener('load',()=>{ render([1]);
  if(window.ResizeObserver){ new ResizeObserver(()=>render(lastVals)).observe($('dice')); }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
</script>
</body>
</html>
