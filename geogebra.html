<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>GeoGebra</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;}
#bar{position:fixed;left:0;right:0;top:0;height:40px;z-index:20;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:#f1f3f7;border-bottom:1px solid #dfe4ec;
  font:600 13.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#20242c;
  -webkit-user-select:none;user-select:none;}
#bar button{font:inherit;color:inherit;background:#fff;border:1px solid #cfd6e0;border-radius:9px;
  padding:7px 11px;cursor:pointer;}
#bar button:active{background:#e9edf3;}
#dname{color:#5b6472;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#ggb{position:absolute;left:0;right:0;top:40px;bottom:0;}
#hint{position:absolute;left:0;right:0;top:40px;bottom:0;display:flex;align-items:center;justify-content:center;color:#8a93a2;font-family:-apple-system,sans-serif;font-size:14px;text-align:center;padding:20px;}
#ablage{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(37,99,235,.12);border:3px dashed #2563eb;color:#1d4ed8;
  font:700 17px -apple-system,sans-serif;pointer-events:none;}
#ablage.an{display:flex;}</style>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>
</head>
<body>
<div id="bar">
  <button id="dateiBtn" title="Eine GeoGebra-Datei (.ggb) vom Gerät öffnen">📂 ggb-Datei öffnen</button>
  <span id="dname"></span>
</div>
<div id="hint">GeoGebra wird geladen … (benötigt Internet)</div>
<div id="ggb"></div>
<input id="dateiEin" type="file" style="display:none">
<div id="ablage">GeoGebra-Datei hier loslassen</div>
<script>
"use strict";
/* GeoGebra als Werkzeug der Tafel.
   Neben der leeren App laesst sich eine .ggb-Datei vom Geraet oeffnen:
   ueber den Knopf unten links oder per Ablegen auf das Fenster. Die Datei
   wird als Base64 an den Applet uebergeben (ggbBase64) und - wenn das
   Werkzeug in der Tafel steckt - mit dem Projekt gespeichert, sodass die
   Konstruktion beim naechsten Oeffnen wieder da ist. */
var api=null, name='', app='graphing', stand='', tmr=null;
var imRahmen=(window.parent!==window);
var GRENZE=6000000;                      /* ~4,5 MB Datei: darueber nicht mitspeichern */
function dims(){ var b=document.getElementById('bar');
  var oben=b?b.getBoundingClientRect().height:40;
  return { w:Math.max(200,Math.floor(window.innerWidth)), h:Math.max(200,Math.floor(window.innerHeight-oben)) }; }
function hinweis(txt){ var h=document.getElementById('hint');
  if(!h) return; if(txt===false){ h.style.display='none'; } else { h.style.display='flex'; h.textContent=txt; } }
function starten(b64,welche){
  if(typeof GGBApplet==='undefined'){ hinweis('GeoGebra konnte nicht geladen werden (kein Internet?).'); return; }
  app=welche||app||'graphing';
  var d=dims();
  var o={ appName:app, width:d.w, height:d.h, showToolBar:true, showAlgebraInput:true, showMenuBar:false,
    showResetIcon:true, enableRightClick:true, borderColor:'#ffffff', scaleContainerClass:'',
    appletOnLoad:function(a){ api=a; hinweis(false);
      /* zu frueh angemeldete Listener verwirft GeoGebra - deshalb mehrfach versuchen */
      [400,1500,4000].forEach(function(ms){ setTimeout(horchen,ms); }); } };
  if(b64) o.ggbBase64=b64;
  var z=document.getElementById('ggb'); z.innerHTML='';
  new GGBApplet(o,true).inject('ggb');
}
function horchen(){
  if(!imRahmen) return;
  ['registerAddListener','registerRemoveListener','registerUpdateListener',
   'registerRenameListener','registerClearListener','registerStoreUndoListener']
    .forEach(function(m){ try{ api[m]('ggbGeaendert'); }catch(e){} }); }
window.ggbGeaendert=function(){ if(!imRahmen) return;
  clearTimeout(tmr); tmr=setTimeout(sichern,2000); };
/* Zusaetzlich nach jeder Eingabe: die Listener der GeoGebra-API sind je nach
   Fassung nicht zuverlaessig, Zeiger- und Tasteneingaben dagegen schon. */
['pointerup','touchend','keyup'].forEach(function(n){
  document.addEventListener(n,window.ggbGeaendert,true); });
function sichern(){
  if(!imRahmen||!api) return;
  try{ api.getBase64(function(s){
    if(!s) return;
    if(s.length>GRENZE) return;          /* zu gross: nur bis zum Neuladen */
    if(s===stand) return;                /* nichts Neues */
    stand=s; melden(); }); }catch(e){}
}
function melden(){ if(!imRahmen) return;
  try{ parent.postMessage({type:'embed-data',data:{ggb:stand,name:name,app:app}},'*'); }catch(e){} }
/* Datei einlesen und oeffnen */
function datei(f){
  if(!f) return;
  if(!/\.ggb$/i.test(f.name)){ hinweis('Bitte eine GeoGebra-Datei (.ggb) waehlen.');
    setTimeout(function(){ hinweis(false); },2200); return; }
  var r=new FileReader();
  r.onload=function(){
    var b64=String(r.result||''); var k=b64.indexOf(','); if(k>=0) b64=b64.slice(k+1);
    name=f.name.replace(/\.ggb$/i,''); stand=b64; document.getElementById('dname').textContent=name;
    hinweis('„'+name+'" wird geöffnet …');
    starten(b64,'classic');
    melden();
  };
  r.readAsDataURL(f);
}
document.getElementById('dateiBtn').addEventListener('click',function(){ document.getElementById('dateiEin').click(); });
document.getElementById('dateiEin').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=''; datei(f); });
/* Ablegen (Drag & Drop) */
['dragenter','dragover'].forEach(function(n){ window.addEventListener(n,function(e){
  if(!e.dataTransfer) return; e.preventDefault(); document.getElementById('ablage').classList.add('an'); }); });
['dragleave','drop'].forEach(function(n){ window.addEventListener(n,function(e){
  document.getElementById('ablage').classList.remove('an'); }); });
window.addEventListener('drop',function(e){
  if(!(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length)) return;
  e.preventDefault(); datei(e.dataTransfer.files[0]); });
/* In der Tafel: gespeicherten Stand holen */
window.addEventListener('message',function(e){
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return;
  var d=e.data.data;
  if(typeof d.ggb==='string'&&d.ggb&&d.ggb!==stand){
    stand=d.ggb; name=d.name||''; document.getElementById('dname').textContent=name;
    starten(d.ggb,d.app||'classic'); }
});
window.addEventListener('load',function(){
  starten('', 'graphing');
  if(imRahmen){ try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} } });
window.addEventListener('resize',function(){ if(api){ var d=dims(); try{ api.setSize(d.w,d.h); }catch(e){} } });
</script>
</body>
</html>
