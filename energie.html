<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script></head><body>

  <div id="bar"><div id="barL">
    <button class="tb tafelEdit" id="bTpl" title="Fertige Umwandlungskette laden"><svg viewBox="0 0 32 20"><rect x="7" y="3" width="18" height="14" rx="2"/><path d="M11 8h10M11 12h6"/></svg><span>Vorlagen</span></button>
    <button class="tb tafelEdit" id="bNeu" title="Alles löschen und neu anfangen"><svg viewBox="0 0 32 20"><path d="M11 2h8l4 4v12H11Z M19 2v4h4 M17 9v6M14 12h6"/></svg><span>Neu</span></button>
    </div><div id="barMid">

    <span class="sep"></span>
    <button class="tb" id="bPlay" title="Die Umwandlung ablaufen lassen"><svg viewBox="0 0 32 20"><path d="M12 4l12 6-12 6Z" fill="currentColor" stroke="none"/></svg><span>Ablauf</span></button>
    <button class="tb" id="bZur" title="Wieder an den Anfang stellen"><svg viewBox="0 0 32 20"><path d="M24 10a8 8 0 1 1-2.5-5.8M24 2v4h-4"/></svg><span>Anfang</span></button>

    <button class="tb" id="bGl" title="Die Gleichungen zur Umwandlung einblenden"><svg viewBox="0 0 32 20"><path d="M4 7h10M4 13h10M19 10h9M23.5 5.5 28 10l-4.5 4.5"/></svg><span>Gleichungen</span></button>
    </div><div id="barR"><span class="sep"></span>
    <button class="tb tafelEdit" id="bUndo" title="Rückgängig"><svg viewBox="0 0 32 20"><path d="M10 5 5 10l5 5M5 10H20a6 6 0 0 1 0 12"/></svg><span>Zurück</span></button>
    <button class="tb tafelEdit" id="bRedo" title="Wiederholen"><svg viewBox="0 0 32 20"><path d="M22 5l5 5-5 5M27 10H12a6 6 0 0 0 0 12"/></svg><span>Vor</span></button>
    <button class="tb" id="bHilfe" title="Kurze Anleitung"><svg viewBox="0 0 32 20"><circle cx="16" cy="10" r="8"/><path d="M13.6 7.6a2.5 2.5 0 1 1 3.3 2.6c-.6.3-.9.8-.9 1.4v.4"/><circle cx="16" cy="15" r=".9" fill="currentColor" stroke="none"/></svg><span>?</span></button>
  </div></div>
  <div id="bar3">
    <span class="lbl">Zeit</span>
    <input type="range" id="zeitR" min="0" max="1000" step="1" value="0" title="Die Energie durch die Kette schieben">
    <span class="val" id="zeitV" style="min-width:150px;font-weight:700">am Anfang</span>
  </div>
  <div id="bar2"></div>
  <div id="cvbox"><canvas id="cv"></canvas><div id="hint">Reservoir oder Wandler antippen = auswählen und einstellen</div></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d');
const toast=m=>window.TafelShot&&TafelShot.toast(m);
const G_ERD=9.81;

/* ---------- Zahlen in deutscher Schreibweise ---------- */
function zahl(v,n){ if(v===null||v===undefined||!isFinite(v)) return '–';
  const a=Math.abs(v);
  if(n===undefined) n = a>=1000?0 : a>=100?1 : a>=1?2 : a>=0.1?3 : 4;
  let s=v.toFixed(n);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s.replace('.',',');
}
/* Energie mit passender Einheit – unter 1 kJ in Joule, darüber kJ bzw. MJ */
function en(E){ const a=Math.abs(E);
  if(a>=1e9) return zahl(E/1e9)+' GJ';
  if(a>=1e6) return zahl(E/1e6)+' MJ';
  if(a>=1000) return zahl(E/1000)+' kJ';
  return zahl(E)+' J'; }

/* ---------- Energieformen ----------
   Jede Form kennt ihre Formel, ihre festen Parameter (Masse, Federhärte, Spannung …)
   und die charakteristische Größe, die den Füllstand bestimmt: Höhe, Geschwindigkeit,
   Temperaturanstieg … „aus" rechnet umgekehrt: Wie groß ist diese Größe bei der
   Energie, die gerade im Reservoir ist? Damit ändert sie sich beim Zeitregler mit. */
const C_LICHT=299792458;
const mjkg=v=>zahl(v/1e6)+' MJ/kg', kjkg=v=>zahl(v/1000)+' kJ/kg';
const FORMEN={
  hoehe:{name:'Höhenenergie',farbe:'#2563eb',formel:'E = m · g · h',
    par:[{k:'m',name:'Masse',e:'kg',def:2,min:0.001,max:1e6,s:0.5}],
    gr:{k:'h',name:'Höhe',e:'m',def:5,min:0,max:1e5,s:0.5},
    E:(p,g)=>p.m*G_ERD*g, aus:(p,E)=>E/(p.m*G_ERD),
    zahlen:(p,g)=>zahl(p.m)+' kg · '+zahl(G_ERD)+' m/s² · '+zahl(g)+' m',
    ansatz:p=>zahl(p.m)+' kg · '+zahl(G_ERD)+' m/s² · h',
    umF:'h = E / (m · g)', umZ:(p,E)=>en(E)+' / ('+zahl(p.m)+' kg · '+zahl(G_ERD)+' m/s²)'},
  kin:{name:'kinetische Energie',farbe:'#dc2626',formel:'E = ½ · m · v²',
    par:[{k:'m',name:'Masse',e:'kg',def:2,min:0.001,max:1e6,s:0.5}],
    gr:{k:'v',name:'Geschwindigkeit',e:'m/s',def:10,min:0,max:1e4,s:0.5},
    E:(p,g)=>0.5*p.m*g*g, aus:(p,E)=>Math.sqrt(Math.max(0,2*E/p.m)),
    zahlen:(p,g)=>'½ · '+zahl(p.m)+' kg · ('+zahl(g)+' m/s)²',
    ansatz:p=>'½ · '+zahl(p.m)+' kg · v²',
    umF:'v = √(2 · E / m)', umZ:(p,E)=>'√(2 · '+en(E)+' / '+zahl(p.m)+' kg)'},
  spann:{name:'Spannenergie',farbe:'#7c3aed',formel:'E = ½ · D · s²',
    par:[{k:'D',name:'Federhärte',e:'N/m',def:200,min:0.1,max:1e6,s:50}],
    gr:{k:'s',name:'Dehnung',e:'m',def:0.5,min:0,max:100,s:0.05},
    E:(p,g)=>0.5*p.D*g*g, aus:(p,E)=>Math.sqrt(Math.max(0,2*E/p.D)),
    zahlen:(p,g)=>'½ · '+zahl(p.D)+' N/m · ('+zahl(g)+' m)²',
    ansatz:p=>'½ · '+zahl(p.D)+' N/m · s²',
    umF:'s = √(2 · E / D)', umZ:(p,E)=>'√(2 · '+en(E)+' / '+zahl(p.D)+' N/m)'},
  therm:{name:'innere Energie (Temperatur)',farbe:'#ea580c',formel:'E = c · m · ΔT',
    par:[{k:'c',name:'spez. Wärmekapazität',e:'J/(kg·K)',def:4200,min:1,max:1e5,s:100},
         {k:'m',name:'Masse',e:'kg',def:1,min:0.001,max:1e6,s:0.5}],
    gr:{k:'ΔT',name:'Temperaturanstieg',e:'K',def:20,min:0,max:1e5,s:1},
    E:(p,g)=>p.c*p.m*g, aus:(p,E)=>E/(p.c*p.m),
    zahlen:(p,g)=>zahl(p.c)+' J/(kg·K) · '+zahl(p.m)+' kg · '+zahl(g)+' K',
    ansatz:p=>zahl(p.c)+' J/(kg·K) · '+zahl(p.m)+' kg · ΔT',
    umF:'ΔT = E / (c · m)', umZ:(p,E)=>en(E)+' / ('+zahl(p.c)+' J/(kg·K) · '+zahl(p.m)+' kg)'},
  aggregat:{name:'innere Energie (Aggregatzustand)',farbe:'#0d9488',formel:'E = q · m',
    par:[{k:'q',name:'Umwandlungswärme',e:'J/kg',def:334000,min:1000,max:1e7,s:10000,zeig:kjkg,se:'kJ/kg'}],
    gr:{k:'m',name:'umgewandelte Masse',e:'kg',def:0.1,min:0,max:1e4,s:0.05},
    E:(p,g)=>p.q*g, aus:(p,E)=>E/p.q,
    zahlen:(p,g)=>kjkg(p.q)+' · '+zahl(g)+' kg',
    ansatz:p=>kjkg(p.q)+' · m',
    umF:'m = E / q', umZ:(p,E)=>en(E)+' / '+kjkg(p.q)},
  chem:{name:'innere Energie (chemisch)',farbe:'#16a34a',formel:'E = H · m',
    par:[{k:'H',name:'Heizwert',e:'J/kg',def:4.2e7,min:1e5,max:2e8,s:1e6,zeig:mjkg,se:'MJ/kg'}],
    gr:{k:'m',name:'Masse',e:'kg',def:0.001,min:0,max:1e4,s:0.001},
    E:(p,g)=>p.H*g, aus:(p,E)=>E/p.H,
    zahlen:(p,g)=>mjkg(p.H)+' · '+zahl(g,4)+' kg',
    ansatz:p=>mjkg(p.H)+' · m',

/* ---------- Die Kette rechnen ----------
   Erst die Energie aller Startreservoire addieren, dann Schritt für Schritt umwandeln.
   Ohne Verluste geht alles weiter, mit Verlusten bleibt (1 − η) als entwertete Energie liegen. */
function kette(){
  const K=[];
  const res=D.start.map(r=>{ const F=FORMEN[r.f]; return {r,E:Math.max(0,F.E(r.p,r.g)||0)}; });
  K.push({art:'start',res,E:res.reduce((a,x)=>a+x.E,0)});
  let E=K[0].E;
  D.schritte.forEach(s=>{
    const eta=D.verluste?Math.max(0,Math.min(100,+s.eta||0))/100:1;
    const Ez=E*eta;
    /* Füllt ein Wandler mehrere Reservoire, bekommen alle bis auf das letzte so viel,
       wie ihre eingestellte Größe verlangt (etwa die Resthöhe h). Das letzte bekommt
       den Rest – so ergibt sich die Bewegungsenergie aus dem, was von der Höhenenergie
       übrig geblieben ist. */
    const zr=[]; let rest=Ez;
    s.z.forEach((r,j)=>{ const F=FORMEN[r.f];
      const Ej=(j<s.z.length-1)?Math.max(0,Math.min(rest,F.E(r.p,r.g)||0)):Math.max(0,rest);
      rest-=Ej; zr.push({r,E:Ej}); });
    K.push({art:'schritt',s,eta,Ein:E,E:Ez,Ev:E-Ez,res:zr});
    E=Ez;
  });
  return K;
}
/* Füllstände zum Zeitpunkt t (0 … Zahl der Umwandlungen).
   Während Schritt i läuft, leert sich das Reservoir davor und das dahinter füllt sich. */
function stand(K,t){
  const n=K.length-1, x=i=>Math.max(0,Math.min(1,t-(i-1)));   /* Fortschritt von Schritt i */
  const voll=[], verl=[];
  for(let i=0;i<=n;i++){
    const ab=(i<n)?x(i+1):0;                                   /* was schon weitergeflossen ist */
    const an=(i>0)?x(i):1;                                     /* was schon angekommen ist */
    voll[i]=K[i].E*an*(1-ab);
    if(i>0) verl[i]=K[i].Ev*an;
  }
  return {voll,verl,x};
}

/* ---------- Zeichnen ----------
   Alles steht in Modellmaßen und wird am Schluss so skaliert, dass die ganze Kette
   ins Bild passt. Breite Ketten werden dadurch kleiner – dafür ist nichts abgeschnitten. */
const TW=150, TH=240, GW=190;
let W=0,H=0,DPR=1,SC=1,OX=0,OY=0,TREFFER=[];
function resize(){ DPR=Math.min(3,window.devicePixelRatio||1);
  W=cv.clientWidth||320; H=cv.clientHeight||240;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); zeichne(); }
function rr(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function txt(s,x,y,o){ o=o||{}; ctx.font=(o.fett?'700 ':'')+(o.sz||13)+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif';
  ctx.textAlign=o.al||'center'; ctx.textBaseline=o.bl||'middle';
  if(o.rand){ ctx.lineWidth=o.randB||3; ctx.strokeStyle=o.rand; ctx.lineJoin='round'; ctx.strokeText(s,x,y); }
  ctx.fillStyle=o.farbe||'#1f2430'; ctx.fillText(s,x,y); }
/* Text, der in eine Breite passen muss – sonst wird er schmaler gesetzt */
function txtPass(s,x,y,maxB,o){ o=o||{}; let sz=o.sz||13;
  ctx.font=(o.fett?'700 ':'')+sz+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif';
  while(sz>7&&ctx.measureText(s).width>maxB){ sz-=0.5; ctx.font=(o.fett?'700 ':'')+sz+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif'; }
  txt(s,x,y,Object.assign({},o,{sz})); }

function kFaktor(){ return Math.min(1.9,(D.fontSize||14)/14); }
function layout(){
  const K=kette(), n=K.length-1, kk=kFaktor();
  let zmax=0;
  if(D.gl){ const S0=stand(K,D.t);
    for(let i=0;i<=n;i++) zmax=Math.max(zmax,glZeilen(K,S0,i).length); }
  const glH=D.gl?Math.round((zmax*17+10)*kk):0;
  const vH=D.verluste?110:0;
  const TOP=22*kk;                     /* Platz für den Namen über dem Reservoir */
  const Wm=(n+1)*TW+n*GW, Hm=TOP+TH+56*kk+vH+glH+10;
  return {K,n,kk,glH,vH,Wm,Hm,TOP};
}
function zeichne(){
  const L=layout(), K=L.K, n=L.n, kk=L.kk;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  SC=Math.max(0.22,Math.min(2.2,Math.min((W-36)/L.Wm,(H-26)/L.Hm)));
  OX=(W-L.Wm*SC)/2; OY=(H-L.Hm*SC)/2;
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*(OY+L.TOP*SC));
  OY+=L.TOP*SC;
  TREFFER=[];
  const S=stand(K,D.t), Emax=Math.max(1e-9,K[0].E);
  const X=i=>i*(TW+GW), ym=TH/2;
  /* --- Pfeile und Wandler zuerst, damit die Reservoire darüber liegen --- */
  for(let i=1;i<=n;i++){
    const x0=X(i-1)+TW, x1=X(i), xm=(x0+x1)/2, akt=S.x(i)>0.001&&S.x(i)<0.999;
    const farbe=K[i-1].art==='start'?farbeVon(K[i-1]):FORMEN[K[i-1].s.f].farbe;
    ctx.strokeStyle='#64748b'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x0+6,ym); ctx.lineTo(x1-16,ym); ctx.stroke();
    ctx.fillStyle='#64748b'; ctx.beginPath(); ctx.moveTo(x1-4,ym); ctx.lineTo(x1-18,ym-8); ctx.lineTo(x1-18,ym+8); ctx.closePath(); ctx.fill();
    /* fließende Energie */
    if(akt){ const ph=(performance.now()/650)%1;
      for(let d=0;d<5;d++){ const u=((ph+d/5)%1), px=x0+10+(x1-26-x0)*u;
        ctx.fillStyle=farbe; ctx.globalAlpha=0.35+0.65*Math.sin(Math.PI*u);
        ctx.beginPath(); ctx.arc(px,ym,5.5,0,7); ctx.fill(); }
      ctx.globalAlpha=1; }
    /* Wandlerkasten */
    const w=wdl(K[i].s.w), bw=GW-26, bh=D.verluste?50:36, bx=xm-bw/2, by=ym-bh-16;
    ctx.fillStyle='#fff'; ctx.strokeStyle=(sel&&sel.art==='schritt'&&sel.i===i)?'#2563eb':'#94a3b8';
    ctx.lineWidth=(sel&&sel.art==='schritt'&&sel.i===i)?3.5:2; rr(bx,by,bw,bh,10); ctx.fill(); ctx.stroke();
    txtPass(w.name,xm,by+(D.verluste?16:18),bw-12,{sz:14*kk,fett:true});
    if(D.verluste) txtPass('η = '+zahl(K[i].eta*100,0)+' %',xm,by+36,bw-12,{sz:13*kk,farbe:'#475569'});
    merke({art:'schritt',i},bx,by,bw,bh);
    /* entwertete Energie */
    if(D.verluste){
      const vy=TH+56*kk+6, vw=96, vh=70, vx=xm-vw/2;
      ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2.5; ctx.setLineDash([7,6]);
      ctx.beginPath(); ctx.moveTo(xm,ym+10); ctx.lineTo(xm,vy-14); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#94a3b8'; ctx.beginPath(); ctx.moveTo(xm,vy-2); ctx.lineTo(xm-7,vy-14); ctx.lineTo(xm+7,vy-14); ctx.closePath(); ctx.fill();
      malTank(vx,vy,vw,vh,ENTW.farbe,S.verl[i]||0,Emax,false);
      txtPass(en(S.verl[i]||0),vx+vw/2,vy+vh/2,vw-10,{sz:13*kk,fett:true,rand:'#fff'});
      txtPass('entwertet',vx+vw/2,vy+vh+11*kk,vw+40,{sz:12*kk,farbe:'#64748b'});
    }
  }
  /* --- Reservoire: jede Spalte kann mehrere übereinander haben --- */
  for(let i=0;i<=n;i++){
    const x=X(i), m=K[i].res.length, hh=Math.max(64,(TH-(m-1)*14)/m);
    K[i].res.forEach((rj,j)=>{ const y=j*(hh+14), F=FORMEN[rj.r.f];
      const E=K[i].E>0?S.voll[i]*(rj.E/K[i].E):0;
      malReservoir(x,y,TW,hh,F,rj.r,E,Emax,{art:i?'ziel':'res',i,j},i,kk,m>1&&j<m-1,m>1);
    });
  }
  /* --- Gleichungen --- */
  if(D.gl) malGleichungen(K,S,kk,L);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function farbeVon(k){ return k.res&&k.res.length?FORMEN[k.res[0].r.f].farbe:'#64748b'; }
function merke(o,x,y,w,h){ TREFFER.push(Object.assign({},o,{x:x*SC+OX,y:y*SC+OY,w:w*SC,h:h*SC})); }
function malTank(x,y,w,h,farbe,E,Emax,dick){
  ctx.save(); rr(x,y,w,h,12); ctx.fillStyle='#f8fafc'; ctx.fill();
  ctx.save(); ctx.clip();
  const f=Math.max(0,Math.min(1,E/Emax)), fh=h*f;
  if(fh>0){ ctx.fillStyle=farbe; ctx.globalAlpha=.78; ctx.fillRect(x,y+h-fh,w,fh); ctx.globalAlpha=1;
    ctx.strokeStyle=farbe; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,y+h-fh); ctx.lineTo(x+w,y+h-fh); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle=dick?'#2563eb':'#94a3b8'; ctx.lineWidth=dick?4:2.2; rr(x,y,w,h,12); ctx.stroke();
  ctx.restore();
}
function malReservoir(x,y,w,h,F,r,E,Emax,id,i,kk,plus,kompakt){
  const aus=!!(sel&&sel.art===id.art&&sel.j===id.j&&(id.art==='res'||sel.i===id.i));
  malTank(x,y,w,h,F.farbe,E,Emax,aus);
  merke(id,x,y,w,h);
  /* Die charakteristische Größe folgt dem Füllstand: Beim Fallen sinkt h und v wächst.
     Steht die Zeit am Anfang, ist sie genau der eingestellte Wert. */
  const g=F.aus(r.p,E);
  const ps=F.par.map(q=>q.k+' = '+parText(q,r.p[q.k])).join('   ');
  if(kompakt){          /* mehrere Reservoire übereinander: alles in den Behälter */
    txtPass(F.name,x+w/2,y+12*kk,w-10,{sz:13*kk,fett:true,farbe:F.farbe,rand:'#fff',randB:3});
    txtPass(en(E),x+w/2,y+h/2,w-12,{sz:16*kk,fett:true,rand:'#fff',randB:4});
    txtPass(F.gr.k+' = '+zahl(g)+' '+F.gr.e+(ps?'   '+ps:''),x+w/2,y+h-11*kk,w-8,{sz:12*kk,rand:'#fff',randB:3});
  } else {
    txtPass(F.name,x+w/2,y-13*kk,w+GW*0.5,{sz:15*kk,fett:true,farbe:F.farbe});
    txtPass(en(E),x+w/2,y+h/2,w-12,{sz:17*kk,fett:true,rand:'#fff',randB:4});
    txtPass(F.gr.k+' = '+zahl(g)+' '+F.gr.e,x+w/2,TH+16*kk,w+GW*0.45,{sz:15*kk,fett:true});
    if(ps) txtPass(ps,x+w/2,TH+36*kk,w+GW*0.45,{sz:13*kk,farbe:'#64748b'});
  }
  if(plus) txt('+',x+w/2,y+h+7,{sz:20*kk,fett:true,farbe:'#64748b'});
}
const parText=(q,v)=>q.zeig?q.zeig(v):zahl(v)+' '+q.e;
/* Die Gleichungen einer Spalte – mit den Werten des aktuellen Standes */
function glZeilen(K,S,i){
  const zeilen=[], m=K[i].res.length;
  const Ea=j=>K[i].E>0?S.voll[i]*(K[i].res[j].E/K[i].E):0;     /* was gerade drin ist */
  if(i===0){
    K[0].res.forEach((r0,j)=>{ const F=FORMEN[r0.r.f], Ej=Ea(j);
      zeilen.push(F.formel);
      if(D.gl>1) zeilen.push('E'+(m>1?nidx(j):'')+' = '+F.zahlen(r0.r.p,F.aus(r0.r.p,Ej))+' = '+en(Ej)); });
    if(m>1){ zeilen.push('E_ges = E₁ + E₂'+(m>2?' + …':''));
      if(D.gl>1) zeilen.push('E_ges = '+en(S.voll[i])); }
    return zeilen;
  }
  /* Die Umwandlungsgleichung beschreibt den ganzen Schritt – sie steht unabhängig davon,
     wie weit der Zeitregler gerade ist. Die Zeilen der einzelnen Reservoire darunter
     laufen dagegen mit dem Füllstand mit. */
  const q=K[i-1];
  /* Kommt dieselbe Energieform auf beiden Seiten vor (Höhe vorher und Resthöhe nachher),
     bekommt ihre charakteristische Größe eine Nummer – sonst stünde zweimal dasselbe h. */
  const fQ=q.res.map(r=>r.r.f), fZ=K[i].res.map(r=>r.r.f);
  const doppelt=f=>fQ.includes(f)&&fZ.includes(f);
  const nummer=(s,sym,n)=>s.split(' · ').map(x=>x===sym?sym+n:(x===sym+'²'?sym+n+'²':x)).join(' · ');
  const rhsS=r=>{ const F=FORMEN[r.r.f], s=F.formel.replace('E = ',''); return doppelt(r.r.f)?nummer(s,F.gr.k,'₁'):s; };
  const lhsS=r=>{ const F=FORMEN[r.r.f], s=F.formel.replace('E = ',''); return doppelt(r.r.f)?nummer(s,F.gr.k,'₂'):s; };
  const rhsF=q.res.map(rhsS).join(' + '), lhsF=K[i].res.map(lhsS).join(' + ');
  const kl=s=>q.res.length>1?'('+s+')':s;
  if(D.verluste){ zeilen.push('E_zu = η · E_ab');
    if(D.gl>1) zeilen.push('E_zu = '+zahl(K[i].eta,2)+' · '+en(K[i].Ein)+' = '+en(K[i].E)); }
  else { zeilen.push('E_zu = E_ab   (Energieerhaltung)');
    if(D.gl>1) zeilen.push('E_zu = '+en(K[i].E)); }
  /* Dieselbe Gleichung mit den Formeln der beiden Energieformen – der Ansatz, den man
     an der Tafel hinschreibt, erst mit Variablen, dann mit den bekannten Werten. */
  zeilen.push(lhsF+' = '+(D.verluste?'η · ':'')+kl(rhsF));
  if(D.gl>1){
    const mz=K[i].res.length;
    const lhsZ=K[i].res.map((r,j)=>{ const F=FORMEN[r.r.f];
      if(j<mz-1) return F.zahlen(r.r.p,F.aus(r.r.p,r.E));
      const a=F.ansatz(r.r.p); return doppelt(r.r.f)?nummer(a,F.gr.k,'₂'):a; }).join(' + ');
    const rhsZ=q.res.map(r=>{ const F=FORMEN[r.r.f]; return F.zahlen(r.r.p,F.aus(r.r.p,r.E)); }).join(' + ');
    zeilen.push(lhsZ+' = '+(D.verluste?zahl(K[i].eta,2)+' · ':'')+kl(rhsZ));
  }
  K[i].res.forEach((rj,j)=>{ const F=FORMEN[rj.r.f], Ej=Ea(j), letzt=(j===m-1);
    if(m>1&&!letzt){                       /* fest eingestellt: die Energie folgt aus der Größe */
      zeilen.push('E'+nidx(j)+' = '+F.formel.replace('E = ',''));
      if(D.gl>1) zeilen.push('E'+nidx(j)+' = '+F.zahlen(rj.r.p,F.aus(rj.r.p,Ej))+' = '+en(Ej));
    } else if(m>1){                        /* das letzte bekommt den Rest */
      zeilen.push('E'+nidx(j)+' = E_zu − '+K[i].res.slice(0,m-1).map((_,k)=>'E'+nidx(k)).join(' − '));
      if(D.gl>1) zeilen.push('E'+nidx(j)+' = '+en(Ej));
    }
    /* Beim fest eingestellten Reservoir ist die Größe ja die Vorgabe – die Umkehrung
       lohnt sich nur dort, wo die Energie die Größe bestimmt. */
    if(m===1||letzt){ zeilen.push(F.umF);
      if(D.gl>1) zeilen.push(F.gr.k+' = '+F.umZ(rj.r.p,Ej)+' = '+zahl(F.aus(rj.r.p,Ej))+' '+F.gr.e); }
  });
  return zeilen;
}
const nidx=j=>'₁₂₃₄₅'[j]||String(j+1);
function malGleichungen(K,S,kk,L){
  const n=L.n, y0=TH+56*kk+L.vH+4, zh=17*kk;
  for(let i=0;i<=n;i++){
    const xm=i*(TW+GW)+TW/2, bw=TW+GW-16;
    const zeilen=glZeilen(K,S,i);
    /* Der Block bleibt im Bild – sonst läuft die erste Zeile links hinaus.
       Gerechnet wird in Bildschirmpunkten, weil die Zeichnung skaliert ist. */
    const halb=bw/2+4/SC, links=(0-OX)/SC+halb, rechts=(W-OX)/SC-halb;
    const xk=(links<rechts)?Math.max(links,Math.min(xm,rechts)):xm;
    zeilen.forEach((z,j)=>txtPass(z,xk,y0+zh*(j+0.6),bw,{sz:13*kk,farbe:(j%2&&D.gl>1)?'#1f2430':'#475569',fett:!(j%2)&&D.gl>1}));
  }
}
