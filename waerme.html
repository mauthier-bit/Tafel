<!DOCTYPE html><html lang="de"><head>

<style>

  *{box-sizing:border-box;} [hidden]{display:none!important;}

  #bar.compact #barL .tb,#bar.compact #barR .tb{min-width:42px;padding:0 3px;}
  #barMid::-webkit-scrollbar{height:5px;} #barMid::-webkit-scrollbar-thumb{background:#c8d0dc;border-radius:3px;}
  .tb{flex:none;min-width:52px;height:50px;border:1px solid #d6dce5;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 5px;color:#1f2430;font:inherit;}
  .tb svg{width:32px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  #seg button+button{border-left:1px solid #d6dce5;}
  #seg button.on{background:#2563eb;color:#fff;}
  #bar2{display:flex;gap:6px;padding:5px 8px;border-top:1px solid #e2e7ef;border-bottom:1px solid #e2e7ef;align-items:center;flex-wrap:nowrap;flex:none;min-height:44px;font-size:.92em;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  #bar2>*{flex:0 0 auto;}
  #bar2::-webkit-scrollbar{height:4px;} #bar2::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  .lbl{color:#64748b;font-weight:600;}
  .grow{flex:1 1 auto!important;min-width:4px;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:5px 10px;font:inherit;font-weight:600;color:#1f2430;cursor:pointer;white-space:nowrap;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  select.sel{border:1px solid #cfd6e0;border-radius:9px;padding:5px 8px;font:inherit;font-weight:600;background:#fff;color:#1f2430;max-width:190px;}
  .stp{display:inline-flex;align-items:center;gap:4px;}
  .stp button{border:1px solid #cfd6e0;background:#fff;border-radius:8px;width:32px;height:32px;font:inherit;font-weight:700;cursor:pointer;color:#1f2430;}
  .stp .val{min-width:92px;text-align:center;font-weight:700;}
  .val{min-width:104px;text-align:center;font-weight:700;}
  input.rng{width:140px;height:34px;accent-color:#2563eb;}
  input.rng:disabled{opacity:.4;}
  #cvbox{position:relative;flex:1;min-height:0;background:#fff;}
  #cvbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  #hint{position:absolute;left:10px;bottom:6px;font-size:.78em;color:#94a3b8;pointer-events:none;}
</style>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script></head><body>
<div id="wrap">
  <div id="bar"><div id="barL">
    <span id="seg">
      <button id="t-kurve" class="on" title="Erwärmen und Abkühlen: die Erwärmungskurve mit ihren Haltepunkten">Erwärmen</button>
      <button id="t-mischen" title="Mischungstemperatur zweier Behälter">Mischen</button>
    </span>
    </div><div id="barMid">
    <button class="tb" id="bPlay" title="Den Versuch ablaufen lassen"><svg viewBox="0 0 32 20"><path d="M12 4l12 6-12 6Z" fill="currentColor" stroke="none"/></svg><span>Start</span></button>
    <button class="tb" id="bZur" title="Wieder an den Anfang"><svg viewBox="0 0 32 20"><path d="M24 10a8 8 0 1 1-2.5-5.8M24 2v4h-4"/></svg><span>Anfang</span></button>
    <span class="sep"></span>

    <button class="tb" id="bEn" title="Den Balken für die innere Energie einblenden"><svg viewBox="0 0 32 20"><rect x="13" y="2.5" width="6" height="15" rx="1.6"/><path d="M13 9.5h6v6.4a1.6 1.6 0 0 1-1.6 1.6h-2.8a1.6 1.6 0 0 1-1.6-1.6Z" fill="currentColor" stroke="none"/></svg><span>Energie</span></button>
    <button class="tb" id="bStp" title="Einen Stempel zum Hineindrücken (Arbeit verrichten)"><svg viewBox="0 0 32 20"><path d="M16 2v5"/><rect x="9" y="7" width="14" height="3" rx="1" fill="currentColor" stroke="none"/><path d="M9 10v8h14v-8"/></svg><span>Stempel</span></button>
    <button class="tb" id="bMess" title="Thermometer und Druckmessgerät einblenden"><svg viewBox="0 0 32 20"><circle cx="11" cy="10" r="7"/><path d="M11 10l3.5-3M22 4.5v8M22 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg><span>Messgeräte</span></button>
    <button class="tb" id="bGl" title="Die Gleichungen einblenden"><svg viewBox="0 0 32 20"><path d="M4 7h10M4 13h10M19 10h9M23.5 5.5 28 10l-4.5 4.5"/></svg><span>Gleichungen</span></button>
    </div><div id="barR"><span class="sep"></span>
    <button class="tb tafelEdit" id="bTpl" title="Fertigen Versuch laden"><svg viewBox="0 0 32 20"><rect x="7" y="3" width="18" height="14" rx="2"/><path d="M11 8h10M11 12h6"/></svg><span>Vorlagen</span></button>
    <button class="tb" id="bHilfe" title="Kurze Anleitung"><svg viewBox="0 0 32 20"><circle cx="16" cy="10" r="8"/><path d="M13.6 7.6a2.5 2.5 0 1 1 3.3 2.6c-.6.3-.9.8-.9 1.4v.4"/><circle cx="16" cy="15" r=".9" fill="currentColor" stroke="none"/></svg><span>?</span></button>
  </div></div>
  <div id="bar2"></div>
  <div id="cvbox"><canvas id="cv"></canvas><div id="hint"></div></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d');
const toast=m=>window.TafelShot&&TafelShot.toast(m);

function zahl(v,n){ if(v===null||v===undefined||!isFinite(v)) return '–';
  const a=Math.abs(v);
  if(n===undefined) n = a>=1000?0 : a>=100?1 : a>=1?1 : a>=0.1?2 : 3;
  let s=v.toFixed(n); if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s.replace('.',','); }
function en(E){ const a=Math.abs(E);
  if(a>=1e6) return zahl(E/1e6)+' MJ';
  if(a>=1000) return zahl(E/1000)+' kJ';
  return zahl(E,0)+' J'; }
const zeitText=s=>s>=600?zahl(s/60,1)+' min':zahl(s,0)+' s';
/* Die Heizleistung trägt ihr Vorzeichen: positiv heizen, negativ kühlen, 0 nichts.
   Der Regler ist zugleich Start und Stopp - einen eigenen Knopf braucht der Versuch
   nicht, es ändert sich alles durch Heizen, Kühlen und den Stempel. */
const Pw=()=>+D.P||0;
const laeuft=()=>D.tab==='kurve'&&Pw()!==0&&platzDa();
/* Ist im Diagramm noch Platz in der Richtung, in die geheizt oder gekühlt wird? */
function platzDa(){ const Kz=kurve();
  return Pw()>0?(D.E<Kz.EGes-1e-6):(Pw()<0?(D.E>1e-6):false); }
/* Zeitraffer: 1,6 MJ Wasser bei 500 W dauern echte 52 min. Der Faktor ist eine runde
   Zehnerpotenz, damit mehr Leistung auch sichtbar schneller geht und der Versuch
   trotzdem immer zwischen etwa fünf und fünfzig Sekunden dauert. */
function raffer(Kv){ if(!(Kv.tGes>0)) return 1;
  return Math.max(1,Math.min(1e6,Math.pow(10,Math.round(Math.log10(Math.max(1e-9,Kv.tGes/16)))))); }
const PMAX=50000, RAST=6;        /* RAST = halbe Breite der Raststelle bei 0 W */
function rundNett(x){ if(x<1) return 1; const p=Math.pow(10,Math.floor(Math.log10(x))), r=x/p;
  return Math.round((r<1.5?1:r<2.5?2:r<3.5?3:r<7.5?5:10)*p); }
/* Zwischen 1 W und 50 kW liegen fast fünf Zehnerpotenzen - deshalb steht der Regler
   logarithmisch, sonst wäre unten nichts einzustellen. In der Mitte rastet er bei 0 W ein. */
const pVonS=v=>{ if(Math.abs(v)<=RAST) return 0;
  const a=(Math.abs(v)-RAST)/(100-RAST); return (v<0?-1:1)*rundNett(Math.pow(PMAX,a)); };
const sVonP=P=>{ const a=Math.abs(P); if(a<1) return 0;
  const v=Math.max(RAST+1,Math.round(RAST+Math.log(a)/Math.log(PMAX)*(100-RAST)));
  return (P<0?-v:v); };

/* ---------- Stoffe ----------
   c = spezifische Wärmekapazität (fest / flüssig / gasförmig), q = Schmelz- bzw.
   Verdampfungswärme. Werte gerundet, wie sie in der Formelsammlung stehen. */
/* Rs = spezifische Gaskonstante (8314 J/(kmol·K) durch die molare Masse). Sie wird nur
   fuer den Druck im Gas und fuer die Arbeit am Stempel gebraucht, also qualitativ. */
const STOFFE={
  wasser:  {name:'Wasser',     cf:2100, cl:4200, cg:2000, Ts:0,    qs:334000, Tv:100,  qv:2256000, Rs:461, farbe:'#2563eb', festName:'Eis', gasName:'Wasserdampf'},
  luft:    {name:'Luft',       cf:1000, cl:1900, cg:1005, Ts:-213, qs:25000,  Tv:-194, qv:199000,  Rs:287, farbe:'#0ea5e9', festName:'feste Luft', gasName:'Luft'},
  /* Kohlenstoffdioxid wird bei Normaldruck gar nicht flüssig: Trockeneis geht bei
     −78,5 °C unmittelbar in Gas über (subl). Dafür gibt es einen eigenen Abschnitt. */
  co2:     {name:'Kohlenstoffdioxid', cf:1200, cl:1200, cg:846, Ts:-78.5, qs:571000, Tv:-78.5, qv:0, Rs:189,
            subl:true, farbe:'#0d9488', festName:'Trockeneis', gasName:'Kohlenstoffdioxid'},
  helium:  {name:'Helium',     cf:2500, cl:4480, cg:5193, Ts:-272.2, qs:5000, Tv:-268.9, qv:20900, Rs:2077,
            farbe:'#a78bfa', festName:'festes Helium', gasName:'Helium'},
  quecksilber:{name:'Quecksilber', cf:142, cl:140, cg:104, Ts:-38.8, qs:11400, Tv:356.7, qv:295000, Rs:41,
            farbe:'#78716c', festName:'festes Quecksilber', gasName:'Quecksilberdampf'},
  schwefel:{name:'Schwefel',   cf:710,  cl:1000, cg:700,  Ts:115,  qs:53400,  Tv:445,  qv:1400000, Rs:260, farbe:'#ca8a04', festName:'fester Schwefel'},
  brom:    {name:'Brom',       cf:400,  cl:473,  cg:225,  Ts:-7.2, qs:66000,  Tv:58.8, qv:188000,  Rs:52,  farbe:'#b91c1c', festName:'festes Brom'},
  ethanol: {name:'Ethanol',    cf:2300, cl:2430, cg:1420, Ts:-114, qs:108000, Tv:78,   qv:841000,  Rs:181, farbe:'#7c3aed'},
  eisen:   {name:'Eisen',      cf:460,  cl:820,  cg:460,  Ts:1538, qs:247000, Tv:2861, qv:6090000, Rs:149, farbe:'#64748b'},
  alu:     {name:'Aluminium',  cf:896,  cl:1180, cg:900,  Ts:660,  qs:397000, Tv:2470, qv:10500000,Rs:308, farbe:'#94a3b8'},
  kupfer:  {name:'Kupfer',     cf:382,  cl:490,  cg:382,  Ts:1085, qs:205000, Tv:2562, qv:4730000, Rs:131, farbe:'#b45309'},
  blei:    {name:'Blei',       cf:129,  cl:147,  cg:129,  Ts:327,  qs:23000,  Tv:1749, qv:871000,  Rs:40,  farbe:'#475569'},
  oel:     {name:'Speiseöl',   cf:1600, cl:1970, cg:1600, Ts:-20,  qs:120000, Tv:300,  qv:400000,  Rs:42,  farbe:'#ca8a04'}
};
const S_LISTE=Object.keys(STOFFE);
const stoff=k=>STOFFE[k]||STOFFE.wasser;
const festName=s=>s.festName||(s.name+' (fest)');
const gasName=s=>s.gasName||(s.name+'dampf');

/* ---------- Zustand ---------- */
const standard=()=>({v:1, tab:'kurve', stoff:'wasser', m:0.5, P:0, T0:-20,
  E:0, teilchen:true, gl:0, ebalken:false, stempel:false, mess:false, sy:0, Wst:0,
  a:{stoff:'wasser',m:1,T:80}, b:{stoff:'wasser',m:2,T:20}, mt:0,
  fontSize:14, edit:true});
let D=standard();
let lauf=false, letztT=0;

/* ---------- Die Erwärmungskurve ----------
   Fünf Abschnitte: fest erwärmen, schmelzen, flüssig erwärmen, sieden, Gas erwärmen.
   Jeder Abschnitt braucht eine Energie, bei fester Heizleistung also eine Zeit. */
const dTgas=s=>Math.max(40,(s.Tv-s.Ts)*0.35);
const T0Max=s=>s.Tv+400;                 /* so hoch darf die Starttemperatur gestellt werden */
function kurve(){
  const s=stoff(D.stoff), m=Math.max(0.001,D.m), P=Math.abs(Pw());
  const T0=Math.max(-273,Math.min(D.T0,T0Max(s))), ab=[];
  const dazu=(art,T1,T2,E)=>{ ab.push({art,T1,T2,E,dt:P>0?E/P:0}); };
  /* Es kommen nur die Abschnitte vor, die oberhalb der Starttemperatur liegen:
     bei -20 °C faengt Wasser als Eis an, bei 20 °C als Wasser, Luft gleich als Gas. */
  if(s.subl){                              /* fest → unmittelbar gasförmig */
    if(T0<s.Ts){
      dazu('fest', T0, s.Ts, s.cf*m*(s.Ts-T0));
      dazu('sublim', s.Ts, s.Ts, s.qs*m); }
  } else {
    if(T0<s.Ts){
      dazu('fest', T0, s.Ts, s.cf*m*(s.Ts-T0));
      dazu('schmelzen', s.Ts, s.Ts, s.qs*m); }
    if(T0<s.Tv){
      const Tf=Math.max(T0,s.Ts);
      dazu('fluessig', Tf, s.Tv, s.cl*m*(s.Tv-Tf));
      dazu('sieden', s.Tv, s.Tv, s.qv*m); } }
  const Tg=Math.max(T0,s.Tv), dT=(T0>=s.Tv)?Math.max(120,dTgas(s)):dTgas(s);
  dazu('gas', Tg, Tg+dT, s.cg*m*dT);
  let t=0, E=0;
  ab.forEach(x=>{ x.t1=t; x.E1=E; t+=x.dt; E+=x.E; x.t2=t; x.E2=E; });
  /* Unten steht immer die zugeführte Energie. Eine Zeitachse wäre bei 0 W gar nicht
     definiert und mit dem Stempel sogar falsch: Die Arbeit am Gas steckt Energie hinein,
     ohne dass Zeit vergeht. Dauern lassen sich trotzdem angeben, solange nur geheizt wird. */
  return {s,m,P,ab,tGes:t,EGes:E,T0,dauer:P>0&&!D.stempel,Tlo:ab[0].T1,Thi:ab[ab.length-1].T2};
}
/* Wo steht der Versuch, wenn die Energie E zugeführt ist? */
function standKurve(K,E){
  E=Math.max(0,Math.min(K.EGes,E));
  for(const x of K.ab){ if(E<=x.E2+1e-6){
    const f=x.E>0?(E-x.E1)/x.E:1;
    return {art:x.art, T:x.T1+(x.T2-x.T1)*f, f, E, ab:x}; } }
  const l=K.ab[K.ab.length-1];
  return {art:l.art, T:l.T2, f:1, E:K.EGes, ab:l};
}
const istHalt=a=>a==='schmelzen'||a==='sieden'||a==='sublim';
function artText(K,st){ const s=K.s;
  if(st.art==='fest') return festName(s)+' erwärmt sich';
  if(st.art==='sublim') return festName(s)+' geht unmittelbar in Gas über – die Temperatur bleibt stehen';
  if(st.art==='schmelzen') return festName(s)+' schmilzt – die Temperatur bleibt stehen';
  if(st.art==='fluessig') return s.name+' erwärmt sich';
  if(st.art==='sieden') return s.name+' siedet – die Temperatur bleibt stehen';
  return gasName(s)+' erwärmt sich';
}
/* ---------- Mischungstemperatur ----------
   abgegebene Wärme = aufgenommene Wärme, daraus folgt die Mischungstemperatur. */
const cBei=(s,T)=>T<s.Ts?s.cf:(T<s.Tv?s.cl:s.cg);
function mischung(){
  const A=D.a, B=D.b, sa=stoff(A.stoff), sb=stoff(B.stoff);
  const ca=cBei(sa,A.T), cb=cBei(sb,B.T);
  const ma=Math.max(0.001,A.m), mb=Math.max(0.001,B.m);
  const TM=(ca*ma*A.T+cb*mb*B.T)/(ca*ma+cb*mb);
  return {sa,sb,ca,cb,ma,mb,TA:A.T,TB:B.T,TM,
    Qab:ca*ma*(A.T-TM), Qauf:cb*mb*(TM-B.T)};
}

/* ---------- Zeichnen: Grundlagen ---------- */
let W=0,H=0,DPR=1,K=1;
function resize(){ DPR=Math.min(3,window.devicePixelRatio||1);
  W=cv.clientWidth||320; H=cv.clientHeight||240;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); zeichne(); }
function rr(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function txt(s,x,y,o){ o=o||{}; ctx.font=(o.fett?'700 ':'')+(o.sz||13*K)+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif';
  ctx.textAlign=o.al||'center'; ctx.textBaseline=o.bl||'middle';
  if(o.rand){ ctx.lineWidth=o.randB||3; ctx.strokeStyle=o.rand; ctx.lineJoin='round'; ctx.strokeText(s,x,y); }
  ctx.fillStyle=o.farbe||'#1f2430'; ctx.fillText(s,x,y); }
function txtPass(s,x,y,maxB,o){ o=o||{}; let sz=o.sz||13*K;
  const f=()=>ctx.font=(o.fett?'700 ':'')+sz+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif';
  f(); while(sz>7&&ctx.measureText(s).width>maxB){ sz-=0.5; f(); }
  txt(s,x,y,Object.assign({},o,{sz})); }
/* hübsche Schrittweite für die Achsen */
function schritt(spanne,ziel){ const roh=spanne/Math.max(1,ziel), p=Math.pow(10,Math.floor(Math.log10(roh)));
  const r=roh/p; return (r<1.5?1:r<3.5?2:r<7.5?5:10)*p; }

/* ---------- Druck im Gas ----------
   Das Gefaess ist so gross gedacht, dass der Stoff als Gas bei der Starttemperatur
   (mindestens aber bei seiner Siedetemperatur) gerade unter 1 bar steht. Dann gilt
   p = m_Gas · Rs · T / V, und das Volumen haengt davon ab, wie weit der Stempel
   hineingedrueckt ist. Die Werte sind qualitativ gemeint. */
const P0=100000;
function gasDaten(Kv,st){
  const s=Kv.s, z=teilchenZustand(st), Rs=s.Rs||300;
  const Tref=Math.max(Kv.T0,s.Tv)+273.15;
  const Vref=Kv.m*Rs*Tref/P0;
  const V=Vref*Math.max(0.05,1-(D.sy||0));
  return {Vref, V, ga:z.ga, p:Math.max(0, z.ga*Kv.m*Rs*(st.T+273.15)/V)};
}
/* Wie weit darf der Stempel herunter? In Gas hinein weit, auf Fluessigkeit oder
   Festkoerper setzt er nur auf - die lassen sich praktisch nicht zusammendruecken. */
const syMax=st=>teilchenZustand(st).ga>0.02?0.55:0.34;

/* ---------- Teilchenmodell ---------- */
const TN=160; let TP=null, TPH=0;
function teilchenNeu(){ TP=[];
  const sp=16, ze=Math.ceil(TN/sp);
  for(let i=0;i<TN;i++){ const c=i%sp, r=Math.floor(i/sp);
    const gx=0.09+c*(0.82/(sp-1)), gy=0.95-r*(0.52/Math.max(1,ze-1));
    TP.push({x:gx,y:gy,gx,gy,vx:0,vy:0,z:'f'}); } }
teilchenNeu();
/* Welcher Teil der Teilchen ist flüssig bzw. gasförmig? */
function teilchenZustand(st){
  if(st.art==='fest') return {fl:0,ga:0};
  if(st.art==='sublim') return {fl:st.f,ga:st.f};        /* fest unmittelbar zu Gas */
  if(st.art==='schmelzen') return {fl:st.f,ga:0};
  if(st.art==='fluessig') return {fl:1,ga:0};
  if(st.art==='sieden') return {fl:1,ga:st.f};
  return {fl:1,ga:1};
}
function teilchenSchritt(dt,st,tempF){
  const z=teilchenZustand(st), nGa=Math.round(z.ga*TN), nFl=Math.round(z.fl*TN);
  TPH+=dt*(2+6*tempF);
  TP.forEach((p,i)=>{
    p.z = (i<nGa)?'g' : (i<nFl?'l':'f');
    if(p.z==='f'){
      /* Jedes Teilchen zittert für sich um seinen Gitterplatz: ein Zufallsstoß und ein Zug
         zurück zur Ruhelage. Mit der Temperatur werden die Stöße heftiger. Ein gemeinsames
         Schwingen sähe aus wie eine Welle und wäre viel zu geordnet. */
      /* Im festen Zustand zählt, wie weit es bis zum Schmelzpunkt ist: kurz davor zittern
         die Teilchen deutlich heftiger als bei tiefer Temperatur. */
      const fF=(st.art==='fest')?Math.max(0,Math.min(1,st.f)):1;
      const a=0.0035+0.021*fF, z=Math.min(1,dt*9);
      p.x+=(p.gx-p.x)*z+(Math.random()*2-1)*a*z*2.6;
      p.y+=(p.gy-p.y)*z+(Math.random()*2-1)*a*z*2.6;
      const dx=p.x-p.gx, dy=p.y-p.gy, we=Math.hypot(dx,dy), max=a*2.2;
      if(we>max){ p.x=p.gx+dx/we*max; p.y=p.gy+dy/we*max; }
      p.vx=p.vy=0;
    } else {
      /* Das Gas wird in den Raum unter dem Stempel gezeichnet. Wird er hineingedrückt,
         schrumpft dieser Raum - ohne Ausgleich sähen die Teilchen dort langsamer aus,
         obwohl sie wärmer sind. Der Faktor hebt das Schrumpfen auf, so dass man die
         höhere Temperatur als schnellere Bewegung wirklich sieht. */
      const kz=(p.z==='g'&&D.stempel)?1/Math.max(0.35,1-(D.sy||0)):1;
      const v=(p.z==='g'?0.16:0.05)*(0.35+tempF)*kz;
      if(!p.vx&&!p.vy){ const w=Math.random()*6.283; p.vx=Math.cos(w)*v; p.vy=Math.sin(w)*v; }
      const sk=v/Math.max(1e-6,Math.hypot(p.vx,p.vy));
      p.vx*=sk; p.vy*=sk;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      /* Die Flüssigkeit bleibt unter ihrem Spiegel – und der sinkt, je mehr verdampft ist. */
      const unten=(p.z==='g')?0.04:(0.40+0.52*z.ga);
      if(p.x<0.05){ p.x=0.05; p.vx=Math.abs(p.vx); } if(p.x>0.95){ p.x=0.95; p.vx=-Math.abs(p.vx); }
      if(p.y<unten){ p.y=unten; p.vy=Math.abs(p.vy); } if(p.y>0.96){ p.y=0.96; p.vy=-Math.abs(p.vy); }
      if(p.z==='l'&&Math.random()<dt*2){ const w=Math.random()*6.283; p.vx=Math.cos(w)*v; p.vy=Math.sin(w)*v; }
    }
  });
}
/* Farbmischung: Anteil 0 = Ausgangsfarbe, 1 = Zielfarbe */
function mischFarbe(hex,ziel,anteil){
  const z=(h)=>[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];
  const a=z(hex), b=z(ziel);
  return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*anteil)).join(',')+')';
}
const ZFARBE=(s,z)=>z==='f'?mischFarbe(s.farbe,'#000000',0.35):z==='g'?mischFarbe(s.farbe,'#ffffff',0.58):s.farbe;
/* Flamme oder Schneeflocken unter dem Kasten – je nachdem, ob geheizt oder gekühlt wird */
function malHeizung(x,y,w,modus,ph){
  if(modus===0){
    txtPass(D.stempel?'Heizung aus – die innere Energie ändert sich nur noch über den Stempel'
                     :'Heizung aus – es wird gerade weder Wärme zugeführt noch entzogen',
      x+w/2,y+w*0.16,w,{sz:12.5*K,fett:true,farbe:'#94a3b8'});
    return; }
  if(modus>0){
    for(let i=-1;i<=1;i++){ const cx=x+w/2+i*w*0.16, hh=w*(0.17+0.03*Math.sin(ph*3+i)), bb=w*0.07;
      const g=ctx.createLinearGradient(cx,y+hh,cx,y);
      g.addColorStop(0,'#f97316'); g.addColorStop(1,'#fde047');
      ctx.fillStyle=g; ctx.beginPath();
      ctx.moveTo(cx,y); ctx.quadraticCurveTo(cx+bb,y+hh*0.55,cx,y+hh);
      ctx.quadraticCurveTo(cx-bb,y+hh*0.55,cx,y); ctx.fill(); }
    txtPass('Wärme wird zugeführt',x+w/2,y+w*0.26,w,{sz:12.5*K,farbe:'#ea580c',fett:true});
  } else {
    for(let i=-1;i<=1;i++){ const cx=x+w/2+i*w*0.2, cy=y+w*0.1, r=w*0.055;
      ctx.strokeStyle='#38bdf8'; ctx.lineWidth=Math.max(1.4,w*0.012); ctx.lineCap='round';
      for(let k=0;k<6;k++){ const a=k*Math.PI/3+ph*0.2;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r*0.6,cy+Math.sin(a)*r*0.6);
        ctx.lineTo(cx+Math.cos(a+0.5)*r*0.85,cy+Math.sin(a+0.5)*r*0.85); ctx.stroke(); } }
    txtPass('Wärme wird entzogen',x+w/2,y+w*0.26,w,{sz:12.5*K,farbe:'#0284c7',fett:true});
  }
}
/* Thermometer: senkrechte Saeule mit Kugel unten */
function malThermo(x,y,w,h,T,Tlo,Thi){
  const f=Math.max(0,Math.min(1,(T-Tlo)/Math.max(1,Thi-Tlo)));
  const bw=Math.max(6,w*0.46), bx=x+(w-bw)/2, ku=Math.max(5,bw*0.95);
  ctx.fillStyle='rgba(255,255,255,.88)'; rr(x-2,y-7,w+4,h+ku*2.2+10,9); ctx.fill();
  rr(bx,y,bw,h,bw/2); ctx.fillStyle='#e8edf4'; ctx.fill();
  ctx.strokeStyle='#64748b'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.save(); rr(bx,y,bw,h,bw/2); ctx.clip();
  ctx.fillStyle='#ef4444'; ctx.fillRect(bx,y+h-h*f,bw,h*f); ctx.restore();
  ctx.beginPath(); ctx.arc(x+w/2,y+h+ku*0.5,ku,0,7); ctx.fillStyle='#ef4444'; ctx.fill();
  ctx.strokeStyle='#64748b'; ctx.lineWidth=1.4; ctx.stroke();
  txtPass(zahl(T,0)+' °C',x+w/2,y+h+ku*2+4*K,w+44*K,{sz:11.5*K,fett:true,farbe:'#b91c1c',rand:'#fff',randB:3});
}
/* Druckmessgerät: Zeiger auf einer Skala von 0 bis 300 kPa */
function malMano(cx,cy,r,p){
  ctx.fillStyle='rgba(255,255,255,.88)'; ctx.beginPath(); ctx.arc(cx,cy,r*1.14,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle='#f8fafc'; ctx.fill();
  ctx.strokeStyle='#64748b'; ctx.lineWidth=1.6; ctx.stroke();
  const pk=Math.max(0,Math.min(300,p/1000)), a0=Math.PI*0.75, a1=a0+Math.PI*1.5;
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1.2;
  for(let i=0;i<=6;i++){ const a=a0+(a1-a0)*i/6;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r*0.7,cy+Math.sin(a)*r*0.7);
    ctx.lineTo(cx+Math.cos(a)*r*0.93,cy+Math.sin(a)*r*0.93); ctx.stroke(); }
  const a=a0+(a1-a0)*(pk/300);
  ctx.strokeStyle='#1d4ed8'; ctx.lineWidth=Math.max(1.8,r*0.11); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*r*0.78,cy+Math.sin(a)*r*0.78); ctx.stroke();
  ctx.fillStyle='#1d4ed8'; ctx.beginPath(); ctx.arc(cx,cy,Math.max(2,r*0.11),0,7); ctx.fill();
  txtPass(zahl(pk,0)+' kPa',cx,cy+r*1.4,r*3.4,{sz:11*K,fett:true,farbe:'#1d4ed8',rand:'#fff',randB:3});
}
/* Stempel: Platte mit Stange und Griff. STG merkt sich die Lage fuer das Ziehen. */
let STG=null;
function malStempel(x,y,w,h,sy,yT){
  const ph=Math.max(7,h*0.035), gb=Math.min(w*0.34,54*K), gh=Math.max(10,12*K);
  ctx.fillStyle='#94a3b8'; rr(x+2,yT-ph,w-4,ph,3); ctx.fill();
  ctx.fillStyle='#cbd5e1'; ctx.fillRect(x+w/2-Math.max(3,w*0.018),y-gh*0.4,Math.max(6,w*0.036),yT-ph-(y-gh*0.4));
  ctx.strokeStyle='#64748b'; ctx.lineWidth=1.2; ctx.strokeRect(x+w/2-Math.max(3,w*0.018),y-gh*0.4,Math.max(6,w*0.036),yT-ph-(y-gh*0.4));
  rr(x+w/2-gb/2,y-gh*1.4,gb,gh*1.5,5); ctx.fillStyle='#64748b'; ctx.fill();
  ctx.strokeStyle='#475569'; ctx.lineWidth=1.4; ctx.stroke();
  txt('↕',x+w/2,y-gh*0.65,{sz:12*K,fett:true,farbe:'#fff'});
  STG={x,w,yT,hBox:h,gy:y-gh*1.4};
}
function malTeilchen(x,y,w,h,Kv,st,tempF){
  const s=Kv.s, z=teilchenZustand(st);
  const sy=D.stempel?Math.max(0,Math.min(syMax(st),D.sy||0)):0;
  const yT=y+h*sy, hh=h-h*sy;
  ctx.save(); rr(x,y,w,h,12); ctx.fillStyle='#f8fafc'; ctx.fill();
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2; ctx.stroke(); ctx.clip();
  if(sy>0){ ctx.fillStyle='#e2e8f0'; ctx.fillRect(x,y,w,yT-y); }   /* Raum über dem Stempel */
  if(z.fl>z.ga&&z.ga<1){                               /* angedeuteter Flüssigkeitsspiegel */
    const sp=y+h*0.40+h*0.52*z.ga;
    ctx.fillStyle=s.farbe; ctx.globalAlpha=.12; ctx.fillRect(x,sp,w,y+h-sp); ctx.globalAlpha=1;
    ctx.strokeStyle=s.farbe; ctx.globalAlpha=.4; ctx.beginPath(); ctx.moveTo(x,sp); ctx.lineTo(x+w,sp); ctx.stroke(); ctx.globalAlpha=1; }
  const r=Math.max(2.5,Math.min(7,w*0.022));
  /* Nur das Gas wird zusammengedrückt; Flüssigkeit und Festkörper bleiben unten liegen. */
  TP.forEach(p=>{ const px=x+p.x*w, py=(p.z==='g')?(yT+p.y*hh):(y+p.y*h);
    ctx.beginPath(); ctx.arc(px,py,r,0,7);
    ctx.fillStyle=ZFARBE(s,p.z); ctx.globalAlpha=(p.z==='g')?.85:1; ctx.fill(); ctx.globalAlpha=1; });
  ctx.restore();
  if(D.stempel) malStempel(x,y,w,h,sy,yT); else STG=null;
  if(D.mess){
    const G=gasDaten(Kv,st);
    malThermo(x+w-Math.min(26*K,w*0.1)-16*K,y+h*0.17,Math.min(26*K,w*0.1),h*0.44,st.T,Kv.Tlo,Kv.Thi);
    malMano(x+Math.min(34*K,w*0.14)+10*K,y+(D.stempel?h*sy:0)+Math.min(34*K,w*0.14)+12*K,Math.min(34*K,w*0.14),G.p);
  }
  const nm=(st.art==='fest')?'fest':(st.art==='gas')?'gasförmig':(st.art==='fluessig')?'flüssig':
    (st.art==='sublim'?'fest → gasförmig':st.art==='schmelzen'?'fest → flüssig':'flüssig → gasförmig');
  txtPass('Teilchenmodell · '+nm,x+w/2,y+h+14*K,w,{sz:13*K,fett:true,farbe:'#475569'});
}
/* ---------- Balken für die innere Energie ----------
   Er liegt waagerecht unter der Achse und benutzt dieselbe Skala - die Achse ist ja
   nichts anderes als die zugeführte Energie. So laufen Marke und Balken zusammen,
   und man sieht: Beim Schmelzen und Sieden wächst er weiter, obwohl die Temperatur
   stehen bleibt. */
function malEBalken(L,R,y,h,Kv,st,X){
  rr(L,y,R-L,h,5); ctx.fillStyle='#f1f5f9'; ctx.fill();
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.4; ctx.stroke();
  const xe=X(Math.max(0,Math.min(Kv.EGes,st.E)));
  ctx.save(); rr(L,y,R-L,h,5); ctx.clip();
  const g=ctx.createLinearGradient(L,0,R,0);
  g.addColorStop(0,'#fbbf24'); g.addColorStop(1,'#dc2626');
  ctx.fillStyle=g; ctx.fillRect(L,y,xe-L,h);
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1;        /* Grenzen der Abschnitte */
  Kv.ab.forEach(a=>{ const xx=X(a.E2);
    ctx.beginPath(); ctx.moveTo(xx,y); ctx.lineTo(xx,y+h); ctx.stroke(); });
  ctx.restore();
  ctx.strokeStyle='#b91c1c'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(xe,y-3); ctx.lineTo(xe,y+h+3); ctx.stroke();
  /* Die Beschriftung steht im Balken selbst - links daneben ist kein Platz, dort
     stehen die Zahlen der Temperaturachse. Über der Füllung wird sie weiß. */
  ctx.font='700 '+(12*K)+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif';
  const bt='innere Energie', bb=ctx.measureText(bt).width;
  txt(bt,L+7*K,y+h/2,{al:'left',sz:12*K,fett:true,farbe:(xe>L+bb+10*K)?'#ffffff':'#64748b'});
  /* Der Wert steht neben dem Ende des Balkens, solange dort Platz ist */
  const re=(xe<(L+R)/2), tx=xe+(re?8*K:-8*K);
  txt(en(st.E)+(Math.abs(D.Wst||0)>1?'  (Arbeit '+en(D.Wst)+')':''),tx,y+h/2,
    {al:re?'left':'right',sz:12.5*K,fett:true,farbe:'#b91c1c',rand:'#fff',randB:3});
}

/* ---------- Reiter 1: Erwärmungskurve ---------- */
/* ---------- Spur ----------
   Die Kurve steht nicht von Anfang an da: Gezeichnet wird nur das Stück, das
   der Punkt schon durchfahren hat. spA/spB merken sich, wie weit er nach links
   und nach rechts gekommen ist; beim Zurückstellen und bei jeder neuen Aufgabe
   fängt die Spur wieder bei null an. */
let spA=0, spB=0;
function spurNeu(){ spA=spB=Math.max(0,+D.E||0); }
function spurAuf(){ const e=Math.max(0,+D.E||0);
  if(e<spA) spA=e;
  if(e>spB) spB=e; }

function zeichneKurve(){
  const Kv=kurve(), st=standKurve(Kv,D.E), s=Kv.s;
  spurAuf();
  const glH=D.gl?Math.round((Kv.ab.length+2)*17*K+12):0;
  const tw=D.teilchen?Math.min(360*K,W*0.40):0;
  /* Der Energiebalken liegt unter der Achse und braucht dort eine Zeile.
     Unten bleiben 14 px frei, damit die Achsenbeschriftung nicht in die Hinweiszeile läuft. */
  const ebH=D.ebalken?16*K:0;
  const L=66*K, R=W-tw-(tw?26*K:18*K), T=26*K, B=H-glH-54*K-(D.ebalken?34*K:0);
  /* Achsenbereiche */
  const xMax=Math.max(1e-9,Kv.EGes), Tlo=Kv.Tlo-8, Thi=Kv.Thi+8;
  const X=v=>L+(R-L)*(v/xMax), Y=T0=>B-(B-T)*((T0-Tlo)/(Thi-Tlo));
  /* Gitter */
  ctx.strokeStyle='#e8edf4'; ctx.lineWidth=1;
  const dT=schritt(Thi-Tlo,6), dx=schritt(xMax,6);
  for(let v=Math.ceil(Tlo/dT)*dT;v<=Thi;v+=dT){ const y=Y(v);
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(R,y); ctx.stroke();
    txt(zahl(v,0),L-8*K,y,{al:'right',sz:12*K,farbe:'#64748b'}); }
  const eT=Kv.EGes>=1e6?1e6:(Kv.EGes>=1000?1000:1), eE=eT===1e6?'MJ':eT===1000?'kJ':'J';
  const xLab=v=>zahl(v/eT,v/eT>=100?0:1);
  for(let v=0;v<=xMax+1e-6;v+=dx){ const x=X(v);
    ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,B); ctx.stroke();
    txt(xLab(v),x,B+14*K,{sz:12*K,farbe:'#64748b'}); }
  ctx.strokeStyle='#64748b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.lineTo(R,B); ctx.stroke();
  txt('T in °C',L-8*K,T-12*K,{al:'right',sz:13*K,fett:true,farbe:'#475569'});
  const rf=raffer(Kv);
  txt('zugeführte Energie in '+eE+(Kv.P>0
        ?(Pw()<0?' (gekühlt':' (geheizt')+' wird mit '+zahl(Math.abs(Pw()),0)+' W'
          +(rf>1?' · Zeitraffer '+zahl(rf,0)+' : 1':'')+')'
        :' (Leistung 0 W)'),
    (L+R)/2,B+30*K+(D.ebalken?34*K:0),{sz:13*K,fett:true,farbe:'#475569'});
  /* Kurve als Spur: nur der Teil, den der Punkt schon durchfahren hat.
     Waagrechte Stücke sind die Übergänge. */
  Kv.ab.forEach(x=>{ const halt=istHalt(x.art);
    const a=Math.max(x.E1,spA), b=Math.min(x.E2,spB);
    if(b<a-1e-9) return;                                   /* noch gar nicht erreicht */
    const sp=x.E2-x.E1;
    const TA=sp>1e-9?(x.T1+(x.T2-x.T1)*(a-x.E1)/sp):x.T1;
    const TB=sp>1e-9?(x.T1+(x.T2-x.T1)*(b-x.E1)/sp):x.T2;
    const x1=X(a), x2=X(b);
    ctx.strokeStyle=halt?'#ea580c':s.farbe; ctx.lineWidth=halt?4.5:3.2;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x1,Y(TA)); ctx.lineTo(x2,Y(TB)); ctx.stroke();
    ctx.lineCap='butt';
    if(halt&&x.E>0&&b>a+1e-9){ const xm=(x1+x2)/2;        /* Beschriftung über dem schon gezeichneten Stück */
      txtPass(x.art==='sublim'?(Pw()<0?'wird fest':'sublimiert')
             :x.art==='schmelzen'?(Pw()<0?'erstarrt':'schmilzt'):(Pw()<0?'kondensiert':'siedet'),
        xm,Y(x.T1)-14*K,Math.max(50,x2-x1+40*K),{sz:12.5*K,fett:true,farbe:'#ea580c'}); } });
  /* Marke */
  const mx=X(st.E), my=Y(st.T);
  ctx.strokeStyle='rgba(100,116,139,.5)'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(L,my); ctx.lineTo(mx,my); ctx.lineTo(mx,B); ctx.stroke(); ctx.setLineDash([]);
  if(D.ebalken){ ctx.setLineDash([5,4]); ctx.strokeStyle='rgba(185,28,28,.5)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(mx,B); ctx.lineTo(mx,B+24*K); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle='#1f2430'; ctx.beginPath(); ctx.arc(mx,my,6*K,0,7); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  { const re=(mx<(L+R)/2);        /* links vom Bild: Text nach rechts, sonst nach links */
    txt(zahl(st.T,1)+' °C',mx+(re?12*K:-12*K),my+14*K,
      {al:re?'left':'right',sz:16*K,fett:true,rand:'#fff',randB:4}); }
  /* Kopfzeile: was gerade passiert */
  txtPass(artText(Kv,st),(L+R)/2,T-10*K,R-L,{sz:15*K,fett:true,farbe:'#1f2430'});
  txt('zugeführt: '+en(st.E)+(Kv.dauer?' · '+zeitText(st.E/Kv.P):''),R,B-6*K,{al:'right',sz:13*K,farbe:'#64748b'});
  if(Pw()!==0&&!platzDa()) txtPass(Pw()>0?'weiter geht es nicht – hier ist das Diagramm zu Ende'
                                         :'tiefer geht es nicht – hier fängt das Diagramm an',
    R,B-23*K,(R-L)*0.7,{al:'right',sz:13*K,fett:true,farbe:'#ea580c'});
  /* Teilchenmodell rechts, davor der Balken für die innere Energie */
  if(D.teilchen){ const tempF=Math.max(0,Math.min(1,(st.T-Tlo)/Math.max(1,Thi-Tlo)));
    const ty=T+8*K+(D.stempel?20*K:0);                  /* über dem Kasten liegt der Griff */
    const th=Math.min(B-ty-tw*0.3-16*K,tw*1.0), tx=W-tw-6*K;
    malTeilchen(tx,ty,tw,th,Kv,st,tempF);
    malHeizung(tx,ty+th+22*K,tw,laeuft()?(Pw()>0?1:-1):0,TPH);
    if(D.stempel){ const G=gasDaten(Kv,st);
      txtPass(G.ga>0.02?'am Griff ziehen: Arbeit am Gas':'Flüssigkeit und Festkörper lassen sich kaum zusammendrücken',
        tx+tw/2,ty-32*K,tw,{sz:12*K,fett:true,farbe:G.ga>0.02?'#7c3aed':'#94a3b8'}); } }
  else STG=null;
  if(D.ebalken) malEBalken(L,R,B+24*K,ebH,Kv,st,X);
  /* Gleichungen */
  if(D.gl){ let y=H-glH+6*K;
    /* Breite der ersten Spalte aus dem laengsten Eintrag - sonst ueberlappen die Spalten */
    ctx.font='700 '+(13*K)+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif';
    let sp=0; Kv.ab.forEach(x=>{ const halt=istHalt(x.art);
      const nm=x.art==='fest'?festName(s)+' erwärmen':x.art==='schmelzen'?'schmelzen':
        x.art==='sublim'?'sublimieren':
        x.art==='fluessig'?s.name+' erwärmen':x.art==='sieden'?'sieden':gasName(s)+' erwärmen';
      sp=Math.max(sp,ctx.measureText(nm+':  '+(halt?'E = q · m':'E = c · m · ΔT')).width); });
    sp+=16*K;
    const zeile=(a,b2,f)=>{ txt(a,L,y,{al:'left',sz:13*K,fett:true,farbe:f||'#1f2430'});
      txt(b2,L+sp,y,{al:'left',sz:13*K,farbe:'#475569'}); y+=17*K; };
    Kv.ab.forEach(x=>{ const halt=istHalt(x.art);
      const nm=x.art==='fest'?festName(s)+' erwärmen':x.art==='schmelzen'?'schmelzen':
        x.art==='sublim'?'sublimieren':
        x.art==='fluessig'?s.name+' erwärmen':x.art==='sieden'?'sieden':gasName(s)+' erwärmen';
      const c=x.art==='fest'?s.cf:x.art==='fluessig'?s.cl:s.cg;
      const form=halt?'E = q · m':'E = c · m · ΔT';
      const zahlen=halt?(zahl((x.art==='sieden'?s.qv:s.qs)/1000,0)+' kJ/kg · '+zahl(Kv.m,2)+' kg')
        :(zahl(c,0)+' J/(kg·K) · '+zahl(Kv.m,2)+' kg · '+zahl(Math.abs(x.T2-x.T1),0)+' K');
      zeile(nm+':  '+form, zahlen+'  =  '+en(x.E)+(Kv.dauer?'   ('+zeitText(x.dt)+')':''), halt?'#ea580c':'#1f2430'); });
    zeile('zusammen:', en(Kv.EGes)+(Kv.dauer?'   ('+zeitText(Kv.tGes)+')':'')); }
}

/* ---------- Reiter 2: Mischungstemperatur ---------- */
function zeichneMischen(){
  const M=mischung(), lauft=D.mt>0, f=Math.max(0,Math.min(1,D.mt));
  const glH=D.gl?Math.round(6*17*K+14):0;
  const B=H-glH-16*K, T=40*K;
  const bw=Math.min(190*K,W*0.26), bh=Math.min(200*K,(B-T)*0.74);
  const y0=Math.max(T+10*K,(T+B-bh)/2-16*K);
  const links=W*0.18-bw/2, rechts=W*0.5-bw/2, ziel=W*0.82-bw/2;
  const TA=M.TA, TB=M.TB;        /* A und B behalten ihre Temperatur, sie werden ausgeschüttet */
  const warm=t=>{ const u=Math.max(0,Math.min(1,(t+20)/120));          /* -20 bis 100 °C */
    return 'rgb('+Math.round(60+180*u)+','+Math.round(130-60*u)+','+Math.round(246-200*u)+')'; };
  function becher(x,nm,s,m,Tv,anteil){
    ctx.save(); rr(x,y0,bw,bh,14); ctx.fillStyle='#f8fafc'; ctx.fill();
    ctx.save(); ctx.clip();
    const fh=bh*Math.max(0.12,Math.min(0.92,anteil));
    ctx.fillStyle=warm(Tv); ctx.globalAlpha=.82; ctx.fillRect(x,y0+bh-fh,bw,fh); ctx.globalAlpha=1;
    ctx.restore();
    ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2.4; rr(x,y0,bw,bh,14); ctx.stroke(); ctx.restore();
    txtPass(nm,x+bw/2,y0-14*K,bw+40*K,{sz:15*K,fett:true,farbe:'#1f2430'});
    txtPass(zahl(Tv,1)+' °C',x+bw/2,y0+bh/2,bw-14*K,{sz:22*K,fett:true,rand:'#fff',randB:4});
    txtPass(s.name+' · m = '+zahl(m,2)+' kg',x+bw/2,y0+bh+15*K,bw+60*K,{sz:13*K,farbe:'#475569'});
    txtPass('c = '+zahl(cBei(s,Tv),0)+' J/(kg·K)',x+bw/2,y0+bh+32*K,bw+60*K,{sz:12.5*K,farbe:'#94a3b8'});
  }
  const mges=M.ma+M.mb;
  becher(links,'Behälter A',M.sa,M.ma,TA,(M.ma/mges*0.8+0.15)*(1-f));
  becher(rechts,'Behälter B',M.sb,M.mb,TB,(M.mb/mges*0.8+0.15)*(1-f));
  txt('+',(links+bw+rechts)/2,y0+bh/2,{sz:26*K,fett:true,farbe:'#64748b'});
  /* Pfeile zum Ergebnis */
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2.5;
  const ym=y0+bh/2;
  [links+bw,rechts+bw].forEach((x,i)=>{ const x2=ziel-8*K;
    if(i===0) return;                                   /* nur ein Pfeil vom rechten Becher */
    ctx.beginPath(); ctx.moveTo(x+8*K,ym); ctx.lineTo(x2-10*K,ym); ctx.stroke();
    ctx.fillStyle='#94a3b8'; ctx.beginPath(); ctx.moveTo(x2,ym); ctx.lineTo(x2-12*K,ym-7*K); ctx.lineTo(x2-12*K,ym+7*K); ctx.closePath(); ctx.fill(); });
  txt('mischen',(rechts+bw+ziel)/2,ym-14*K,{sz:13*K,fett:true,farbe:'#64748b'});
  /* Ergebnis */
  ctx.save(); ctx.globalAlpha=lauft?1:0.45;
  { const x=ziel;
    ctx.save(); rr(x,y0,bw,bh,14); ctx.fillStyle='#f8fafc'; ctx.fill(); ctx.save(); ctx.clip();
    const fh=bh*0.92*f; ctx.fillStyle=warm(M.TM); ctx.globalAlpha=.82; ctx.fillRect(x,y0+bh-fh,bw,fh); ctx.globalAlpha=1; ctx.restore();
    ctx.strokeStyle='#2563eb'; ctx.lineWidth=3; rr(x,y0,bw,bh,14); ctx.stroke(); ctx.restore();
    txtPass('Mischung',x+bw/2,y0-14*K,bw+40*K,{sz:15*K,fett:true,farbe:'#2563eb'});
    txtPass(lauft?zahl(M.TM,1)+' °C':'?',x+bw/2,y0+bh/2,bw-14*K,{sz:24*K,fett:true,rand:'#fff',randB:4});
    txtPass('m = '+zahl(M.ma+M.mb,2)+' kg',x+bw/2,y0+bh+15*K,bw+60*K,{sz:13*K,farbe:'#475569'});
  }
  ctx.restore();
  if(!lauft) txtPass('„Start" antippen: Die Behälter werden zusammengeschüttet',W/2,y0+bh+60*K,W*0.8,{sz:14*K,farbe:'#64748b'});
  else txtPass('Die abgegebene Wärme ist genauso groß wie die aufgenommene',W/2,y0+bh+60*K,W*0.8,{sz:14*K,fett:true,farbe:'#1f2430'});
  /* Gleichungen */
  if(D.gl){ let y=H-glH+8*K; const L=30*K;
    ctx.font='700 '+(13.5*K)+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif';
    const sp=Math.max(ctx.measureText('c₁ · m₁ · (T₁ − T_M) = c₂ · m₂ · (T_M − T₂)').width,
      ctx.measureText(zahl(M.ca,0)+' J/(kg·K) · '+zahl(M.ma,2)+' kg · ('+zahl(M.TA,1)+' °C − T_M)').width)+16*K;
    const zeile=(a,b2,fa)=>{ txt(a,L,y,{al:'left',sz:13.5*K,fett:true,farbe:fa||'#1f2430'});
      if(b2) txt(b2,L+sp,y,{al:'left',sz:13.5*K,farbe:'#475569'}); y+=17*K; };
    zeile('abgegebene Wärme = aufgenommene Wärme');
    zeile('c₁ · m₁ · (T₁ − T_M) = c₂ · m₂ · (T_M − T₂)');
    if(D.gl>1){
      zeile(zahl(M.ca,0)+' J/(kg·K) · '+zahl(M.ma,2)+' kg · ('+zahl(M.TA,1)+' °C − T_M)',
            '= '+zahl(M.cb,0)+' J/(kg·K) · '+zahl(M.mb,2)+' kg · (T_M − '+zahl(M.TB,1)+' °C)');
      zeile('T_M = (c₁m₁T₁ + c₂m₂T₂) / (c₁m₁ + c₂m₂)');
      zeile('T_M = '+zahl(M.TM,1)+' °C',lauft?'abgegeben '+en(M.Qab)+' = aufgenommen '+en(M.Qauf):'');
    } else zeile('T_M = (c₁m₁T₁ + c₂m₂T₂) / (c₁m₁ + c₂m₂)');
  }
}
function zeichne(){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  K=Math.min(1.9,(D.fontSize||14)/14);
  if(D.tab==='mischen') zeichneMischen(); else zeichneKurve();
}

/* ---------- Bedienung ---------- */
const grenz=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v*1e6)/1e6));
function renderBar2(){ const b=$('bar2'); b.innerHTML='';
  const el=(t,c,x,fn)=>{ const e=document.createElement(t); if(c)c.split(' ').forEach(k=>k&&e.classList.add(k));
    if(x!==undefined) e.textContent=x; if(fn) e.onclick=fn; b.appendChild(e); return e; };
  const stepper=(name,anzeige,setz,eingabe)=>{
    el('span','lbl',name);
    const g=document.createElement('span'); g.className='stp'; b.appendChild(g);
    const mk=(t,f)=>{ const x=document.createElement('button'); x.textContent=t; x.onclick=f; g.appendChild(x); };
    mk('−',()=>setz(-1));
    const v=document.createElement('span'); v.className='val'; v.textContent=anzeige;
    if(eingabe){ v.style.cursor='text'; v.title='Antippen und Wert eingeben';
      v.onclick=()=>{ const s=prompt(name+' eingeben:',anzeige.replace(/[^0-9,.\-]/g,'')); if(s===null) return;
        const z=parseFloat(String(s).replace(',','.')); if(isFinite(z)) eingabe(z); }; }
    g.appendChild(v); mk('+',()=>setz(1));
  };
  const stoffWahl=(akt,setz)=>{ const s=document.createElement('select'); s.className='sel';
    S_LISTE.forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=STOFFE[k].name; if(k===akt)o.selected=true; s.appendChild(o); });
    s.onchange=()=>setz(s.value); b.appendChild(s); };
  const schluss=()=>{ el('span','grow'); el('span','sep tafelEdit');
    el('span','lbl tafelEdit','Schrift'); el('button','btn tafelEdit','A−',()=>fontBy(-2)); el('button','btn tafelEdit','A+',()=>fontBy(2));
    el('span','sep tafelEdit'); bildKnoepfe(); };

  if(D.tab==='kurve'){
    el('span','lbl','Stoff'); stoffWahl(D.stoff,k=>{ D.stoff=k; D.T0=grenz(D.T0,-270,T0Max(stoff(k)));
      D.E=0; D.sy=0; D.Wst=0; lauf=false; spurNeu(); playBtn(); renderBar2(); zeichne(); sync(); });
    stepper('Masse',zahl(D.m,2)+' kg',d=>{ D.m=grenz(D.m+d*(D.m<0.2?0.05:0.25),0.01,100); D.E=0; spurNeu(); renderBar2(); zeichne(); sync(); },
      z=>{ D.m=grenz(z,0.01,100); D.E=0; spurNeu(); renderBar2(); zeichne(); sync(); });
    stepper('Starttemperatur',zahl(D.T0,0)+' °C',d=>{ D.T0=grenz(D.T0+d*5,-270,T0Max(stoff(D.stoff))); D.E=0; D.Wst=0; spurNeu(); renderBar2(); zeichne(); sync(); },
      z=>{ D.T0=grenz(z,-270,T0Max(stoff(D.stoff))); D.E=0; D.Wst=0; spurNeu(); renderBar2(); zeichne(); sync(); });
    /* Der Regler stellt die Leistung ein und startet damit zugleich den Versuch:
       nach rechts heizen (Flamme), nach links kühlen (Schneeflocken), in der Mitte
       rastet er bei 0 W ein - dann steht alles still. */
    el('span','lbl','Leistung');
    const rg=document.createElement('input'); rg.type='range'; rg.className='rng';
    rg.min=-100; rg.max=100; rg.step=1; rg.value=sVonP(D.P);
    rg.title='nach rechts heizen, nach links kühlen, in der Mitte rastet er bei 0 W ein';
    b.appendChild(rg);
    const wert=document.createElement('span'); wert.className='val'; wert.style.cursor='text';
    wert.title='Antippen und Leistung eingeben';
    const zeig=()=>{ const P=Pw();
      wert.textContent=(P===0?'0 W · steht':zahl(Math.abs(P),0)+' W '+(P<0?'kühlen':'heizen'));
      wert.style.color=P>0?'#ea580c':P<0?'#0284c7':'#94a3b8'; };
    zeig(); b.appendChild(wert);
    rg.oninput=()=>{ if(Math.abs(+rg.value)<=RAST&&+rg.value!==0) rg.value=0;   /* einrasten */
      D.P=pVonS(+rg.value); letztT=performance.now(); zeig(); zeichne(); sync(); };
    wert.onclick=()=>{ const t=prompt('Leistung in Watt eingeben (negativ = kühlen):',zahl(D.P,0)); if(t===null) return;
      const z=parseFloat(String(t).replace(',','.')); if(!isFinite(z)) return;
      D.P=grenz(z,-PMAX,PMAX); letztT=performance.now(); renderBar2(); zeichne(); sync(); };
    schluss(); return; }

  ['a','b'].forEach(k=>{ const R=D[k];
    el('span','lbl','Behälter '+k.toUpperCase());
    stoffWahl(R.stoff,x=>{ R.stoff=x; D.mt=0; renderBar2(); zeichne(); sync(); });
    stepper('m',zahl(R.m,2)+' kg',d=>{ R.m=grenz(R.m+d*(R.m<0.3?0.05:0.25),0.01,100); D.mt=0; renderBar2(); zeichne(); sync(); },
      z=>{ R.m=grenz(z,0.01,100); D.mt=0; renderBar2(); zeichne(); sync(); });
    stepper('T',zahl(R.T,0)+' °C',d=>{ R.T=grenz(R.T+d*5,-200,2000); D.mt=0; renderBar2(); zeichne(); sync(); },
      z=>{ R.T=grenz(z,-200,2000); D.mt=0; renderBar2(); zeichne(); sync(); });
    el('span','sep');
  });
  schluss();
}
function fontBy(d){ D.fontSize=Math.max(9,Math.min(36,(D.fontSize||14)+d));
  document.documentElement.style.setProperty('--fs',Math.min(18,D.fontSize)+'px'); zeichne(); sync(); toast('Schriftgröße '+D.fontSize); }
function bildKnoepfe(){ const b=$('bar2');
  const mk=(t,ti,fn)=>{ const x=document.createElement('button'); x.className='btn tafelEdit'+(t.indexOf('Tafel')>=0?' pri':''); x.textContent=t; x.title=ti; x.onclick=fn; b.appendChild(x); };
  if(window.parent!==window) mk('🖼 Bild → Tafel','Als Bild neben das Werkzeug legen',zurTafel);
  mk('📋 Kopieren','Als Bild in die Zwischenablage kopieren',kopieren); }
const bild=()=>window.TafelShot?TafelShot.rasterize($('cvbox'),{scale:2,bg:'#fff'}):null;
function zurTafel(){ const im=bild(); if(!im) return; if(window.parent===window){ toast('Nur innerhalb der Tafel möglich'); return; }
  try{ parent.postMessage({type:'embed-image',url:im.canvas.toDataURL('image/png'),w:im.w,h:im.h},'*'); toast('Als Bild auf die Tafel gelegt'); }catch(e){ toast('Nicht möglich'); } }
function kopieren(){ const im=bild(); if(!im) return;
  try{ if(!navigator.clipboard||!window.ClipboardItem) throw new Error('x');
    const blob=new Promise(r=>im.canvas.toBlob(r,'image/png'));
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>toast('Bild kopiert'),()=>toast('Kopieren wurde vom Browser verhindert'));
  }catch(e){ toast('Kopieren wird hier nicht unterstützt'); } }

/* ---------- Reiter, Knöpfe, Ablauf ---------- */
function setzeTab(t){ D.tab=t; lauf=false; playBtn();
  $('t-kurve').classList.toggle('on',t==='kurve'); $('t-mischen').classList.toggle('on',t==='mischen');
  ['bTeil','bEn','bStp','bMess'].forEach(k=>{ $(k).hidden=(t!=='kurve'); });
  $('bPlay').hidden=(t==='kurve');            /* beim Erwärmen ist der Heizungsknopf der Start */
  $('hint').textContent=(t==='kurve')?(D.stempel?'Regler heizt und kühlt · am Stempel ziehen verrichtet Arbeit':'Der Regler heizt und kühlt · in der Mitte rastet er bei 0 W ein')
    :'Massen und Temperaturen unten einstellen, dann „Start"';
  renderBar2(); zeichne(); sync(); }
$('t-kurve').onclick=()=>setzeTab('kurve'); $('t-mischen').onclick=()=>setzeTab('mischen');
function playBtn(){ $('bPlay').classList.toggle('on',lauf);
  $('bPlay').innerHTML=(lauf?'<svg viewBox="0 0 32 20"><path d="M12 4v12M20 4v12" stroke-width="3"/></svg><span>Pause</span>'
                            :'<svg viewBox="0 0 32 20"><path d="M12 4l12 6-12 6Z" fill="currentColor" stroke="none"/></svg><span>Start</span>'); }
$('bPlay').onclick=()=>{ if(D.mt>=1){ D.mt=0; zeichne(); sync(); return; }
  lauf=!lauf; letztT=performance.now(); playBtn(); };
$('bZur').onclick=()=>{ lauf=false; if(D.tab==='mischen') D.mt=0;
  else { D.sy=0; D.Wst=0; D.E=Pw()<0?kurve().EGes:0; spurNeu(); letztT=performance.now(); }
  playBtn(); zeichne(); sync(); };
$('bTeil').onclick=()=>{ D.teilchen=!D.teilchen; $('bTeil').classList.toggle('on',D.teilchen); zeichne(); sync(); };
$('bEn').onclick=()=>{ D.ebalken=!D.ebalken; schalter(); zeichne(); sync();
  if(D.ebalken) toast('Der Balken zeigt die innere Energie – sie wächst auch beim Schmelzen und Sieden weiter'); };
$('bStp').onclick=()=>{ D.stempel=!D.stempel; if(!D.stempel){ D.sy=0; }
  schalter(); zeichne(); sync();
  if(D.stempel) toast('Am Griff ziehen: Hineindrücken verrichtet Arbeit am Gas'); };
$('bMess').onclick=()=>{ D.mess=!D.mess; schalter(); zeichne(); sync(); };
function schalter(){ $('bEn').classList.toggle('on',!!D.ebalken);
  $('bStp').classList.toggle('on',!!D.stempel); $('bMess').classList.toggle('on',!!D.mess);
  $('bTeil').classList.toggle('on',D.teilchen!==false); }

/* ---------- Stempel ziehen ----------
   Beim Hineindrücken wird am Gas die Arbeit W = p · ΔV verrichtet. Sie wandert in die
   innere Energie, also an dieselbe Stelle wie die zugeführte Wärme: Der Versuch rückt
   um W/P in der Zeit vor, Temperatur und Druck steigen. Beim Herausziehen umgekehrt. */
function stempelSchritt(neu){ const Kv=kurve(), st=standKurve(Kv,D.E), G=gasDaten(Kv,st);
  const d=neu-(D.sy||0);
  if(d&&G.p>0){ const Wa=G.p*G.Vref*d;
    /* Mehr als das Diagramm hergibt, kann die innere Energie nicht aufnehmen:
       Am rechten Rand (und bei leerem Balken) bleibt der Stempel stehen. */
    const frei=Wa>0?(Kv.EGes-D.E):D.E;
    if(Math.abs(Wa)>frei+1e-6) return false;
    D.Wst=(D.Wst||0)+Wa;
    D.E=Math.max(0,Math.min(Kv.EGes,D.E+Wa)); }
  D.sy=neu; return true; }
function stempelAuf(neu){
  neu=Math.max(0,Math.min(syMax(standKurve(kurve(),D.E)),neu));
  /* In kleinen Schritten, weil der Druck beim Zusammendrücken selbst steigt.
     Sonst stimmt die Arbeit bei einem schnellen Zug nicht. */
  const von=D.sy||0, n=Math.max(1,Math.ceil(Math.abs(neu-von)/0.004));
  for(let i=1;i<=n;i++) if(!stempelSchritt(von+(neu-von)*i/n)) break;
  zeichne(); sync(); }
let zieh=null;
cv.addEventListener('pointerdown',e=>{
  if(D.tab!=='kurve'||!D.stempel||!D.teilchen||!STG) return;
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(x<STG.x-6||x>STG.x+STG.w+6) return;
  if(y<STG.gy-14||y>STG.yT+16) return;                 /* Griff, Stange oder Platte */
  zieh={y0:y,sy0:D.sy||0}; lauf=false; playBtn();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(!zieh||!STG) return;
  const r=cv.getBoundingClientRect(), y=e.clientY-r.top;
  stempelAuf(zieh.sy0+(y-zieh.y0)/Math.max(1,STG.hBox)); e.preventDefault(); });
const ziehEnde=()=>{ zieh=null; };
cv.addEventListener('pointerup',ziehEnde); cv.addEventListener('pointercancel',ziehEnde);
$('bGl').onclick=()=>{ D.gl=((D.gl||0)+1)%3; glBtn(); zeichne(); sync(); };
function glBtn(){ $('bGl').classList.toggle('on',!!D.gl);
  $('bGl').querySelector('span').textContent=['Gleichungen','Formeln','mit Zahlen'][D.gl||0]; }
$('bHilfe').onclick=()=>{ const b=$('bar2'); b.innerHTML='';
  [['Erwärmen','Stoff, Masse und Starttemperatur unten einstellen. Der Leistungsregler startet den Versuch: nach rechts heizen, nach links kühlen, in der Mitte rastet er bei 0 W ein und alles steht still. Einen Start-Knopf braucht es nicht.'],
   ['Haltepunkte','Beim Schmelzen und Sieden bleibt die Temperatur stehen, obwohl weiter geheizt wird – die Energie steckt in der Umwandlung.'],
   ['Teilchen','Rechts sieht man dasselbe im Teilchenmodell: Gitter, Flüssigkeit, Gas.'],
   ['Leistung','Der Regler steht logarithmisch von 1 W bis 50 kW: nach rechts heizen (Flamme), nach links kühlen (Schneeflocken), in der Mitte rastet er bei 0 W ein und der Versuch steht still. Mehr Leistung heißt auch: Es geht schneller.'],
   ['Energie','Der Balken zeigt die innere Energie: Sie wächst beim Schmelzen und Sieden weiter, obwohl die Temperatur stehen bleibt.'],
   ['Stempel','Am Griff ziehen: Hineindrücken verrichtet Arbeit am Gas – auch bei ausgeschalteter Heizung steigt so die innere Energie. Unten steht dann die zugeführte Energie statt der Zeit, denn die Arbeit braucht keine Zeit.'],
   ['Messgeräte','Thermometer und Druckmessgerät im Teilchenmodell. Beim Erhitzen von Luft steigt der Druck, beim Hineindrücken Druck und Temperatur.'],
   ['Mischen','Mit dem Umschalter oben links zwei Behälter einstellen und mischen – die Gleichung steht darunter.']
  ].forEach(([k,v])=>{ const s=document.createElement('span'); s.className='lbl'; s.textContent=k+': ';
    const x=document.createElement('span'); x.textContent=v; x.style.marginRight='14px'; b.appendChild(s); b.appendChild(x); });
  const z=document.createElement('button'); z.className='btn'; z.textContent='✕'; z.onclick=renderBar2; b.appendChild(z); };

/* ---------- Vorlagen ---------- */
const VORLAGEN={
  'Eis schmilzt und Wasser siedet':()=>({tab:'kurve',stoff:'wasser',m:0.5,P:500,T0:-20,E:0}),
  'Ein Liter Wasser kochen':()=>({tab:'kurve',stoff:'wasser',m:1,P:2000,T0:20,E:0}),
  'Wasserdampf kühlt ab':()=>({tab:'kurve',stoff:'wasser',m:0.5,P:-500,T0:-20}),
  'Blei schmelzen':()=>({tab:'kurve',stoff:'blei',m:0.2,P:300,T0:20,E:0}),
  'Eisen glühen':()=>({tab:'kurve',stoff:'eisen',m:0.1,P:1000,T0:20,E:0}),
  'Schwefel schmelzen':()=>({tab:'kurve',stoff:'schwefel',m:0.2,P:300,T0:20,E:0}),
  'Brom verdampft':()=>({tab:'kurve',stoff:'brom',m:0.1,P:100,T0:20,E:0,
    teilchen:true,ebalken:true,mess:true,stempel:false,sy:0,Wst:0}),
  'Trockeneis sublimiert':()=>({tab:'kurve',stoff:'co2',m:0.2,P:200,T0:-100,E:0,
    teilchen:true,ebalken:true,mess:true,stempel:false,sy:0,Wst:0}),
  'Luft erhitzen':()=>({tab:'kurve',stoff:'luft',m:0.05,P:50,T0:20,E:0,
    teilchen:true,ebalken:true,stempel:true,mess:true,sy:0,Wst:0}),
  'Nur Arbeit, keine Wärme':()=>({tab:'kurve',stoff:'luft',m:0.05,P:0,T0:20,E:0,
    teilchen:true,ebalken:true,stempel:true,mess:true,sy:0,Wst:0}),
  'Heißes Wasser abkühlen':()=>({tab:'mischen',a:{stoff:'wasser',m:1,T:80},b:{stoff:'wasser',m:2,T:20},mt:0}),
  'Eisen ins Wasser':()=>({tab:'mischen',a:{stoff:'eisen',m:0.5,T:300},b:{stoff:'wasser',m:2,T:20},mt:0}),
  'Gleiche Massen':()=>({tab:'mischen',a:{stoff:'wasser',m:1,T:90},b:{stoff:'wasser',m:1,T:10},mt:0})
};
$('bTpl').onclick=()=>{ const b=$('bar2'); b.innerHTML='';
  const l=document.createElement('span'); l.className='lbl'; l.textContent='Vorlage:'; b.appendChild(l);
  Object.keys(VORLAGEN).forEach(k=>{ const bt=document.createElement('button'); bt.className='btn'; bt.textContent=k;
    bt.onclick=()=>ladeVorlage(k); b.appendChild(bt); });
  const x=document.createElement('button'); x.className='btn'; x.textContent='✕'; x.onclick=renderBar2; b.appendChild(x); };
function ladeVorlage(k){ const f=VORLAGEN[k]; if(!f) return;
  D.sy=0; D.Wst=0; Object.assign(D,f()); if(Pw()<0&&D.tab==='kurve') D.E=kurve().EGes;
  spurNeu(); lauf=false; teilchenNeu(); playBtn(); schalter(); setzeTab(D.tab); toast(k); }

/* ---------- Ablauf (Animation) ---------- */
function loop(ts){ const dt=Math.min(0.08,(ts-letztT)/1000||0); letztT=ts;
  if(D.tab==='kurve'){
    const Kv=kurve();
    if(laeuft()){                                 /* die zugeführte Energie wächst mit P · t */
      D.E+=Pw()*raffer(Kv)*dt;
      if(D.E>=Kv.EGes){ D.E=Kv.EGes; sync(); }
      if(D.E<=0){ D.E=0; sync(); } }
    const st=standKurve(Kv,D.E);
    const Tlo=Kv.Tlo-8, Thi=Kv.Thi+8;
    if(D.teilchen) teilchenSchritt(dt,st,Math.max(0,Math.min(1,(st.T-Tlo)/Math.max(1,Thi-Tlo))));
    if(laeuft()||D.teilchen) zeichne();
  } else {
    if(lauf){ D.mt+=dt/1.2; if(D.mt>=1){ D.mt=1; lauf=false; playBtn(); sync(); } zeichne(); }
  }
  requestAnimationFrame(loop); }

/* ---------- Tafel-Anbindung ---------- */
let ready=false, syncT=null;
function post(){ syncT=null; if(window.parent===window||!ready) return;
  try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
function sync(){ if(!syncT) syncT=setTimeout(post,250); }
function uebernimm(d){ if(!d) return;
  D=Object.assign(standard(),d);
  if(!STOFFE[D.stoff]) D.stoff='wasser';
  ['a','b'].forEach(k=>{ D[k]=Object.assign({stoff:'wasser',m:1,T:20},D[k]||{});
    if(!STOFFE[D[k].stoff]) D[k].stoff='wasser';
    D[k].m=grenz(+D[k].m||1,0.01,100); D[k].T=grenz(+D[k].T||0,-200,2000); });
  D.m=grenz(+D.m||0.5,0.01,100);
  /* Ohne Angabe steht die Heizung still - ein frisch eingefuegtes Werkzeug heizt nicht von selbst. */
  D.P=grenz(isFinite(+D.P)?+D.P:0,-PMAX,PMAX);
  if(d.kuehlen&&D.P>0) D.P=-D.P;                   /* früher ein eigener Schalter */
  D.T0=grenz(+D.T0||0,-270,T0Max(stoff(D.stoff)));
  D.sy=grenz(+D.sy||0,0,0.55); D.Wst=+D.Wst||0;
  if(d.E===undefined&&d.t!==undefined) D.E=Math.abs(+d.t||0)*Math.abs(D.P);
  D.E=Math.max(0,Math.min(kurve().EGes,+D.E||0)); D.mt=grenz(+D.mt||0,0,1);
  /* Übernommener Stand: die Spur reicht von dort, wo der Vorgang begonnen hat, bis zum Punkt. */
  if(Pw()<0){ spA=D.E; spB=kurve().EGes; } else { spA=0; spB=D.E; }
  if(D.tab!=='mischen') D.tab='kurve';
  document.documentElement.style.setProperty('--fs',Math.min(18,D.fontSize||14)+'px');
  lauf=false; teilchenNeu(); playBtn(); glBtn(); schalter();
  setzeTab(D.tab); }
addEventListener('message',e=>{ if(e.source!==window&&(window.parent===window||e.source!==window.parent)) return;
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return;
  uebernimm(e.data.data); ready=true;
  if(window.TafelModus) TafelModus.refresh(); });
if(window.TafelTeilen&&!TafelTeilen.istGeteilt())
  TafelTeilen.knopf($('barR'),'waerme.html',()=>({w:'wrm', d:D}));
function barFade(){ const bar=$('bar'), m=$('barMid');
  bar.classList.remove('compact');
  if(m.scrollWidth>m.clientWidth+2&&m.clientWidth<180) bar.classList.add('compact'); }
addEventListener('resize',()=>{ resize(); barFade(); });
window.addEventListener('load',()=>{
  const geteilt=window.TafelTeilen&&TafelTeilen.istGeteilt();
  if(window.TafelModus&&!geteilt)
    TafelModus.init({get:()=>D.edit!==false, set:v=>{ D.edit=v; renderBar2(); resize(); barFade(); sync(); }});
  document.documentElement.style.setProperty('--fs',Math.min(18,D.fontSize||14)+'px');
  playBtn(); glBtn(); schalter();
  setzeTab(D.tab); resize(); barFade();
  requestAnimationFrame(ts=>{ letztT=ts; loop(ts); });
  if(window.ResizeObserver) new ResizeObserver(()=>{ resize(); barFade(); }).observe($('cvbox'));
  if(geteilt){ TafelTeilen.nurBenutzen(); D.edit=false; ready=true;
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='wrm'&&p.d) TafelTeilen.einspielen(p.d); }).catch(()=>{});
    return; }
  if(window.parent===window){ ready=true; return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  setTimeout(()=>{ ready=true; },700);
});
</script>
