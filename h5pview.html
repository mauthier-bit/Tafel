<!DOCTYPE html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H5P</title>
<link rel="stylesheet" href="h5p/styles/h5p.css">
<link rel="stylesheet" href="h5p/styles/font-open-sans.css">
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  #wrap{height:100%;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px;box-sizing:border-box;}
  #msg{padding:16px;color:#5b6472;font-size:14px;line-height:1.4;}
  #msg b{color:#1f2430;}
</style>
</head><body>
<div id="wrap"><div id="box"></div><div id="msg">H5P-Inhalt wird geladen …</div></div>
<script src="h5p/main.bundle.js"></script>
<script>
"use strict";
const id=new URLSearchParams(location.search).get('c')||'';
const msg=t=>{ const m=document.getElementById('msg'); m.hidden=false; m.innerHTML=t; };
(async()=>{
  if(!id){ msg('Kein Inhalt angegeben.'); return; }
  try{
    const probe=await fetch('h5pfiles/'+id+'/h5p.json',{cache:'no-store'});
    if(!probe.ok) throw new Error('nicht gefunden');
  }catch(e){
    msg('<b>Dieser H5P-Inhalt ist auf diesem Gerät nicht mehr vorhanden.</b><br>Die Datei wird im Browser-Speicher abgelegt – bitte die .h5p-Datei über <b>Einfügen → Datei</b> erneut auswählen.');
    return;
  }
  try{
    const el=document.getElementById('box');
    // embedType 'div': ohne inneres iframe – nur so laufen die Dateien über den Service Worker
    await new H5PStandalone.H5P(el,{ h5pJsonPath:'h5pfiles/'+id, frameJs:'h5p/frame.bundle.js', frameCss:'h5p/styles/h5p.css', embedType:'div' });
    document.getElementById('msg').hidden=true;
    try{ if(window.parent!==window) parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  }catch(err){ msg('<b>Der H5P-Inhalt konnte nicht gestartet werden.</b><br>'+(err&&err.message?String(err.message).replace(/[<>]/g,''):'Unbekannter Fehler')); }
})();
</script>
</body></html>
