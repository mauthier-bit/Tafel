<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bild beschriften</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--k:1;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;}
  #app{height:100%;display:flex;flex-direction:column;}
  #bar,#bar2{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid #e6eaf0;flex:none;}
  #bar{padding-right:104px;}        /* rechts oben sitzt der Umschalter „Bearbeiten / Benutzen" */
  @media (max-width:560px){          /* schmales Objekt: nur die Symbole, sonst wird die Leiste zu hoch */
    #bar .t{display:none;}
    #bar .btn{padding:6px 7px;}
    #titel{flex:1 1 70px;min-width:60px;}
  }
  #bar2{background:#f7f9fc;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:6px 10px;font:600 calc(var(--k)*13px) -apple-system,sans-serif;color:#1f2430;cursor:pointer;white-space:nowrap;}
  .btn.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:800;}
  .btn.dang{color:#b91c1c;border-color:#fca5a5;}
  .btn svg{width:calc(var(--k)*17px);height:calc(var(--k)*17px);fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;display:block;}
  .btn:disabled{opacity:.4;cursor:default;}
  .sep{width:1px;height:20px;background:#e2e8f0;}
  .grow{flex:1 1 auto;}
  #titel{border:1px solid transparent;border-radius:8px;padding:5px 8px;font:800 calc(var(--k)*15px) inherit;background:none;color:#1f2430;min-width:90px;flex:1 1 120px;}
  #titel:focus{border-color:#cfd6e0;outline:none;}
  #stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding:7px 8px 9px;overflow:auto;-webkit-overflow-scrolling:touch;}
  #huelle{flex:1 1 auto;min-height:0;display:flex;align-items:flex-start;justify-content:center;}
  #box{position:relative;background:#fff;border:1px solid #e6eaf0;border-radius:12px;overflow:hidden;touch-action:none;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .mk{position:absolute;width:calc(var(--k)*14px);height:calc(var(--k)*14px);margin:calc(var(--k)*-7px) 0 0 calc(var(--k)*-7px);
    border-radius:50%;background:#2563eb;border:2px solid #fff;box-shadow:0 0 0 1px #2563eb;cursor:grab;}
  .lin{position:absolute;height:2px;background:#2563eb;transform-origin:0 50%;pointer-events:none;opacity:.75;}
  .lb{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1.5px solid #2563eb;border-radius:9px;
    padding:calc(var(--k)*3px) calc(var(--k)*7px);font:700 calc(var(--k)*14px) -apple-system,sans-serif;color:#1f2430;
    max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;display:flex;align-items:center;gap:5px;}
  .lb input{border:none;background:none;font:inherit;color:inherit;width:calc(var(--k)*108px);min-width:40px;padding:0;}
  .lb input:focus{outline:none;}
  .lb .x{color:#b6bdc9;font-weight:800;cursor:pointer;padding:0 1px;}
  .lb.leer{border-style:dashed;color:#94a3b8;min-width:calc(var(--k)*84px);justify-content:center;cursor:pointer;}
  .lb.ziel{border-color:#16a34a;background:#f0fdf4;}
  .lb.ok{border-color:#16a34a;background:#f0fdf4;color:#15803d;}
  .lb.falsch{border-color:#dc2626;background:#fef2f2;color:#b91c1c;}
  #pool{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:calc(var(--k)*34px);}
  #pool .chip{border:1.5px solid #cfd6e0;background:#f8fafc;border-radius:9px;padding:calc(var(--k)*5px) calc(var(--k)*10px);
    font:700 calc(var(--k)*14px) -apple-system,sans-serif;color:#1f2430;cursor:grab;touch-action:none;}
  #pool .chip.weg{opacity:.25;pointer-events:none;}
  #pool .chip.sel{border-color:#2563eb;background:#dbeafe;box-shadow:0 0 0 2px rgba(37,99,235,.25);}
  #pool .hint{font-size:calc(var(--k)*12px);color:#8a93a2;}
  #geist{position:fixed;z-index:60;pointer-events:none;display:none;border:1.5px solid #2563eb;background:#dbeafe;border-radius:9px;
    padding:calc(var(--k)*5px) calc(var(--k)*10px);font:700 calc(var(--k)*14px) -apple-system,sans-serif;color:#1f2430;transform:translate(-50%,-140%);}
  #msg{font-size:calc(var(--k)*12.5px);color:#475569;flex:none;padding:0 8px 6px;min-height:1.2em;}
  #msg.ok{color:#15803d;font-weight:700;} #msg.err{color:#b91c1c;font-weight:700;}
  #vorl{position:absolute;inset:0;z-index:40;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:14px;}
  #vorl.show{display:flex;}
  #vorl .k{background:#fff;border-radius:16px;padding:14px;max-width:560px;width:100%;max-height:86%;overflow:auto;box-shadow:0 12px 40px rgba(15,23,42,.3);}
  #vorl h3{margin:0 0 8px;font-size:calc(var(--k)*16px);display:flex;justify-content:space-between;align-items:center;}
  #vorl h3 .x{cursor:pointer;color:#8a93a2;font-size:1.3em;}
  #vorl .v{display:flex;gap:9px;align-items:center;border:1px solid #e6eaf0;border-radius:11px;padding:8px;margin-bottom:7px;cursor:pointer;background:#fbfcfe;}
  #vorl .v:hover{background:#eef4ff;border-color:#2563eb;}
  #vorl .v canvas{width:84px;height:63px;border:1px solid #e6eaf0;border-radius:7px;background:#fff;flex:none;}
  #vorl .v .t{flex:1;min-width:0;}
  #vorl .v .t b{display:block;font-size:calc(var(--k)*14px);}
  #vorl .v .t small{color:#64748b;font-size:calc(var(--k)*12px);}
  body.nurBenutzen .tafelEdit{display:none!important;}
  body.nurBenutzen #bar{display:none;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div id="app">
  <div id="bar" class="tafelEdit">
    <input type="text" id="titel" placeholder="Überschrift (z. B. Das Auge)">
    <span class="sep"></span>
    <button class="btn" id="bVorl" title="Beispiel aus der Vorlagen-Sammlung">📚<span class="t"> Vorlagen</span></button>
    <button class="btn" id="bBild" title="Bild aus einer Datei einfügen">🖼<span class="t"> Bild</span></button>
    <button class="btn" id="bMalen" title="Mit dem Stift zeichnen – noch einmal tippen beendet das Malen">✏️<span class="t"> Malen</span></button>
    <button class="btn" id="bUndo" title="Letzten Strich zurücknehmen"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="btn dang" id="bLeer" title="Bild und Zeichnung entfernen">🗑<span class="t"> Bild</span></button>
    <span class="sep"></span>
    <button class="btn" id="bSave" title="Aufgabe als Datei sichern">💾</button>
    <button class="btn" id="bLoad" title="Aufgabe aus einer Datei laden">📂</button>
    <input type="file" id="fBild" accept="image/*" hidden>
    <input type="file" id="fDatei" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <button class="btn" id="fsM" title="Schrift kleiner">A−</button><button class="btn" id="fsP" title="Schrift größer">A+</button>
    <span id="teilenBtn" style="display:inline-flex"></span>
    <span id="shotBtns" style="display:inline-flex;gap:5px"></span>
  </div>
  <div id="bar2" hidden>
    <b id="b2t" style="font-size:calc(var(--k)*13px);color:#475569">Beschriftungen an die richtige Stelle ziehen</b>
    <span class="grow"></span>
    <button class="btn pri" id="bPruef">✓ Prüfen</button>
    <button class="btn" id="bNeu">↺ Noch einmal</button>
    <button class="btn" id="bLoes">👁 Lösung</button>
  </div>
  <div id="stage">
    <div id="huelle"><div id="box"><canvas id="cv"></canvas></div></div>
    <div id="pool"></div>
  </div>
  <div id="msg"></div>
  <div id="vorl"><div class="k"><h3><span>Vorlagen</span><span class="x" id="vZu">×</span></h3><div id="vListe"></div>
    <div style="font-size:calc(var(--k)*12px);color:#64748b;line-height:1.45;margin-top:6px">Eine Vorlage ersetzt Bild und Beschriftungen. Eigene Bilder fügst du über <b>🖼 Bild</b> ein, eigene Zeichnungen über <b>✏️ Malen</b>.</div>
  </div></div>
</div>
<div id="geist"></div>
<script src="shot.js"></script>
<script src="modus.js"></script>
<script src="teilen.js"></script>
<script src="beschriften-vorlagen.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const toast=m=>window.TafelShot&&TafelShot.toast(m);
const uid=()=>'m'+Math.random().toString(36).slice(2,8);
let D={ v:1, titel:'', vorlage:'', bild:'', ar:4/3, striche:[], marken:[], zuord:{}, fontSize:16, edit:true };
let ready=false, malen=false, bildEl=null, pool=[], gewaehlt=null, geprueft=false;

/* ---------- Grundgerüst ---------- */
function schrift(){ document.documentElement.style.setProperty('--k',(D.fontSize||16)/16); }
function bildLaden(cb){ if(!D.bild){ bildEl=null; cb&&cb(); return; }
  const im=new Image(); im.onload=()=>{ bildEl=im; cb&&cb(); }; im.onerror=()=>{ bildEl=null; cb&&cb(); }; im.src=D.bild; }
function passe(){ const h=$('huelle'), box=$('box');
  const W0=h.clientWidth||400, H0=h.clientHeight||300, ar=D.ar||4/3;
  let w=Math.min(W0,H0*ar); if(!(w>40)) w=Math.max(120,W0); let ht=w/ar;
  box.style.width=Math.round(w)+'px'; box.style.height=Math.round(ht)+'px'; }
function zeichnen(){ passe(); const box=$('box'), cv=$('cv'), dpr=window.devicePixelRatio||1;
  const W=box.clientWidth||400, H=box.clientHeight||300;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  if(D.vorlage&&window.TafelBeschriftVorlagen){ const v=TafelBeschriftVorlagen.find(v=>v.id===D.vorlage); if(v) v.zeichne(g,W,H); }
  if(bildEl){ const r=Math.min(W/bildEl.width,H/bildEl.height), w=bildEl.width*r, h=bildEl.height*r;
    g.drawImage(bildEl,(W-w)/2,(H-h)/2,w,h); }
  g.lineCap='round'; g.lineJoin='round';
  (D.striche||[]).forEach(s=>{ if(!s.p||s.p.length<1) return;
    g.strokeStyle=s.c||'#1f2430'; g.lineWidth=(s.w||3)*W/600;
    g.beginPath(); s.p.forEach((q,i)=>{ const x=q[0]*W, y=q[1]*H; i?g.lineTo(x,y):g.moveTo(x,y); });
    if(s.p.length===1){ g.lineTo(s.p[0][0]*W+0.1,s.p[0][1]*H); } g.stroke(); });
  marken(); }

/* ---------- Marken, Linien und Beschriftungskästchen ---------- */
function marken(){ const box=$('box');
  [...box.querySelectorAll('.mk,.lb,.lin')].forEach(e=>e.remove());
  const W=box.clientWidth||400, H=box.clientHeight||300, bearb=D.edit!==false;
  (D.marken||[]).forEach(m=>{
    const px=m.x*W, py=m.y*H, lx=m.lx*W, ly=m.ly*H;
    const li=document.createElement('div'); li.className='lin';
    const dx=lx-px, dy=ly-py, len=Math.hypot(dx,dy);
    li.style.left=px+'px'; li.style.top=(py-1)+'px'; li.style.width=len+'px';
    li.style.transform='rotate('+Math.atan2(dy,dx)+'rad)'; box.appendChild(li);
    const p=document.createElement('div'); p.className='mk'; p.style.left=px+'px'; p.style.top=py+'px'; p.dataset.id=m.id;
    if(bearb) zieh(p,m,'punkt'); box.appendChild(p);
    const lb=document.createElement('div'); lb.className='lb'; lb.style.left=lx+'px'; lb.style.top=ly+'px'; lb.dataset.id=m.id;
    if(bearb){
      const inp=document.createElement('input'); inp.value=m.text||''; inp.placeholder='Beschriftung';
      inp.oninput=()=>{ m.text=inp.value; sync(); };
      inp.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter') inp.blur(); };
      inp.onpointerdown=e=>e.stopPropagation();
      const x=document.createElement('span'); x.className='x'; x.textContent='×'; x.title='Beschriftung entfernen';
      x.onpointerdown=e=>e.stopPropagation();
      x.onclick=()=>{ D.marken=D.marken.filter(q=>q!==m); delete D.zuord[m.id]; zeichnen(); sync(); };
      lb.append(inp,x); zieh(lb,m,'kasten');
    } else {
      const t=D.zuord[m.id];
      lb.textContent=t||'?';
      if(!t) lb.classList.add('leer');
      if(geprueft&&t) lb.classList.add(t===m.text?'ok':'falsch');
      lb.onclick=()=>{ if(gewaehlt!=null){ setzen(m.id,gewaehlt); return; }
        if(D.zuord[m.id]){ delete D.zuord[m.id]; geprueft=false; zeichnen(); poolBauen(); sync(); } };
    }
    box.appendChild(lb);
    /* Kästchen am Rand hineinschieben, damit nichts abgeschnitten wird */
    const br=box.getBoundingClientRect(), rr=lb.getBoundingClientRect();
    let sx=0, sy=0;
    if(rr.left<br.left+2) sx=br.left+2-rr.left; else if(rr.right>br.right-2) sx=br.right-2-rr.right;
    if(rr.top<br.top+2) sy=br.top+2-rr.top; else if(rr.bottom>br.bottom-2) sy=br.bottom-2-rr.bottom;
    if(sx||sy){ lb.style.left=(lx+sx)+'px'; lb.style.top=(ly+sy)+'px';
      const dx2=lx+sx-px, dy2=ly+sy-py;                 /* Linie nachführen */
      li.style.width=Math.hypot(dx2,dy2)+'px'; li.style.transform='rotate('+Math.atan2(dy2,dx2)+'rad)'; }
  });
}
/* Punkt oder Kästchen verschieben (nur im Bearbeiten-Modus) */
function zieh(el,m,was){ el.onpointerdown=e=>{ e.preventDefault(); e.stopPropagation();
  const box=$('box'), r=box.getBoundingClientRect();
  const mv=ev=>{ const x=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)), y=Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height));
    if(was==='punkt'){ m.x=x; m.y=y; } else { m.lx=x; m.ly=y; } zeichnen(); };
  const up=()=>{ removeEventListener('pointermove',mv,true); removeEventListener('pointerup',up,true); removeEventListener('pointercancel',up,true); sync(); };
  addEventListener('pointermove',mv,true); addEventListener('pointerup',up,true); addEventListener('pointercancel',up,true); }; }

/* ---------- Neue Marke setzen / malen ---------- */
let strich=null;
$('box').addEventListener('pointerdown',e=>{
  if(D.edit===false) return;
  const r=$('box').getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  if(malen){ strich={c:'#1f2430',w:3,p:[[x,y]]}; D.striche.push(strich); zeichnen(); return; }
  if(e.target.closest('.mk,.lb')) return;
  const m={id:uid(), x, y, lx:Math.min(0.94,x+0.18), ly:Math.max(0.06,y-0.12), text:''};
  D.marken.push(m); zeichnen(); sync();
  const inp=$('box').querySelector('.lb[data-id="'+m.id+'"] input'); if(inp) inp.focus();
});
addEventListener('pointermove',e=>{ if(!strich) return; const r=$('box').getBoundingClientRect();
  strich.p.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]); zeichnen(); },true);
['pointerup','pointercancel'].forEach(t=>addEventListener(t,()=>{ if(strich){ strich=null; sync(); } },true));

/* ---------- Benutzen-Modus: Beschriftungen zuordnen ---------- */
function mischen(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function poolBauen(){ const p=$('pool'); p.innerHTML='';
  if(D.edit!==false){ p.innerHTML='<span class="hint">Auf das Bild tippen setzt eine neue Beschriftung. Punkt und Kästchen lassen sich verschieben.</span>'; return; }
  const texte=(D.marken||[]).map(m=>m.text).filter(t=>t&&t.trim());
  if(!texte.length){ p.innerHTML='<span class="hint">Noch keine Beschriftungen angelegt.</span>'; return; }
  if(!pool.length||pool.length!==texte.length||texte.some(t=>pool.indexOf(t)<0)) pool=mischen(texte);
  const belegt={}; Object.values(D.zuord).forEach(t=>{ belegt[t]=(belegt[t]||0)+1; });
  const zaehler={};
  pool.forEach(t=>{ zaehler[t]=(zaehler[t]||0)+1;
    const c=document.createElement('div'); c.className='chip'; c.textContent=t;
    if(zaehler[t]<=(belegt[t]||0)) c.classList.add('weg');
    c.onclick=()=>{ gewaehlt=(gewaehlt===t)?null:t; poolBauen(); melden(gewaehlt?'„'+gewaehlt+'" gewählt – jetzt auf das passende Kästchen tippen.':''); };
    if(gewaehlt===t) c.classList.add('sel');
    chipZiehen(c,t); p.appendChild(c); }); }
function setzen(id,text){ D.zuord[id]=text; gewaehlt=null; geprueft=false; zeichnen(); poolBauen(); melden(''); sync(); }
/* Ziehen mit Finger oder Stift */
function chipZiehen(c,text){ c.onpointerdown=e=>{ if(c.classList.contains('weg')) return; e.preventDefault();
  const g=$('geist'); let zieht=false;
  const start={x:e.clientX,y:e.clientY};
  const mv=ev=>{ if(!zieht&&Math.hypot(ev.clientX-start.x,ev.clientY-start.y)<8) return;
    zieht=true; g.textContent=text; g.style.display='block'; g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
    const el=document.elementFromPoint(ev.clientX,ev.clientY); const lb=el&&el.closest?el.closest('.lb'):null;
    $('box').querySelectorAll('.lb').forEach(x=>x.classList.toggle('ziel',x===lb)); };
  const up=ev=>{ removeEventListener('pointermove',mv,true); removeEventListener('pointerup',up,true); removeEventListener('pointercancel',up,true);
    g.style.display='none'; $('box').querySelectorAll('.lb').forEach(x=>x.classList.remove('ziel'));
    if(!zieht) return;                                    /* kurzes Tippen: der Klick-Handler wählt aus */
    const el=document.elementFromPoint(ev.clientX,ev.clientY); const lb=el&&el.closest?el.closest('.lb'):null;
    if(lb&&lb.dataset.id) setzen(lb.dataset.id,text); };
  addEventListener('pointermove',mv,true); addEventListener('pointerup',up,true); addEventListener('pointercancel',up,true); }; }
function melden(t,cls){ $('msg').textContent=t||''; $('msg').className=cls||''; }
$('bPruef').onclick=()=>{ const mk=(D.marken||[]).filter(m=>m.text&&m.text.trim());
  if(!mk.length) return; const n=mk.filter(m=>D.zuord[m.id]===m.text).length;
  geprueft=true; zeichnen();
  melden(n===mk.length?('✓ Alle '+n+' Beschriftungen sitzen richtig.'):(n+' von '+mk.length+' richtig – die roten noch einmal ansehen.'), n===mk.length?'ok':'err'); };
$('bNeu').onclick=()=>{ D.zuord={}; geprueft=false; gewaehlt=null; pool=[]; zeichnen(); poolBauen(); melden(''); sync(); };
$('bLoes').onclick=()=>{ (D.marken||[]).forEach(m=>{ if(m.text&&m.text.trim()) D.zuord[m.id]=m.text; });
  geprueft=true; gewaehlt=null; zeichnen(); poolBauen(); melden('Lösung eingeblendet.','ok'); sync(); };

/* ---------- Bild, Zeichnung, Dateien ---------- */
$('bBild').onclick=()=>{ $('fBild').value=''; $('fBild').click(); };
$('fBild').onchange=function(){ const f=this.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ const im=new Image();
    im.onload=()=>{ const max=1200, r=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      D.bild=c.toDataURL('image/jpeg',0.78); D.ar=c.width/c.height; D.vorlage='';
      $('box').style.setProperty('--ar',D.ar);
      bildLaden(()=>{ zeichnen(); sync(); }); toast('Bild eingefügt'); };
    im.src=String(rd.result); };
  rd.readAsDataURL(f); };
$('bMalen').onclick=()=>{ malen=!malen; $('bMalen').classList.toggle('on',malen);
  melden(malen?'Malen: mit dem Stift auf dem Bild zeichnen. Noch einmal auf „Malen" tippen beendet es.':''); };
$('bUndo').onclick=()=>{ if(!(D.striche||[]).length){ toast('Nichts zurückzunehmen'); return; } D.striche.pop(); zeichnen(); sync(); };
$('bLeer').onclick=()=>{ if(!confirm('Bild und Zeichnung entfernen? Die Beschriftungen bleiben.')) return;
  D.bild=''; D.vorlage=''; D.striche=[]; D.ar=4/3; $('box').style.setProperty('--ar',D.ar); bildEl=null; zeichnen(); sync(); };
$('bSave').onclick=()=>{ const name=(prompt('Dateiname:', (D.titel||'beschriftung').replace(/[\\/:*?"<>|]+/g,'_'))||'').trim(); if(!name) return;
  const blob=new Blob([JSON.stringify(D)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name.replace(/\.json$/i,'')+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); toast('Gesichert'); };
$('bLoad').onclick=()=>{ $('fDatei').value=''; $('fDatei').click(); };
$('fDatei').onchange=function(){ const f=this.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(String(rd.result)); if(!o||!Array.isArray(o.marken)) throw new Error('x');
      uebernehmen(Object.assign({edit:D.edit},o)); sync(); toast('Geladen: '+f.name); }
    catch(e){ toast('Die Datei passt nicht zu diesem Werkzeug'); } };
  rd.readAsText(f); };

/* ---------- Vorlagen ---------- */
function vorlagen(){ const l=$('vListe'); l.innerHTML='';
  (window.TafelBeschriftVorlagen||[]).forEach(v=>{ const d=document.createElement('div'); d.className='v';
    const c=document.createElement('canvas'); c.width=252; c.height=189;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,252,189); v.zeichne(g,252,189);
    const t=document.createElement('div'); t.className='t';
    t.innerHTML='<b>'+v.name+'</b><small>'+v.marken.length+' Beschriftungen · '+v.fach+'</small>';
    d.append(c,t); d.onclick=()=>{ nimmVorlage(v); $('vorl').classList.remove('show'); }; l.appendChild(d); }); }
function nimmVorlage(v){ D.vorlage=v.id; D.bild=''; D.striche=[]; D.ar=4/3; D.titel=v.name;
  D.marken=v.marken.map(m=>({id:uid(),x:m[0],y:m[1],lx:m[2],ly:m[3],text:m[4]}));
  D.zuord={}; pool=[]; geprueft=false; bildEl=null;
  $('titel').value=D.titel; $('box').style.setProperty('--ar',D.ar);
  zeichnen(); poolBauen(); sync(); toast('Vorlage „'+v.name+'" geladen'); }
$('bVorl').onclick=()=>{ vorlagen(); $('vorl').classList.add('show'); };
$('vZu').onclick=()=>$('vorl').classList.remove('show');
$('vorl').onclick=e=>{ if(e.target.id==='vorl') $('vorl').classList.remove('show'); };

/* ---------- Schrift, Zustand, Tafel-Anbindung ---------- */
for(const [id,d] of [['fsM',-1],['fsP',1]]) $(id).onclick=()=>{ D.fontSize=Math.max(10,Math.min(34,(D.fontSize||16)+d)); schrift(); zeichnen(); sync(); };
$('titel').oninput=()=>{ D.titel=$('titel').value; sync(); };
function modusUI(){ const bearb=D.edit!==false;
  $('bar2').hidden=bearb;
  document.body.classList.toggle('nurBenutzen',!bearb);     /* blendet die Bearbeiten-Leiste aus */
  if(window.TafelModus) TafelModus.refresh(); }
function uebernehmen(d){ D=Object.assign(D,d);
  if(!Array.isArray(D.marken)) D.marken=[]; if(!Array.isArray(D.striche)) D.striche=[];
  if(!D.zuord||typeof D.zuord!=='object') D.zuord={};
  D.marken.forEach(m=>{ if(!m.id) m.id=uid(); });
  $('titel').value=D.titel||''; $('box').style.setProperty('--ar',D.ar||4/3);
  schrift(); modusUI(); pool=[]; geprueft=false;
  bildLaden(()=>{ zeichnen(); poolBauen(); }); }
function sync(){ if(window.parent===window||!ready) return;
  try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
addEventListener('message',e=>{ if(e.source!==window&&(window.parent===window||e.source!==window.parent)) return;
  if(e.data&&e.data.type==='embed-data'&&e.data.data) uebernehmen(e.data.data); });
addEventListener('resize',()=>{ zeichnen(); });
if(window.ResizeObserver) new ResizeObserver(()=>zeichnen()).observe($('box'));

if(window.TafelShot) TafelShot.buttons($('shotBtns'),()=>TafelShot.rasterize($('stage'),{pad:8}),'btn');
if(window.TafelTeilen&&!TafelTeilen.istGeteilt())
  TafelTeilen.knopf($('teilenBtn'),'beschriften.html',()=>{
    const d=Object.assign({},D,{zuord:{},edit:false});
    if(d.bild&&d.bild.length>60000){ d.bild=''; toast('Das eingefügte Bild ist zu groß für einen QR-Code – geteilt wird die Aufgabe ohne Bild.'); }
    return {w:'bes', d}; },{cls:'btn'});

window.addEventListener('load',()=>{
  const geteilt=window.TafelTeilen&&TafelTeilen.istGeteilt();
  schrift(); modusUI(); zeichnen(); poolBauen();
  if(geteilt){ D.edit=false; ready=true; modusUI();
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='bes'&&p.d){ p.d.edit=false; uebernehmen(p.d); } })
      .catch(()=>{}).then(()=>TafelTeilen.nurBenutzen('#shotBtns'));
    return; }
  if(window.TafelModus) TafelModus.init({get:()=>D.edit!==false, set:v=>{ D.edit=v; modusUI(); pool=[]; geprueft=false; zeichnen(); poolBauen(); sync(); }});
  if(window.parent===window){ ready=true; return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  setTimeout(()=>{ ready=true; },700); });
</script>
</body></html>
