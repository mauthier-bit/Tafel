<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Tabelle</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  #bar{flex:none;display:flex;flex-direction:column;gap:4px;padding:5px 7px;border-bottom:1px solid #e2e7ef;font-size:13px;}
  #bar.aus{display:none;}
  .zeile{display:flex;gap:5px;align-items:center;white-space:nowrap;overflow-x:auto;overflow-y:hidden;
         -webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  .zeile>*{flex:0 0 auto;}
  .zeile::-webkit-scrollbar{height:4px;} .zeile::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  .grow{flex:1 1 auto!important;min-width:2px;}
  .sep{width:1px;align-self:stretch;background:#e2e7ef;margin:0 2px;}
  .lbl{color:#64748b;font-weight:600;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:8px;padding:4px 9px;font:inherit;font-weight:600;color:#1f2430;cursor:pointer;}
  .btn.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  .stp{display:inline-flex;align-items:center;gap:3px;}
  .stp button{border:1px solid #cfd6e0;background:#fff;border-radius:7px;width:26px;height:26px;font:inherit;font-weight:700;cursor:pointer;}
  .stp .val{min-width:22px;text-align:center;font-weight:700;}
  .seg{display:inline-flex;background:#eef1f6;border-radius:8px;padding:2px;gap:2px;}
  .seg button{border:none;background:transparent;border-radius:6px;padding:3px 8px;font:inherit;font-weight:600;color:#475569;cursor:pointer;}
  .seg button.on{background:#fff;color:#1f2430;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .sw{width:22px;height:22px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px #cfd6e0;cursor:pointer;padding:0;}
  .sw.on{box-shadow:0 0 0 2px #2563eb;}
  #barBtn{position:absolute;right:4px;top:4px;z-index:5;border:1px solid #cfd6e0;background:rgba(255,255,255,.9);border-radius:7px;
          width:24px;height:22px;font:700 12px -apple-system,sans-serif;color:#64748b;cursor:pointer;display:none;}
  #wrap{flex:1;min-height:0;overflow:auto;position:relative;}
  table{border-collapse:collapse;width:100%;height:100%;table-layout:fixed;}
  td{border:var(--bw,1px) solid var(--bc,#9aa7b8);padding:0;}
  td.noTop{border-top:0;} td.noBottom{border-bottom:0;} td.noLeft{border-left:0;} td.noRight{border-right:0;}
  input{width:100%;height:100%;min-height:30px;border:0;text-align:var(--ta,center);font-size:var(--fs,15px);font-weight:var(--fw,400);
        font-style:var(--fi,normal);font-family:inherit;background:transparent;padding:5px 4px;color:inherit;}
  input:focus{outline:2px solid #3b82f6;outline-offset:-2px;}
  td.kopf{background:#eef2f7;}
  td.kopf input{font-weight:var(--fwh,700);}   /* colgroup steht vor den Zeilen – :first-child greift hier nicht */
  td.spalte1{background:#f5f7fa;}
</style>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="zeile">
      <span class="lbl">Zeilen</span><span class="stp" id="stRows"></span>
      <span class="lbl">Spalten</span><span class="stp" id="stCols"></span>
      <span class="sep"></span>
      <span class="lbl" id="lblSel">Spalte 1</span>
      <span class="lbl">breiter</span><span class="stp" id="stColW"></span>
      <span class="lbl">höher</span><span class="stp" id="stRowH"></span>
      <button class="btn" id="bEven">gleich verteilen</button>
      <span class="grow"></span>
      <button class="btn" id="bHide" title="Bedienzeilen ausblenden">▲</button>
    </div>
    <div class="zeile">
      <span class="lbl">Schrift</span>
      <button class="btn" id="fsM">A−</button><button class="btn" id="fsP">A+</button>
      <button class="btn" id="bBold"><b>F</b></button><button class="btn" id="bItal"><i>K</i></button>
      <span class="seg" id="segAlign"></span>
      <span class="sep"></span>
      <span class="lbl">Rand</span><span class="stp" id="stLine"></span><span class="seg" id="segBorder"></span>
      <span class="sep"></span>
      <span class="lbl">Füllung</span><span class="seg" id="segScope"></span><span id="fills"></span>
      <button class="btn" id="bKopf">Kopfzeile</button>
      <button class="btn" id="bSp1">1. Spalte</button>
      <span class="sep"></span>
      <button class="btn" id="bImg">🖼 Bild</button>
      <button class="btn" id="bCopy">📋</button>
    </div>
  </div>
  <div id="wrap"><button id="barBtn" title="Bedienzeile einblenden">▾</button><table id="tbl"></table></div>
</div>
<script src="shot.js"></script>
<script src="modus.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const toast=m=>window.TafelShot&&TafelShot.toast(m);
const FILLS=['','#fef3c7','#dcfce7','#dbeafe','#fee2e2','#ede9fe','#e2e8f0'];
let data={ rows:3, cols:3, cells:{}, fill:{}, colw:[], rowh:[], fontSize:15, lineWidth:1, fontBold:false, fontItalic:false,
           align:'center', border:'alle', kopf:true, sp1:false, scope:'zelle', bar:true };
let aktiv=null;                                          /* zuletzt angetippte Zelle */
const allein=()=>window.parent===window;
const key=(r,c)=>r+'_'+c;
function applyStil(){
  const s=document.documentElement.style;
  s.setProperty('--fs',(data.fontSize||15)+'px');
  s.setProperty('--bw',(data.lineWidth||1)+'px');
  s.setProperty('--bc',(data.lineWidth||1)>0?'#9aa7b8':'transparent');
  s.setProperty('--fw',data.fontBold?'700':'400');
  s.setProperty('--fwh',data.fontBold?'900':'700');
  s.setProperty('--fi',data.fontItalic?'italic':'normal');
  s.setProperty('--ta',data.align||'center');
}
function build(){
  applyStil();
  const rows=Math.max(1,Math.min(30,data.rows||3)), cols=Math.max(1,Math.min(20,data.cols||3));
  data.rows=rows; data.cols=cols;
  const tbl=$('tbl'); tbl.innerHTML='';
  const cw=[], rh=[];                                    /* Gewichte der Spalten und Zeilen */
  for(let c=0;c<cols;c++) cw.push(Math.max(0.3,+data.colw[c]||1));
  for(let r=0;r<rows;r++) rh.push(Math.max(0.3,+data.rowh[r]||1));
  data.colw=cw; data.rowh=rh;
  const cwSum=cw.reduce((a,b)=>a+b,0), rhSum=rh.reduce((a,b)=>a+b,0);
  const cg=document.createElement('colgroup');
  cw.forEach(w=>{ const col=document.createElement('col'); col.style.width=(100*w/cwSum)+'%'; cg.appendChild(col); });
  tbl.appendChild(cg);
  for(let r=0;r<rows;r++){
    const tr=document.createElement('tr');
    tr.style.height=(100*rh[r]/rhSum)+'%';
    for(let c=0;c<cols;c++){
      const td=document.createElement('td');
      if(data.border==='aussen'){ if(r>0) td.classList.add('noTop'); if(c>0) td.classList.add('noLeft');
        if(r<rows-1) td.classList.add('noBottom'); if(c<cols-1) td.classList.add('noRight'); }
      if(data.border==='zeilen'){ if(c>0) td.classList.add('noLeft'); if(c<cols-1) td.classList.add('noRight'); }
      if(data.border==='keine'){ td.classList.add('noTop'); td.classList.add('noLeft'); td.classList.add('noBottom'); td.classList.add('noRight'); }
      if(r===0&&data.kopf) td.classList.add('kopf');
      if(c===0&&data.sp1) td.classList.add('spalte1');
      const f=data.fill[key(r,c)]; if(f) td.style.background=f;
      const inp=document.createElement('input');
      inp.value=data.cells[key(r,c)]||''; inp.dataset.r=r; inp.dataset.c=c;
      inp.addEventListener('input',()=>{ const k=key(r,c); if(inp.value) data.cells[k]=inp.value; else delete data.cells[k]; sync(); });
      inp.addEventListener('focus',()=>{ aktiv={r,c}; renderBar(); });
      td.appendChild(inp); tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
}
/* ---------- Bedienzeile ---------- */
function stepper(el,get,set,min,max){
  el.innerHTML='';
  const mk=(t,d)=>{ const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ const v=Math.max(min,Math.min(max,get()+d)); set(v); renderBar(); build(); sync(); }; el.appendChild(b); };
  mk('−',-1);
  const v=document.createElement('span'); v.className='val'; v.textContent=get(); el.appendChild(v);
  mk('+',1);
}
function breite(el,get,set){                             /* Gewicht der Spalte bzw. Zeile */
  el.innerHTML='';
  const mk=(t,f)=>{ const b=document.createElement('button'); b.textContent=t;
    b.onclick=()=>{ set(Math.max(0.3,Math.min(6,Math.round(get()*f*10)/10))); renderBar(); build(); sync(); }; el.appendChild(b); };
  mk('−',1/1.25);
  const v=document.createElement('span'); v.className='val'; v.textContent=(get()||1).toFixed(1).replace('.',','); el.appendChild(v);
  mk('+',1.25);
}
function seg(el,opts,get,set){
  el.innerHTML='';
  opts.forEach(([t,val])=>{ const b=document.createElement('button'); b.textContent=t; b.className=(get()===val)?'on':'';
    b.onclick=()=>{ set(val); renderBar(); build(); sync(); }; el.appendChild(b); });
}
function renderBar(){
  stepper($('stRows'),()=>data.rows,v=>data.rows=v,1,30);
  stepper($('stCols'),()=>data.cols,v=>data.cols=v,1,20);
  const z=aktiv||{r:0,c:0};
  $('lblSel').textContent='Spalte '+(z.c+1)+' · Zeile '+(z.r+1);
  breite($('stColW'),()=>data.colw[z.c]||1,v=>data.colw[z.c]=v);
  breite($('stRowH'),()=>data.rowh[z.r]||1,v=>data.rowh[z.r]=v);
  stepper($('stLine'),()=>data.lineWidth,v=>data.lineWidth=v,0,6);
  seg($('segAlign'),[['⟵','left'],['↔','center'],['⟶','right']],()=>data.align,v=>data.align=v);
  seg($('segBorder'),[['alle','alle'],['außen','aussen'],['Zeilen','zeilen'],['keine','keine']],()=>data.border,v=>data.border=v);
  seg($('segScope'),[['Zelle','zelle'],['Zeile','zeile'],['Spalte','spalte'],['Tabelle','alles']],()=>data.scope,v=>data.scope=v);
  const box=$('fills'); box.innerHTML='';
  FILLS.forEach(f=>{ const b=document.createElement('button'); b.className='sw'; b.title=f?'Füllfarbe':'keine Füllung';
    b.style.background=f||'#fff';
    if(!f) b.style.backgroundImage='linear-gradient(45deg,transparent 45%,#ef4444 45%,#ef4444 55%,transparent 55%)';
    b.onclick=()=>fuelle(f); box.appendChild(b); });
  $('bBold').classList.toggle('on',!!data.fontBold);
  $('bItal').classList.toggle('on',!!data.fontItalic);
  $('bKopf').classList.toggle('on',!!data.kopf);
  $('bSp1').classList.toggle('on',!!data.sp1);
}
function fuelle(f){
  const z=aktiv||{r:0,c:0};
  const setz=(r,c)=>{ const k=key(r,c); if(f) data.fill[k]=f; else delete data.fill[k]; };
  if(data.scope==='zelle') setz(z.r,z.c);
  else if(data.scope==='zeile'){ for(let c=0;c<data.cols;c++) setz(z.r,c); }
  else if(data.scope==='spalte'){ for(let r=0;r<data.rows;r++) setz(r,z.c); }
  else { data.fill={}; if(f) for(let r=0;r<data.rows;r++) for(let c=0;c<data.cols;c++) setz(r,c); }
  build(); sync();
  if(!aktiv&&data.scope!=='alles') toast('Zuerst eine Zelle antippen, dann färben');
}
for(const [id,d] of [['fsM',-1],['fsP',1]]) $(id).onclick=()=>{ data.fontSize=Math.max(8,Math.min(48,(data.fontSize||15)+d*2)); build(); sync(); };
$('bBold').onclick=()=>{ data.fontBold=!data.fontBold; renderBar(); build(); sync(); };
$('bItal').onclick=()=>{ data.fontItalic=!data.fontItalic; renderBar(); build(); sync(); };
$('bKopf').onclick=()=>{ data.kopf=!data.kopf; renderBar(); build(); sync(); };
$('bSp1').onclick=()=>{ data.sp1=!data.sp1; renderBar(); build(); sync(); };
$('bEven').onclick=()=>{ data.colw=[]; data.rowh=[]; renderBar(); build(); sync(); toast('Spalten und Zeilen gleich verteilt'); };
$('bHide').onclick=()=>{ data.bar=false; zeigeBar(); sync(); };
$('barBtn').onclick=()=>{ data.bar=true; zeigeBar(); sync(); };
function zeigeBar(){ const an=(data.edit!==false)&&data.bar!==false;
  $('bar').classList.toggle('aus',!an);
  $('barBtn').style.display=((data.edit!==false)&&data.bar===false)?'block':'none';
  if(window.TafelModus) TafelModus.refresh(); }
const shot=()=>TafelShot.rasterize($('app'),{exclude:'#bar,#barBtn',pad:4});
$('bImg').onclick=()=>TafelShot.toBoard(shot());
$('bCopy').onclick=()=>TafelShot.copy(shot());
/* ---------- Tafel-Anbindung ---------- */
function sync(){ if(window.parent===window) return;
  try{ parent.postMessage({type:'embed-data',data},'*'); }catch(e){} }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return;
  if(e.data&&e.data.type==='embed-data'&&e.data.data){ const d=e.data.data;
    data={ rows:d.rows||3, cols:d.cols||3, cells:d.cells||{}, fill:d.fill||{},
           colw:Array.isArray(d.colw)?d.colw:[], rowh:Array.isArray(d.rowh)?d.rowh:[], fontSize:d.fontSize||15,
           lineWidth:(d.lineWidth===undefined?1:d.lineWidth), fontBold:!!d.fontBold, fontItalic:!!d.fontItalic,
           align:d.align||'center', border:d.border||'alle', kopf:d.kopf!==false, sp1:!!d.sp1,
           scope:d.scope||'zelle', bar:d.bar!==false, edit:d.edit!==false };   /* ohne Angabe gilt: bearbeiten (so sieht es auch die Tafel) */
    zeigeBar(); renderBar(); build(); } });
window.addEventListener('load',()=>{
  if(allein()) data.edit=true;
  if(window.TafelModus) TafelModus.init({get:()=>data.edit!==false, set:v=>{ data.edit=v; zeigeBar(); sync(); }, after:()=>zeigeBar()});

  try{ if(window.parent!==window) parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
