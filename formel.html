<!DOCTYPE html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formel umstellen</title>
<style>
  :root{--fs:15px;}
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;font-size:var(--fs);}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  #bar{display:flex;gap:4px;padding:6px;border-bottom:1px solid #e2e7ef;align-items:center;flex:none;overflow:hidden;}
  #barL,#barR{display:flex;gap:4px;align-items:center;flex:none;}
  #barMid{display:flex;gap:4px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:0 2px;}
  #bar.compact #barL .tb span,#bar.compact #barR .tb span{display:none;}
  .tb{flex:none;min-width:52px;height:50px;border:1px solid #d6dce5;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 5px;color:#1f2430;font:inherit;}
  .tb svg{width:32px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tb span{font-size:.7em;font-weight:600;white-space:nowrap;}
  .tb.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .sep{width:1px;align-self:stretch;background:#e2e7ef;margin:0 3px;flex:none;}
  #bar2{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid #e2e7ef;align-items:center;flex-wrap:nowrap;flex:none;min-height:44px;font-size:.92em;overflow-x:auto;overflow-y:hidden;}
  #bar2>*{flex:0 0 auto;}
  .lbl{color:#64748b;font-weight:600;} .grow{flex:1 1 auto!important;min-width:4px;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:5px 10px;font:inherit;font-weight:600;color:#1f2430;cursor:pointer;white-space:nowrap;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.red{color:#dc2626;border-color:#fca5a5;}
  #main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 20px;}
  .card{border:1px solid #e2e7ef;border-radius:14px;padding:12px 14px;margin:0 auto 12px;max-width:900px;background:#fff;}
  .card h3{margin:0 0 8px;font-size:1.02em;color:#42506a;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .fin{flex:1 1 220px;min-width:180px;border:1px solid #cfd6e0;border-radius:10px;padding:9px 11px;font:inherit;font-size:1.08em;}
  .chip{border:1px solid #cfd6e0;background:#f8fafc;border-radius:999px;padding:5px 11px;font:inherit;cursor:pointer;white-space:nowrap;}
  .chip.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .vbtn{border:2px solid #cfd6e0;background:#fff;border-radius:10px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer;min-width:44px;}
  .vbtn.on{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;}
  .m{font-family:"Cambria Math",Cambria,Georgia,"Times New Roman",serif;}
  .m i,.va{font-style:italic;}
  .gl{font-size:1.25em;line-height:2.1;}
  .schritt{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed #edf1f7;flex-wrap:wrap;}
  .schritt .nr{color:#94a3b8;font-size:.8em;min-width:20px;}
  .schritt .gl2{flex:1 1 220px;}
  .schritt .why{color:#2563eb;font-weight:600;font-size:.86em;white-space:nowrap;}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em;}
  .frac>span:last-child{padding:0 .25em;}
  .erg{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:9px 12px;font-size:1.1em;}
  .fehler{background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:9px 12px;color:#b91c1c;}
  .hinw{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 11px;color:#92400e;font-size:.92em;margin-top:8px;}
  .hint{color:#64748b;font-size:.9em;}
  table.wt{border-collapse:collapse;}
  table.wt td{padding:3px 6px;}
  table.wt input{width:110px;border:1px solid #cfd6e0;border-radius:8px;padding:5px 7px;font:inherit;text-align:right;}
  .einh{color:#64748b;}
  details.kat{margin-top:8px;}
  details.kat>summary{cursor:pointer;font-weight:700;color:#42506a;padding:4px 0;}
</style>
</head><body>
<div id="wrap">
  <div id="bar"><div id="barL">
    <button class="tb" id="bNeu" title="Eingabe leeren"><svg viewBox="0 0 32 20"><path d="M11 2h10l3 3v13H11Z M17 8v7M13.5 11.5h7"/></svg><span>Neu</span></button>
    <span class="sep"></span>
    </div><div id="barMid"></div><div id="barR"><span class="sep"></span>
    <button class="tb" id="bPrint" title="Rechenweg drucken"><svg viewBox="0 0 32 20"><path d="M10 7V2h12v5 M10 15H7V7h18v8h-3 M10 12h12v6H10Z"/></svg><span>Drucken</span></button>
  </div></div>
  <div id="bar2"></div>
  <div id="main">
    <div class="card">
      <h3>1 · Formel</h3>
      <div class="row">
        <input class="fin m" id="fin" placeholder="z. B. F = m · a" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn pri" id="bGo">Übernehmen ▸</button>
      </div>
      <div class="hint" style="margin-top:6px">Malpunkt <b>·</b> oder <b>*</b>, geteilt <b>/</b>, hoch <b>^</b>, Wurzel <b>sqrt( )</b>, Kreiszahl <b>pi</b>.
        Indizes mit Unterstrich: <b>v_0</b>. Buchstaben ohne Malpunkt (<b>ma</b>) gelten als <i>eine</i> Größe.</div>
      <div id="vorlagen"></div>
    </div>
    <div class="card" id="cardZiel" hidden>
      <h3>2 · Wonach soll aufgelöst werden?</h3>
      <div class="row" id="vars"></div>
    </div>
    <div class="card" id="cardWeg" hidden>
      <h3>3 · Rechenweg</h3>
      <div id="weg"></div>
      <div id="ergebnis"></div>
    </div>
    <div class="card" id="cardWerte" hidden>
      <h3>4 · Werte einsetzen</h3>
      <div class="hint" style="margin-bottom:6px">Trage die bekannten Größen ein – das Ergebnis wird ausgerechnet.</div>
      <table class="wt" id="wt"></table>
      <div id="rechnung" style="margin-top:10px"></div>
    </div>
  </div>
</div>
<script src="shot.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="teilen.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const toast=m=>window.TafelShot&&TafelShot.toast(m);

/* ================= Formelsammlung ================= */
const VORLAGEN=[
 ['Mechanik',[
   ['Geschwindigkeit','v = s / t',{v:'m/s',s:'m',t:'s'}],
   ['Beschleunigung','a = ( v - v_0 ) / t',{a:'m/s²',v:'m/s',v_0:'m/s',t:'s'}],
   ['Weg bei gleichmäßiger Beschleunigung','s = 0,5 · a · t^2',{s:'m',a:'m/s²',t:'s'}],
   ['Kraft','F = m · a',{F:'N',m:'kg',a:'m/s²'}],
   ['Gewichtskraft','F_G = m · g',{F_G:'N',m:'kg',g:'m/s²'}],
   ['Dichte','rho = m / V',{rho:'kg/m³',m:'kg',V:'m³'}],
   ['Druck','p = F / A',{p:'Pa',F:'N',A:'m²'}],
   ['Schweredruck','p = rho · g · h',{p:'Pa',rho:'kg/m³',g:'m/s²',h:'m'}],
   ['Arbeit','W = F · s',{W:'J',F:'N',s:'m'}],
   ['Leistung','P = W / t',{P:'W',W:'J',t:'s'}],
   ['Wirkungsgrad','eta = W_ab / W_zu',{eta:'',W_ab:'J',W_zu:'J'}],
   ['Lageenergie','E = m · g · h',{E:'J',m:'kg',g:'m/s²',h:'m'}],
   ['Bewegungsenergie','E = 0,5 · m · v^2',{E:'J',m:'kg',v:'m/s'}],
   ['Federkraft','F = D · s',{F:'N',D:'N/m',s:'m'}],
   ['Hebelgesetz','F_1 · l_1 = F_2 · l_2',{F_1:'N',l_1:'m',F_2:'N',l_2:'m'}],
   ['Impuls','p = m · v',{p:'kg·m/s',m:'kg',v:'m/s'}]
 ]],
 ['Elektrizität',[
   ['Ohmsches Gesetz','U = R · I',{U:'V',R:'Ω',I:'A'}],
   ['Elektrische Leistung','P = U · I',{P:'W',U:'V',I:'A'}],
   ['Elektrische Arbeit','W = P · t',{W:'J',P:'W',t:'s'}],
   ['Ladung','Q = I · t',{Q:'C',I:'A',t:'s'}],
   ['Widerstand eines Drahtes','R = rho · l / A',{R:'Ω',rho:'Ω·mm²/m',l:'m',A:'mm²'}],
   ['Kondensator','Q = C · U',{Q:'C',C:'F',U:'V'}]
 ]],
 ['Wärme',[
   ['Wärmemenge','Q = c · m · ( T_2 - T_1 )',{Q:'J',c:'J/(kg·K)',m:'kg',T_2:'K',T_1:'K'}],
   ['Schmelzwärme','Q = q_s · m',{Q:'J',q_s:'J/kg',m:'kg'}],
   ['Längenausdehnung','l = l_0 · ( 1 + alpha · dT )',{l:'m',l_0:'m',alpha:'1/K',dT:'K'}]
 ]],
 ['Geometrie',[
   ['Rechteck','A = a · b',{A:'cm²',a:'cm',b:'cm'}],
   ['Dreieck','A = 0,5 · g · h',{A:'cm²',g:'cm',h:'cm'}],
   ['Kreisfläche','A = pi · r^2',{A:'cm²',r:'cm'}],
   ['Kreisumfang','U = 2 · pi · r',{U:'cm',r:'cm'}],
   ['Quader','V = a · b · c',{V:'cm³',a:'cm',b:'cm',c:'cm'}],
   ['Zylinder','V = pi · r^2 · h',{V:'cm³',r:'cm',h:'cm'}],
   ['Pyramide','V = A_G · h / 3',{V:'cm³',A_G:'cm²',h:'cm'}],
   ['Kugelvolumen','V = 4 / 3 · pi · r^3',{V:'cm³',r:'cm'}],
   ['Satz des Pythagoras','c^2 = a^2 + b^2',{a:'cm',b:'cm',c:'cm'}]
 ]],
 ['Mathematik',[
   ['Geradengleichung','y = m · x + b',{}],
   ['Prozentwert','W = G · p / 100',{}],
   ['Zinsen','Z = K · p · t / ( 100 · 12 )',{}],
   ['Mittelwert aus zwei Zahlen','m = ( a + b ) / 2',{}],
   ['Quadratische Ergänzung (Scheitel)','y = a · ( x - d )^2 + e',{}]
 ]]
];

/* ================= Parser ================= */
const GRIECH={alpha:'α',beta:'β',gamma:'γ',delta:'δ',dT:'ΔT',eta:'η',theta:'θ',lambda:'λ',mu:'μ',rho:'ρ',sigma:'σ',tau:'τ',phi:'φ',omega:'ω',pi:'π'};
const FKT=['sqrt','sin','cos','tan','asin','acos','atan','ln','log','exp','abs'];
function tokens(s){
  const t=[]; let i=0; s=String(s).replace(/−/g,'-').replace(/·/g,'*').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
  while(i<s.length){ const c=s[i];
    if(/\s/.test(c)){ i++; continue; }
    if('+-*/^()='.includes(c)){ t.push({k:c}); i++; continue; }
    if(/[0-9.]/.test(c)){ let j=i; while(j<s.length&&/[0-9.]/.test(s[j]))j++; t.push({k:'num',v:parseFloat(s.slice(i,j))}); i=j; continue; }
    if(/[A-Za-zα-ωΑ-Ω]/.test(c)){ let j=i; while(j<s.length&&/[A-Za-zα-ωΑ-Ω0-9_]/.test(s[j]))j++;
      t.push({k:'name',v:s.slice(i,j)}); i=j; continue; }
    throw new Error('Zeichen „'+c+'“ verstehe ich nicht');
  }
  /* implizite Multiplikation: 2x, 2(…), )(, )x, x( bei Funktionen ausgenommen */
  const out=[];
  for(let q=0;q<t.length;q++){ out.push(t[q]); const a=t[q], b=t[q+1]; if(!b) continue;
    const aEnd=a.k==='num'||a.k===')'||(a.k==='name'&&!FKT.includes(a.v));
    const bStart=b.k==='num'||b.k==='name'||b.k==='(';
    if(aEnd&&bStart&&!(a.k==='num'&&b.k==='num')) out.push({k:'*'});
  }
  return out;
}
function parse(src){
  const t=tokens(src); let p=0;
  const peek=()=>t[p], next=()=>t[p++];
  function E(){ let v=T(); while(peek()&&(peek().k==='+'||peek().k==='-')){ const o=next().k; const r=T();
      v={k:o==='+'?'add':'sub',a:v,b:r}; } return v; }
  function T(){ let v=U(); while(peek()&&(peek().k==='*'||peek().k==='/')){ const o=next().k; const r=U();
      v={k:o==='*'?'mul':'div',a:v,b:r}; } return v; }
  function U(){ if(peek()&&(peek().k==='+'||peek().k==='-')){ const o=next().k; const v=U();
      return o==='-'?{k:'neg',a:v}:v; } return P(); }
  function P(){ let v=A(); if(peek()&&peek().k==='^'){ next(); const e=U(); v={k:'pow',a:v,b:e}; } return v; }
  function A(){ const tk=peek(); if(!tk) throw new Error('Die Formel ist unvollständig');
    if(tk.k==='num'){ next(); return {k:'num',v:tk.v}; }
    if(tk.k==='('){ next(); const v=E(); if(!peek()||peek().k!==')') throw new Error('Es fehlt eine schließende Klammer'); next(); return v; }
    if(tk.k==='name'){ next();
      if(FKT.includes(tk.v)){ if(!peek()||peek().k!=='(') throw new Error(tk.v+' braucht eine Klammer');
        next(); const a=E(); if(!peek()||peek().k!==')') throw new Error('Es fehlt eine schließende Klammer'); next();
        return {k:'fn',n:tk.v,a}; }
      if(tk.v==='pi') return {k:'num',v:Math.PI,pi:true};
      return {k:'var',n:tk.v}; }
    throw new Error('Unerwartetes Zeichen in der Formel');
  }
  const l=E();
  if(!peek()||peek().k!=='=') throw new Error('Die Formel braucht ein Gleichheitszeichen');
  next();
  const r=E();
  if(peek()) throw new Error('Nach der rechten Seite steht noch etwas');
  return {l,r};
}

/* ================= Anzeige ================= */
function varHTML(n){ const m=/^([A-Za-zα-ωΑ-Ω]+)_?(.*)$/.exec(n)||[];
  let basis=m[1]||n, idx=m[2]||'';
  if(GRIECH[basis]) basis=GRIECH[basis];
  return '<i>'+basis+'</i>'+(idx?'<sub>'+idx+'</sub>':'');
}
const zahlHTML=v=>{ if(Math.abs(v-Math.PI)<1e-12) return 'π';
  const r=Math.round(v*1e6)/1e6; return String(r).replace('.',','); };
function html(n,prio){
  prio=prio||0;
  const klammer=(s,p)=>p<prio?'('+s+')':s;
  switch(n.k){
    case 'num': return zahlHTML(n.v);
    case 'var': return varHTML(n.n);
    case 'neg': return klammer('−'+html(n.a,3),1);
    case 'add': return klammer(html(n.a,1)+' + '+html(n.b,1),1);
    case 'sub': return klammer(html(n.a,1)+' − '+html(n.b,2),1);
    case 'mul': return klammer(html(n.a,2)+' · '+html(n.b,2),2);
    case 'div': return '<span class="frac"><span>'+html(n.a,0)+'</span><span>'+html(n.b,0)+'</span></span>';
    case 'pow': return klammer(html(n.a,4)+'<sup>'+html(n.b,0)+'</sup>',3);
    case 'fn':  return n.n==='sqrt' ? '√<span style="border-top:1.4px solid currentColor;padding:0 .18em">'+html(n.a,0)+'</span>'
                : n.n+'('+html(n.a,0)+')';
  }
  return '?';
}
const glHTML=(g)=>'<span class="m">'+html(g.l,0)+' = '+html(g.r,0)+'</span>';

/* ================= Helfer ================= */
function vars(n,s){ s=s||new Set();
  if(!n) return s;
  if(n.k==='var') s.add(n.n);
  ['a','b'].forEach(k=>{ if(n[k]) vars(n[k],s); });
  return s;
}
const enthaelt=(n,x)=>vars(n).has(x);
function zaehle(n,x){ if(!n) return 0; if(n.k==='var') return n.n===x?1:0;
  return (n.a?zaehle(n.a,x):0)+(n.b?zaehle(n.b,x):0); }
function werte(n,w){
  switch(n.k){
    case 'num': return n.v;
    case 'var': { const v=w[n.n]; return (v===undefined||v===null||!isFinite(v))?NaN:v; }
    case 'neg': return -werte(n.a,w);
    case 'add': return werte(n.a,w)+werte(n.b,w);
    case 'sub': return werte(n.a,w)-werte(n.b,w);
    case 'mul': return werte(n.a,w)*werte(n.b,w);
    case 'div': return werte(n.a,w)/werte(n.b,w);
    case 'pow': return Math.pow(werte(n.a,w),werte(n.b,w));
    case 'fn': { const x=werte(n.a,w); const f={sqrt:Math.sqrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,
      asin:Math.asin,acos:Math.acos,atan:Math.atan,ln:Math.log,log:Math.log10,exp:Math.exp,abs:Math.abs}[n.n];
      return f?f(x):NaN; }
  }
  return NaN;
}
/* leichte Vereinfachung, damit die Schritte lesbar bleiben */
function vereinfache(n){
  if(!n||!n.k) return n;
  const a=n.a?vereinfache(n.a):null, b=n.b?vereinfache(n.b):null;
  const ist=(x,v)=>x&&x.k==='num'&&Math.abs(x.v-v)<1e-12;
  switch(n.k){
    case 'add': if(ist(a,0)) return b; if(ist(b,0)) return a; break;
    case 'sub': if(ist(b,0)) return a; break;
    case 'mul': if(ist(a,1)) return b; if(ist(b,1)) return a;
      if(ist(a,0)||ist(b,0)) return {k:'num',v:0}; break;
    case 'div': if(ist(b,1)) return a; break;
    case 'pow': if(ist(b,1)) return a; break;
  }
  if(a&&b&&a.k==='num'&&b.k==='num'&&!a.pi&&!b.pi){
    if(n.k==='div'){                                     /* Brüche wie 4/3 oder 1/3 bleiben stehen */
      const q=b.v!==0?a.v/b.v:NaN;
      if(Number.isInteger(q)) return {k:'num',v:q};
    } else {
      const v={add:a.v+b.v,sub:a.v-b.v,mul:a.v*b.v,pow:Math.pow(a.v,b.v)}[n.k];
      if(v!==undefined&&isFinite(v)) return {k:'num',v};
    }
  }
  const o={...n}; if(a) o.a=a; if(b) o.b=b; return o;
}

/* ================= Auflösen ================= */
function loese(gl,x){
  const schritte=[];
  let L=gl.l, R=gl.r;
  if(!enthaelt(L,x)&&!enthaelt(R,x)) return {fehler:'Die Größe '+varHTML(x)+' kommt in der Formel nicht vor.'};
  if(enthaelt(L,x)&&enthaelt(R,x)) return {fehler:'Die Größe '+varHTML(x)+' steht auf beiden Seiten – so lässt sich die Formel nicht Schritt für Schritt umstellen.',mehrfach:true};
  if(enthaelt(R,x)){ [L,R]=[R,L]; schritte.push({l:L,r:R,why:'Seiten tauschen'}); }
  if(zaehle(L,x)>1) return {fehler:'Die Größe '+varHTML(x)+' kommt mehrfach vor – dafür reicht reines Umstellen nicht.',mehrfach:true};

  let schutz=0;
  while(L.k!=='var'&&schutz++<40){
    const inA=L.a&&enthaelt(L.a,x), inB=L.b&&enthaelt(L.b,x);
    switch(L.k){
      case 'add':                                        /* x + T = R  →  x = R − T */
        if(inA){ R={k:'sub',a:R,b:L.b}; schritte.push({l:L.a,r:R,why:'− '+txt(L.b)}); L=L.a; }
        else    { R={k:'sub',a:R,b:L.a}; schritte.push({l:L.b,r:R,why:'− '+txt(L.a)}); L=L.b; }
        break;
      case 'sub':
        if(inA){ R={k:'add',a:R,b:L.b}; schritte.push({l:L.a,r:R,why:'+ '+txt(L.b)}); L=L.a; }
        else    {                                        /* T − x = R  →  x = T − R */
          const T=L.a; R={k:'sub',a:T,b:R}; schritte.push({l:L.b,r:R,why:'nach '+txt(L.b)+' auflösen'}); L=L.b; }
        break;
      case 'mul':                                        /* x · F = R  →  x = R / F */
        if(inA){ R={k:'div',a:R,b:L.b}; schritte.push({l:L.a,r:R,why:': '+txt(L.b)}); L=L.a; }
        else    { R={k:'div',a:R,b:L.a}; schritte.push({l:L.b,r:R,why:': '+txt(L.a)}); L=L.b; }
        break;
      case 'div':
        if(inA){ R={k:'mul',a:R,b:L.b}; schritte.push({l:L.a,r:R,why:'· '+txt(L.b)}); L=L.a; }
        else    {                                        /* T / x = R  →  x = T / R */
          const T=L.a; R={k:'div',a:T,b:R}; schritte.push({l:L.b,r:R,why:'· '+txt(L.b)+' und : '+txt(R)}); L=L.b; }
        break;
      case 'neg':
        R={k:'neg',a:R}; schritte.push({l:L.a,r:R,why:'· (−1)'}); L=L.a; break;
      case 'pow':
        if(inA){                                         /* x^n = R  →  x = n-te Wurzel */
          const n=L.b;
          if(n.k==='num'&&Math.abs(n.v-2)<1e-12){ R={k:'fn',n:'sqrt',a:R}; schritte.push({l:L.a,r:R,why:'√ (x > 0)'}); }
          else { R={k:'pow',a:R,b:{k:'div',a:{k:'num',v:1},b:n}}; schritte.push({l:L.a,r:R,why:txt(n)+'-te Wurzel'}); }
          L=L.a;
        } else {                                         /* a^x = R  →  x = log(R)/log(a) */
          R={k:'div',a:{k:'fn',n:'ln',a:R},b:{k:'fn',n:'ln',a:L.a}};
          schritte.push({l:L.b,r:R,why:'Logarithmus'}); L=L.b;
        }
        break;
      case 'fn': {
        const um={sqrt:['^2','quadrieren'],ln:['exp','e hoch beide Seiten'],log:['pow10','10 hoch beide Seiten'],
          exp:['ln','Logarithmus'],sin:['asin','arcsin'],cos:['acos','arccos'],tan:['atan','arctan']}[L.n];
        if(!um) return {fehler:'Die Funktion '+L.n+' kann ich nicht umkehren.'};
        if(um[0]==='^2') R={k:'pow',a:R,b:{k:'num',v:2}};
        else if(um[0]==='exp') R={k:'fn',n:'exp',a:R};
        else if(um[0]==='pow10') R={k:'pow',a:{k:'num',v:10},b:R};
        else R={k:'fn',n:um[0],a:R};
        schritte.push({l:L.a,r:R,why:um[1]}); L=L.a; break;
      }
      default: return {fehler:'Diese Formel kann ich nicht umstellen.'};
    }
    R=vereinfache(R);
    if(schritte.length) schritte[schritte.length-1].r=R;
  }
  if(L.k!=='var') return {fehler:'Diese Formel kann ich nicht umstellen.'};
  return {schritte,ergebnis:{l:L,r:R}};
}
function txt(n){ return '<span class="m">'+html(n,2)+'</span>'; }

/* ================= Zustand und Oberfläche ================= */
let D={ v:1, formel:'F = m · a', ziel:'', name:'Kraft', einh:{F:'N',m:'kg',a:'m/s²'},
  werte:{}, fontSize:15 };
let GL=null, LOES=null;

function renderVorlagen(){
  const box=$('vorlagen'); box.innerHTML='';
  VORLAGEN.forEach(([kat,liste])=>{
    const d=document.createElement('details'); d.className='kat';
    const s=document.createElement('summary'); s.textContent=kat; d.appendChild(s);
    const row=document.createElement('div'); row.className='row'; row.style.marginTop='4px';
    liste.forEach(([name,f,einh])=>{
      const c=document.createElement('button'); c.className='chip';
      c.innerHTML=name+' &nbsp;<span class="m" style="color:#64748b">'+vorschau(f)+'</span>';
      c.onclick=()=>{ D.formel=f; D.name=name; D.einh=einh||{}; D.ziel=''; D.werte={};
        $('fin').value=f; uebernehmen(); sync(); };
      row.appendChild(c);
    });
    d.appendChild(row); box.appendChild(d);
  });
}
function vorschau(f){ try{ return html(parse(f).l,0)+' = '+html(parse(f).r,0); }catch(e){ return f; } }

function uebernehmen(){
  const src=$('fin').value.trim();
  D.formel=src;
  $('cardZiel').hidden=true; $('cardWeg').hidden=true; $('cardWerte').hidden=true;
  if(!src) return;
  try{ GL=parse(src); }
  catch(e){ GL=null; $('cardWeg').hidden=false; $('weg').innerHTML='<div class="fehler">'+e.message+'</div>'; $('ergebnis').innerHTML=''; return; }
  const liste=[...vars(GL.l),...vars(GL.r)].filter((v,i,a)=>a.indexOf(v)===i);
  const box=$('vars'); box.innerHTML='';
  liste.forEach(n=>{ const b=document.createElement('button'); b.className='vbtn m'+(n===D.ziel?' on':'');
    b.innerHTML=varHTML(n)+(D.einh[n]?' <span class="einh" style="font-size:.8em">in '+D.einh[n]+'</span>':'');
    b.onclick=()=>{ D.ziel=n; aufloesen(); sync(); }; box.appendChild(b); });
  $('cardZiel').hidden=false;
  if(D.ziel&&liste.includes(D.ziel)) aufloesen(); else { D.ziel=''; }
  renderBar2();
}

function aufloesen(){
  if(!GL||!D.ziel) return;
  [...$('vars').children].forEach(b=>b.classList.toggle('on',b.textContent.startsWith('')&&b.innerHTML.includes(varHTML(D.ziel))));
  LOES=loese(GL,D.ziel);
  const weg=$('weg'); weg.innerHTML=''; $('ergebnis').innerHTML='';
  $('cardWeg').hidden=false;
  const kopf=document.createElement('div'); kopf.className='gl'; kopf.innerHTML=glHTML(GL);
  weg.appendChild(kopf);
  if(LOES.fehler){
    weg.insertAdjacentHTML('beforeend','<div class="fehler" style="margin-top:8px">'+LOES.fehler+'</div>');
    if(LOES.mehrfach) weg.insertAdjacentHTML('beforeend',
      '<div class="hinw">Wenn alle anderen Größen bekannt sind, kann das Werkzeug die Gleichung trotzdem <b>numerisch</b> lösen – trage die Werte unten ein.</div>');
    $('cardWerte').hidden=false; renderWerte(); return;
  }
  LOES.schritte.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='schritt';
    d.innerHTML='<span class="nr">'+(i+1)+'.</span><span class="gl2 m">'+html(s.l,0)+' = '+html(s.r,0)+'</span><span class="why">| '+s.why+'</span>';
    weg.appendChild(d);
  });
  $('ergebnis').innerHTML='<div class="erg m" style="margin-top:10px">'+html(LOES.ergebnis.l,0)+' = '+html(LOES.ergebnis.r,0)+'</div>';
  $('cardWerte').hidden=false; renderWerte();
}

function renderWerte(){
  const t=$('wt'); t.innerHTML='';
  if(!GL) return;
  const liste=[...vars(GL.l),...vars(GL.r)].filter((v,i,a)=>a.indexOf(v)===i);
  liste.forEach(n=>{
    if(n===D.ziel) return;
    const tr=document.createElement('tr');
    const td1=document.createElement('td'); td1.className='m'; td1.innerHTML=varHTML(n)+' =';
    const td2=document.createElement('td');
    const i=document.createElement('input'); i.inputMode='decimal'; i.value=D.werte[n]==null?'':D.werte[n];
    i.oninput=()=>{ D.werte[n]=i.value; rechne(); sync(); };
    td2.appendChild(i);
    const td3=document.createElement('td'); td3.className='einh'; td3.textContent=D.einh[n]||'';
    tr.append(td1,td2,td3); t.appendChild(tr);
  });
  rechne();
}
function rechne(){
  const out=$('rechnung'); out.innerHTML='';
  if(!GL||!D.ziel) return;
  const w={}; let fehlt=[];
  const liste=[...vars(GL.l),...vars(GL.r)].filter((v,i,a)=>a.indexOf(v)===i);
  liste.forEach(n=>{ if(n===D.ziel) return;
    const s=String(D.werte[n]==null?'':D.werte[n]).trim().replace(',','.');
    if(s===''){ fehlt.push(n); return; }
    const z=Number(s); if(!isFinite(z)){ fehlt.push(n); return; } w[n]=z; });
  if(fehlt.length){ out.innerHTML='<span class="hint">Es fehlen noch: <span class="m">'+fehlt.map(varHTML).join(', ')+'</span></span>'; return; }
  const zeig=v=>{ const r=(Math.abs(v)>=1e6||(Math.abs(v)<1e-4&&v!==0))?v.toExponential(4):String(Math.round(v*1e6)/1e6);
    return String(r).replace('.',','); };
  const einheit=D.einh[D.ziel]?' <span class="einh">'+D.einh[D.ziel]+'</span>':'';
  if(LOES&&!LOES.fehler){
    const wert=werte(LOES.ergebnis.r,w);
    if(!isFinite(wert)){ out.innerHTML='<div class="fehler">Mit diesen Werten lässt sich kein Ergebnis berechnen.</div>'; return; }
    out.innerHTML='<div class="erg m">'+varHTML(D.ziel)+' = '+zeig(wert)+einheit+'</div>';
    return;
  }
  const alle=numerischAlle(GL,D.ziel,w);
  if(!alle.length){ out.innerHTML='<div class="fehler">Mit diesen Werten habe ich keine Lösung gefunden.</div>'; return; }
  const pos=alle.filter(v=>v>0), rest=alle.filter(v=>v<=0);
  const sortiert=pos.concat(rest);                       /* im Sachzusammenhang ist meist die positive gemeint */
  out.innerHTML='<div class="erg m">'+varHTML(D.ziel)+' = '+zeig(sortiert[0])+einheit+'</div>'+
    (sortiert.length>1?'<div class="hinw">Die Gleichung hat mehrere Lösungen: <span class="m">'+
      sortiert.map(v=>zeig(v)).join(' &nbsp;·&nbsp; ')+'</span>. Im Sachzusammenhang ist meist die positive gemeint.</div>':'')+
    '<div class="hinw">Diese Lösung wurde <b>numerisch</b> gesucht (Näherung), weil sich die Formel nicht umstellen lässt.</div>';
}
/* numerische Lösungssuche, falls die Formel nicht umstellbar ist – findet auch mehrere Lösungen */
function numerischAlle(gl,x,w){
  const f=v=>{ const o={...w}; o[x]=v; const y=werte(gl.l,o)-werte(gl.r,o); return isFinite(y)?y:NaN; };
  const treffer=[];
  const suche=(von,bis,n)=>{
    let vx=von, vy=f(vx);
    for(let i=1;i<=n;i++){
      const nx=von+(bis-von)*i/n, ny=f(nx);
      if(isFinite(vy)&&isFinite(ny)){
        if(vy===0) treffer.push(vx);
        else if(vy*ny<0){                                 /* Vorzeichenwechsel → Bisektion */
          let a=vx,b=nx,fa=vy;
          for(let k=0;k<80;k++){ const m=(a+b)/2, fm=f(m); if(fm===0){ a=b=m; break; }
            if(fa*fm<0){ b=m; } else { a=m; fa=fm; } }
          treffer.push((a+b)/2);
        }
      }
      vx=nx; vy=ny;
    }
  };
  suche(-100,100,8000); suche(-10000,10000,8000);
  const raus=[];
  treffer.sort((p,q)=>p-q).forEach(v=>{ if(!raus.some(u=>Math.abs(u-v)<=1e-6*Math.max(1,Math.abs(v)))) raus.push(v); });
  return raus.filter(v=>Math.abs(f(v))<1e-4*Math.max(1,Math.abs(v)));
}

/* ---------- Bedienzeile ---------- */
function renderBar2(){
  const bar=$('bar2'); bar.innerHTML='';
  const el=(tag,cls,txt,fn)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; if(fn) e.onclick=fn; bar.appendChild(e); return e; };
  el('span','lbl',D.name?('Vorlage: '+D.name):'Eigene Formel');
  el('span','sep');
  el('span','lbl','Schrift'); el('button','btn','A−',()=>schrift(-1)); el('button','btn','A+',()=>schrift(1));
  el('span','grow');
  if(window.parent!==window) el('button','btn pri','🖼 Rechenweg → Tafel',()=>{ const im=bild(); if(im) TafelShot.toBoard(im); });
  el('button','btn','📋 Kopieren',()=>{ const im=bild(); if(im) TafelShot.copy(im); });
  if(window.TafelTeilen&&!TafelTeilen.istGeteilt()) TafelTeilen.knopf(bar,'formel.html',()=>({w:'fml', d:D}),{cls:'btn'});
}
function schrift(d){ D.fontSize=Math.max(11,Math.min(30,(D.fontSize||15)+d));
  document.documentElement.style.setProperty('--fs',D.fontSize+'px'); sync(); }
function bild(){ const el=$('cardWeg');
  if(el.hidden){ toast('Zuerst eine Formel umstellen'); return null; }
  return TafelShot.rasterize(el,{pad:12,scale:2.5}); }

$('bGo').onclick=()=>{ D.name=''; D.einh=D.einh||{}; uebernehmen(); sync(); };
$('fin').addEventListener('keydown',e=>{ if(e.key==='Enter'){ D.name=''; uebernehmen(); sync(); } });
$('bNeu').onclick=()=>{ D.formel=''; D.ziel=''; D.name=''; D.einh={}; D.werte={}; $('fin').value='';
  $('cardZiel').hidden=true; $('cardWeg').hidden=true; $('cardWerte').hidden=true; renderBar2(); sync(); };
$('bPrint').onclick=()=>{ const im=bild(); if(!im) return; const w=window.open('','_blank'); if(!w){ toast('Bitte Pop-ups erlauben'); return; }
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Formel umstellen</title>'+
    '<style>@page{margin:14mm}body{margin:0}img{width:100%}</style></head><body><img src="'+im.canvas.toDataURL('image/png')+'"></body></html>');
  w.document.close(); w.focus(); setTimeout(()=>w.print(),350); };
function barFade(){ const bar=$('bar'), m=$('barMid'); bar.classList.remove('compact'); if(m.clientWidth<120) bar.classList.add('compact'); }
addEventListener('resize',barFade);

/* ---------- Tafel-Anbindung ---------- */
let ready=false, syncT=null;
function post(){ syncT=null; if(window.parent===window||!ready) return;
  try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
function sync(){ if(!syncT) syncT=setTimeout(post,300); }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return;
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return;
  D=Object.assign(D,e.data.data); ready=true;
  if(!D.einh) D.einh={}; if(!D.werte) D.werte={};
  document.documentElement.style.setProperty('--fs',(D.fontSize||15)+'px');
  $('fin').value=D.formel||''; uebernehmen(); barFade(); });

window.addEventListener('load',()=>{
  document.documentElement.style.setProperty('--fs',(D.fontSize||15)+'px');
  renderVorlagen(); $('fin').value=D.formel||''; uebernehmen(); renderBar2(); barFade();
  if(window.parent===window){ ready=true; return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  setTimeout(()=>{ ready=true; },700);
});

/* ---------- Teilen: Aufgabe per QR-Code an die Klasse ---------- */
if(window.TafelTeilen){
  const _tg=TafelTeilen.istGeteilt();
  else window.addEventListener('load',()=>{
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='fml'&&p.d){ if(typeof p.d==='object') p.d.edit=false; TafelTeilen.einspielen(p.d); } })
      .catch(()=>{}).then(()=>TafelTeilen.nurBenutzen()); });
}
