<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>

<script>
"use strict";
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d');
const toast=m=>window.TafelShot&&TafelShot.toast(m);
const F1='#2563eb', F2='#dc2626', FP='#7c3aed', FD='#ea580c', FGR='#94a3b8';
const F1H='#93b4f6', F2H='#f0a0a0', FPH='#c4b0ee';          /* blasse Fassung für „vorher" */
const LX=4, LY=2.5;                      /* Bahn 4 m lang, Fläche 4 m × 2,5 m */
const TEMPI=[1,0.5,0.25,0.125], TEMPON=['1:1','1:2','1:4','1:8'];
const VMAX=15, MMIN=0.05, MMAX=50, TMAX=40;

/* ---------- Zahlen in deutscher Schreibweise ---------- */
function zahl(v,n){ if(v===null||v===undefined||!isFinite(v)) return '–';
  if(Math.abs(v)<5e-13) v=0;
  const a=Math.abs(v);
  if(n===undefined) n = a>=100?1 : a>=10?2 : 3;
  let s=v.toFixed(n);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s='0';
  return s.replace('.',','); }
/* feste Stellenzahl – damit die Spalten in der Tabelle ruhig stehen */
function fz(v,n){ if(v===null||v===undefined||!isFinite(v)) return '–';
  n=(n===undefined)?2:n; if(Math.abs(v)<5e-13) v=0;
  let s=v.toFixed(n); if(/^-0[.,]?0*$/.test(s)) s=s.slice(1);
  return s.replace('.',','); }
function zahlEin(s){ if(typeof s!=='string') s=String(s==null?'':s);
  s=s.replace(',','.').replace(/[^0-9.+-]/g,'');
  const v=parseFloat(s); return isFinite(v)?v:null; }

/* ---------- Zustand ----------
   s1/s2 = Startplatz in Metern, g1/g2 = Startgeschwindigkeit in m/s.
   y zählt im Modell nach unten; angezeigt und eingegeben wird y nach oben. */
const standard=()=>({v:1, dim:1, elast:true, m1:1, m2:2,
  s1:{x:1,y:LY/2}, s2:{x:3,y:LY/2},
  g1:{x:2.5,y:0}, g2:{x:0,y:0},
  wert:{v:true,p:true,E:false}, pfeil:{v:true,p:false,d:false},
  tempo:0, blitze:7, babst:0, strobo:false, fontSize:14, edit:true});
let D=standard();

let B=[{x:1,y:LY/2,vx:0,vy:0},{x:3,y:LY/2,vx:0,vy:0}];
let t=0, lauf=false, verbunden=false, tStoss=null, stossOrt=null, vVor=null, vNach=null;
let rec=[], tEnde=null, ab=false, tAb=0, schau=false, letztT=0;
let W=320, H=240, DPR=1, SC=100, OX=0, OY=0, yMid=120, kk=1;
let zieh=null, ziehG=null, winkelMerk=[0,180];

const masse=i=>Math.max(MMIN,Math.min(MMAX, i?(+D.m2||0):(+D.m1||0)));
/* gleiche Dichte: der Radius wächst mit der dritten Wurzel der Masse */
const rad=m=>0.10*Math.cbrt(Math.max(0.02,m));
const rI=i=>rad(masse(i));
const gv=i=>i?D.g2:D.g1;
const sv=i=>i?D.s2:D.s1;
const tempo=()=>TEMPI[Math.max(0,Math.min(TEMPI.length-1,D.tempo|0))];
const recEnde=()=>rec.length?rec[rec.length-1].t:0;

/* ---------- Anfang ---------- */
function neuStart(){
  for(let i=0;i<2;i++){ const s=sv(i), g=gv(i), r=rI(i);
    B[i].x=Math.max(r,Math.min(LX-r,+s.x||0));
    B[i].y=(D.dim===1)?LY/2:Math.max(r,Math.min(LY-r,(s.y===undefined?LY/2:+s.y)||0));
    B[i].vx=+g.x||0; B[i].vy=(D.dim===1)?0:(+g.y||0); }
  trennen();
  t=0; lauf=false; ab=false; tAb=0; schau=false; verbunden=false;
  tStoss=null; stossOrt=null; vVor=null; vNach=null; tEnde=null;
  rec=[]; probe(); }
/* Falls die Startplätze einander überdecken: auseinanderschieben */
function trennen(){ const R=rI(0)+rI(1);
  let dx=B[1].x-B[0].x, dy=(D.dim===1)?0:B[1].y-B[0].y;
  let d=Math.hypot(dx,dy);
  if(d>=R-1e-9) return;
  if(d<1e-9){ dx=1; dy=0; d=1; }
  const f=(R-d)/d/2;
  B[0].x-=dx*f; B[1].x+=dx*f;
  if(D.dim===2){ B[0].y-=dy*f; B[1].y+=dy*f; }
  for(let i=0;i<2;i++){ const r=rI(i);
    B[i].x=Math.max(r,Math.min(LX-r,B[i].x));
    if(D.dim===2) B[i].y=Math.max(r,Math.min(LY-r,B[i].y)); } }

function probe(){ if(rec.length>6000) return;
  rec.push({t:t, a:{x:B[0].x,y:B[0].y,vx:B[0].vx,vy:B[0].vy},
                 b:{x:B[1].x,y:B[1].y,vx:B[1].vx,vy:B[1].vy}}); }

/* ---------- Ablauf ----------
   Der Zeitpunkt der Berührung wird ausgerechnet, nicht gesucht: Damit liegt im
   Mitschnitt genau eine Probe auf dem Stoß – nur so trifft das Stroboskopbild ihn. */
function kontaktZeit(h){
  if(verbunden) return null;
  const R=rI(0)+rI(1);
  const dx=B[1].x-B[0].x, dy=(D.dim===1)?0:B[1].y-B[0].y;
  const wx=B[1].vx-B[0].vx, wy=(D.dim===1)?0:B[1].vy-B[0].vy;
  const dw=dx*wx+dy*wy;
  if(dw>=-1e-12) return null;                       /* sie entfernen sich */
  const a=wx*wx+wy*wy; if(a<1e-14) return null;
  const c=dx*dx+dy*dy-R*R;
  if(c<=0) return 0;                                /* berühren sich schon */
  const disc=dw*dw-a*c; if(disc<0) return null;
  const tau=(-dw-Math.sqrt(disc))/a;
  return (tau>=0&&tau<=h)?tau:null; }

function bewege(h){ for(let i=0;i<2;i++){ B[i].x+=B[i].vx*h; if(D.dim===2) B[i].y+=B[i].vy*h; } }

function stossAus(){
  const m1=masse(0), m2=masse(1);
  let nx=B[1].x-B[0].x, ny=(D.dim===1)?0:B[1].y-B[0].y;
  const L=Math.hypot(nx,ny); if(L<1e-9){ nx=1; ny=0; } else { nx/=L; ny/=L; }
  vVor=[{x:B[0].vx,y:B[0].vy},{x:B[1].vx,y:B[1].vy}];
  if(D.elast){
    /* nur die Anteile längs der Verbindungslinie werden getauscht */
    const u1=B[0].vx*nx+B[0].vy*ny, u2=B[1].vx*nx+B[1].vy*ny;
    const n1=((m1-m2)*u1+2*m2*u2)/(m1+m2), n2=((m2-m1)*u2+2*m1*u1)/(m1+m2);
    B[0].vx+=(n1-u1)*nx; B[0].vy+=(n1-u1)*ny;
    B[1].vx+=(n2-u2)*nx; B[1].vy+=(n2-u2)*ny;
  } else {
    const gx=(m1*B[0].vx+m2*B[1].vx)/(m1+m2), gy=(m1*B[0].vy+m2*B[1].vy)/(m1+m2);
    B[0].vx=B[1].vx=gx; B[0].vy=B[1].vy=gy; verbunden=true;
  }
  if(D.dim===1){ B[0].vy=0; B[1].vy=0; }
  vNach=[{x:B[0].vx,y:B[0].vy},{x:B[1].vx,y:B[1].vy}];
  tStoss=t;
  const r1=rI(0), f=r1/(r1+rI(1));
  stossOrt={a:{x:B[0].x,y:B[0].y}, b:{x:B[1].x,y:B[1].y},
            k:{x:B[0].x+(B[1].x-B[0].x)*f, y:B[0].y+(B[1].y-B[0].y)*f}}; }

function schritt(dt){
  let rest=dt, schutz=0;
  while(rest>1e-9&&schutz++<4){
    const tc=kontaktZeit(rest);
    const h=(tc===null)?rest:tc;
    bewege(h); t+=h; rest-=h;
    if(tc!==null){ probe(); stossAus(); probe(); }
  }
  if(!lauf) return;
  probe(); }

const draussen=i=>{ const r=rI(i), b=B[i];
  if(b.x+r<0||b.x-r>LX) return true;
  return (D.dim===2)&&(b.y+r<0||b.y-r>LY); };
function pruefEnde(){
  if((draussen(0)&&draussen(1))||t>=TMAX){ lauf=false; tEnde=t; tAb=0; return true; }
  return false; }

/* ---------- Stelle in der Aufnahme ---------- */
function probeBei(tt){
  if(!rec.length) return null;
  if(tt<=rec[0].t) return rec[0];
  if(tt>=rec[rec.length-1].t) return rec[rec.length-1];
  let lo=0, hi=rec.length-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(rec[m].t<=tt) lo=m; else hi=m; }
  const A=rec[lo], C=rec[hi], sp=C.t-A.t, f=(sp>1e-12)?(tt-A.t)/sp:0;
  const ip=k=>({x:A[k].x+(C[k].x-A[k].x)*f, y:A[k].y+(C[k].y-A[k].y)*f, vx:A[k].vx, vy:A[k].vy});
  return {t:tt, a:ip('a'), b:ip('b')}; }

/* Blitzzeiten des Stroboskops: gleichmäßiges Raster, verankert am Stoß.
   Gespeichert wird der gewünschte Abstand (babst); daraus ergibt sich die
   Anzahl. Der Abstand wird so gedehnt, dass zwischen Anfang und Stoß ganze
   Schritte liegen – dann ist der Stoß immer ein Blitz und das Bild beginnt
   trotzdem bei t = 0. Deshalb ändern die Knöpfe den Abstand und die Anzahl
   gemeinsam: beides zusammen steht in der unteren Zeile. */
function raster(){
  if(rec.length<2) return null;
  const t0=rec[0].t, t1=rec[rec.length-1].t;
  if(!(t1>t0+1e-9)) return null;
  let dt=(+D.babst>0)?+D.babst:(t1-t0)/Math.max(1,Math.max(2,Math.min(60,D.blitze|0||7))-1);
  dt=Math.max((t1-t0)/59,Math.min(t1-t0,dt));          /* nie mehr als 60 und nie weniger als 2 Blitze */
  let anker=t0;
  if(tStoss!==null&&tStoss>t0+1e-9&&tStoss<t1-1e-9){
    const k=Math.max(1,Math.round((tStoss-t0)/dt)), dt2=(tStoss-t0)/k;
    if((t1-t0)/dt2+1<=80) dt=dt2; else anker=tStoss;
  }
  return {t0:t0,t1:t1,dt:dt,anker:anker}; }
function blitzZeiten(){
  const g=raster(); if(!g) return [];
  const L=[];
  if(g.anker===g.t0){ for(let j=0;g.t0+j*g.dt<=g.t1+1e-9&&j<300;j++) L.push(g.t0+j*g.dt); }
  else { const k0=Math.ceil((g.t0-g.anker)/g.dt-1e-9), k1=Math.floor((g.t1-g.anker)/g.dt+1e-9);
    for(let k=k0;k<=k1;k++) L.push(g.anker+k*g.dt); }
  if(tStoss!==null&&!L.some(x=>Math.abs(x-tStoss)<g.dt*1e-6)) L.push(tStoss);
  return L.sort((a,b)=>a-b); }
/* fein > 0: kleinerer Abstand, also mehr Blitze */
function rasterSchritt(fein){
  const g=raster();
  if(!g){ D.blitze=Math.max(3,Math.min(60,(D.blitze|0)+fein)); D.babst=0; knoepfe(); sync(); return; }
  let neu;
  if(tStoss!==null&&tStoss>g.t0+1e-9&&tStoss<g.t1-1e-9){
    const k=Math.max(1,Math.round((tStoss-g.t0)/g.dt))+fein;
    if(k<1) return;
    neu=(tStoss-g.t0)/k;
  } else neu=(fein>0)?g.dt/1.5:g.dt*1.5;
  const n=(g.t1-g.t0)/neu+1;
  if(n<2.5||n>60) return;
  D.babst=neu; D.blitze=Math.max(3,Math.min(60,Math.round(n)));
  knoepfe(); if(D.strobo) zeichne(); sync(); }

/* ---------- Zeichnen: Grundbausteine ---------- */
function schrift(sz,fett){ return (fett?'700 ':'')+sz+'px -apple-system,BlinkMacSystemFont,Arial,sans-serif'; }
function txt(s,x,y,o){ o=o||{}; ctx.font=schrift(o.sz||13,o.fett);
  ctx.textAlign=o.al||'center'; ctx.textBaseline=o.bl||'middle';
  if(o.rand){ ctx.lineWidth=o.randB||3; ctx.strokeStyle=o.rand; ctx.lineJoin='round'; ctx.strokeText(s,x,y); }
  ctx.fillStyle=o.farbe||'#1f2430'; ctx.fillText(s,x,y); }
const perp=(dx,dy,d)=>{ const L=Math.hypot(dx,dy)||1; return {x:-dy/L*d, y:dx/L*d}; };

/* Pfeil mit Beschriftung über (bzw. unter) der Mitte */
function malPfeil(x0,y0,dx,dy,farbe,lw,gestr,label,lu){
  const L=Math.hypot(dx,dy);
  if(L<6) return;                              /* ein Pfeil der Länge null wird nicht gezeichnet */
  const ux=dx/L, uy=dy/L, sp=Math.min(L*0.5,9+lw*2.4);
  ctx.save(); ctx.strokeStyle=farbe; ctx.fillStyle=farbe; ctx.lineWidth=lw; ctx.lineCap='round';
  if(gestr) ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+dx-ux*sp*0.85,y0+dy-uy*sp*0.85); ctx.stroke();
  ctx.setLineDash([]);
  const b=sp*0.42;
  ctx.beginPath(); ctx.moveTo(x0+dx,y0+dy);
  ctx.lineTo(x0+dx-ux*sp-uy*b, y0+dy-uy*sp+ux*b);
  ctx.lineTo(x0+dx-ux*sp+uy*b, y0+dy-uy*sp-ux*b);
  ctx.closePath(); ctx.fill(); ctx.restore();
  if(label){ const p=perp(dx,dy,(lu?1:-1)*13*kk);
    txt(label,x0+dx/2+p.x,y0+dy/2+p.y,{sz:11.5*kk,fett:true,farbe:farbe,rand:'#fff',randB:3}); } }

function malKoerperR(px,py,i,rpx,o){ o=o||{};
  const f=i?F2:F1, r=Math.max(5,rpx), al=(o.alpha===undefined)?1:o.alpha;
  ctx.save();
  if(o.offen){ ctx.globalAlpha=al*0.5; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fill();
    ctx.globalAlpha=al; ctx.strokeStyle=f; ctx.lineWidth=Math.max(1.5,r*0.1);
    if(o.strich) ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.stroke(); }
  else { ctx.globalAlpha=al; ctx.fillStyle=f;
    ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#fff';
    ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.stroke(); }
  ctx.restore();
  if(o.nr!==false&&r>=9) txt(String(i+1),px,py+0.5,{sz:Math.min(r*1.1,15*kk),fett:true,farbe:o.offen?f:'#fff'});
  if(o.masse) txt(zahl(masse(i))+' kg',px,py+r+11*kk,{sz:11*kk,fett:true,farbe:f,rand:'#fff',randB:3}); }

/* ---------- Bahn (1D) und Fläche (2D) ---------- */
function malBahn1D(px,sc,y,skala){
  const x0=px(0), x1=px(LX);
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=3; ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  const hh=Math.max(13,Math.max(rI(0),rI(1))*sc*1.15);
  ctx.strokeStyle='#64748b'; ctx.lineWidth=4;
  [x0,x1].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,y-hh); ctx.lineTo(x,y+hh); ctx.stroke(); });
  if(skala){ const yS=y+hh+9;
    ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0,yS); ctx.lineTo(x1,yS); ctx.stroke();
    for(let k=0;k<=LX*2;k++){ const x=px(k/2), gr=(k%2===0);
      ctx.beginPath(); ctx.moveTo(x,yS); ctx.lineTo(x,yS+(gr?7:4)); ctx.stroke();
      if(gr) txt((k/2)+(k===LX*2?' m':''),x,yS+16,{sz:10.5*kk,farbe:FGR}); } } }

function malFeld2D(px,py,sc,skala){
  const x0=px(0), y0=py(0), x1=px(LX), y1=py(LY);
  ctx.fillStyle='#fbfcfe'; ctx.fillRect(x0,y0,x1-x0,y1-y0);
  ctx.strokeStyle='#e8edf4'; ctx.lineWidth=1;
  for(let k=1;k<LX*2;k++){ const x=px(k/2); ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke(); }
  for(let k=1;k<LY*2;k++){ const y=py(k/2); ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); }
  ctx.strokeStyle='#64748b'; ctx.lineWidth=2.5; ctx.strokeRect(x0,y0,x1-x0,y1-y0);
  if(skala){ for(let k=0;k<=LX;k++) txt(k+(k===LX?' m':''),px(k),y1+11*kk,{sz:10.5*kk,farbe:FGR});
    for(let k=0;k<=2;k++) txt(String(k),x0-11*kk,py(LY-k),{sz:10.5*kk,farbe:FGR}); } }

/* ---------- Pfeillängen ---------- */
/* Die Pfeillänge hängt an festen Stufen, nicht am genauen Höchstwert: Beim Ziehen
   an der Spitze würde sich sonst mit jedem Pixel der Maßstab ändern und der Pfeil
   dem Finger davonlaufen. Während des Ziehens bleibt der Maßstab ganz stehen. */
const STUFEN=[0.2,0.5,1,2,3,5,8,12,20,30,50,80];
const stufe=x=>{ for(let i=0;i<STUFEN.length;i++) if(x<=STUFEN[i]*1.0001) return STUFEN[i];
  return STUFEN[STUFEN.length-1]; };
let skalaFest=null;
function pfeilSkala(){
  if(skalaFest) return skalaFest;
  let vm=0.2, pm=0.2;
  for(let i=0;i<2;i++){
    const g=gv(i), L=[{x:B[i].vx,y:B[i].vy},{x:+g.x||0,y:(D.dim===1?0:+g.y||0)}];
    if(vVor) L.push(vVor[i]);
    if(vNach) L.push(vNach[i]);
    L.forEach(v=>{ const b=Math.hypot(v.x,v.y); vm=Math.max(vm,b); pm=Math.max(pm,b*masse(i)); }); }
  return {kv:0.9/stufe(vm), kp:0.9/stufe(pm)}; }

/* ---------- Führen die Anfangsbedingungen zu einem Stoß? ----------
   Wird aus dem laufenden Zustand gerechnet und angezeigt, solange es noch
   keinen Stoß gab – so sieht man schon beim Einstellen, ob es klappt. */
function ausZeit(){                      /* wann wäre jeder Körper ohne Stoß draußen? */
  let te=0;
  for(let i=0;i<2;i++){ const r=rI(i), b=B[i];
    const w=(v,o,L)=> (v>1e-9) ? (L+r-o)/v : (v<-1e-9) ? (o+r)/(-v) : Infinity;
    let ti=w(b.vx,b.x,LX);
    if(D.dim===2) ti=Math.min(ti,w(b.vy,b.y,LY));
    te=Math.max(te,ti); }
  return Math.min(te,TMAX); }
function stossVoraus(){
  const R=rI(0)+rI(1);
  const dx=B[1].x-B[0].x, dy=(D.dim===1)?0:B[1].y-B[0].y;
  const wx=B[1].vx-B[0].vx, wy=(D.dim===1)?0:B[1].vy-B[0].vy;
  const a=wx*wx+wy*wy, dw=dx*wx+dy*wy;
  if(a<1e-12) return {ja:false,grund:'Beide sind gleich schnell – der Abstand bleibt, wie er ist.'};
  if(dw>=0) return {ja:false,grund:'Die Körper bewegen sich nicht aufeinander zu.'};
  const c=dx*dx+dy*dy-R*R, disc=dw*dw-a*c;
  if(disc<0) return {ja:false,grund:'Sie fliegen aneinander vorbei – einen Körper quer versetzen.'};
  const tau=(-dw-Math.sqrt(disc))/a;
  if(tau>ausZeit()+1e-9)
    return {ja:false,grund:'Sie treffen sich erst, wenn beide '+(D.dim===1?'die Bahn':'die Fläche')+' längst verlassen haben.'};
  return {ja:true,t:tau}; }
function malKeinStoss(oben){
  const v=stossVoraus(); if(v.ja) return;
  const s1='Kein Stoß', s2=v.grund;
  const fs=Math.min(14,12.5*kk);
  ctx.font=schrift(fs,true); const w1=ctx.measureText(s1+':  ').width;
  ctx.font=schrift(fs,false); const w2=ctx.measureText(s2).width;
  const bw=Math.min(W-20,w1+w2+22), bh=fs*2.2, x0=(W-bw)/2, y0=oben+4;
  ctx.save();
  ctx.fillStyle='rgba(254,243,199,.95)'; ctx.strokeStyle='#f0b429'; ctx.lineWidth=1.4;
  rrund(x0,y0,bw,bh,9); ctx.fill(); ctx.stroke(); ctx.restore();
  const xs=x0+(bw-w1-w2)/2;
  txt(s1+':',xs,y0+bh/2,{al:'left',sz:fs,fett:true,farbe:'#92400e'});
  txt(s2,xs+w1,y0+bh/2,{al:'left',sz:fs,farbe:'#92400e'});
  return bh+8; }
function rrund(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---------- Stoßstelle und Vorher-Nachher-Pfeile ---------- */
function malStossOrt(px,py,sc){
  if(!stossOrt) return;
  const k=stossOrt.k;
  ctx.save(); ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
  if(D.dim===1){ const h=Math.max(rI(0),rI(1))*sc+26*kk;
    ctx.beginPath(); ctx.moveTo(px(k.x),py(k.y)-h); ctx.lineTo(px(k.x),py(k.y)+h); ctx.stroke(); ctx.restore();
    txt('Stoß',px(k.x),py(k.y)-h-9*kk,{sz:11.5*kk,fett:true,farbe:'#b45309',rand:'#fff',randB:3}); }
  else { const r=Math.max(10,Math.min(rI(0),rI(1))*sc*0.6);
    ctx.beginPath(); ctx.arc(px(k.x),py(k.y),r,0,7); ctx.stroke(); ctx.restore();
    txt('Stoß',px(k.x),py(k.y)-r-9*kk,{sz:11.5*kk,fett:true,farbe:'#b45309',rand:'#fff',randB:3}); } }

function malKonstruktion(K,px,py,sc){
  if(!(vVor&&vNach&&stossOrt)) return;
  const dim1=(D.dim===1);
  /* blasse Umrisse an der Stoßstelle, damit die Pfeile einen Ort haben */
  for(let i=0;i<2;i++){ const o=i?stossOrt.b:stossOrt.a;
    malKoerperR(px(o.x),py(o.y),i,rI(i)*sc,{offen:true,strich:true,alpha:0.5,nr:false}); }
  const arten=[];
  if(D.pfeil.v) arten.push({na:'v',k:K.kv,mas:false,f:[F1,F2],h:[F1H,F2H]});
  if(D.pfeil.p) arten.push({na:'p',k:K.kp,mas:true,f:[FP,FP],h:[FPH,FPH]});
  arten.forEach(a=>{
    for(let i=0;i<2;i++){
      const o=i?stossOrt.b:stossOrt.a, x=px(o.x), y=py(o.y);
      const m=a.mas?masse(i):1, s=m*a.k*sc;
      const ax=vVor[i].x*s, ay=dim1?0:vVor[i].y*s;
      const bx=vNach[i].x*s, by=dim1?0:vNach[i].y*s;
      const nr=(i?'₂':'₁'), lab=a.na+nr;
      if(dim1){
        malPfeil(x,y-15*kk,ax,0,a.h[i],2.6,true,lab,false);
        malPfeil(x,y+15*kk,bx,0,a.f[i],3.2,false,lab+'′',true);
        if(D.pfeil.d) malPfeil(x,y+44*kk,bx-ax,0,FD,3,false,'Δ'+lab,true);
      } else {
        malPfeil(x,y,ax,ay,a.h[i],2.6,true,lab,false);
        malPfeil(x,y,bx,by,a.f[i],3.2,false,lab+'′',false);
        if(D.pfeil.d) malPfeil(x+ax,y+ay,bx-ax,by-ay,FD,3,false,'Δ'+lab,true);
      } } }); }

/* ---------- Griff an der Spitze des Geschwindigkeitspfeils ----------
   Damit stellt man Betrag und Richtung der Anfangsgeschwindigkeit ein.
   Steht der Körper still, sitzt der Griff dicht am Rand: von dort zieht
   man den Vektor heraus. */
const einstellbar=()=>!lauf&&!schau&&!ab&&!D.strobo&&t<1e-9&&tEnde===null;
function griffOrt(i,K){
  const g=gv(i), vx=+g.x||0, vy=(D.dim===1)?0:(+g.y||0);
  const b=Math.hypot(vx,vy), cx=PX(B[i].x), cy=PY(B[i].y);
  if(b<0.02){ const a=(winkelMerk[i]||0)*Math.PI/180, d=rI(i)*SC+16*kk;
    return {x:cx+Math.cos(a)*d, y:cy-((D.dim===1)?0:Math.sin(a)*d), leer:true, cx:cx, cy:cy}; }
  return {x:cx+vx*K.kv*SC, y:cy+((D.dim===1)?0:vy*K.kv*SC), leer:false, cx:cx, cy:cy}; }
function malGriff(i,K){
  const G=griffOrt(i,K), f=i?F2:F1;
  if(G.leer){
    ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle=f; ctx.lineWidth=1.5; ctx.globalAlpha=.65;
    ctx.beginPath(); ctx.moveTo(G.cx,G.cy); ctx.lineTo(G.x,G.y); ctx.stroke(); ctx.restore();
  } else if(!D.pfeil.v){                       /* Pfeile aus: dünner Einstellpfeil, damit der Griff einen Sinn hat */
    malPfeil(G.cx,G.cy,G.x-G.cx,G.y-G.cy,'#94a3b8',2,false,'',false); }
  ctx.save();
  ctx.fillStyle='#fff'; ctx.strokeStyle=f; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.arc(G.x,G.y,7.5*kk,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle=f; ctx.beginPath(); ctx.arc(G.x,G.y,2.6*kk,0,7); ctx.fill();
  ctx.restore();
  if(ziehG&&ziehG.i===i){                      /* beim Ziehen den Wert danebenschreiben */
    const g=gv(i), b=Math.hypot(+g.x||0,(D.dim===1)?0:(+g.y||0));
    const s=(D.dim===1)?(zahl(+g.x||0,2)+' m/s')
                       :(zahl(b,2)+' m/s  unter '+zahl(winkelMerk[i],0)+'°');
    txt(s,G.x,G.y-18*kk,{sz:12*kk,fett:true,farbe:f,rand:'#fff',randB:3}); } }
function spitzeAuf(i,p){
  const K=skalaFest||pfeilSkala(), f=Math.max(1e-6,K.kv*SC), g=gv(i);
  let vx=(p.px-PX(B[i].x))/f, vy=(D.dim===1)?0:((p.py-PY(B[i].y))/f);
  let b=Math.hypot(vx,vy);
  if(b>VMAX){ vx*=VMAX/b; vy*=VMAX/b; b=VMAX; }
  if(D.dim===1){ g.x=Math.round(vx/0.05)*0.05; g.y=0;
    winkelMerk[i]=(g.x<0)?180:0; }
  else { b=Math.round(b/0.05)*0.05;
    if(b<0.03) b=0; else winkelMerk[i]=Math.round(Math.atan2(-vy,vx)*180/Math.PI);
    const a=winkelMerk[i]*Math.PI/180;
    g.x=b*Math.cos(a); g.y=-b*Math.sin(a);
    if(Math.abs(g.x)<1e-9) g.x=0;
    if(Math.abs(g.y)<1e-9) g.y=0; }
  B[i].vx=+g.x||0; B[i].vy=(D.dim===1)?0:(+g.y||0);
  rec=[]; probe(); feldSync(); zeichne(); }

/* ---------- Gesamtimpuls vorher und nachher ----------
   Die beiden Impulse werden aneinandergehängt (Spitze an Fuß); der dicke Pfeil
   vom Anfang zum Ende ist der Gesamtimpuls. Zwei solche Ketten untereinander –
   vorher und nachher – zeigen, dass dabei dasselbe herauskommt. */
function malBilanz(oben,unten){
  if(!(D.pfeil.p&&vVor&&vNach)) return;
  const dim1=(D.dim===1), m=[masse(0),masse(1)];
  const K=[[{x:m[0]*vVor[0].x,y:dim1?0:m[0]*vVor[0].y},{x:m[1]*vVor[1].x,y:dim1?0:m[1]*vVor[1].y}],
           [{x:m[0]*vNach[0].x,y:dim1?0:m[0]*vNach[0].y},{x:m[1]*vNach[1].x,y:dim1?0:m[1]*vNach[1].y}]];
  const pts=[];
  K.forEach(a=>{ let x=0,y=0; pts.push({x:x,y:y});
    a.forEach(q=>{ x+=q.x; y+=q.y; pts.push({x:x,y:y}); }); });
  const xs=pts.map(q=>q.x), ys=pts.map(q=>q.y);
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  const y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  const fs=Math.min(12,11*kk);
  const bw=Math.min(W*0.46,340), bh=Math.min((unten-oben)*0.5,dim1?96:150);
  const bx=10, by=unten-bh-2;
  const lw=Math.max(46,fs*4.2);                       /* Spalte für „vorher"/„nachher" */
  const iw=bw-lw-16, rh=(bh-fs*1.9-8)/2;
  const sc=Math.min(iw/Math.max(1e-6,x1-x0), (dim1?1e9:rh*0.8/Math.max(1e-6,y1-y0)));
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.92)'; ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
  rrund(bx,by,bw,bh,10); ctx.fill(); ctx.stroke(); ctx.restore();
  txt('Impulse zusammen',bx+8,by+fs*1.1,{al:'left',sz:fs,fett:true,farbe:'#64748b'});
  ['vorher','nachher'].forEach((nam,r)=>{
    const yM=by+fs*1.9+rh*(r+0.5);
    const ox=bx+lw+8-x0*sc, oy=yM-((y0+y1)/2)*sc;
    txt(nam,bx+lw,yM,{al:'right',sz:fs,farbe:'#475569'});
    let x=0,y=0;
    K[r].forEach((q,i)=>{
      if(Math.hypot(q.x,q.y)>1e-9)
        malPfeil(ox+x*sc,oy+y*sc,q.x*sc,q.y*sc,i?F2:F1,2.4,false,'',false);
      x+=q.x; y+=q.y; });
    if(Math.hypot(x,y)>1e-9)
      malPfeil(ox,oy+(dim1?13:0),x*sc,y*sc,FP,3.4,false,'',true);
    else txt('0',ox,oy+13,{sz:fs,fett:true,farbe:FP});
  });
  const g=K[1].reduce((a,q)=>({x:a.x+q.x,y:a.y+q.y}),{x:0,y:0});
  const sg=dim1?(fz(g.x,2)+' kg·m/s'):(fz(g.x,2)+' | '+fz(-g.y,2)+' kg·m/s');
  txt('p = '+sg,bx+bw-8,by+fs*1.1,{al:'right',sz:fs,fett:true,farbe:FP}); }

/* ---------- Wertetabelle ---------- */
function tabDaten(){
  const q=[]; if(D.wert.v)q.push('v'); if(D.wert.p)q.push('p'); if(D.wert.E)q.push('E');
  if(!q.length) return null;
  const m=[masse(0),masse(1)], zwei=(D.dim===2);
  const vv=vVor||[{x:B[0].vx,y:B[0].vy},{x:B[1].vx,y:B[1].vy}], vn=vNach;
  const fv=v=>zwei?(fz(v.x,2)+'  |  '+fz(-v.y,2)):fz(v.x,2);
  const mul=(s,a)=>({x:s*a.x,y:s*a.y}), add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}), q2=a=>a.x*a.x+a.y*a.y;
  const Z=[];
  q.forEach(k=>{
    if(k==='v'){
      Z.push({neu:true,l:'v vor dem Stoß in m/s',c:[fv(vv[0]),fv(vv[1]),'']});
      Z.push({l:'v nach dem Stoß in m/s',c:vn?[fv(vn[0]),fv(vn[1]),'']:['–','–','']});
    } else if(k==='p'){
      const a=[mul(m[0],vv[0]),mul(m[1],vv[1])];
      Z.push({neu:true,l:'p vor dem Stoß in kg·m/s',c:[fv(a[0]),fv(a[1]),fv(add(a[0],a[1]))]});
      if(vn){ const b=[mul(m[0],vn[0]),mul(m[1],vn[1])];
        Z.push({l:'p nach dem Stoß in kg·m/s',c:[fv(b[0]),fv(b[1]),fv(add(b[0],b[1]))]}); }
      else Z.push({l:'p nach dem Stoß in kg·m/s',c:['–','–','–']});
    } else {
      const E1=[0.5*m[0]*q2(vv[0]),0.5*m[1]*q2(vv[1])];
      Z.push({neu:true,l:'E vor dem Stoß in J',c:[fz(E1[0]),fz(E1[1]),fz(E1[0]+E1[1])]});
      if(vn){ const E2=[0.5*m[0]*q2(vn[0]),0.5*m[1]*q2(vn[1])];
        Z.push({l:'E nach dem Stoß in J',c:[fz(E2[0]),fz(E2[1]),fz(E2[0]+E2[1])]});
        Z.push({l:'davon innere Energie in J',c:['','',fz(Math.max(0,E1[0]+E1[1]-E2[0]-E2[1]))]});
      } else Z.push({l:'E nach dem Stoß in J',c:['–','–','–']});
    } });
  return {kopf:['',zwei?'Körper 1   x | y':'Körper 1',zwei?'Körper 2   x | y':'Körper 2','zusammen'],z:Z}; }

function malTabelle(tb,x0,y0,maxW){
  let fs=Math.min(14,13*kk);
  const masse_=()=>{ ctx.font=schrift(fs,true);
    let wl=0, wc=0;
    tb.z.forEach(z=>{ ctx.font=schrift(fs,false); wl=Math.max(wl,ctx.measureText(z.l).width);
      ctx.font=schrift(fs,true); z.c.forEach(s=>{ wc=Math.max(wc,ctx.measureText(s).width); }); });
    tb.kopf.slice(1).forEach(s=>{ wc=Math.max(wc,ctx.measureText(s).width); });
    return {wl:wl+14, wc:wc+20}; };
  let b=masse_(), ges=b.wl+3*b.wc;
  if(ges>maxW){ fs=Math.max(8,fs*maxW/ges); b=masse_(); ges=b.wl+3*b.wc; }
  const rh=Math.max(13,fs*1.6), hGes=rh*(tb.z.length+1)+4;
  const mitte=j=>x0+b.wl+(j+0.5)*b.wc;
  /* Spalte „zusammen" leicht hinterlegt */
  ctx.fillStyle='#f6f8fc'; ctx.fillRect(x0+b.wl+2*b.wc,y0,b.wc,rh*(tb.z.length+1));
  for(let j=0;j<3;j++) txt(tb.kopf[j+1],mitte(j),y0+rh*0.55,{sz:fs,fett:true,farbe:[F1,F2,'#334155'][j]});
  ctx.strokeStyle='#dde4ee'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x0,y0+rh); ctx.lineTo(x0+ges,y0+rh); ctx.stroke();
  tb.z.forEach((z,k)=>{
    const y=y0+rh*(k+1)+rh*0.55;
    if(z.neu&&k>0){ ctx.strokeStyle='#eef2f7'; ctx.beginPath();
      ctx.moveTo(x0,y0+rh*(k+1)); ctx.lineTo(x0+ges,y0+rh*(k+1)); ctx.stroke(); }
    txt(z.l,x0+4,y,{al:'left',sz:fs,farbe:'#475569'});
    for(let j=0;j<3;j++){ if(!z.c[j]) continue;
      txt(z.c[j],mitte(j),y,{sz:fs,fett:true,farbe:[F1,F2,'#1f2430'][j]}); } });
  return hGes; }

/* ---------- Gesamtbild ---------- */
function geo(oben,unten){
  const hV=Math.max(50,unten-oben), wV=Math.max(80,W-32);
  let sc;
  if(D.dim===1){ sc=wV/LX;
    const d=2*Math.max(rI(0),rI(1));
    if(d*sc>hV*0.5) sc=hV*0.5/d; }
  else sc=Math.min(wV/LX,hV/LY);
  SC=sc; OX=(W-LX*sc)/2;
  OY=oben+(hV-LY*sc)/2;
  yMid=(D.dim===1)?(oben+hV*0.44):(OY+LY*sc/2); }
const PX=x=>OX+x*SC;
const PY=y=>(D.dim===1)?yMid:(OY+y*SC);

function malLive(oben,unten){
  geo(oben,unten);
  if(D.dim===1) malBahn1D(PX,SC,yMid,true); else malFeld2D(PX,PY,SC,true);
  /* alles Bewegte bleibt im Spielbereich – sonst schiebt sich ein Körper,
     der die Fläche verlässt, über die Wertetabelle */
  ctx.save(); ctx.beginPath(); ctx.rect(0,oben-2,W,unten-oben+4); ctx.clip();
  const S=(schau&&rec.length)?probeBei(tAb):null;
  const pos=S?[S.a,S.b]:[B[0],B[1]];
  const K=pfeilSkala();
  malStossOrt(PX,PY,SC);
  if(D.pfeil.v||D.pfeil.p) malKonstruktion(K,PX,PY,SC);
  const tt=S?S.t:t, nach=(tStoss!==null&&tt>=tStoss-1e-9), st=nach?'′':'';
  /* erst die Pfeile, dann die Körper – so liegt kein Schaft über der Nummer */
  for(let i=0;i<2;i++){ const p=pos[i], nr=(i?'₂':'₁');
    if(D.pfeil.v) malPfeil(PX(p.x),PY(p.y),p.vx*K.kv*SC,(D.dim===1?0:p.vy*K.kv*SC),i?F2:F1,3.2,false,'v'+nr+st,false);
    if(D.pfeil.p){ const o=perp(p.vx||1,(D.dim===1?0:p.vy),13*kk);
      malPfeil(PX(p.x)+o.x,PY(p.y)+o.y,p.vx*masse(i)*K.kp*SC,(D.dim===1?0:p.vy*masse(i)*K.kp*SC),FP,3.2,false,'p'+nr+st,true); } }
  for(let i=0;i<2;i++) malKoerperR(PX(pos[i].x),PY(pos[i].y),i,rI(i)*SC,{masse:true});
  if(einstellbar()) for(let i=0;i<2;i++) malGriff(i,K);
  ctx.restore();
  if(tStoss===null) malKeinStoss(oben);
  malBilanz(oben,unten);
  txt('t = '+fz(tt,2)+' s',W-12,oben+3,{al:'right',bl:'top',sz:12.5*kk,fett:true,farbe:'#475569'}); }

function strobo1D(Z,oben,unten){
  const n=Z.length, u2=unten-20*kk;
  const hV=Math.max(40,u2-oben), rh=hV/n;
  const fs0=Math.min(12*kk,Math.max(8.5,rh*0.46));
  ctx.font=schrift(fs0,true);
  const lm=Math.min(W*0.3,ctx.measureText('t = 00,00 s').width+20);
  const rmax=Math.max(rI(0),rI(1)), wV=W-14-lm;
  const sc=Math.min(wV/LX,0.36*rh/rmax);
  const ox=lm+(wV-LX*sc)/2, px=x=>ox+x*sc;
  const P=Z.map((tt,k)=>{ const S=probeBei(tt);
    return {t:tt,y:oben+(k+0.5)*rh,a:S.a.x,b:S.b.x,
            st:(tStoss!==null&&Math.abs(tt-tStoss)<1e-9)}; });
  P.forEach(p=>{ if(p.st){ ctx.fillStyle='#fef6e0';
    ctx.fillRect(lm-10,p.y-rh/2+1,W-8-(lm-10),rh-2); } });
  ctx.strokeStyle='#eaeff6'; ctx.lineWidth=1;
  P.forEach(p=>{ ctx.beginPath(); ctx.moveTo(px(0),p.y); ctx.lineTo(px(LX),p.y); ctx.stroke(); });
  [['a',F1],['b',F2]].forEach(ab=>{ ctx.save(); ctx.strokeStyle=ab[1]; ctx.globalAlpha=0.5;
    ctx.lineWidth=1.6; ctx.setLineDash([3,3]); ctx.beginPath();
    P.forEach((p,i)=>{ const x=px(p[ab[0]]); if(i) ctx.lineTo(x,p.y); else ctx.moveTo(x,p.y); });
    ctx.stroke(); ctx.restore(); });
  const fs=fs0;
  P.forEach(p=>{
    txt('t = '+fz(p.t,2)+' s',lm-14,p.y,{al:'right',sz:fs,fett:p.st,farbe:p.st?'#b45309':'#64748b'});
    malKoerperR(px(p.a),p.y,0,rI(0)*sc,{alpha:p.st?1:0.82,nr:p.st});
    malKoerperR(px(p.b),p.y,1,rI(1)*sc,{alpha:p.st?1:0.82,nr:p.st});
    if(p.st) txt('Stoß',W-10,p.y,{al:'right',sz:fs,fett:true,farbe:'#b45309'}); });
  /* Maßstab unten */
  const yS=u2+4;
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(px(0),yS); ctx.lineTo(px(LX),yS); ctx.stroke();
  for(let k=0;k<=LX*2;k++){ const x=px(k/2), gr=(k%2===0);
    ctx.beginPath(); ctx.moveTo(x,yS); ctx.lineTo(x,yS+(gr?6:3)); ctx.stroke();
    if(gr) txt((k/2)+(k===LX*2?' m':''),x,yS+13*kk,{sz:10*kk,farbe:FGR}); } }

function strobo2D(Z,oben,unten){
  const hV=Math.max(60,unten-oben), wV=W-32;
  const sc=Math.min(wV/LX,hV/LY);
  const ox=(W-LX*sc)/2, oy=oben+(hV-LY*sc)/2;

  [['a',F1],['b',F2]].forEach(ab=>{ ctx.save(); ctx.strokeStyle=ab[1]; ctx.globalAlpha=0.45;

  P.forEach((p,k)=>{ const al=0.35+0.65*(P.length<2?1:k/(P.length-1));
    for(let i=0;i<2;i++){ const o=i?p.b:p.a, r=rI(i)*sc;
      malKoerperR(px(o.x),py(o.y),i,r,{offen:!p.st,alpha:p.st?1:al,nr:false});
      txt(fz(p.t,2)+' s',px(o.x),py(o.y)+(i?r+10*kk:-r-10*kk),
        {sz:10*kk,fett:p.st,farbe:p.st?'#b45309':'#64748b',rand:'#fff',randB:3}); } });
  if(tStoss!==null){ malStossOrt(px,py,sc);
    if(D.pfeil.v||D.pfeil.p) malKonstruktion(pfeilSkala(),px,py,sc); } }

function malStrobo(oben,unten){
  const Z=blitzZeiten();

function zeichne(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(unten-oben<60){ txt('Zu wenig Platz – Werte ausblenden oder das Fenster größer ziehen',
      W/2,(oben+H)/2,{sz:12*kk,farbe:FGR}); hinweis(); return; }
  if(D.strobo) malStrobo(oben,unten); else malLive(oben,unten);
  hinweis(); }
function resize(){ DPR=Math.min(3,window.devicePixelRatio||1);

/* ---------- Hinweiszeile ---------- */
function hinweis(){ const h=$('hint');

  if(D.strobo) s='Stroboskop: Der Zeitpunkt des Stoßes ist immer dabei · „Blitze" ändert die Anzahl · „Speichern" legt das Bild als Datei ab';

/* ---------- Eingabefelder ---------- */
function feldSync(){
  const setz=(id,s)=>{ const el=$(id); if(document.activeElement===el) return; if(el.value!==s) el.value=s; };
  setz('em1',zahl(masse(0))); setz('em2',zahl(masse(1)));
  if(D.dim===1){ setz('ev1',zahl(+D.g1.x||0,2)); setz('ev2',zahl(+D.g2.x||0,2)); }
  else for(let i=0;i<2;i++){ const g=gv(i), b=Math.hypot(+g.x||0,+g.y||0);
    if(b>1e-6) winkelMerk[i]=Math.atan2(-(+g.y||0),+g.x||0)*180/Math.PI;   /* Richtung merken für den Griff */
    setz(i?'ev2':'ev1',zahl(b,2)); } }

function leseFelder(){
  const m1=zahlEin($('em1').value); if(m1!==null) D.m1=Math.max(MMIN,Math.min(MMAX,m1));
  const m2=zahlEin($('em2').value); if(m2!==null) D.m2=Math.max(MMIN,Math.min(MMAX,m2));
  if(D.dim===1){
    const a=zahlEin($('ev1').value); if(a!==null) D.g1={x:Math.max(-VMAX,Math.min(VMAX,a)),y:0};
    const b=zahlEin($('ev2').value); if(b!==null) D.g2={x:Math.max(-VMAX,Math.min(VMAX,b)),y:0};
  } else for(let i=0;i<2;i++){
    /* In 2D steht im Feld nur der Betrag – die Richtung kommt vom Griff an der Pfeilspitze. */
    let b=zahlEin($(i?'ev2':'ev1').value);
    if(b===null) continue;
    if(b<0){ b=-b; winkelMerk[i]+=180; }
    b=Math.min(VMAX,b);
    const a=winkelMerk[i]*Math.PI/180, g=gv(i);
    g.x=b*Math.cos(a); g.y=-b*Math.sin(a);
    if(Math.abs(g.x)<1e-12) g.x=0; if(Math.abs(g.y)<1e-12) g.y=0;
  }
  neuStart(); knoepfe(); feldSync(); zeichne(); sync(); }
['em1','em2','ev1','ev2'].forEach(id=>{ const el=$(id);
  el.addEventListener('change',leseFelder);
  el.addEventListener('keydown',e=>{ if(e.key==='Enter') el.blur(); }); });

/* ---------- Aufstellen und Geschwindigkeit einstellen ----------
   Mit dem Finger wird der Körper nur hingestellt. Betrag und Richtung der
   Anfangsgeschwindigkeit kommen vom Griff an der Spitze des Pfeils. Beides
   geht nur im Stand – während des Ablaufs wäre es kein Stoß mehr. */
function ortVon(e){ const r=cv.getBoundingClientRect();
  const pxx=e.clientX-r.left, pyy=e.clientY-r.top;
  return {px:pxx, py:pyy, x:(pxx-OX)/SC, y:(D.dim===1)?LY/2:((pyy-OY)/SC)}; }
function treffer(p){
  for(let i=1;i>=0;i--){ const r=rI(i), tol=14/Math.max(1,SC);
    if(D.dim===1){ if(Math.abs(p.py-yMid)>r*SC+16) continue;
      if(Math.abs(p.x-B[i].x)<=r+tol) return i; }
    else if(Math.hypot(p.x-B[i].x,p.y-B[i].y)<=r+tol) return i; }
  return -1; }
function griffTreffer(p){
  if(!einstellbar()) return -1;
  const K=pfeilSkala();
  for(let i=1;i>=0;i--){ const G=griffOrt(i,K);
    if(Math.hypot(p.px-G.x,p.py-G.y)<=22*kk) return i; }
  return -1; }
cv.addEventListener('pointerdown',e=>{
  if(D.strobo||lauf) return;
  const p=ortVon(e);
  const gi=griffTreffer(p);
  if(gi>=0){ e.preventDefault();
    skalaFest=pfeilSkala();                 /* Maßstab festhalten, sonst läuft die Spitze davon */
    ziehG={i:gi};
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    zeichne(); return; }
  const i=treffer(p);
  if(i<0) return;
  e.preventDefault();
  if(tEnde!==null||t>1e-4||schau){ toast('Erst mit ↺ an den Anfang'); return; }
  zieh={i:i, gx:p.x-B[i].x, gy:p.y-B[i].y};
  try{ cv.setPointerCapture(e.pointerId); }catch(err){} });
cv.addEventListener('pointermove',e=>{
  if(ziehG){ e.preventDefault(); spitzeAuf(ziehG.i,ortVon(e)); return; }
  if(!zieh) return;
  e.preventDefault();
  const p=ortVon(e), i=zieh.i, r=rI(i), R=r+rI(1-i), o=B[1-i];
  let nx=p.x-zieh.gx, ny=(D.dim===1)?LY/2:(p.y-zieh.gy);
  nx=Math.max(r,Math.min(LX-r,nx));
  if(D.dim===2) ny=Math.max(r,Math.min(LY-r,ny));
  let dx=nx-o.x, dy=(D.dim===1)?0:ny-o.y, d=Math.hypot(dx,dy);
  if(d<R){ if(d<1e-9){ dx=(i?1:-1); dy=0; d=1; }
    nx=o.x+dx/d*R; if(D.dim===2) ny=o.y+dy/d*R;
    nx=Math.max(r,Math.min(LX-r,nx)); if(D.dim===2) ny=Math.max(r,Math.min(LY-r,ny)); }
  B[i].x=nx; B[i].y=ny;
  const sp=sv(i); sp.x=nx; sp.y=ny;
  rec=[]; probe(); zeichne(); },{passive:false});
function ziehEnde(){
  if(ziehG){ ziehG=null; skalaFest=null; knoepfe(); feldSync(); zeichne(); sync(); return; }
  if(!zieh) return;
  zieh=null; rec=[]; probe(); knoepfe(); feldSync(); zeichne(); sync(); }
cv.addEventListener('pointerup',ziehEnde);
cv.addEventListener('pointercancel',ziehEnde);

/* ---------- Ablaufschleife ---------- */
function loop(ts){
  const dt=Math.min(0.05,(ts-letztT)/1000||0); letztT=ts;
  if(lauf){ schritt(dt*tempo());
    if(pruefEnde()){ knoepfe(); }
    abZeig(); zeichne(); }
  else if(ab){ tAb+=dt*tempo();
    if(tAb>=recEnde()){ tAb=recEnde(); ab=false; knoepfe(); }
    abZeig(); zeichne(); }
  requestAnimationFrame(loop); }

let ready=false, syncT=null;
function post(){ syncT=null; if(window.parent===window||!ready) return;
  try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
function sync(){ if(!syncT) syncT=setTimeout(post,250); }
function punkt(a,b){ return {x:(b&&isFinite(+b.x))?+b.x:a.x, y:(b&&isFinite(+b.y))?+b.y:a.y}; }
function uebernimm(d){ if(!d) return;
  const s=standard();
  D=Object.assign(s,d);
  D.dim=(+d.dim===2)?2:1;
  D.elast=(d.elast!==false);
  D.m1=Math.max(MMIN,Math.min(MMAX,+d.m1||s.m1));
  D.m2=Math.max(MMIN,Math.min(MMAX,+d.m2||s.m2));
  D.s1=punkt(s.s1,d.s1); D.s2=punkt(s.s2,d.s2);
  D.g1=punkt(s.g1,d.g1); D.g2=punkt(s.g2,d.g2);
  D.wert=Object.assign({},s.wert,d.wert||{});
  D.pfeil=Object.assign({},s.pfeil,d.pfeil||{});
  D.tempo=Math.max(0,Math.min(TEMPI.length-1,+d.tempo||0));
  D.blitze=Math.max(3,Math.min(60,+d.blitze||s.blitze));
  D.babst=Math.max(0,+d.babst||0);
  D.strobo=false;                         /* die Aufnahme selbst wird nicht gespeichert */
  document.documentElement.style.setProperty('--fs',Math.min(18,D.fontSize||14)+'px');
  neuStart(); knoepfe(); feldSync(); resize(); }
function zustand(){ return D; }
addEventListener('message',e=>{
  if(e.source!==window&&(window.parent===window||e.source!==window.parent)) return;
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return;
  uebernimm(e.data.data); ready=true;
  if(window.TafelModus) TafelModus.refresh(); });
if(window.TafelTeilen&&!TafelTeilen.istGeteilt())
  TafelTeilen.knopf($('barR'),'stoss.html',()=>({w:'stoss', d:zustand()}));
addEventListener('resize',()=>{ resize(); barFade(); });
function barFade(){ const bar=$('bar'), m=$('barMid');
  bar.classList.remove('compact');
  const mehr=m.scrollWidth>m.clientWidth+2;
  if(mehr&&m.clientWidth<170) bar.classList.add('compact');
  m.classList.toggle('more',mehr); }
$('barMid').addEventListener('scroll',barFade);

window.addEventListener('load',()=>{
  const geteilt=window.TafelTeilen&&TafelTeilen.istGeteilt();
  if(window.TafelModus&&!geteilt)
    TafelModus.init({get:()=>D.edit!==false, set:v=>{ D.edit=v; resize(); barFade(); sync(); }});
  document.documentElement.style.setProperty('--fs',Math.min(18,D.fontSize||14)+'px');
  if(window.TafelShot) TafelShot.buttons($('shotBtns'),bild,'btn');
  neuStart(); knoepfe(); feldSync(); resize(); barFade();
  requestAnimationFrame(ts=>{ letztT=ts; loop(ts); });
  if(window.ResizeObserver) new ResizeObserver(()=>{ resize(); barFade(); }).observe($('cvbox'));
  if(geteilt){ TafelTeilen.nurBenutzen(); D.edit=false; ready=true;
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='stoss'&&p.d) TafelTeilen.einspielen(p.d); }).catch(()=>{});
    return; }
  if(window.parent===window){ ready=true; return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  setTimeout(()=>{ ready=true; },700); });
</script>
