<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Funktionsplotter</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;touch-action:none;}
  #app{display:flex;flex-direction:column;height:100%;}
  #top{flex:none;padding:6px 8px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid #e6eaf0;}
  .frow{display:flex;gap:6px;align-items:center;}
  .func{gap:6px;}
  .fcol{width:calc(var(--k) * 16px);height:calc(var(--k) * 16px);border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #cfd6e0;cursor:pointer;}
  .fcol:active{box-shadow:0 0 0 2px #2563eb;}
  /* Farbwähler zum Punkt vor der Funktion */
  #colPop{position:fixed;z-index:60;display:none;grid-template-columns:repeat(5,30px);gap:8px;
    background:#fff;border:1px solid #cfd6e0;border-radius:13px;box-shadow:0 8px 28px rgba(15,23,42,.24);padding:9px;}
  #colPop.show{display:grid;}
  #colPop button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cfd6e0;cursor:pointer;padding:0;}
  #colPop button.on{box-shadow:0 0 0 2px #2563eb;}
  #colPop input[type=color]{width:30px;height:30px;padding:0;border:1px solid #cfd6e0;border-radius:50%;background:none;cursor:pointer;}
  :root{--k:1;}
  body.fb .fterm,body.fb .fname{font-weight:800;} body.fi .fterm{font-style:italic;}
  .fname{font-size:calc(var(--k) * 14px);white-space:nowrap;font-weight:700;}
  .fterm{flex:1;min-width:0;padding:calc(var(--k) * 7px) 8px;border:1px solid #cfd6e0;border-radius:8px;font-size:calc(var(--k) * 15px);font-family:inherit;-webkit-user-select:text;user-select:text;}
  .func.active .fterm{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.18);}
  .fdel{border:none;background:#eef1f5;color:#8a93a2;width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;flex:none;}
  .fhide{border:none;background:#eef1f5;width:30px;height:30px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;flex:none;filter:grayscale(1);opacity:.6;}
  .fhide.on{background:#dbeafe;filter:none;opacity:1;}
  .verdeckt{flex:1;min-width:0;padding:calc(var(--k) * 7px) 8px;border:1px dashed #cfd6e0;border-radius:8px;
    font-size:calc(var(--k) * 15px);color:#94a3b8;letter-spacing:4px;background:#f8fafc;white-space:nowrap;overflow:hidden;}
  #fbtns{gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  #fbtns>*{flex:0 0 auto;}
  #fbtns::-webkit-scrollbar{height:4px;} #fbtns::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  #add{border:none;border-radius:8px;background:#e7ebf1;padding:7px 12px;font-size:14px;cursor:pointer;font-weight:700;color:#2563eb;}
  #fit{border:none;border-radius:8px;background:#e7ebf1;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .fsb{border:none;border-radius:8px;background:#e7ebf1;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:700;color:#1f2430;}
  .fsb.on{background:#2563eb;color:#fff;}
  /* ---- Tabs ---- */
  #tabs{display:flex;gap:10px;flex-wrap:wrap;}
  #tabs button{flex:1 1 auto;white-space:nowrap;border:1px solid #cfd6e0;background:#f4f6fa;border-radius:10px;padding:calc(var(--k) * 6px) 6px;font-weight:700;font-size:calc(var(--k) * 13px);font-family:inherit;color:#53617a;cursor:pointer;}
  #tabs button.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  /* Graph, Tabelle und Maschine gehören zusammen (eine Funktion) – Transformationen steht für sich */
  #tabs .tgrp{display:flex;flex:3 1 220px;border:1px solid #cfd6e0;border-radius:10px;overflow:hidden;background:#f4f6fa;}
  #tabs .tgrp button{flex:1 1 0;border:none;border-right:1px solid #cfd6e0;border-radius:0;background:transparent;}
  #tabs .tgrp button:last-child{border-right:none;}
  #tabs .tgrp button.on{background:#2563eb;}
  #tabR{flex:1 1 150px;}
  body:not(.t-g) #funcs,body:not(.t-g) #add,body:not(.t-g) #fit,body:not(.t-g) #btnX,body:not(.t-g) #btnY{display:none;}
  body.kp-open #app{height:calc(100% - var(--kph,230px));}
  #keypad{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#eef1f6;border-top:1px solid #cfd6e0;padding:6px;display:none;flex-direction:column;gap:5px;touch-action:manipulation;}
  #keypad.show{display:flex;}
  #keypad .kp-row{display:flex;gap:5px;}
  #keypad .kp-row.chips{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #keypad button{flex:1 1 0;min-width:0;height:42px;border:1px solid #cfd6e0;background:#fff;border-radius:9px;font-size:18px;font-weight:600;font-family:inherit;color:#1f2430;cursor:pointer;padding:0;}
  #keypad button:active{background:#dbe4f0;}
  #keypad button.fn{flex:0 0 auto;height:36px;padding:0 12px;font-size:15px;font-weight:700;color:#2563eb;}
  #keypad button.op{background:#f4f6fa;}
  #keypad button.act{background:#3b82f6;border-color:#3b82f6;color:#fff;flex:1.6 1 0;}
  #keypad button.del{background:#fee2e2;border-color:#fca5a5;}
  #sliders{display:flex;flex-direction:column;gap:2px;}
  .sl{display:flex;align-items:center;gap:8px;font-size:calc(var(--k) * 13px);}
  .sl label{width:calc(var(--k) * 46px);font-weight:700;color:#2563eb;}
  .sl input[type=range]{flex:1;}
  .sl .v{width:calc(var(--k) * 46px);text-align:right;font-variant-numeric:tabular-nums;}
  #wrap{flex:1;position:relative;min-height:0;}
  .panel{position:absolute;inset:0;display:none;}
  .panel.on{display:block;}
  #pG{overflow:hidden;}
  #pT,#pM{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px;}
  /* Reiter „Transformationen": Bedienteil oben, Zeichenfläche darunter */
  #pR{display:none;flex-direction:column;overflow:hidden;}
  #pR.on{display:flex;}
  #trTop{flex:none;padding:6px 8px 4px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid #eef1f6;}
  .trRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .trRow[hidden]{display:none;}
  .trLbl{font:800 italic calc(var(--k) * 14px) inherit;color:#53617a;cursor:pointer;
         border:1px solid transparent;background:transparent;border-radius:8px;
         padding:calc(var(--k) * 4px) calc(var(--k) * 6px);white-space:nowrap;}
  .trLbl.on{color:#1d4ed8;background:#eaf1ff;border-color:#bcd2ff;}
  .trIn.on{border-color:#2563eb;box-shadow:0 0 0 2px #dbeafe;}
  .trIn{flex:1 1 120px;min-width:90px;border:1px solid #cfd6e0;border-radius:8px;padding:calc(var(--k) * 6px) 8px;
        font:600 calc(var(--k) * 14px) ui-monospace,Menlo,Consolas,monospace;color:#1f2430;background:#fff;}
  #trBsp{border:1px solid #cfd6e0;border-radius:8px;padding:calc(var(--k) * 5px) 6px;font:600 calc(var(--k) * 13px) inherit;background:#f4f6fa;color:#1f2430;}
  .trChk label{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:calc(var(--k) * 13px);color:#53617a;white-space:nowrap;}
  .trChk input{width:17px;height:17px;}
  .trSeg{border:1px solid #cfd6e0;background:#f4f6fa;border-radius:8px;padding:calc(var(--k) * 5px) 9px;
         font:700 calc(var(--k) * 12.5px) inherit;color:#53617a;cursor:pointer;white-space:nowrap;}
  .trSeg.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .trWahl{gap:4px;}
  /* Die vier Parameter stehen immer untereinander – egal, wie breit das Werkzeug ist */
  #trSl{display:grid;grid-template-columns:1fr;gap:calc(var(--k) * 9px);
        margin-bottom:calc(var(--k) * 8px);}
  #trSl[hidden]{display:none;}
  /* Die beiden Ablaufregler stehen neben den Umschaltknöpfen */
  #trSl2{flex:1 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:2px 14px;}
  #trSl2 .ablauf{min-width:0;}
  #trSl2 .grp{font:700 calc(var(--k) * 11.5px) inherit;color:#64748b;line-height:1.2;}
  #trSl2[hidden]{display:none;}

  #trSl2 .sl .trPkt{width:calc(var(--k) * 12px);height:calc(var(--k) * 12px);border-radius:50%;flex:0 0 auto;}
  .trHin{font:600 calc(var(--k) * 12px) inherit;color:#64748b;}
  .trHin.ok{color:#16a34a;}
  #trSl .sl,#trSl2 .sl{display:flex;align-items:center;gap:6px;}
  #trSl .sl label,#trSl2 .sl label{font:800 calc(var(--k) * 13px) inherit;font-style:italic;width:calc(var(--k) * 20px);color:#1f2430;}
  #trSl .sl .trCol,#trSl2 .sl .trCol{width:calc(var(--k) * 16px);height:calc(var(--k) * 16px);border-radius:50%;border:2px solid #fff;
                   box-shadow:0 0 0 1px #cfd6e0;padding:0;cursor:pointer;flex:0 0 auto;}
  #trSl .sl input,#trSl2 .sl input{flex:1;min-width:60px;}
  #trSl .sl .v,#trSl2 .sl .v{font:700 calc(var(--k) * 13px) ui-monospace,Menlo,monospace;min-width:38px;text-align:right;color:#53617a;}
  #trSl2 .sl span.v{min-width:calc(var(--k) * 112px);white-space:nowrap;text-align:right;
                     font:600 calc(var(--k) * 11.5px) inherit;color:#53617a;}
  #trSl2 .sl label{width:auto;}
  #trSl2 .sl input{min-width:40px;}
  #trOut{font-size:calc(var(--k) * 13px);line-height:1.45;color:#1f2430;}
  #trOut .zg{color:#b45309;} #trOut .zf{color:#64748b;} #trOut .zv{color:#7c3aed;}
  #trOut b{font-weight:800;}
  /* Termkasten: deutlich groesser als der Erklaertext, Parameter in ihrer Farbe */
  #trOut .trBox{display:block;margin:0 0 calc(var(--k) * 4px);
                padding:calc(var(--k) * 5px) calc(var(--k) * 11px);border:1px solid #dbe2ec;
                border-radius:calc(var(--k) * 10px);background:#f7f9fc;max-width:100%;
                overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-x:contain;
                -webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  /* width:max-content – sonst bleibt die Zeile so breit wie der Kasten und laesst sich nicht schieben */
  #trOut .trT{font-size:calc(var(--k) * 17px);font-weight:800;line-height:1.35;white-space:nowrap;
              width:max-content;min-width:100%;}
  #trOut .trT2{margin-top:calc(var(--k) * 2px);}
  #trOut .trT i{font-style:italic;}
  /* Graph links, Terme und Wortbeschreibung rechts daneben */
  #trMain{flex:1;display:flex;gap:calc(var(--k) * 8px);min-height:0;padding:0 8px 8px;}
  #trPlotWrap{flex:1;position:relative;min-height:0;min-width:0;border:1px solid #e6ebf3;border-radius:12px;overflow:hidden;}
  #trSide{flex:0 0 clamp(200px, 32%, 340px);min-height:0;overflow:auto;background:#fff;
          border:1px solid #e6ebf3;border-radius:12px;padding:calc(var(--k) * 7px) calc(var(--k) * 10px);}
  #trMain > [hidden]{display:none;}
  #trPlotWrap[hidden] ~ #trSide{flex:1 1 auto;}   /* ohne Graph nimmt die Spalte die ganze Breite */
  @media (max-width:720px){ #trMain{flex-direction:column;}
    #trSide{flex:0 1 auto;max-height:45%;} }
  /* Wortbeschreibung: eigene Ueberschrift, je Schritt eine Zeile in der Farbe des Parameters */
  #trSide .wTitel{margin:calc(var(--k) * 8px) 0 calc(var(--k) * 3px);font-size:calc(var(--k) * 11px);
                 font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#64748b;}
  #trSide .wTitel:first-child,#trOut .wTitel:first-child{margin-top:0;}
  #trSlTitel[hidden]{display:none;}
  #trOut .wList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--k) * 5px);}
  #trOut .wList li{background:#f7f9fc;border:1px solid #e6ebf3;border-left:4px solid #94a3b8;
                   border-radius:8px;padding:calc(var(--k) * 5px) calc(var(--k) * 8px);
                   font-size:calc(var(--k) * 13.5px);line-height:1.35;}
  #trOut .wList li .p{font-weight:800;}
  #trOut .wNote{margin-top:calc(var(--k) * 4px);color:#64748b;font-size:calc(var(--k) * 12px);}
  #trOut .wLeer{color:#64748b;}
  #plotR{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  body.t-r #sliders{display:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;background:#fff;}
  #err{position:absolute;left:8px;top:6px;color:#ef4444;font-size:12px;}
  /* ---- Tabelle ---- */
  #ttab{border-collapse:collapse;font-size:calc(var(--k) * 14px);}
  #ttab th,#ttab td{border:1px solid #d7dde6;padding:calc(var(--k) * 4px) calc(var(--k) * 6px);text-align:center;white-space:nowrap;}
  #ttab th.ecke{background:#eef1f6;font-weight:800;font-style:italic;font-size:calc(var(--k) * 16px);}
  #ttab td.fz{text-align:left;background:#f8fafc;}
  #ttab td.fz>*{vertical-align:middle;}
  .fzin{display:flex;align-items:center;gap:5px;}
  .fzin .fterm,.fzin .verdeckt{flex:0 0 auto;width:calc(var(--k) * 150px);padding:calc(var(--k) * 5px) 7px;font-size:calc(var(--k) * 14px);}
  .xin{width:calc(var(--k) * 62px);text-align:center;border:1px solid #cfd6e0;border-radius:7px;padding:calc(var(--k) * 5px) 2px;font-size:calc(var(--k) * 14px);font-family:inherit;-webkit-user-select:text;user-select:text;}
  .yv{font-variant-numeric:tabular-nums;font-weight:700;}
  #tbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .plus{border:none;border-radius:8px;background:#e7ebf1;padding:calc(var(--k) * 7px) 12px;font-size:calc(var(--k) * 13px);cursor:pointer;font-weight:700;color:#2563eb;white-space:nowrap;}
  .plus.minus{color:#64748b;}
  /* ---- Maschine ---- */
  .masch{border:1px solid #d7dde6;border-radius:14px;padding:8px 10px 10px;margin-bottom:10px;background:#fbfcfe;}
  .mkopf{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .mmitte{display:flex;flex-direction:column;align-items:center;gap:0;}
  .mein,.maus{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:calc(var(--k) * 5px) calc(var(--k) * 12px);font-size:calc(var(--k) * 15px);font-weight:700;}
  .mein{background:#eef2f7;border:1px solid #cfd6e0;}
  .maus{background:#f0fdf4;border:1px solid #86efac;}
  .mlab{font-style:italic;font-weight:800;}
  .mxin{width:calc(var(--k) * 72px);text-align:center;border:1px solid #cfd6e0;border-radius:7px;padding:calc(var(--k) * 4px) 2px;font-size:calc(var(--k) * 15px);font-family:inherit;background:#fff;-webkit-user-select:text;user-select:text;}
  .mval{font-variant-numeric:tabular-nums;min-width:calc(var(--k) * 52px);text-align:center;}
  .mtr{width:calc(var(--k) * 150px);height:calc(var(--k) * 20px);background:#dbe4f0;clip-path:polygon(0 0,100% 0,70% 100%,30% 100%);}
  .mch{width:calc(var(--k) * 150px);height:calc(var(--k) * 20px);background:#dbe4f0;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);}
  .mbody{display:flex;align-items:center;justify-content:center;gap:calc(var(--k) * 10px);min-width:calc(var(--k) * 210px);
    background:linear-gradient(#f6f8fb,#e6ebf3);border:2px solid #b9c4d4;border-radius:12px;padding:calc(var(--k) * 9px) calc(var(--k) * 12px);}
  .mterm{font-size:calc(var(--k) * 17px);font-weight:800;white-space:nowrap;}
  .zahn{font-size:calc(var(--k) * 19px);color:#94a3b8;display:inline-block;}
  .masch.rechnet .z1{animation:dreh .7s linear;}
  .masch.rechnet .z2{animation:drehr .7s linear;}
  .masch.rechnet .maus{animation:pop .55s ease;}
  @keyframes dreh{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes drehr{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
  @keyframes pop{0%{transform:scale(.55);opacity:.25}60%{transform:scale(1.14)}100%{transform:scale(1)}}
  .mweg{font-size:calc(var(--k) * 14px);color:#475569;margin:calc(var(--k) * 5px) 0 calc(var(--k) * 3px);text-align:center;}
  #mbtns{display:flex;gap:8px;}
</style>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>

<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$('plot'), ctx=cv.getContext('2d');
let dpr=Math.max(1,window.devicePixelRatio||1), W=0, H=0;
let view={ox:0,oy:0,unit:40};
let params={a:1,b:0,c:0};
let fontSize=13, fontBold=false, fontItalic=false;
const GCOL=['#2563eb','#e11d48','#16a34a','#f59e0b','#7c3aed','#db2777','#0891b2','#ea580c'];
const DEFW=2.4;
let funcs=[{term:'a*x^2+b*x+c', color:GCOL[0], width:DEFW, mx:'2', toks:[]}];
let activeIdx=0;
let tab='g';                                       /* g = Graph, t = Tabelle, m = Maschine */
let xs=['−2','−1','0','1','2'];                    /* x-Werte der Tabelle */
let xPt={on:false,v:1}, yPt={on:false,v:1};        /* bewegliche Punkte auf den Achsen */

const SUB='₀₁₂₃₄₅₆₇₈₉';
const sub=n=>String(n).split('').map(d=>SUB[+d]).join('');
const HOCH={'-':'⁻','−':'⁻','+':'','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const hoch=s=>String(s).split('').map(c=>HOCH[c]!==undefined?HOCH[c]:c).join('');
/* Zahlen deutsch ausgeben, sehr große/kleine als Zehnerpotenz */
function zahl(v){ if(v==null||typeof v!=='number'||!isFinite(v)) return '—';
  const r=Math.round(v*1e4)/1e4;
  if(Math.abs(r)>=1e7||(r!==0&&Math.abs(r)<1e-4)){ const p=v.toExponential(3).split('e');
    return p[0].replace('.',',').replace('-','−')+'·10'+hoch(p[1]); }
  return String(r).replace('.',',').replace('-','−'); }
/* deutsche Eingabe lesen: Komma und typografisches Minus erlaubt */
function pz(s){ const t=String(s==null?'':s).replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'');
  if(!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(t)) return NaN; return parseFloat(t); }

function resize(){ if(!cv.clientWidth||!cv.clientHeight) return;
  dpr=Math.max(1,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  if(!view.ox&&!view.oy){ view.ox=W/2; view.oy=H/2; } draw(); }

/* ---- Term auswerten ---- */
function tokenize(s){ s=String(s).replace(/\|([^|]*)\|/g,'abs($1)');   /* |x| = Betrag */
  const t=[]; let i=0; while(i<s.length){ const c=s[i];
  if(c===' '){i++;continue;}
  if('+-*/^(),'.includes(c)){ t.push({k:c}); i++; continue; }
  if(c==='−'){ t.push({k:'-'}); i++; continue; }
  if(/[0-9.]/.test(c)){ let j=i; while(j<s.length&&/[0-9.]/.test(s[j]))j++; t.push({k:'num',v:parseFloat(s.slice(i,j))}); i=j; continue; }
  if(/[a-zA-Z]/.test(c)){ let j=i; while(j<s.length&&/[a-zA-Z0-9]/.test(s[j]))j++; const w=s.slice(i,j).toLowerCase();
    // zusammengeschriebene Namen zerlegen: „ax“ → a·x, „2xsin“ → 2·x·sin
    let k=0; while(k<w.length){ const nm=PNAMES.find(n=>w.startsWith(n,k)); if(!nm){ t.push({k:'id',v:w.slice(k)}); break; } t.push({k:'id',v:nm}); k+=nm.length; }
    i=j; continue; }
  t.push({k:'?'}); i++; }                                /* unbekanntes Zeichen: Term gilt als ungueltig */
  // implizite Multiplikation: 2x, 3(x+1), x sin(x), (x+1)(x−1), a x
  const out=[]; for(let q=0;q<t.length;q++){ out.push(t[q]); const A=t[q], B=t[q+1]; if(!B) continue;
    const aEnd=A.k==='num'||A.k===')'||(A.k==='id'&&!PFUNCS.includes(A.v)), bStart=B.k==='num'||B.k==='id'||B.k==='(';
    if(aEnd&&bStart&&!(A.k==='num'&&B.k==='num')) out.push({k:'*'}); }
  return out; }
const PFUNCS=['asin','acos','atan','sin','cos','tan','sqrt','abs','ln','log','exp'];
const PNAMES=[...PFUNCS,'pi','x','a','b','c','e'];
function evalAt(x, T){ let p=0; const sc={x,a:params.a,b:params.b,c:params.c,pi:Math.PI,e:Math.E};
  const peek=()=>T[p], next=()=>T[p++];
  function E(){ let v=Tm(); while(peek()&&(peek().k==='+'||peek().k==='-')){ const o=next().k, r=Tm(); v=o==='+'?v+r:v-r; } return v; }
  function Tm(){ let v=Un(); while(peek()&&(peek().k==='*'||peek().k==='/')){ const o=next().k, r=Un(); v=o==='*'?v*r:v/r; } return v; }
  function Un(){ if(peek()&&(peek().k==='+'||peek().k==='-')){ const o=next().k, v=Un(); return o==='-'?-v:v; } return Pw(); }
  function Pw(){ let v=Pr(); if(peek()&&peek().k==='^'){ next(); v=Math.pow(v,Un()); } return v; }   /* -x^2 = -(x^2), 2^-3 bleibt moeglich */
  function Pr(){ const tk=peek(); if(!tk)return NaN;
    if(tk.k==='num'){ next(); return tk.v; }
    if(tk.k==='('){ next(); const v=E(); if(peek()&&peek().k===')')next(); return v; }
    if(tk.k==='id'){ next(); const n=tk.v;
      if(peek()&&peek().k==='('){ next(); const a=E(); if(peek()&&peek().k===')')next();
        const f={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:x=>Math.log10(x),exp:Math.exp};
        return (f[n]||(()=>NaN))(a); }
      return (n in sc)?sc[n]:NaN; }
    next(); return NaN; }
  const r=E(); return (p<T.length)?NaN:r; }                /* Rest uebrig = Tippfehler: lieber nichts zeichnen */

/* ---- Term lesbar schreiben: a*x^2 → a·x², mit Einsetzen von x und den Parametern ---- */
const SYM={pi:'π',sqrt:'√'};
/* xvH: dieselbe Einsetzung, nur eingefaerbt – die Klammerfrage entscheidet immer xv (reiner Text) */
function termText(toks,xv,mitP,zus,xvH){ let s='';
  for(let i=0;i<toks.length;i++){ const t=toks[i];
    if(t.k==='num'){ s+=zahl(t.v); continue; }
    if(t.k==='id'){ if(t.v==='x'&&xv!=null){ const vor=i>0?toks[i-1].k:null, nach=toks[i+1]?toks[i+1].k:null;
        /* zusammengesetztes Argument klammern – ausser es steht schon allein in Klammern wie bei sin(x) */
        const noetig=(xv.charAt(0)==='−'&&vor!=='(')||(zus&&!(vor==='('&&nach===')'));
        const ein=xvH||xv;
        s+= noetig ? '('+ein+')' : ein; }
      else if(mitP&&(t.v==='a'||t.v==='b'||t.v==='c')) s+=klammer(params[t.v]);
      else s+=(SYM[t.v]||t.v);
      continue; }
    if(t.k==='*'){ s+='·'; continue; }
    if(t.k==='+'||t.k==='-'){ const pv=i>0?toks[i-1].k:null, bin=(pv==='num'||pv==='id'||pv===')');
      s+= bin ? (t.k==='+'?' + ':' − ') : (t.k==='-'?'−':''); continue; }
    if(t.k==='^'){ const n=toks[i+1];
      if(n&&n.k==='num'&&Number.isInteger(n.v)&&n.v>=0&&n.v<=9){ s+=hoch(n.v); i++; continue; }
      s+='^'; continue; }
    s+=t.k; }
  return s; }
const klammer=v=>(v<0?'(−'+zahl(-v)+')':zahl(v));

/* ---- Funktionszeilen (Tab Graph) ---- */
function retok(){ funcs.forEach(f=>f.toks=tokenize(f.term)); }
function markActive(){ document.querySelectorAll('#funcs .func').forEach((r,i)=>r.classList.toggle('active',i===activeIdx)); }
function neuRechnen(){ draw(); refreshTable(); refreshMachines(); }
function neuBauen(){ buildRows(); buildTable(); buildMachines(); updateSliders(); draw(); }
/* Term aus einem beliebigen Tab übernehmen */
function termGeaendert(i,wert,ausser){ if(!funcs[i]) return; funcs[i].term=wert; funcs[i].toks=tokenize(wert);
  updateSliders(); draw();
  if(ausser!=='t') refreshTable(); else refreshTable(true);
  if(ausser!=='m') refreshMachines(); else refreshMachines(true);
  if(ausser!=='g'){ const el=document.querySelectorAll('#funcs .fterm')[i]; if(el&&document.activeElement!==el) el.value=wert; }
  sync(); }
/* Term verdecken: er bleibt erhalten, ist aber nirgends zu sehen (Raetselaufgabe) */
function maskeZeigen(root,f,i){ const inp=root.querySelector('.fterm'), vd=root.querySelector('.verdeckt'), b=root.querySelector('.fhide');
  if(!inp||!vd||!b) return; const h=!!f.hide;
  inp.style.display=h?'none':''; vd.style.display=h?'':'none';
  b.classList.toggle('on',h); b.title=h?'Term wieder zeigen':'Term verdecken';
  if(!b.onclick) b.onclick=()=>{ funcs[i].hide=!funcs[i].hide; if(lastInp===inp) lastInp=null; neuBauen(); sync(); }; }
function funcLoeschen(i){ funcs.splice(i,1); if(activeIdx>=funcs.length)activeIdx=funcs.length-1; neuBauen(); sync(); }
function funcNeu(){ funcs.push({term:'', color:GCOL[funcs.length%GCOL.length], width:DEFW, mx:'2', hide:false, toks:[]}); activeIdx=funcs.length-1; neuBauen(); sync();
  const sel=tab==='g'?'#funcs .fterm':(tab==='t'?'#pT .fterm':'#pM .fterm');
  const inps=document.querySelectorAll(sel), last=inps[inps.length-1]; if(last){ lastInp=last; try{ last.focus(); }catch(_){} } }

function buildRows(){ const host=$('funcs'); host.innerHTML='';
  funcs.forEach((f,i)=>{ const row=document.createElement('div'); row.className='frow func'+(i===activeIdx?' active':'');
    row.innerHTML='<span class="fcol"></span><b class="fname"></b><input class="fterm" spellcheck="false" placeholder="z. B. a*x^2+b*x+c, sin(a*x), 1/x"><span class="verdeckt">? ? ?</span><button class="fhide" type="button">👁</button><button class="fdel" title="Funktion entfernen">×</button>';
    const dot=row.querySelector('.fcol'); dot.style.background=f.color;
    dot.title='Farbe dieser Funktion wählen';
    dot.onclick=e=>{ e.stopPropagation(); farbwahl(i,dot); };
    const nm=row.querySelector('.fname'); nm.textContent='f'+sub(i+1)+'(x)='; nm.style.color=f.color;
    const inp=row.querySelector('.fterm'); inp.value=f.term; if(keysOn) inp.inputMode='none';
    inp.addEventListener('focus',()=>{ activeIdx=i; lastInp=inp; markActive(); sync(); });
    inp.addEventListener('input',()=>termGeaendert(i,inp.value,'g'));
    const del=row.querySelector('.fdel'); del.style.display=funcs.length>1?'':'none';
    del.onclick=()=>funcLoeschen(i);
    maskeZeigen(row,f,i);
    host.appendChild(row); }); }
$('add').onclick=funcNeu;

/* ---- Farbe einer Funktion: Punkt antippen ---- */
const FARBEN=GCOL.concat(['#1f2430','#64748b']);
const colPop=$('colPop');
function setzeFarbe(i,c){ if(!funcs[i]) return; funcs[i].color=c;
  const row=document.querySelectorAll('#funcs .func')[i];
  if(row){ row.querySelector('.fcol').style.background=c; row.querySelector('.fname').style.color=c; }
  colPop.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  refreshTable(); refreshMachines(); draw(); sync(); }
function farbeZu(){ colPop.classList.remove('show'); }
function farbwahl(i,el){
  colPop.innerHTML='';
  FARBEN.forEach(c=>{ const b=document.createElement('button'); b.style.background=c; b.dataset.c=c; b.title=c;
    b.classList.toggle('on',funcs[i].color===c);
    b.onclick=()=>{ setzeFarbe(i,c); farbeZu(); }; colPop.appendChild(b); });
  const eig=document.createElement('input'); eig.type='color'; eig.value=/^#[0-9a-f]{6}$/i.test(funcs[i].color)?funcs[i].color:'#2563eb';
  eig.title='eigene Farbe'; eig.oninput=()=>setzeFarbe(i,eig.value); colPop.appendChild(eig);
  colPop.classList.add('show');
  const r=el.getBoundingClientRect(), pw=colPop.offsetWidth, ph=colPop.offsetHeight;
  colPop.style.left=Math.max(6,Math.min(innerWidth-pw-6,r.left-6))+'px';
  colPop.style.top=((r.bottom+6+ph>innerHeight)?Math.max(6,r.top-ph-6):r.bottom+6)+'px';
}
document.addEventListener('pointerdown',e=>{ if(!colPop.classList.contains('show')) return;
  if(!e.target.closest('#colPop')&&!e.target.closest('.fcol')&&!e.target.closest('.trCol')) farbeZu(); },true);
addEventListener('resize',farbeZu);

/* ---- Parameter-Schieberegler (über alle Funktionen) ---- */
function updateSliders(){ const ids=new Set(); funcs.forEach(f=>f.toks.forEach(t=>{ if(t.k==='id')ids.add(t.v); })); const used=['a','b','c'].filter(p=>ids.has(p));
  const el=$('sliders'); el.innerHTML='';
  used.forEach(p=>{ const row=document.createElement('div'); row.className='sl';
    row.innerHTML='<label>'+p+' =</label><input type="range" min="-5" max="5" step="0.1"><span class="v"></span>';
    const r=row.querySelector('input'), v=row.querySelector('.v'); r.value=params[p]; v.textContent=(+params[p]).toFixed(1);
    r.oninput=()=>{ params[p]=+r.value; v.textContent=(+r.value).toFixed(1); neuRechnen(); sync(); };
    el.appendChild(row); }); }

/* ---- Tab Tabelle ---- */
function buildTable(){ const host=$('pT'); host.innerHTML='';
  const t=document.createElement('table'); t.id='ttab';
  const hr=document.createElement('tr'); const ecke=document.createElement('th'); ecke.className='ecke'; ecke.textContent='x'; hr.appendChild(ecke);
  xs.forEach((v,j)=>{ const th=document.createElement('th');
    const inp=document.createElement('input'); inp.className='xin'; inp.inputMode=keysOn?'none':'decimal'; inp.spellcheck=false; inp.value=v;
    inp.addEventListener('focus',()=>{ lastInp=inp; });
    inp.addEventListener('keydown',e=>e.stopPropagation());
    inp.addEventListener('input',()=>{ xs[j]=inp.value; refreshTable(true); sync(); });
    th.appendChild(inp); hr.appendChild(th); });
  t.appendChild(hr);
  funcs.forEach((f,i)=>{ const tr=document.createElement('tr');

/* x-Werte mit f(x) = yv im sichtbaren Bereich suchen */
function loesungen(T,yv){ const u=view.unit, x0=(0-view.ox)/u, x1=(W-view.ox)/u, N=720;
  const g=x=>evalAt(x,T)-yv, tol=0.8/u, V=[], res=[];
  for(let i=0;i<=N;i++){ const x=x0+(x1-x0)*i/N; V.push({x,v:g(x)}); }
  for(let i=1;i<V.length&&res.length<16;i++){ const A=V[i-1], B=V[i];     /* Vorzeichenwechsel: genau einschachteln */
    if(!isFinite(A.v)||!isFinite(B.v)) continue;
    if(A.v===0&&B.v===0) continue;                                        /* waagrechtes Stueck: keine einzelne Loesung */
    if(A.v*B.v>0) continue;
    let a=A.x,b=B.x,fa=A.v;
    for(let k=0;k<60;k++){ const m=(a+b)/2, fm=g(m); if(!isFinite(fm)) break; if(fa*fm<=0) b=m; else { a=m; fa=fm; } }
    res.push((a+b)/2); }
  for(let i=1;i<V.length-1&&res.length<16;i++){ const A=V[i-1], B=V[i], C=V[i+1];   /* Beruehrpunkte ohne Vorzeichenwechsel (Scheitel) */
    if(!isFinite(A.v)||!isFinite(B.v)||!isFinite(C.v)) continue;
    if(Math.abs(B.v)>=tol||Math.abs(B.v)>Math.abs(A.v)||Math.abs(B.v)>Math.abs(C.v)) continue;
    if(Math.abs(B.v)>=Math.abs(A.v)&&Math.abs(B.v)>=Math.abs(C.v)) continue;        /* nichts faellt ab: waagrechter Verlauf */
    const h=(x1-x0)/N, den=C.v-2*B.v+A.v;                                            /* Scheitel der Parabel durch A,B,C: genauer als das Raster */
    let xv=B.x; if(den!==0){ const dx=-h/2*(C.v-A.v)/den; if(Math.abs(dx)<=h) xv=B.x+dx; }
    res.push(xv); }
  const aus=[]; res.forEach(x=>{ if(!aus.some(y=>Math.abs(y-x)<1.5/u)) aus.push(x); });
  return aus.sort((p,q)=>p-q); }

      ctx.save(); ctx.fillStyle=f.color; ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fill(); ctx.restore();

const trFreiDa=()=>!!(tr.frei&&tr.frei.length>1);
function freiAt(p,x){
  if(!p||p.length<2||x<p[0][0]||x>p[p.length-1][0]) return NaN;
  let lo=0, hi=p.length-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(p[m][0]<=x) lo=m; else hi=m; }
  const dx=p[hi][0]-p[lo][0];
  return dx>1e-9 ? p[lo][1]+(p[hi][1]-p[lo][1])*(x-p[lo][0])/dx : p[lo][1]; }
const trFrei=x=>freiAt(tr.frei,x);
/* Gezogene Punkte zu einer Funktion machen: nach x sortieren, dicht beieinander liegende
   zusammenfassen (sonst wäre die Kurve an einer Stelle mehrdeutig) und ausdünnen. */
function trFreiFertig(){
  const tol=0.6/Math.max(4,trView.unit);
  const p=freiRoh.filter(q=>isFinite(q[0])&&isFinite(q[1])).sort((u,v)=>u[0]-v[0]);
  const out=[];
  for(const q of p){ const l=out[out.length-1];
    if(l&&q[0]-l[0]<tol){ l[1]=(l[1]+q[1])/2; continue; }
    out.push([q[0],q[1]]); }
  let res=out; const N=80;             /* 80 Punkte reichen und halten den Teilen-Code klein */
  if(out.length>N){ res=[]; const st=(out.length-1)/(N-1); for(let i=0;i<N;i++) res.push(out[Math.round(i*st)]); }
  tr.frei=res.length>1?res.map(q=>[Math.round(q[0]*100)/100,Math.round(q[1]*100)/100]):null;
  freiRoh=[]; trZeichnet=false; }
function trFreiStart(){ tr.frei=null; freiRoh=[]; trZeichnet=true; tr.term=''; trToks=[]; trUiNeu(); trDraw(); }

/* ---- Zwei Funktionen ----
   Bearbeitet wird immer die **aktive**; ihre Daten stehen direkt in `tr`, die der anderen
   in `tr.alt`. Beim Umschalten werden die Felder getauscht – so gelten die Regler stets
   für die angetippte Funktion, und die andere behält ihre Einstellung. */
const TRFELD=['term','a','b','c','d','col','frei'];
let altToks=[];                                   /* Tokens der ruhenden Funktion, zwischengespeichert */
const trDa=o=>!!(o&&((o.term&&o.term.trim())||(o.frei&&o.frei.length>1)));
const trZwei=()=>trDa(tr.alt);                    /* ist die zweite Funktion in Gebrauch? */
function trAltToks(){ altToks=tokenize(tr.alt.term||''); }
function trWechsel(i){ if((tr.akt|0)===i) return;
  const t={}; for(const k of TRFELD){ t[k]=tr[k]; tr[k]=tr.alt[k]; tr.alt[k]=t[k]; }
  tr.akt=i; trToks=tokenize(tr.term||''); trAltToks(); trZeichnet=false;
  trUiNeu(); trDraw(); sync(); }
/* Ergebniskurve der ruhenden Funktion */
function trAltG(x){ const o=tr.alt;
  const v=(o.frei&&o.frei.length>1) ? freiAt(o.frei,o.b*(x+o.c))
        : (()=>{ const alt=params; params={a:NaN,b:NaN,c:NaN};
                 try{ return evalAt(o.b*(x+o.c),altToks); } finally{ params=alt; } })();
  return o.a*v+o.d; }
function trAltF(x){ const o=tr.alt;
  if(o.frei&&o.frei.length>1) return freiAt(o.frei,x);
  const alt=params; params={a:NaN,b:NaN,c:NaN};
  try{ return evalAt(x,altToks); } finally{ params=alt; } }
function trGCol2(){ const o=tr.alt, c=k=>(o.col&&o.col[k])||TRSTD[k];
  if(o.d!==0) return c('d'); if(o.c!==0) return c('c');
  if(o.b!==1) return c('b'); if(o.a!==1) return c('a'); return c('d'); }

/* Der Grundterm darf nur x enthalten – a, b, c sind hier die Transformationsgrößen. */
function trF(x){ if(trFreiDa()) return trFrei(x);
  const alt=params; params={a:NaN,b:NaN,c:NaN};
  try{ return evalAt(x,trToks); } finally{ params=alt; } }
/* Zwischenschritte in der Reihenfolge a → b → c → d: erst strecken, dann verschieben.
   Jeder Schritt ist dabei eine Streckung an einer Achse bzw. eine Verschiebung –
   in der Reihenfolge c → b müsste man dagegen an der verschobenen Achse strecken. */
const trG  =x=>tr.a*trF(tr.b*(x+tr.c))+tr.d;
const trS1 =x=>tr.a*trF(x);                 /* a: senkrecht gestreckt         */
const trS2 =x=>tr.a*trF(tr.b*x);            /* b: dazu waagrecht gestreckt    */
const trS3 =x=>tr.a*trF(tr.b*(x+tr.c));     /* c: dazu waagrecht verschoben   */
/* ---- Reihenfolge als Ablauf ----
   Jeder der beiden Regler führt die zwei Schritte nacheinander aus: in der ersten Hälfte den
   einen, in der zweiten Hälfte den anderen. Regler 1 streckt zuerst, Regler 2 verschiebt zuerst.
   Am Ende (100 %) stehen beide Kurven da – und sie liegen nicht aufeinander. */
const h1=t=>Math.min(1,2*t), h2=t=>Math.max(0,2*t-1);      /* erste und zweite Haelfte */
const misch=(ziel,q)=>1+(ziel-1)*q;                        /* Streckfaktor waechst von 1 auf ziel */
function trAbl(t,erstStrecken){
  if(tr.rSeite==='y'){                                     /* aussen: a und d */
    const q1=erstStrecken?h1(t):h2(t), q2=erstStrecken?h2(t):h1(t);
    const a=misch(tr.a,q1), d=tr.d*q2;
    return erstStrecken ? (x=>a*trF(tr.b*(x+tr.c))+d)      /* erst strecken, dann verschieben */
                        : (x=>a*(trF(tr.b*(x+tr.c))+d)); } /* erst verschieben, dann strecken */
  const q1=erstStrecken?h1(t):h2(t), q2=erstStrecken?h2(t):h1(t);
  const b=misch(tr.b,q1), c=tr.c*q2;                        /* innen: b und c */
  return erstStrecken ? (x=>tr.a*trF(b*(x+c))+tr.d)         /* erst strecken, dann verschieben */
                      : (x=>tr.a*trF(b*x+c)+tr.d); }        /* erst verschieben, dann strecken */
const trAx =x=>trAbl(tr.p1,true)(x);
const trAy =x=>trAbl(tr.p2,false)(x);

/* ---- Zeichnen ---- */
function trResize(){ const el=$('plotR'); const r=el.getBoundingClientRect();
  trW=Math.max(10,Math.round(r.width)); trH=Math.max(10,Math.round(r.height));
  el.width=Math.round(trW*dpr); el.height=Math.round(trH*dpr);
  if(!trView.ox||!trView.oy){ trView.ox=trW/2; trView.oy=trH/2; }
  trDraw(); }
/* ---- Mitgezogenes Hintergrundmuster ----
   Der Graph von g entsteht aus dem von f durch die Punktabbildung
   (u | v) → (u/b − c | a·v + d). Genau diese Abbildung wird hier auf das Einheitsgitter
   losgelassen: Aus den Linien u = k wird x = k/b − c, aus v = m wird y = a·m + d.
   Das Koordinatensystem bleibt davon unberührt – man sieht, dass der Graph im
   mitgezogenen Gitter unverändert aussieht. */
function trMuster(c2,u,ox,oy,xmin,xmax,ymin,ymax){
  const b=Math.abs(tr.b)<0.05?0:tr.b, a=Math.abs(tr.a)<0.05?0:tr.a, col=trGCol();
  const X=x=>ox+x*u, Y=y=>oy-y*u;
  c2.save(); c2.strokeStyle=col; c2.fillStyle=col;
  /* Bild des Einheitsquadrats: zeigt Streckung und Spiegelung auf einen Blick */
  if(b&&a){ const x0=X(0/b-tr.c), x1=X(1/b-tr.c), y0=Y(tr.d), y1=Y(a+tr.d);
    c2.globalAlpha=0.13; c2.fillRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0)); }
  const linien=(n0,n1,schritt,pos,senk)=>{
    for(let k=n0;k<=n1;k+=schritt){ const p=pos(k);
      c2.globalAlpha=(k===0)?0.8:0.34; c2.lineWidth=(k===0)?2.2:1.2;
      c2.beginPath();
      if(senk){ c2.moveTo(p,0); c2.lineTo(p,trH); } else { c2.moveTo(0,p); c2.lineTo(trW,p); }
      c2.stroke(); } };
  if(b){ const abst=Math.abs(1/b)*u;                      /* Abstand der senkrechten Linien in Pixeln */
    if(abst>=5){ const s=Math.max(1,Math.ceil(6/abst));
      const kA=(xmin+tr.c)*b, kB=(xmax+tr.c)*b;
      const von=Math.ceil(Math.min(kA,kB)/s)*s, bis=Math.floor(Math.max(kA,kB)/s)*s;
      if((bis-von)/s<=400) linien(von,bis,s,k=>X(k/b-tr.c),true); } }
  if(a){ const abst=Math.abs(a)*u;
    if(abst>=5){ const s=Math.max(1,Math.ceil(6/abst));
      const mA=(ymin-tr.d)/a, mB=(ymax-tr.d)/a;
      const von=Math.ceil(Math.min(mA,mB)/s)*s, bis=Math.floor(Math.max(mA,mB)/s)*s;
      if((bis-von)/s<=400) linien(von,bis,s,m=>Y(a*m+tr.d),false); } }
  c2.restore(); }

function trKurve(c2,fn,col,w,dash){ c2.save(); c2.strokeStyle=col; c2.lineWidth=w; if(dash) c2.setLineDash(dash);
  c2.beginPath(); let prev=null;
  for(let px=0;px<=trW;px++){ const x=(px-trView.ox)/trView.unit, y=fn(x), py=trView.oy-y*trView.unit;
    if(!isFinite(py)){ prev=null; continue; }
    if(prev===null||Math.abs(py-prev)>trH*3) c2.moveTo(px,py); else c2.lineTo(px,py);
    prev=py; }
  c2.stroke(); c2.restore(); }
function trDraw(){ if(tab!=='r') return;
  if(!tr.zGraph){ trText(); return; }                 /* Graph ausgeblendet: nur die Spalte neu schreiben */
  if(!trW) return;
  const c2=$('plotR').getContext('2d'); c2.setTransform(dpr,0,0,dpr,0,0);
  c2.clearRect(0,0,trW,trH); c2.fillStyle='#fff'; c2.fillRect(0,0,trW,trH);
  const u=trView.unit, ox=trView.ox, oy=trView.oy;
  const raw=44/u, p10=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=p10*10; for(const m of [1,2,5,10]){ if(p10*m>=raw){ step=p10*m; break; } }
  const xmin=(0-ox)/u, xmax=(trW-ox)/u, ymin=(oy-trH)/u, ymax=oy/u;
  c2.strokeStyle='#eef1f6'; c2.lineWidth=1; c2.beginPath();
  for(let x=Math.ceil(xmin/step)*step;x<=xmax;x+=step){ const px=ox+x*u; c2.moveTo(px,0); c2.lineTo(px,trH); }
  for(let y=Math.ceil(ymin/step)*step;y<=ymax;y+=step){ const py=oy-y*u; c2.moveTo(0,py); c2.lineTo(trW,py); }
  c2.stroke();
  c2.strokeStyle='#98a2b3'; c2.lineWidth=1.6; c2.beginPath();
  c2.moveTo(0,oy); c2.lineTo(trW,oy); c2.moveTo(ox,0); c2.lineTo(ox,trH); c2.stroke();
  c2.fillStyle='#667085'; c2.font=(fontItalic?'italic ':'')+(fontBold?'bold ':'')+fontSize+'px sans-serif';
  c2.textAlign='center'; c2.textBaseline='top';
  for(let x=Math.ceil(xmin/step)*step;x<=xmax;x+=step){ if(Math.abs(x)<1e-9) continue;
    c2.fillText(fmt(x), ox+x*u, Math.min(Math.max(oy+3,2),trH-fontSize-3)); }
  c2.textAlign='right'; c2.textBaseline='middle';
  for(let y=Math.ceil(ymin/step)*step;y<=ymax;y+=step){ if(Math.abs(y)<1e-9) continue;
    c2.fillText(fmt(y), Math.min(Math.max(ox-4,fontSize*2),trW-2), oy-y*u); }
  if(tr.zMuster) trMuster(c2,u,ox,oy,xmin,xmax,ymin,ymax);
  if(trZeichnet){ /* Hinweis und der bisher gezogene Strich */
    if(freiRoh.length>1){ c2.save(); c2.strokeStyle=TRC.f; c2.lineWidth=2.4; c2.lineJoin='round'; c2.beginPath();
      freiRoh.forEach((q,i)=>{ const px=ox+q[0]*u, py=oy-q[1]*u; i?c2.lineTo(px,py):c2.moveTo(px,py); });
      c2.stroke(); c2.restore(); }
    c2.save(); c2.fillStyle='#64748b'; c2.font='600 '+Math.max(13,fontSize)+'px sans-serif';
    c2.textAlign='center'; c2.textBaseline='top';
    c2.fillText('Kurve in die Fläche zeichnen', trW/2, 8); c2.restore();
    trText(); return; }
  if(trZwei()){ c2.save(); c2.globalAlpha=0.75;                 /* die ruhende Funktion blasser daneben */
    trKurve(c2,trAltF,TRC.f,1.2);
    trKurve(c2,trAltG,trGCol2(),2.2);
    c2.restore(); }
  if(!trToks.length&&!trFreiDa()){ trText(); return; }
  trKurve(c2,trF,TRC.f,1.8);                                    /* Ausgangsfunktion */
  if(tr.einzel){
    if(tr.a!==1&&(tr.b!==1||tr.c!==0||tr.d!==0)) trKurve(c2,trS1,trCol('a'),1.6,[6,5]);
    if(tr.b!==1&&(tr.c!==0||tr.d!==0))           trKurve(c2,trS2,trCol('b'),1.6,[6,5]);
    if(tr.c!==0&&tr.d!==0)                       trKurve(c2,trS3,trCol('c'),1.6,[6,5]); }
  if(tr.reihe){ trKurve(c2,trAbl(tr.p1,true),trGCol(),2.2,[7,4]);      /* erst strecken, dann verschieben */
                trKurve(c2,trAbl(tr.p2,false),TRC.alt,2.2,[3,4]); }   /* erst verschieben, dann strecken */
  trKurve(c2,trG,trGCol(),2.8);                                 /* Ergebnis in der Farbe des letzten Schrittes */
  trText(); }

/* ---- Term und Erklärung ---- */
/* h = true: Parameter in ihrer Farbe einfaerben (HTML), sonst reiner Text */
const trPar=(k,txt,h)=>h?('<span style="color:'+trCol(k)+'">'+txt+'</span>'):txt;
function trInnen(h){ const b=tr.b, c=tr.c;
  let s='x';
  if(c!==0) s='x '+trPar('c',(c>0?'+ ':'− ')+nfk(Math.abs(c)),h);
  if(b!==1) s=(c!==0)?(trPar('b',nfk(b),h)+'·('+s+')')
                     :(b===-1?trPar('b','−',h)+'x':trPar('b',nfk(b),h)+'·x');
  return s; }
function trTermG(h){ if(!trToks.length) return '';
  const roh=trInnen(false), zus=!/^[-−]?x$/.test(roh);
  const klammer=trNoetig(termText(trToks,roh,false,zus));   /* Klammerfrage am reinen Text entscheiden */
  let s=termText(trToks,roh,false,zus,h?trInnen(true):null);
  if(tr.a!==1){ s=trPar('a',(tr.a===-1?'−':nfk(tr.a)+'·'),h)+(klammer?('('+s+')'):s); }
  if(tr.d!==0) s+=' '+trPar('d',(tr.d>0?'+ ':'− ')+nfk(Math.abs(tr.d)),h);
  return s; }
/* Rechte Spalte: Terme (beide Formen, per Häkchen) und die Wortbeschreibung als Liste. */
function trText(){ const out=$('trOut'); const L=[];
  const altBox=out.querySelector('.trBox'); const scrollAlt=altBox?altBox.scrollLeft:0;
  const zwei=trZwei(), nr=(tr.akt|0)===1?'₂':'';
  const nm=zwei?' · f'+nr:'';                   /* bei zwei Funktionen dazuschreiben, welche gemeint ist */
  const gk='<span style="color:'+trGCol()+'">g'+(zwei?nr:'')+'</span>(<i>x</i>) = ';
  if(tr.zWort){ const t=[]; const zP=tr.zPar!==false;
    /* Ohne „Parameter" faellt nur die ausdrueckliche Angabe c = 2 weg – im Satz stehen die
       Zahlen weiter („um 2 nach links verschoben"), daraus soll der Wert bestimmt werden. */
    const zeile=(k,txt)=>'<li style="border-left-color:'+trCol(k)+'"><span class="p" style="color:'+trCol(k)+'">'+k+(zP?' = '+nf1(tr[k]):'')+'</span>: '+txt+'</li>';
    if(tr.a!==1) t.push(zeile('a','senkrecht '+(Math.abs(tr.a)>1?'gestreckt':'gestaucht')+' (Faktor '+nfk(Math.abs(tr.a))+')'+(tr.a<0?', an der x-Achse gespiegelt':'')));
    if(tr.b!==1) t.push(zeile('b','waagrecht '+(Math.abs(tr.b)>1?'gestaucht':'gestreckt')+' (Faktor '+nfk(Math.round(1000/Math.abs(tr.b))/1000)+')'+(tr.b<0?', an der y-Achse gespiegelt':'')));
    if(tr.c!==0) t.push(zeile('c','um '+nfk(Math.abs(tr.c))+' nach '+(tr.c>0?'links':'rechts')+' verschoben'));
    if(tr.d!==0) t.push(zeile('d','um '+nfk(Math.abs(tr.d))+' nach '+(tr.d>0?'oben':'unten')+' verschoben'));
    L.push('<div class="wTitel">Wortbeschreibung'+nm+'</div>'+(t.length
      ?('<ul class="wList">'+t.join('')+'</ul><div class="wNote">der Reihe nach: erst strecken, dann verschieben</div>')
      :'<div class="wLeer">Noch keine Veränderung: a = 1, b = 1, c = 0, d = 0.</div>')); }
  if(tr.zTerm){
    let kurz=gk+trPar('a',(tr.a===1?'':(tr.a===-1?'−':nfk(tr.a)+'·')),true)+'f('+trInnen(true)+')';
    if(tr.d!==0) kurz+=' '+trPar('d',(tr.d>0?'+ ':'− ')+nfk(Math.abs(tr.d)),true);
    const kasten=['<div class="trT">'+kurz+'</div>'];
    if(trToks.length) kasten.push('<div class="trT trT2">'+gk+trTermG(true)+'</div>');
    L.push('<div class="wTitel">Term'+nm+'</div><div class="trBox">'+kasten.join('')+'</div>'); }
  if(tr.reihe){
    L.push('<div class="wTitel">Reihenfolge</div>');
    const vz=(v)=>(v>=0?' + ':' − ')+nfk(Math.abs(v));
    const vor=(v)=>v===1?'':(v===-1?'−':nfk(v)+'·');
    const e1=tr.rSeite==='y'
      ? vor(tr.a)+'f(…)'+(tr.d===0?'':vz(tr.d))
      : vor(tr.a)+'f('+trInnen(false)+')'+(tr.d===0?'':vz(tr.d));
    const e2=tr.rSeite==='y'
      ? vor(tr.a)+'( f(…)'+vz(tr.d)+' )'
      : vor(tr.a)+'f('+(tr.b===1?'x':(tr.b===-1?'−x':nfk(tr.b)+'·x'))+(tr.c===0?'':vz(tr.c))+')'+(tr.d===0?'':vz(tr.d));
    L.push('<div style="color:'+trGCol()+'"><b>erst strecken, dann verschieben:</b> '+e1+'</div>');
    L.push('<div style="color:'+TRC.alt+'"><b>erst verschieben, dann strecken:</b> '+e2+'</div>');
    if(tr.rSeite==='y')
      L.push('<div class="zf">Ausmultipliziert ist der untere Weg a·f(…) + a·d: Es verschiebt um <b>'+nfk(Math.round(tr.a*tr.d*1000)/1000)+'</b> statt um '+nfk(tr.d)+'. Darum erst strecken, dann verschieben.</div>');
    else
      L.push('<div class="zf">Innen wirkt alles <b>umgekehrt</b>: f(b·x + c) = f(b·(x + c : b)) verschiebt nur um <b>'+(tr.b?nfk(Math.round(tr.c/tr.b*1000)/1000):'—')+'</b> statt um '+nfk(tr.c)+'.</div>');
    L.push('<div class="zf">Mit den beiden Reglern läuft jeder Weg Schritt für Schritt ab: erst die eine Hälfte, dann die andere.</div>');
    const hin=$('trRHin'); if(hin){ hin.textContent=''; hin.className='trHin'; } }
  if(!L.length) L.push('<div class="wLeer">Nichts eingeblendet – Häkchen oben setzen.</div>');
  out.innerHTML=L.map(z=>'<div>'+z+'</div>').join('');
  /* Beim Schieben der Regler wird der Kasten neu geschrieben – die Scrollstelle bleibt erhalten */
  const nb=out.querySelector('.trBox'); if(nb&&scrollAlt) nb.scrollLeft=scrollAlt;
  trLayout(); }
/* Graph und rechte Spalte lassen sich einzeln ausblenden; ist beides weg, bleibt die Spalte
   mit dem Hinweis stehen, damit der Reiter nicht leer ist. */
function trLayout(){ const ohneSpalte=!(tr.zTerm||tr.zWort||tr.reihe||tr.zPar!==false)&&tr.zGraph;
  $('trSide').hidden=ohneSpalte; $('trPlotWrap').hidden=!tr.zGraph;
  requestAnimationFrame(()=>{ if(tab==='r'&&tr.zGraph) trResize(); }); }

/* ---- Ansicht ---- */
/* Standardfenster wie im Reiter „Graph": x von −8 bis 8, y um 0 herum.
   Liegt der Graph ganz woanders (großes d), wird senkrecht nachgeführt. */
function trFit(){ if(!trW) return;
  trView.unit=Math.max(8,Math.min(trW/16,trH/12));
  trView.ox=trW/2;
  const mitte=[], h=trH/2/trView.unit;
  for(let i=0;i<=40;i++){ const y=trG(-4+8*i/40); if(isFinite(y)&&Math.abs(y)<1e5) mitte.push(y); }
  mitte.sort((p,q)=>p-q);
  const med=mitte.length?mitte[Math.floor(mitte.length/2)]:0;
  const ver=(Math.abs(med)>h*0.9)?med:0;                /* nur nachführen, wenn nötig */
  trView.oy=trH/2+ver*trView.unit; trDraw(); }

/* ---- Bedienung ---- */
/* Farbwähler je Parameter – gleiche Auswahl wie bei den Funktionsfarben */
function trFarbwahl(k,el){
  colPop.innerHTML='';
  FARBEN.forEach(c=>{ const b=document.createElement('button'); b.style.background=c; b.dataset.c=c; b.title=c;
    b.classList.toggle('on',trCol(k)===c);
    b.onclick=()=>{ trSetzeFarbe(k,c); farbeZu(); }; colPop.appendChild(b); });
  const std=document.createElement('button'); std.style.background=TRSTD[k]; std.title='Standardfarbe';
  std.textContent='↺'; std.style.color='#fff'; std.style.fontWeight='800';
  std.onclick=()=>{ trSetzeFarbe(k,TRSTD[k]); farbeZu(); }; colPop.appendChild(std);
  const eig=document.createElement('input'); eig.type='color';
  eig.value=/^#[0-9a-f]{6}$/i.test(trCol(k))?trCol(k):TRSTD[k];
  eig.title='eigene Farbe'; eig.oninput=()=>trSetzeFarbe(k,eig.value); colPop.appendChild(eig);
  colPop.classList.add('show');
