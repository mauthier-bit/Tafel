const mdSlope=()=>md.typ==='p'&&md.genau&&md.abl;
/* Alle brauchbaren Zeilen mit ihrem Platz in der Tabelle; s = vorgegebene Steigung oder null */
function mdDaten(){ const a=[];
  md.p.forEach((r,i)=>{ const x=pz(r[0]), y=pz(r[1]), s=pz(r[2]);
    if(isFinite(x)&&isFinite(y)) a.push({i,x,y,s:(mdSlope()&&isFinite(s))?s:null}); });
  return a.sort((p,q)=>p.x-q.x); }
const mdNiceStep=raw=>{ const p=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,5,10]){ if(p*m>=raw) return p*m; } return p*10; };
const mdStepX=()=>mdNiceStep(46/md.view.ux), mdStepY=()=>mdNiceStep(40/md.view.uy);

/* ---- Rechnen ---- */
function mdGauss(A,B){ const n=B.length, M=A.map((r,i)=>r.concat([B[i]]));
  for(let k=0;k<n;k++){ let p=k;
    for(let i=k+1;i<n;i++) if(Math.abs(M[i][k])>Math.abs(M[p][k])) p=i;
    if(!isFinite(M[p][k])||Math.abs(M[p][k])<1e-12) return null;
    const t=M[k]; M[k]=M[p]; M[p]=t;
    for(let i=k+1;i<n;i++){ const f=M[i][k]/M[k][k]; if(!f) continue;
      for(let j=k;j<=n;j++) M[i][j]-=f*M[k][j]; } }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){ let v=M[i][n]; for(let j=i+1;j<n;j++) v-=M[i][j]*x[j]; x[i]=v/M[i][i]; }
  return x.every(v=>isFinite(v))?x:null; }
/* Ausgleichsrechnung: die gesuchten Zahlen stecken linear in den Basisfunktionen */
function mdLin(basis,P){ const m=basis.length; if(P.length<m) return null;
  const A=[], B=new Array(m).fill(0);
  for(let i=0;i<m;i++) A.push(new Array(m).fill(0));
  for(const q of P){ const v=basis.map(f=>f(q[0])); if(v.some(z=>!isFinite(z))) return null;
    for(let i=0;i<m;i++){ for(let j=0;j<m;j++) A[i][j]+=v[i]*v[j]; B[i]+=v[i]*q[1]; } }
  return mdGauss(A,B); }
const mdSSE=(P,f)=>{ let s=0;
  for(const q of P){ const v=f(q[0]); if(!isFinite(v)) return Infinity; s+=(v-q[1])*(v-q[1]); }
  return s; };
/* Ein Parameter wird abgesucht (Wachstumsrate bzw. Frequenz), die uebrigen ergeben sich
   dann als lineares Ausgleichsproblem – so wird das Minimum sicher gefunden. */
function mdSuche(P,von,bis,n,mach){
  const prob=k=>{ const o=mach(k); if(!o) return null; const c=mdLin(o.basis,P); if(!c) return null;
    const f=o.fn(c), q=mdSSE(P,f); return isFinite(q)?{k,c,f,s:q}:null; };
  let best=null;
  for(let i=0;i<=n;i++){ const r=prob(von+(bis-von)*i/n); if(r&&(!best||r.s<best.s)) best=r; }
  if(!best) return null;
  let h=(bis-von)/n;                                /* Umgebung des besten Gitterpunktes verfeinern */
  for(let t=0;t<44;t++){ h/=2;
    for(const d of [-h,h]){ const r=prob(best.k+d); if(r&&r.s<best.s) best=r; } }
  return best; }
/* Polynom genau durch alle Punkte: Newton-Steigungen, dann ausmultipliziert */
function mdInterp(D){ const n=D.length, x=D.map(q=>q.x), d=D.map(q=>q.y);
  for(let k=1;k<n;k++) for(let i=n-1;i>=k;i--) d[i]=(d[i]-d[i-1])/(x[i]-x[i-k]);
  let c=[d[n-1]];                                   /* c[0] gehoert zur hoechsten Potenz */
  for(let i=n-2;i>=0;i--){ const nc=c.concat([0]);  /* mal x */
    for(let j=0;j<c.length;j++) nc[j+1]-=x[i]*c[j]; /* minus x[i] mal p */
    nc[nc.length-1]+=d[i];
    c=nc; }
  return c.every(v=>isFinite(v))?c:null; }
/* Mit vorgegebenen Steigungen: jede Bedingung ist eine Zeile des Gleichungssystems –
   Funktionswert f(x) = y bzw. Ableitung f′(x) = y′. Der Grad richtet sich nach der
   Zahl der Bedingungen, damit es genau eine Loesung gibt. */
function mdHermite(D){ const rows=[];
  D.forEach(q=>{ rows.push([q.x,q.y,false]); if(q.s!=null) rows.push([q.x,q.s,true]); });
  const g=rows.length-1;
  const A=rows.map(r=>{ const row=[];
    for(let p=g;p>=0;p--) row.push(r[2]?(p>0?p*Math.pow(r[0],p-1):0):Math.pow(r[0],p));
    return row; });
  return mdGauss(A,rows.map(r=>r[1])); }
/* Normalverteilung y = a·e^(−(x−μ)²/(2σ²)) (+ c): μ und σ stecken nicht linear im Ansatz.
   Fuer festes Paar (μ, σ) bleiben a und c ein lineares Ausgleichsproblem – deshalb wird das
   Paar erst grob abgesucht und dann mit halbierten Schritten nachgezogen. */
function mdNormal(P,mitC){
  const xw=P.map(q=>q[0]), x0=Math.min.apply(null,xw), x1=Math.max.apply(null,xw);
  const span=Math.max(1e-6,x1-x0);
  const bewerte=(m,sg)=>{ if(!(sg>1e-9)) return null;
    const g=x=>Math.exp(-((x-m)*(x-m))/(2*sg*sg));
    const c=mdLin(mitC?[g,()=>1]:[g],P); if(!c) return null;
    const f=x=>c[0]*g(x)+(mitC?c[1]:0), q=mdSSE(P,f);
    return isFinite(q)?{m,sg,c,f,q}:null; };
  let best=null;
  for(let i=0;i<=24;i++) for(let j=0;j<=16;j++){
    const r=bewerte(x0-0.2*span+1.4*span*i/24, span*0.03*Math.pow(1.3,j));
    if(r&&(!best||r.q<best.q)) best=r; }
  if(!best) return null;
  let hm=span/24, hs=best.sg/3;
  for(let k=0;k<80;k++){ let bess=false;
    for(const d of [[hm,0],[-hm,0],[0,hs],[0,-hs],[hm,hs],[-hm,-hs],[hm,-hs],[-hm,hs]]){
      const r=bewerte(best.m+d[0],best.sg+d[1]); if(r&&r.q<best.q){ best=r; bess=true; } }
    if(!bess){ hm/=2; hs/=2; if(hm<span*1e-7) break; } }
  return best; }
/* ---- Weitere Funktionen: a und b an die Daten anpassen ----
   Bei a·x·e^(−b·x) und a·x²·e^(−b·x) steckt a linear im Ansatz: b wird abgesucht, a ergibt
   sich dann als Ausgleichsrechnung. Beim eigenen Term wird erst geprueft, ob a dort nur als
   Faktor steht (dann derselbe Weg); sonst werden a und b gemeinsam gesucht - grobes Raster,
   danach Musterabstieg mit immer kleineren Schritten. */
function mdWeit(P){
  const art=md.wf||'xe';
  const xw=P.map(q=>q[0]);
  const span=Math.max(1e-6, Math.max.apply(null,xw)-Math.min.apply(null,xw));
  const bMax=Math.log(1e6)/span;
  const ueber=(g)=>mdSuche(P,-bMax,bMax,600,b=>{ const h=x=>g(x,b);
    return {basis:[h], fn:c=>(x=>c[0]*h(x))}; });
  if(art==='xe'||art==='x2e'){
    const pot=art==='xe'?1:2;
    const best=ueber((x,b)=>Math.pow(x,pot)*Math.exp(-b*x));
    return best?{a:best.c[0], b:best.k, f:best.f, q:best.s}:null; }
  const T=tokenize(md.wterm||'');
  if(!T.length) return null;
  const g=(x,a,b)=>evalAt(x,T,{a,b});
  /* Steht a nur als Faktor? Probe an einigen Stellen: f(x,2,b) = 2·f(x,1,b) */
  const probe=xw.slice(0,Math.min(6,xw.length));
  let linear=probe.length>0;
  for(const x of probe){ const u=g(x,1,0.5), v=g(x,2,0.5);
    if(!isFinite(u)||!isFinite(v)||Math.abs(v-2*u)>1e-9*Math.max(1,Math.abs(v))){ linear=false; break; } }
  if(linear){ const best=ueber((x,b)=>g(x,1,b));
    if(best) return {a:best.c[0], b:best.k, f:best.f, q:best.s}; }
  /* a und b zusammen: erst ein grobes Raster ueber beide Vorzeichen, dann wird von den
     acht besten Rasterpunkten aus abgestiegen - ein einzelner Start landet bei Termen wie
     sin(a·x) sonst leicht in einem Nebenminimum. */
  const bew=(a,b)=>{ const f=x=>g(x,a,b), q=mdSSE(P,f); return isFinite(q)?{a,b,f,q}:null; };
  const stufen=[0.1,0.2,0.35,0.5,0.75,1,1.5,2,3,5,8,15,30,80];
  const werte=stufen.concat(stufen.map(v=>-v));
  let raster=[];
  for(const a of werte) for(const b of werte.concat([0])){ const r=bew(a,b); if(r) raster.push(r); }
  if(!raster.length) return null;
  raster.sort((u,v)=>u.q-v.q);
  let best=raster[0];
  for(const start of raster.slice(0,8)){
    let akt=start, ha=Math.max(Math.abs(akt.a),1)/2, hb=Math.max(Math.abs(akt.b),1)/2;
    for(let k=0;k<300;k++){ let bess=false;
      for(const d of [[ha,0],[-ha,0],[0,hb],[0,-hb],[ha,hb],[-ha,-hb],[ha,-hb],[-ha,hb]]){
        const r=bew(akt.a+d[0],akt.b+d[1]); if(r&&r.q<akt.q){ akt=r; bess=true; } }
      if(!bess){ ha/=2; hb/=2; if(ha<1e-10&&hb<1e-10) break; } }
    if(akt.q<best.q) best=akt; }
  return {a:best.a, b:best.b, f:best.f, q:best.q}; }
function mdModell(){ const D=mdDaten(), art=md.typ;
  const gradN=Math.max(1,Math.min(6,md.grad|0));
  const nMin=art==='p'?(md.genau?1:gradN+1):(art==='e'?(md.offC?3:2):(art==='n'?(md.offC?4:3):(art==='w'?3:4)));
  if(D.length<nMin) return {fehlt:nMin};
  if(art==='p'&&md.genau){
    for(let i=1;i<D.length;i++) if(Math.abs(D[i].x-D[i-1].x)<1e-12) return {kein:true,gleich:true};
    const nS=D.filter(q=>q.s!=null).length;
    const c=nS?mdHermite(D):mdInterp(D);
    if(!c) return {kein:true};
    const gr=Math.max.apply(null,c.map(Math.abs));             /* passt die Loesung in einen kleineren */
    while(c.length>1&&Math.abs(c[0])<1e-10*Math.max(1,gr)) c.shift();   /* Grad, dann den angeben */
    return {art:'p', c, g:c.length-1, nS, n:D.length,
            fn:x=>{ let v=0; for(let i=0;i<c.length;i++) v=v*x+c[i]; return v; }}; }
  if(art==='p'){                                               /* Ausgleichspolynom mit festem Grad */
    const basis=[]; for(let i=gradN;i>=0;i--) basis.push(x=>Math.pow(x,i));
    const c=mdLin(basis,mdDaten().map(q=>[q.x,q.y])); if(!c) return {kein:true};
    return {art:'p', c, g:gradN, nS:0, n:D.length, nae:true,
            fn:x=>{ let v=0; for(let i=0;i<c.length;i++) v=v*x+c[i]; return v; }}; }
  const P=D.map(q=>[q.x,q.y]);
  const xw=P.map(q=>q[0]), span=Math.max(1e-6, Math.max.apply(null,xw)-Math.min.apply(null,xw));
  if(art==='e'){ const mitC=!!md.offC, kmax=Math.log(1e6)/span;      /* y = a · bˣ (+ c) */
    const best=mdSuche(P,-kmax,kmax,600,k=>{ if(Math.abs(k)<1e-7) return null;
      return {basis: mitC?[x=>Math.exp(k*x),()=>1]:[x=>Math.exp(k*x)],
              fn:c=>(x=>c[0]*Math.exp(k*x)+(mitC?c[1]:0))}; });
    if(!best) return {kein:true};
    return {art:'e', fn:best.f, a:best.c[0], b:Math.exp(best.k), c:mitC?best.c[1]:0, mitC}; }
  if(art==='n'){ const mitC=!!md.offC;
    const best=mdNormal(P,mitC); if(!best) return {kein:true};
    return {art:'n', fn:best.f, a:best.c[0], mu:best.m, sg:best.sg, c:mitC?best.c[1]:0, mitC}; }
  if(art==='w'){ const best=mdWeit(P); if(!best) return {kein:true};
    return {art:'w', wf:md.wf||'xe', fn:best.f, a:best.a, b:best.b}; }
  /* y = a · sin(b · (x − c)) + d; fuer festes b stecken a, c und d linear im Ansatz */
  const b0=2*Math.PI/(3*span), b1=2*Math.PI*Math.max(2,P.length/2)/span;
  const best=mdSuche(P,Math.log(b0),Math.log(b1),700,lg=>{ const b=Math.exp(lg);
    return {basis:[x=>Math.sin(b*x),x=>Math.cos(b*x),()=>1],
            fn:c=>(x=>c[0]*Math.sin(b*x)+c[1]*Math.cos(b*x)+c[2])}; });
  if(!best) return {kein:true};
  const b=Math.exp(best.k), A=best.c[0], B=best.c[1], d=best.c[2];
  const a=Math.hypot(A,B), T=2*Math.PI/b;
  let c=Math.atan2(-B,A)/b; const x0=Math.min.apply(null,xw);
  while(c<x0-T/2) c+=T; while(c>x0+T/2) c-=T;       /* Verschiebung in die Naehe der Daten holen */
  return {art:'t', fn:best.f, a, b, c, d}; }
/* Steigung des Modells an der Stelle x – fuer die Griffe, die noch keinen Wert haben */
function mdSteig(x){ const m=mdErg; if(!m||!m.fn) return 0;
  const h=1e-4*Math.max(1,Math.abs(x)), v=(m.fn(x+h)-m.fn(x-h))/(2*h);
  return isFinite(v)?v:0; }

/* ---- Term ---- */
const mdR=v=>zahl(Math.round(v*1e4)/1e4);
function mdTerm(m){
  if(m.art==='p'){ const g=m.g; let s='';
    m.c.forEach((v,i)=>{ const p=g-i, r=Math.round(v*1e4)/1e4;
      if(Math.abs(r)<1e-9&&g>0) return;                               /* Glied faellt weg */
      const z=Math.abs(r), eins=p>0&&Math.abs(z-1)<1e-9;
      s+=(s?(r<0?' − ':' + '):(r<0?'−':''))+(eins?'':mdR(z)+(p>0?'·':''))
        +(p>0?('<i>x</i>'+(p>1?hoch(p):'')):''); });
    return s||'0'; }
  if(m.art==='e'){ let s=mdR(m.a)+'·'+mdR(m.b)+'<i>ˣ</i>';
    if(m.mitC&&Math.abs(m.c)>1e-9) s+=(m.c>0?' + ':' − ')+mdR(Math.abs(m.c));
    return s; }
  if(m.art==='w'){
    /* der Exponent ist kurz - er darf in der schmalen Spalte nicht umbrechen */
    const ex='<span style="white-space:nowrap"><i>e</i><sup>'+(m.b<0?'':'−')+mdR(Math.abs(m.b))+'<i>x</i></sup></span>';
    if(m.wf!=='frei') return mdR(m.a)+'·<i>x</i>'+(m.wf==='x2e'?'²':'')+'·'+ex;
    /* eigener Term: a und b eingesetzt, sonst so geschrieben wie eingegeben */
    return String(md.wterm||'').replace(/\ba\b/g,mdR(m.a)).replace(/\bb\b/g,mdR(m.b))
      .replace(/\*/g,'·').replace(/\bx\b/g,'<i>x</i>').replace(/\be\b/g,'<i>e</i>'); }
  if(m.art==='n'){ const mu=m.mu, vz=mu<0?' + ':' − ';
    let s='<i>e</i><sup>−(<i>x</i>'+(Math.abs(mu)<1e-9?'':vz+mdR(Math.abs(mu)))+')²/(2·'+mdR(m.sg)+'²)</sup>';
    s=mdR(m.a)+'·'+s;
    if(m.mitC&&Math.abs(m.c)>1e-9) s+=(m.c>0?' + ':' − ')+mdR(Math.abs(m.c));
    return s; }
  let s=mdR(m.a)+'·sin('+mdR(m.b)+'·(<i>x</i>'
        +(Math.abs(m.c)<1e-9?'':(m.c>0?' − ':' + ')+mdR(Math.abs(m.c)))+'))';
  if(Math.abs(m.d)>1e-9) s+=(m.d>0?' + ':' − ')+mdR(Math.abs(m.d));
  return s; }
function mdText(){ const out=$('mdOut'); if(!out) return;
  const D=mdDaten(), m=mdErg, ti=$('mdTitel');
  if(ti) ti.textContent='Daten'+(D.length?' ('+D.length+(D.length===1?' Punkt)':' Punkte)'):'');
  if(!m||m.fehlt){ out.innerHTML='<div class="mdG">'+(D.length
      ?('Für ein '+MD_TYP[md.typ]+'es Modell sind mindestens <b>'+m.fehlt+'</b> Punkte nötig.')
      :'Noch keine Daten: Punkte in die Fläche tippen oder in die Tabelle schreiben.')+'</div>'; return; }
  if(m.kein){ out.innerHTML='<div class="mdG">'+(m.gleich
      ?'Zwei Punkte mit gleichem <i>x</i> – dadurch kann kein Graph gehen.'
      :'Zu diesen Daten passt kein '+MD_TYP[md.typ]+'es Modell.')+'</div>'; return; }
  let hin;
  const abw=()=>{ let q=0; D.forEach(o=>{ const v=m.fn(o.x); if(isFinite(v)) q+=Math.abs(v-o.y); });
    return 'mittlere Abweichung <b>'+nfk(Math.round(q/D.length*1000)/1000)+'</b>'; };
  if(m.art==='p'&&!m.nae){ hin='Grad <b>'+m.g+'</b> – der Graph geht genau durch '
      +(m.n===1?'den Punkt':'alle '+m.n+' Punkte');
    hin+=m.nS?(m.nS===m.n?(m.n===1?' und hat dort die vorgegebene Steigung.'
                                  :' und hat dort die vorgegebenen Steigungen.')
                         :' und hat an '+(m.nS===1?'einem Punkt':m.nS+' Punkten')+' die vorgegebene Steigung.'):'.'; }
  else if(m.art==='p') hin='Grad <b>'+m.g+'</b> · Näherung – '+abw()+'.';
  else if(m.art==='w') hin='Näherung · <i>a</i> = <b>'+nfk(Math.round(m.a*1e4)/1e4)
      +'</b> · <i>b</i> = <b>'+nfk(Math.round(m.b*1e4)/1e4)+'</b> – '+abw()+'.';
  else if(m.art==='n') hin='Näherung · <i>μ</i> = <b>'+nfk(Math.round(m.mu*1000)/1000)
      +'</b> · <i>σ</i> = <b>'+nfk(Math.round(m.sg*1000)/1000)+'</b> – '+abw()+'.';
  else hin='Näherung – '+abw()+'.';
  const t=md.zTerm?('<i>y</i> = '+mdTerm(m)):'<i>y</i> = ? ? ?';
  out.innerHTML='<div class="mdBox"><button type="button" class="mdDot" title="Farbe des Modellgraphen wählen"'
               +' style="background:'+mdKurve()+'"></button>'
               +'<div class="mdT" style="color:'+mdKurve()+'">'+t+'</div></div>'
               +'<div class="mdG">'+hin+'</div>';
  const dot=out.querySelector('.mdDot'); if(dot) dot.onclick=()=>mdFarbwahl(dot); }
/* Farbwähler für den Modellgraphen – gleiche Auswahl wie bei den Funktionsfarben */
function mdFarbwahl(el){ colPop.innerHTML='';
  FARBEN.forEach(c=>{ const b=document.createElement('button'); b.style.background=c; b.dataset.c=c; b.title=c;
    b.classList.toggle('on',mdKurve()===c);
    b.onclick=()=>{ mdSetzeFarbe(c); farbeZu(); }; colPop.appendChild(b); });
  const std=document.createElement('button'); std.style.background=MDCOL.kurve; std.title='Standardfarbe';
  std.textContent='↺'; std.style.color='#fff'; std.style.fontWeight='800';
  std.onclick=()=>{ mdSetzeFarbe(MDCOL.kurve); farbeZu(); }; colPop.appendChild(std);
  const eig=document.createElement('input'); eig.type='color';
  eig.value=/^#[0-9a-f]{6}$/i.test(mdKurve())?mdKurve():MDCOL.kurve;
  eig.title='eigene Farbe'; eig.oninput=()=>mdSetzeFarbe(eig.value); colPop.appendChild(eig);
  colPop.classList.add('show');
  const r=el.getBoundingClientRect(), pw=colPop.offsetWidth, ph=colPop.offsetHeight;
  colPop.style.left=Math.max(6,Math.min(innerWidth-pw-6,r.left-6))+'px';
  colPop.style.top=((r.bottom+6+ph>innerHeight)?Math.max(6,r.top-ph-6):r.bottom+6)+'px'; }
function mdSetzeFarbe(c){ md.col=c;
  const dot=document.querySelector('#mdOut .mdDot'), t=document.querySelector('#mdOut .mdT');
  if(dot) dot.style.background=c; if(t) t.style.color=c;
  colPop.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  mdDraw(); sync(); }
/* ---- Import: Werte aus der Zwischenablage oder aus einer Datei ----
   Je Zeile ein Punkt, getrennt durch Tabulator, Semikolon oder Leerzeichen.
   Zahlen dürfen deutsch (Komma) oder englisch (Punkt) geschrieben sein; eine
   Kopfzeile faellt von selbst weg, weil sich aus ihr keine Zahlen lesen lassen. */
function mdImpLes(txt){ const aus=[];
  String(txt||'').split(/\r?\n/).forEach(z=>{ const s=z.trim(); if(!s) return;
    let f=s.split(/[\t;]/);
    if(f.length<2) f=s.split(/\s+/);
    if(f.length<2) f=s.split(',');                      /* nur Kommas: dann sind sie das Trennzeichen */
    f=f.map(t=>t.trim()).filter(t=>t!=='');
    if(f.length<2) return;
    const x=pz(f[0]), y=pz(f[1]), sl=f.length>2?pz(f[2]):NaN;
    if(!isFinite(x)||!isFinite(y)) return;
    aus.push([mdF(x),mdF(y),isFinite(sl)?mdF(sl):'']); });
  return aus; }
function mdImpAn(on){ $('mdImpBox').hidden=!on; $('mdImp').classList.toggle('on',!!on);
  if(on){ const t=$('mdImpTxt'); try{ t.focus({preventScroll:true}); }catch(e){} } }
function mdImpNimm(){ const neu=mdImpLes($('mdImpTxt').value);

  let j=0;

    const xr=Math.round(x/stx)*stx, yr=Math.round((a[1]+f*(b[1]-a[1]))/sty)*sty;
    if(neu.length&&Math.abs(neu[neu.length-1][0]-xr)<stx/2) continue;   /* zweimal dasselbe x */

     gezeichneten Linie ist die Ausgleichskurve gemeint. */
  if(md.typ==='p'&&md.genau){ md.genau=false; md.abl=false; mdUi(); }
  mdBaue(); mdRechne(); sync(); }

const ohneTags=h=>String(h).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
function lmPot(c,g){ const vz=c<0?'−':'', z=Math.abs(c);

/* Polynom als HTML; der Summand mit dem Grad „stark" wird hervorgehoben, der Rest wird blass */
function lmPolyHtml(p,stark){ p=pTrim(p); const g=p.length-1, teile=[];

const lmBruchHtml=(zh,nh)=>'<span class="lmBr"><span>'+zh+'</span><span>'+nh+'</span></span>';
/* Den eingegebenen Term anzeigen – ein Quotient wird dabei auch als Bruch gesetzt */
function lmOrigHtml(ast,toks){
  if(ast&&ast.k==='/'){ const zt=lmAstHtml(ast.l), nt=lmAstHtml(ast.r);
    if(zt&&nt) return lmBruchHtml(zt,nt); }
  return ast?lmAstHtml(ast):termText(toks); }
/* Vergleichstext „(x² + 1)/(x − 2)" zu einer Darstellung – einteilige Zähler/Nenner ohne Klammern */
function lmTermVgl(zh,nh){ const t=h=>{ const r=String(h).replace(/<[^>]+>/g,'').trim();
    if(r.startsWith('(')&&r.endsWith(')')) return r;          /* steht schon in Klammern */

/* Der Linearfaktor (x − x₀). Ist x₀ exakt bekannt und ohne Nenner, wird glatt

function lmKlammer(x0,k){ const h=(k>1?hoch(k):'');
  if(Math.abs(x0)<1e-12) return 'x'+h;

  if(T&&T.n===1){ let t='';
    if(T.p) t+=(T.p<0?' − ':' + ')+zahl(Math.abs(T.p));
    if(T.q) t+=(T.q<0?' − ':' + ')+((Math.abs(T.q)===1?'':zahl(Math.abs(T.q)))+'√'+zahl(T.m));

function lmWert(w){ if(!w) return '—';

/* Farben wie bei den Vorzeichen-Markern: + gruen, − rot, 0 neutral dunkelgrau;

const lmWCol=w=>(!w?'#64748b':(w.art==='inf'?'#15803d':(w.art==='ninf'?'#b91c1c'
  :(w.art==='kein'||w.art==='undef'?'#b45309'
  :(/^[−-]?0(,0*)?$/.test(lmWert(w))?'#334155'   /* angezeigte 0: kein Vorzeichen */

const LM_SENK='#ea580c';      /* senkrechte Asymptoten (Polstellen): orange */
const LM_WAAG='#7e22ce';      /* waagrechte und schiefe Asymptoten: lila */
const LM_VGL='#0f766e';       /* Vergleichsterm für große |x|: petrol */
const LM_KEHR='#db2777';      /* Kehrwertfunktion 1/f: rosa */
const lmX=x=>lmZ(x);
const lmVZ=v=>v>0?'positiv':'negativ';
/* Einen Teilbaum wieder als Term schreiben – so lässt er sich einzeln auswerten und anzeigen */
function lmAstText(nd){ if(!nd) return '';
  const P={'+':1,'-':1,'*':2,'/':2};
  const ein=(t,min)=>{ const p=P[t.k]||9; return p<min?'('+lmAstText(t)+')':lmAstText(t); };
  const hoch2=t=>(t.k==='num'||t.k==='id')?lmAstText(t):'('+lmAstText(t)+')';

/* Term aus dem Baum als HTML – Exponenten stehen hoch (e^(−x) → e<sup>−x</sup>) */
function lmAstHtml(nd){ if(!nd) return '';

  const ein=(t,min)=>{ const p=P[t.k]||9; return p<min?'('+lmAstHtml(t)+')':lmAstHtml(t); };
  switch(nd.k){
    case 'num': return zahl(nd.v);
    case 'id': return SYM[nd.n]||nd.n;

    case '^': return ein(nd.l,4)+'<sup>'+lmAstHtml(nd.r)+'</sup>';
    case '*': return ein(nd.l,2)+'·'+ein(nd.r,2);
    case '/': return ein(nd.l,2)+'/'+ein(nd.r,3);
    case '+': return lmAstHtml(nd.l)+' + '+ein(nd.r,1);
    case '-': return lmAstHtml(nd.l)+' − '+ein(nd.r,2); }

/* oberste Faktoren eines Produkts/Quotienten einsammeln */
function lmTeile(nd,out,imNenner){ out=out||[];
  if(!nd) return out;
  if(nd.k==='*'){ lmTeile(nd.l,out,imNenner); lmTeile(nd.r,out,imNenner); return out; }
  if(nd.k==='/'){ lmTeile(nd.l,out,imNenner); lmTeile(nd.r,out,!imNenner); return out; }
  out.push({nd,nenner:!!imNenner}); return out; }
/* oberste Summanden einer Summe/Differenz einsammeln – je mit dem Vorzeichen davor */
function lmSummanden(nd,out,vz){ out=out||[]; vz=vz||1;
  if(!nd) return out;
  if(nd.k==='+'){ lmSummanden(nd.l,out,vz); lmSummanden(nd.r,out,vz); return out; }
  if(nd.k==='-'){ lmSummanden(nd.l,out,vz); lmSummanden(nd.r,out,-vz); return out; }
  if(nd.k==='neg'){ lmSummanden(nd.a,out,-vz); return out; }

/* Bei einer Summe bestimmt der Teil das Ergebnis, der betragsmäßig am schnellsten wächst.
   Verglichen wird an der tiefsten eingesetzten Stelle, an der noch alle Teile eine Zahl liefern;
   ein Teil gilt nur dann als bestimmend, wenn er dort mindestens zehnmal so groß ist wie die übrigen. */
function lmSummeDom(teile){
  if(!teile.some(t=>t.w.art==='inf'||t.w.art==='ninf')) return;
  const n=teile[0].pr.length;
  for(let i=n-1;i>=0;i--){
    const ys=teile.map(t=>{ const q=t.pr[i]; return q?q[1]:null; });
    if(ys.some(y=>typeof y!=='number'||!isFinite(y))) continue;
    const b=ys.map(Math.abs), max=Math.max.apply(null,b);
    if(!(max>0)) continue;
    const zweit=Math.max.apply(null,b.map((v,j)=>b.indexOf(max)===j?0:v));
    if(max>=10*zweit) teile[b.indexOf(max)].dom=true;
    return; } }

/* Den Term als Produkt bzw. Quotient seiner Teile schreiben und über jeden Teil den Wert

   null, wenn sich der Term nicht in mehrere Teile zerlegen lässt. */
function lmTeileAnn(ast,x0,seite,gesamt){ if(!ast) return null;
  if(ast.k==='+'||ast.k==='-'||ast.k==='neg') return lmSummeAnn(ast,x0,seite);
  const T=lmTeile(ast); if(T.length<2||T.length>5) return null;
  const klam=nd=>((nd.k==='+'||nd.k==='-')?'('+lmAstHtml(nd)+')':lmAstHtml(nd));
  const teile=T.map(q=>{ const tk=tokenize(lmAstText(q.nd));
    const pr=lmProben(x=>evalAt(x,tk,lm.p),x0,seite), w=lmAusProben(pr);
    let vzN=0;
    if(w.art==='zahl'&&Math.abs(w.v)<1e-9){ const y=pr[pr.length-1][1]; vzN=y<0?-1:(y>0?1:0); }
    return {q, w, a:lmAnnWert(w,vzN), html:klam(q.nd)}; });

  const istInf=w=>w.art==='inf'||w.art==='ninf', istNull=w=>w.art==='zahl'&&Math.abs(w.v)<1e-9;

  if(teile.every(t=>t.dom)||!teile.some(t=>t.dom)) teile.forEach(t=>{ t.dom=false; });

  const bau=(l,unten)=>l.map(t=>lmAnnHtml(t.html,t.a.txt,t.a.vz,t.dom,unten)).join(' · ');
  return nt.length? lmBruchHtml(bau(zt,false),bau(nt,true)) : bau(zt,false); }
/* Dasselbe für eine Summe oder Differenz: über jeden Summanden kommt sein Wert,

function lmSummeAnn(ast,x0,seite){
  const S=lmSummanden(ast); if(S.length<2||S.length>5) return null;
  const teile=S.map(q=>{ const tk=tokenize(lmAstText(q.nd));
    const pr=lmProben(x=>evalAt(x,tk,lm.p),x0,seite), w=lmAusProben(pr);

    if(w.art==='zahl'&&Math.abs(w.v)<1e-9){ const y=pr[pr.length-1][1]; vzN=y<0?-1:(y>0?1:0); }

  lmSummeDom(teile);
  return teile.map((t,i)=>(i?(t.vz<0?' − ':' + '):(t.vz<0?'−':''))

/* In einer Summe fällt eine e-Funktion, die selbst gegen 0 geht, gar nicht ins Gewicht

function lmExpGegenNull(ast,x0,seite){
  if(!ast||!(ast.k==='+'||ast.k==='-'||ast.k==='neg')) return false;
  let gefunden=false, ohneExp=false;
  const S=lmSummanden(ast);
  for(let i=0;i<S.length;i++){ const txt=lmAstText(S[i].nd);

    const w=lmAusProben(lmProben(x=>evalAt(x,tokenize(txt),lm.p),x0,seite));

  return gefunden?(ohneExp?'mit':'allein'):false; }
/* „Dabei geht x → +∞ und e^(−x) → 0" – das Verhalten der einzelnen Teile */
function lmTeilText(ast,x0,seite){
  const summe=!!ast&&(ast.k==='+'||ast.k==='-'||ast.k==='neg');
  const t=(summe?lmSummanden(ast):lmTeile(ast)).filter(q=>/x/.test(lmAstText(q.nd)));
  if(t.length<2||t.length>4) return '';
  const stk=t.map(q=>{ const txt=lmAstText(q.nd), tk=tokenize(txt);
    const w=lmAusProben(lmProben(x=>evalAt(x,tk,lm.p),x0,seite));

                :(w.art==='kein'?'schwankt':'→ '+lmWert(w));
    return (q.nenner?'im Nenner ':'')+lmAstHtml(q.nd)+' '+beschr; });
  return 'Die einzelnen Teile: '+stk.join(', ')+'. '; }

/* Der Term, wie er eingegeben wurde – also auch unfaktorisiert –, mit Vorzeichen-Marken an
   Zähler und Nenner: grün, wo der Teil neben der Stelle positiv ist, rot, wo er negativ ist.
   Darüber bzw. darunter steht sein Wert; was an der Stelle 0 wird, steht als „+0“ oder „−0“,
   je nachdem, von welcher Seite man kommt. Genau das ist der Grund für +∞ oder −∞.
   zNull sagt, ob auch der Zähler an der Stelle 0 wird – das weiß die Analyse schon. */
function lmOrigVZ(ast,x0,seite,zNull){
  if(!ast||ast.k!=='/'||!isFinite(x0)) return null;
  const xp=x0+(seite||0)*1e-6;

    const roh=lmAstHtml(nd); if(!roh) return null;
    const tk=tokenize(lmAstText(nd));
    const v0=evalAt(x0,tk,lm.p), vp=evalAt(xp,tk,lm.p);
    if(!isFinite(vp)) return null;
    const a=istNull?{txt:(vp<0?'−0':'+0'), vz:vp<0?-1:1}
                   :(isFinite(v0)?{txt:zahl(v0), vz:v0>0?1:(v0<0?-1:0)}:null);
    if(!a) return null;

    return lmAnnHtml('<span class="'+(istNull?'lmStark ':'')+cls+'">'+roh+'</span>',a.txt,a.vz,istNull,unten); };
  const z=teil(ast.l,!!zNull,false), n=teil(ast.r,true,true);
  return (z&&n)?lmBruchHtml(z,n):null; }

/* Ein Polynom als Produkt schreiben, soweit es in Linearfaktoren aufgeht – so hat jeder
   Teil neben einer Stelle ein eigenes Vorzeichen. Gleiche Faktoren werden zu einer Potenz
   zusammengefasst; das Produkt aller Teile ist wieder das Polynom. */
function lmFaktoren(p){ p=pTrim(p); const lin=[]; let rest=p.slice();
  for(let s=0;s<10&&pGrad(rest)>0;s++){
    const ns=lmEinfach(pNull(rest)).filter(x0=>Math.abs(pWert(rest,x0))<1e-7*lmNorm(rest));
    if(!ns.length) break;
    lin.push(ns[0]); rest=pTeil(rest,ns[0]).q; }
  const aus=[], g=pGrad(rest), c=g===0?pTrim(rest)[0]:null;
  if(c!==null&&(!lin.length||Math.abs(c-1)>1e-9)) aus.push({p:[c],html:zahl(c)});
  const grp=[]; lin.forEach(x0=>{ const q=grp.find(u=>Math.abs(u.x-x0)<1e-7); if(q) q.k++; else grp.push({x:x0,k:1}); });

    aus.push({p:pp, html:lmKlammer(q.x,q.k)}); });

/* Einen Teilterm mit dem Wert beschriften, den er an der Stelle annimmt:
   über dem Zähler, unter dem Nenner; fett unterstrichen, was das Ergebnis bestimmt. */
function lmAnnHtml(html,txt,vz,dom,unten){ if(txt==null) return html;
  return '<span class="lmAnn'+(unten?' unten':'')+'"><span class="v'+(vz>0?' vP':(vz<0?' vM':''))+(dom?' vDom':'')+'">'+
    txt+'</span><span class="t">'+html+'</span></span>'; }
/* Grenzwert eines Teilterms als kurzer Text: 5, −3, +0, −0, +∞, −∞, schwankt */
function lmAnnWert(w,vzNull){ if(!w||w.art==='undef') return null;
  if(w.art==='inf') return {txt:'+∞',vz:1};
  if(w.art==='ninf') return {txt:'−∞',vz:-1};
  if(w.art==='kein') return {txt:'schwankt',vz:0};
  if(Math.abs(w.v)<1e-9) return vzNull? {txt:(vzNull<0?'−0':'+0'),vz:vzNull} : {txt:'0',vz:0};

/* ein Faktor mit Marker: grün wenn er bei xp positiv ist, rot wenn negativ */
function lmVZTeil(q,xp,stark){ const v=pWert(q.p,xp), cls=(v>0?'lmPlus':(v<0?'lmMinus':''));
  return '<span class="'+(stark?'lmStark ':'')+cls+'">'+q.html+'</span>'; }
const lmVZListe=(F,xp)=>F.map(q=>q.html+' '+lmVZ(pWert(q.p,xp))).join(', ');

/* Polynomdivision – für die schiefe Asymptote */
function pDiv(z,n){ let rest=pTrim(z).slice(); n=pTrim(n); const gn=n.length-1; const q=[];
  for(let s=0;s<40;s++){ rest=pTrim(rest); const gz=rest.length-1;
    if(gz<gn||(gz===0&&Math.abs(rest[0])<1e-12)) break;
    const c=rest[gz]/n[gn]; q[gz-gn]=c;
    for(let i=0;i<=gn;i++) rest[gz-gn+i]-=c*n[i]; }
  for(let i=0;i<q.length;i++) if(q[i]===undefined) q[i]=0;
  return {q:pTrim(q.length?q:[0]), r:pTrim(rest)}; }
function lmGerade(p){ const m=p[1]||0, b=p[0]||0;
  return 'y = '+(Math.abs(m-1)<1e-12?'x':(Math.abs(m+1)<1e-12?'−x':zahl(m)+'x'))+(Math.abs(b)<1e-12?'':(b>0?' + '+zahl(b):' − '+zahl(-b))); }

/* ---- Hauptanalyse ---- */
function lmAnalyse(){
  const toks=tokenize(lm.term||'');
  const f=x=>evalAt(x,toks,lm.p);
  const e={term:lm.term||'', farbe:'#2563eb', toks, f,
           karten:[], pole:[], loecher:[], raender:[], asym:[], schief:null, vergleich:null, ok:false, kopf:'', hinweis:''};
  if(!toks.length){ e.hinweis='Oben einen Term eintragen – dann stehen hier die Grenzwerte.'; return e; }
  if(stueckeVon(toks)){ e.hinweis='Abschnittsweise Terme (mit „;“) untersucht dieser Reiter nicht – zeichnen lassen sie sich im Reiter Graph.'; return e; }
  let gut=0; for(let i=0;i<=200;i++){ const x=-20+i*0.2; if(isFinite(f(x))) gut++; }
  if(!gut){ e.hinweis='Dieser Term lässt sich nicht auswerten – bitte prüfen.'; return e; }
  e.ok=true;
  const ast=lmAst(toks), rat=ast?lmRat(ast):null, F=lmFlags(ast);
  const origT=termText(toks);                                  /* der Term, wie er eingegeben wurde */
  const origHtml=lmOrigHtml(ast,toks);                         /* derselbe Term, Quotienten als Bruch */
  e.ast=ast; e.origHtml=origHtml;                              /* für die Kehrwertfunktion 1/f */
  /* Vergleichsform: ohne Leerzeichen und Malpunkte, und ein reines Faktorenprodukt
     wird sortiert – (x−2)(x+3) und (x+3)(x−2) sind derselbe Term. */
  const ohneLeer=t=>String(t).replace(/[\s·]/g,'').split('/').map(q=>{
    let r=q;
    if(/^\(.*\)$/.test(r)){ const inn=r.slice(1,-1); let d=0, ok=true;
      for(const ch of inn){ if(ch==='(')d++; else if(ch===')'){ d--; if(d<0){ ok=false; break; } } }
      if(ok&&d===0) r=inn; }
    const st=r.match(/\([^()]*\)/g);
    return (st&&st.join('')===r)?st.slice().sort().join(''):r; }).join('/');
  /* steht links dasselbe wie rechts, wird nur einmal geschrieben */
  /* oh: der Originalterm mit eigenen Marken (an einer Definitionslücke) – sonst schlicht */
  const mitOrig=(h,vgl,oh)=>(ohneLeer(vgl)===ohneLeer(origT))?('f(x) = '+h):('f(x) = '+(oh||origHtml)+' = '+h);
  const randKarte=(x0,seite,wert,grund,proben)=>({ziel:'x → '+lmKlam(lmX(x0))+(seite<0?'⁻':'⁺'), wert, grund, proben, x:x0, seite});

  /* ===== gebrochen-rationale und ganzrationale Terme: alles am Term ablesbar ===== */
  if(rat){
    const z=pTrim(rat.z), nn=pTrim(rat.n), gz=pGrad(z), gn=pGrad(nn);
    const gebrochen=gn>0;
    /* Verhalten für große |x| – dazu auch der Term mit kräftiger größter Potenz,
       genau wie beim Rand x → ±∞: alles Kleinere steht blass daneben. */
    e.vergleich=lmVergleichBau(z,nn,gebrochen);
    e.rz=z; e.rn=nn;                                 /* Zähler und Nenner – für die Kehrwertfunktion */
    e.art=gebrochen?'rational':'ganz';
    /* --- Definitionslücken --- */
    if(gebrochen) lmEinfach(pNull(nn)).forEach(x0=>{
      let zz=z.slice(), nk=nn.slice(), kz=0, kn=0;
      while(kz<10&&pGrad(zz)>0&&Math.abs(pWert(zz,x0))<1e-9*lmNorm(zz)){ zz=pTeil(zz,x0).q; kz++; }
      while(kn<10&&pGrad(nk)>0&&Math.abs(pWert(nk,x0))<1e-9*lmNorm(nk)){ nk=pTeil(nk,x0).q; kn++; }
      const kl=lmKlammer(x0,1), klT=(Math.abs(x0)<1e-12?'x':kl);
      /* Nenner als Produkt zeigen: der Faktor, der 0 wird, steht kräftig da */
      const klammerRein=p=>(pGrad(p)>0?'('+lmPolyHtml(p,-1)+')':lmPolyHtml(p,-1));
      const nFakt='<span class="lmStark">'+lmKlammer(x0,kn)+'</span>'+((pGrad(nk)>0||Math.abs(nk[0]-1)>1e-12)?(' · '+klammerRein(nk)):'');
      const zFakt=kz?('<span class="lmStark">'+lmKlammer(x0,kz)+'</span> · '+klammerRein(zz)):lmPolyHtml(z,-1);
      if(kn>kz){                                                   /* Polstelle */
        e.pole.push(x0);
        const zV=pWert(zz,x0), ord=kn-kz;
        /* Zähler und Nenner als Produkt – jeder Faktor bekommt neben der Stelle seinen Marker */
        const zF=lmFaktoren(z), nF=lmFaktoren(nn);
        const null0=q=>Math.abs(pWert(q.p,x0))<1e-9*lmNorm(q.p);
        const anf= kz? ('Zähler und Nenner werden beide 0. Nach dem Kürzen von '+klT+(kz>1?hoch(kz):'')+' bleibt im Nenner noch '+kl+(ord>1?hoch(ord):'')+' stehen – also eine Polstelle.')
                     : ('Der Nenner wird 0, der Zähler ist dort '+zahl(zV)+' ≠ 0 – eine <b>Polstelle</b>.');
        [-1,1].forEach(seite=>{
          const h=1e-6, xp=x0+seite*h, zN=pWert(z,xp), nN=pWert(nn,xp);   /* dicht neben der Lücke */
          /* über bzw. unter jedem Faktor steht, welchen Wert er an der Stelle annimmt –
             der Faktor, der 0 wird, als „−0“ bzw. „+0“, je nach Seite */
          const mal=(F,unten)=>F.map(q=>{ const n0=null0(q), v0=pWert(q.p,x0), vp=pWert(q.p,xp);
            const a=n0?{txt:(vp<0?'−0':'+0'),vz:vp<0?-1:1}:{txt:zahl(v0),vz:v0>0?1:(v0<0?-1:0)};
            return lmAnnHtml(lmVZTeil(q,xp,n0),a.txt,a.vz,n0,unten); }).join(' · ');
          const zH=mal(zF,false), nH=mal(nF,true);
          const zP=zF.map(q=>q.html).join(' · '), nP=nF.map(q=>q.html).join(' · ');
          const pr=lmProben(f,x0,seite), wert=lmAusProben(pr);
          const grund=anf+' '+(seite<0?'Links':'Rechts')+' von '+lmX(x0)+' hat jeder Faktor ein festes Vorzeichen – '+
            'im Term <span class="lmPlus">grün</span> für positiv, <span class="lmMinus">rot</span> für negativ: '+
            'im Zähler '+lmVZListe(zF,xp)+', im Nenner '+lmVZListe(nF,xp)+'. '+
            'Der Zähler ist damit '+lmVZ(zN)+' und der Nenner '+lmVZ(nN)+
            ' – er strebt von '+(nN>0?'oben':'unten')+' gegen 0. '+
            'Der Bruch wird also betragsmäßig immer größer und ist '+lmVZ(zN*nN)+'.'+
            (ord>1?' (Der Faktor, der 0 wird, steht in gerader Potenz – deshalb auf beiden Seiten dasselbe Vorzeichen.)':'');
          const kt=randKarte(x0,seite,wert,grund,pr.slice(1,4));
          kt.termHtml=mitOrig(lmBruchHtml(zH,nH), lmTermVgl(zP,nP), lmOrigVZ(ast,x0,seite,kz>0));
          e.karten.push(kt); }); }
      else {                                                       /* hebbare Lücke */
        const w=(kz>kn)?0:pWert(zz,x0)/pWert(nk,x0);
        e.loecher.push({x:x0,y:w});
        const gek=(pGrad(nk)===0&&Math.abs(nk[0]-1)<1e-12)?lmPolyHtml(zz,null):lmBruchHtml(lmPolyHtml(zz,null),lmPolyHtml(nk,null));
        /* Auch hier bekommt der Originalterm seine Marken – Zähler und Nenner werden beide 0 */
        const lochHtml=seite=>mitOrig(lmBruchHtml(zFakt,nFakt), lmTermVgl(zFakt,nFakt), lmOrigVZ(ast,x0,seite,true))
          +' = '+gek+' <span class="lmFuer">für x ≠ '+lmX(x0)+'</span>';
        /* auch hier beide Seiten einzeln – dass links und rechts dasselbe herauskommt, ist ja der Grund,
           warum die Lücke hebbar ist */
        [-1,1].forEach(seite=>{ const pr=lmProben(f,x0,seite);
          e.karten.push({ziel:'x → '+lmKlam(lmX(x0))+(seite<0?'⁻':'⁺'), wert:{art:'zahl',v:w}, x:x0, seite, loch:true, termHtml:lochHtml(seite),
            grund:'Zähler und Nenner werden beide 0 – die Marken am Term zeigen, von welcher Seite: '+
              '<span class="lmPlus">grün</span> für positiv, <span class="lmMinus">rot</span> für negativ. '+
              'Der Faktor '+klT+(kz>1?hoch(kz):'')+' kürzt sich weg; übrig bleibt '+
              (pGrad(nk)===0&&Math.abs(nk[0]-1)<1e-12?('der Term '+lmPolyHtml(zz,null)):'der gekürzte Bruch')+
              ', und der hat an der Stelle den Wert '+zahl(w)+'. '+
              (seite<0?'Von links':'Von rechts')+' nähern sich die Werte also '+zahl(w)+
              ' – genauso wie von der anderen Seite. Weil beide Seiten denselben Wert ergeben, ist die Lücke <b>hebbar</b>: '+
              'der Graph hat dort nur ein <b>Loch</b>.',
            proben:pr.slice(1,4)}); }); }
    });
    /* --- Verhalten für x → ±∞ --- */
    const lz=z[gz], ln=nn[gn], d=gz-gn, q=lz/ln;
    [-1,1].forEach(s=>{
      const ziel='x → '+(s<0?'−∞':'+∞');
      let wert, grund;
      if(d<0){ wert={art:'zahl',v:0};
        grund='Der Nenner hat den höheren Grad ('+lmPot(ln,gn)+' gegen '+lmPot(lz,gz)+'): er wächst schneller, der Bruch strebt gegen 0. '+
              'Die x-Achse ist <b>waagrechte Asymptote</b>.'; e.asym.push(0); }
      else if(d===0){ wert={art:'zahl',v:q};
        grund='Zähler und Nenner haben denselben Grad. Für große |x| zählen nur die größten Potenzen: '+
              lmPot(lz,gz)+' : '+lmPot(ln,gn)+' = '+zahl(q)+'. Das ist die <b>waagrechte Asymptote</b> y = '+zahl(q)+'.'; e.asym.push(q); }
      else { const vz=q*Math.pow(s,d);
        wert={art:vz>0?'inf':'ninf'};
        if(d===1&&gn>0&&!e.schief){ const dv=pDiv(z,nn); if(pGrad(dv.q)===1) e.schief=dv.q; }
        grund=(gn>0? 'Der Zähler hat den höheren Grad: '+lmPot(lz,gz)+' : '+lmPot(ln,gn)+' verhält sich für große |x| wie '+lmPot(q,d)+'. '
                   : 'Für große |x| bestimmt die größte Potenz '+lmPot(lz,gz)+' alles Übrige. ')+
              'Für '+ziel+' wird '+(d%2?('x'+(d>1?hoch(d):'')+' → '+(s<0?'−∞':'+∞')):('x'+hoch(d)+' → +∞'))+
              (q<0?' und der negative Faktor dreht das Vorzeichen um':'')+': f(x) → '+(vz>0?'+∞':'−∞')+'.';
        if(e.schief) grund+=' Die Polynomdivision ergibt '+lmGerade(e.schief)+' plus einen Rest, der für große |x| gegen 0 geht – das ist die <b>schiefe Asymptote</b>.'; }
      e.termHtml=mitOrig(gebrochen?lmBruchHtml(lmPolyHtml(z,null),lmPolyHtml(nn,null)):lmPolyHtml(z,null),
        gebrochen?lmTermVgl(lmPolyHtml(z,null),lmPolyHtml(nn,null)):lmTermVgl(lmPolyHtml(z,null)));
      if(e.vergleich&&!e.vergleich.termHtml) e.vergleich.termHtml=mitOrig(
        gebrochen?lmBruchHtml(lmPolyHtml(z,gz),lmPolyHtml(nn,gn)):lmPolyHtml(z,gz),
        gebrochen?lmTermVgl(lmPolyHtml(z,null),lmPolyHtml(nn,null)):lmTermVgl(lmPolyHtml(z,null)));
      /* über dem Zähler und unter dem Nenner steht, wohin der jeweilige Teil geht;
         unterstrichen, wer das Ergebnis bestimmt (der höhere Grad) */
      const polLim=pp=>{ const gg=pGrad(pp);
        if(gg===0) return {txt:zahl(pp[0]), vz:pp[0]>0?1:(pp[0]<0?-1:0)};
        const vv=pp[gg]*Math.pow(s,gg); return {txt:vv>0?'+∞':'−∞', vz:vv>0?1:-1}; };
      const aZ=polLim(z), aN=polLim(nn);
      const tHtml=mitOrig(gebrochen
          ? lmBruchHtml(lmAnnHtml(lmPolyHtml(z,gz),aZ.txt,aZ.vz,gz>gn,false),
                        lmAnnHtml(lmPolyHtml(nn,gn),aN.txt,aN.vz,gn>gz,true))
          : lmPolyHtml(z,gz),
        gebrochen?lmTermVgl(lmPolyHtml(z,null),lmPolyHtml(nn,null)):lmTermVgl(lmPolyHtml(z,null)));
      e.karten.push({ziel, wert, grund, x:s*Infinity, seite:0, termHtml:tHtml,
        proben:lmProben(f,s*Infinity,0).filter((p,i)=>i%2===0).slice(0,4)}); });
    e.karten.sort((a,b)=>lmOrd(a)-lmOrd(b));
    e.kopf=lmKopf(e,gebrochen?'gebrochen-rationaler Term':'ganzrationaler Term',toks);
    return e;
  }

  /* ===== alle anderen Terme: Lücken suchen, Grenzwerte belegen ===== */
  e.art='sonst';
  e.termHtml='f(x) = '+origHtml;
  /* jede Karte bekommt den Term mit den Werten der Teile an ihrer Stelle */
  const annKarte=k=>{ const h=lmTeileAnn(ast,k.x,k.seite||0,k.wert); if(h) k.termHtml='f(x) = '+h; return k; };
  let st=lmScan(f); e.mehr=!!st.mehr;
  /* Zwei Rand-Treffer dicht beieinander sind in Wirklichkeit eine Lücke mitten im Definitionsbereich
     (z. B. sin(x)/x bei 0): dann beide Seiten anschauen statt „Definitionsbereich endet". */
  const gruppen=[]; st.forEach(s=>{ const g=gruppen.find(q=>Math.abs(q.x-s.x)<1e-5&&q.art===s.art);
    if(g) g.seiten.push(s.seite); else gruppen.push({x:s.x,art:s.art,seiten:[s.seite]}); });
  st=[];
  gruppen.forEach(g=>{
    if(g.art==='rand'&&g.seiten.length>1){                      /* Lücke mit Werten auf beiden Seiten */
      const wl=lmAusProben(lmProben(f,g.x,-1)), wr=lmAusProben(lmProben(f,g.x,1));
      if(wl.art==='zahl'&&wr.art==='zahl'&&Math.abs(wl.v-wr.v)<1e-6*(1+Math.abs(wl.v))){
        e.loecher.push({x:g.x,y:wl.v});
        [-1,1].forEach(seite=>{ const pr=lmProben(f,g.x,seite);
          e.karten.push(annKarte({ziel:'x → '+lmKlam(lmX(g.x))+(seite<0?'⁻':'⁺'), wert:seite<0?wl:wr, x:g.x, seite, loch:true,
            grund:'An dieser Stelle ist der Term nicht definiert. '+(seite<0?'Von links':'Von rechts')+
              ' nähern sich die Werte '+zahl(seite<0?wl.v:wr.v)+' – von der anderen Seite ebenso. Weil beide Seiten '+
              'denselben Wert ergeben, ist die Lücke <b>hebbar</b>: der Graph hat dort nur ein <b>Loch</b>.',
            proben:pr.slice(1,4)})); });
        return; }
      [-1,1].forEach(seite=>{ const pr=lmProben(f,g.x,seite), wert=lmAusProben(pr);
        if(wert.art==='inf'||wert.art==='ninf') e.pole.push(g.x);
        e.karten.push(annKarte(randKarte(g.x,seite,wert,
          lmTeilText(ast,g.x,seite)+'An dieser Stelle ist der Term nicht definiert. '+(seite<0?'Links':'Rechts')+' davon zeigen die Werte, wohin es geht.',pr.slice(1,4)))); });
      return; }
    st.push({x:g.x,art:g.art,seite:g.seiten[0]}); });
  st.forEach(s=>{
    if(s.art==='pol'){ e.pole.push(s.x);
      [-1,1].forEach(seite=>{ const pr=lmProben(f,s.x,seite), wert=lmAusProben(pr);
        e.karten.push(annKarte(randKarte(s.x,seite,wert,
          lmTeilText(ast,s.x,seite)+'Dort ist der Term nicht definiert (Nenner 0). '+(seite<0?'Links':'Rechts')+' davon wachsen die Werte über alle Grenzen – das zeigen die Zahlen daneben.',
          pr.slice(1,4)))); }); }
    else { e.raender.push(s);
      const pr=lmProben(f,s.x,s.seite), wert=lmAusProben(pr);
      let grund=lmTeilText(ast,s.x,s.seite)+'Hier endet der Definitionsbereich: ';
      if(F.wurzel) grund+='unter der Wurzel darf nichts Negatives stehen. ';
      else if(F.ln) grund+='der ln ist nur für positive Werte erklärt. ';
      else grund+='weiter '+(s.seite>0?'links':'rechts')+' gibt es die Funktion nicht. ';
      grund+='Die Funktion gibt es nur '+(s.seite>0?'rechts':'links')+' von '+lmX(s.x)+'.';
      if(F.ln&&(wert.art==='ninf'||wert.art==='inf')) grund+=' ln(z) → −∞, wenn z von oben gegen 0 geht.';
      e.karten.push(annKarte(randKarte(s.x,s.seite,wert,grund,pr.slice(1,4)))); } });
  [-1,1].forEach(s=>{
    const ziel='x → '+(s<0?'−∞':'+∞'), pr=lmProben(f,s*Infinity,0);
    let wert=lmAusProben(pr);
    /* Sinus und Kosinus wechseln ständig das Vorzeichen – dann gibt es keinen Grenzwert,
       auch wenn einzelne eingesetzte Werte in dieselbe Richtung zeigen. */
    if(F.trig&&(wert.art==='inf'||wert.art==='ninf')){ let plus=0, minus=0;
      for(let i=0;i<40;i++){ const y=f(s*(990+i*0.25)); if(y>0) plus++; else if(y<0) minus++; }
      if(plus&&minus) wert={art:'kein'}; }
    let grund='';
    if(wert.art==='undef') grund='Für diese x gibt es die Funktion nicht – der Definitionsbereich endet vorher.';
    else { grund+=lmTeilText(ast,s*Infinity,0);
      if(F.exp){ const eNull=lmExpGegenNull(ast,s*Infinity,0);
        grund+= eNull==='mit' ? 'Die e-Funktion strebt hier selbst gegen 0 und fällt nicht ins Gewicht – den Ausschlag gibt der übrige Teil. '
              : eNull==='allein' ? 'Die e-Funktion strebt hier selbst gegen 0. '
              : 'Hier steckt eine e-Funktion: sie wächst schneller als jede Potenz von x und bestimmt deshalb das Verhalten. '; }
      if(F.ln) grund+='Der ln wächst langsamer als jede Potenz – aber immer weiter, eine Schranke hat er nicht. ';
      if(F.trig&&wert.art==='kein') grund+='Sinus und Kosinus schwanken immer wieder zwischen −1 und 1 – deshalb nähert sich der Wert keiner Zahl an. ';
      if(F.wurzel) grund+='Die Wurzel wächst langsamer als x, aber unbeschränkt. ';
      if(!grund) grund='Am Term allein ist das nicht sofort abzulesen – die Werte daneben zeigen, wohin es geht. ';
      if(wert.art==='zahl'&&isFinite(wert.v)){ grund+='Die Werte nähern sich '+zahl(wert.v)+' an: <b>waagrechte Asymptote</b> y = '+zahl(wert.v)+'.'; e.asym.push(wert.v); } }
    e.karten.push(annKarte({ziel, wert, grund, x:s*Infinity, seite:0, proben:pr.slice(0,4)})); });
  e.karten.sort((a,b)=>lmOrd(a)-lmOrd(b));
  e.kopf=lmKopf(e,'Term mit '+([F.exp?'e-Funktion':'',F.ln?'Logarithmus':'',F.wurzel?'Wurzel':'',F.trig?'Sinus/Kosinus':'',F.betrag?'Betrag':''].filter(Boolean).join(', ')||'Term'),toks);
  return e;
}
function lmOrd(k){ const x=k.x; if(x===-Infinity) return -1e9; if(x===Infinity) return 1e9; return x*10+(k.seite||0)*0.1; }
function lmKopf(e,art,toks){
  const pars=['a','b','c'].filter(p=>(toks||[]).some(t=>t.k==='id'&&t.v===p));
  const pt=pars.length?(' · gerechnet mit '+pars.map(p=>p+' = '+zahl(lm.p[p])).join('; ')+'; die Regler oben zeigen, wie sich das Verhalten ändert'):'';
  return lmKopf0(e,art)+pt; }
function lmKopf0(e,art){
  const l=lmEinfach(e.pole.concat(e.loecher.map(o=>o.x)));
  const rand=e.raender.map(r=>lmX(r.x));
  let t='<b>'+art+'</b>';
  if(l.length) t+=' · Definitionslücken bei x = '+l.map(lmX).join('; ');
  else if(!rand.length) t+=' · keine Definitionslücken';
  if(rand.length) t+=' · Rand des Definitionsbereichs bei x = '+rand.join('; ');
  if(e.mehr) t+=' (weiter außen gibt es noch mehr davon)';
  return t+'. Unten steht zu jedem Rand, wie man den Grenzwert am Term sieht.'; }

/* ---- Spalte mit den Karten ---- */
/* „für große |x|: f(x) ≈ 2x²/x = 2x“ – eine eigene Zeile unter dem Term */
function lmVglZeile(){ const d=$('lmVgl'); if(!d) return;
  const v=lmErg&&lmErg.vergleich;
  if(!v||!lm.gross){ d.hidden=true; d.innerHTML=''; return; }
  d.hidden=false;
  /* Steht unten derselbe Term wie oben hinter dem ≈, reicht der Satz allein */
  d.innerHTML='<i>für große |x| zählen nur die größten Potenzen'+(v.gleich?'.</i>':':</i> '+v.quot); }
/* ---- Kehrwertfunktion 1/f ----
   Angezeigt wird der Term: ein Bruch wird dazu umgedreht (aus z/n wird n/z), sonst steht
   die 1 über dem ganzen Term. Didaktisch wichtig ist der Tausch: wo f eine Nullstelle hat,
   hat 1/f eine Polstelle – und wo f eine Polstelle hat, hat 1/f eine Nullstelle. Betrachtet wird
   dabei immer der maximale Definitionsbereich des neuen Terms: aus 1/(x−2) wird x − 2, und das
   ist bei x = 2 schlicht 0. */
/* steht unten eine 1, reicht der Zähler allein: aus 1/x wird x, nicht x/1 */
const lmKehrBruch=(zh,nh)=>(ohneTags(nh)==='1'?String(zh):lmBruchHtml(zh,nh));
function lmKehrHtml(e){
  /* ganz- und gebrochen-rational: Zähler und Nenner tauschen, geschrieben wie im Term oben */
  if(e&&e.rz){ const un=lmPolyHtml(e.rz,null),
    ob=(pGrad(e.rn)>0||Math.abs(e.rn[0]-1)>1e-12)?lmPolyHtml(e.rn,null):'1';
    return lmKehrBruch(ob,un); }
  const ast=e&&e.ast;
  if(ast&&ast.k==='/'){ const zt=lmAstHtml(ast.l), nt=lmAstHtml(ast.r);
    if(zt&&nt) return lmKehrBruch(nt,zt); }
  return lmKehrBruch('1', (e&&e.origHtml)||'f(x)'); }
function lmKehrZeile(){ const d=$('lmKehrZ'); if(!d) return;
  const e=lmErg;
  if(!lm.kehr||!e||!e.ok){ d.hidden=true; d.innerHTML=''; return; }
  d.hidden=false;
  d.innerHTML=lmBruchHtml('1','f(x)')+' = '+lmKehrHtml(e)+
    ' <i>· Nullstellen von f werden zu Polstellen'+
    (e.pole.length?', Polstellen zu Nullstellen':'')+'</i>'; }
function lmKehrUI(){ const b=$('lmKehr'); if(b) b.classList.toggle('on',!!lm.kehr); }
function lmText(){ const o=$('lmOut'), gr=$('lmTermGross'); if(!o) return; const e=lmErg;
  lmGrossUI(); lmVglZeile(); lmKehrZeile();   /* erst hier steht lmErg zum neuen Term */
  if(!e||!e.ok){ o.innerHTML='<div class="lmHead">'+((e&&e.hinweis)||'')+'</div>'; if(gr) gr.innerHTML=''; return; }
  const k=e.karten[lmSel];
  /* Im großen Term steht hervorgehoben, worauf es beim gewählten Rand ankommt */
  if(gr){ let th=(k&&k.termHtml)||e.termHtml||'';
    /* „|x| groß“ hängt den gekürzten Vergleichsterm gleich an den Term an: … ≈ 2x –
       und setzt die kleineren Potenzen blass, solange kein Rand gewählt ist (der bringt
       seine eigene Hervorhebung mit). */
    if(lm.gross&&e.vergleich){
      if(!k&&e.vergleich.termHtml) th=e.vergleich.termHtml;
      th+=' <span class="lmVglAn">≈ '+e.vergleich.kurz+'</span>'; }
    gr.innerHTML=th; gr.classList.toggle('mitAnn', th.indexOf('lmAnn')>=0);
    /* lange Ketten kleiner setzen, damit sie ganz hineinpassen */
    gr.style.fontSize='';
    for(let i=0;i<5&&gr.clientWidth>40&&gr.scrollWidth>gr.clientWidth+2;i++){
      const b0=parseFloat(getComputedStyle(gr).fontSize)||21;
      const neu=Math.max(10,b0*gr.clientWidth/(gr.scrollWidth+8));
      if(neu>=b0-0.2) break;
      gr.style.fontSize=neu.toFixed(1)+'px'; } }
  let h='<div class="lmHead">'+e.kopf+'</div>'+
        '<div class="lmHinw">Rand antippen – dann steht hier der Grenzwert, und Term und Graph zeigen, woran man ihn sieht.</div>';
  e.karten.forEach((q,i)=>{ const an=i===lmSel;
    h+='<div class="lmRand'+(an?' on':'')+'" data-i="'+i+'">'+
       '<div class="lmRK"><span class="lmLim"><i>lim</i><em>'+q.ziel+'</em></span><span class="lmZ">f(x)</span>'+
         (an?('<span class="lmW" style="color:'+lmWCol(q.wert)+'"> = '+lmWert(q.wert)+'</span>')
            :'<span class="lmFrage">?</span>')+'</div>'+
       (an?('<div class="lmG">'+q.grund+'</div>'+
            ((q.proben&&q.proben.length)?('<div class="lmB">'+q.proben.filter(p=>isFinite(p[1])).map(p=>lmProbeText(p)+' = '+zahl(p[1])).join(' · ')+'</div>'):'')):'')+
       '</div>'; });
  o.innerHTML=h;
  o.querySelectorAll('.lmRand').forEach(el=>{ el.onclick=()=>{ const i=+el.dataset.i;
    const zu=(lmSel===i); lmSel=zu?-1:i; lmText();
    if(zu) lmFit(); else lmBlick(e.karten[i]);                  /* passender Blick zum Rand */
    sync(); }; }); }

/* ---- Zeichnen ---- */
let lmWarte=0;
function lmResize(){ const el=$('plotL'); if(!el) return; const r=el.getBoundingClientRect();
  /* Direkt nach dem Umschalten steht die Höhe noch nicht fest – dann einen Bildschirmtakt warten */
  if(r.height<20&&tab==='l'&&lmWarte<12){ lmWarte++; requestAnimationFrame(()=>{ lmResize(); lmFit(); }); return; }
  lmWarte=0;
  lmW=Math.max(10,Math.round(r.width)); lmH=Math.max(10,Math.round(r.height));
  el.width=Math.round(lmW*dpr); el.height=Math.round(lmH*dpr);
  if(!lmView.ox&&!lmView.oy) lmFit(); else lmDraw(); }
/* x-Bereich vorgeben, y-Bereich aus Stichproben dazu – x und y haben eigene Maßstäbe,
   sonst wäre beim Blick ins Unendliche in y nichts mehr zu erkennen. */
function lmBereich(x0,x1){ if(!lmW) return; const e=lmErg, f=e&&e.f;
  const ys=[];
  for(let i=0;i<=400;i++){ const y=f?f(x0+(x1-x0)*i/400):NaN; if(isFinite(y)) ys.push(y); }
  ys.sort((a,b)=>a-b);
  let lo=-5, hi=5;
  if(ys.length>10){ lo=Math.min(lo,ys[Math.floor(ys.length*0.08)]); hi=Math.max(hi,ys[Math.floor(ys.length*0.92)]); }
  /* Schießt die Funktion davon (x³, x·e^(−x) …), bleibt der y-Ausschnitt in vernünftigen Grenzen */
  const grenze=4*(x1-x0);
  if(hi-lo>grenze){ const m=ys.length?ys[Math.floor(ys.length/2)]:0; lo=m-grenze/2; hi=m+grenze/2; }
  if(e) lmEinfach(e.asym).forEach(a=>{ lo=Math.min(lo,a-1.5); hi=Math.max(hi,a+1.5); });
  if(hi-lo<2){ const m=(hi+lo)/2; lo=m-1; hi=m+1; }
  lmView.ux=Math.max(0.05,lmW/(x1-x0)); lmView.uy=Math.max(0.05,lmH*0.86/(hi-lo));
  lmView.ox=lmW/2-((x0+x1)/2)*lmView.ux;
  lmView.oy=lmH/2+((lo+hi)/2)*lmView.uy;
  lmDraw(); }
function lmFit(){ if(!lmW) return; const e=lmErg;
  let x0=-8, x1=8;
  const xs=e?e.pole.concat(e.loecher.map(o=>o.x), e.raender.map(r=>r.x)):[];
  if(xs.length){ x0=Math.min(x0,Math.min.apply(null,xs)-3); x1=Math.max(x1,Math.max.apply(null,xs)+3); }
  lmBereich(x0,x1); }
/* Blick passend zum angetippten Rand: ins Unendliche weit hinaus, an einer Lücke nah heran */
function lmBlick(k){ if(!lmW||!k){ return; }
  if(!isFinite(k.x)){
    /* Nur in x hinauszoomen: der y-Ausschnitt bleibt, sonst verliert man den Bezug.
       Läuft der Graph gegen eine Zahl, wird dieser Wert in die Mitte genommen. */
    const s=k.x>0?1:-1, x0=s>0?-12:-100, x1=s>0?100:12;
    const ymin=(lmView.oy-lmH)/lmView.uy, ymax=lmView.oy/lmView.uy;
    lmView.ux=Math.max(0.05,lmW/(x1-x0)); lmView.ox=-x0*lmView.ux;
    if(k.wert&&k.wert.art==='zahl'&&isFinite(k.wert.v)){
      const v=k.wert.v, rand=0.15*(ymax-ymin);
      if(v<ymin+rand||v>ymax-rand) lmView.oy=lmH/2+v*lmView.uy; }
    lmDraw(); return; }
  lmBereich(k.x-7, k.x+7); }
function lmKurve(c,f,col,w){ c.save(); c.strokeStyle=col; c.lineWidth=w; c.lineJoin='round'; c.beginPath();
  let prev=null;
  for(let px=0;px<=lmW;px++){ const x=(px-lmView.ox)/lmView.ux, y=f(x), py=lmView.oy-y*lmView.uy;
    if(!isFinite(py)){ prev=null; continue; }
    if(prev===null||Math.abs(py-prev)>lmH*2) c.moveTo(px,py); else c.lineTo(px,py);
    prev=py; }
  c.stroke(); c.restore(); }
function lmPfeil(c,x,y,dx,dy,col){ const l=Math.hypot(dx,dy)||1, ux=dx/l, uy=dy/l;
  c.save(); c.strokeStyle=col; c.fillStyle=col; c.lineWidth=2.4; c.lineCap='round';
  c.beginPath(); c.moveTo(x,y); c.lineTo(x+dx,y+dy); c.stroke();
  const sx=x+dx, sy=y+dy;
  c.beginPath(); c.moveTo(sx,sy); c.lineTo(sx-9*ux+5*uy, sy-9*uy-5*ux); c.lineTo(sx-9*ux-5*uy, sy-9*uy+5*ux); c.closePath(); c.fill();
  c.restore(); }
function lmDraw(){ if(tab!=='l'||!lmW) return; const e=lmErg;
  const c=$('plotL').getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,lmW,lmH); c.fillStyle='#fff'; c.fillRect(0,0,lmW,lmH);
  const ux=lmView.ux, uy=lmView.uy, ox=lmView.ox, oy=lmView.oy, X=x=>ox+x*ux, Y=y=>oy-y*uy;
  const xmin=(0-ox)/ux, xmax=(lmW-ox)/ux, ymin=(oy-lmH)/uy, ymax=oy/uy;
  const schritt=u=>{ const raw=44/u, p10=Math.pow(10,Math.floor(Math.log10(raw)));
    for(const m of [1,2,5,10]) if(p10*m>=raw) return p10*m; return p10*10; };
  const sx=schritt(ux), sy=schritt(uy);
  c.strokeStyle='#eef1f6'; c.lineWidth=1; c.beginPath();
  for(let x=Math.ceil(xmin/sx)*sx;x<=xmax;x+=sx){ c.moveTo(X(x),0); c.lineTo(X(x),lmH); }
  for(let y=Math.ceil(ymin/sy)*sy;y<=ymax;y+=sy){ c.moveTo(0,Y(y)); c.lineTo(lmW,Y(y)); }
  c.stroke();
  c.strokeStyle='#98a2b3'; c.lineWidth=1.6; c.beginPath();
  c.moveTo(0,Y(0)); c.lineTo(lmW,Y(0)); c.moveTo(X(0),0); c.lineTo(X(0),lmH); c.stroke();
  c.fillStyle='#667085'; c.font=(fontItalic?'italic ':'')+(fontBold?'bold ':'')+fontSize+'px sans-serif';
  c.textAlign='center'; c.textBaseline='top';
  for(let x=Math.ceil(xmin/sx)*sx;x<=xmax;x+=sx){ if(Math.abs(x)<1e-9) continue;
    c.fillText(fmt(x), X(x), Math.min(Math.max(Y(0)+3,2),lmH-fontSize-3)); }
  c.textAlign='right'; c.textBaseline='middle';
  for(let y=Math.ceil(ymin/sy)*sy;y<=ymax;y+=sy){ if(Math.abs(y)<1e-9) continue;
    c.fillText(fmt(y), Math.min(Math.max(X(0)-4,fontSize*2),lmW-2), Y(y)); }
  if(!e||!e.ok) return;
  /* Asymptoten – nur wenn eingeblendet */
  if(lm.asym){
  c.save(); c.setLineDash([7,5]); c.lineWidth=2; c.strokeStyle=LM_WAAG; c.fillStyle=LM_WAAG;
  c.font='700 '+Math.max(12,fontSize)+'px sans-serif'; c.textAlign='left'; c.textBaseline='bottom';
  lmEinfach(e.asym).forEach(a=>{ const py=Y(a); if(py<-20||py>lmH+20) return;
    c.beginPath(); c.moveTo(0,py); c.lineTo(lmW,py); c.stroke();
    c.fillText('y = '+zahl(a), 6, py-3); });
  c.restore();
  /* senkrechte Asymptoten (Polstellen) */
  c.save(); c.setLineDash([6,5]); c.lineWidth=2; c.strokeStyle=LM_SENK; c.fillStyle=LM_SENK;
  c.font='700 '+Math.max(12,fontSize)+'px sans-serif'; c.textAlign='center'; c.textBaseline='top';
  lmEinfach(e.pole).forEach(p=>{ const px=X(p); if(px<-20||px>lmW+20) return;
    c.beginPath(); c.moveTo(px,0); c.lineTo(px,lmH); c.stroke();
    c.setLineDash([]); c.fillText('x = '+lmX(p), px, 4); c.setLineDash([6,5]); });
  c.restore();
  if(e.schief){ const m=e.schief[1]||0, b0=e.schief[0]||0;
    c.save(); c.setLineDash([7,5]); c.lineWidth=2; c.strokeStyle=LM_WAAG; c.fillStyle=LM_WAAG;
    c.beginPath(); c.moveTo(0,Y(m*xmin+b0)); c.lineTo(lmW,Y(m*xmax+b0)); c.stroke();
    c.font='700 '+Math.max(12,fontSize)+'px sans-serif'; c.textAlign='right'; c.textBaseline='bottom';
    const yR=m*(xmax-1.2)+b0; c.fillText(lmGerade(e.schief), lmW-8, Math.max(14,Math.min(lmH-6,Y(yR)-4)));
    c.restore(); }
  }
  /* Vergleichsterm für große |x| – unter der Kurve, damit f oben liegt */
  if(lm.gross&&e.vergleich){ const v=e.vergleich;
    c.save(); c.setLineDash([9,6]); lmKurve(c,v.f,LM_VGL,2.4); c.restore();
    c.save(); c.fillStyle=LM_VGL; c.font='800 '+Math.max(12,fontSize)+'px sans-serif';
    c.textAlign='right'; c.textBaseline='top';
    const xl=xmin+(xmax-xmin)*0.88, yl=Y(v.f(xl));
    c.fillText('y ≈ '+v.txt, lmW-8, Math.max(4,Math.min(lmH-20,yl+7)));
    c.restore(); }
  /* Kehrwertfunktion – unter der Kurve, damit f oben liegt */
  if(lm.kehr){ const g=x=>1/e.f(x);
    /* Betrachtet wird der maximale Definitionsbereich von 1/f: an den Polstellen von f
       hat 1/f eine Nullstelle, dort wird also nichts ausgespart. */
    lmKurve(c,g,LM_KEHR,2.2);
    c.save(); c.fillStyle=LM_KEHR; c.font='800 '+Math.max(12,fontSize)+'px sans-serif';
    c.textAlign='left'; c.textBaseline='top';
    const xl=xmin+(xmax-xmin)*0.08, yk=g(xl), yl=isFinite(yk)?Y(yk):lmH*0.5;
    const ty=Math.max(4,Math.min(lmH-20,yl+7)), tx=8, txt='y = 1/f(x)';
    /* weißer Grund darunter – die Kurve liegt oft dicht an der x-Achse mit ihren Zahlen */
    c.save(); c.fillStyle='rgba(255,255,255,.88)';
    c.fillRect(tx-3,ty-2,c.measureText(txt).width+6,Math.max(12,fontSize)+5); c.restore();
    c.fillText(txt, tx, ty);
    c.restore(); }
  /* Kurve */
  lmKurve(c,e.f,e.farbe,2.6);
  /* hebbare Lücken als offener Kreis */
  e.loecher.forEach(o=>{ const px=X(o.x), py=Y(o.y); if(px<-10||px>lmW+10||py<-10||py>lmH+10) return;
    c.save(); c.fillStyle='#fff'; c.strokeStyle=e.farbe; c.lineWidth=2.4;
    c.beginPath(); c.arc(px,py,5.5,0,7); c.fill(); c.stroke(); c.restore(); });
  /* die gewählte Karte hervorheben */
  const k=e.karten[lmSel]; if(!k) return;
  c.save();
  if(!isFinite(k.x)){                                   /* Rand x → ±∞ */
    const rechts=k.x>0, px=rechts?lmW-14:14, dx=rechts?26:-26;
    const col=lmWCol(k.wert);
    c.fillStyle='rgba(37,99,235,.07)'; c.fillRect(rechts?lmW*0.72:0,0,lmW*0.28,lmH);
    let py=Y(0), dy=0;
    if(k.wert.art==='zahl'){ py=Y(k.wert.v); }
    else if(k.wert.art==='inf'){ py=lmH*0.3; dy=-30; }
    else if(k.wert.art==='ninf'){ py=lmH*0.7; dy=30; }
    lmPfeil(c,px-dx/2,py-dy/2,dx*0.9,dy,col);
    c.fillStyle=col; c.font='800 '+Math.max(12,fontSize)+'px sans-serif';
    c.textAlign=rechts?'right':'left'; c.textBaseline=dy>0?'bottom':'top';
    c.fillText(lmWText(k.wert), rechts?lmW-8:8, dy>0?py-18:py+18);
  } else {                                              /* Stelle im Endlichen */
    const px=X(k.x);
    c.fillStyle='rgba(37,99,235,.10)';
    c.fillRect(k.seite<0?px-70:px, 0, 70, lmH);
    c.strokeStyle='#2563eb'; c.lineWidth=2.6; c.setLineDash([2,4]);
    c.beginPath(); c.moveTo(px,0); c.lineTo(px,lmH); c.stroke(); c.setLineDash([]);
    const s=k.seite||1;
    [0.9,0.45,0.22,0.1].forEach(d=>{ const x=k.x+s*d, y=e.f(x); if(!isFinite(y)) return;
      const qx=X(x), qy=Y(y); if(qy<-50||qy>lmH+50) return;
      c.fillStyle='#2563eb'; c.beginPath(); c.arc(qx,qy,4,0,7); c.fill(); });
    if(k.wert&&(k.wert.art==='inf'||k.wert.art==='ninf')){
      const auf=k.wert.art==='inf';
      lmPfeil(c, px+s*16, lmH*0.5, 0, auf?-44:44, lmWCol(k.wert)); }
    c.fillStyle='#2563eb'; c.font='800 '+Math.max(12,fontSize)+'px sans-serif';
    c.textAlign=s<0?'right':'left'; c.textBaseline='bottom';
    c.fillText(k.ziel+':  '+lmWText(k.wert), px+s*10, lmH-8);
  }
  c.restore(); }
