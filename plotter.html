<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Funktionsplotter</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;touch-action:none;}
  #app{display:flex;flex-direction:column;height:100%;}
  #top{flex:none;padding:6px 8px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid #e6eaf0;}
  .frow{display:flex;gap:6px;align-items:center;}
  .func{gap:6px;}
  .fcol{width:calc(var(--k) * 16px);height:calc(var(--k) * 16px);border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #cfd6e0;cursor:pointer;}
  .fcol:active{box-shadow:0 0 0 2px #2563eb;}
  /* Farbwähler zum Punkt vor der Funktion */
  #colPop{position:fixed;z-index:60;display:none;grid-template-columns:repeat(5,30px);gap:8px;
    background:#fff;border:1px solid #cfd6e0;border-radius:13px;box-shadow:0 8px 28px rgba(15,23,42,.24);padding:9px;}
  #colPop.show{display:grid;}
  #colPop button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cfd6e0;cursor:pointer;padding:0;}
  #colPop button.on{box-shadow:0 0 0 2px #2563eb;}
  #colPop input[type=color]{width:30px;height:30px;padding:0;border:1px solid #cfd6e0;border-radius:50%;background:none;cursor:pointer;}
  :root{--k:1;}
  body.fb .fterm,body.fb .fname{font-weight:800;} body.fi .fterm{font-style:italic;}
  .fname{font-size:calc(var(--k) * 14px);white-space:nowrap;font-weight:700;}
  .fterm{flex:1;min-width:0;padding:calc(var(--k) * 7px) 8px;border:1px solid #cfd6e0;border-radius:8px;font-size:calc(var(--k) * 15px);font-family:inherit;-webkit-user-select:text;user-select:text;}
  .func.active .fterm{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.18);}
  .fdel{border:none;background:#eef1f5;color:#8a93a2;width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;flex:none;}
  .fhide{border:none;background:#eef1f5;width:30px;height:30px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;flex:none;filter:grayscale(1);opacity:.6;}
  .fhide.on{background:#dbeafe;filter:none;opacity:1;}
  /* zweiter Schalter je Funktion im Reiter Graph: blendet den Graphen aus (der Term bleibt) */
  .fgraph{border:none;background:#eef1f5;color:#8a93a2;width:30px;height:30px;border-radius:8px;
    font-size:calc(var(--k) * 18px);line-height:1;cursor:pointer;flex:none;font-family:inherit;}
  .fgraph.on{background:#dbeafe;color:#2563eb;}
  /* „Ins Koordinatensystem": Punkte aus Tabelle bzw. Maschine im Reiter Graph zeigen */
  .fkosy{border:1px solid #cfd6e0;background:#fff;color:#1f2430;border-radius:8px;
    padding:calc(var(--k) * 5px) calc(var(--k) * 9px);font-size:calc(var(--k) * 12px);font-weight:600;
    font-family:inherit;cursor:pointer;flex:none;white-space:nowrap;}
  .fkosy.on{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;}
  .fkosyX{border:1px solid #cfd6e0;background:#fff;color:#8a93a2;border-radius:8px;width:calc(var(--k) * 26px);
    height:calc(var(--k) * 26px);font-size:calc(var(--k) * 15px);line-height:1;cursor:pointer;flex:none;font-family:inherit;}
  /* x-Pille und y-Pille bleiben über der Maschine mittig; was daneben steht (Schieberegler,
     Knöpfe) sitzt rechts davon. Die leere erste Spalte ist genauso breit wie die dritte,
     deshalb bleibt die mittlere Spalte wirklich in der Mitte. */
  .mxrow,.mfuss{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;}
  .mxrow>.mein{grid-column:2;}
  .mxrow{column-gap:calc(var(--k) * 10px);}   /* gleicher Abstand links und rechts, sonst
                                                  rutscht die x-Pille aus der Mitte */
  .mxrow>.mxs{grid-column:3;justify-self:start;width:100%;min-width:0;
    max-width:calc(var(--k) * 130px);touch-action:none;}
  .mfuss>.maus{grid-column:2;}
  .mfuss>.mkn{grid-column:3;justify-self:start;display:flex;align-items:center;
    gap:calc(var(--k) * 6px);padding-left:calc(var(--k) * 8px);}
  .verdeckt{flex:1;min-width:0;padding:calc(var(--k) * 7px) 8px;border:1px dashed #cfd6e0;border-radius:8px;
    font-size:calc(var(--k) * 15px);color:#94a3b8;letter-spacing:4px;background:#f8fafc;white-space:nowrap;overflow:hidden;}
  #fbtns{gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  #fbtns>*{flex:0 0 auto;}
  #fbtns::-webkit-scrollbar{height:4px;} #fbtns::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  #add{border:none;border-radius:8px;background:#e7ebf1;padding:7px 12px;font-size:14px;cursor:pointer;font-weight:700;color:#2563eb;}
  #fit{border:none;border-radius:8px;background:#e7ebf1;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .fsb{border:none;border-radius:8px;background:#e7ebf1;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:700;color:#1f2430;}
  .fsb.on{background:#2563eb;color:#fff;}
  /* ---- Tabs ---- */
  #tabs{display:flex;gap:10px;flex-wrap:wrap;}
  #tabs button{flex:1 1 auto;white-space:nowrap;border:1px solid #cfd6e0;background:#f4f6fa;border-radius:10px;padding:calc(var(--k) * 6px) 6px;font-weight:700;font-size:calc(var(--k) * 13px);font-family:inherit;color:#53617a;cursor:pointer;}
  #tabs button.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  /* Graph, Tabelle und Maschine gehören zusammen (eine Funktion) – Transformationen steht für sich */
  #tabs .tgrp{display:flex;flex:3 1 220px;border:1px solid #cfd6e0;border-radius:10px;overflow:hidden;background:#f4f6fa;}
  #tabs .tgrp button{flex:1 1 0;border:none;border-right:1px solid #cfd6e0;border-radius:0;background:transparent;}
  #tabs .tgrp button:last-child{border-right:none;}
  #tabs .tgrp button.on{background:#2563eb;}
  #tabR{flex:1 1 150px;} #tabD{flex:1 1 110px;} #tabL{flex:0 1 70px;} #tabU{flex:0 1 70px;}
  #tabU sup{font-size:.7em;}
  body:not(.t-g) #funcs,body:not(.t-g) #add,body:not(.t-g) #fit,body:not(.t-g) #btnX,body:not(.t-g) #btnY{display:none;}
  body.kp-open #app{height:calc(100% - var(--kph,230px));}
  #keypad{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#eef1f6;border-top:1px solid #cfd6e0;padding:6px;display:none;flex-direction:column;gap:5px;touch-action:manipulation;}
  #keypad.show{display:flex;}
  #keypad .kp-row{display:flex;gap:5px;}
  #keypad .kp-row.chips{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #keypad button{flex:1 1 0;min-width:0;height:42px;border:1px solid #cfd6e0;background:#fff;border-radius:9px;font-size:18px;font-weight:600;font-family:inherit;color:#1f2430;cursor:pointer;padding:0;}
  #keypad button:active{background:#dbe4f0;}
  #keypad button.fn{flex:0 0 auto;height:36px;padding:0 12px;font-size:15px;font-weight:700;color:#2563eb;}
  #keypad button.op{background:#f4f6fa;}
  #keypad button.act{background:#3b82f6;border-color:#3b82f6;color:#fff;flex:1.6 1 0;}
  #keypad button.del{background:#fee2e2;border-color:#fca5a5;}
  #sliders{display:flex;flex-direction:column;gap:2px;}
  .sl{display:flex;align-items:center;gap:8px;font-size:calc(var(--k) * 13px);}
  .sl label{width:calc(var(--k) * 46px);font-weight:700;color:#2563eb;}
  .sl input[type=range]{flex:1;}
  .sl .v{width:calc(var(--k) * 46px);text-align:right;font-variant-numeric:tabular-nums;}
  #wrap{flex:1;position:relative;min-height:0;}
  .panel{position:absolute;inset:0;display:none;}
  .panel.on{display:block;}
  #pG{overflow:hidden;}
  #pT,#pM{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px;}
  /* Reiter „Transformationen": Bedienteil oben, Zeichenfläche darunter */
  #pR,#pL{display:none;flex-direction:column;overflow:hidden;}
  #pR.on,#pL.on{display:flex;}
  #trTop,#lmTop{flex:none;padding:6px 8px 4px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid #eef1f6;}
  .trRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .trRow[hidden]{display:none;}
  .trLbl{font:800 italic calc(var(--k) * 14px) inherit;color:#53617a;cursor:pointer;
         border:1px solid transparent;background:transparent;border-radius:8px;
         padding:calc(var(--k) * 4px) calc(var(--k) * 6px);white-space:nowrap;}
  .trLbl.on{color:#1d4ed8;background:#eaf1ff;border-color:#bcd2ff;}
  .trIn.on{border-color:#2563eb;box-shadow:0 0 0 2px #dbeafe;}
  .trIn{flex:1 1 120px;min-width:90px;border:1px solid #cfd6e0;border-radius:8px;padding:calc(var(--k) * 6px) 8px;
        font:600 calc(var(--k) * 14px) ui-monospace,Menlo,Consolas,monospace;color:#1f2430;background:#fff;}
  /* Die Liste macht der laengste Eintrag so breit - geschlossen steht dort nur
     „Beispiel …“, also wird sie gedeckelt; die aufgeklappte Liste bleibt voll lesbar. */
  #mdBsp{max-width:calc(var(--k) * 145px);}
  #trBsp,#mdBsp,#mdGrad,#mdWf,#mdWt{border:1px solid #cfd6e0;border-radius:8px;padding:calc(var(--k) * 5px) 6px;font:600 calc(var(--k) * 13px) inherit;background:#f4f6fa;color:#1f2430;}
  .trChk label{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:calc(var(--k) * 13px);color:#53617a;white-space:nowrap;}
  .trChk input{width:17px;height:17px;}
  .trSeg{border:1px solid #cfd6e0;background:#f4f6fa;border-radius:8px;padding:calc(var(--k) * 5px) 9px;
         font:700 calc(var(--k) * 12.5px) inherit;color:#53617a;cursor:pointer;white-space:nowrap;}
  .trSeg.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .trSeg[disabled]{opacity:.42;cursor:default;}
  /* Die Beispielliste sieht aus wie die Knöpfe daneben und bleibt schmal – die langen
     Termnamen stehen ja erst in der aufgeklappten Liste. */
  #lmBsp,#ukBsp{border:1px solid #cfd6e0;background:#f4f6fa;border-radius:8px;
    padding:calc(var(--k) * 4px) 6px;font:700 calc(var(--k) * 12.5px) inherit;color:#53617a;line-height:normal;
    cursor:pointer;width:calc(var(--k) * 96px);flex:0 0 auto;}
  .trWahl{gap:4px;}
  /* Die vier Parameter stehen immer untereinander – egal, wie breit das Werkzeug ist */
  #trSl{display:grid;grid-template-columns:1fr;gap:calc(var(--k) * 9px);
        margin-bottom:calc(var(--k) * 8px);}
  #trSl[hidden]{display:none;}
  /* Die beiden Ablaufregler stehen neben den Umschaltknöpfen */
  #trSl2{flex:1 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:2px 14px;}
  #trSl2 .ablauf{min-width:0;}
  #trSl2 .grp{font:700 calc(var(--k) * 11.5px) inherit;color:#64748b;line-height:1.2;}
  #trSl2[hidden]{display:none;}

  #trSl2 .sl .trPkt{width:calc(var(--k) * 12px);height:calc(var(--k) * 12px);border-radius:50%;flex:0 0 auto;}
  .trHin{font:600 calc(var(--k) * 12px) inherit;color:#64748b;}
  .trHin.ok{color:#16a34a;}
  #trSl .sl,#trSl2 .sl{display:flex;align-items:center;gap:6px;}
  #trSl .sl label,#trSl2 .sl label{font:800 calc(var(--k) * 13px) inherit;font-style:italic;width:calc(var(--k) * 20px);color:#1f2430;}
  #trSl .sl .trCol,#trSl2 .sl .trCol{width:calc(var(--k) * 16px);height:calc(var(--k) * 16px);border-radius:50%;border:2px solid #fff;
                   box-shadow:0 0 0 1px #cfd6e0;padding:0;cursor:pointer;flex:0 0 auto;}
  #trSl .sl input,#trSl2 .sl input{flex:1;min-width:60px;}
  #trSl .sl .v,#trSl2 .sl .v{font:700 calc(var(--k) * 13px) ui-monospace,Menlo,monospace;min-width:38px;text-align:right;color:#53617a;}
  #trSl2 .sl span.v{min-width:calc(var(--k) * 112px);white-space:nowrap;text-align:right;
                     font:600 calc(var(--k) * 11.5px) inherit;color:#53617a;}
  #trSl2 .sl label{width:auto;}
  #trSl2 .sl input{min-width:40px;}
  #trOut{font-size:calc(var(--k) * 13px);line-height:1.45;color:#1f2430;}
  #trOut .zg{color:#b45309;} #trOut .zf{color:#64748b;} #trOut .zv{color:#7c3aed;}
  #trOut b{font-weight:800;}
  /* Termkasten: deutlich groesser als der Erklaertext, Parameter in ihrer Farbe */
  #trOut .trBox{display:block;margin:0 0 calc(var(--k) * 4px);
                padding:calc(var(--k) * 5px) calc(var(--k) * 11px);border:1px solid #dbe2ec;
                border-radius:calc(var(--k) * 10px);background:#f7f9fc;max-width:100%;
                overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-x:contain;
                -webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  /* width:max-content – sonst bleibt die Zeile so breit wie der Kasten und laesst sich nicht schieben */
  #trOut .trT{font-size:calc(var(--k) * 17px);font-weight:800;line-height:1.35;white-space:nowrap;
              width:max-content;min-width:100%;}
  #trOut .trT2{margin-top:calc(var(--k) * 2px);}
  #trOut .trT i{font-style:italic;}
  /* Graph links, Terme und Wortbeschreibung rechts daneben */
  #trMain,#lmMain{flex:1;display:flex;gap:calc(var(--k) * 8px);min-height:0;padding:0 8px 8px;}
  #trPlotWrap,#lmPlotWrap{flex:1;position:relative;min-height:0;min-width:0;border:1px solid #e6ebf3;border-radius:12px;overflow:hidden;}
  #lmSide{flex:0 0 clamp(230px, 38%, 400px);min-height:0;overflow:auto;background:#fff;}
  @media (max-width:720px){ #lmMain{flex-direction:column;} #lmSide{flex:0 1 auto;max-height:48%;} }
  /* links der Term groß und darunter der Graph */
  #lmLinks{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:calc(var(--k) * 4px);}
  #lmTermGross{flex:none;text-align:center;font-size:calc(var(--k) * 21px);color:#1f2430;line-height:1.25;
    padding:calc(var(--k) * 2px) 4px;min-height:1.5em;overflow:hidden;white-space:nowrap;}
  /* Platz für die schwebenden Werte über und unter den Teiltermen */
  #lmTermGross.mitAnn{padding-top:1.15em;padding-bottom:1.15em;}
  /* Vergleichsterm für große |x| – eigene Zeile unter dem Term, damit der Term groß bleibt */
  #lmVgl{margin-top:4px;text-align:center;font-size:calc(var(--k) * 15px);color:#0f766e;}
  .lmVglAn{color:#0f766e;font-weight:800;white-space:nowrap;}
  #lmVgl b{font-weight:800;}
  #lmVgl i{font-style:normal;color:#64748b;font-size:.85em;}
  #lmVgl[hidden]{display:none;}
  /* ein Knopf mehr in der Leiste – dafür darf das Eingabefeld kürzer werden */
  #lmTop .trIn{flex:1 1 90px;min-width:70px;}
  /* Kehrwertfunktion – eigene Zeile unter dem Term, in der Farbe ihres Graphen */
  #lmKehrZ{margin-top:4px;text-align:center;font-size:calc(var(--k) * 15px);color:#be185d;}
  #lmKehrZ b{font-weight:800;}
  #lmKehrZ i{font-style:normal;color:#64748b;font-size:.85em;}
  #lmKehrZ[hidden]{display:none;}
  /* rechts die Ränder: antippen öffnet das Ergebnis */
  .lmRand{border:1px solid #e6ebf3;border-left-width:5px;border-left-color:#cbd5e1;border-radius:10px;
       padding:calc(var(--k) * 6px) calc(var(--k) * 8px);margin-bottom:calc(var(--k) * 6px);cursor:pointer;background:#fff;}
  .lmRand.on{background:#f3f7ff;border-color:#2563eb;}
  /* f(x) und das Ergebnis stehen auf der Grundlinie von „lim" – nicht mittig zur ganzen
     Spalte aus lim und x → …, sonst rutschen sie tiefer als das lim */
  .lmRK{display:flex;align-items:baseline;gap:3px;}
  .lmRand .lmZ{font-size:calc(var(--k) * 14px);font-weight:800;color:#1f2430;}
  .lmRand .lmW{font-size:calc(var(--k) * 15px);font-weight:800;margin-left:4px;}
  .lmFrage{margin-left:auto;color:#94a3b8;font-weight:800;font-size:calc(var(--k) * 15px);}
  /* lim mit dem Pfeil darunter, wie im Heft */
  .lmLim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin-right:3px;}
  .lmLim i{font-style:normal;font-weight:800;font-size:calc(var(--k) * 14px);}
  .lmLim em{font-style:normal;font-size:calc(var(--k) * 10px);color:#475569;margin-top:1px;}
  /* Term mit Hervorhebung: worauf es ankommt, steht kräftig da, der Rest blass */
  .lmT{margin-top:5px;font-size:calc(var(--k) * 14px);color:#475569;line-height:1.15;}
  .lmFuer{font-size:.62em;color:#64748b;white-space:nowrap;}
  .lmStark{font-weight:800;color:#1f2430;}
  .lmBlass{opacity:.36;}
  /* Vorzeichen-Marker: grün = positiv, rot = negativ (steht nach .lmStark, damit die Farbe gewinnt) */
  .lmPlus,.lmMinus{border-radius:5px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .lmPlus{background:#d7f5e0;color:#14532d;}
  .lmMinus{background:#ffdede;color:#7f1d1d;}
  /* Wert, den ein Teilterm an der Stelle annimmt – über dem Zähler, unter dem Nenner */
  /* Der Wert schwebt über bzw. unter dem Teilterm, ohne die Zeile höher zu machen –
     sonst rutscht ein Produkt wie x · e^(−x) gegenüber dem „f(x) =" nach unten. */
  .lmAnn{position:relative;display:inline-block;}
  .lmAnn>.v{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:1px;
    font-size:.75em;font-weight:500;color:#334155;line-height:1.3;white-space:nowrap;}
  .lmAnn.unten>.v{bottom:auto;top:100%;margin-bottom:0;margin-top:1px;}
  .lmAnn>.v.vP{color:#15803d;}
  .lmAnn>.v.vM{color:#b91c1c;}
  .lmAnn>.v.vDom{font-weight:800;}
  .lmBr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;}
  .lmBr>span{padding:0 4px;}
  .lmBr>span+span{border-top:1.5px solid #94a3b8;}
  .lmRand .lmG{font-size:calc(var(--k) * 12.5px);color:#475569;margin-top:4px;line-height:1.35;}
  .lmRand .lmG sup,#lmTermGross sup{font-size:.68em;line-height:0;}
  .lmRand .lmB{font-size:calc(var(--k) * 11.5px);color:#8a93a2;margin-top:3px;font-variant-numeric:tabular-nums;}
  .lmHead{font-size:calc(var(--k) * 12px);color:#64748b;margin:0 0 6px;line-height:1.35;}
  .lmHead b{color:#1f2430;}
  #trSide{flex:0 0 clamp(200px, 32%, 340px);min-height:0;overflow:auto;background:#fff;
          border:1px solid #e6ebf3;border-radius:12px;padding:calc(var(--k) * 7px) calc(var(--k) * 10px);}
  #trMain > [hidden]{display:none;}
  #trPlotWrap[hidden] ~ #trSide{flex:1 1 auto;}   /* ohne Graph nimmt die Spalte die ganze Breite */
  @media (max-width:720px){ #trMain{flex-direction:column;}
    #trSide{flex:0 1 auto;max-height:45%;} }
  /* Wortbeschreibung: eigene Ueberschrift, je Schritt eine Zeile in der Farbe des Parameters */
  #mdSide .wTitel,#trSide .wTitel{margin:calc(var(--k) * 8px) 0 calc(var(--k) * 3px);font-size:calc(var(--k) * 11px);
                 font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#64748b;}
  #trSide .wTitel:first-child,#mdSide .wTitel:first-child,#trOut .wTitel:first-child{margin-top:0;}
  #trSlTitel[hidden]{display:none;}
  #trOut .wList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--k) * 5px);}
  #trOut .wList li{background:#f7f9fc;border:1px solid #e6ebf3;border-left:4px solid #94a3b8;
                   border-radius:8px;padding:calc(var(--k) * 5px) calc(var(--k) * 8px);
                   font-size:calc(var(--k) * 13.5px);line-height:1.35;}
  #trOut .wList li .p{font-weight:800;}
  #trOut .wNote{margin-top:calc(var(--k) * 4px);color:#64748b;font-size:calc(var(--k) * 12px);}
  #trOut .wLeer{color:#64748b;}
  #plotR,#plotL{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  body.t-r #sliders,body.t-d #sliders{display:none;}
  /* Im Reiter lim stehen a, b und c nebeneinander und teilen sich die ganze Breite:
     im breiten Fenster werden die Regler länger, im schmalen schrumpfen sie bis auf etwa
     3,5 cm. Wird das Fenster noch schmaler, bekommt wieder jeder seine eigene Zeile –

let params={a:1,b:0,c:0};

const GCOL=['#2563eb','#e11d48','#16a34a','#f59e0b','#7c3aed','#db2777','#0891b2','#ea580c'];

const SUB='₀₁₂₃₄₅₆₇₈₉';
const sub=n=>String(n).split('').map(d=>SUB[+d]).join('');
const HOCH={'-':'⁻','−':'⁻','+':'','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const hoch=s=>String(s).split('').map(c=>HOCH[c]!==undefined?HOCH[c]:c).join('');
/* Zahlen deutsch ausgeben, sehr große/kleine als Zehnerpotenz */
function zahl(v){ if(v==null||typeof v!=='number'||!isFinite(v)) return '—';
  const r=Math.round(v*1e4)/1e4;
  if(Math.abs(r)>=1e7||(r!==0&&Math.abs(r)<1e-4)){ const p=v.toExponential(3).split('e');
    return p[0].replace('.',',').replace('-','−')+'·10'+hoch(p[1]); }
  return String(r).replace('.',',').replace('-','−'); }
/* deutsche Eingabe lesen: Komma und typografisches Minus erlaubt */
function pz(s){ const t=String(s==null?'':s).replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'');
  if(!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(t)) return NaN; return parseFloat(t); }

function resize(){ if(!cv.clientWidth||!cv.clientHeight) return;

/* ---- Term auswerten ---- */
/* Terme mit ';' sind abschnittsweise definiert und werden eigens gelesen. */
function tokenize(s){ const g=String(s==null?'':s);
  if(g.indexOf(';')<0) return tokenEinfach(g);
  const stk=stueckeLesen(g); return stk?[{k:'stk',v:stk}]:[{k:'?'}]; }
function tokenEinfach(s){ s=String(s).replace(/\|([^|]*)\|/g,'abs($1)');   /* |x| = Betrag */
  const t=[]; let i=0; while(i<s.length){ const c=s[i];
  if(c===' '){i++;continue;}
  if('+-*/^(),'.includes(c)){ t.push({k:c}); i++; continue; }
  if(c==='−'){ t.push({k:'-'}); i++; continue; }
  if(/[0-9.]/.test(c)){ let j=i; while(j<s.length&&/[0-9.]/.test(s[j]))j++; t.push({k:'num',v:parseFloat(s.slice(i,j))}); i=j; continue; }
  if(/[a-zA-Z]/.test(c)){ let j=i; while(j<s.length&&/[a-zA-Z0-9]/.test(s[j]))j++; const w=s.slice(i,j).toLowerCase();
    // zusammengeschriebene Namen zerlegen: „ax“ → a·x, „2xsin“ → 2·x·sin
    let k=0; while(k<w.length){ const nm=PNAMES.find(n=>w.startsWith(n,k)); if(!nm){ t.push({k:'id',v:w.slice(k)}); break; } t.push({k:'id',v:nm}); k+=nm.length; }
    i=j; continue; }
  t.push({k:'?'}); i++; }                                /* unbekanntes Zeichen: Term gilt als ungueltig */
  // implizite Multiplikation: 2x, 3(x+1), x sin(x), (x+1)(x−1), a x
  const out=[]; for(let q=0;q<t.length;q++){ out.push(t[q]); const A=t[q], B=t[q+1]; if(!B) continue;
    const aEnd=A.k==='num'||A.k===')'||(A.k==='id'&&!PFUNCS.includes(A.v)), bStart=B.k==='num'||B.k==='id'||B.k==='(';

const PNAMES=[...PFUNCS,'pi','x','a','b','c','e'];

   ohne die Schieberegler des Reiters Graph anzufassen) */
function evalAt(x, T, w){ const stk=stueckeVon(T); if(stk) return stueckWert(stk,x,w);
  const sc={x,a:params.a,b:params.b,c:params.c,pi:Math.PI,e:Math.E};
  if(w){ if(w.a!==undefined) sc.a=w.a; if(w.b!==undefined) sc.b=w.b; if(w.c!==undefined) sc.c=w.c; }
  let p=0;
  const peek=()=>T[p], next=()=>T[p++];
  function E(){ let v=Tm(); while(peek()&&(peek().k==='+'||peek().k==='-')){ const o=next().k, r=Tm(); v=o==='+'?v+r:v-r; } return v; }
  function Tm(){ let v=Un(); while(peek()&&(peek().k==='*'||peek().k==='/')){ const o=next().k, r=Un(); v=o==='*'?v*r:v/r; } return v; }
  function Un(){ if(peek()&&(peek().k==='+'||peek().k==='-')){ const o=next().k, v=Un(); return o==='-'?-v:v; } return Pw(); }
  function Pw(){ let v=Pr(); if(peek()&&peek().k==='^'){ next(); v=Math.pow(v,Un()); } return v; }   /* -x^2 = -(x^2), 2^-3 bleibt moeglich */
  function Pr(){ const tk=peek(); if(!tk)return NaN;
    if(tk.k==='num'){ next(); return tk.v; }
    if(tk.k==='('){ next(); const v=E(); if(peek()&&peek().k===')')next(); return v; }
    if(tk.k==='id'){ next(); const n=tk.v;
      if(peek()&&peek().k==='('){ next(); const a=E(); if(peek()&&peek().k===')')next();
        const f={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:x=>Math.log10(x),exp:Math.exp};
        return (f[n]||(()=>NaN))(a); }
      return (n in sc)?sc[n]:NaN; }
    next(); return NaN; }
  const r=E(); return (p<T.length)?NaN:r; }                /* Rest uebrig = Tippfehler: lieber nichts zeichnen */

/* ---- abschnittsweise definierte Funktionen ----
   Eingabe: Term und Bedingung abwechselnd, mit ';' getrennt, z. B.
   „x^2; x<=2; x+2; 2<x<=3; x^3; x>3“. Der letzte Abschnitt darf ohne Bedingung
   bleiben („sonst“). Trifft mehr als eine Bedingung zu, gewinnt der vordere Abschnitt.
   Die Grenzen bleiben als Terme gespeichert, damit „x<a“ dem Schieberegler folgt. */
function stueckeLesen(s){
  const teile=String(s).split(';').map(t=>t.trim()).filter(t=>t!=='');
  if(!teile.length) return null;
  const roh=[]; let offen=null;
  for(const t of teile){ const b=bedLesen(t);
    if(b){ if(offen&&offen.bed===null){ offen.bed=b; roh.push(offen); offen=null; }
           else { if(offen) roh.push(offen); offen={t:null,bed:b}; }
      continue; }
    if(offen&&offen.t===null){ offen.t=tokenEinfach(t); roh.push(offen); offen=null; continue; }
    if(offen) roh.push(offen);
    offen={t:tokenEinfach(t),bed:null}; }
  if(offen) roh.push(offen);
  const aus=[];
  for(const p of roh){ if(!p.t||!p.t.length) return null;
    const b=p.bed||{lo:null,loZu:false,hi:null,hiZu:false,sonst:true};
    aus.push({t:p.t, lo:b.lo, loZu:b.loZu, hi:b.hi, hiZu:b.hiZu, sonst:!!b.sonst}); }
  /* ohne Bedingung darf nur der letzte Abschnitt sein – sonst fehlt irgendwo eine */
  for(let i=0;i<aus.length-1;i++) if(aus[i].sonst) return null;
  return aus.length?aus:null; }
/* eine Bedingung lesen: „x<=2“, „2<x<=3“, „x>a“, „sonst“ – sonst null */
function bedLesen(s){ const t=String(s).replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/=</g,'<=').replace(/=>/g,'>=').trim();
  if(/^(sonst|rest|else|immer|übrige|uebrige)$/i.test(t)) return {lo:null,loZu:false,hi:null,hiZu:false,sonst:true};
  if(!/[<>]/.test(t)) return null;
  const ops=[], tl=[]; const re=/<=|>=|<|>/g; let m, last=0;
  while((m=re.exec(t))){ tl.push(t.slice(last,m.index)); ops.push(m[0]); last=m.index+m[0].length; }
  tl.push(t.slice(last));
  let lo=null, loZu=false, hi=null, hiZu=false;
  for(let i=0;i<ops.length;i++){ const L=tl[i].trim(), R=tl[i+1].trim(), op=ops[i], zu=op.length===2;
    const lx=/^x$/i.test(L), rx=/^x$/i.test(R); let art, w;
    if(lx&&!rx){ art=(op[0]==='<')?'hi':'lo'; w=R; }
    else if(rx&&!lx){ art=(op[0]==='<')?'lo':'hi'; w=L; }
    else return null;
    const G=tokenEinfach(w);
    if(!G.length||G.some(q=>q.k==='id'&&q.v==='x')||!isFinite(evalAt(0,G))) return null;
    if(art==='hi'){ if(hi===null){ hi=G; hiZu=zu; } else hiZu=hiZu&&zu; }
    else { if(lo===null){ lo=G; loZu=zu; } else loZu=loZu&&zu; } }
  if(lo===null&&hi===null) return null;
  return {lo,loZu,hi,hiZu,sonst:false}; }
function stueckeVon(T){ return (T&&T.length===1&&T[0].k==='stk')?T[0].v:null; }
function stueckGrenzen(p,w){ const f=(G,s)=>{ if(!G) return s; const v=evalAt(0,G,w); return isFinite(v)?v:s; };
  return {lo:f(p.lo,-Infinity), hi:f(p.hi,Infinity)}; }
function stueckGilt(p,x,w){ const g=stueckGrenzen(p,w);
  return (g.lo===-Infinity||(p.loZu?x>=g.lo:x>g.lo)) && (g.hi===Infinity||(p.hiZu?x<=g.hi:x<g.hi)); }
/* welcher Abschnitt gilt bei diesem x – der vorderste gewinnt */
function stueckAktiv(stk,x,w){ for(let i=0;i<stk.length;i++) if(stueckGilt(stk[i],x,w)) return i; return -1; }
function stueckWert(stk,x,w){ const i=stueckAktiv(stk,x,w); return i<0?NaN:evalAt(x,stk[i].t,w); }
function stueckBedText(p){ if(p.sonst||(!p.lo&&!p.hi)) return 'sonst';
  const l=p.lo?termText(p.lo,null,false):null, h=p.hi?termText(p.hi,null,false):null;
  if(l&&h) return l+(p.loZu?' ≤ ':' < ')+'x'+(p.hiZu?' ≤ ':' < ')+h;
  if(h) return 'x'+(p.hiZu?' ≤ ':' < ')+h;
  return 'x'+(p.loZu?' ≥ ':' > ')+l; }

/* ---- Term lesbar schreiben: a*x^2 → a·x², mit Einsetzen von x und den Parametern ---- */
const SYM={pi:'π',sqrt:'√'};
/* xvH: dieselbe Einsetzung, nur eingefaerbt – die Klammerfrage entscheidet immer xv (reiner Text) */
function termText(toks,xv,mitP,zus,xvH){
  const stk=stueckeVon(toks);
  if(stk){ if(xv!=null){ const xn=pz(xv), i=isFinite(xn)?stueckAktiv(stk,xn):-1;      /* ein Wert eingesetzt: nur der zuständige Abschnitt */
      return i<0?'nicht definiert':termText(stk[i].t,xv,mitP,zus,xvH); }
    return stk.map(p=>{ const b=stueckBedText(p); return termText(p.t,null,mitP)+(b==='sonst'?' sonst':' für '+b); }).join(';  '); }
  let s='';
  for(let i=0;i<toks.length;i++){ const t=toks[i];
    if(t.k==='num'){ s+=zahl(t.v); continue; }
    if(t.k==='id'){ if(t.v==='x'&&xv!=null){ const vor=i>0?toks[i-1].k:null, nach=toks[i+1]?toks[i+1].k:null;
        /* zusammengesetztes Argument klammern – ausser es steht schon allein in Klammern wie bei sin(x) */
        const noetig=(xv.charAt(0)==='−'&&vor!=='(')||(zus&&!(vor==='('&&nach===')'));
        const ein=xvH||xv;
        s+= noetig ? '('+ein+')' : ein; }
      else if(mitP&&(t.v==='a'||t.v==='b'||t.v==='c')) s+=klammer(params[t.v]);
      else s+=(SYM[t.v]||t.v);
      continue; }
    if(t.k==='*'){ s+='·'; continue; }
    if(t.k==='+'||t.k==='-'){ const pv=i>0?toks[i-1].k:null, bin=(pv==='num'||pv==='id'||pv===')');
      s+= bin ? (t.k==='+'?' + ':' − ') : (t.k==='-'?'−':''); continue; }
    if(t.k==='^'){ const n=toks[i+1];
      if(n&&n.k==='num'&&Number.isInteger(n.v)&&n.v>=0&&n.v<=9){ s+=hoch(n.v); i++; continue; }
      s+='^'; continue; }
    s+=t.k; }
  return s; }
const klammer=v=>(v<0?'(−'+zahl(-v)+')':zahl(v));

function maskeZeigen(root,f,i){ const inp=root.querySelector('.fterm'), vd=root.querySelector('.verdeckt'), b=root.querySelector('.fhide');
  if(!inp||!vd||!b) return; const h=!!f.hide;

  graphSchalter(root,f,i); }
/* Graph dieser Funktion aus-/einblenden – unabhängig davon, ob der Term verdeckt ist.
   So lässt sich der Graph erst punktweise aus der Wertetabelle aufbauen und dann darüberlegen. */

  const aus=!!f.gaus;
  g.classList.toggle('on',aus);       /* blau = das Ausblenden ist eingeschaltet, wie beim Auge daneben */

/* Schalter „Ins Koordinatensystem" an der Maschine: er zeigt den gerade eingestellten Punkt.
   Steht er schon im Koordinatensystem, nimmt ein zweites Antippen ihn wieder weg. */
function maschKosy(d,f){ const b=d.querySelector('.fkosy'), x=d.querySelector('.fkosyX'); if(!b) return;
  const xv=pz(f.mx), n=(f.pkt||[]).length;
  const drin=isFinite(xv)&&(f.pkt||[]).some(q=>Math.abs(q-xv)<1e-9);
  b.classList.toggle('on',drin);
  b.textContent='→ Graph'+(n?(' · '+n):'');
  b.title=drin?'Diesen Punkt wieder aus dem Koordinatensystem herausnehmen'
              :'Diesen Punkt in das Koordinatensystem im Reiter Graph einzeichnen – so entsteht der Graph Punkt für Punkt';

/* Der Schieberegler deckt den gerade sichtbaren x-Bereich ab – und den eingestellten Wert,
   falls der daneben liegt. So landet der Punkt, den „→ Graph“ einzeichnet, auch im Bild. */
function mxBereich(xv){ const a=(0-view.ox)/view.ux, b=(W-view.ox)/view.ux;
  let lo=Math.min(a,b), hi=Math.max(a,b);
  if(isFinite(xv)){ lo=Math.min(lo,xv); hi=Math.max(hi,xv); }
  const sp=(hi-lo)||1, st=sp>=200?1:(sp>=20?0.1:(sp>=2?0.01:0.001));
  const r=v=>Number(v.toFixed(6));
  return {min:r(Math.floor(lo/st)*st), max:r(Math.ceil(hi/st)*st), step:st}; }
function refreshMachine(d,i,nurWerte){ const f=funcs[i]; if(!f) return;
  const dot=d.querySelector('.fcol'), nm=d.querySelector('.fname'), inp=d.querySelector('.fterm'), mx=d.querySelector('.mxin');

  if(mx&&document.activeElement!==mx) mx.value=f.mx==null?'2':f.mx;
  const sl=d.querySelector('.mxs');
  if(sl&&document.activeElement!==sl){ const xv=pz(f.mx), b=mxBereich(xv);
    sl.min=b.min; sl.max=b.max; sl.step=b.step;
    if(isFinite(xv)) sl.value=xv; }
  maskeZeigen(d,f,i);
  const mt=d.querySelector('.mterm'); mt.style.color=f.hide?'#94a3b8':f.color;
  mt.style.letterSpacing=f.hide?'4px':'';
  mt.textContent=f.hide?'? ? ?':(f.toks.length?termText(f.toks,null,false):'…');
  const x=pz(f.mx), gut=isFinite(x)&&f.toks.length, y=gut?evalAt(x,f.toks):NaN;
  const weg=d.querySelector('.mweg');
  weg.textContent=(gut&&!f.hide) ? ('f'+sub(i+1)+'('+zahl(x)+') = '+termText(f.toks,zahl(x),true)) : '';
  const val=d.querySelector('.mval'); val.textContent=zahl(y); val.style.color=isFinite(y)?f.color:'#94a3b8';
  maschKosy(d,f); }

/* ---- Zeichnen ---- */
function fmt(n){ const r=Math.round(n*1000)/1000; return String(r); }
function gridStep(u){ const raw=44/(u||view.ux), p=Math.pow(10,Math.floor(Math.log10(raw))); for(const m of [1,2,5,10]){ if(p*m>=raw) return p*m; } return p*10; }
/* Zwei Finger: Wie sie zueinander stehen, so wird gezoomt - liegen sie waagerecht, aendert
   sich nur die x-Achse, stehen sie senkrecht, nur die y-Achse, schraeg beides gleich.
   Entschieden wird nach dem Winkel beim Aufsetzen, damit die Achse waehrend der Geste bleibt. */
function zoomF(a0,a1,b0,b1){
  const dx0=Math.abs(a0.x-a1.x), dy0=Math.abs(a0.y-a1.y);
  const dx1=Math.abs(b0.x-b1.x), dy1=Math.abs(b0.y-b1.y);
  const d0=Math.hypot(dx0,dy0)||1, d1=Math.hypot(dx1,dy1)||1, beide=d1/d0;
  const grad=Math.atan2(dy0,dx0)*180/Math.PI;
  if(grad<28) return [dx0>8?dx1/dx0:beide, 1];
  if(grad>62) return [1, dy0>8?dy1/dy0:beide];
  return [beide,beide]; }
function draw(){ if(!W||!H) return;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const ux=view.ux, uy=view.uy, ox=view.ox, oy=view.oy, sx=gridStep(ux), sy=gridStep(uy);
  const xmin=(0-ox)/ux, xmax=(W-ox)/ux, ymin=(oy-H)/uy, ymax=(oy-0)/uy;
  ctx.strokeStyle='#eef1f6'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=Math.ceil(xmin/sx)*sx; x<=xmax; x+=sx){ const px=ox+x*ux; ctx.moveTo(px,0); ctx.lineTo(px,H); }
  for(let y=Math.ceil(ymin/sy)*sy; y<=ymax; y+=sy){ const py=oy-y*uy; ctx.moveTo(0,py); ctx.lineTo(W,py); }
  ctx.stroke();
  ctx.strokeStyle='#98a2b3'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(W,oy); ctx.moveTo(ox,0); ctx.lineTo(ox,H); ctx.stroke();
  ctx.fillStyle='#667085'; ctx.font=(fontItalic?'italic ':'')+(fontBold?'bold ':'')+fontSize+'px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let x=Math.ceil(xmin/sx)*sx; x<=xmax; x+=sx){ if(Math.abs(x)<1e-9)continue; ctx.fillText(fmt(x), ox+x*ux, Math.min(Math.max(oy+3,2),H-fontSize-3)); }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let y=Math.ceil(ymin/sy)*sy; y<=ymax; y+=sy){ if(Math.abs(y)<1e-9)continue; ctx.fillText(fmt(y), Math.min(Math.max(ox-4,fontSize*2),W-2), oy-y*uy); }
  // Graphen
  let anyOk=false, anyTerm=false;
  funcs.forEach(f=>{ if(!f.toks.length||f.gaus) return;   /* ausgeblendeter Graph zaehlt auch nicht fuer die Fehlermeldung */
    anyTerm=true;
    ctx.strokeStyle=f.color; ctx.lineWidth=f.width||DEFW;
    const stk=stueckeVon(f.toks);
    if(stk){ if(stueckeMalen(f,stk,xmin,xmax)) anyOk=true; return; }
    ctx.beginPath(); let prev=null;
    for(let px=0;px<=W;px++){ const x=(px-ox)/ux; const y=evalAt(x,f.toks); const py=oy-y*uy;
      if(!isFinite(py)){ prev=null; continue; } anyOk=true;
      if(prev!==null && Math.abs(py-prev)>H*3){ ctx.moveTo(px,py); } else if(prev===null){ ctx.moveTo(px,py); } else { ctx.lineTo(px,py); } prev=py; }
    ctx.stroke(); });
  punkteZeigen();
  if(nullAn) nullstellenZeigen();
  if(y0An) y0Zeigen();
  achsenPunkte();
  $('err').textContent = (!anyTerm||anyOk)?'':'Term nicht auswertbar';
}
/* ---- abschnittsweise definierte Funktionen zeichnen ----
   Jeder Abschnitt wird nur dort gezeichnet, wo er auch gilt, und genau bis an seine
   Grenze (das Pixelraster trifft die Grenze sonst nur zufällig). */
function stueckeMalen(f,stk,xmin,xmax){ const ux=view.ux, uy=view.uy, ox=view.ox, oy=view.oy; let ok=false;
  stk.forEach((p,j)=>{ const g=stueckGrenzen(p);
    const xa=Math.max(g.lo,xmin), xb=Math.min(g.hi,xmax);
    if(!(xb>xa)) return;
    const n=Math.max(2,Math.min(4000,Math.ceil((xb-xa)*ux))), d=(xb-xa)/n, e=d*1e-4;
    ctx.beginPath(); let prev=null;
    for(let k=0;k<=n;k++){ const x=xa+d*k;
      const xq=k===0?x+e:(k===n?x-e:x);                            /* am Rand knapp hineinschauen */
      if(stueckAktiv(stk,xq)!==j){ prev=null; continue; }
      const y=evalAt(x,p.t), px=ox+x*ux, py=oy-y*uy;
      if(!isFinite(py)){ prev=null; continue; } ok=true;
      if(prev===null||Math.abs(py-prev)>H*3) ctx.moveTo(px,py); else ctx.lineTo(px,py); prev=py; }
    ctx.stroke(); });
  stueckePunkte(f,stk,xmin,xmax);
  return ok; }
/* Randpunkte: ausgefüllt = der Wert gehört dazu, offen = er gehört nicht dazu.
   Läuft der Graph an der Grenze ohne Sprung weiter, wird nichts gezeichnet. */
function stueckePunkte(f,stk,xmin,xmax){ const ux=view.ux, uy=view.uy, ox=view.ox, oy=view.oy;
  const stellen=new Map();
  stk.forEach((p,j)=>{ const g=stueckGrenzen(p);
    [[g.lo,p.loZu],[g.hi,p.hiZu]].forEach(gr=>{ const xb=gr[0];
      if(!isFinite(xb)||xb<xmin||xb>xmax) return;
      const y=evalAt(xb,p.t); if(!isFinite(y)) return;
      const key=xb.toFixed(9); if(!stellen.has(key)) stellen.set(key,{x:xb,liste:[]});
      stellen.get(key).liste.push({y:y, zu:gr[1]&&stueckAktiv(stk,xb)===j}); }); });
  stellen.forEach(st=>{ const grp=[];
    st.liste.forEach(q=>{ const g=grp.find(G=>Math.abs(G.y-q.y)*uy<0.6); if(g) g.zu=g.zu||q.zu; else grp.push({y:q.y,zu:q.zu}); });
    if(grp.length===1&&grp[0].zu&&st.liste.length>1) return;        /* nahtloser Übergang: kein Punkt nötig */
    grp.forEach(G=>{ const px=ox+st.x*ux, py=oy-G.y*uy;
      if(py<-20||py>H+20) return;
      ctx.save(); ctx.beginPath(); ctx.arc(px,py,5.5,0,7);
      if(G.zu){ ctx.fillStyle=f.color; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke(); }
      else { ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=2.6; ctx.strokeStyle=f.color; ctx.stroke(); }
      ctx.restore(); }); }); }

/* ---- Nullstellen am Graphen ----
   Gesucht wird im sichtbaren Bereich (dieselbe Suche wie für die Lösungen zum y-Punkt);
   an einer Polstelle wechselt das Vorzeichen ebenfalls, dort ist der Wert aber riesig – deshalb
   wird jede gefundene Stelle noch geprüft. */
function nullstellenZeigen(){ const u=view.ux, uy=view.uy, oy=view.oy, ox=view.ox;
  const tol=Math.max(1e-9, 2/Math.max(uy,1e-9));
  funcs.forEach(f=>{ if(!f.toks.length||f.hide) return; let n=0;
    loesungen(f.toks,0).forEach(x0=>{ const y=evalAt(x0,f.toks);
      if(!isFinite(y)||Math.abs(y)>tol) return;
      const px=ox+x0*u, py=oy;
      /* ausgefüllt – der offene Kreis bleibt den Nahtstellen abschnittsweiser Funktionen vorbehalten */
      ctx.save(); ctx.beginPath(); ctx.arc(px,py,5.5,0,7); ctx.fillStyle=f.color; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.restore();
      /* exakt, wo es geht (Wurzel(x^2-2) hat die Nullstellen +-Wurzel 2), sonst gerundet */
      beschrift('x = '+(lmExakt(x0)||lmPi(x0)||zahl(Math.round(x0*1000)/1000)), px, py+16+(n++%2)*15, f.color,'center'); }); }); }

/* ---- Punkte aus Tabelle und Maschine ----
   „Ins Koordinatensystem" zeichnet die Wertepaare hier ein; der Graph selbst kann dabei
   ausgeblendet sein, so entsteht er Punkt für Punkt. Die Punkte liegen über dem Graphen. */
function punkteX(f){ const aus=[];
  if(f.tpk) xs.forEach(v=>{ const x=pz(v); if(isFinite(x)) aus.push(x); });
  (f.pkt||[]).forEach(x=>{ if(isFinite(x)&&!aus.some(q=>Math.abs(q-x)<1e-9)) aus.push(x); });
  return aus; }
function punkteZeigen(){ const ux=view.ux, uy=view.uy, ox=view.ox, oy=view.oy;
  funcs.forEach(f=>{ if(!f.toks.length) return;
    punkteX(f).forEach(x=>{ const y=evalAt(x,f.toks); if(!isFinite(y)) return;
      const px=ox+x*ux, py=oy-y*uy;
      if(px<-20||px>W+20||py<-20||py>H+20) return;
      ctx.save(); ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fillStyle=f.color; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.restore(); }); }); }

/* ---- Schnittpunkt mit der y-Achse: f(0), falls es ihn gibt ---- */
function y0Zeigen(){ const uy=view.uy, ox=view.ox, oy=view.oy;
  if(ox<-20||ox>W+20) return;                       /* die y-Achse liegt gar nicht im Bild */
  let n=0;
  funcs.forEach(f=>{ if(!f.toks.length||f.hide) return;
    const y=evalAt(0,f.toks); if(!isFinite(y)) return;   /* an x = 0 nicht definiert: nichts zu zeigen */
    const py=oy-y*uy; if(py<-20||py>H+20) return;
    ctx.save(); ctx.beginPath(); ctx.arc(ox,py,5.5,0,7); ctx.fillStyle=f.color; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.restore();
    beschrift('y = '+zahl(Math.round(y*1000)/1000), ox+11, py-13-(n++%2)*15, f.color,'left'); }); }

/* ---- bewegliche Punkte auf x- und y-Achse ---- */
function beschrift(t,x,y,col,al){ ctx.save(); ctx.font='700 '+Math.max(11,fontSize+1)+'px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.textAlign=al||'left'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  ctx.lineWidth=3.5; ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.strokeText(t,x,y);
  ctx.fillStyle=col; ctx.fillText(t,x,y); ctx.restore(); }
function griff(px,py,col){ ctx.save(); ctx.beginPath(); ctx.arc(px,py,9,0,7); ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=2.6; ctx.strokeStyle=col; ctx.stroke();
  ctx.beginPath(); ctx.arc(px,py,3.2,0,7); ctx.fillStyle=col; ctx.fill(); ctx.restore(); }
/* x-Werte mit f(x) = yv im sichtbaren Bereich suchen */
function loesungen(T,yv){ const u=view.ux, x0=(0-view.ox)/u, x1=(W-view.ox)/u, N=720;
  const g=x=>evalAt(x,T)-yv, tol=0.8/view.uy, V=[], res=[];
  for(let i=0;i<=N;i++){ const x=x0+(x1-x0)*i/N; V.push({x,v:g(x)}); }
  for(let i=1;i<V.length&&res.length<16;i++){ const A=V[i-1], B=V[i];     /* Vorzeichenwechsel: genau einschachteln */
    if(!isFinite(A.v)||!isFinite(B.v)) continue;
    if(A.v===0&&B.v===0) continue;                                        /* waagrechtes Stueck: keine einzelne Loesung */
    if(A.v*B.v>0) continue;
    let a=A.x,b=B.x,fa=A.v;
    for(let k=0;k<60;k++){ const m=(a+b)/2, fm=g(m); if(!isFinite(fm)) break; if(fa*fm<=0) b=m; else { a=m; fa=fm; } }
    res.push((a+b)/2); }
  for(let i=1;i<V.length-1&&res.length<16;i++){ const A=V[i-1], B=V[i], C=V[i+1];   /* Beruehrpunkte ohne Vorzeichenwechsel (Scheitel) */
    if(!isFinite(A.v)||!isFinite(B.v)||!isFinite(C.v)) continue;
    if(Math.abs(B.v)>=tol||Math.abs(B.v)>Math.abs(A.v)||Math.abs(B.v)>Math.abs(C.v)) continue;
    if(Math.abs(B.v)>=Math.abs(A.v)&&Math.abs(B.v)>=Math.abs(C.v)) continue;        /* nichts faellt ab: waagrechter Verlauf */
    const h=(x1-x0)/N, den=C.v-2*B.v+A.v;                                            /* Scheitel der Parabel durch A,B,C: genauer als das Raster */
    let xv=B.x; if(den!==0){ const dx=-h/2*(C.v-A.v)/den; if(Math.abs(dx)<=h) xv=B.x+dx; }
    res.push(xv); }
  /* Rand des Definitionsbereichs: dort gibt es keinen Vorzeichenwechsel, trotzdem kann die
     Funktion genau dort 0 sein (√(x−3) bei x = 3). Die Grenze wird eingeschachtelt und auf
     eine saubere Zahl gerundet – nur wenn die Funktion dort auch wirklich definiert ist,
     zählt die Stelle (bei „x²−1 für x>1“ gehört x = 1 ja nicht dazu). */
  for(let i=1;i<V.length&&res.length<16;i++){ const A=V[i-1], B=V[i];
    const ad=isFinite(A.v), bd=isFinite(B.v);
    if(ad===bd) continue;
    let a=ad?B.x:A.x, b=ad?A.x:B.x;                                       /* a: undefiniert, b: definiert */
    for(let k=0;k<60;k++){ const m=(a+b)/2; if(isFinite(g(m))) b=m; else a=m; }
    const xc=Number(b.toPrecision(12)), y=g(xc);
    if(isFinite(y)&&Math.abs(y)<=tol) res.push(xc); }
  const aus=[]; res.forEach(x=>{ if(!aus.some(y=>Math.abs(y-x)<1.5/u)) aus.push(x); });
  return aus.sort((p,q)=>p-q); }
function achsenPunkte(){ const u=view.ux, uy=view.uy, ox=view.ox, oy=view.oy, zk=v=>zahl(Math.round(v*1000)/1000);
  if(xPt.on){ const px=ox+xPt.v*u; let n=0;
    funcs.forEach(f=>{ if(!f.toks.length) return; const y=evalAt(xPt.v,f.toks); if(!isFinite(y)) return; const py=oy-y*uy;
      ctx.save(); ctx.strokeStyle=f.color; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(px,oy); ctx.lineTo(px,py); ctx.lineTo(ox,py); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.fillStyle=f.color; ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fill(); ctx.restore();
      beschrift('y = '+zk(y), ox+11, py-12-(n++%2)*15, f.color,'left'); });
    griff(px,oy,'#1f2430'); beschrift('x = '+zk(xPt.v), px+12, oy+16, '#1f2430','left'); }
  if(yPt.on){ const py=oy-yPt.v*uy;
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(W,py); ctx.stroke(); ctx.restore();
    let n=0;
    funcs.forEach(f=>{ if(!f.toks.length) return; loesungen(f.toks,yPt.v).forEach(x0=>{ const px=ox+x0*u;
      ctx.save(); ctx.strokeStyle=f.color; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,oy); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.fillStyle=f.color; ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fill(); ctx.restore();
      beschrift('x = '+zk(x0), px, py-14-(n++%2)*15, f.color,'center'); }); });

}
function achsBtns(){ $('btnX').classList.toggle('on',xPt.on); $('btnY').classList.toggle('on',yPt.on); }
$('btnX').onclick=()=>{ xPt.on=!xPt.on; if(xPt.on&&!isFinite(xPt.v)) xPt.v=1; achsBtns(); draw(); sync(); };

/* ---- Gesten (Pinch/Pan) + Punkte ziehen ---- */
const pts=new Map(); let base=null, dragM=null;
function local(a){ const r=cv.getBoundingClientRect(); return {x:(a.reduce((s,p)=>s+p.x,0)/a.length)-r.left, y:(a.reduce((s,p)=>s+p.y,0)/a.length)-r.top}; }
function setBase(){ const a=[...pts.values()]; const mid=local(a);
  /* die Startlage beider Finger als Kopie - die Eintraege der Map werden ja fortgeschrieben */
  base={a0:a[0]?{x:a[0].x,y:a[0].y}:null, a1:a[1]?{x:a[1].x,y:a[1].y}:null,
        ux:view.ux, uy:view.uy, wx:(mid.x-view.ox)/view.ux, wy:(view.oy-mid.y)/view.uy}; }
function zieheM(mx,my){
  if(dragM==='x'){ const st=gridStep(view.ux)/10; xPt.v=Math.round(((mx-view.ox)/view.ux)/st)*st; }
  else { const st=gridStep(view.uy)/10; yPt.v=Math.round(((view.oy-my)/view.uy)/st)*st; }
  draw(); }
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(pts.size===0){                                       /* liegt der Finger auf einem Achsenpunkt? Dann ziehen statt verschieben */
    if(xPt.on&&Math.hypot(mx-(view.ox+xPt.v*view.ux),my-view.oy)<26){ dragM='x'; cv.setPointerCapture(e.pointerId); zieheM(mx,my); return; }
    if(yPt.on&&Math.hypot(mx-view.ox,my-(view.oy-yPt.v*view.uy))<26){ dragM='y'; cv.setPointerCapture(e.pointerId); zieheM(mx,my); return; } }
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); setBase(); });
cv.addEventListener('pointermove',e=>{ if(dragM){ const r=cv.getBoundingClientRect(); zieheM(e.clientX-r.left,e.clientY-r.top); return; }
  if(!pts.has(e.pointerId))return; const p=pts.get(e.pointerId); p.x=e.clientX; p.y=e.clientY;
  if(!base)return; const a=[...pts.values()]; const mid=local(a);
  let ux=base.ux, uy=base.uy;
  if(a.length>=2&&base.a0&&base.a1){ const f=zoomF(base.a0,base.a1,a[0],a[1]); ux=base.ux*f[0]; uy=base.uy*f[1]; }
  view.ux=Math.max(4,Math.min(5000,ux)); view.uy=Math.max(4,Math.min(5000,uy));
  view.ox=mid.x-base.wx*view.ux; view.oy=mid.y+base.wy*view.uy; draw(); });
function endP(e){ if(dragM){ dragM=null; sync(); return; }
  pts.delete(e.pointerId); if(pts.size>0) setBase(); else { base=null; sync(); } }
cv.addEventListener('pointerup',endP); cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const wx=(mx-view.ox)/view.ux, wy=(view.oy-my)/view.uy, f=Math.exp(-e.deltaY*0.0015);
  /* Mausrad: mit Umschalttaste nur x, mit Alt nur y, sonst beides */
  if(!e.altKey) view.ux=Math.max(4,Math.min(5000,view.ux*f));
  if(!e.shiftKey) view.uy=Math.max(4,Math.min(5000,view.uy*f));
  view.ox=mx-wx*view.ux; view.oy=my+wy*view.uy; draw(); sync(); },{passive:false});

/* ---- Eingabe & Sync ---- */
$('btnN').onclick=()=>{ nullAn=!nullAn; $('btnN').classList.toggle('on',nullAn); draw(); sync(); };

let uiK=null; function applyUiFont(){ const k=(fontSize||13)/13; if(k===uiK&&document.body.classList.contains('fb')===fontBold&&document.body.classList.contains('fi')===fontItalic) return; uiK=k; document.documentElement.style.setProperty('--k',k); document.body.classList.toggle('fb',fontBold); document.body.classList.toggle('fi',fontItalic); }

/* ================= Reiter „Transformationen" =========================================
   g(x) = a · f(b · (x + c)) + d – jede der vier Wirkungen lässt sich einzeln zeigen,
   dazu der ausgeschriebene Term und die Frage nach der Reihenfolge.                  */
const TR_BSP=[['x^2','Parabel x²'],['x^3','kubisch x³'],['sqrt(x)','Wurzel √x'],['1/x','Hyperbel 1/x'],
  ['sin(x)','Sinus'],['cos(x)','Kosinus'],['exp(x)','e-Funktion eˣ'],['2^x','Exponential 2ˣ'],
  ['ln(x)','Logarithmus'],['0.25*x^3-0.5*x^2-x+1','Grad 3, unsymmetrisch'],
  ['0.05*x^4-0.1*x^3-0.8*x^2+0.6*x+2','Grad 4, unsymmetrisch'],
  ['#frei','Freihand – selbst zeichnen']];
const TRC={f:'#94a3b8', alt:'#b45309'};        /* Ausgangsfunktion grau, vertauschte Reihenfolge braun */
const TRSTD={a:'#16a34a', b:'#2563eb', c:'#dc2626', d:'#7c3aed'};   /* a grün, b blau, c rot, d violett */
let tr={term:'x^2',a:1,b:1,c:0,d:0,einzel:true,zTerm:true,zWort:true,zGraph:true,zPar:true,zMuster:false,akt:0,alt:{term:'',a:1,b:1,c:0,d:0,frei:null,col:Object.assign({},TRSTD)},reihe:false,rSeite:'x',p1:1,p2:1,frei:null,col:Object.assign({},TRSTD)};
let trToks=tokenize(tr.term);
let trView={ox:0,oy:0,unit:40}, trW=0, trH=0;
const trCol=k=>(tr.col&&tr.col[k])||TRSTD[k];
/* Das Ergebnis bekommt die Farbe des zuletzt wirkenden Parameters */
function trGCol(){ if(tr.d!==0) return trCol('d'); if(tr.c!==0) return trCol('c');
  if(tr.b!==1) return trCol('b'); if(tr.a!==1) return trCol('a'); return trCol('d'); }
const nf1=v=>(Math.round(v*10)/10).toFixed(1).replace('.',',').replace('-','−');
const nfk=v=>{ const r=Math.round(v*1000)/1000; return String(r).replace('.',',').replace('-','−'); };
/* Klammern nur, wenn der Term auf oberster Ebene ein Plus oder Minus enthält */
function trNoetig(s){ let tief=0;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if(c==='(') tief++; else if(c===')') tief--;
    else if(tief===0&&i>0&&(c==='+'||c==='−')&&s[i-1]===' ') return true; }
  return false; }

/* ---- Freihand: eine selbst gezeichnete Ausgangsfunktion ----
   Die Punkte stehen in Diagrammkoordinaten und werden stückweise linear verbunden.
   Außerhalb des gezeichneten Bereichs gibt es kein f – dort wird nichts gezeichnet. */
let trZeichnet=false, freiRoh=[];
const trFreiDa=()=>!!(tr.frei&&tr.frei.length>1);
function freiAt(p,x){
  if(!p||p.length<2||x<p[0][0]||x>p[p.length-1][0]) return NaN;
  let lo=0, hi=p.length-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(p[m][0]<=x) lo=m; else hi=m; }
  const dx=p[hi][0]-p[lo][0];
  return dx>1e-9 ? p[lo][1]+(p[hi][1]-p[lo][1])*(x-p[lo][0])/dx : p[lo][1]; }
const trFrei=x=>freiAt(tr.frei,x);
/* Gezogene Punkte zu einer Funktion machen: nach x sortieren, dicht beieinander liegende
   zusammenfassen (sonst wäre die Kurve an einer Stelle mehrdeutig) und ausdünnen. */
function trFreiFertig(){
  const tol=0.6/Math.max(4,trView.unit);
  const p=freiRoh.filter(q=>isFinite(q[0])&&isFinite(q[1])).sort((u,v)=>u[0]-v[0]);
  const out=[];
  for(const q of p){ const l=out[out.length-1];
    if(l&&q[0]-l[0]<tol){ l[1]=(l[1]+q[1])/2; continue; }
    out.push([q[0],q[1]]); }
  let res=out; const N=80;             /* 80 Punkte reichen und halten den Teilen-Code klein */
  if(out.length>N){ res=[]; const st=(out.length-1)/(N-1); for(let i=0;i<N;i++) res.push(out[Math.round(i*st)]); }
  tr.frei=res.length>1?res.map(q=>[Math.round(q[0]*100)/100,Math.round(q[1]*100)/100]):null;
  freiRoh=[]; trZeichnet=false; }
function trFreiStart(){ tr.frei=null; freiRoh=[]; trZeichnet=true; tr.term=''; trToks=[]; trUiNeu(); trDraw(); }

/* ---- Zwei Funktionen ----
   Bearbeitet wird immer die **aktive**; ihre Daten stehen direkt in `tr`, die der anderen
   in `tr.alt`. Beim Umschalten werden die Felder getauscht – so gelten die Regler stets
   für die angetippte Funktion, und die andere behält ihre Einstellung. */
const TRFELD=['term','a','b','c','d','col','frei'];
let altToks=[];                                   /* Tokens der ruhenden Funktion, zwischengespeichert */
const trDa=o=>!!(o&&((o.term&&o.term.trim())||(o.frei&&o.frei.length>1)));
const trZwei=()=>trDa(tr.alt);                    /* ist die zweite Funktion in Gebrauch? */
function trAltToks(){ altToks=tokenize(tr.alt.term||''); }
function trWechsel(i){ if((tr.akt|0)===i) return;
  const t={}; for(const k of TRFELD){ t[k]=tr[k]; tr[k]=tr.alt[k]; tr.alt[k]=t[k]; }
  tr.akt=i; trToks=tokenize(tr.term||''); trAltToks(); trZeichnet=false;
  trUiNeu(); trDraw(); sync(); }
/* Ergebniskurve der ruhenden Funktion */
function trAltG(x){ const o=tr.alt;
  const v=(o.frei&&o.frei.length>1) ? freiAt(o.frei,o.b*(x+o.c))
        : (()=>{ const alt=params; params={a:NaN,b:NaN,c:NaN};
                 try{ return evalAt(o.b*(x+o.c),altToks); } finally{ params=alt; } })();
  return o.a*v+o.d; }
function trAltF(x){ const o=tr.alt;
  if(o.frei&&o.frei.length>1) return freiAt(o.frei,x);
  const alt=params; params={a:NaN,b:NaN,c:NaN};
  try{ return evalAt(x,altToks); } finally{ params=alt; } }
function trGCol2(){ const o=tr.alt, c=k=>(o.col&&o.col[k])||TRSTD[k];
  if(o.d!==0) return c('d'); if(o.c!==0) return c('c');
  if(o.b!==1) return c('b'); if(o.a!==1) return c('a'); return c('d'); }

/* Der Grundterm darf nur x enthalten – a, b, c sind hier die Transformationsgrößen. */
function trF(x){ if(trFreiDa()) return trFrei(x);
  const alt=params; params={a:NaN,b:NaN,c:NaN};
  try{ return evalAt(x,trToks); } finally{ params=alt; } }
/* Zwischenschritte in der Reihenfolge a → b → c → d: erst strecken, dann verschieben.
   Jeder Schritt ist dabei eine Streckung an einer Achse bzw. eine Verschiebung –
   in der Reihenfolge c → b müsste man dagegen an der verschobenen Achse strecken. */
const trG  =x=>tr.a*trF(tr.b*(x+tr.c))+tr.d;
const trS1 =x=>tr.a*trF(x);                 /* a: senkrecht gestreckt         */
const trS2 =x=>tr.a*trF(tr.b*x);            /* b: dazu waagrecht gestreckt    */
const trS3 =x=>tr.a*trF(tr.b*(x+tr.c));     /* c: dazu waagrecht verschoben   */
/* ---- Reihenfolge als Ablauf ----
   Jeder der beiden Regler führt die zwei Schritte nacheinander aus: in der ersten Hälfte den
   einen, in der zweiten Hälfte den anderen. Regler 1 streckt zuerst, Regler 2 verschiebt zuerst.
   Am Ende (100 %) stehen beide Kurven da – und sie liegen nicht aufeinander. */
const h1=t=>Math.min(1,2*t), h2=t=>Math.max(0,2*t-1);      /* erste und zweite Haelfte */
const misch=(ziel,q)=>1+(ziel-1)*q;                        /* Streckfaktor waechst von 1 auf ziel */
function trAbl(t,erstStrecken){
  if(tr.rSeite==='y'){                                     /* aussen: a und d */
    const q1=erstStrecken?h1(t):h2(t), q2=erstStrecken?h2(t):h1(t);
    const a=misch(tr.a,q1), d=tr.d*q2;
    return erstStrecken ? (x=>a*trF(tr.b*(x+tr.c))+d)      /* erst strecken, dann verschieben */
                        : (x=>a*(trF(tr.b*(x+tr.c))+d)); } /* erst verschieben, dann strecken */
  const q1=erstStrecken?h1(t):h2(t), q2=erstStrecken?h2(t):h1(t);
  const b=misch(tr.b,q1), c=tr.c*q2;                        /* innen: b und c */
  return erstStrecken ? (x=>tr.a*trF(b*(x+c))+tr.d)         /* erst strecken, dann verschieben */
                      : (x=>tr.a*trF(b*x+c)+tr.d); }        /* erst verschieben, dann strecken */
const trAx =x=>trAbl(tr.p1,true)(x);
const trAy =x=>trAbl(tr.p2,false)(x);

/* ---- Zeichnen ---- */
function trResize(){ const el=$('plotR'); const r=el.getBoundingClientRect();
  trW=Math.max(10,Math.round(r.width)); trH=Math.max(10,Math.round(r.height));
  el.width=Math.round(trW*dpr); el.height=Math.round(trH*dpr);
  if(!trView.ox||!trView.oy){ trView.ox=trW/2; trView.oy=trH/2; }
  trDraw(); }
/* ---- Mitgezogenes Hintergrundmuster ----
   Der Graph von g entsteht aus dem von f durch die Punktabbildung
   (u | v) → (u/b − c | a·v + d). Genau diese Abbildung wird hier auf das Einheitsgitter
   losgelassen: Aus den Linien u = k wird x = k/b − c, aus v = m wird y = a·m + d.
   Das Koordinatensystem bleibt davon unberührt – man sieht, dass der Graph im
   mitgezogenen Gitter unverändert aussieht. */
function trMuster(c2,u,ox,oy,xmin,xmax,ymin,ymax){
  const b=Math.abs(tr.b)<0.05?0:tr.b, a=Math.abs(tr.a)<0.05?0:tr.a, col=trGCol();
  const X=x=>ox+x*u, Y=y=>oy-y*u;
  c2.save(); c2.strokeStyle=col; c2.fillStyle=col;
  /* Bild des Einheitsquadrats: zeigt Streckung und Spiegelung auf einen Blick */
  if(b&&a){ const x0=X(0/b-tr.c), x1=X(1/b-tr.c), y0=Y(tr.d), y1=Y(a+tr.d);
    c2.globalAlpha=0.13; c2.fillRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0)); }
  const linien=(n0,n1,schritt,pos,senk)=>{
    for(let k=n0;k<=n1;k+=schritt){ const p=pos(k);
      c2.globalAlpha=(k===0)?0.8:0.34; c2.lineWidth=(k===0)?2.2:1.2;
      c2.beginPath();
      if(senk){ c2.moveTo(p,0); c2.lineTo(p,trH); } else { c2.moveTo(0,p); c2.lineTo(trW,p); }
      c2.stroke(); } };
  if(b){ const abst=Math.abs(1/b)*u;                      /* Abstand der senkrechten Linien in Pixeln */
    if(abst>=5){ const s=Math.max(1,Math.ceil(6/abst));
      const kA=(xmin+tr.c)*b, kB=(xmax+tr.c)*b;
      const von=Math.ceil(Math.min(kA,kB)/s)*s, bis=Math.floor(Math.max(kA,kB)/s)*s;
      if((bis-von)/s<=400) linien(von,bis,s,k=>X(k/b-tr.c),true); } }
  if(a){ const abst=Math.abs(a)*u;
    if(abst>=5){ const s=Math.max(1,Math.ceil(6/abst));
      const mA=(ymin-tr.d)/a, mB=(ymax-tr.d)/a;
      const von=Math.ceil(Math.min(mA,mB)/s)*s, bis=Math.floor(Math.max(mA,mB)/s)*s;
      if((bis-von)/s<=400) linien(von,bis,s,m=>Y(a*m+tr.d),false); } }
  c2.restore(); }

function trKurve(c2,fn,col,w,dash){ c2.save(); c2.strokeStyle=col; c2.lineWidth=w; if(dash) c2.setLineDash(dash);
  c2.beginPath(); let prev=null;
  for(let px=0;px<=trW;px++){ const x=(px-trView.ox)/trView.unit, y=fn(x), py=trView.oy-y*trView.unit;
    if(!isFinite(py)){ prev=null; continue; }
    if(prev===null||Math.abs(py-prev)>trH*3) c2.moveTo(px,py); else c2.lineTo(px,py);
    prev=py; }
  c2.stroke(); c2.restore(); }
function trDraw(){ if(tab!=='r') return;
  if(!tr.zGraph){ trText(); return; }                 /* Graph ausgeblendet: nur die Spalte neu schreiben */
  if(!trW) return;
  const c2=$('plotR').getContext('2d'); c2.setTransform(dpr,0,0,dpr,0,0);
  c2.clearRect(0,0,trW,trH); c2.fillStyle='#fff'; c2.fillRect(0,0,trW,trH);
  const u=trView.unit, ox=trView.ox, oy=trView.oy;
  const raw=44/u, p10=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=p10*10; for(const m of [1,2,5,10]){ if(p10*m>=raw){ step=p10*m; break; } }
  const xmin=(0-ox)/u, xmax=(trW-ox)/u, ymin=(oy-trH)/u, ymax=oy/u;
  c2.strokeStyle='#eef1f6'; c2.lineWidth=1; c2.beginPath();
  for(let x=Math.ceil(xmin/step)*step;x<=xmax;x+=step){ const px=ox+x*u; c2.moveTo(px,0); c2.lineTo(px,trH); }
  for(let y=Math.ceil(ymin/step)*step;y<=ymax;y+=step){ const py=oy-y*u; c2.moveTo(0,py); c2.lineTo(trW,py); }
  c2.stroke();
  c2.strokeStyle='#98a2b3'; c2.lineWidth=1.6; c2.beginPath();
  c2.moveTo(0,oy); c2.lineTo(trW,oy); c2.moveTo(ox,0); c2.lineTo(ox,trH); c2.stroke();
  c2.fillStyle='#667085'; c2.font=(fontItalic?'italic ':'')+(fontBold?'bold ':'')+fontSize+'px sans-serif';
  c2.textAlign='center'; c2.textBaseline='top';
  for(let x=Math.ceil(xmin/step)*step;x<=xmax;x+=step){ if(Math.abs(x)<1e-9) continue;
    c2.fillText(fmt(x), ox+x*u, Math.min(Math.max(oy+3,2),trH-fontSize-3)); }
  c2.textAlign='right'; c2.textBaseline='middle';
  for(let y=Math.ceil(ymin/step)*step;y<=ymax;y+=step){ if(Math.abs(y)<1e-9) continue;
    c2.fillText(fmt(y), Math.min(Math.max(ox-4,fontSize*2),trW-2), oy-y*u); }
  if(tr.zMuster) trMuster(c2,u,ox,oy,xmin,xmax,ymin,ymax);
  if(trZeichnet){ /* Hinweis und der bisher gezogene Strich */
    if(freiRoh.length>1){ c2.save(); c2.strokeStyle=TRC.f; c2.lineWidth=2.4; c2.lineJoin='round'; c2.beginPath();
      freiRoh.forEach((q,i)=>{ const px=ox+q[0]*u, py=oy-q[1]*u; i?c2.lineTo(px,py):c2.moveTo(px,py); });
      c2.stroke(); c2.restore(); }
    c2.save(); c2.fillStyle='#64748b'; c2.font='600 '+Math.max(13,fontSize)+'px sans-serif';
    c2.textAlign='center'; c2.textBaseline='top';
    c2.fillText('Kurve in die Fläche zeichnen', trW/2, 8); c2.restore();
    trText(); return; }
  if(trZwei()){ c2.save(); c2.globalAlpha=0.75;                 /* die ruhende Funktion blasser daneben */
    trKurve(c2,trAltF,TRC.f,1.2);
    trKurve(c2,trAltG,trGCol2(),2.2);
    c2.restore(); }
  if(!trToks.length&&!trFreiDa()){ trText(); return; }
  trKurve(c2,trF,TRC.f,1.8);                                    /* Ausgangsfunktion */
  if(tr.einzel){
    if(tr.a!==1&&(tr.b!==1||tr.c!==0||tr.d!==0)) trKurve(c2,trS1,trCol('a'),1.6,[6,5]);
    if(tr.b!==1&&(tr.c!==0||tr.d!==0))           trKurve(c2,trS2,trCol('b'),1.6,[6,5]);
    if(tr.c!==0&&tr.d!==0)                       trKurve(c2,trS3,trCol('c'),1.6,[6,5]); }
  if(tr.reihe){ trKurve(c2,trAbl(tr.p1,true),trGCol(),2.2,[7,4]);      /* erst strecken, dann verschieben */
                trKurve(c2,trAbl(tr.p2,false),TRC.alt,2.2,[3,4]); }   /* erst verschieben, dann strecken */
  trKurve(c2,trG,trGCol(),2.8);                                 /* Ergebnis in der Farbe des letzten Schrittes */
  trText(); }

/* ---- Term und Erklärung ---- */
/* h = true: Parameter in ihrer Farbe einfaerben (HTML), sonst reiner Text */
const trPar=(k,txt,h)=>h?('<span style="color:'+trCol(k)+'">'+txt+'</span>'):txt;
function trInnen(h){ const b=tr.b, c=tr.c;
  let s='x';
  if(c!==0) s='x '+trPar('c',(c>0?'+ ':'− ')+nfk(Math.abs(c)),h);
  if(b!==1) s=(c!==0)?(trPar('b',nfk(b),h)+'·('+s+')')
                     :(b===-1?trPar('b','−',h)+'x':trPar('b',nfk(b),h)+'·x');
  return s; }
function trTermG(h){ if(!trToks.length) return '';
  const roh=trInnen(false), zus=!/^[-−]?x$/.test(roh);
  const klammer=trNoetig(termText(trToks,roh,false,zus));   /* Klammerfrage am reinen Text entscheiden */
  let s=termText(trToks,roh,false,zus,h?trInnen(true):null);
  if(tr.a!==1){ s=trPar('a',(tr.a===-1?'−':nfk(tr.a)+'·'),h)+(klammer?('('+s+')'):s); }
  if(tr.d!==0) s+=' '+trPar('d',(tr.d>0?'+ ':'− ')+nfk(Math.abs(tr.d)),h);
  return s; }
/* Rechte Spalte: Terme (beide Formen, per Häkchen) und die Wortbeschreibung als Liste. */
function trText(){ const out=$('trOut'); const L=[];
  const altBox=out.querySelector('.trBox'); const scrollAlt=altBox?altBox.scrollLeft:0;
  const zwei=trZwei(), nr=(tr.akt|0)===1?'₂':'';
  const nm=zwei?' · f'+nr:'';                   /* bei zwei Funktionen dazuschreiben, welche gemeint ist */
  const gk='<span style="color:'+trGCol()+'">g'+(zwei?nr:'')+'</span>(<i>x</i>) = ';
  if(tr.zWort){ const t=[]; const zP=tr.zPar!==false;
    /* Ohne „Parameter" faellt nur die ausdrueckliche Angabe c = 2 weg – im Satz stehen die
       Zahlen weiter („um 2 nach links verschoben"), daraus soll der Wert bestimmt werden. */
    const zeile=(k,txt)=>'<li style="border-left-color:'+trCol(k)+'"><span class="p" style="color:'+trCol(k)+'">'+k+(zP?' = '+nf1(tr[k]):'')+'</span>: '+txt+'</li>';
    if(tr.a!==1) t.push(zeile('a','senkrecht '+(Math.abs(tr.a)>1?'gestreckt':'gestaucht')+' (Faktor '+nfk(Math.abs(tr.a))+')'+(tr.a<0?', an der x-Achse gespiegelt':'')));
    if(tr.b!==1) t.push(zeile('b','waagrecht '+(Math.abs(tr.b)>1?'gestaucht':'gestreckt')+' (Faktor '+nfk(Math.round(1000/Math.abs(tr.b))/1000)+')'+(tr.b<0?', an der y-Achse gespiegelt':'')));
    if(tr.c!==0) t.push(zeile('c','um '+nfk(Math.abs(tr.c))+' nach '+(tr.c>0?'links':'rechts')+' verschoben'));
    if(tr.d!==0) t.push(zeile('d','um '+nfk(Math.abs(tr.d))+' nach '+(tr.d>0?'oben':'unten')+' verschoben'));
    L.push('<div class="wTitel">Wortbeschreibung'+nm+'</div>'+(t.length
      ?('<ul class="wList">'+t.join('')+'</ul><div class="wNote">der Reihe nach: erst strecken, dann verschieben</div>')
      :'<div class="wLeer">Noch keine Veränderung: a = 1, b = 1, c = 0, d = 0.</div>')); }
  if(tr.zTerm){
    let kurz=gk+trPar('a',(tr.a===1?'':(tr.a===-1?'−':nfk(tr.a)+'·')),true)+'f('+trInnen(true)+')';
    if(tr.d!==0) kurz+=' '+trPar('d',(tr.d>0?'+ ':'− ')+nfk(Math.abs(tr.d)),true);
    const kasten=['<div class="trT">'+kurz+'</div>'];
    if(trToks.length) kasten.push('<div class="trT trT2">'+gk+trTermG(true)+'</div>');
    L.push('<div class="wTitel">Term'+nm+'</div><div class="trBox">'+kasten.join('')+'</div>'); }
  if(tr.reihe){
    L.push('<div class="wTitel">Reihenfolge</div>');
    const vz=(v)=>(v>=0?' + ':' − ')+nfk(Math.abs(v));
    const vor=(v)=>v===1?'':(v===-1?'−':nfk(v)+'·');
    const e1=tr.rSeite==='y'
      ? vor(tr.a)+'f(…)'+(tr.d===0?'':vz(tr.d))
      : vor(tr.a)+'f('+trInnen(false)+')'+(tr.d===0?'':vz(tr.d));
    const e2=tr.rSeite==='y'
      ? vor(tr.a)+'( f(…)'+vz(tr.d)+' )'
      : vor(tr.a)+'f('+(tr.b===1?'x':(tr.b===-1?'−x':nfk(tr.b)+'·x'))+(tr.c===0?'':vz(tr.c))+')'+(tr.d===0?'':vz(tr.d));
    L.push('<div style="color:'+trGCol()+'"><b>erst strecken, dann verschieben:</b> '+e1+'</div>');
    L.push('<div style="color:'+TRC.alt+'"><b>erst verschieben, dann strecken:</b> '+e2+'</div>');
    if(tr.rSeite==='y')
      L.push('<div class="zf">Ausmultipliziert ist der untere Weg a·f(…) + a·d: Es verschiebt um <b>'+nfk(Math.round(tr.a*tr.d*1000)/1000)+'</b> statt um '+nfk(tr.d)+'. Darum erst strecken, dann verschieben.</div>');
    else
      L.push('<div class="zf">Innen wirkt alles <b>umgekehrt</b>: f(b·x + c) = f(b·(x + c : b)) verschiebt nur um <b>'+(tr.b?nfk(Math.round(tr.c/tr.b*1000)/1000):'—')+'</b> statt um '+nfk(tr.c)+'.</div>');
    L.push('<div class="zf">Mit den beiden Reglern läuft jeder Weg Schritt für Schritt ab: erst die eine Hälfte, dann die andere.</div>');
    const hin=$('trRHin'); if(hin){ hin.textContent=''; hin.className='trHin'; } }
  if(!L.length) L.push('<div class="wLeer">Nichts eingeblendet – Häkchen oben setzen.</div>');
  out.innerHTML=L.map(z=>'<div>'+z+'</div>').join('');
  /* Beim Schieben der Regler wird der Kasten neu geschrieben – die Scrollstelle bleibt erhalten */
  const nb=out.querySelector('.trBox'); if(nb&&scrollAlt) nb.scrollLeft=scrollAlt;
  trLayout(); }
/* Graph und rechte Spalte lassen sich einzeln ausblenden; ist beides weg, bleibt die Spalte

function trLayout(){ const ohneSpalte=!(tr.zTerm||tr.zWort||tr.reihe||tr.zPar!==false)&&tr.zGraph;

/* ---- Ansicht ---- */
/* Standardfenster wie im Reiter „Graph": x von −8 bis 8, y um 0 herum.
   Liegt der Graph ganz woanders (großes d), wird senkrecht nachgeführt. */
function trFit(){ if(!trW) return;
  trView.unit=Math.max(8,Math.min(trW/16,trH/12));
  trView.ox=trW/2;
  const mitte=[], h=trH/2/trView.unit;
  for(let i=0;i<=40;i++){ const y=trG(-4+8*i/40); if(isFinite(y)&&Math.abs(y)<1e5) mitte.push(y); }
  mitte.sort((p,q)=>p-q);
  const med=mitte.length?mitte[Math.floor(mitte.length/2)]:0;
  const ver=(Math.abs(med)>h*0.9)?med:0;                /* nur nachführen, wenn nötig */
  trView.oy=trH/2+ver*trView.unit; trDraw(); }

/* Zweiter Reglersatz: oben die eingestellte Reihenfolge, darunter die vertauschte. */

function trPhase(t,erstStrecken){

  /* Verschieben und Zoomen auf der Zeichenfläche */
  const el=$('plotR'); const pts=new Map(); let last=null, dist0=0, unit0=0;
  const inDia=e=>{ const r=el.getBoundingClientRect();
    return [(e.clientX-r.left-trView.ox)/trView.unit, (trView.oy-(e.clientY-r.top))/trView.unit]; };
  el.addEventListener('pointerdown',e=>{
    const fang=()=>{ try{ el.setPointerCapture(e.pointerId); }catch(err){} };
    if(trZeichnet){ freiRoh=[inDia(e)]; fang(); e.preventDefault(); return; }
    fang(); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1) last={x:e.clientX,y:e.clientY};
    if(pts.size===2){ const [p,q]=[...pts.values()]; dist0=Math.hypot(p.x-q.x,p.y-q.y); unit0=trView.unit; } });
  el.addEventListener('pointermove',e=>{
    if(trZeichnet){ if(!freiRoh.length) return; freiRoh.push(inDia(e)); trDraw(); return; }

    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [p,q]=[...pts.values()], dd=Math.hypot(p.x-q.x,p.y-q.y);

})();


/* ================= Reiter „Modell" =================================================
   Messdaten eingeben – in der Tabelle oder direkt als Punkte ins Koordinatensystem –
   und mit einem waehlbaren Funktionstyp modellieren. Die Punkte bleiben beweglich:
   zieht man einen Punkt, rechnet sich das Modell sofort neu. Der Reiter steht fuer
   sich, mit den Funktionen f₁, f₂ … der anderen Reiter hat er nichts zu tun.
   ganzrational: der Graph geht genau durch alle Punkte (Grad = Zahl der Bedingungen − 1),

   exponentiell und trigonometrisch: Naeherung nach der Methode der kleinsten Quadrate. */

let md={typ:'p', genau:true, grad:2, abl:false, offC:false, zGraph:true, zTerm:true, zAbw:false, zWert:false,

const mdKurve=()=>md.col||MDCOL.kurve;             /* Farbe des Modellgraphen – Kreis vor dem Term */
const mdF=v=>{ const r=Math.round(v*1000)/1000; return String(r).replace('.',',').replace('-','−'); };
/* dritte Spalte und Steigungsgriffe nur bei der exakten ganzrationalen Funktion:
