<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Funktionsplotter</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;touch-action:none;}
  #app{display:flex;flex-direction:column;height:100%;}
  #top{flex:none;padding:6px 8px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid #e6eaf0;}
  .frow{display:flex;gap:6px;align-items:center;}
  .func{gap:6px;}
  .fcol{width:calc(var(--k) * 16px);height:calc(var(--k) * 16px);border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #cfd6e0;cursor:pointer;}
  .fcol:active{box-shadow:0 0 0 2px #2563eb;}
  /* Farbwähler zum Punkt vor der Funktion */
  #colPop{position:fixed;z-index:60;display:none;grid-template-columns:repeat(5,30px);gap:8px;
    background:#fff;border:1px solid #cfd6e0;border-radius:13px;box-shadow:0 8px 28px rgba(15,23,42,.24);padding:9px;}
  #colPop.show{display:grid;}
  #colPop button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cfd6e0;cursor:pointer;padding:0;}
  #colPop button.on{box-shadow:0 0 0 2px #2563eb;}
  #colPop input[type=color]{width:30px;height:30px;padding:0;border:1px solid #cfd6e0;border-radius:50%;background:none;cursor:pointer;}
  :root{--k:1;}
  body.fb .fterm,body.fb .fname{font-weight:800;} body.fi .fterm{font-style:italic;}
  .fname{font-size:calc(var(--k) * 14px);white-space:nowrap;font-weight:700;}
  .fterm{flex:1;min-width:0;padding:calc(var(--k) * 7px) 8px;border:1px solid #cfd6e0;border-radius:8px;font-size:calc(var(--k) * 15px);font-family:inherit;-webkit-user-select:text;user-select:text;}
  .func.active .fterm{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.18);}
  .fdel{border:none;background:#eef1f5;color:#8a93a2;width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;flex:none;}
  .fhide{border:none;background:#eef1f5;width:30px;height:30px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;flex:none;filter:grayscale(1);opacity:.6;}
  .fhide.on{background:#dbeafe;filter:none;opacity:1;}
  .verdeckt{flex:1;min-width:0;padding:calc(var(--k) * 7px) 8px;border:1px dashed #cfd6e0;border-radius:8px;
    font-size:calc(var(--k) * 15px);color:#94a3b8;letter-spacing:4px;background:#f8fafc;white-space:nowrap;overflow:hidden;}
  #fbtns{gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  #fbtns>*{flex:0 0 auto;}
  #fbtns::-webkit-scrollbar{height:4px;} #fbtns::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  #add{border:none;border-radius:8px;background:#e7ebf1;padding:7px 12px;font-size:14px;cursor:pointer;font-weight:700;color:#2563eb;}
  #fit{border:none;border-radius:8px;background:#e7ebf1;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .fsb{border:none;border-radius:8px;background:#e7ebf1;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:700;color:#1f2430;}
  .fsb.on{background:#2563eb;color:#fff;}
  /* ---- Tabs ---- */
  #tabs{display:flex;gap:4px;}
  #tabs button{flex:1 1 auto;white-space:nowrap;border:1px solid #cfd6e0;background:#f4f6fa;border-radius:10px;padding:calc(var(--k) * 6px) 6px;font-weight:700;font-size:calc(var(--k) * 13px);font-family:inherit;color:#53617a;cursor:pointer;}
  #tabs button.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  body:not(.t-g) #funcs,body:not(.t-g) #add,body:not(.t-g) #fit,body:not(.t-g) #btnX,body:not(.t-g) #btnY{display:none;}
  body.kp-open #app{height:calc(100% - var(--kph,230px));}
  #keypad{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#eef1f6;border-top:1px solid #cfd6e0;padding:6px;display:none;flex-direction:column;gap:5px;touch-action:manipulation;}
  #keypad.show{display:flex;}
  #keypad .kp-row{display:flex;gap:5px;}
  #keypad .kp-row.chips{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #keypad button{flex:1 1 0;min-width:0;height:42px;border:1px solid #cfd6e0;background:#fff;border-radius:9px;font-size:18px;font-weight:600;font-family:inherit;color:#1f2430;cursor:pointer;padding:0;}
  #keypad button:active{background:#dbe4f0;}
  #keypad button.fn{flex:0 0 auto;height:36px;padding:0 12px;font-size:15px;font-weight:700;color:#2563eb;}
  #keypad button.op{background:#f4f6fa;}
  #keypad button.act{background:#3b82f6;border-color:#3b82f6;color:#fff;flex:1.6 1 0;}
  #keypad button.del{background:#fee2e2;border-color:#fca5a5;}
  #sliders{display:flex;flex-direction:column;gap:2px;}
  .sl{display:flex;align-items:center;gap:8px;font-size:calc(var(--k) * 13px);}
  .sl label{width:calc(var(--k) * 46px);font-weight:700;color:#2563eb;}
  .sl input[type=range]{flex:1;}
  .sl .v{width:calc(var(--k) * 46px);text-align:right;font-variant-numeric:tabular-nums;}
  #wrap{flex:1;position:relative;min-height:0;}
  .panel{position:absolute;inset:0;display:none;}
  .panel.on{display:block;}
  #pG{overflow:hidden;}
  #pT,#pM{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px;}
  canvas{position:absolute;inset:0;width:100%;height:100%;background:#fff;}
  #err{position:absolute;left:8px;top:6px;color:#ef4444;font-size:12px;}
  /* ---- Tabelle ---- */
  #ttab{border-collapse:collapse;font-size:calc(var(--k) * 14px);}
  #ttab th,#ttab td{border:1px solid #d7dde6;padding:calc(var(--k) * 4px) calc(var(--k) * 6px);text-align:center;white-space:nowrap;}
  #ttab th.ecke{background:#eef1f6;font-weight:800;font-style:italic;font-size:calc(var(--k) * 16px);}
  #ttab td.fz{text-align:left;background:#f8fafc;}
  #ttab td.fz>*{vertical-align:middle;}
  .fzin{display:flex;align-items:center;gap:5px;}
  .fzin .fterm,.fzin .verdeckt{flex:0 0 auto;width:calc(var(--k) * 150px);padding:calc(var(--k) * 5px) 7px;font-size:calc(var(--k) * 14px);}
  .xin{width:calc(var(--k) * 62px);text-align:center;border:1px solid #cfd6e0;border-radius:7px;padding:calc(var(--k) * 5px) 2px;font-size:calc(var(--k) * 14px);font-family:inherit;-webkit-user-select:text;user-select:text;}
  .yv{font-variant-numeric:tabular-nums;font-weight:700;}
  #tbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .plus{border:none;border-radius:8px;background:#e7ebf1;padding:calc(var(--k) * 7px) 12px;font-size:calc(var(--k) * 13px);cursor:pointer;font-weight:700;color:#2563eb;white-space:nowrap;}
  .plus.minus{color:#64748b;}
  /* ---- Maschine ---- */
  .masch{border:1px solid #d7dde6;border-radius:14px;padding:8px 10px 10px;margin-bottom:10px;background:#fbfcfe;}
  .mkopf{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .mmitte{display:flex;flex-direction:column;align-items:center;gap:0;}
  .mein,.maus{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:calc(var(--k) * 5px) calc(var(--k) * 12px);font-size:calc(var(--k) * 15px);font-weight:700;}
  .mein{background:#eef2f7;border:1px solid #cfd6e0;}
  .maus{background:#f0fdf4;border:1px solid #86efac;}
  .mlab{font-style:italic;font-weight:800;}
  .mxin{width:calc(var(--k) * 72px);text-align:center;border:1px solid #cfd6e0;border-radius:7px;padding:calc(var(--k) * 4px) 2px;font-size:calc(var(--k) * 15px);font-family:inherit;background:#fff;-webkit-user-select:text;user-select:text;}
  .mval{font-variant-numeric:tabular-nums;min-width:calc(var(--k) * 52px);text-align:center;}
  .mtr{width:calc(var(--k) * 150px);height:calc(var(--k) * 20px);background:#dbe4f0;clip-path:polygon(0 0,100% 0,70% 100%,30% 100%);}
  .mch{width:calc(var(--k) * 150px);height:calc(var(--k) * 20px);background:#dbe4f0;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);}
  .mbody{display:flex;align-items:center;justify-content:center;gap:calc(var(--k) * 10px);min-width:calc(var(--k) * 210px);
    background:linear-gradient(#f6f8fb,#e6ebf3);border:2px solid #b9c4d4;border-radius:12px;padding:calc(var(--k) * 9px) calc(var(--k) * 12px);}
  .mterm{font-size:calc(var(--k) * 17px);font-weight:800;white-space:nowrap;}
  .zahn{font-size:calc(var(--k) * 19px);color:#94a3b8;display:inline-block;}
  .masch.rechnet .z1{animation:dreh .7s linear;}
  .masch.rechnet .z2{animation:drehr .7s linear;}
  .masch.rechnet .maus{animation:pop .55s ease;}
  @keyframes dreh{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes drehr{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
  @keyframes pop{0%{transform:scale(.55);opacity:.25}60%{transform:scale(1.14)}100%{transform:scale(1)}}
  .mweg{font-size:calc(var(--k) * 14px);color:#475569;margin:calc(var(--k) * 5px) 0 calc(var(--k) * 3px);text-align:center;}
  #mbtns{display:flex;gap:8px;}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="tabs"><button type="button" id="tabG" class="on">Graph</button><button type="button" id="tabT">Tabelle</button><button type="button" id="tabM">Maschine</button></div>
    <div id="funcs"></div>
    <div class="frow" id="fbtns"><button id="add" title="Weitere Funktion hinzufügen">＋ Funktion</button><button id="fit">Ansicht</button><button class="fsb" id="btnX" title="Beweglicher Punkt auf der x-Achse"><i>x</i></button><button class="fsb" id="btnY" title="Beweglicher Punkt auf der y-Achse"><i>y</i></button><button class="fsb" id="btnKeys" title="Formel-Tastatur ein-/ausblenden">⌨ Formeln</button><button class="fsb" id="fsM" title="Schrift kleiner">A−</button><button class="fsb" id="fsP" title="Schrift größer">A+</button><span id="teilenBtn" style="display:inline-flex"></span><span id="shotBtns" style="display:inline-flex;gap:6px"></span></div>
    <div id="sliders"></div>
  </div>
  <div id="wrap">
    <div class="panel on" id="pG"><canvas id="plot"></canvas><div id="err"></div></div>
    <div class="panel" id="pT"></div>
    <div class="panel" id="pM"></div>
  </div>
</div>
<div id="keypad"></div>
<div id="colPop"></div>
<script src="shot.js"></script>
<script src="teilen.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$('plot'), ctx=cv.getContext('2d');
let dpr=Math.max(1,window.devicePixelRatio||1), W=0, H=0;
let view={ox:0,oy:0,unit:40};
let params={a:1,b:0,c:0};
let fontSize=13, fontBold=false, fontItalic=false;
const GCOL=['#2563eb','#e11d48','#16a34a','#f59e0b','#7c3aed','#db2777','#0891b2','#ea580c'];
const DEFW=2.4;
let funcs=[{term:'a*x^2+b*x+c', color:GCOL[0], width:DEFW, mx:'2', toks:[]}];
let activeIdx=0;
let tab='g';                                       /* g = Graph, t = Tabelle, m = Maschine */
let xs=['−2','−1','0','1','2'];                    /* x-Werte der Tabelle */
let xPt={on:false,v:1}, yPt={on:false,v:1};        /* bewegliche Punkte auf den Achsen */

const SUB='₀₁₂₃₄₅₆₇₈₉';
const sub=n=>String(n).split('').map(d=>SUB[+d]).join('');
const HOCH={'-':'⁻','−':'⁻','+':'','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const hoch=s=>String(s).split('').map(c=>HOCH[c]!==undefined?HOCH[c]:c).join('');
/* Zahlen deutsch ausgeben, sehr große/kleine als Zehnerpotenz */
function zahl(v){ if(v==null||typeof v!=='number'||!isFinite(v)) return '—';
  const r=Math.round(v*1e4)/1e4;
  if(Math.abs(r)>=1e7||(r!==0&&Math.abs(r)<1e-4)){ const p=v.toExponential(3).split('e');
    return p[0].replace('.',',').replace('-','−')+'·10'+hoch(p[1]); }
  return String(r).replace('.',',').replace('-','−'); }
/* deutsche Eingabe lesen: Komma und typografisches Minus erlaubt */
function pz(s){ const t=String(s==null?'':s).replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'');
  if(!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(t)) return NaN; return parseFloat(t); }

function resize(){ if(!cv.clientWidth||!cv.clientHeight) return;
  dpr=Math.max(1,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  if(!view.ox&&!view.oy){ view.ox=W/2; view.oy=H/2; } draw(); }

/* ---- Term auswerten ---- */
function tokenize(s){ s=String(s).replace(/\|([^|]*)\|/g,'abs($1)');   /* |x| = Betrag */
  const t=[]; let i=0; while(i<s.length){ const c=s[i];
  if(c===' '){i++;continue;}
  if('+-*/^(),'.includes(c)){ t.push({k:c}); i++; continue; }
  if(c==='−'){ t.push({k:'-'}); i++; continue; }
  if(/[0-9.]/.test(c)){ let j=i; while(j<s.length&&/[0-9.]/.test(s[j]))j++; t.push({k:'num',v:parseFloat(s.slice(i,j))}); i=j; continue; }
  if(/[a-zA-Z]/.test(c)){ let j=i; while(j<s.length&&/[a-zA-Z0-9]/.test(s[j]))j++; const w=s.slice(i,j).toLowerCase();
    // zusammengeschriebene Namen zerlegen: „ax“ → a·x, „2xsin“ → 2·x·sin
    let k=0; while(k<w.length){ const nm=PNAMES.find(n=>w.startsWith(n,k)); if(!nm){ t.push({k:'id',v:w.slice(k)}); break; } t.push({k:'id',v:nm}); k+=nm.length; }
    i=j; continue; }
  t.push({k:'?'}); i++; }                                /* unbekanntes Zeichen: Term gilt als ungueltig */
  // implizite Multiplikation: 2x, 3(x+1), x sin(x), (x+1)(x−1), a x
  const out=[]; for(let q=0;q<t.length;q++){ out.push(t[q]); const A=t[q], B=t[q+1]; if(!B) continue;
    const aEnd=A.k==='num'||A.k===')'||(A.k==='id'&&!PFUNCS.includes(A.v)), bStart=B.k==='num'||B.k==='id'||B.k==='(';
    if(aEnd&&bStart&&!(A.k==='num'&&B.k==='num')) out.push({k:'*'}); }
  return out; }
const PFUNCS=['asin','acos','atan','sin','cos','tan','sqrt','abs','ln','log','exp'];
const PNAMES=[...PFUNCS,'pi','x','a','b','c','e'];
function evalAt(x, T){ let p=0; const sc={x,a:params.a,b:params.b,c:params.c,pi:Math.PI,e:Math.E};
  const peek=()=>T[p], next=()=>T[p++];
  function E(){ let v=Tm(); while(peek()&&(peek().k==='+'||peek().k==='-')){ const o=next().k, r=Tm(); v=o==='+'?v+r:v-r; } return v; }
  function Tm(){ let v=Un(); while(peek()&&(peek().k==='*'||peek().k==='/')){ const o=next().k, r=Un(); v=o==='*'?v*r:v/r; } return v; }
  function Un(){ if(peek()&&(peek().k==='+'||peek().k==='-')){ const o=next().k, v=Un(); return o==='-'?-v:v; } return Pw(); }
  function Pw(){ let v=Pr(); if(peek()&&peek().k==='^'){ next(); v=Math.pow(v,Un()); } return v; }   /* -x^2 = -(x^2), 2^-3 bleibt moeglich */
  function Pr(){ const tk=peek(); if(!tk)return NaN;
    if(tk.k==='num'){ next(); return tk.v; }
    if(tk.k==='('){ next(); const v=E(); if(peek()&&peek().k===')')next(); return v; }
    if(tk.k==='id'){ next(); const n=tk.v;
      if(peek()&&peek().k==='('){ next(); const a=E(); if(peek()&&peek().k===')')next();
        const f={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:x=>Math.log10(x),exp:Math.exp};
        return (f[n]||(()=>NaN))(a); }
      return (n in sc)?sc[n]:NaN; }
    next(); return NaN; }
  const r=E(); return (p<T.length)?NaN:r; }                /* Rest uebrig = Tippfehler: lieber nichts zeichnen */

/* ---- Term lesbar schreiben: a*x^2 → a·x², mit Einsetzen von x und den Parametern ---- */
const SYM={pi:'π',sqrt:'√'};
function termText(toks,xv,mitP){ let s='';
  for(let i=0;i<toks.length;i++){ const t=toks[i];
    if(t.k==='num'){ s+=zahl(t.v); continue; }
    if(t.k==='id'){ if(t.v==='x'&&xv!=null){ const vor=i>0?toks[i-1].k:null;
        s+= (xv.charAt(0)==='−'&&vor!=='(') ? '('+xv+')' : xv; }   /* negatives x nur klammern, wo es noetig ist */
      else if(mitP&&(t.v==='a'||t.v==='b'||t.v==='c')) s+=klammer(params[t.v]);
      else s+=(SYM[t.v]||t.v);
      continue; }
    if(t.k==='*'){ s+='·'; continue; }
    if(t.k==='+'||t.k==='-'){ const pv=i>0?toks[i-1].k:null, bin=(pv==='num'||pv==='id'||pv===')');
      s+= bin ? (t.k==='+'?' + ':' − ') : (t.k==='-'?'−':''); continue; }
    if(t.k==='^'){ const n=toks[i+1];
      if(n&&n.k==='num'&&Number.isInteger(n.v)&&n.v>=0&&n.v<=9){ s+=hoch(n.v); i++; continue; }
      s+='^'; continue; }
    s+=t.k; }
  return s; }
const klammer=v=>(v<0?'(−'+zahl(-v)+')':zahl(v));

/* ---- Funktionszeilen (Tab Graph) ---- */
function retok(){ funcs.forEach(f=>f.toks=tokenize(f.term)); }
function markActive(){ document.querySelectorAll('#funcs .func').forEach((r,i)=>r.classList.toggle('active',i===activeIdx)); }
function neuRechnen(){ draw(); refreshTable(); refreshMachines(); }
function neuBauen(){ buildRows(); buildTable(); buildMachines(); updateSliders(); draw(); }
/* Term aus einem beliebigen Tab übernehmen */
function termGeaendert(i,wert,ausser){ if(!funcs[i]) return; funcs[i].term=wert; funcs[i].toks=tokenize(wert);
  updateSliders(); draw();
  if(ausser!=='t') refreshTable(); else refreshTable(true);
  if(ausser!=='m') refreshMachines(); else refreshMachines(true);
  if(ausser!=='g'){ const el=document.querySelectorAll('#funcs .fterm')[i]; if(el&&document.activeElement!==el) el.value=wert; }
  sync(); }
/* Term verdecken: er bleibt erhalten, ist aber nirgends zu sehen (Raetselaufgabe) */
function maskeZeigen(root,f,i){ const inp=root.querySelector('.fterm'), vd=root.querySelector('.verdeckt'), b=root.querySelector('.fhide');
  if(!inp||!vd||!b) return; const h=!!f.hide;
  inp.style.display=h?'none':''; vd.style.display=h?'':'none';
  b.classList.toggle('on',h); b.title=h?'Term wieder zeigen':'Term verdecken';
  if(!b.onclick) b.onclick=()=>{ funcs[i].hide=!funcs[i].hide; if(lastInp===inp) lastInp=null; neuBauen(); sync(); }; }
function funcLoeschen(i){ funcs.splice(i,1); if(activeIdx>=funcs.length)activeIdx=funcs.length-1; neuBauen(); sync(); }
function funcNeu(){ funcs.push({term:'', color:GCOL[funcs.length%GCOL.length], width:DEFW, mx:'2', hide:false, toks:[]}); activeIdx=funcs.length-1; neuBauen(); sync();
  const sel=tab==='g'?'#funcs .fterm':(tab==='t'?'#pT .fterm':'#pM .fterm');
  const inps=document.querySelectorAll(sel), last=inps[inps.length-1]; if(last){ lastInp=last; try{ last.focus(); }catch(_){} } }

function buildRows(){ const host=$('funcs'); host.innerHTML='';
  funcs.forEach((f,i)=>{ const row=document.createElement('div'); row.className='frow func'+(i===activeIdx?' active':'');
    row.innerHTML='<span class="fcol"></span><b class="fname"></b><input class="fterm" spellcheck="false" placeholder="z. B. a*x^2+b*x+c, sin(a*x), 1/x"><span class="verdeckt">? ? ?</span><button class="fhide" type="button">👁</button><button class="fdel" title="Funktion entfernen">×</button>';
    const dot=row.querySelector('.fcol'); dot.style.background=f.color;
    dot.title='Farbe dieser Funktion wählen';
    dot.onclick=e=>{ e.stopPropagation(); farbwahl(i,dot); };
    const nm=row.querySelector('.fname'); nm.textContent='f'+sub(i+1)+'(x)='; nm.style.color=f.color;
    const inp=row.querySelector('.fterm'); inp.value=f.term; if(keysOn) inp.inputMode='none';
    inp.addEventListener('focus',()=>{ activeIdx=i; lastInp=inp; markActive(); sync(); });
    inp.addEventListener('input',()=>termGeaendert(i,inp.value,'g'));
    const del=row.querySelector('.fdel'); del.style.display=funcs.length>1?'':'none';

/* ---- Zeichnen ---- */
function fmt(n){ const r=Math.round(n*1000)/1000; return String(r); }
function gridStep(){ const raw=44/view.unit, p=Math.pow(10,Math.floor(Math.log10(raw))); for(const m of [1,2,5,10]){ if(p*m>=raw) return p*m; } return p*10; }
function draw(){ if(!W||!H) return;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const u=view.unit, ox=view.ox, oy=view.oy, step=gridStep();
  const xmin=(0-ox)/u, xmax=(W-ox)/u, ymin=(oy-H)/u, ymax=(oy-0)/u;
  ctx.strokeStyle='#eef1f6'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=Math.ceil(xmin/step)*step; x<=xmax; x+=step){ const px=ox+x*u; ctx.moveTo(px,0); ctx.lineTo(px,H); }
  for(let y=Math.ceil(ymin/step)*step; y<=ymax; y+=step){ const py=oy-y*u; ctx.moveTo(0,py); ctx.lineTo(W,py); }
  ctx.stroke();
  ctx.strokeStyle='#98a2b3'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(W,oy); ctx.moveTo(ox,0); ctx.lineTo(ox,H); ctx.stroke();
  ctx.fillStyle='#667085'; ctx.font=(fontItalic?'italic ':'')+(fontBold?'bold ':'')+fontSize+'px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(let x=Math.ceil(xmin/step)*step; x<=xmax; x+=step){ if(Math.abs(x)<1e-9)continue; ctx.fillText(fmt(x), ox+x*u, Math.min(Math.max(oy+3,2),H-fontSize-3)); }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let y=Math.ceil(ymin/step)*step; y<=ymax; y+=step){ if(Math.abs(y)<1e-9)continue; ctx.fillText(fmt(y), Math.min(Math.max(ox-4,fontSize*2),W-2), oy-y*u); }
  // Graphen
  let anyOk=false, anyTerm=false;
  funcs.forEach(f=>{ if(!f.toks.length)return; anyTerm=true;
    ctx.strokeStyle=f.color; ctx.lineWidth=f.width||DEFW; ctx.beginPath(); let prev=null;
    for(let px=0;px<=W;px++){ const x=(px-ox)/u; const y=evalAt(x,f.toks); const py=oy-y*u;
      if(!isFinite(py)){ prev=null; continue; } anyOk=true;
      if(prev!==null && Math.abs(py-prev)>H*3){ ctx.moveTo(px,py); } else if(prev===null){ ctx.moveTo(px,py); } else { ctx.lineTo(px,py); } prev=py; }
    ctx.stroke(); });

}
/* ---- bewegliche Punkte auf x- und y-Achse ---- */
function beschrift(t,x,y,col,al){ ctx.save(); ctx.font='700 '+Math.max(11,fontSize+1)+'px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.textAlign=al||'left'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  ctx.lineWidth=3.5; ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.strokeText(t,x,y);
  ctx.fillStyle=col; ctx.fillText(t,x,y); ctx.restore(); }
function griff(px,py,col){ ctx.save(); ctx.beginPath(); ctx.arc(px,py,9,0,7); ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=2.6; ctx.strokeStyle=col; ctx.stroke();
  ctx.beginPath(); ctx.arc(px,py,3.2,0,7); ctx.fillStyle=col; ctx.fill(); ctx.restore(); }
/* x-Werte mit f(x) = yv im sichtbaren Bereich suchen */
function loesungen(T,yv){ const u=view.unit, x0=(0-view.ox)/u, x1=(W-view.ox)/u, N=720;
  const g=x=>evalAt(x,T)-yv, tol=0.8/u, V=[], res=[];
  for(let i=0;i<=N;i++){ const x=x0+(x1-x0)*i/N; V.push({x,v:g(x)}); }
  for(let i=1;i<V.length&&res.length<16;i++){ const A=V[i-1], B=V[i];     /* Vorzeichenwechsel: genau einschachteln */
    if(!isFinite(A.v)||!isFinite(B.v)) continue;
    if(A.v===0&&B.v===0) continue;                                        /* waagrechtes Stueck: keine einzelne Loesung */
    if(A.v*B.v>0) continue;
    let a=A.x,b=B.x,fa=A.v;
    for(let k=0;k<60;k++){ const m=(a+b)/2, fm=g(m); if(!isFinite(fm)) break; if(fa*fm<=0) b=m; else { a=m; fa=fm; } }
    res.push((a+b)/2); }
  for(let i=1;i<V.length-1&&res.length<16;i++){ const A=V[i-1], B=V[i], C=V[i+1];   /* Beruehrpunkte ohne Vorzeichenwechsel (Scheitel) */
    if(!isFinite(A.v)||!isFinite(B.v)||!isFinite(C.v)) continue;
    if(Math.abs(B.v)>=tol||Math.abs(B.v)>Math.abs(A.v)||Math.abs(B.v)>Math.abs(C.v)) continue;
    if(Math.abs(B.v)>=Math.abs(A.v)&&Math.abs(B.v)>=Math.abs(C.v)) continue;        /* nichts faellt ab: waagrechter Verlauf */
    const h=(x1-x0)/N, den=C.v-2*B.v+A.v;                                            /* Scheitel der Parabel durch A,B,C: genauer als das Raster */
    let xv=B.x; if(den!==0){ const dx=-h/2*(C.v-A.v)/den; if(Math.abs(dx)<=h) xv=B.x+dx; }
    res.push(xv); }
  const aus=[]; res.forEach(x=>{ if(!aus.some(y=>Math.abs(y-x)<1.5/u)) aus.push(x); });
  return aus.sort((p,q)=>p-q); }
function achsenPunkte(){ const u=view.unit, ox=view.ox, oy=view.oy, zk=v=>zahl(Math.round(v*1000)/1000);
  if(xPt.on){ const px=ox+xPt.v*u; let n=0;
    funcs.forEach(f=>{ if(!f.toks.length) return; const y=evalAt(xPt.v,f.toks); if(!isFinite(y)) return; const py=oy-y*u;
      ctx.save(); ctx.strokeStyle=f.color; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(px,oy); ctx.lineTo(px,py); ctx.lineTo(ox,py); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.fillStyle=f.color; ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fill(); ctx.restore();
      beschrift('y = '+zk(y), ox+11, py-12-(n++%2)*15, f.color,'left'); });
    griff(px,oy,'#1f2430'); beschrift('x = '+zk(xPt.v), px+12, oy+16, '#1f2430','left'); }
  if(yPt.on){ const py=oy-yPt.v*u;
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(W,py); ctx.stroke(); ctx.restore();
    let n=0;
    funcs.forEach(f=>{ if(!f.toks.length) return; loesungen(f.toks,yPt.v).forEach(x0=>{ const px=ox+x0*u;
      ctx.save(); ctx.strokeStyle=f.color; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,oy); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.fillStyle=f.color; ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fill(); ctx.restore();
      beschrift('x = '+zk(x0), px, py-14-(n++%2)*15, f.color,'center'); }); });
    griff(ox,py,'#1f2430'); beschrift('y = '+zk(yPt.v), ox+13, py+16, '#1f2430','left'); }
}

/* ---- Gesten (Pinch/Pan) + Punkte ziehen ---- */
const pts=new Map(); let base=null, dragM=null;
function local(a){ const r=cv.getBoundingClientRect(); return {x:(a.reduce((s,p)=>s+p.x,0)/a.length)-r.left, y:(a.reduce((s,p)=>s+p.y,0)/a.length)-r.top}; }

  base={dist,unit:view.unit, wx:(mid.x-view.ox)/view.unit, wy:(view.oy-mid.y)/view.unit}; }
function zieheM(mx,my){ const st=gridStep()/10;
  if(dragM==='x') xPt.v=Math.round(((mx-view.ox)/view.unit)/st)*st;
  else yPt.v=Math.round(((view.oy-my)/view.unit)/st)*st;
  draw(); }
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(pts.size===0){                                       /* liegt der Finger auf einem Achsenpunkt? Dann ziehen statt verschieben */
    if(xPt.on&&Math.hypot(mx-(view.ox+xPt.v*view.unit),my-view.oy)<26){ dragM='x'; cv.setPointerCapture(e.pointerId); zieheM(mx,my); return; }
    if(yPt.on&&Math.hypot(mx-view.ox,my-(view.oy-yPt.v*view.unit))<26){ dragM='y'; cv.setPointerCapture(e.pointerId); zieheM(mx,my); return; } }

cv.addEventListener('pointermove',e=>{ if(dragM){ const r=cv.getBoundingClientRect(); zieheM(e.clientX-r.left,e.clientY-r.top); return; }
  if(!pts.has(e.pointerId))return; const p=pts.get(e.pointerId); p.x=e.clientX; p.y=e.clientY;
  if(!base)return; const a=[...pts.values()]; const mid=local(a); let unit=base.unit; if(a.length>=2){ const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1; unit=base.unit*(d/base.dist); }
  view.unit=Math.max(4,Math.min(5000,unit)); view.ox=mid.x-base.wx*view.unit; view.oy=mid.y+base.wy*view.unit; draw(); });
function endP(e){ if(dragM){ dragM=null; sync(); return; }

cv.addEventListener('pointerup',endP); cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const wx=(mx-view.ox)/view.unit, wy=(view.oy-my)/view.unit, f=Math.exp(-e.deltaY*0.0015);
  view.unit=Math.max(4,Math.min(5000,view.unit*f)); view.ox=mx-wx*view.unit; view.oy=my+wy*view.unit; draw(); sync(); },{passive:false});

/* ---- Eingabe & Sync ---- */
$('fit').onclick=()=>{ view={ox:W/2,oy:H/2,unit:40}; draw(); sync(); };
let uiK=null; function applyUiFont(){ const k=(fontSize||13)/13; if(k===uiK&&document.body.classList.contains('fb')===fontBold&&document.body.classList.contains('fi')===fontItalic) return; uiK=k; document.documentElement.style.setProperty('--k',k); document.body.classList.toggle('fb',fontBold); document.body.classList.toggle('fi',fontItalic); }
function zustand(){ return {funcs:funcs.map(f=>({term:f.term,color:f.color,width:f.width,mx:f.mx,hide:!!f.hide})), params, view, fontSize, fontBold, fontItalic, activeIdx, tab, xs:xs.slice(), xPt:{on:xPt.on,v:xPt.v}, yPt:{on:yPt.on,v:yPt.v}}; }
function sync(){ if(window.parent===window) return; /* allein geöffnet: nicht an sich selbst senden */ try{ parent.postMessage({type:'embed-data',data:zustand()},'*'); }catch(e){} }
addEventListener('message',e=>{ if(e.source!==window&&(window.parent===window||e.source!==window.parent)) return;   // eigene Nachrichten ignorieren
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data))return; const d=e.data.data;
  let nf=d.funcs;
  if(!nf && d.term!==undefined) nf=[{term:d.term}];                 // Altformat {term} migrieren
  let strukturNeu=false;
  if(nf&&nf.length){ nf.forEach((g,i)=>{ if(g.color==null)g.color=GCOL[i%GCOL.length]; if(g.width==null)g.width=DEFW; if(g.mx==null)g.mx='2'; });
    const same = nf.length===funcs.length && nf.every((g,i)=>g.term===funcs[i].term);
    if(same){ nf.forEach((g,i)=>{ funcs[i].color=g.color; funcs[i].width=g.width; funcs[i].mx=g.mx; funcs[i].hide=!!g.hide; });   // nur Farbe/Dicke → Eingaben nicht neu bauen (Fokus bleibt)
      document.querySelectorAll('#funcs .func').forEach((r,i)=>{ if(funcs[i]){ r.querySelector('.fcol').style.background=funcs[i].color; r.querySelector('.fname').style.color=funcs[i].color; maskeZeigen(r,funcs[i],i); } }); }
    else { funcs=nf.map(g=>({term:g.term||'', color:g.color, width:g.width, mx:g.mx, hide:!!g.hide, toks:tokenize(g.term||'')})); if(activeIdx>=funcs.length)activeIdx=funcs.length-1; strukturNeu=true; }
  }
  if(d.activeIdx!=null && d.activeIdx<funcs.length){ activeIdx=d.activeIdx; markActive(); }
  if(d.params) params=Object.assign({a:1,b:0,c:0},d.params);
  if(d.view) view=Object.assign({ox:W/2,oy:H/2,unit:40},d.view);
  if(Array.isArray(d.xs)&&d.xs.length){ const neu=d.xs.map(String); if(neu.join('\u0001')!==xs.join('\u0001')){ xs=neu; strukturNeu=true; } }
  if(d.xPt) xPt={on:!!d.xPt.on, v:(typeof d.xPt.v==='number'&&isFinite(d.xPt.v))?d.xPt.v:1};
  if(d.yPt) yPt={on:!!d.yPt.on, v:(typeof d.yPt.v==='number'&&isFinite(d.yPt.v))?d.yPt.v:1};
  if(d.fontSize)fontSize=d.fontSize; fontBold=!!d.fontBold; fontItalic=!!d.fontItalic; uiK=null; applyUiFont();
  achsBtns();
  if(strukturNeu){ buildRows(); buildTable(); buildMachines(); }
  updateSliders();
  if(d.tab&&d.tab!==tab) setTab(d.tab); else { draw(); refreshTable(); refreshMachines(); } });
addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(()=>{ if(tab==='g'&&(cv.clientWidth!==W||cv.clientHeight!==H)) resize(); }).observe($('wrap'));   // Eingabezeilen wachsen mit → Zeichenfläche anpassen
retok();
function plotImage(){ const im=TafelShot.rasterize($('wrap'),{exclude:'#err'}), S=2, g=im.canvas.getContext('2d');
  const lines=[]; document.querySelectorAll('#funcs .func').forEach((r,i)=>{ const t=r.querySelector('.fterm').value.trim(); if(t&&funcs[i])
    lines.push({col:funcs[i].color,txt:r.querySelector('.fname').textContent.replace('=',' = ')+(funcs[i].hide?'? ? ?':t)}); });
  const ps=[...document.querySelectorAll('#sliders .sl')].map(r=>r.querySelector('label').textContent.replace(/[=\s]+$/,'').trim()+' = '+r.querySelector('.v').textContent.trim()); if(ps.length) lines.push({col:'#475569',txt:ps.join('   ')});
  if(!lines.length) return im;
  g.setTransform(S,0,0,S,0,0); const fs=Math.max(12,fontSize+1); g.font='700 '+fs+'px -apple-system,BlinkMacSystemFont,sans-serif'; g.textBaseline='middle';
  const lh=fs*1.45, bw=Math.min(im.w-16,Math.max(...lines.map(l=>g.measureText(l.txt).width))+28), bh=lines.length*lh+10;
  g.fillStyle='rgba(255,255,255,.93)'; g.strokeStyle='#cbd5e1'; g.lineWidth=1; g.beginPath(); g.rect(8,8,bw,bh); g.fill(); g.stroke();
  lines.forEach((l,i)=>{ const y=8+5+lh*(i+0.5); g.fillStyle=l.col; if(i<lines.length-(ps.length?1:0)){ g.beginPath(); g.arc(20,y,5,0,7); g.fill(); } g.fillText(l.txt,32,y); });
  return im; }
function tabBild(){ if(tab==='t') return TafelShot.rasterize($('ttab')||$('pT'),{pad:8,exclude:'.fdel,.fhide'});
  if(tab==='m') return TafelShot.rasterize($('mlist')||$('pM'),{pad:8,exclude:'.fdel,.fhide,.mtr,.mch'});
  return plotImage(); }
/* ---- Formel-Tastatur ---- */
let keysOn=false, lastInp=null;
const KP_CHIPS=[['sin','sin('],['cos','cos('],['tan','tan('],['√','sqrt('],['ln','ln('],['eˣ','exp('],['|x|','abs('],['π','pi'],['²','^2'],['a','a'],['b','b'],['c','c']];
const KP_ROWS=[[['7','7'],['8','8'],['9','9'],['(','(',1],[')',')',1],['⌫',null,0,'del']],
  [['4','4'],['5','5'],['6','6'],['×','*',1],['÷','/',1],['^','^',1]],
  [['1','1'],['2','2'],['3','3'],['+','+',1],['−','-',1],['x','x',1]],
  [['0','0'],['.','.'],['◀',null,0,'left'],['▶',null,0,'right'],['ABC',null,0,'abc'],['✓ Fertig',null,0,'enter','act']]];
function kpTarget(){ if(lastInp&&document.contains(lastInp)&&lastInp.offsetParent){
    if(document.activeElement!==lastInp){ try{ lastInp.focus({preventScroll:true}); const n=lastInp.value.length; lastInp.setSelectionRange(n,n); }catch(_){} }
    return lastInp; }
  const sel=tab==='g'?'#funcs .fterm':(tab==='t'?'#pT .fterm':'#pM .fterm');
  const inps=[...document.querySelectorAll(sel)].filter(e=>e.offsetParent); const el=inps[Math.min(activeIdx,inps.length-1)];
  if(el&&document.activeElement!==el){ try{ el.focus({preventScroll:true}); const n=el.value.length; el.setSelectionRange(n,n); }catch(_){} }
  if(el) lastInp=el; return el; }
function buildKeypad(){ const kp=$('keypad'); if(kp.dataset.built) return; kp.dataset.built='1';
  const ch=document.createElement('div'); ch.className='kp-row chips'; KP_CHIPS.forEach(([l,ins])=>{ const b=document.createElement('button'); b.className='fn'; b.textContent=l; b.dataset.ins=ins; ch.appendChild(b); }); kp.appendChild(ch);
  KP_ROWS.forEach(r=>{ const d=document.createElement('div'); d.className='kp-row';
    r.forEach(([l,ins,op,act,cls])=>{ const b=document.createElement('button'); b.textContent=l; if(op)b.classList.add('op'); if(cls)b.classList.add(cls); if(act==='del')b.classList.add('del'); if(ins!=null)b.dataset.ins=ins; if(act)b.dataset.act=act; d.appendChild(b); });
    kp.appendChild(d); });
  kp.addEventListener('pointerdown',e=>{ const b=e.target.closest('button'); if(!b) return; e.preventDefault(); const el=kpTarget(); if(!el) return;
    const s=el.selectionStart==null?el.value.length:el.selectionStart, en=el.selectionEnd==null?s:el.selectionEnd;
    const set=(v,c)=>{ el.value=v; try{ el.setSelectionRange(c,c); }catch(_){} el.dispatchEvent(new Event('input',{bubbles:true})); };
    if(b.dataset.ins!==undefined){ const t=b.dataset.ins; set(el.value.slice(0,s)+t+el.value.slice(en),s+t.length); return; }
    const a=b.dataset.act;
    if(a==='del'){ if(en>s) set(el.value.slice(0,s)+el.value.slice(en),s); else if(s>0) set(el.value.slice(0,s-1)+el.value.slice(s),s-1); }
    else if(a==='left'){ const c=Math.max(0,s-1); try{ el.setSelectionRange(c,c); }catch(_){} }
    else if(a==='right'){ const c=Math.min(el.value.length,en+1); try{ el.setSelectionRange(c,c); }catch(_){} }
    else if(a==='abc'){ setKeypad(false); try{ el.blur(); el.focus(); }catch(_){} }
    else if(a==='enter'){ el.blur(); setKeypad(false); } }); }
function setKeypad(on){ keysOn=!!on; buildKeypad(); const kp=$('keypad'); kp.classList.toggle('show',keysOn); $('btnKeys').classList.toggle('on',keysOn);
  document.body.classList.toggle('kp-open',keysOn); if(keysOn) document.documentElement.style.setProperty('--kph',kp.offsetHeight+'px');
  document.querySelectorAll('.fterm').forEach(i=>i.inputMode=keysOn?'none':'text');
  document.querySelectorAll('.xin,.mxin').forEach(i=>i.inputMode=keysOn?'none':'decimal');
  if(keysOn) kpTarget(); }
$('btnKeys').addEventListener('pointerdown',e=>e.preventDefault());
$('btnKeys').onclick=()=>setKeypad(!keysOn);
for(const [id,d] of [['fsM',-1],['fsP',1]]) $(id).onclick=()=>{ fontSize=Math.max(8,Math.min(36,(fontSize||13)+d)); applyUiFont(); neuRechnen(); sync(); };
if(window.TafelShot) TafelShot.buttons($('shotBtns'),tabBild,'','border:none;border-radius:8px;background:#e7ebf1;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:600;color:#1f2430;');
if(window.TafelTeilen&&!TafelTeilen.istGeteilt())
  TafelTeilen.knopf($('teilenBtn'),'plotter.html',()=>({w:'plot1', d:zustand()}),{cls:'fsb'});
window.addEventListener('load',()=>{ document.body.classList.add('t-g');
  resize(); buildRows(); buildTable(); buildMachines(); updateSliders(); achsBtns();
  if(window.TafelTeilen&&TafelTeilen.istGeteilt()){
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='plot1'&&p.d) TafelTeilen.einspielen(p.d); }).catch(()=>{});
    return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
