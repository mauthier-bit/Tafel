const LMBSP=[
  ['ganzrational',            ['x^3−2x^2+1','−x^4+3x^2','2x^3−x','(x−1)(x+2)']],
  ['gebrochen-rational',      ['1/(x−2)','1/x^2','(x^2+1)/(x^2−4)','(3x^2−12)/(x^2−9)','(2x^3−x)/(x^2+1)','(x^2+1)/x','(x^2−1)/(x−1)','(x^2+2x)/(x+2)','(3x^2−12)/(x^2−4x+4)','(x−1)/(x^2−1)']],
  ['e-Funktion',              ['e^x/x','x*e^(−x)','x^2*e^(−x)','e^(−x^2)','1/(1+e^(−x))','(e^x−1)/(e^x+1)']],
  ['Logarithmus und Wurzel',  ['ln(x)','ln(x)/x','x*ln(x)','ln(x−1)','sqrt(x−1)','sqrt(4−x^2)','sqrt(x^2+1)−x']],
  ['Sinus und Kosinus',       ['sin(x)','sin(x)/x','tan(x)','1/sin(x)','sin(x)*e^(−x)']]];
/* Der Knopf steht nur bereit, wenn sich der Vergleichsterm am Term ablesen lässt –
   also bei ganz- und gebrochen-rationalen Termen. Sonst bleibt er ausgegraut. */
function lmGrossUI(){ const b=$('lmGross'); if(!b) return;
  const v=lmErg&&lmErg.vergleich;
  b.disabled=!v;
  b.classList.toggle('on',!!v&&!!lm.gross);
  b.title=v?'Verhalten für große Beträge von x: nur die größten Potenzen zählen'
           :'Nur bei ganz- und gebrochen-rationalen Termen: dort lassen sich die größten Potenzen ablesen'; }
/* Weit hinauszoomen, bis alle Lücken klein beieinander liegen – dann fallen f und
   der Vergleichsterm im Bild zusammen. */
function lmGrossBlick(){ const e=lmErg; if(!e||!e.vergleich||!lmW) return;
  const xs=e.pole.concat(e.loecher.map(o=>o.x), e.raender.map(r=>r.x)).filter(isFinite).map(Math.abs);
  const m=xs.length?Math.max.apply(null,xs):0;
  const xg=Math.max(40,Math.ceil((m+5)*4));
  lmBereich(-xg,xg); }
let lmTO=null, lmLetzt='';
function lmNeu(sofort){
  const t=lm.term||'';
  const inp=$('lmTerm'); if(inp&&document.activeElement!==inp&&inp.value!==t) inp.value=t;
  const as=$('lmAs'); if(as) as.classList.toggle('on',!!lm.asym);
  lmGrossUI(); lmKehrUI();
  const rechne=()=>{ if(t!==lmLetzt) lmSel=-1;
    lmErg=lmAnalyse(); if(lmSel>=lmErg.karten.length) lmSel=-1;
    if(t!==lmLetzt){ lmLetzt=t; updateSliders(); lmText();
      /* ist „|x| groß“ an, bleibt auch beim neuen Term der weite Blick */
      if(lm.gross&&lmErg.vergleich) lmGrossBlick(); else lmFit(); }
    else { lmText(); lmDraw(); } };
  clearTimeout(lmTO);
  if(sofort===false) lmTO=setTimeout(rechne,260); else rechne(); }
(function lmUi(){
  const sel=$('lmBsp'); if(sel){ sel.innerHTML='<option value="">Beispiele …</option>'+
      LMBSP.map(g=>'<optgroup label="'+g[0]+'">'+g[1].map(t=>'<option>'+t+'</option>').join('')+'</optgroup>').join('');
    sel.onchange=()=>{ if(!sel.value) return; lm.term=sel.value; sel.value='';
      $('lmTerm').value=lm.term; lmLetzt=''; lmNeu(); sync(); }; }
  const inp=$('lmTerm');
  if(inp){ inp.addEventListener('input',()=>{ lm.term=inp.value; lmNeu(false); sync(); });
    inp.addEventListener('focus',()=>{ lastInp=inp; if(keysOn) kpTarget(); }); }
  const as=$('lmAs'); if(as) as.onclick=()=>{ lm.asym=!lm.asym; as.classList.toggle('on',lm.asym); lmDraw(); sync(); };
  const gr=$('lmGross'); if(gr) gr.onclick=()=>{ if(gr.disabled) return;
    lm.gross=!lm.gross; lmGrossUI(); lmText();
    if(lm.gross) lmGrossBlick(); else lmDraw();
    sync(); };
  const kw=$('lmKehr'); if(kw) kw.onclick=()=>{ lm.kehr=!lm.kehr;
    lmKehrUI(); lmKehrZeile(); lmDraw(); sync(); };
  const fit=$('lmFit'); if(fit) fit.onclick=()=>{ lmFit(); sync(); };
  const zm=$('lmZm'), zp=$('lmZp');
  /* zoomt x und y gleichermaßen */
  const zoomUm=(mx,my,f)=>{ const x=(mx-lmView.ox)/lmView.ux, y=(lmView.oy-my)/lmView.uy;
    lmView.ux=Math.max(0.05,Math.min(4000,lmView.ux*f)); lmView.uy=Math.max(0.05,Math.min(4000,lmView.uy*f));
    lmView.ox=mx-x*lmView.ux; lmView.oy=my+y*lmView.uy; lmDraw(); };
  const zoom=f=>{ zoomUm(lmW/2,lmH/2,f); sync(); };
  if(zm) zm.onclick=()=>zoom(1/1.3); if(zp) zp.onclick=()=>zoom(1.3);
  const el=$('plotL'); if(!el) return;
  const zs=new Map(); let last=null, g0=null, u0={ux:40,uy:40};
  const lok=e=>{ const r=el.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  el.addEventListener('pointerdown',e=>{ el.setPointerCapture&&el.setPointerCapture(e.pointerId);
    zs.set(e.pointerId,lok(e));
    if(zs.size===2){ const [a,b]=[...zs.values()], mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      /* Merken, wie die Finger stehen: waagrecht zoomt nur x, senkrecht nur y, schräg beides */
      g0={a:a.slice(), b:b.slice(), wx:(mx-lmView.ox)/lmView.ux, wy:(lmView.oy-my)/lmView.uy};
      u0={ux:lmView.ux,uy:lmView.uy}; }
    last={x:e.clientX,y:e.clientY}; });
  el.addEventListener('pointermove',e=>{ if(!zs.has(e.pointerId)) return; zs.set(e.pointerId,lok(e));
    if(zs.size===2&&g0){ const [a,b]=[...zs.values()];
      const f=zoomF({x:g0.a[0],y:g0.a[1]},{x:g0.b[0],y:g0.b[1]},{x:a[0],y:a[1]},{x:b[0],y:b[1]});
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      lmView.ux=Math.max(0.05,Math.min(4000,u0.ux*f[0]));
      lmView.uy=Math.max(0.05,Math.min(4000,u0.uy*f[1]));
      lmView.ox=mx-g0.wx*lmView.ux; lmView.oy=my+g0.wy*lmView.uy; lmDraw(); return; }
    if(!last) return; lmView.ox+=e.clientX-last.x; lmView.oy+=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; lmDraw(); });
  const auf=e=>{ zs.delete(e.pointerId); if(zs.size<2) g0=null; if(!zs.size){ last=null; sync(); } };
  el.addEventListener('pointerup',auf); el.addEventListener('pointercancel',auf);
  el.addEventListener('wheel',e=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0015), p=lok(e);
    const x=(p[0]-lmView.ox)/lmView.ux, y=(lmView.oy-p[1])/lmView.uy;
    if(!e.altKey) lmView.ux=Math.max(0.05,Math.min(4000,lmView.ux*f));     /* Umschalt: nur x, Alt: nur y */
    if(!e.shiftKey) lmView.uy=Math.max(0.05,Math.min(4000,lmView.uy*f));
    lmView.ox=p[0]-x*lmView.ux; lmView.oy=p[1]+y*lmView.uy; lmDraw(); },{passive:false});
})();


/* ================= Reiter „Umkehrfunktion" =================================================
   Zu einem Term werden die Bereiche gesucht, in denen f streng monoton – und damit umkehrbar –
   ist. Einen davon wählt man aus; für ihn wird der Graph der Umkehrfunktion eingezeichnet
   (Spiegelung an y = x), wahlweise nur mit einem wandernden Punkt und seinem Spiegelbild.
   Lässt sich der Term umkehren, steht f⁻¹(x) daneben – aber nur, wenn die Probe besteht.
   Untersucht wird ein fester Bereich (−20 bis 20); was darüber hinausgeht, steht als „…". */
/* Der Reiter steht für sich: eigener Term, eigene a, b, c – unabhängig von den anderen Reitern. */
let uk={term:'x^2', m:true, inv:true, pkt:false, tab:false, dw:false, asym:false, schritt:false,
        sel:-1, x0:null, p:{a:1,b:0,c:0}};
let ukView={ux:40,uy:40,ox:0,oy:0}, ukW=0, ukH=0, ukErg=null;
const UK_VON=-20, UK_BIS=20, UK_N=6000;          /* untersuchter Bereich und Feinheit des Rasters */
const UK_F='#2563eb';                            /* f: blau wie überall */
const UK_INV='#7c3aed';                          /* Umkehrfunktion: violett */
const UK_STEIG='#16a34a', UK_FALL='#ea580c';     /* Monotoniebereiche: steigend grün, fallend orange */
const UK_DIAG='#94a3b8';                         /* Spiegelachse y = x */

/* ---- Monotoniebereiche suchen ----
   Gerastert wird mit 6000 Schritten. Getrennt wird dort, wo f nicht definiert ist, wo der
   Graph springt (Polstelle) und an jeder Extremstelle; dazwischen ist f streng monoton. */
/* Extremstelle einkreisen. Die ternäre Suche auf f kommt nur bis etwa 1e−8 heran – dicht am
   Hochpunkt sind die Funktionswerte kaum noch zu unterscheiden. Darum wird danach die
   Nullstelle der Steigung halbiert; das trifft π/2 genau genug, um es als π/2 zu erkennen. */
function ukExtrem(f,a,b,max){
  let lo=a, hi=b;
  for(let i=0;i<60&&hi-lo>1e-9;i++){ const m1=lo+(hi-lo)/3, m2=hi-(hi-lo)/3;
    const y1=f(m1), y2=f(m2);
    if(!isFinite(y1)||!isFinite(y2)) break;
    if(max?(y1<y2):(y1>y2)) lo=m1; else hi=m2; }
  const h=1e-6, abl=x=>{ const p=f(x+h), q=f(x-h); return (isFinite(p)&&isFinite(q))?(p-q)/(2*h):NaN; };
  let u=a, v=b, au=abl(u), av=abl(v);
  if(isFinite(au)&&isFinite(av)&&au*av<0){
    for(let i=0;i<70&&v-u>1e-13;i++){ const m=(u+v)/2, am=abl(m);
      if(!isFinite(am)) break;
      if(au*am<=0){ v=m; av=am; } else { u=m; au=am; } }
    return (u+v)/2; }
  return (lo+hi)/2; }
function ukPolNah(f,a,b){                         /* Vorzeichenwechsel bei großen Beträgen: dazwischen der Pol */
  const vz=Math.sign(f(a));
  for(let i=0;i<70&&b-a>1e-12;i++){ const m=(a+b)/2, y=f(m);
    if(!isFinite(y)) return m;
    if(Math.sign(y)===vz) a=m; else b=m; }
  return (a+b)/2; }
function ukLueckeNah(f,drin,raus){               /* bis dicht an die Definitionslücke herantasten */
  for(let i=0;i<60;i++){ const m=(drin+raus)/2;
    if(isFinite(f(m))) drin=m; else raus=m; }
  return drin; }
function ukBereiche(f,ast){
  const h=(UK_BIS-UK_VON)/UK_N, xs=[], ys=[];
  for(let i=0;i<=UK_N;i++){ const x=UK_VON+i*h; xs.push(x); ys.push(f(x)); }
  /* Trennstellen einsammeln: {x, art:'lücke'|'pol'|'extrem'} */
  const trenn=[], sprung=new Set();
  /* Polstellen rationaler Terme stehen exakt fest */
  const rat=ukRational(ast);
  if(rat&&pGrad(rat.n)>0) lmEinfach(pNull(rat.n)).forEach(x0=>{
    if(x0>UK_VON&&x0<UK_BIS) trenn.push({x:x0,art:'pol',links:x0,rechts:x0}); });
  for(let i=1;i<=UK_N;i++){
    const gut0=isFinite(ys[i-1]), gut1=isFinite(ys[i]);
    if(gut0&&!gut1){ trenn.push({x:ukLueckeNah(f,xs[i-1],xs[i]),art:'lücke',rand:'links'}); sprung.add(i-1); sprung.add(i); continue; }
    if(!gut0&&gut1){ trenn.push({x:ukLueckeNah(f,xs[i],xs[i-1]),art:'lücke',rand:'rechts'}); sprung.add(i-1); sprung.add(i); continue; }
    if(!gut0||!gut1){ sprung.add(i-1); sprung.add(i); continue; }
    /* Sprung mit Vorzeichenwechsel bei großen Beträgen: dazwischen liegt eine Polstelle (z. B. tan) */
    if(ys[i-1]*ys[i]<0&&Math.abs(ys[i-1])>50&&Math.abs(ys[i])>50){
      trenn.push({x:ukPolNah(f,xs[i-1],xs[i]),art:'pol'}); sprung.add(i-1); sprung.add(i); } }
  /* Extremstellen: dort dreht die Richtung */
  for(let i=1;i<UK_N;i++){
    if(sprung.has(i-1)||sprung.has(i)||sprung.has(i+1)) continue;   /* neben einem Sprung ist kein Extremum */
    const a=ys[i-1], b=ys[i], c=ys[i+1];
    if(!isFinite(a)||!isFinite(b)||!isFinite(c)) continue;
    const d1=b-a, d2=c-b;
    if(d1===0&&d2===0) continue;
    if(d1>0&&d2<0) trenn.push({x:ukExtrem(f,xs[i-1],xs[i+1],true),art:'extrem'});
    else if(d1<0&&d2>0) trenn.push({x:ukExtrem(f,xs[i-1],xs[i+1],false),art:'extrem'}); }
  trenn.sort((p,q)=>p.x-q.x);
  /* daraus die Bereiche bauen */
  const ber=[]; let von=UK_VON, vonArt='rand';
  const stueck=(a,b,artA,artB)=>{
    if(b-a<1e-4) return;
    const m1=a+(b-a)*0.25, m2=a+(b-a)*0.75, y1=f(m1), y2=f(m2);
    if(!isFinite(y1)||!isFinite(y2)) return;
    /* Innen nachsehen, ob es wirklich streng monoton ist (Konstanten fallen hier heraus) */
    let steigt=0, faellt=0, letzt=NaN;
    for(let k=0;k<=40;k++){ const y=f(a+(b-a)*(k+0.5)/41);
      if(!isFinite(y)){ continue; }
      if(isFinite(letzt)){ if(y>letzt) steigt++; else if(y<letzt) faellt++; }
      letzt=y; }
    if(!steigt&&!faellt) return;                      /* konstant: nicht umkehrbar */
    ber.push({a,b,artA,artB,steigend:steigt>=faellt}); };
  trenn.forEach(t=>{ stueck(von,t.x,vonArt,t.art); von=t.x; vonArt=t.art; });
  stueck(von,UK_BIS,vonArt,'rand');
  return ber; }

/* ---- Term umkehren ----
   Kommt x genau einmal vor, lässt sich die Rechenkette von außen nach innen rückwärts gehen.
   Bei (ax+b)/(cx+d) steht x zweimal – dafür gibt es die eigene Formel. Jeder Vorschlag wird
   zum Schluss geprüft: nur wenn f⁻¹(f(x)) = x auf dem gewählten Bereich stimmt, wird er gezeigt. */
const ukZahlT=v=>{ const r=Math.round(v*1e9)/1e9; return String(r); };   /* Zahl im Termtext: Punkt, kein Komma */
function ukXZahl(nd){ if(!nd) return 0;
  if(nd.k==='id') return nd.n==='x'?1:0;
  return ukXZahl(nd.l)+ukXZahl(nd.r)+ukXZahl(nd.a); }
/* Teilterm als Text (ASCII), so dass tokenize ihn wieder lesen kann.
   „vari" ist der Name, unter dem x geschrieben wird – beim Rechenweg heißt es y. */
function ukText(nd,vari){ if(!nd) return '';
  const v=vari||'x', P={'+':1,'-':1,'*':2,'/':2,'^':3};
  const ein=(t,min)=>{ const p=P[t.k]||9; return p<min?'('+ukText(t,v)+')':ukText(t,v); };
  switch(nd.k){
    case 'num': return String(nd.v);
    case 'id': return nd.n==='x'?v:nd.n;
    case 'neg': return '−'+ein(nd.a,2);
    case 'fn': return nd.n+'('+ukText(nd.a,v)+')';
    case '^': return ein(nd.l,4)+'^'+ein(nd.r,4);
    case '*': return ein(nd.l,2)+'*'+ein(nd.r,2);
    case '/': return ein(nd.l,2)+'/'+ein(nd.r,3);
    case '+': return ukText(nd.l,v)+'+'+ein(nd.r,1);
    case '-': return ukText(nd.l,v)+'−'+ein(nd.r,2); }
  return ''; }
/* Termtext schön setzen (Brüche, Wurzeln, Hochzahlen) – für den Rechenweg */
function ukHtmlTerm(t){ const tk=tokenize(String(t));
  const a=tk.length?lmAst(tk):null;
  return a?lmOrigHtml(a,tk):String(t); }
/* y ist der bisher aufgebaute Umkehrterm (Text in der neuen Variablen x).
   Steht „schr" bereit, wird jeder Schritt mitgeschrieben: links die neue Seite,
   rechts der Rest in y, dazu der Rechenschritt am Rand – wie im Heft. */
function ukKette(nd,y,negativ,schr){
  if(!nd) return null;
  if(nd.k==='id'&&nd.n==='x') return y;
  const li=ukXZahl(nd.l), re=ukXZahl(nd.r), kl='('+y+')';
  const weiter=(kind,neu,hin)=>{
    if(schr) schr.push({l:ukHtmlTerm(neu), r:ukHtmlTerm(ukText(kind,'y')), hin:hin||''});
    return ukKette(kind,neu,negativ,schr); };
  const anz=t=>ohneTags(ukHtmlTerm(t));
  switch(nd.k){
    case 'neg': return weiter(nd.a,'−'+kl,'| · (−1)');
    case '+': return li? weiter(nd.l,kl+'−('+ukText(nd.r)+')','| − '+anz(ukText(nd.r)))
                       : weiter(nd.r,kl+'−('+ukText(nd.l)+')','| − '+anz(ukText(nd.l)));
    case '-': return li? weiter(nd.l,kl+'+('+ukText(nd.r)+')','| + '+anz(ukText(nd.r)))
                       : weiter(nd.r,'('+ukText(nd.l)+')−'+kl,'nach y umstellen');
    case '*': return li? weiter(nd.l,kl+'/('+ukText(nd.r)+')','| : '+anz(ukText(nd.r)))
                       : weiter(nd.r,kl+'/('+ukText(nd.l)+')','| : '+anz(ukText(nd.l)));
    case '/': return li? weiter(nd.l,kl+'*('+ukText(nd.r)+')','| · '+anz(ukText(nd.r)))
                       : weiter(nd.r,'('+ukText(nd.l)+')/'+kl,'| Kehrwert');
    case '^': {
      if(li&&!re){                                    /* x hoch Zahl */
        const n=evalAt(0,tokenize(ukText(nd.r)),uk.p);
        if(!isFinite(n)||n===0) return null;
        if(Math.abs(n-2)<1e-12) return weiter(nd.l,(negativ?'−':'')+'sqrt'+kl,
          '| Wurzel ziehen – zwei Vorzeichen möglich, im Bereich gilt y '+(negativ?'≤':'≥')+' 0');
        const wz=kl+'^(1/'+ukZahlT(n)+')';
        return weiter(nd.l,(negativ?'−':'')+wz,'| '+ukZahlT(n)+'-te Wurzel ziehen'); }
      if(re&&!li){                                    /* Zahl hoch x */
        const b=ukText(nd.l);
        if(b==='e') return weiter(nd.r,'ln'+kl,'| ln anwenden');
        return weiter(nd.r,'ln'+kl+'/ln('+b+')','| ln anwenden und durch ln('+b+') teilen'); }
      return null; }
    case 'fn': {
      const u=nd.a, UM={exp:'ln',sin:'asin',cos:'acos',tan:'atan'};
      if(nd.n==='sqrt') return weiter(u,kl+'^2','| quadrieren');
      if(nd.n==='ln') return weiter(u,'e^'+kl,'| e hoch beide Seiten');
      if(nd.n==='abs') return weiter(u,(negativ?'−':'')+kl,
        '| Betrag auflösen – im Bereich gilt y '+(negativ?'≤':'≥')+' 0');
      if(nd.n==='log') return weiter(u,'10^'+kl,'| 10 hoch beide Seiten');
      const g=UM[nd.n]; if(!g) return null;
      return weiter(u,g+kl,'| '+g+' anwenden'); } }
  return null; }
/* (a·x + b)/(c·x + d) – hier steht x zweimal, die Umkehrung ist wieder von dieser Form */
/* Summe aus Teilen [[Vorfaktor, Text], …] – Nullen fallen weg, ±1 wird nicht geschrieben */
function ukSumme(teile){ let out='';
  teile.forEach(([k,t])=>{ if(Math.abs(k)<1e-12) return;
    const neg=k<0, a=Math.abs(k);
    const kern=t?((Math.abs(a-1)<1e-12)?t:(ukZahlT(a)+'*'+t)):ukZahlT(a);
    out+=out?((neg?'−':'+')+kern):(neg?('−'+kern):kern); });
  return out||'0'; }
/* k·x + m als Termtext */
const ukLin=(k,m,v)=>ukSumme([[k,v||'x'],[m,'']]);
function ukRational(ast){ ratP=uk.p; const r=ast?lmRat(ast):null; ratP=null; return r; }
function ukMoebius(ast){
  const r=ukRational(ast); if(!r) return null;
  const z=pTrim(r.z), n=pTrim(r.n);
  if(pGrad(z)>1||pGrad(n)>1) return null;
  const a=z[1]||0, b=z[0]||0, c=n[1]||0, d=n[0]||0;
  if(Math.abs(a*d-b*c)<1e-12) return null;            /* kürzt sich zu einer Konstanten */
  if(Math.abs(a)<1e-12&&Math.abs(c)<1e-12) return null;
  const S=[], zh=ukSumme([[a,'y'],[b,'']]), nh=ukSumme([[c,'y'],[d,'']]);
  const z1=(l,r,hin)=>S.push({l:ukHtmlTerm(l), r:ukHtmlTerm(r), hin:hin||''});
  const anz=t=>ohneTags(ukHtmlTerm(t));
  if(Math.abs(c)<1e-12){                              /* lineare Funktion: (a·x + b)/d */
    const text='('+ukLin(d,-b)+')/('+ukZahlT(a)+')';
    z1('y',ukSumme([[a,'x'],[b,'']])+(Math.abs(d-1)<1e-12?'':'/'+ukZahlT(d)),'die Funktion');
    z1('x','('+zh+')'+(Math.abs(d-1)<1e-12?'':'/'+ukZahlT(d)),'x und y vertauschen');
    if(Math.abs(d-1)>1e-12) z1(ukSumme([[d,'x']]),zh,'| · '+ukZahlT(d));
    if(Math.abs(b)>1e-12) z1(ukSumme([[d,'x'],[-b,'']]),ukSumme([[a,'y']]),'| − '+ukZahlT(b));
    z1('y',text,'| : '+ukZahlT(a));
    return {text, schritte:S}; }
  /* y = (a·x + b)/(c·x + d)  ⇒  x = (b − d·y)/(c·y − a) */
  const text='('+ukLin(-d,b)+')/('+ukLin(c,-a)+')';
  const rechts=ukSumme([[b,''],[-d,'x']]);
  z1('y','('+ukSumme([[a,'x'],[b,'']])+')/('+ukSumme([[c,'x'],[d,'']])+')','die Funktion');
  z1('x','('+zh+')/('+nh+')','x und y vertauschen');
  z1('x*('+nh+')',zh,'| · ('+anz(nh)+')');
  z1(ukSumme([[c,'x*y'],[d,'x']]),zh,'ausmultiplizieren');
  z1(ukSumme([[c,'x*y'],[-a,'y']]),rechts,'alle Glieder mit y nach links');
  z1('y*('+ukLin(c,-a)+')',rechts,'y ausklammern');
  z1('y',text,'| : ('+anz(ukLin(c,-a))+')');
  return {text, schritte:S}; }
/* Quadratische Terme: über die Scheitelform y = A(x − s)² + t, Zweig nach der Lage des Bereichs */
function ukQuadrat(ast,ber){
  const r=ukRational(ast); if(!r||!ber) return null;
  const z=pTrim(r.z), n=pTrim(r.n);
  if(pGrad(n)>0||pGrad(z)!==2) return null;
  const A=z[2], B=z[1]||0, C=z[0]||0, s=-B/(2*A), t=C-B*B/(4*A);
  const kern=(Math.abs(t)<1e-12)?'x':('x'+(t<0?('+'+ukZahlT(-t)):('−'+ukZahlT(t))));
  const innen=(Math.abs(A-1)<1e-12)?('('+kern+')'):('(('+kern+')/('+ukZahlT(A)+'))');
  const plus=((ber.a+ber.b)/2>=s);
  const kopf=(Math.abs(s)<1e-12)?(plus?'':'−'):(ukZahlT(s)+(plus?'+':'−'));
  const text=kopf+'sqrt'+innen;
  /* Rechenweg über die Scheitelform */
  const S=[], z1=(l,r,hin)=>S.push({l:ukHtmlTerm(l), r:ukHtmlTerm(r), hin:hin||''});
  const scheitel=v=>(Math.abs(A-1)<1e-12?'':(ukZahlT(A)+'*'))+'('+v+
      (Math.abs(s)<1e-12?'':(s<0?('+'+ukZahlT(-s)):('−'+ukZahlT(s))))+')^2'+
      (Math.abs(t)<1e-12?'':(t<0?('−'+ukZahlT(-t)):('+'+ukZahlT(t))));
  const quad=v=>'('+v+(Math.abs(s)<1e-12?'':(s<0?('+'+ukZahlT(-s)):('−'+ukZahlT(s))))+')^2';
  const wurzelInnen=innen;
  z1('y',ukSumme([[A,'x^2'],[B,'x'],[C,'']]),'die Funktion');
  z1('y',scheitel('x'),'quadratische Ergänzung: Scheitelform');
  z1('x',scheitel('y'),'x und y vertauschen');
  if(Math.abs(t)>1e-12) z1(kern,(Math.abs(A-1)<1e-12?'':(ukZahlT(A)+'*'))+quad('y'),
    '| '+(t<0?'+ '+ukZahlT(-t):'− '+ukZahlT(t)));
  if(Math.abs(A-1)>1e-12) z1(innen,quad('y'),'| : '+ukZahlT(A));
  S.push({l:'±'+ukHtmlTerm('sqrt'+wurzelInnen),
          r:ukHtmlTerm('y'+(Math.abs(s)<1e-12?'':(s<0?('+'+ukZahlT(-s)):('−'+ukZahlT(s))))),
          hin:'| Wurzel ziehen – zwei Vorzeichen möglich'});
  S.push({l:ukHtmlTerm('y'),
          r:(Math.abs(s)<1e-12?'':ukHtmlTerm(ukZahlT(s))+' ')+(plus?'+':'−')+' '+ukHtmlTerm('sqrt'+wurzelInnen),
          hin:'im gewählten Bereich gilt y '+(plus?'≥':'≤')+' '+zahl(s)+' – also das '+(plus?'Plus':'Minus')});
  return {text, schritte:S}; }
/* Probe: stimmt f⁻¹(f(x)) = x im gewählten Bereich? */
/* Geprüft wird an 24 Stellen des Bereichs. Ein Treffer daneben lässt den Vorschlag durchfallen;
   Stellen, an denen sich der Vorschlag gar nicht ausrechnen lässt, zählen nicht mit – sonst fiele
   die dritte Wurzel durch, die hier nur für nichtnegative Zahlen gerechnet werden kann. */
function ukProbe(f,gToks,a,b){
  let n=0;
  for(let i=1;i<=24;i++){ const x=a+(b-a)*i/25, y=f(x);
    if(!isFinite(y)) continue;
    const z=evalAt(y,gToks,uk.p);
    if(!isFinite(z)) continue;
    if(Math.abs(z-x)>1e-6*(1+Math.abs(x))) return false;
    n++; }
  return n>=8; }
/* Umkehrterm zum gewählten Bereich – oder null */
function ukUmkehrTerm(e,ber){
  if(!e||!e.ok||!ber) return null;
  const ast=e.ast; if(!ast) return null;
  const kandidaten=[];
  if(ukXZahl(ast)===1){
    /* bei geraden Potenzen und Betrag hängt der Zweig davon ab, wo der Bereich liegt */
    [false,true].forEach(neg=>{
      const schr=[], t=ukKette(ast,'x',neg,schr);
      if(!t) return;
      /* letzte Zeile andersherum: nicht „… = y", sondern „y = …" */
      const letzt=schr[schr.length-1];
      if(letzt&&ohneTags(letzt.r)==='y'){ letzt.l=ukHtmlTerm('y'); letzt.r=ukHtmlTerm(t); }
      kandidaten.push({text:t, schritte:[
        {l:ukHtmlTerm('y'), r:ukHtmlTerm(ukText(ast,'x')), hin:'die Funktion'},
        {l:ukHtmlTerm('x'), r:ukHtmlTerm(ukText(ast,'y')), hin:'x und y vertauschen'}].concat(schr)}); }); }
  const mb=ukMoebius(ast); if(mb) kandidaten.push(mb);
  const qd=ukQuadrat(ast,ber); if(qd) kandidaten.push(qd);
  for(const k of kandidaten){ if(!k||!k.text) continue;
    const tk=tokenize(k.text); if(!tk.length) continue;
    if(ukProbe(e.f,tk,ber.a,ber.b)) return {text:k.text, toks:tk, schritte:k.schritte||[]}; }
  return null; }

/* ---- Asymptoten ----
   Senkrecht: dort, wo f am Rand des Bereichs über alle Grenzen wächst (Polstelle, Lücke).
   Waagrecht: läuft f weit draußen gegen eine Zahl, wird diese Zahl zur Asymptote – geprüft
   bei x = ±50, ±200, ±800 und ±3200. Beim Umkehren tauschen die beiden ihre Richtung:
   aus der senkrechten Asymptote x = c von f wird die waagrechte y = c von f⁻¹. */
function ukAsym(e,ber){
  const A={senk:[],waag:[]};
  if(!e||!e.ok||!ber) return A;
  [[ber.a,ber.artA,1],[ber.b,ber.artB,-1]].forEach(([x,art,rein])=>{
    if(art==='rand'){
      const w=ukWeiter(e.f,-rein);
      if(w.art==='zahl'&&!A.waag.some(q=>Math.abs(q-w.v)<1e-9)) A.waag.push(w.v);
      return; }
    const r=ukRandWert(e.f,x,rein,art);
    if((r.art==='inf'||r.art==='ninf')&&!A.senk.some(q=>Math.abs(q-x)<1e-9)) A.senk.push(x); });
  return A; }
/* ---- Rechnen ---- */
function ukAnalyse(){
  const toks=tokenize(uk.term||'');
  const f=x=>evalAt(x,toks,uk.p);
  const e={term:uk.term||'', toks, f, ast:null, ok:false, hinweis:'', bereiche:[], umkehr:null};
  if(!toks.length){ e.hinweis='Oben einen Term eintragen – dann stehen hier die Bereiche, in denen f umkehrbar ist.'; return e; }
  if(stueckeVon(toks)){ e.hinweis='Abschnittsweise Terme (mit „;“) untersucht dieser Reiter nicht.'; return e; }
  let gut=0; for(let i=0;i<=200;i++){ if(isFinite(f(-10+i*0.1))) gut++; }
  if(!gut){ e.hinweis='Dieser Term lässt sich nicht auswerten – bitte prüfen.'; return e; }
  e.ok=true;
  e.ast=lmAst(toks);
  e.origHtml=lmOrigHtml(e.ast,toks);
  e.bereiche=ukBereiche(f,e.ast);
  return e; }
/* Wie geht es außerhalb des untersuchten Bereichs weiter? Nachgesehen wird bei
   x = ±50, ±200, ±800 und ±3200: läuft f gegen eine Zahl, wächst es über alle Grenzen,
   oder ist nichts zu entscheiden (Sinus zum Beispiel schwankt einfach weiter)? */
const ukRunde=v=>(Math.abs(v-Math.round(v))<1e-5)?Math.round(v):v;
function ukWeiter(f,richtung){
  const ds=[50,1e3,1e4,1e5,1e6], w=[];
  for(const d of ds){ const y=f(richtung*d); if(!isFinite(y)) break; w.push(y); }
  if(!w.length) return {art:'?', da:false};
  if(w.length<ds.length){                       /* irgendwann nicht mehr zu rechnen */
    const letzt=w[w.length-1];
    /* über alle Grenzen gewachsen (e^x sprengt schon bei x = 1000 die Zahlen) */
    if(Math.abs(letzt)>1e6) return {art:letzt>0?'inf':'ninf', da:true};
    return {art:'?', da:false}; }
  const w1=w[2], w2=w[3], w3=w[4], d1=w2-w1, d2=w3-w2;
  if(Math.abs(d2)<1e-12||Math.abs(d1)<1e-12) return {art:'zahl', v:ukRunde(w3), da:true};
  const r=d2/d1;
  if(r>0&&r<0.85){

       lässt sich aus ihnen hochrechnen. Zur Sicherheit muss ein Zwischenwert dazwischen

    const zw=f(richtung*3e5);
    if(isFinite(zw)&&(zw-w2)*(w3-zw)>=0) return {art:'zahl', v:ukRunde(w3+d2*r/(1-r)), da:true};

  return {art:'?', da:true}; }
/* Randwert eines Bereichs. An einer Extremstelle ist es schlicht der Funktionswert.
   An einer Lücke oder Polstelle wird von innen herangetastet (1/10 bis 1/10⁹): wächst der
   Betrag dabei immer weiter, ist es ±∞ – bei ln(x) für x → 0 genauso wie bei 1/x.
   Der Wert am Rand selbst taugt dort nicht: die Grenze liegt ja nur dicht daneben. */
function ukRandWert(f,x,nachInnen,art){
  if(art==='rand') return ukWeiter(f,-nachInnen);      /* dort hört nur der untersuchte Bereich auf */
  const y0=f(x);
  if(art==='extrem'&&isFinite(y0)) return {v:y0, art:'zahl'};
  const w=[];
  for(let i=1;i<=9;i+=2){ const q=f(x+nachInnen*Math.pow(10,-i));
    if(isFinite(q)) w.push(q); }
  if(w.length>=2){ const letzt=w[w.length-1];
    if(Math.abs(letzt)>Math.abs(w[0])+5||Math.abs(letzt)>1e6)

/* Grenze der Wertemenge als Text – am Rand des untersuchten Bereichs steht „…" */
function ukWText(w){
  if(!w||w.art==='?') return '…';
  if(w.art==='inf') return '+∞'; if(w.art==='ninf') return '−∞';

/* lmZ schreibt 1,5708 als π/2 und 0,7071 als √2/2 – sonst steht die gerundete Zahl da.

   lässt sich das nicht entscheiden, bleibt es bei „…". */
function ukGrenzText(ber,seite,f){
  const x=seite<0?ber.a:ber.b, art=seite<0?ber.artA:ber.artB;
  if(art!=='rand') return lmZ(x);
  const w=f?ukWeiter(f,seite<0?-1:1):null;
  return (w&&w.da)?(seite<0?'−∞':'+∞'):'…'; }
/* Gehört der Rand zum Bereich? An einer Extremstelle immer. An einer Definitionslücke nur,
   wenn f dort noch einen Wert hat – √(x−1) hört bei 1 auf, 1 gehört aber dazu ([1; …[),
   während ln(x) bei 0 keinen Wert mehr hat (]0; …[). An Polstellen und am Rand des
   untersuchten Bereichs ist es immer offen. */
function ukDabei(ber,seite,f){
  const art=seite<0?ber.artA:ber.artB, x=seite<0?ber.a:ber.b;
  if(art==='extrem') return true;
  if(art==='lücke'&&f){
    /* Der gespeicherte Rand liegt ein Haar INNERHALB des Bereichs – dort ist f natürlich
       definiert. Gefragt ist der Rand selbst: liegt er dicht an einer runden Zahl, wird
       dort nachgerechnet (√(x−1) hat bei 1 den Wert 0, ln(x) bei 0 keinen). */
    const r=(Math.abs(x-Math.round(x))<1e-6)?Math.round(x):x;
    if(isFinite(f(r))) return true; }
  return false; }
const ukOffen=art=>art!=='extrem';
/* ±∞ und „…" sind nie Teil der Menge – dort steht immer die offene Klammer */
const ukIntervall=(lo,hi,loOffen,hiOffen)=>{
  const auf=t=>(t==='−∞'||t==='+∞'||t==='…');
  if(lo==='−∞'&&hi==='+∞') return 'ℝ';
  return ((loOffen||auf(lo))?']':'[')+lo+'; '+hi+((hiOffen||auf(hi))?'[':']'); };
function ukBerText(ber,f){ return ukIntervall(ukGrenzText(ber,-1,f),ukGrenzText(ber,1,f),
  !ukDabei(ber,-1,f),!ukDabei(ber,1,f)); }

/* ---- Zeichnen ---- */
const ukSichtbar=()=>ukW?[(0-ukView.ox)/ukView.ux,(ukW-ukView.ox)/ukView.ux]:[-6,6];
/* Stelle des wandernden Punktes: die zuletzt gewählte, sonst die Mitte des sichtbaren Stücks */
function ukPunktX(ber){ if(!ber) return null;
  if(uk.x0!==null&&isFinite(uk.x0)&&uk.x0>=ber.a&&uk.x0<=ber.b) return uk.x0;
  const s=ukSichtbar(), lo=Math.max(ber.a,s[0]), hi=Math.min(ber.b,s[1]);
  return (hi>lo)?(lo+hi)/2:(ber.a+ber.b)/2; }
let ukWarte=0;
function ukResize(){ const el=$('plotU'); if(!el) return; const r=el.getBoundingClientRect();
  if(r.height<20&&tab==='u'&&ukWarte<12){ ukWarte++; requestAnimationFrame(()=>{ ukResize(); ukFit(); }); return; }
  ukWarte=0;
  ukW=Math.max(10,Math.round(r.width)); ukH=Math.max(10,Math.round(r.height));
  el.width=Math.round(ukW*dpr); el.height=Math.round(ukH*dpr);
  if(!ukView.ox&&!ukView.oy) ukFit(); else ukDraw(); }
/* Ansicht einpassen. x und y bekommen denselben Maßstab und denselben Bereich – sonst
   stimmt die Spiegelung an y = x im Bild nicht, und das Spiegelbild läge außerhalb.
   Offene Ränder (der untersuchte Bereich endet dort nur) ziehen den Ausschnitt nicht auf. */
function ukFit(){ if(!ukW) return; const e=ukErg;
  let x0=-6, x1=6;
  const b=e&&e.bereiche[uk.sel];
  if(b){ const a0=(b.artA==='rand')?null:b.a, b0=(b.artB==='rand')?null:b.b;
    if(a0!==null&&b0!==null){ const m=(a0+b0)/2, w=Math.max(2,Math.min(14,(b0-a0)*0.9)); x0=m-w; x1=m+w; }
    else if(a0!==null){ x0=a0-4; x1=a0+10; }
    else if(b0!==null){ x0=b0-10; x1=b0+4; } }
  /* Der Ausschnitt muss beides enthalten: den Bereich auf der x-Achse (da liegt f) und
     die Werte von f (da liegt die Umkehrfunktion, denn die Achsen tauschen). */
  let lo=x0, hi=x1;
  if(e&&e.ok){ const a=b?Math.max(b.a,x0):x0, bb=b?Math.min(b.b,x1):x1;
    if(bb>a) for(let i=0;i<=60;i++){ const y=e.f(a+(bb-a)*i/60);
      if(isFinite(y)){ if(y<lo) lo=y; if(y>hi) hi=y; } } }
  /* Steigt f sehr steil (x², e^x), wird der Ausschnitt sonst riesig: dann bekommt jede
     Seite nur so viel, wie ihr vom Rest zusteht – der Bereich selbst bleibt immer ganz drin. */
  const w0=Math.max(1e-6,x1-x0), rest=Math.max(0,4*w0-w0);
  const unten=Math.max(0,x0-lo), oben=Math.max(0,hi-x1), zus=unten+oben;
  if(zus>rest&&zus>0){ lo=x0-rest*unten/zus; hi=x1+rest*oben/zus; }
  const u0=Math.min(x0,lo), u1=Math.max(x1,hi), spanne=Math.max(1,(u1-u0)*1.08);
  const u=Math.max(2,Math.min(400,Math.min(ukW,ukH)/spanne));
  ukView.ux=u; ukView.uy=u;
  ukView.ox=ukW/2-((u0+u1)/2)*u;
  ukView.oy=ukH/2+((u0+u1)/2)*u;
  ukDraw(); }
/* Eine Strecke auf einen Kasten um die Zeichenfläche zuschneiden (Liang–Barsky).
   Nötig, weil Safari einen Pfad gar nicht mehr zeichnet, sobald er Punkte weit außerhalb
   enthält: beim Spiegelbild von e^x liegen die schnell bei 10¹⁰ Pixeln, und dann fehlte
   auf dem iPad die ganze Kurve. */
function ukClip(x1,y1,x2,y2,m){
  if(!isFinite(x1)||!isFinite(y1)||!isFinite(x2)||!isFinite(y2)) return null;
  const dx=x2-x1, dy=y2-y1, lo=-m, hiX=ukW+m, hiY=ukH+m;
  const p=[-dx,dx,-dy,dy], q=[x1-lo, hiX-x1, y1-lo, hiY-y1];
  let t0=0, t1=1;
  for(let i=0;i<4;i++){
    if(Math.abs(p[i])<1e-12){ if(q[i]<0) return null; continue; }
    const r=q[i]/p[i];
    if(p[i]<0){ if(r>t1) return null; if(r>t0) t0=r; }
    else { if(r<t0) return null; if(r<t1) t1=r; } }
  return [x1+t0*dx, y1+t0*dy, x1+t1*dx, y1+t1*dy]; }
/* Linienzug zeichnen – jede Strecke einzeln zugeschnitten */
function ukZug(c,punkte){
  c.beginPath();
  for(let i=1;i<punkte.length;i++){
    const a=punkte[i-1], b=punkte[i];
    if(!a||!b) continue;
    const t=ukClip(a[0],a[1],b[0],b[1],40);
    if(!t) continue;
    c.moveTo(t[0],t[1]); c.lineTo(t[2],t[3]); }
  c.stroke(); }
function ukKurve(c,f,col,w,a,b,dash){
  c.save(); c.strokeStyle=col; c.lineWidth=w; c.lineJoin='round'; c.lineCap='round';
  if(dash) c.setLineDash(dash);
  const px0=a===undefined?0:Math.max(0,Math.floor(ukView.ox+a*ukView.ux));
  const px1=b===undefined?ukW:Math.min(ukW,Math.ceil(ukView.ox+b*ukView.ux));
  const pkt=[]; let prev=null;
  for(let px=px0;px<=px1;px++){ const x=(px-ukView.ox)/ukView.ux, y=f(x), py=ukView.oy-y*ukView.uy;
    if(!isFinite(py)){ pkt.push(null); prev=null; continue; }
    if(prev!==null&&Math.abs(py-prev)>ukH*2) pkt.push(null);   /* Sprung: nicht verbinden */
    pkt.push([px,py]); prev=py; }
  ukZug(c,pkt); c.restore(); }
/* die Umkehrfunktion wird nicht gerechnet, sondern gespiegelt: zu jedem x der Punkt (f(x), x) */
function ukSpiegelKurve(c,f,a,b,col,w){
  c.save(); c.strokeStyle=col; c.lineWidth=w; c.lineJoin='round'; c.lineCap='round';
  const N=1400, pkt=[];
  for(let i=0;i<=N;i++){ const x=a+(b-a)*i/N, y=f(x);
    if(!isFinite(y)){ pkt.push(null); continue; }
    pkt.push([ukView.ox+y*ukView.ux, ukView.oy-x*ukView.uy]); }
  ukZug(c,pkt); c.restore(); }
/* Punkt mit Beschriftung; „oben" setzt den Text über den Punkt, „links" davor */
function ukPunkt(c,px,py,col,txt,oben,links){
  c.save(); c.fillStyle=col; c.beginPath(); c.arc(px,py,5.5,0,7); c.fill();
  c.strokeStyle='#fff'; c.lineWidth=1.6; c.stroke();
  if(txt){ const gr=Math.max(12,fontSize);
    c.font='800 '+gr+'px sans-serif'; c.textAlign='left'; c.textBaseline=oben?'bottom':'top';
    const w=c.measureText(txt).width;
    const x=links?Math.max(4,px-9-w):Math.min(px+9,ukW-w-4), y=oben?py-8:py+8;
    c.fillStyle='rgba(255,255,255,.88)'; c.fillRect(x-3,(oben?y-gr-2:y-2),w+6,gr+5);
    c.fillStyle=col; c.fillText(txt,x,y); }
  c.restore(); }
function ukDraw(){ if(tab!=='u'||!ukW) return; const e=ukErg;
  const c=$('plotU').getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,ukW,ukH); c.fillStyle='#fff'; c.fillRect(0,0,ukW,ukH);
  const ux=ukView.ux, uy=ukView.uy, X=x=>ukView.ox+x*ux, Y=y=>ukView.oy-y*uy;
  const xmin=(0-ukView.ox)/ux, xmax=(ukW-ukView.ox)/ux, ymin=(ukView.oy-ukH)/uy, ymax=ukView.oy/uy;
  const schritt=u=>{ const raw=44/u, p10=Math.pow(10,Math.floor(Math.log10(raw)));
    for(const m of [1,2,5,10]) if(p10*m>=raw) return p10*m; return p10*10; };
  const s=schritt(ux);
  c.strokeStyle='#eef1f6'; c.lineWidth=1; c.beginPath();
  for(let x=Math.ceil(xmin/s)*s;x<=xmax;x+=s){ c.moveTo(X(x),0); c.lineTo(X(x),ukH); }
  for(let y=Math.ceil(ymin/s)*s;y<=ymax;y+=s){ c.moveTo(0,Y(y)); c.lineTo(ukW,Y(y)); }
  c.stroke();
  /* Spiegelachse y = x */
  c.save(); c.setLineDash([6,5]); c.strokeStyle=UK_DIAG; c.lineWidth=1.6;
  c.beginPath(); c.moveTo(X(Math.max(xmin,ymin)),Y(Math.max(xmin,ymin))); c.lineTo(X(Math.min(xmax,ymax)),Y(Math.min(xmax,ymax))); c.stroke();
  c.fillStyle=UK_DIAG; c.font='700 '+Math.max(11,fontSize-1)+'px sans-serif'; c.textAlign='right'; c.textBaseline='top';
  const xd=Math.min(xmax,ymax)-0.4; c.fillText('y = x', X(xd), Y(xd)+6); c.restore();
  /* Achsen */
  c.strokeStyle='#98a2b3'; c.lineWidth=1.6; c.beginPath();
  c.moveTo(0,Y(0)); c.lineTo(ukW,Y(0)); c.moveTo(X(0),0); c.lineTo(X(0),ukH); c.stroke();
  c.fillStyle='#667085'; c.font=(fontItalic?'italic ':'')+(fontBold?'bold ':'')+fontSize+'px sans-serif';
  c.textAlign='center'; c.textBaseline='top';
  for(let x=Math.ceil(xmin/s)*s;x<=xmax;x+=s){ if(Math.abs(x)<1e-9) continue;
    c.fillText(fmt(x), X(x), Math.min(Math.max(Y(0)+3,2),ukH-fontSize-3)); }
  c.textAlign='right'; c.textBaseline='middle';
  for(let y=Math.ceil(ymin/s)*s;y<=ymax;y+=s){ if(Math.abs(y)<1e-9) continue;
    c.fillText(fmt(y), Math.min(Math.max(X(0)-4,fontSize*2),ukW-2), Y(y)); }
  if(!e||!e.ok) return;
  const ber=e.bereiche[uk.sel];
  /* Monotoniebereiche als Bänder */
  if(uk.m) e.bereiche.forEach((b,i)=>{
    const pa=Math.max(-5,X(b.a)), pb=Math.min(ukW+5,X(b.b));
    if(pb<0||pa>ukW) return;
    const an=(i===uk.sel), col=b.steigend?UK_STEIG:UK_FALL;
    c.save(); c.fillStyle=col; c.globalAlpha=an?0.13:0.05; c.fillRect(pa,0,pb-pa,ukH);
    c.globalAlpha=1; c.strokeStyle=col; c.lineWidth=an?2.4:1.2; c.setLineDash(an?[]:[4,4]);
    c.beginPath();
    /* Am Rand des untersuchten Bereichs gibt es keine echte Grenze – dort keine Linie */
    if(b.artA!=='rand'){ c.moveTo(pa,0); c.lineTo(pa,ukH); }
    if(b.artB!=='rand'){ c.moveTo(pb,0); c.lineTo(pb,ukH); }
    c.stroke();
    c.setLineDash([]); c.fillStyle=col; c.font='800 '+Math.max(12,fontSize)+'px sans-serif';
    c.textAlign='center'; c.textBaseline='top';
    const mid=(Math.max(pa,0)+Math.min(pb,ukW))/2;
    c.fillText(b.steigend?'↗':'↘', mid, 4);
    c.restore(); });
  /* f – außerhalb des gewählten Bereichs blass */
  if(ber){ c.save(); c.globalAlpha=0.3; ukKurve(c,e.f,UK_F,2.2); c.restore();
    ukKurve(c,e.f,UK_F,3,ber.a,ber.b); }
  else ukKurve(c,e.f,UK_F,2.6);
  /* Umkehrfunktion als Spiegelbild des gewählten Stücks */
  if(ber&&uk.inv) ukSpiegelKurve(c,e.f,ber.a,ber.b,UK_INV,3);
  /* Asymptoten – die von f gestrichelt blau, die der Umkehrfunktion violett (vertauscht) */
  if(ber&&uk.asym&&e.asym){
    const strich=(waag,wert,col,txt)=>{
      const p=waag?Y(wert):X(wert);
      if(p<-20||p>(waag?ukH:ukW)+20) return;
      c.save(); c.setLineDash([7,5]); c.lineWidth=2; c.strokeStyle=col; c.fillStyle=col;
      c.beginPath();
      if(waag){ c.moveTo(0,p); c.lineTo(ukW,p); } else { c.moveTo(p,0); c.lineTo(p,ukH); }
      c.stroke(); c.setLineDash([]);
      c.font='700 '+Math.max(12,fontSize)+'px sans-serif';
      const gr=Math.max(12,fontSize), w=c.measureText(txt).width;
      const tx=waag?6:Math.min(ukW-w-4,p+5), ty=waag?Math.max(gr+2,p-4):(gr+4);
      c.fillStyle='rgba(255,255,255,.88)'; c.fillRect(tx-3,ty-gr-2,w+6,gr+5);
      c.fillStyle=col; c.textAlign='left'; c.textBaseline='bottom'; c.fillText(txt,tx,ty);
      c.restore(); };
    e.asym.senk.forEach(x=>strich(false,x,UK_F,'x = '+lmZ(x)));
    e.asym.waag.forEach(y=>strich(true,y,UK_F,'y = '+lmZ(y)));
    if(uk.inv){ e.asym.senk.forEach(x=>strich(true,x,UK_INV,'y = '+lmZ(x)));
                e.asym.waag.forEach(y=>strich(false,y,UK_INV,'x = '+lmZ(y))); } }
  /* wandernder Punkt und sein Spiegelbild */
  if(ber&&uk.pkt){
    const x0=ukPunktX(ber);
    const y0=e.f(x0);
    if(isFinite(y0)){
      const px=X(x0), py=Y(y0), qx=X(y0), qy=Y(x0);
      c.save(); c.setLineDash([5,5]); c.strokeStyle=UK_DIAG; c.lineWidth=1.8;
      c.beginPath(); c.moveTo(px,py); c.lineTo(qx,qy); c.stroke(); c.restore();
      /* P rechts unter den Punkt, das Spiegelbild P′ links darüber – sie liegen oft dicht beieinander */
      ukPunkt(c,px,py,UK_F,'P('+lmZ(x0)+' | '+lmZ(y0)+')',false,false);

  /* Ehrlich bleiben: bei verschiedenen Maßstäben ist die Spiegelung im Bild verzerrt */
  if(Math.abs(ukView.ux-ukView.uy)>0.08*Math.max(ukView.ux,ukView.uy)){
    c.save(); c.fillStyle='#8b94a6'; c.font='600 '+Math.max(11,fontSize-1)+'px sans-serif';
    c.textAlign='right'; c.textBaseline='bottom';
    c.fillText('x und y verschieden skaliert – „Ansicht" stellt gleiche Maßstäbe her', ukW-8, ukH-6);
    c.restore(); }
  /* Beschriftung der Umkehrkurve */
  if(ber&&uk.inv){ const xm=(ber.a+ber.b)/2, ym=e.f(xm);
    /* Nur beschriften, wenn das Spiegelbild an dieser Stelle auch im Bild liegt */
    if(isFinite(ym)&&X(ym)>-20&&X(ym)<ukW+20&&Y(xm)>-20&&Y(xm)<ukH+20){
      c.save(); c.fillStyle=UK_INV; c.font='800 '+Math.max(12,fontSize)+'px sans-serif';
      c.textAlign='left'; c.textBaseline='top';
      const tx=Math.min(ukW-110,Math.max(6,X(ym)+10)), ty=Math.min(ukH-22,Math.max(4,Y(xm)+10));
      c.fillStyle='rgba(255,255,255,.88)'; c.fillRect(tx-3,ty-2,c.measureText('Umkehrfunktion').width+6,Math.max(12,fontSize)+5);
      c.fillStyle=UK_INV; c.fillText('Umkehrfunktion',tx,ty); c.restore(); } } }

/* ---- Tabelle (optional) ---- */
function ukTabelle(){ const host=$('ukTab'); if(!host) return;
  const e=ukErg, ber=e&&e.bereiche[uk.sel];
  if(!uk.tab||!e||!e.ok){ host.hidden=true; host.innerHTML=''; return; }
  host.hidden=false;
  /* Gezeigt wird der Teil des Bereichs, der gerade im Bild ist – sonst stehen dort
     Werte von weit draußen, die niemand sucht. */
  const sicht=ukSichtbar(), s0=sicht[0], s1=sicht[1];
  let a=ber?Math.max(ber.a,s0):s0, b=ber?Math.min(ber.b,s1):s1;
  if(!(b>a)&&ber){ a=ber.a; b=ber.b; }
  if(!isFinite(a)||!isFinite(b)||b<=a){ a=-3; b=3; }
  const N=8, xs=[], ys=[];
  for(let i=0;i<=N;i++){ const x=a+(b-a)*i/N, y=e.f(x);
    if(!isFinite(y)) continue; xs.push(x); ys.push(y); }
  if(!xs.length){ host.innerHTML='<div class="ukLeer">Zu diesem Bereich gibt es keine Werte.</div>'; return; }
  const zeile=(k,w,cls)=>'<tr'+(cls?(' class="'+cls+'"'):'')+'><th>'+k+'</th>'+w.map(v=>'<td>'+lmZ(v)+'</td>').join('')+'</tr>';
  /* Beide Tabellen stecken in einer einzigen: so stehen die Spalten genau untereinander
     und schieben sich gemeinsam zur Seite. */
  host.innerHTML='<div class="ukTabWrap"><table class="ukT">'+
    zeile('x',xs)+zeile('f(x)',ys)+
    (ber?(zeile('x',ys,'inv trenn')+zeile('f<sup>−1</sup>(x)',xs,'inv')):'')+
    '</table></div>'+
    (ber?'<div class="ukTabHin">Die unteren beiden Zeilen sind dieselbe Tabelle, nur andersherum gelesen: aus jedem Paar (x | f(x)) wird (f(x) | x).</div>':''); }

/* ---- Spalte rechts ---- */
function ukSeite(){ const o=$('ukOut'), gr=$('ukTermGross'); if(!o) return; const e=ukErg;
  if(gr) gr.innerHTML=(e&&e.ok)?('f(x) = '+e.origHtml):'';
  if(!e||!e.ok){ o.innerHTML='<div class="lmHead">'+((e&&e.hinweis)||'')+'</div>'; ukTabelle(); return; }

    if(d.lm.view&&(d.lm.view.ux||d.lm.view.unit)){ const v=d.lm.view;
      lmView=Object.assign(lmView,{ux:v.ux||v.unit, uy:v.uy||v.unit, ox:v.ox, oy:v.oy}); } }
  if(d.uk){ if(typeof d.uk.term==='string'){ uk.term=d.uk.term; ukLetzt=''; }
    uk.m=!!d.uk.m; uk.inv=!!d.uk.inv; uk.pkt=!!d.uk.pkt; uk.tab=!!d.uk.tab;
    uk.dw=!!d.uk.dw; uk.asym=!!d.uk.asym; uk.schritt=!!d.uk.schritt;
    if(d.uk.p) uk.p=Object.assign({a:1,b:0,c:0},d.uk.p);
    if(typeof d.uk.sel==='number') uk.sel=d.uk.sel;
    uk.x0=(typeof d.uk.x0==='number')?d.uk.x0:null;
    if(d.uk.view&&d.uk.view.ux) ukView=Object.assign(ukView,d.uk.view); }
  if(d.tab&&d.tab!==tab) setTab(d.tab); else { draw(); refreshTable(); refreshMachines(); trDraw(); mdDraw();
    if(tab==='l') lmNeu(); if(tab==='u') ukNeu(); } });
addEventListener('resize',()=>{ resize(); if(tab==='d') mdResize(); });
/* Wachsen die Bedienzeilen (z. B. weil die Bild-Knöpfe dazukommen), wird die Zeichenfläche
   niedriger. Dann MUSS das Canvas neu vermessen werden - sonst zeichnet es in alter Groesse
   weiter, der Browser zieht das Bild auf die neue Hoehe, und jeder Fingertipp landet
   gegenueber dem Gezeichneten verschoben. Die Bedienzeilen der Reiter „Modell" und
   „Transformationen" stecken SELBST in #wrap – dort aendert sich also nichts, was ein
   Beobachter an #wrap merken wuerde. Darum wird jede Zeichenflaeche einzeln beobachtet. */
if(window.ResizeObserver){
  new ResizeObserver(()=>{ if(tab==='g'&&(cv.clientWidth!==W||cv.clientHeight!==H)) resize(); }).observe($('wrap'));
  new ResizeObserver(()=>{ const el=$('plotD');
    if(tab==='d'&&el.clientWidth&&(el.clientWidth!==mdW||el.clientHeight!==mdH)) mdResize(); }).observe($('plotD'));
  new ResizeObserver(()=>{ const el=$('plotR');
    if(tab==='r'&&el.clientWidth&&(el.clientWidth!==trW||el.clientHeight!==trH)) trResize(); }).observe($('plotR'));
  new ResizeObserver(()=>{ const el=$('plotL');
    if(tab==='l'&&el.clientWidth&&(el.clientWidth!==lmW||el.clientHeight!==lmH)){ const neu=!lmH||lmH<20; lmResize(); if(neu) lmFit(); } }).observe($('plotL'));
  new ResizeObserver(()=>{ const el=$('plotU');
    if(tab==='u'&&el.clientWidth&&(el.clientWidth!==ukW||el.clientHeight!==ukH)){ const neu=!ukH||ukH<20; ukResize(); if(neu) ukFit(); } }).observe($('plotU'));
}

function plotImage(){ const im=TafelShot.rasterize($('wrap'),{exclude:'#err'}), S=2, g=im.canvas.getContext('2d');
  const lines=[]; document.querySelectorAll('#funcs .func').forEach((r,i)=>{ const t=r.querySelector('.fterm').value.trim(); if(t&&funcs[i])
    lines.push({col:funcs[i].color,txt:r.querySelector('.fname').textContent.replace('=',' = ')+(funcs[i].hide?'? ? ?':t)}); });
  const ps=[...document.querySelectorAll('#sliders .sl')].map(r=>r.querySelector('label').textContent.replace(/[=\s]+$/,'').trim()+' = '+r.querySelector('.v').textContent.trim()); if(ps.length) lines.push({col:'#475569',txt:ps.join('   ')});
  if(!lines.length) return im;
  g.setTransform(S,0,0,S,0,0); const fs=Math.max(12,fontSize+1); g.font='700 '+fs+'px -apple-system,BlinkMacSystemFont,sans-serif'; g.textBaseline='middle';
  const lh=fs*1.45, bw=Math.min(im.w-16,Math.max(...lines.map(l=>g.measureText(l.txt).width))+28), bh=lines.length*lh+10;
  g.fillStyle='rgba(255,255,255,.93)'; g.strokeStyle='#cbd5e1'; g.lineWidth=1; g.beginPath(); g.rect(8,8,bw,bh); g.fill(); g.stroke();
  lines.forEach((l,i)=>{ const y=8+5+lh*(i+0.5); g.fillStyle=l.col; if(i<lines.length-(ps.length?1:0)){ g.beginPath(); g.arc(20,y,5,0,7); g.fill(); } g.fillText(l.txt,32,y); });
  return im; }
function tabBild(){ if(tab==='d') return TafelShot.rasterize($('mdMain'),{pad:8,exclude:'.mddel,#mdBtns,#mdDatTop,#mdImpBox,#mdBildBox,#mdOut .mdDot'});
  if(tab==='r') return TafelShot.rasterize($('trMain'),{pad:8});   /* Graph und rechte Spalte, wie sie dastehen */
  if(tab==='t') return TafelShot.rasterize($('ttab')||$('pT'),{pad:8,exclude:'.fdel,.fhide'});
  if(tab==='m') return TafelShot.rasterize($('mlist')||$('pM'),{pad:8,exclude:'.fdel,.fhide,.mtr,.mch'});
  return plotImage(); }
/* ---- Formel-Tastatur ---- */
let keysOn=false, lastInp=null;
const KP_CHIPS=[['sin','sin('],['cos','cos('],['tan','tan('],['√','sqrt('],['ln','ln('],['eˣ','exp('],['|x|','abs('],['π','pi'],['²','^2'],['x','x'],['a','a'],['b','b'],['c','c'],
  [';','; '],['<','<'],['≤','≤'],['>','>'],['≥','≥']];      /* für abschnittsweise definierte Funktionen */
const KP_ROWS=[[['7','7'],['8','8'],['9','9'],['(','(',1],[')',')',1],['⌫',null,0,'del']],
  [['4','4'],['5','5'],['6','6'],['×','*',1],['÷','/',1],['^','^',1]],
  [['1','1'],['2','2'],['3','3'],['+','+',1],['−','-',1],['x','x',1]],
  [['0','0'],['.','.'],['◀',null,0,'left'],['▶',null,0,'right'],['ABC',null,0,'abc'],['✓ Fertig',null,0,'enter','act']]];
function kpTarget(){
  /* Wo der Nutzer gerade steht, gewinnt - sonst schreibt die Formel-Tastatur in das Feld,
     das zuletzt benutzt wurde (z. B. in die Wertetabelle statt in den eigenen Term). */
  const ae=document.activeElement;
  if(ae&&ae!==lastInp&&ae.offsetParent&&
     (ae.tagName==='TEXTAREA'||(ae.tagName==='INPUT'&&(ae.type==='text'||ae.type==='')))) lastInp=ae;
  if(lastInp&&document.contains(lastInp)&&lastInp.offsetParent){
    if(document.activeElement!==lastInp){ try{ lastInp.focus({preventScroll:true}); const n=lastInp.value.length; lastInp.setSelectionRange(n,n); }catch(_){} }
    return lastInp; }
  const sel=tab==='g'?'#funcs .fterm':(tab==='t'?'#pT .fterm':(tab==='d'?'#mdBody .mdin':'#pM .fterm'));
  const inps=[...document.querySelectorAll(sel)].filter(e=>e.offsetParent); const el=inps[Math.min(activeIdx,inps.length-1)];
  if(el&&document.activeElement!==el){ try{ el.focus({preventScroll:true}); const n=el.value.length; el.setSelectionRange(n,n); }catch(_){} }
  if(el) lastInp=el; return el; }
function buildKeypad(){ const kp=$('keypad'); if(kp.dataset.built) return; kp.dataset.built='1';
  const ch=document.createElement('div'); ch.className='kp-row chips'; KP_CHIPS.forEach(([l,ins])=>{ const b=document.createElement('button'); b.className='fn'; b.textContent=l; b.dataset.ins=ins; ch.appendChild(b); }); kp.appendChild(ch);
  KP_ROWS.forEach(r=>{ const d=document.createElement('div'); d.className='kp-row';
    r.forEach(([l,ins,op,act,cls])=>{ const b=document.createElement('button'); b.textContent=l; if(op)b.classList.add('op'); if(cls)b.classList.add(cls); if(act==='del')b.classList.add('del'); if(ins!=null)b.dataset.ins=ins; if(act)b.dataset.act=act; d.appendChild(b); });
    kp.appendChild(d); });
  kp.addEventListener('pointerdown',e=>{ const b=e.target.closest('button'); if(!b) return; e.preventDefault(); const el=kpTarget(); if(!el) return;
    const s=el.selectionStart==null?el.value.length:el.selectionStart, en=el.selectionEnd==null?s:el.selectionEnd;
    const set=(v,c)=>{ el.value=v; try{ el.setSelectionRange(c,c); }catch(_){} el.dispatchEvent(new Event('input',{bubbles:true})); };
    if(b.dataset.ins!==undefined){ const t=b.dataset.ins; set(el.value.slice(0,s)+t+el.value.slice(en),s+t.length); return; }
    const a=b.dataset.act;
    if(a==='del'){ if(en>s) set(el.value.slice(0,s)+el.value.slice(en),s); else if(s>0) set(el.value.slice(0,s-1)+el.value.slice(s),s-1); }
    else if(a==='left'){ const c=Math.max(0,s-1); try{ el.setSelectionRange(c,c); }catch(_){} }
    else if(a==='right'){ const c=Math.min(el.value.length,en+1); try{ el.setSelectionRange(c,c); }catch(_){} }
    else if(a==='abc'){ setKeypad(false); try{ el.blur(); el.focus(); }catch(_){} }
    else if(a==='enter'){ el.blur(); setKeypad(false); } }); }
function setKeypad(on){ keysOn=!!on; buildKeypad(); const kp=$('keypad'); kp.classList.toggle('show',keysOn); $('btnKeys').classList.toggle('on',keysOn);
  document.body.classList.toggle('kp-open',keysOn); if(keysOn) document.documentElement.style.setProperty('--kph',kp.offsetHeight+'px');
  document.querySelectorAll('.fterm,#mdWt').forEach(i=>i.inputMode=keysOn?'none':'text');
  document.querySelectorAll('.xin,.mxin,.mdin').forEach(i=>i.inputMode=keysOn?'none':'decimal');
  if(keysOn) kpTarget(); }
