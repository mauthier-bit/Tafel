/* ---------- Liste der nächsten Ereignisse ---------- */
const EREIG_NAME={neumond:'Neumond',vollmond:'Vollmond',sofi:'Sonnenfinsternis',mofi:'Mondfinsternis',
  transit:'Venustransit',opposition:'Mars in Opposition',sommer:'Sommersonnenwende',winter:'Wintersonnenwende'};
let listeStand=null;
function listeFuellen(ab){
  const sel=$('selListe'); if(!sel) return;
  const t0=(ab===undefined?D.sys.t:ab), eintraege=[];
  const nimm=(art,n)=>{ let t=t0;
    for(let i=0;i<n;i++){ const tt=suchen(art,t); if(tt===null) break; eintraege.push({t:tt,art}); t=tt+1; } };
  nimm('sofi',4); nimm('mofi',4); nimm('neumond',2); nimm('vollmond',2);
  nimm('opposition',2); nimm('sommer',2); nimm('winter',2); nimm('transit',2);
  /* Eine Finsternis ist immer auch Neumond oder Vollmond - dann reicht der eine Eintrag. */
  const fins=eintraege.filter(e=>e.art==='sofi'||e.art==='mofi');
  const liste=eintraege.filter(e=>!((e.art==='neumond'||e.art==='vollmond')&&fins.some(f=>Math.abs(f.t-e.t)<0.4)));
  liste.sort((a,b)=>a.t-b.t);
  sel.innerHTML='<option value="" hidden>Ereignis …</option>';
  liste.forEach((e,i)=>{
    const o=document.createElement('option'); o.value=String(i);
    o.dataset.t=String(e.t); o.dataset.art=e.art;
    let nm=EREIG_NAME[e.art];
    if(e.art==='sofi') nm=finsternisse(e.t).sofi||nm;
    if(e.art==='mofi') nm=finsternisse(e.t).mofi||nm;
    o.textContent=datumText(e.t)+' · '+nm;
    sel.appendChild(o);
  });
  /* Am Ende weiterblättern: Die Liste wird ab dem letzten Eintrag neu gefüllt. */
  if(liste.length){
    const letzt=liste[liste.length-1].t;
    const o=document.createElement('option'); o.value='mehr'; o.dataset.t=String(letzt);
    o.textContent='▸ weiter ab '+datumText(letzt);
    sel.appendChild(o);
  }
  sel.value=''; listeStand=t0;
}
function listePruefen(){
  const sel=$('selListe'); if(!sel) return;
  const erste=sel.options[1];
  /* Nur nachfüllen, wenn die Zeit über den ersten Eintrag hinausgelaufen ist - wer
     vorgeblättert hat, soll seine Liste behalten. */
  if(!erste||listeStand===null||D.sys.t>+erste.dataset.t+1) listeFuellen();
}
function springeZu(t,art){
  D.sys.t=t; D.sys.lauf=false; laufStopp();
  D.sys.letztes=art||null;
  if(D.sys.lupe) lupeSetzen(true);                   /* Zeitlupe ans neue Ereignis anpassen */
  if(D.sys.ansichtMit&&art) ansichtFuer(art);
  setzeTab(D.tab); listeFuellen(); sync(true);
  toast((EREIG_NAME[art]||'Ereignis')+': '+datumText(t,true));
}
/* ---------- Ansicht zu einem Ereignis passend stellen ---------- */
function ansichtFuer(art){
  const S=D.sys;
  const seitlich=()=>{ S.az=sonnenLaenge(S.t)+90; S.el=12; };     /* quer zur Richtung zur Sonne */
  const erdMond=()=>{ S.von='aussen'; S.bezug='erde'; S.ziel='erde'; S.stufe='schatten'; S.dist=0.0075;
    S.schatten=true; S.bahnen=true; seitlich(); };
  if(art==='mofi'){ erdMond(); S.ziel='mond'; S.dist=0.0012+0.0003*sfaktor(); }
  else if(art==='sommer'||art==='winter'){ S.von='aussen'; S.bezug='erde'; S.ziel='erde'; S.stufe='echt';
    S.dist=0.0004; S.schatten=true; S.az=sonnenLaenge(S.t)+105; S.el=6; }
  else if(art==='sofi'||art==='neumond'||art==='vollmond') erdMond();
  else if(art==='transit'){ S.von='erde'; S.ziel='sonne'; S.bezug='erde'; S.fov=1.2; S.panAz=0; S.panEl=0; }
  else if(art==='opposition'){ S.von='aussen'; S.bezug='erde'; S.ziel='erde'; S.stufe='ansch'; S.dist=5.5; S.bahnen=true; }
  else { S.von='aussen'; S.bezug='erde'; S.ziel='erde'; S.stufe='echt'; S.dist=0.0009;
    S.schatten=true; S.az=sonnenLaenge(S.t)+100; S.el=8; }
}

/* ============================================================
   Gemeinsames für die vier Geometrie-Seiten
   ============================================================ */
/* Lange Sätze umbrechen - auf der Tafel ist das Werkzeug oft schmal. */
function umbruch(txt,maxW,sz,fett){
  ctx.font=schrift(sz,fett);
  if(ctx.measureText(txt).width<=maxW) return [txt];
  const worte=txt.split(' '), raus=[]; let zeile='';
  for(const w of worte){
    const probe=zeile?zeile+' '+w:w;
    if(ctx.measureText(probe).width>maxW&&zeile){ raus.push(zeile); zeile=w; }
    else zeile=probe;
  }
  if(zeile) raus.push(zeile);
  return raus;
}
function zeilenBauen(zeilen){                       /* [{t,f,sz,fett}] → umgebrochene Liste */
  const raus=[];
  zeilen.forEach(z=>{ const sz=z.sz||13;
    umbruch(z.t,W-24,sz,z.fett).forEach(t=>raus.push({t,f:z.f,sz,fett:z.fett,h:Math.max(17,sz*1.35)*K})); });
  return raus;
}
function infoHell(zeilen){
  const zl=zeilenBauen(zeilen);
  let hoch=12; zl.forEach(z=>hoch+=z.h);
  ctx.fillStyle='rgba(255,255,255,.93)'; ctx.fillRect(0,H-hoch,W,hoch);
  ctx.strokeStyle='#e2e7ef'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,H-hoch+.5); ctx.lineTo(W,H-hoch+.5); ctx.stroke();
  let y=H-hoch+8;
  zl.forEach(z=>{ y+=z.h/2; text(z.t,12,y,z.f||'#475569',{sz:z.sz,fett:z.fett}); y+=z.h/2; });
  return hoch;
}
function pfeilBogen(cx,cy,r,w1,w2,farbe,beschr){
  ctx.strokeStyle=farbe; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(cx,cy,r,w1,w2); ctx.stroke();
  if(beschr){ const wm=(w1+w2)/2;
    text(beschr,cx+Math.cos(wm)*(r+12*K),cy+Math.sin(wm)*(r+12*K),farbe,{al:'center',sz:13,fett:true,rand:'#fff'}); }
}
function rechterWinkel(px,py,d1,d2,gr,farbe){
  const a=[px+d1[0]*gr,py+d1[1]*gr], b=[px+d2[0]*gr,py+d2[1]*gr];
  ctx.strokeStyle=farbe; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(a[0]+d2[0]*gr,a[1]+d2[1]*gr);
  ctx.lineTo(b[0],b[1]); ctx.stroke();
}

/* ============================================================
   Seite 2: Erdumfang nach Eratosthenes
   ============================================================ */
const U_WAHR=40075, KM_JE_GRAD=U_WAHR/360, SONNENDEK=23.4393;
const schattenW=b=>b-SONNENDEK;
const ERAT_BSP=[
  {n:'Alexandria und Syene (Eratosthenes)',a:31,b:23.5},
  {n:'Hamburg und München',a:53.5,b:48},
  {n:'Amberg und Rom',a:49.5,b:42},
  {n:'Nordkap und Kairo',a:71,b:30},
  {n:'zwei Nachbarorte',a:48,b:47.5}
];
/* Flaches Modell: Dieselben Schattenwinkel verlangen eine nahe Sonne. Ihre Höhe folgt
   aus dem Strahlensatz - und faellt fuer jedes Ortspaar anders aus. Genau daran
   scheitert das Modell. */
function flacheSonne(bA,bB,f){
  const a1=schattenW(bA)+(f||0), a2=schattenW(bB);
  const tA=Math.tan(a1*RAD), tB=Math.tan(a2*RAD);
  const sKm=(bA-bB)*KM_JE_GRAD;                        /* A nördlich von B: positiv */
  const h=(Math.abs(tA-tB)<1e-9)?Infinity:sKm/(tA-tB);
  return {h, tA, tB, sKm, fussKm:tA*h};                /* fussKm: Fußpunkt der Sonne, von A aus */
}
function erdumfang(bA,bB,f){
  const a1=schattenW(bA)+(f||0), a2=schattenW(bB);
  const alpha=Math.abs(a1-a2), s=Math.abs(bA-bB)*KM_JE_GRAD;
  return {alpha,s,U:alpha<1e-9?Infinity:s*360/alpha};
}
function zeichneErat(){
  const E=D.erat, bA=E.a, bB=E.b, f=E.fehler/100;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const e=erdumfang(bA,bB,f), abw=(e.U-U_WAHR)/U_WAHR*100;
  const fl=flacheSonne(bA,bB,f);
  let zeilen;
  if(!E.flach){
    zeilen=[
      {t: e.alpha<0.05 ? 'Beide Orte liegen fast gleich – der Winkel verschwindet'
         : 'Erdumfang U = s · 360°/α = '+zahl(e.U,0)+' km   ('+(abw>=0?'+':'−')+zahl(Math.abs(abw),1)+' % gegenüber 40 075 km)',
       f:'#1f2430',sz:16,fett:true},
      {t:'Schattenwinkel A: '+grad(Math.abs(schattenW(bA)+f))+' · B: '+grad(Math.abs(schattenW(bB)))
        +' · Mittelpunktswinkel α = '+grad(e.alpha)+' · Entfernung s = '+zahl(e.s,0)+' km'},
      {t: e.alpha<0.05 ? 'Ohne Winkelunterschied lässt sich nichts ausrechnen – deshalb wählte Eratosthenes zwei weit entfernte Orte.'
         : 'Ein halbes Grad Messfehler verschiebt das Ergebnis um rund '+zahl(e.U*0.5/e.alpha,0)
           +' km. Je kleiner α, desto stärker schlägt jeder Fehler durch.'}
    ];
  } else {
    const andere=ERAT_BSP.slice(0,4).map(b=>b.n.replace(/ \(.*\)/,'')+' '+zahl(flacheSonne(b.a,b.b,0).h,0)+' km').join(' · ');
    zeilen=[
      {t: !isFinite(fl.h)||fl.h<=0 ? 'Mit diesen beiden Messungen kommt im flachen Modell gar keine Sonne heraus'
         : 'Im flachen Modell stünde die Sonne nur h = '+zahl(fl.h,0)+' km hoch – '
           +zahl(AE/fl.h,0)+'-mal zu niedrig', f:'#1f2430',sz:16,fett:true},
      {t:'h = s / (tan α_A − tan α_B) = '+zahl(fl.sKm,0)+' km / (tan '+grad(Math.abs(schattenW(bA)+f))
        +' − tan '+grad(Math.abs(schattenW(bB)))+')   ·   in Wirklichkeit: 149 600 000 km'},
      {t:'Dieselbe Rechnung mit anderen Ortspaaren: '+andere+' – jedes Paar ergibt etwas anderes. '
        +'Auf der Kugel passt dagegen ein einziger Wert zu allen Messungen.'}
    ];
  }
  const hoch=infoHell(zeilen);
  const HV=H-hoch;
  const uS=[Math.cos((90-SONNENDEK)*RAD),-Math.sin((90-SONNENDEK)*RAD)];   /* Richtung zur Sonne */
  const lauf=[-uS[0],-uS[1]];
  if(!E.flach){
    const cx=W*0.42, cy=HV*0.54, R=Math.min(W*0.26,HV*0.31);
    ctx.fillStyle='#eff6ff'; ctx.strokeStyle='#2563eb'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#bfdbfe'; ctx.lineWidth=1; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(cx-R,cy); ctx.lineTo(cx+R,cy); ctx.stroke(); ctx.setLineDash([]);
    text('Äquator',cx+R+6,cy,'#64748b',{sz:12});
    if(E.strahlen){
      /* Die Strahlen enden an der Erdoberfläche - sonst liefen sie quer durch die Kugel. */
      ctx.strokeStyle='rgba(234,179,8,.75)'; ctx.lineWidth=1.4;
      const q=[-uS[1],uS[0]];
      for(let k=-9;k<=9;k++){ const o=k*R/5.5;
        const px=cx+q[0]*o+uS[0]*R*2.4, py=cy+q[1]*o+uS[1]*R*2.4;
        let laenge=R*2.4;
        const fx=px-cx, fy=py-cy;
        const bq=2*(fx*lauf[0]+fy*lauf[1]), cq=fx*fx+fy*fy-R*R, dis=bq*bq-4*cq;
        if(dis>0){ const t=(-bq-Math.sqrt(dis))/2; if(t>0) laenge=t; }
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+lauf[0]*laenge,py+lauf[1]*laenge); ctx.stroke(); }
      text('Sonnenstrahlen (parallel)',cx+uS[0]*R*1.9,cy+uS[1]*R*1.9-14*K,'#a16207',{al:'center',sz:12,fett:true,rand:'#fff'});
    }
    const legende=[];
    [[bA,'A','#2563eb',f],[bB,'B','#16a34a',0]].forEach(([b,nm,farbe,fe])=>{
      const w=(90-b)*RAD, ux=Math.cos(w), uy=-Math.sin(w);
      const px=cx+R*ux, py=cy+R*uy, stab=Math.max(16,R*0.17);
      ctx.strokeStyle=farbe; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+ux*stab,py+uy*stab); ctx.stroke();
      ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(px,py,4,0,7); ctx.fill();
      text(nm,px+ux*(stab+11*K),py+uy*(stab+11*K),farbe,{al:'center',sz:14,fett:true,rand:'#fff'});
      const sp=[px+ux*stab,py+uy*stab];
      ctx.strokeStyle='rgba(31,36,48,.45)'; ctx.lineWidth=1.3; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(sp[0]-lauf[0]*R*0.7,sp[1]-lauf[1]*R*0.7);
      ctx.lineTo(sp[0]+lauf[0]*stab*2.6,sp[1]+lauf[1]*stab*2.6); ctx.stroke(); ctx.setLineDash([]);
      const sw=Math.abs(schattenW(b)+fe);
      legende.push({nm,b,sw,farbe});
    });
    legende.forEach((L,i)=>{
      const y=16*K+i*20*K;
      text(L.nm+': '+grad(L.b)+' N  –  '+(L.sw<0.3?'kein Schatten':'Schattenwinkel '+grad(L.sw)),
        12,y,L.farbe,{sz:13,fett:true,rand:'#fff'});
    });
    const w1=(90-bA)*RAD, w2=(90-bB)*RAD;
    ctx.strokeStyle='rgba(37,99,235,.45)'; ctx.lineWidth=1.2;
    [w1,w2].forEach(w=>{ ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(w),cy-R*Math.sin(w)); ctx.stroke(); });
    pfeilBogen(cx,cy,R*0.3,-Math.max(w1,w2),-Math.min(w1,w2),'#dc2626','α = '+grad(Math.abs(bA-bB)));
  } else {
    /* Die Sonne liegt im flachen Modell nur wenige tausend Kilometer hoch - damit passt
       das ganze Bild in einen Maßstab: Boden, beide Orte und die Sonne darüber. */
    const y0=HV*0.86, stab=32;
    const xmin=Math.min(0,fl.sKm,fl.fussKm), xmax=Math.max(0,fl.sKm,fl.fussKm);
    const spanne=Math.max(xmax-xmin,1)*1.25;
    const jeKm=(isFinite(fl.h)&&fl.h>0)
      ? Math.min(W*0.72/spanne, (HV*0.62)/fl.h)
      : W*0.72/spanne;
    const X=km=>W*0.5+(km-(xmin+xmax)/2)*jeKm;
    ctx.strokeStyle='#92400e'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(W*0.04,y0); ctx.lineTo(W*0.96,y0); ctx.stroke();
    ctx.fillStyle='rgba(146,64,14,.08)'; ctx.fillRect(W*0.04,y0,W*0.92,HV-y0);
    text('flache Erde',W*0.05,y0+15*K,'#92400e',{sz:12.5,fett:true});
    const sx=X(fl.fussKm), sy=y0-fl.h*jeKm;
    const sichtbar=isFinite(fl.h)&&fl.h>0&&sy>6;
    const legF=[];
    [[0,schattenW(bA)+f,'A',bA,'#2563eb'],[fl.sKm,schattenW(bB),'B',bB,'#16a34a']].forEach(([km,sw,nm,br,farbe])=>{
      const x=X(km);
      ctx.strokeStyle=farbe; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y0-stab); ctx.stroke();
      ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(x,y0,3.5,0,7); ctx.fill();
      text(nm,x,y0+16*K,farbe,{al:'center',sz:14,fett:true});
      /* Schatten des Stabes am Boden: Er zeigt von der Sonne weg, sein Winkel ist der gemessene. */
      const sch=-Math.tan(sw*RAD)*stab;
      ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x+sch,y0); ctx.stroke();
      /* der Strahl: von der Sonne über die Stabspitze bis zur Schattenspitze */
      if(sichtbar){ ctx.strokeStyle='rgba(234,179,8,.9)'; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(x,y0-stab); ctx.lineTo(x+sch,y0); ctx.stroke(); }
      legF.push({nm,br,sw:Math.abs(sw),farbe});
    });
    legF.forEach((L,i)=>text(L.nm+': '+grad(L.br)+' N  –  '+(L.sw<0.3?'kein Schatten':'Schattenwinkel '+grad(L.sw)),
      12,16*K+i*20*K,L.farbe,{sz:13,fett:true,rand:'#fff'}));
    if(sichtbar){
      /* Höhe der Sonne als bemaßte Strecke */
      ctx.strokeStyle='#92400e'; ctx.lineWidth=1.3; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx,y0); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(sx-6,sy+9); ctx.lineTo(sx,sy); ctx.lineTo(sx+6,sy+9);
      ctx.moveTo(sx-6,y0-9); ctx.lineTo(sx,y0); ctx.lineTo(sx+6,y0-9); ctx.stroke();
      text('h ≈ '+zahl(fl.h,0)+' km',sx+10*K,(sy+y0)/2,'#92400e',{sz:14,fett:true,rand:'#fff'});
      const g=ctx.createRadialGradient(sx,sy,0,sx,sy,46); g.addColorStop(0,'rgba(250,204,21,.6)'); g.addColorStop(1,'rgba(250,204,21,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,46,0,7); ctx.fill();
      ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(sx,sy,13,0,7); ctx.fill();
      text('hier müsste die Sonne stehen',sx,sy-26*K,'#a16207',{al:'center',sz:13,fett:true,rand:'#fff'});
    } else if(isFinite(fl.h)&&fl.h>0){
      text('Die Sonne läge außerhalb des Bildes – die Orte liegen zu dicht beieinander.',W/2,HV*0.2,'#92400e',{al:'center',sz:13,fett:true});
    } else {
      text('Diese beiden Messungen passen im flachen Modell zu gar keiner Sonne.',W/2,HV*0.2,'#92400e',{al:'center',sz:13,fett:true});
    }
    text('Zum Vergleich: In Wirklichkeit steht die Sonne 149,6 Mio km hoch.',W/2,HV-10*K,'#94a3b8',{al:'center',sz:12});
  }
}

/* ============================================================
   Seite 3: Entfernung Erde–Mond aus der Triangulierung bei Halbmond
   Bei genau halbem Mond ist der Winkel Erde–Mond–Sonne 90°.
   Dann gilt:  Erde–Mond = Erde–Sonne · cos ε
   ============================================================ */
const MOND_WAHR=384400;
function zeichneMond(){
  const M=D.mond, eps=M.eps/100, cosE=Math.cos(eps*RAD), dM=AE*cosE;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const abw=(dM-MOND_WAHR)/MOND_WAHR*100;
  const dM2=AE*Math.cos((eps+0.1)*RAD);
  const hoch=infoHell([
    {t:'Erde–Mond = 1 AE · cos ε = '+zahl(dM,0)+' km'+(eps>89.99?'':'   ('+(abw>=0?'+':'−')+zahl(Math.abs(abw),0)+' % gegenüber 384 400 km)'),
      f:'#1f2430',sz:16,fett:true},
    {t:'ε = '+grad(eps,2)+' · cos ε = '+zahl(cosE,5)+' · die Sonne steht '+zahl(1/cosE,0)+'-mal weiter weg als der Mond'},
    {t:'Schon 0,1° mehr ergäben '+zahl(dM2,0)+' km – ein Unterschied von '+zahl(Math.abs(dM-dM2),0)
      +' km. Aristarch maß 87° und schloss daraus: Sonne nur 19-mal weiter als der Mond.'}
  ]);
  const HV=H-hoch;
  const Ls=W*0.62, ex=W*0.15, ey=HV*0.78;
  const epsD=M.mass?eps:Math.acos(clamp(Math.pow(cosE,0.18),0.15,0.72))*GRD;
  const Lm=Ls*Math.cos(epsD*RAD);
  const dir=[Math.cos(epsD*RAD),-Math.sin(epsD*RAD)];
  const mx=ex+dir[0]*Lm, my=ey+dir[1]*Lm;
  const sx=ex+Ls, sy=ey;
  /* Strecken */
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.6;
  if(M.hilf){ ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(sx,sy); ctx.stroke(); ctx.setLineDash([]); }
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(mx,my); ctx.stroke();
  ctx.strokeStyle='#eab308'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(sx,sy); ctx.stroke();
  /* Sonne, Erde, Mond */
  const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,34); sg.addColorStop(0,'rgba(250,204,21,.65)'); sg.addColorStop(1,'rgba(250,204,21,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,34,0,7); ctx.fill();
  ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(sx,sy,13,0,7); ctx.fill();
  text('Sonne',sx,sy+28*K,'#a16207',{al:'center',sz:12.5,fett:true});
  ctx.fillStyle='#2563eb'; ctx.beginPath(); ctx.arc(ex,ey,10,0,7); ctx.fill();
  text('Erde',ex,ey+24*K,'#2563eb',{al:'center',sz:12.5,fett:true});
  /* Mond: genau halb beleuchtet, die helle Seite zeigt zur Sonne */
  const zs=Math.atan2(sy-my,sx-mx), rM=9;
  ctx.fillStyle='#64748b'; ctx.beginPath(); ctx.arc(mx,my,rM,0,7); ctx.fill();
  ctx.fillStyle='#e2e8f0'; ctx.beginPath(); ctx.arc(mx,my,rM,zs-Math.PI/2,zs+Math.PI/2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#475569'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(mx,my,rM,0,7); ctx.stroke();
  text('Mond (genau halb)',mx+(epsD>60?14*K:0),my-18*K,'#334155',{al:epsD>60?'left':'center',sz:12.5,fett:true,rand:'#fff'});
  if(M.hilf){
    pfeilBogen(ex,ey,Math.min(64,Lm*0.55),-epsD*RAD,0,'#dc2626','ε = '+grad(eps,2));
    const dE=[(ex-mx),(ey-my)], dS=[(sx-mx),(sy-my)];
    const n1=[dE[0]/Lm,dE[1]/Lm], l2=Math.hypot(dS[0],dS[1]), n2=[dS[0]/l2,dS[1]/l2];
    rechterWinkel(mx,my,n1,n2,13,'#dc2626');
    text('90°',mx+(n1[0]+n2[0])*26,my+(n1[1]+n2[1])*26,'#dc2626',{al:'center',sz:12,fett:true,rand:'#fff'});
    text('1 AE = 149,6 Mio km',(ex+sx)/2,ey+22*K,'#64748b',{al:'center',sz:12.5});
    text(zahl(dM/1e6,2)+' Mio km',(ex+mx)/2-12*K,(ey+my)/2,'#2563eb',{al:'right',sz:12.5,fett:true,rand:'#fff'});
  }
  if(!M.mass) text('schematisch – der wahre Winkel ist fast ein rechter, siehe „maßstabsgetreu"',W/2,16*K,'#94a3b8',{al:'center',sz:12});
  else text('maßstabsgetreu: Bei ε = '+grad(eps,2)+' liegt der Mond fast auf der Linie zur Sonne.',W/2,16*K,'#94a3b8',{al:'center',sz:12});
  /* So sieht der Halbmond von der Erde aus - das ist der Augenblick, auf den es ankommt. */
  const hx=W*0.16, hy=HV*0.3, hr=Math.min(34,HV*0.12);
  ctx.fillStyle='#475569'; ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fill();
  ctx.fillStyle='#f1f5f9'; ctx.beginPath(); ctx.arc(hx,hy,hr,-Math.PI/2,Math.PI/2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#334155'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.stroke();
  text('genau halber Mond:',hx,hy-hr-26*K,'#334155',{al:'center',sz:12.5,fett:true});
  text('dann ist der Winkel am Mond 90°',hx,hy-hr-10*K,'#64748b',{al:'center',sz:12});
}

/* ============================================================
   Seite 4: Entfernung Erde–Sonne aus der Parallaxe beim Venustransit
   Zwei Beobachter sehen die Venus vor verschiedenen Bahnen über die
   Sonnenscheibe ziehen. Aus der Verschiebung folgt der Maßstab.
   ============================================================ */
const D_EV=1-0.723332;                                    /* Erde–Venus bei unterer Konjunktion (AE) */
function zeichneSonneTab(){
  const P=D.sonne, b=P.basis;
  const delta=(b/AE)*(1/D_EV-1);                          /* wahre Verschiebung im Bogenmaß */
  const dMess=delta*(1+P.fehler/500);                     /* bis zu 10 % Messfehler */
  const aeB=b*(1/D_EV-1)/dMess;
  const rSonne=Math.asin(696342/AE)*GRD*3600;             /* Winkelradius der Sonne in Bogensekunden */
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const abw=(aeB-AE)/AE*100;
  const hoch=infoHell([
    {t:'1 AE = b · (1/0,2767 − 1) / Δ = '+zahl(aeB/1e6,1)+' Mio km   ('+(abw>=0?'+':'−')+zahl(Math.abs(abw),1)+' % gegenüber 149,6 Mio km)',
      f:'#1f2430',sz:16,fett:true},
    {t:'Beobachterabstand b = '+zahl(b,0)+' km · Verschiebung der beiden Bahnen Δ = '+zahl(dMess*GRD*3600,1)
      +'″ = '+zahl(dMess*GRD*3600/(2*rSonne)*100,2)+' % des Sonnendurchmessers'
      +(P.fehler?' (mit '+zahl(P.fehler/5,1)+' % Messfehler)':'')},
    {t:'Kepler liefert nur die Verhältnisse der Bahnen. Eine einzige gemessene Entfernung legt den Maßstab des ganzen Sonnensystems fest – 1761 und 1769 reisten dafür Expeditionen um die halbe Welt.'}
  ]);
  const HV=H-hoch;
  const ey=HV*0.5, ex=W*0.07, rE=Math.max(14,Math.min(26,HV*0.08));
  const sxp=W*0.55, vx=ex+(sxp-ex)*0.42, rS=Math.max(20,Math.min(44,HV*0.15));
  /* Erde mit zwei Beobachtern */
  ctx.fillStyle='#dbeafe'; ctx.strokeStyle='#2563eb'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(ex,ey,rE,0,7); ctx.fill(); ctx.stroke();
  text('Erde',ex,ey+rE+15*K,'#2563eb',{al:'center',sz:12.5,fett:true});
  const aY=ey-rE*0.78, bY=ey+rE*0.78;
  [[aY,'A','#16a34a'],[bY,'B','#dc2626']].forEach(([y,nm,farbe])=>{
    ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(ex+rE*0.62,y,4.5,0,7); ctx.fill();
    text(nm,ex+rE*0.62-13*K,y,farbe,{al:'right',sz:12.5,fett:true}); });
  /* Sonne */
  const sg=ctx.createRadialGradient(sxp,ey,0,sxp,ey,rS*2.1); sg.addColorStop(0,'rgba(250,204,21,.5)'); sg.addColorStop(1,'rgba(250,204,21,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sxp,ey,rS*2.1,0,7); ctx.fill();
  ctx.fillStyle='#fde047'; ctx.strokeStyle='#eab308'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(sxp,ey,rS,0,7); ctx.fill(); ctx.stroke();
  text('Sonne',sxp,ey+rS+15*K,'#a16207',{al:'center',sz:12.5,fett:true});
  /* Venus und die beiden Sichtlinien */
  /* Beide sehen dieselbe Venus - hinter ihr laufen die Sichtlinien auseinander. */
  if(P.strahl){
    const ox=ex+rE*0.62;
    [[aY,'#16a34a'],[bY,'#dc2626']].forEach(([y,farbe])=>{
      const k=(sxp-ox)/(vx-ox), ty=y+(ey-y)*k;
      ctx.strokeStyle=farbe; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(ox,y); ctx.lineTo(vx,ey); ctx.lineTo(sxp,ty); ctx.stroke(); ctx.setLineDash([]);
    });
  }
  ctx.fillStyle='#8b5e34'; ctx.beginPath(); ctx.arc(vx,ey,6,0,7); ctx.fill();
  text('Venus',vx,ey-16*K,'#8b5e34',{al:'center',sz:12.5,fett:true,rand:'#fff'});
  text('schematisch: Größen und Abstände überhöht',W*0.3,HV-12*K,'#94a3b8',{al:'center',sz:12});
  /* Sonnenscheibe, wie sie die beiden sehen - hier stimmen die Größenverhältnisse */
  const ix=W*0.80, iy=HV*0.44, ir=Math.min(W*0.16,HV*0.33);
  ctx.fillStyle='#fef9c3'; ctx.strokeStyle='#eab308'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(ix,iy,ir,0,7); ctx.fill(); ctx.stroke();
  const vr=ir*58/1918*2;                                   /* Venus im richtigen Größenverhältnis */
  let ab=ir*(dMess*GRD*3600)/rSonne, lupe=1;               /* Abstand der beiden Bahnen */
  if(ab<16){ lupe=16/Math.max(ab,0.3); ab=16; }            /* sonst liegen die Bahnen aufeinander */
  [[-1,'#16a34a','A'],[1,'#dc2626','B']].forEach(([s,farbe,nm])=>{
    const y=iy+s*ab/2, halb=Math.sqrt(Math.max(0,ir*ir-(y-iy)*(y-iy)));
    ctx.strokeStyle=farbe; ctx.lineWidth=1.6; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(ix-halb,y); ctx.lineTo(ix+halb,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#1f2430'; ctx.beginPath(); ctx.arc(ix-halb*0.3,y,Math.max(1.5,vr),0,7); ctx.fill();
    text(nm,ix+halb+9*K,y,farbe,{sz:12,fett:true});
  });
  text('so sieht man die Venus über die Sonne ziehen',ix,iy+ir+16*K,'#64748b',{al:'center',sz:12});
  if(lupe>1.5) text('Abstand '+zahl(lupe,0)+'-fach überhöht gezeichnet',ix,iy+ir+32*K,'#94a3b8',{al:'center',sz:11.5});
  ctx.strokeStyle='#1f2430'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(ix-ir*0.52,iy-ab/2); ctx.lineTo(ix-ir*0.52,iy+ab/2); ctx.stroke();
  text('Δ',ix-ir*0.52-9*K,iy,'#1f2430',{al:'right',sz:13,fett:true,rand:'#fef9c3'});
}

/* ============================================================
   Seite 5: Entfernung naher Sterne aus der Parallaxe
   Die Erdbahn ist die Grundlinie: Im Lauf eines Jahres beschreibt
   ein naher Stern vor den fernen eine kleine Ellipse.
   ============================================================ */
const STERNE=[{n:'Proxima Centauri (nächster Stern)',d:424},{n:'Sirius',d:860},
  {n:'61 Cygni (Bessel 1838)',d:1140},{n:'Prokyon',d:1146},{n:'Wega',d:2500}];
function zeichneStern(){
  const St=D.stern, dLj=St.d/100, dKm=dLj*LJ;
  const p=Math.atan(AE/dKm)*GRD*3600, pc=dLj*LJ/PC;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const hoch=infoHell([
    {t:'Parallaxe p = '+zahl(p,3)+'″   →   Entfernung d = 1 AE / tan p = '+zahl(dLj,2)+' Lichtjahre = '+zahl(pc,2)+' pc',
      f:'#1f2430',sz:16,fett:true},
    {t:'Bei p = 1″ ist ein Stern genau 1 Parsec weit (3,26 Lichtjahre). Die Entfernung ist umgekehrt proportional zum Winkel: d[pc] = 1 / p[″].'},
    {t:'Zum Vergleich: Der Vollmond ist 1 800″ breit – p ist rund '+zahl(1800/p,0)
      +'-mal kleiner. Deshalb gelang die erste Sternparallaxe erst 1838 (Bessel am 61 Cygni), 300 Jahre nach Kopernikus.'}
  ]);
  const HV=H-hoch;
  const sx=W*0.13, sy=HV*0.55, r0=Math.min(W*0.085,HV*0.27);
  /* Sonne und Erdbahn */
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.ellipse(sx,sy,r0,r0*0.42,0,0,7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(sx,sy,9,0,7); ctx.fill();
  text('Sonne',sx,sy+16*K,'#a16207',{al:'center',sz:12,fett:true,rand:'#fff'});
  const e1=[sx-r0,sy], e2=[sx+r0,sy];
  const posten=[[e1,'Januar','#2563eb'],[e2,'Juli','#16a34a']];
  /* Stern rechts, die Linien mit einer Bruchstelle */
  const stx=W*0.58, sty=HV*0.3;
  posten.forEach(([e,nm,farbe])=>{
    ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(e[0],e[1],6,0,7); ctx.fill();
    text(nm,e[0],e[1]+(nm==='Januar'?18*K:18*K),farbe,{al:'center',sz:12,fett:true,rand:'#fff'});
    ctx.strokeStyle=farbe; ctx.lineWidth=1.5;
    const mx=(e[0]+stx)/2, my=(e[1]+sty)/2, dx=stx-e[0], dy=sty-e[1], l=Math.hypot(dx,dy);
    const nx=-dy/l, ny=dx/l;
    ctx.beginPath(); ctx.moveTo(e[0],e[1]);
    ctx.lineTo(mx-dx*0.04,my-dy*0.04);
    ctx.lineTo(mx-dx*0.02+nx*6,my-dy*0.02+ny*6);
    ctx.lineTo(mx+dx*0.02-nx*6,my+dy*0.02-ny*6);
    ctx.lineTo(mx+dx*0.04,my+dy*0.04);
    ctx.lineTo(stx,sty); ctx.stroke();
  });
  ctx.fillStyle='#1f2430'; ctx.beginPath(); ctx.arc(stx,sty,7,0,7); ctx.fill();
  ctx.strokeStyle='#1f2430'; ctx.lineWidth=1.2;
  for(let i=0;i<4;i++){ const w=i*Math.PI/4;
    ctx.beginPath(); ctx.moveTo(stx-Math.cos(w)*13,sty-Math.sin(w)*13); ctx.lineTo(stx+Math.cos(w)*13,sty+Math.sin(w)*13); ctx.stroke(); }
  text('naher Stern',stx+18*K,sty,'#1f2430',{sz:12.5,fett:true});
  const wm=Math.atan2(e2[1]-sty,e2[0]-stx), w1=Math.atan2(e1[1]-sty,e1[0]-stx);
  pfeilBogen(stx,sty,42,Math.min(w1,wm),Math.max(w1,wm),'#dc2626','2p = '+zahl(2*p,3)+'″');
  text('Strecke stark verkürzt – der Stern ist '+zahl(dKm/AE/1e3,0)+' Tausend AE weit weg',W*0.36,HV-14*K,'#94a3b8',{al:'center',sz:12});
  /* Himmelsausschnitt: so sieht man den Stern wandern */
  const ix=W*0.845, iy=HV*0.46, ir=Math.min(W*0.13,HV*0.33);
  ctx.fillStyle='#0b1324'; ctx.beginPath(); ctx.arc(ix,iy,ir,0,7); ctx.fill();
  const z=festerZufall(77);
  for(let i=0;i<70;i++){ const w=z()*2*Math.PI, rr=Math.sqrt(z())*ir;
    ctx.fillStyle='rgba(255,255,255,'+(0.3+z()*0.6).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(ix+Math.cos(w)*rr,iy+Math.sin(w)*rr,z()*1.3+0.5,0,7); ctx.fill(); }
  const pxJeBs=St.lupe/100, aPx=p*pxJeBs;
  if(St.spur){ ctx.strokeStyle='rgba(248,250,252,.55)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.ellipse(ix,iy,Math.min(aPx,ir*0.9),Math.min(aPx*0.42,ir*0.9),0,0,7); ctx.stroke(); ctx.setLineDash([]); }
  [[-1,'#60a5fa','Jan'],[1,'#4ade80','Jul']].forEach(([s,farbe,nm])=>{
    const x=ix+s*Math.min(aPx,ir*0.9);
    ctx.strokeStyle=farbe; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(x-5,iy); ctx.lineTo(x+5,iy); ctx.moveTo(x,iy-5); ctx.lineTo(x,iy+5); ctx.stroke();
    text(nm,x,iy-13*K,farbe,{al:'center',sz:11,fett:true}); });
  text('1″ ≙ '+zahl(pxJeBs,0)+' Bildpunkte (Lupe)',ix,iy+ir+16*K,'#64748b',{al:'center',sz:12});
}

/* ============================================================
   Zeichnen und Laufen
   ============================================================ */
function zeichne(){
  if(!W||!H) return;
  ctx.save();
  if(D.tab==='system') zeichneSystem();
  else if(D.tab==='erat') zeichneErat();
  else if(D.tab==='mond') zeichneMond();
  else if(D.tab==='sonne') zeichneSonneTab();
  else zeichneStern();
  ctx.restore();
}
let letzte=0, laufId=0;
function schleife(jetzt){
  laufId=0;
  if(!(D.tab==='system'&&D.sys.lauf)) return;
  const dt=Math.min(0.1,(jetzt-letzte)/1000); letzte=jetzt;
  D.sys.t+=dt*tempoTage();
  zeichne();
  laufId=requestAnimationFrame(schleife);
}
function laufStart(){ if(laufId) return; letzte=performance.now(); laufId=requestAnimationFrame(schleife); }
function laufStopp(){ if(laufId) cancelAnimationFrame(laufId); laufId=0; }
function laufPruefen(){ if(D.tab==='system'&&D.sys.lauf) laufStart(); else laufStopp(); }

/* ============================================================
   Bedienung
   ============================================================ */
/* Vom Körper aus: Der Ausschnitt soll zum Blickziel passen - der Mond füllt dann das Bild,
   Mars bleibt ein Punkt vor den Sternen. */
function fovPassend(){
  const S=D.sys; if(S.von==='aussen') return;
  if(S.von==='ort'){ S.fov=70; return; }                  /* am Boden sieht man den halben Himmel */
  const d=betrag(sub(ortZ(S.ziel,S.t),ortZ(S.von,S.t)));
  const w=2*Math.asin(clamp(radZ(S.ziel)/Math.max(d,1e-9),-1,1))*GRD;
  S.fov=w>0.1?clamp(w*8,0.3,40):25;
}
function tempoText(){
  if(D.sys.echt) return 'Echtzeit';
  const d=tempoTage();
  if(d>=365) return zahl(d/365.25,1)+' a/s';
  if(d>=1) return zahl(d,d<10?1:0)+' d/s';
  if(d*24>=1) return zahl(d*24,1)+' h/s';
  return zahl(d*1440,0)+' min/s';
}
function setzeTab(t){
  D.tab=t;
  document.querySelectorAll('#tabs .tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('#bar2 .reihe').forEach(r=>{ r.hidden=r.dataset.tab!==t; });
  $('cvbox').classList.toggle('dunkel',t==='system');
  $('bar3').hidden=(t!=='system');                 /* die zweite Zeile gehört zum Sonnensystem */
  if(t!=='system'){ $('selPipZiel').hidden=true; pipStand=null; }
  $('hint').textContent=t!=='system' ? ''
    : (D.sys.von==='aussen'?'Ziehen = drehen · zwei Finger oder Mausrad = zoomen'
      :(D.sys.von==='ort'?'Ziehen = am Himmel umsehen · zwei Finger oder Mausrad = Ausschnitt'
        :'Ziehen = umsehen · zwei Finger oder Mausrad = Ausschnitt'));
  if(t==='system') listePruefen();
  laufPruefen(); oberflaeche(); zeichne();
}
function oberflaeche(){
  const S=D.sys;
  $('bPlay').textContent=S.lauf?'❚❚':'▶';
  $('bPlay').title=S.lauf?'anhalten':'starten';
  $('rTempo').value=String(S.tempo); $('vTempo').textContent=tempoText();
  $('tEcht').classList.toggle('on',S.echt);
  $('tLupe').classList.toggle('on',!!S.lupe);
  $('tLupe').title='Zeitlupe – '+(S.letztes&&ZEITLUPE[S.letztes]
    ? 'passend zum Ereignis „'+EREIG_NAME[S.letztes]+'": '
    : 'ein Fünfundzwanzigstel des eingestellten Tempos: ')+zahl(lupeTempo()*24,2)+' Stunden je Sekunde';
  document.querySelectorAll('[data-von]').forEach(b=>b.classList.toggle('on',b.dataset.von===S.von));
  $('selOrt').hidden=(S.von!=='ort'); $('selOrt').value=String(S.ort||0);
  $('tKuppel').classList.toggle('on',!!S.kuppelAn);
  $('kuppelFeld').hidden=!S.kuppelAn;
  $('rKuppel').value=String(S.kuppel===undefined?78:S.kuppel);
  $('vKuppel').textContent=zahl(kuppelRadius(),kuppelRadius()<10?1:0)+' R⊕';
  $('kuppelFeld').title='Radius der Horizontkuppel: '+zahl(kuppelRadius(),2)+' Erdradien'
    +(stufeUI()==='echt'?' ≈ '+zahl(kuppelRadius()*6371,0)+' km':'')+' – bei 60 reicht sie bis zum Mond';
  $('selZiel').value=S.ziel; $('selBezug').value=S.bezug; $('selPip').value=S.pip||'aus';
  $('selStufe').value=stufeUI();
  $('selStufe').disabled=S.von!=='aussen';
  $('selStufe').title=S.von==='aussen'
    ? 'maßstabsgetreu · anschaulich (Körper aufgeblasen) · Schattenmodell (alles quer zur Sonne überhöht)'
    : 'Von einem Körper aus wird immer maßstabsgetreu gezeigt – der Himmel ist dort ohnehin groß genug';
  $('setSF').value=String(D.sys.sf||SF_STD);
  $('setSFv').textContent=zahl(sfUI(),0)+'-fach · Mondbahn '+grad(neigungUI(),0);
  $('tBahn').classList.toggle('on',S.bahnen);
  $('tEbene').classList.toggle('on',S.ebenen);
  $('tSchatten').classList.toggle('on',schattenUI());
  $('tSchatten').disabled=S.von!=='aussen';
  $('tSchatten').title=S.von==='aussen'?'Schattenkegel von Erde und Mond einblenden'
    :'Schattenkegel zeigt nur der Blick von außen – vom Körper aus sieht man den Schatten erst, wenn er trifft';
  $('tSterne').classList.toggle('on',S.sterne);
  const E=D.erat;
  $('rEA').value=String(E.a); $('vEA').textContent=grad(E.a)+' N';
  $('rEB').value=String(E.b); $('vEB').textContent=grad(E.b)+' N';
  $('rEF').value=String(E.fehler); $('vEF').textContent=grad(E.fehler/100,2);
  $('tStrahlen').classList.toggle('on',E.strahlen);
  $('tFlach').classList.toggle('on',E.flach);
  const M=D.mond;
  $('rEps').value=String(M.eps); $('vEps').textContent=grad(M.eps/100,2);
  $('mondBsp').value=String(M.eps);
  $('tMondMass').classList.toggle('on',M.mass);
  $('tMondHilf').classList.toggle('on',M.hilf);
  const P=D.sonne;
  $('rBasis').value=String(P.basis); $('vBasis').textContent=zahl(P.basis,0)+' km';
  $('rSF').value=String(P.fehler); $('vSF').textContent=(P.fehler>0?'+':'')+zahl(P.fehler/5,1)+' %';
  $('tSStrahl').classList.toggle('on',P.strahl);
  const St=D.stern;
  $('rStern').value=String(St.d); $('vStern').textContent=zahl(St.d/100,2)+' Lj';
  $('sternBsp').value=String(St.d);
  $('rLupe').value=String(St.lupe); $('vLupe').textContent=zahl(St.lupe/100,0)+' Px/″';
  $('tSternSpur').classList.toggle('on',St.spur);
  $('setNamen').checked=!!S.namen; $('setAnsicht').checked=!!S.ansichtMit;
}

    'Die <b>Zeit</b> läuft mit ▶; das Tempo sagt, wie viel Modellzeit auf eine Sekunde kommt – <b>Echtzeit</b> zeigt, '+
    'wie langsam der Himmel wirklich ist. Mit <b>⏪ und ⏩</b> geht es einen Schritt zurück oder vor; ein Schritt ist '+
    'so viel, wie eine Sekunde Lauf bringen würde. <b>Zeitlupe</b> stellt das Tempo auf das zuletzt gewählte Ereignis '+
    'ein: bei einer Finsternis rund zehn Minuten je Sekunde, bei den Mondphasen ein halber Tag, bei der Marsschleife '+
    'drei Tage. Ohne gewähltes Ereignis nimmt sie ein Fünfundzwanzigstel des eingestellten Tempos.</p>'+
    '<h4>Drei Darstellungen</h4><p><b>maßstabsgetreu</b> zeigt die wahren Größen: Die Planeten werden zu Punkten – '+
    'genau das ist die Aussage. Ein dünner Ring hilft, sie zu finden. <b>anschaulich</b> bläst die Körper und die '+
    'Mondbahn auf, damit man im Überblick etwas sieht; Schatten gibt es dann keine.</p>'+
    '<p><b>Schattenmodell</b> überhöht alles <b>quer zur Richtung zur Sonne</b> mit demselben Faktor (im ⚙ '+
    'einstellbar): Erde und Mond werden größer, die Schattenkegel dicker und die <b>Mondbahn stärker geneigt</b>. '+
    'Längs der Achse bleibt alles wahr, deshalb stimmen die Verhältnisse: Der Kernschatten der Erde reicht weiter '+
    'als die Mondbahn, der Kernschatten des Mondes endet gerade bei der Erde, und der Mond passt genauso in den '+
    'Erdschatten wie in Wirklichkeit. Weil auch seine Abweichung von der Erdbahnebene mit überhöht wird, gibt es '+
    'die Finsternisse <b>zu denselben Zeiten</b> – im Bild dauern sie nur länger.</p>'+
    '<h4>Standort</h4><p>Von <b>außen</b> dreht man die Szene mit dem Finger. Von <b>Sonne, Erde oder Mond</b> aus '+
    'steht man auf dem Körper und blickt auf den gewählten: Von der Erde auf den Mond sieht man die <b>Mondphase</b>, '+
    'auf die Sonne den <b>Venustransit</b>, auf Mars seine <b>Schleifenbahn</b> vor den Sternen.</p>'+
    '<h4>Am Ort</h4><p>Der Standort <b>am Ort</b> stellt einen auf den Boden eines Ortes – voreingestellt '+
    '<b>Amberg</b>, in der Liste daneben stehen weitere von Nordkap bis Sydney. Dann liegt der <b>Horizont</b> '+
    'waagrecht im Bild, unten stehen die <b>Himmelsrichtungen</b>, und mit dem Finger dreht man sich um die '+
    'eigene Achse. Die Erde dreht sich dabei richtig mit: Sonne, Mond und Sterne gehen auf und unter.</p>'+
    '<p>Der <b>Mond</b> wird dabei <b>größer gezeichnet</b>, als er am Himmel erscheint – mit seinem halben '+
    'Grad wäre von der Phase nichts zu erkennen. Seine <b>Lage stimmt</b>: Die helle Seite zeigt genau dorthin, '+
    'wo die Sonne steht, auch wenn sie schon untergegangen ist. Zoomt man heran, bekommt er wieder sein wahres '+
    'Maß, und dicht bei der Sonne (Finsternis) bleibt er ohnehin maßstabsgetreu.</p>'+
    '<p>Sind <b>Ebenen</b> eingeblendet, zeigt der Himmel die <b>Ekliptik</b> mit den zwölf '+
    '<b>Tierkreiszeichen</b>; sind <b>Bahnen</b> eingeblendet, zusätzlich den <b>Tagbogen</b> von Sonne und '+
    'Mond – den Weg also, den sie an diesem Tag über den Himmel nehmen. Daran sieht man unmittelbar, warum die '+
    'Sonne im Sommer hoch und im Winter flach steht. Die Tierkreiszeichen sind die zwölf 30°-Abschnitte ab dem '+
    '<b>Frühlingspunkt</b>; weil der wandert, liegen sie heute nicht mehr über den gleichnamigen Sternbildern. '+
    'Der gewählte Ort ist auch <b>auf der Erdkugel markiert</b>, wenn man von außen auf sie schaut.</p>'+
    '<p>Der Schalter <b>Horizont</b> blendet die <b>Horizontkuppel</b> über diesem Ort ein – die Halbkugel '+
    'des Himmels, den man von dort aus sieht, mit Himmelsrichtungen am Rand, Höhenkreisen bei 30° und 60° und '+
    'dem Zenit obenauf. Von außen betrachtet sieht man damit auf einen Blick, was über und was unter dem '+
    'Horizont steht. Der <b>Radius</b> lässt sich daneben einstellen (in Erdradien): Bei <b>60</b> reicht die '+
    'Kuppel bis zur Mondbahn – steht der Mond dann innerhalb, ist er in Amberg gerade am Himmel. Maßstabsgetreu '+
    'stimmen die Größen; im anschaulichen Modell wächst die Kuppel mit der aufgeblasenen Erde mit.</p>'+
    '<h4>heliozentrisch oder geozentrisch</h4><p>Das Umschalten ändert nur, <b>wer stillsteht</b>. Geozentrisch läuft '+
    'die Sonne um die Erde und die Bahnen von Venus und Mars bekommen Schleifen – dieselbe Bewegung, anderer Bezugspunkt. '+
    'Genau diese Schleifen beschrieb Ptolemäus mit Epizykeln.</p>'+
    '<h4>Ebenen und Schatten</h4><p>Die <b>Mondbahn</b> ist um 5,1° gegen die Erdbahnebene geneigt. Nur wenn Neumond '+
    'oder Vollmond nahe der <b>Knotenlinie</b> eintritt, treffen die Schattenkegel – deshalb gibt es nicht jeden Monat '+
    'eine Finsternis.</p>'+
    '<h4>Ereignisse</h4><p>Die <b>Liste</b> zeigt die nächsten Finsternisse, Mondphasen, Sonnenwenden, die '+
    'Mars-Opposition und den nächsten Venustransit <b>mit Datum</b>; ein Tipp darauf stellt die Zeit dorthin. '+
    'Mit <b>↻</b> wird sie ab der gerade eingestellten Zeit neu gefüllt. Ist im ⚙ „Ansicht passend einstellen" '+
    'angehakt, stellen sich dabei auch Standort, Ausschnitt und Darstellung passend ein.</p>'+
    '<h4>Zweites Fenster</h4><p>Das kleine Fenster oben rechts zeigt <b>dasselbe Ereignis von einem anderen '+
    'Standort aus</b> – etwa die Geometrie von außen und daneben den Blick vom Boden der Erde. Die Liste in der '+
    'Leiste sagt, <b>von wo</b> geschaut wird; die Liste <b>unter dem Fenster</b> sagt, <b>worauf</b>: von der '+
    'Erde auf Mond, Sonne, Venus oder Mars, vom Mond auf die Erde, von außen auf das Erde-Mond-System oder auf '+
    'das ganze Sonnensystem. Steht sie auf <b>automatisch</b>, sucht sich das Fenster das Ziel selbst: bei '+
    'Sonnenfinsternis und Venustransit von der Erde zur Sonne, sonst zum Mond.</p>'],
  erat:['Erdumfang nach Eratosthenes',
    '<p>Um −240 misst Eratosthenes in Alexandria zur Mittagszeit der Sommersonnenwende den Schattenwinkel eines '+
    'senkrechten Stabes: 7,2°. In Syene wirft ein Stab an diesem Tag keinen Schatten – die Sonne steht im Zenit.</p>'+
    '<p>Weil die Sonnenstrahlen praktisch parallel einfallen, ist der Unterschied der Schattenwinkel genau der '+
    '<b>Mittelpunktswinkel</b> α zwischen beiden Orten:</p><p><b>U = s · 360° / α</b></p>'+
    '<h4>Was daran groß ist</h4><p>Nötig sind nur ein Stab, ein Schatten und eine Streckenlänge. Vorausgesetzt wird '+
    'aber zweierlei: dass die Erde eine <b>Kugel</b> ist und dass die Sonne so weit weg steht, dass ihre Strahlen als '+
    '<b>parallel</b> gelten.</p>'+
    '<h4>Flache Erde</h4><p>Der Knopf rechnet dieselben Schattenwinkel im flachen Modell: Dort müsste die Sonne '+
    '<b>nahe</b> stehen, und ihre Höhe folgt aus dem Strahlensatz – <b>h = s / (tan α_A − tan α_B)</b>. Das Bild '+
    'zeigt den Boden, beide Stäbe mit ihren Schatten, die beiden Strahlen und die Sonne, bei der sie sich treffen, '+
    'mit bemaßter Höhe. Heraus kommen ein paar tausend Kilometer statt 149,6 Millionen – und vor allem: '+
    '<b>jedes Ortspaar ergibt einen anderen Wert</b>. Genau daran scheitert das flache Modell, während auf der '+
    'Kugel ein einziger Erdumfang zu allen Messungen passt.</p>'+
    '<h4>Zum Ausprobieren</h4><p>Zwei Orte dicht beieinander machen α winzig – dann schlägt jeder Messfehler riesig '+
    'durch. Deshalb wählte Eratosthenes zwei weit entfernte Orte.</p>'],
  mond:['Entfernung Erde–Mond',
    '<p>Bei <b>genau halbem Mond</b> schauen wir genau auf die Lichtgrenze: Der Winkel Erde–Mond–Sonne ist dann ein '+
    '<b>rechter</b>. Misst man im selben Augenblick den Winkel ε zwischen Mond und Sonne am Himmel, liegt das Dreieck '+
    'fest:</p><p><b>Erde–Mond = Erde–Sonne · cos ε</b></p>'+
    '<h4>Warum das so schwer ist</h4><p>Der wahre Wert ist ε = 89,85°, also fast ein rechter Winkel. Schon ein Zehntel '+
    'Grad Messfehler verschiebt das Ergebnis um mehr als die halbe Entfernung. <b>Aristarch</b> maß um −260 etwa 87° '+

    '<p>Aristarch kannte die Entfernung zum Mond bereits aus der Dauer von Mondfinsternissen und bekam so die '+
    'Sonnenentfernung. Heute geht man umgekehrt vor: Die AE ist bekannt (siehe <b>Erde–Sonne</b>), also liefert ε '+
    'die Mondentfernung.</p>'],
  sonne:['Entfernung Erde–Sonne',
    '<p>Keplers Gesetze geben nur die <b>Verhältnisse</b> der Bahnen: Venus läuft bei 0,723 AE, Mars bei 1,524 AE. '+
    'Wie groß eine AE in Kilometern ist, muss <b>einmal gemessen</b> werden – dann liegt das ganze Sonnensystem fest.</p>'+
    '<p>Beim <b>Venustransit</b> zieht die Venus vor der Sonnenscheibe vorbei. Zwei weit auseinander liegende '+

    '<p><b>1 AE = b · (1/0,2767 − 1) / Δ</b></p>'+
    '<p>Halley schlug das 1716 vor; 1761 und 1769 reisten Expeditionen dafür um die halbe Welt – James Cook bis '+
    'Tahiti. Δ ist winzig: wenige Prozent des Sonnendurchmessers. Der Messfehler-Regler zeigt, wie stark sich das '+

  stern:['Sternparallaxe',
    '<p>Die <b>Erdbahn</b> ist die größte Grundlinie, die uns zur Verfügung steht. Ein naher Stern scheint vor den '+
    'fernen im Lauf eines Jahres eine kleine Ellipse zu beschreiben. Der halbe Öffnungswinkel heißt <b>Parallaxe p</b>:</p>'+
    '<p><b>d = 1 AE / tan p</b>, mit p in Bogensekunden: <b>d[pc] = 1 / p[″]</b></p>'+
    '<p>1 Parsec ist die Entfernung, bei der p genau 1″ beträgt: 3,26 Lichtjahre. Selbst der nächste Stern kommt nur '+
    'auf 0,77″ – rund 2 300-mal kleiner als der Vollmond. Deshalb fand man die Parallaxe erst 1838 (Bessel am Stern '+
    '61 Cygni), und deshalb galt das Fehlen einer messbaren Parallaxe lange als Einwand gegen Kopernikus.</p>'+

};
function hilfeZeigen(){
  const h=HILFE[D.tab]||HILFE.system;
  $('hilfeTitel').textContent=h[0]; $('hilfeBody').innerHTML=h[1];
  $('hilfe').hidden=false;
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('hilfe').hidden=true; $('setts').open=false; } });

/* ---------- Knöpfe und Regler ---------- */
document.querySelectorAll('#tabs .tb').forEach(b=>b.onclick=()=>{ setzeTab(b.dataset.tab); sync(true); });
const an=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
an('bPlay',()=>{ D.sys.lauf=!D.sys.lauf; oberflaeche(); laufPruefen();
  if(!D.sys.lauf){ listePruefen(); sync(true); } });
an('bZurueck',()=>{ D.sys.t=0; zeichne(); listeFuellen(); sync(true); });
const schritt=v=>{ D.sys.t+=v*tempoTage(); zeichne(); sync(); };
an('bSchrittZ',()=>schritt(-1)); an('bSchrittV',()=>schritt(1));
$('rTempo').oninput=e=>{ D.sys.tempo=+e.target.value; D.sys.echt=false; D.sys.lupe=false; oberflaeche(); sync(); };
an('tEcht',()=>{ D.sys.echt=!D.sys.echt; if(D.sys.echt) D.sys.lupe=false; oberflaeche(); sync(); });
an('tLupe',()=>{ lupeSetzen(!D.sys.lupe); oberflaeche(); sync(); });
document.querySelectorAll('[data-von]').forEach(b=>b.onclick=()=>{
  const v=b.dataset.von; D.sys.von=v; D.sys.panAz=0; D.sys.panEl=0;
  if(v!=='aussen'&&D.sys.ziel===v) D.sys.ziel=(v==='erde')?'mond':'erde';
  fovPassend();
  setzeTab(D.tab); sync(true); });
$('selZiel').onchange=e=>{ D.sys.ziel=e.target.value;
  if(D.sys.von===D.sys.ziel) D.sys.von='aussen';
  fovPassend();
  setzeTab(D.tab); sync(true); };
$('selBezug').onchange=e=>{ D.sys.bezug=e.target.value; zeichne(); sync(true); };
$('selListe').onchange=e=>{
  const o=e.target.selectedOptions[0];
  if(!o||!o.dataset.t) return;
  if(o.value==='mehr'){ listeFuellen(+o.dataset.t); toast('Weitere Ereignisse ab '+datumText(+o.dataset.t)); return; }
  springeZu(+o.dataset.t,o.dataset.art);
};
an('bListe',()=>{ listeFuellen(); toast('Liste ab '+datumText(D.sys.t)+' neu gefüllt'); });
$('selPip').onchange=e=>{ D.sys.pip=e.target.value; D.sys.pipZiel='auto'; zeichne(); sync(true); };
$('selPipZiel').onchange=e=>{ D.sys.pipZiel=e.target.value; zeichne(); sync(true); };
$('selStufe').onchange=e=>{ D.sys.stufe=e.target.value; oberflaeche(); zeichne(); sync(true); };
an('tBahn',()=>{ D.sys.bahnen=!D.sys.bahnen; oberflaeche(); zeichne(); sync(); });
an('tEbene',()=>{ D.sys.ebenen=!D.sys.ebenen; oberflaeche(); zeichne(); sync(); });
an('tSchatten',()=>{
  if(stufeUI()==='ansch'){ D.sys.stufe='schatten'; D.sys.schatten=true;
    toast('Schattenmodell: Mondbahn stärker geneigt, Erde und Mond größer – so wird der Kegel sichtbar'); }
  else D.sys.schatten=!D.sys.schatten;
  oberflaeche(); zeichne(); sync(); });
an('tSterne',()=>{ D.sys.sterne=!D.sys.sterne; oberflaeche(); zeichne(); sync(); });
an('tKuppel',()=>{ D.sys.kuppelAn=!D.sys.kuppelAn; oberflaeche(); zeichne(); sync(); });
$('rKuppel').oninput=e=>{ D.sys.kuppel=+e.target.value; oberflaeche(); zeichne(); sync(); };
$('eratBsp').onchange=e=>{ const b=ERAT_BSP[+e.target.value]; if(!b) return;
  D.erat.a=b.a; D.erat.b=b.b; oberflaeche(); zeichne(); sync(true); };
$('rEA').oninput=e=>{ D.erat.a=+e.target.value; oberflaeche(); zeichne(); sync(); };
$('rEB').oninput=e=>{ D.erat.b=+e.target.value; oberflaeche(); zeichne(); sync(); };
$('rEF').oninput=e=>{ D.erat.fehler=+e.target.value; oberflaeche(); zeichne(); sync(); };
an('tStrahlen',()=>{ D.erat.strahlen=!D.erat.strahlen; oberflaeche(); zeichne(); sync(); });
an('tFlach',()=>{ D.erat.flach=!D.erat.flach; oberflaeche(); zeichne(); sync(); });
$('rEps').oninput=e=>{ D.mond.eps=+e.target.value; oberflaeche(); zeichne(); sync(); };
$('mondBsp').onchange=e=>{ D.mond.eps=+e.target.value; oberflaeche(); zeichne(); sync(true); };
an('tMondMass',()=>{ D.mond.mass=!D.mond.mass; oberflaeche(); zeichne(); sync(); });
an('tMondHilf',()=>{ D.mond.hilf=!D.mond.hilf; oberflaeche(); zeichne(); sync(); });
$('rBasis').oninput=e=>{ D.sonne.basis=+e.target.value; oberflaeche(); zeichne(); sync(); };
$('rSF').oninput=e=>{ D.sonne.fehler=+e.target.value; oberflaeche(); zeichne(); sync(); };
an('tSStrahl',()=>{ D.sonne.strahl=!D.sonne.strahl; oberflaeche(); zeichne(); sync(); });
$('rStern').oninput=e=>{ D.stern.d=+e.target.value; oberflaeche(); zeichne(); sync(); };
$('sternBsp').onchange=e=>{ D.stern.d=+e.target.value; oberflaeche(); zeichne(); sync(true); };
$('rLupe').oninput=e=>{ D.stern.lupe=+e.target.value; oberflaeche(); zeichne(); sync(); };
an('tSternSpur',()=>{ D.stern.spur=!D.stern.spur; oberflaeche(); zeichne(); sync(); });
function schriftSetzen(d){ D.fontSize=clamp((D.fontSize||14)+d,10,26); schriftAnwenden(); resize(); sync(); }
function schriftAnwenden(){ document.documentElement.style.setProperty('--fs',(D.fontSize||14)+'px'); K=(D.fontSize||14)/14; }
an('fsM',()=>schriftSetzen(-1)); an('fsP',()=>schriftSetzen(1));

/* ---------- Ziehen, Zoomen ---------- */
function zoomen(f){
  const S=D.sys;
  if(S.von==='aussen') S.dist=clamp(S.dist*f,0.00006,40);
  else S.fov=clamp(S.fov*f,0.08,90);
}
const zeiger=new Map();
cv.addEventListener('pointerdown',e=>{ if(D.tab!=='system') return; zeiger.set(e.pointerId,{x:e.clientX,y:e.clientY}); });
cv.addEventListener('pointermove',e=>{
  if(D.tab!=='system') return; const p=zeiger.get(e.pointerId); if(!p) return; e.preventDefault();
  const S=D.sys;
  if(zeiger.size===1){
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    if(Math.abs(dx)+Math.abs(dy)<0.5) return;
    if(S.von==='aussen'){ S.az-=dx*0.4; S.el=clamp(S.el+dy*0.4,-88,88); }
    else { const f=Math.max(0.05,S.fov/45); S.panAz-=dx*0.22*f; S.panEl=clamp(S.panEl+dy*0.22*f,-88,88); }
    p.x=e.clientX; p.y=e.clientY; zeichne(); return;
  }
  const vor=[...zeiger.values()].map(q=>({x:q.x,y:q.y}));
  p.x=e.clientX; p.y=e.clientY;
  const nach=[...zeiger.values()];
  if(vor.length>=2){
    const d0=Math.hypot(vor[0].x-vor[1].x,vor[0].y-vor[1].y), d1=Math.hypot(nach[0].x-nach[1].x,nach[0].y-nach[1].y);
    if(d0>4&&d1>4) zoomen(d0/d1);
    zeichne();
  }
},{passive:false});
const zeigerWeg=e=>{ if(zeiger.delete(e.pointerId)) sync(true); };
cv.addEventListener('pointerup',zeigerWeg); cv.addEventListener('pointercancel',zeigerWeg);
cv.addEventListener('wheel',e=>{ if(D.tab!=='system') return; e.preventDefault();
  zoomen(e.deltaY<0?1/1.12:1.12); zeichne(); sync(); },{passive:false});
cv.addEventListener('touchstart',e=>{ if(D.tab==='system') e.preventDefault(); },{passive:false});
cv.addEventListener('touchmove',e=>{ if(D.tab==='system') e.preventDefault(); },{passive:false});

/* ============================================================
   Zustand teilen und mit der Tafel abgleichen
   ============================================================ */
function zustand(){ return JSON.parse(JSON.stringify(D)); }
function uebernimm(d){
  d=d||{}; const std=standard(), neu=Object.assign({},std,d);
  ['sys','erat','mond','sonne','stern'].forEach(k=>{ neu[k]=Object.assign({},std[k],d[k]||{}); });
  /* älterer Stand kannte nur „ansch: true/false" */
  if(d.sys&&typeof d.sys.stufe!=='string'&&typeof d.sys.ansch==='boolean')
    neu.sys.stufe=d.sys.ansch?'ansch':'echt';
  if(!['echt','ansch','schatten'].includes(neu.sys.stufe)) neu.sys.stufe='ansch';
  delete neu.sys.ansch;
  neu.sys.sf=clamp(+neu.sys.sf||SF_STD,2,12);
  if(!HILFE[neu.tab]) neu.tab='system';
  neu.fontSize=clamp(+neu.fontSize||14,10,26);
  D=neu; schriftAnwenden();
  if(D.sys.lupe) D.sys.tempo=tempoWert(lupeTempo());   /* Zeitlupe und Tempo gehören zusammen */
}
let syncT=null;
function post(){ if(window.parent===window) return;   /* allein geöffnet: nicht an sich selbst senden */
  try{ parent.postMessage({type:'embed-data',data:zustand()},'*'); }catch(e){} }
function sync(sofort){ if(sofort){ clearTimeout(syncT); syncT=null; post(); return; }
  if(!syncT) syncT=setTimeout(()=>{ syncT=null; post(); },250); }
addEventListener('message',e=>{
  if(e.source!==window&&(window.parent===window||e.source!==window.parent)) return;   /* eigene Nachrichten ignorieren */
  const m=e.data; if(!m||m.type!=='embed-data'||!m.data) return;
  uebernimm(m.data); setzeTab(D.tab); resize(); laufPruefen();
  if(window.TafelModus&&TafelModus.refresh) TafelModus.refresh();
});
if(window.TafelShot) TafelShot.buttons($('shotBtns'),()=>TafelShot.rasterize($('cvbox'),{exclude:'#hint,#selPipZiel',pad:0}),'btn tafelEdit');
if(window.TafelModus&&TafelModus.anTafel) TafelModus.anTafel({ button:false, after:()=>resize() });
window.addEventListener('resize',resize);
window.addEventListener('load',()=>{
  schriftAnwenden();
  const geteilt=window.TafelTeilen&&TafelTeilen.istGeteilt();
  if(window.TafelTeilen&&!geteilt)
    TafelTeilen.knopf($('barR'),'astronomie.html',()=>({w:'astro',d:zustand()}),{cls:'btn'});
  setzeTab(D.tab); resize();
  if(window.ResizeObserver) new ResizeObserver(resize).observe($('cvbox'));
  if(geteilt){ TafelTeilen.nurBenutzen('#shotBtns');
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='astro'&&p.d) TafelTeilen.einspielen(p.d); }).catch(()=>{});
    return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
});
</script>
