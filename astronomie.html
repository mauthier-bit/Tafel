<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Astronomie</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  :root{--fs:14px;--fw:400;--fwb:700;--fi:normal;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#fff;color:#1f2430;font-size:var(--fs);font-weight:var(--fw);font-style:var(--fi);}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  #bar{display:flex;gap:4px;padding:6px;border-bottom:1px solid #e2e7ef;align-items:center;flex:none;}
  #tabs{display:flex;gap:4px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  #tabs::-webkit-scrollbar{height:4px;} #tabs::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  #barR{display:flex;gap:4px;align-items:center;flex:none;}
  button,select,input{font:inherit;color:inherit;}
  .tb{flex:none;border:1px solid #d6dce5;background:#fff;border-radius:10px;padding:6px 11px;cursor:pointer;
    font-weight:600;white-space:nowrap;color:#1f2430;}
  .tb.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:5px 10px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  .ic{border:1px solid #cfd6e0;background:#fff;border-radius:50%;width:30px;height:30px;padding:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-size:.95em;flex:none;}
  .ic.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  #bar2,#bar3{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid #e2e7ef;align-items:center;flex:none;
    min-height:42px;font-size:.92em;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
  /* Die Leiste selbst rollt nur im Notfall – wenn schon die feste Zeitbedienung nicht hineinpasst. */
  #bar2::-webkit-scrollbar,#bar3::-webkit-scrollbar{height:4px;}
  #bar2::-webkit-scrollbar-thumb,#bar3::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  /* Die Zeitbedienung steht fest, alles andere rollt bei Bedarf seitlich weg. */
  .fest{display:flex;gap:6px;align-items:center;flex:0 0 auto;}
  .roll{display:flex;gap:6px;align-items:center;flex:1 1 auto;min-width:0;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:2px 0;}
  .roll>*{flex:0 0 auto;}
  .roll::-webkit-scrollbar{height:4px;} .roll::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  .fest .fld{min-width:0;}
  .fest .fld input[type=range]{width:88px;min-width:54px;flex:1 1 88px;}
  @media (max-width:640px){ .fest .fld .txt{display:none;} }
  .sep{width:1px;align-self:stretch;background:#e2e7ef;margin:0 2px;flex:none;}
  .lbl{color:#64748b;font-weight:600;}
  .tog{border:1px solid #cfd6e0;background:#fff;border-radius:999px;padding:5px 10px;font-size:.92em;font-weight:600;
    color:#475569;cursor:pointer;white-space:nowrap;}
  .tog.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .tog:disabled{opacity:.5;cursor:default;}
  select{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:5px 7px;font-weight:600;cursor:pointer;}
  .fld{display:inline-flex;align-items:center;gap:6px;color:#64748b;font-weight:600;}
  .fld input[type=range]{width:110px;accent-color:#2563eb;}
  .fld .val{min-width:58px;text-align:right;font-weight:700;color:#2563eb;font-variant-numeric:tabular-nums;}
  /* Zugeklappt steht dort nur „Ereignis …" - die Liste selbst klappt breit genug auf. */
  #selListe{max-width:150px;}
  #cvbox{position:relative;flex:1;min-height:0;background:#fff;}
  #cvbox.dunkel{background:#070b18;}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  #hint{position:absolute;left:10px;top:7px;font-size:.72em;color:#94a3b8;pointer-events:none;}
  /* Die Ziel-Auswahl sitzt unter dem zweiten Fenster, direkt über der Leinwand. */
  #selPipZiel{position:absolute;z-index:5;font-size:.82em;font-weight:600;padding:4px 6px;
    border:1px solid #cfd6e0;border-radius:8px;background:#fff;color:#1f2430;
    box-shadow:0 2px 8px rgba(0,0,0,.35);}
  #cvbox.dunkel #hint{color:#64748b;}
  /* Hilfe und Einstellungen: feste Felder, beim Öffnen ins Fenster geklemmt */
  details.settings{position:relative;flex:none;}
  details.settings summary{list-style:none;cursor:pointer;}
  details.settings summary::-webkit-details-marker{display:none;}
  .panel{position:fixed;right:10px;top:46px;z-index:30;width:min(380px,calc(100vw - 20px));
    max-height:calc(100vh - 70px);background:#fff;border:1px solid #cfd6e0;border-radius:12px;
    display:grid;grid-template-rows:auto minmax(0,1fr);box-shadow:0 10px 30px rgba(15,23,42,.22);}
  .panelKopf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;
    border-bottom:1px solid #e3e8ef;font-weight:700;}
  .panelBody{padding:12px 14px;display:grid;gap:9px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;}
  .panelBody p{margin:0;font-size:.9em;line-height:1.5;color:#475569;}
  .panelBody h4{margin:6px 0 0;font-size:.8em;letter-spacing:.04em;text-transform:uppercase;color:#94a3b8;}
  .panelBody b{color:#1f2430;}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:.92em;line-height:1.35;}
  .chk input{margin-top:2px;flex:none;width:18px;height:18px;}
  .zeile{display:flex;align-items:center;gap:8px;font-size:.92em;color:#475569;}
  .zeile input[type=range]{flex:1;accent-color:#2563eb;}
  [hidden]{display:none!important;}
</style>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <div id="tabs">
      <button class="tb on" data-tab="system" title="Sonnensystem in 3D: Umläufe, Mondphasen, Finsternisse, Jahreszeiten, Schleifenbahnen">Sonnensystem</button>
      <button class="tb" data-tab="erat" title="Erdumfang nach Eratosthenes aus zwei Schattenwinkeln">Erdumfang</button>
      <button class="tb" data-tab="mond" title="Entfernung Erde–Mond: Triangulierung bei Halbmond">Erde–Mond</button>
      <button class="tb" data-tab="sonne" title="Entfernung Erde–Sonne: Parallaxe beim Venustransit">Erde–Sonne</button>
      <button class="tb" data-tab="stern" title="Entfernung naher Sterne: Parallaxe aus der Erdbahn">Sternparallaxe</button>
    </div>
    <div id="barR">
      <button class="ic" id="bHilfe" title="Kurzanleitung zu dieser Seite" aria-label="Hilfe">?</button>
      <details class="settings" id="setts">
        <summary class="ic" title="Einstellungen" aria-label="Einstellungen">⚙</summary>
        <div class="panel">
          <div class="panelKopf">Einstellungen<button type="button" class="ic" id="setZu" title="Einstellungen schließen" aria-label="schließen">✕</button></div>
          <div class="panelBody" id="settBody"></div>
        </div>
      </details>
      <button class="ic tafelEdit" id="fsM" title="Schrift kleiner">A−</button>
      <button class="ic tafelEdit" id="fsP" title="Schrift größer">A+</button>
      <span id="shotBtns" style="display:inline-flex;gap:4px"></span>
    </div>
  </div>
  <div id="bar2">
    <!-- ===== Sonnensystem: die Zeit bleibt stehen, der Rest rollt ===== -->
    <span class="reihe" data-tab="system" style="display:contents">
      <div class="fest">
        <button class="ic" id="bPlay" title="starten / anhalten">▶</button>
        <button class="ic" id="bZurueck" title="Zeit auf den Anfang zurücksetzen">⏮</button>
        <button class="ic" id="bSchrittZ" title="einen Schritt zurück (ein Schritt = so viel, wie eine Sekunde Lauf)">⏪</button>
        <button class="ic" id="bSchrittV" title="einen Schritt vor (ein Schritt = so viel, wie eine Sekunde Lauf)">⏩</button>
        <label class="fld" title="Wie viel Zeit im Modell auf eine Sekunde kommt"><span class="txt">Tempo</span>
          <input type="range" id="rTempo" min="-300" max="250" step="1" value="90" aria-label="Tempo">
          <span class="val" id="vTempo">–</span></label>
        <button class="tog" id="tEcht" title="Echtzeit: Das Modell läuft so langsam wie der Himmel selbst">Echtzeit</button>
        <button class="tog" id="tLupe" title="Zeitlupe: langsam genug, um durch das gewählte Ereignis zu gehen">Zeitlupe</button>
      </div>
      <div class="roll">
        <span class="lbl">Standort</span>
        <button class="tog on" data-von="aussen" title="Blick von außen auf das System">außen</button>
        <button class="tog" data-von="sonne" title="Blick von der Sonne aus">Sonne</button>
        <button class="tog" data-von="erde" title="Blick von der Erde aus – so sieht man den Himmel">Erde</button>
        <button class="tog" data-von="mond" title="Blick vom Mond aus">Mond</button>
        <button class="tog" data-von="ort" title="Vom Boden eines Ortes in den Himmel schauen – mit Horizont, Himmelsrichtungen und Tagbogen">am Ort</button>
        <select id="selOrt" title="Beobachtungsort" aria-label="Ort" hidden></select>
        <select id="selZiel" title="Worauf geschaut wird" aria-label="Blick auf">
          <option value="sonne">auf die Sonne</option>
          <option value="erde" selected>auf die Erde</option>
          <option value="mond">auf den Mond</option>
          <option value="venus">auf die Venus</option>
          <option value="mars">auf den Mars</option>
        </select>
      </div>
    </span>
    <!-- ===== Erdumfang ===== -->
    <span class="reihe" data-tab="erat" style="display:contents" hidden><div class="roll">
      <select id="eratBsp" title="Beispielpaare" aria-label="Beispiel"></select>
      <label class="fld">Ort A <input type="range" id="rEA" min="-30" max="75" step="0.5" value="31" aria-label="Breite Ort A"><span class="val" id="vEA">–</span></label>
      <label class="fld">Ort B <input type="range" id="rEB" min="-30" max="75" step="0.5" value="23.5" aria-label="Breite Ort B"><span class="val" id="vEB">–</span></label>
      <label class="fld" title="Wie stark ein Messfehler durchschlägt">Messfehler <input type="range" id="rEF" min="0" max="100" step="1" value="0" aria-label="Messfehler"><span class="val" id="vEF">–</span></label>
      <span class="sep"></span>
      <button class="tog on" id="tStrahlen" title="Sonnenstrahlen einblenden">Strahlen</button>
      <button class="tog" id="tFlach" title="Zum Vergleich: dieselben Messungen auf einer flachen Erde">flache Erde</button>
    </div></span>
    <!-- ===== Erde–Mond ===== -->
    <span class="reihe" data-tab="mond" style="display:contents" hidden><div class="roll">
      <label class="fld" title="Winkel Sonne–Erde–Mond, gemessen bei genau halbem Mond">Winkel ε
        <input type="range" id="rEps" min="8400" max="8999" step="1" value="8985" aria-label="Winkel Epsilon"><span class="val" id="vEps">–</span></label>
      <select id="mondBsp" title="Messwerte" aria-label="Messwert">
        <option value="8700">Aristarch: 87°</option>
        <option value="8900">89°</option>
        <option value="8985" selected>wahr: 89,85°</option>
        <option value="8995">89,95°</option>
      </select>
      <span class="sep"></span>
      <button class="tog" id="tMondMass" title="Dreieck maßstabsgetreu statt schematisch zeichnen">maßstabsgetreu</button>
      <button class="tog on" id="tMondHilf" title="Hilfslinien und Winkel einblenden">Hilfslinien</button>
    </div></span>
    <!-- ===== Erde–Sonne ===== -->
    <span class="reihe" data-tab="sonne" style="display:contents" hidden><div class="roll">
      <label class="fld" title="Abstand der beiden Beobachter auf der Erde (senkrecht zur Blickrichtung)">Beobachter
        <input type="range" id="rBasis" min="500" max="12742" step="1" value="9000" aria-label="Abstand der Beobachter"><span class="val" id="vBasis">–</span></label>
      <label class="fld" title="Fehler beim Messen des Abstands der beiden Bahnen auf der Sonnenscheibe">Messfehler
        <input type="range" id="rSF" min="-50" max="50" step="1" value="0" aria-label="Messfehler"><span class="val" id="vSF">–</span></label>
      <span class="sep"></span>
      <button class="tog on" id="tSStrahl" title="Sichtlinien der beiden Beobachter einblenden">Sichtlinien</button>
    </div></span>
    <!-- ===== Sternparallaxe ===== -->
    <span class="reihe" data-tab="stern" style="display:contents" hidden><div class="roll">
      <label class="fld" title="Entfernung des Sterns">Entfernung
        <input type="range" id="rStern" min="30" max="3000" step="1" value="424" aria-label="Entfernung"><span class="val" id="vStern">–</span></label>
      <select id="sternBsp" title="Beispielsterne" aria-label="Stern"></select>
      <label class="fld" title="Nur das Himmelsbild rechts ist vergrößert">Lupe
        <input type="range" id="rLupe" min="100" max="4000" step="10" value="1200" aria-label="Vergrößerung"><span class="val" id="vLupe">–</span></label>
      <span class="sep"></span>
      <button class="tog on" id="tSternSpur" title="Die scheinbare Ellipse des Sterns im Lauf des Jahres einblenden">Jahresellipse</button>
    </div></span>
  </div>
  <!-- ===== zweite Zeile des Sonnensystems: Bezug, Ereignisse, zweites Fenster, Anzeige ===== -->

<script>
"use strict";
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RAD=Math.PI/180, GRD=180/Math.PI;
const AE=149597870.7;                                  /* 1 astronomische Einheit in km */
const LJ=9.4607e12, PC=3.0857e13;                      /* Lichtjahr und Parsec in km */
const toast=m=>{ if(window.TafelShot) TafelShot.toast(m); };
function zahl(x,n){ n=n||0; if(!isFinite(x)) return '∞';
  return x.toLocaleString('de-DE',{minimumFractionDigits:n,maximumFractionDigits:n}); }
const grad=(x,n)=>zahl(x,n===undefined?1:n)+'°';
/* Zufall mit festem Startwert: Der Sternhimmel sieht in jeder Stunde gleich aus. */
function festerZufall(samen){ let s=samen>>>0||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

/* ---------- Vektoren ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const kreuz=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const betrag=a=>Math.sqrt(dot(a,a));
const norm=a=>{ const l=betrag(a); return l?mul(a,1/l):[0,0,1]; };
const winkelZw=(a,b)=>Math.acos(clamp(dot(norm(a),norm(b)),-1,1));

/* ============================================================
   Die Himmelskörper, mit den mittleren Bahnelementen zur Epoche
   J2000 (1. Januar 2000, 12 Uhr Weltzeit): a = große Halbachse in
   AE, e = Exzentrizität, T = Umlaufzeit in Tagen, i = Neigung gegen
   die Erdbahnebene, O = Länge des aufsteigenden Knotens, per = Länge
   des Perihels, L0 = mittlere Länge zur Epoche. Gerechnet wird mit
   der Mittelpunktsgleichung in erster Näherung (siehe bahnOrt) -
   damit treffen Sonnenwenden und Venustransite auf Minuten, Finster-
   nisse und Mondphasen auf wenige Stunden.
   ============================================================ */
const KOERPER={
  sonne:{name:'Sonne', R:696342,  farbe:'#ffc43d', kurz:'Sonne'},
  venus:{name:'Venus', R:6051.8,  a:0.7233357, e:0.0067767, T:224.70080,  i:3.39468, O:76.67984, per:131.60247, L0:181.97910, farbe:'#e8c89a'},
  erde: {name:'Erde',  R:6371.0,  a:1.0000026, e:0.0167112, T:365.25636,  i:0,       O:0,        per:102.93768, L0:100.46457, farbe:'#4a90e2'},
  mars: {name:'Mars',  R:3389.5,  a:1.5237103, e:0.0933941, T:686.97991,  i:1.84969, O:49.55954, per:336.05637, L0:355.44657, farbe:'#d9643a'},
  /* Beim Mond wandern beide Bahnpunkte: der Knoten in 18,6 Jahren rückwärts,
     das Perigäum in 8,85 Jahren vorwärts. */
  mond: {name:'Mond',  R:1737.4,  a:384400/AE, e:0.054900, T:27.321582, i:5.1454,
         O:125.0445, dO:-0.0529539, per:83.3532, dPer:0.11140353, L0:218.3165, farbe:'#d7dae0'}
};
const PLANETEN=['venus','erde','mars'];
const SCHIEF=23.4393;                                  /* Schiefe der Erdachse */
/* Beobachtungsorte für den Blick in den Himmel (Breite, östliche Länge) */
const ORTE=[{n:'Amberg',b:49.44,l:11.86},{n:'Burghausen',b:48.17,l:12.83},{n:'München',b:48.14,l:11.58},{n:'Hamburg',b:53.55,l:9.99},
  {n:'Rom',b:41.90,l:12.50},{n:'Nordkap',b:71.17,l:25.78},{n:'Kairo',b:30.04,l:31.24},
  {n:'Quito (am Äquator)',b:-0.18,l:-78.47},{n:'Sydney',b:-33.87,l:151.21},
  {n:'Nordpol',b:90,l:0},{n:'Südpol',b:-90,l:0}];
/* Sternzeit in Greenwich: Sie sagt, wie weit sich die Erde seit der Epoche gedreht hat. */
const GMST=t=>(280.46061837+360.98564736629*t)%360;
const ERDACHSE=[0,Math.sin(SCHIEF*RAD),Math.cos(SCHIEF*RAD)];   /* zeigt zum Himmelsnordpol */
/* Äquatoriales Dreibein: x zum Frühlingspunkt, z zum Himmelsnordpol */
const AEQ_X=[1,0,0], AEQ_Y=[0,Math.cos(SCHIEF*RAD),-Math.sin(SCHIEF*RAD)];
/* Überhöhung im Modus „anschaulich" - nur zum Ansehen, nie zum Rechnen */
const UEBER={sonne:20, venus:600, erde:600, mars:600, mond:1200, mondbahn:40};
/* Das Schattenmodell überhöht alles QUER zur Richtung zur Sonne mit demselben Faktor f:
   Erde und Mond werden f-mal größer, die Schattenkegel f-mal dicker und die Mondbahn
   f-mal stärker gegen die Erdbahnebene geneigt. Längs der Achse bleibt alles, wie es ist.
   Dadurch behält der Kernschatten seine wahre Länge (3,6 Mondbahnradien), der Mond passt
   im selben Verhältnis hinein wie in Wirklichkeit (Kernschatten dort 2,65 Mondradien breit),
   und weil seine Abweichung von der Erdbahnebene genauso überhöht wird, trifft er den
   Schatten zu denselben Zeiten. Nur länger dauert es im Bild. */
const SF_STD=6;

/* Ort in der Bahnebene, gedreht um Neigung und Knoten (heliozentrisch bzw. beim Mond um die Erde) */
/* Keplerbahn in erster Näherung: Zur mittleren Anomalie kommt die Mittelpunktsgleichung
   (Reihe in der Exzentrizität), der Abstand schwankt mit. Reine Kreise verfehlten knappe
   Ereignisse - der Venustransit von 2012 etwa fiel durch, und die Mars-Opposition lag
   Wochen daneben. u ist das Argument der Breite, also Perihelabstand plus wahre Anomalie. */
function bahnOrt(b,t){
  const Og=(b.O||0)+(b.dO||0)*t, O=Og*RAD, i=(b.i||0)*RAD, e=b.e||0;
  const L=b.L0+360*t/b.T, per=(b.per||0)+(b.dPer||0)*t;
  const M=(L-per)*RAD;
  const C=(2*e-0.25*e*e*e)*Math.sin(M)+1.25*e*e*Math.sin(2*M)+(13/12)*e*e*e*Math.sin(3*M);
  const u=(per-Og)*RAD+M+C;
  const r=b.a*(1-e*e)/(1+e*Math.cos(M+C));
  const x=Math.cos(u), y=Math.sin(u)*Math.cos(i), z=Math.sin(u)*Math.sin(i);
  const c=Math.cos(O), s=Math.sin(O);
  return [(x*c-y*s)*r, (x*s+y*c)*r, z*r];
}
/* wahre Orte (für alle Rechnungen) */
function ortW(id,t){
  if(id==='sonne') return [0,0,0];
  if(id==='mond') return add(bahnOrt(KOERPER.erde,t), bahnOrt(KOERPER.mond,t));
  return bahnOrt(KOERPER[id],t);
}
/* Überhöht wird nur der Blick von außen: Steht man auf einem Körper, ist der Himmel
   ohnehin richtig groß - Sonne und Mond messen dort ihr halbes Grad. */
/* AKT_VON/AKT_ZIEL gehören zur Kamera, die gerade zeichnet - im zweiten Fenster
   steht man woanders als im großen Bild. */
let AKT_VON='aussen', AKT_ZIEL='erde', AKT_STUFE=null;
const stufe=()=>AKT_VON!=='aussen'?'echt':(AKT_STUFE||D.sys.stufe||'ansch');
/* Fuer die Bedienleiste: Was ist eingestellt? (stufe() sagt, was gerade gezeichnet wird -
   nach dem zweiten Fenster stünde dort noch dessen Wert.) */
const stufeUI=()=>D.sys.von==='aussen'?(D.sys.stufe||'ansch'):'echt';
const sfUI=()=>clamp(D.sys.sf||SF_STD,2,12);
const neigungUI=()=>Math.atan(sfUI()*Math.tan(KOERPER.mond.i*RAD))*GRD;
const schattenUI=()=>!!D.sys.schatten&&stufeUI()!=='ansch'&&D.sys.von==='aussen';
const sfaktor=()=>stufe()==='schatten'?clamp(D.sys.sf||SF_STD,2,12):1;
const uebAn=()=>stufe()==='ansch';
const neigungUeb=()=>Math.atan(sfaktor()*Math.tan(KOERPER.mond.i*RAD))*GRD;   /* gezeigte Bahnneigung */
/* Orte zum Zeichnen: „anschaulich" bläst die Mondbahn auf, das Schattenmodell kippt sie */
function ortZ(id,t){
  if(id!=='mond') return ortW(id,t);
  const st=stufe();
  if(st==='ansch') return add(ortW('erde',t), mul(bahnOrt(KOERPER.mond,t),UEBER.mondbahn));
  if(st==='schatten'){ const m=bahnOrt(KOERPER.mond,t);
    return add(ortW('erde',t),[m[0],m[1],m[2]*sfaktor()]); }   /* nur quer zur Erdbahnebene */
  return ortW(id,t);
}
const radZ=id=>{ const st=stufe();
  if(st==='ansch') return KOERPER[id].R*(UEBER[id]||1)/AE;
  if(st==='schatten'&&(id==='erde'||id==='mond')) return KOERPER[id].R*sfaktor()/AE;
  return KOERPER[id].R/AE; };
const radW=id=>KOERPER[id].R/AE;                                      /* wahrer Radius in AE */

/* Zenit, Nord und Ost am gewählten Ort - damit steht der Horizont waagrecht im Bild. */
function ortRahmen(t){
  const o=ORTE[D.sys.ort]||ORTE[0];
  const th=(GMST(t)+o.l)*RAD, ph=o.b*RAD;
  const ri=add(mul(AEQ_X,Math.cos(th)),mul(AEQ_Y,Math.sin(th)));      /* Meridian des Ortes */
  const zen=norm(add(mul(ri,Math.cos(ph)),mul(ERDACHSE,Math.sin(ph))));
  let nord=sub(ERDACHSE,mul(zen,dot(ERDACHSE,zen)));
  if(betrag(nord)<1e-6) nord=sub(ri,mul(zen,dot(ri,zen)));            /* an den Polen */
  nord=norm(nord);
  return {zen, nord, ost:kreuz(nord,zen), o};
}
/* Richtung aus Azimut (von Nord über Ost) und Höhe */
const himmelRichtung=(R,az,hoch)=>add(mul(add(mul(R.nord,Math.cos(az)),mul(R.ost,Math.sin(az))),Math.cos(hoch)),
  mul(R.zen,Math.sin(hoch)));
/* Azimut und Höhe einer Richtung */
function azHoch(R,d){
  const u=norm(d);
  return {az:Math.atan2(dot(u,R.ost),dot(u,R.nord)), hoch:Math.asin(clamp(dot(u,R.zen),-1,1))};
}
/* ---------- Datum ---------- */
const EPOCHE=Date.UTC(2000,0,1,12,0,0);
function datumText(t,mitUhr){
  const d=new Date(EPOCHE+t*86400000);
  const s=d.getUTCDate()+'.'+(d.getUTCMonth()+1)+'.'+d.getUTCFullYear();
  if(!mitUhr) return s;
  const h=d.getUTCHours(), m=d.getUTCMinutes();
  return s+', '+h+':'+(m<10?'0':'')+m+' Uhr';
}

/* ============================================================
   Was gerade am Himmel los ist - immer aus den wahren Werten
   gerechnet, auch wenn das Bild überhöht gezeichnet wird.
   ============================================================ */
const rKm=id=>KOERPER[id].R;
/* Abstand eines Punktes von der Schattenachse und die Schattenradien dort */
function schattenLage(quelle,ziel,t){
  const S=ortW('sonne',t), Q=ortW(quelle,t), Z=ortW(ziel,t);
  const achse=norm(sub(Q,S)), v=sub(Z,Q);
  const s=dot(v,achse)*AE;                                   /* Weg längs der Achse in km */
  const r=betrag(sub(v,mul(achse,s/AE)))*AE;                 /* Abstand von der Achse in km */
  const dS=betrag(sub(Q,S))*AE;
  const tanK=(rKm('sonne')-rKm(quelle))/dS;                  /* Kernschatten läuft zusammen */
  const tanH=(rKm('sonne')+rKm(quelle))/dS;                  /* Halbschatten läuft auseinander */
  return {s, r, kern:rKm(quelle)-s*tanK, halb:rKm(quelle)+s*tanH, laenge:rKm(quelle)/tanK};
}
/* Dieselbe Rechnung mit den GEZEICHNETEN Größen - im Schattenmodell sind Kegel und
   Bahnneigung überhöht, und das Bild soll zum verdunkelten Mond passen. */
function schattenLageZ(quelle,ziel,t){
  const f=sfaktor();
  const S=ortZ('sonne',t), Q=ortZ(quelle,t), Z=ortZ(ziel,t);
  const achse=norm(sub(Q,S)), v=sub(Z,Q);
  const s=dot(v,achse)*AE, r=betrag(sub(v,mul(achse,s/AE)))*AE;
  const dS=betrag(sub(Q,S))*AE, Rq=radZ(quelle)*AE;
  const tanK=f*(rKm('sonne')-rKm(quelle))/dS, tanH=f*(rKm('sonne')+rKm(quelle))/dS;
  return {s, r, kern:Rq-s*tanK, halb:Rq+s*tanH, laenge:Rq/tanK, tanK, tanH};
}
function mondphase(t){
  const E=ortW('erde',t), M=ortW('mond',t), S=ortW('sonne',t);
  const elong=winkelZw(sub(S,E),sub(M,E))*GRD;               /* Winkelabstand Sonne–Mond am Himmel */
  const phase=winkelZw(sub(E,M),sub(S,M))*GRD;               /* Phasenwinkel am Mond */
  const anteil=(1+Math.cos(phase*RAD))/2;
  /* zunehmend, wenn der Mond östlich der Sonne steht (in Bahnrichtung der Erde) */
  const n=kreuz(sub(S,E),sub(M,E));
  const zu=n[2]>0;                                          /* östlich der Sonne = zunehmend */
  let name='Sichel';
  if(elong<8) name='Neumond'; else if(elong>172) name='Vollmond';
  else if(Math.abs(elong-90)<8) name=zu?'zunehmender Halbmond':'abnehmender Halbmond';
  else if(elong<90) name=zu?'zunehmende Sichel':'abnehmende Sichel';
  else name=zu?'zunehmender Mond':'abnehmender Mond';
  return {elong,phase,anteil,zu,name};
}
function finsternisse(t){
  const aus={sofi:null,mofi:null};
  const so=schattenLage('mond','erde',t);                    /* Mondschatten auf der Erde */
  if(so.s>0 && so.r < rKm('erde')+so.halb){
    const kern=Math.abs(so.kern);
    aus.sofi = so.r<rKm('erde')+kern ? (so.kern>0?'totale Sonnenfinsternis':'ringförmige Sonnenfinsternis')
                                     : 'partielle Sonnenfinsternis';
  }
  const mo=schattenLage('erde','mond',t);                    /* Erdschatten am Mond */
  if(mo.s>0){
    if(mo.r<mo.kern-rKm('mond')) aus.mofi='totale Mondfinsternis';
    else if(mo.r<mo.kern+rKm('mond')) aus.mofi='partielle Mondfinsternis';
    else if(mo.r<mo.halb+rKm('mond')) aus.mofi='Halbschattenfinsternis';
  }
  return aus;
}
/* Winkelabstand zweier Körper, von einem dritten aus gesehen (in Grad) */
function sep(von,a,b,t){ const V=ortW(von,t); return winkelZw(sub(ortW(a,t),V),sub(ortW(b,t),V))*GRD; }
const winkelRadius=(id,von,t)=>Math.asin(clamp(rKm(id)/(betrag(sub(ortW(id,t),ortW(von,t)))*AE),-1,1))*GRD;
function transit(t){                                         /* Venus vor der Sonnenscheibe */
  const E=ortW('erde',t), V=ortW('venus',t), S=ortW('sonne',t);
  if(betrag(sub(V,E))>betrag(sub(S,E))) return false;
  return sep('erde','venus','sonne',t) < winkelRadius('sonne','erde',t)+winkelRadius('venus','erde',t);
}
/* ekliptikale Länge der Sonne, von der Erde aus - sagt die Jahreszeit */
function sonnenLaenge(t){ const d=sub(ortW('sonne',t),ortW('erde',t));
  let l=Math.atan2(d[1],d[0])*GRD; return (l+360)%360; }
function jahreszeit(t){ const l=sonnenLaenge(t);
  const nahe=x=>Math.abs(((l-x+540)%360)-180)<1.2;
  if(nahe(0)) return 'Frühlingsanfang – Tag-und-Nacht-Gleiche';
  if(nahe(90)) return 'Sommeranfang – längster Tag im Norden';
  if(nahe(180)) return 'Herbstanfang – Tag-und-Nacht-Gleiche';
  if(nahe(270)) return 'Winteranfang – kürzester Tag im Norden';
  if(l<90) return 'Frühling (Nordhalbkugel)'; if(l<180) return 'Sommer (Nordhalbkugel)';
  if(l<270) return 'Herbst (Nordhalbkugel)'; return 'Winter (Nordhalbkugel)'; }

/* ---------- Ereignisse suchen ---------- */
/* Jedes Ereignis liegt im Minimum einer Gütefunktion; dort wird geprüft, ob es wirklich eintritt. */
const EREIGNIS={
  neumond:  {gute:t=>mondphase(t).elong,            test:()=>true,            h:0.2, jahre:5,  text:'Neumond'},
  vollmond: {gute:t=>180-mondphase(t).elong,        test:()=>true,            h:0.2, jahre:5,  text:'Vollmond'},
  sofi:     {gute:t=>schattenLage('mond','erde',t).r, test:t=>!!finsternisse(t).sofi, h:0.15, jahre:30, text:'Sonnenfinsternis'},
  mofi:     {gute:t=>schattenLage('erde','mond',t).r, test:t=>!!finsternisse(t).mofi, h:0.15, jahre:30, text:'Mondfinsternis'},
  transit:  {gute:t=>sep('erde','venus','sonne',t), test:t=>transit(t),        h:0.5, jahre:260, text:'Venustransit'},
  opposition:{gute:t=>180-sep('erde','mars','sonne',t), test:()=>true,         h:0.5, jahre:10, text:'Mars in Opposition'},
  sommer:   {gute:t=>Math.abs(((sonnenLaenge(t)-90+540)%360)-180), test:()=>true, h:0.5, jahre:3, text:'Sommersonnenwende'},
  winter:   {gute:t=>Math.abs(((sonnenLaenge(t)-270+540)%360)-180), test:()=>true, h:0.5, jahre:3, text:'Wintersonnenwende'}
};
function verfeinern(f,a,b){                                   /* ternäre Suche nach dem Minimum */
  for(let k=0;k<50;k++){ const m1=a+(b-a)/3, m2=b-(b-a)/3; if(f(m1)<f(m2)) b=m2; else a=m1; }
  return (a+b)/2;
}
function suchen(art,t0){
  const E=EREIGNIS[art]; if(!E) return null;
  const h=E.h, ende=t0+E.jahre*365.25;
  let p2v=null, p1v=E.gute(t0+h);
  for(let t=t0+2*h; t<ende; t+=h){
    const v=E.gute(t);
    if(p2v!==null && p1v<=p2v && p1v<=v){                     /* lokales Minimum bei t-h */
      const tm=verfeinern(E.gute,t-2*h,t);
      if(tm>t0+h/2 && E.test(tm)) return tm;
    }
    p2v=p1v; p1v=v;
  }
  return null;
}

/* ============================================================
   Zustand
   ============================================================ */
const standard=()=>({ v:1, tab:'system', fontSize:14, fontBold:false, fontItalic:false,
  sys:{ t:0, lauf:false, tempo:30, echt:false, stufe:'ansch', sf:SF_STD, bahnen:true, ebenen:false, schatten:true,
        sterne:true, namen:true, von:'aussen', ziel:'erde', bezug:'sonne', pip:'aus', pipZiel:'auto',
        lupe:false, tempoAlt:30, letztes:null, ort:0, kuppelAn:false, kuppel:78,
        az:35, el:26, dist:4.2, fov:30, panAz:0, panEl:0, ansichtMit:true },
  erat:{ a:31, b:23.5, fehler:0, strahlen:true, flach:false },
  mond:{ eps:8985, mass:false, hilf:true },
  sonne:{ basis:9000, fehler:0, strahl:true },
  stern:{ d:424, lupe:1200, spur:true } });
let D=standard();
let W=300,H=300,K=1,F=600,KAM=null;
let VX=0,VY=0,VW=300,VH=300;                        /* Sichtfenster für die Projektion */

/* Bezugssystem: heliozentrisch oder geozentrisch */
const nullPunkt=t=>D.sys.bezug==='erde'?ortZ('erde',t):[0,0,0];
const rahmen=p=>sub(p,nullPunkt(D.sys.t));
const tempoTage=()=>D.sys.echt?1/86400:Math.pow(10,D.sys.tempo/100);
/* Zeitlupe: So viel Modellzeit je Sekunde passt zu dem Ereignis, das zuletzt angesprungen
   wurde - eine Finsternis dauert Stunden, die Mondphasen einen Monat, eine Marsschleife
   Monate. Ohne gewähltes Ereignis wird das eingestellte Tempo auf ein Fünfundzwanzigstel
   heruntergenommen. */
const ZEITLUPE={sofi:0.006, mofi:0.008, transit:0.012, neumond:0.4, vollmond:0.4,
  opposition:3, sommer:6, winter:6};
function lupeTempo(){
  const art=D.sys.letztes;
  if(art&&ZEITLUPE[art]) return ZEITLUPE[art];
  return Math.max(0.0004,Math.pow(10,(D.sys.tempoAlt!==undefined?D.sys.tempoAlt:D.sys.tempo)/100)/25);
}
const tempoWert=d=>clamp(Math.round(100*Math.log10(Math.max(d,1e-6))),-300,250);
function lupeSetzen(an){
  const S=D.sys;
  if(an){
    if(!S.lupe) S.tempoAlt=S.tempo;
    S.lupe=true; S.echt=false; S.tempo=tempoWert(lupeTempo());
  } else if(S.lupe){ S.lupe=false; S.tempo=(S.tempoAlt===undefined?30:S.tempoAlt); }
}
/* Schattenkegel sind eine Zeichenhilfe für den Blick von außen: Im Weltraum sieht man
   sie nicht, und vom Körper aus lägen sie als riesige Keile quer im Bild. */
const schattenAn=()=>D.sys.schatten&&!uebAn()&&AKT_VON==='aussen';
const schattenStufe=()=>stufe()==='schatten';

/* ---------- Leinwand ---------- */
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  W=cv.clientWidth||300; H=cv.clientHeight||300;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  K=(D.fontSize||14)/14;
  zeichne();
}
function schrift(sz,fett){ return (D.fontItalic?'italic ':'')+((fett||D.fontBold)?'700 ':'400 ')+
  Math.round(sz*K)+'px -apple-system,BlinkMacSystemFont,sans-serif'; }
function text(txt,x,y,farbe,opt){
  opt=opt||{}; ctx.font=schrift(opt.sz||13,opt.fett);
  ctx.textAlign=opt.al||'left'; ctx.textBaseline=opt.bl||'middle';
  if(opt.rand){ ctx.lineJoin='round'; ctx.lineWidth=4*K; ctx.strokeStyle=opt.rand; ctx.strokeText(txt,x,y); }
  ctx.fillStyle=farbe; ctx.fillText(txt,x,y);
}
function rgba(hex,a){ const h=hex.replace('#','');
  return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+a+')'; }
function dunkler(hex,f){ const h=hex.replace('#','');
  const r=Math.round(parseInt(h.slice(0,2),16)*f), g=Math.round(parseInt(h.slice(2,4),16)*f), b=Math.round(parseInt(h.slice(4,6),16)*f);
  return 'rgb('+r+','+g+','+b+')'; }

/* ============================================================
   Kamera und Projektion
   ============================================================ */
function drehAchse(v,achse,w){                      /* Drehung von v um eine Achse (Rodrigues) */
  const c=Math.cos(w), s=Math.sin(w);
  return add(add(mul(v,c),mul(kreuz(achse,v),s)),mul(achse,dot(achse,v)*(1-c)));
}
/* Wo genau steht man auf einem Körper? Auf der Erde dort, wo man am meisten sieht:
   auf dem Punkt der Oberfläche, der dem Mondschatten am nächsten liegt - bei einer
   Sonnenfinsternis also mitten im Schatten. Auf dem Mond steht man auf der Erdseite. */
function standOrt(id,t){
  if(id==='ort'){ const R=ortRahmen(t); return add(ortW('erde',t),mul(R.zen,radW('erde'))); }
  const p=ortW(id,t);
  if(id==='erde'){
    const M=ortW('mond',t), achse=norm(sub(M,ortW('sonne',t)));
    const v=sub(p,M), lot=sub(v,mul(achse,dot(v,achse)));
    return add(p,mul(norm(mul(lot,-1)),radW('erde')));
  }
  if(id==='mond') return add(p,mul(norm(sub(ortW('erde',t),p)),radW('mond')));
  return p;
}
function kameraSetzen(o){
  const S=o||D.sys;
  AKT_VON=S.von||'aussen'; AKT_ZIEL=S.ziel||'erde'; AKT_STUFE=S.stufe||null;
  const zielP=rahmen(ortZ(AKT_ZIEL,D.sys.t));
  let pos, fov;
  if(AKT_VON==='aussen'){
    const az=(S.az||0)*RAD, el=(S.el||0)*RAD, d=S.dist||4.2;
    pos=add(zielP,[d*Math.cos(el)*Math.cos(az), d*Math.cos(el)*Math.sin(az), d*Math.sin(el)]);
    fov=42;
  } else { pos=rahmen(standOrt(AKT_VON,D.sys.t)); fov=S.fov||25; }
  let f=norm(sub(zielP,pos));
  if(betrag(sub(zielP,pos))<1e-12) f=[1,0,0];
  let up=[0,0,1];
  if(AKT_VON==='ort'){
    /* Am Ort zählt die örtliche Senkrechte: Der Horizont liegt dann waagrecht im Bild,
       und geschwenkt wird um den Zenit. Steht das Blickziel unter dem Horizont, schaut
       man nach Süden (auf der Südhalbkugel nach Norden) und 20° hinauf. */
    const R=ortRahmen(D.sys.t);
    up=R.zen;
    if(dot(f,R.zen)<0.02) f=himmelRichtung(R,(R.o.b>=0?Math.PI:0),20*RAD);
    f=drehAchse(f,R.zen,(S.panAz||0)*RAD);
    const rr=norm(kreuz(f,R.zen));
    f=norm(drehAchse(f,rr,-(S.panEl||0)*RAD));
    if(dot(f,R.zen)<-0.35) f=norm(add(f,mul(R.zen,0.5)));        /* nicht in den Boden starren */
  } else if(AKT_VON!=='aussen'&&(S.panAz||S.panEl)){
    f=drehAchse(f,[0,0,1],S.panAz*RAD);
    const rr=norm(kreuz(f,[0,0,1]));
    f=norm(drehAchse(f,rr,-S.panEl*RAD));
  }
  if(Math.abs(dot(f,up))>0.9995) up=(AKT_VON==='ort')?norm(kreuz(kreuz(f,[0,0,1]),f)):[0,1,0];
  const r=norm(kreuz(f,up)), u=kreuz(r,f);
  F=(VH/2)/Math.tan(fov/2*RAD);
  KAM={pos,f,r,u,fov};
}
function p2(p){                                      /* Punkt → Bildschirm, mit Tiefe */
  const v=sub(p,KAM.pos), d=dot(v,KAM.f);
  if(d<=1e-12) return null;
  return [VX+VW/2+dot(v,KAM.r)*F/d, VY+VH/2-dot(v,KAM.u)*F/d, d];
}
function p2r(dir){                                   /* Richtung (unendlich weit) → Bildschirm */
  const d=dot(dir,KAM.f); if(d<=1e-6) return null;
  return [VX+VW/2+dot(dir,KAM.r)*F/d, VY+VH/2-dot(dir,KAM.u)*F/d];
}
/* Linienzug im Raum, an der Kamera abgeschnitten */
function linie3(pkte,farbe,breite,alpha,strich){
  ctx.beginPath(); let auf=false;
  for(const p of pkte){ const q=p2(p);
    if(!q){ auf=false; continue; }
    if(auf) ctx.lineTo(q[0],q[1]); else { ctx.moveTo(q[0],q[1]); auf=true; } }
  ctx.strokeStyle=farbe; ctx.lineWidth=breite; ctx.globalAlpha=alpha==null?1:alpha;
  ctx.setLineDash(strich||[]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
}
/* ---------- konvexe Hülle (für die Schattenkegel) ---------- */
function huelle(p){
  const q=p.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); if(q.length<3) return q;
  const kreuz2=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const u=[],l=[];
  for(const pt of q){ while(u.length>=2&&kreuz2(u[u.length-2],u[u.length-1],pt)<=0)u.pop(); u.push(pt); }
  for(let i=q.length-1;i>=0;i--){ const pt=q[i]; while(l.length>=2&&kreuz2(l[l.length-2],l[l.length-1],pt)<=0)l.pop(); l.push(pt); }
  u.pop(); l.pop(); return u.concat(l);
}

/* ============================================================
   Sonnensystem zeichnen
   ============================================================ */
const sterneRichtung=(()=>{                           /* fester Sternhimmel */
  const z=festerZufall(20260211), liste=[];
  for(let i=0;i<520;i++){
    const u=z()*2-1, w=z()*2*Math.PI, r=Math.sqrt(1-u*u);
    liste.push({d:[r*Math.cos(w),r*Math.sin(w),u], h:0.25+0.75*Math.pow(z(),2.2)});
  }
  return liste;
})();
function malSterne(){
  for(const s of sterneRichtung){ const q=p2r(s.d); if(!q) continue;
    if(q[0]<VX-5||q[0]>VX+VW+5||q[1]<VY-5||q[1]>VY+VH+5) continue;
    const gr=s.h*1.7;
    ctx.fillStyle='rgba(255,255,255,'+(0.25+s.h*0.75).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(q[0],q[1],gr,0,7); ctx.fill(); }
}
/* Kreis im Raum als Punktliste */
function kreisPunkte(mitte,radius,normale,n){
  let e1=kreuz(normale,[0,0,1]); if(betrag(e1)<1e-6) e1=kreuz(normale,[0,1,0]);
  e1=norm(e1); const e2=kreuz(normale,e1), pk=[];
  for(let i=0;i<=(n||72);i++){ const w=2*Math.PI*i/(n||72);
    pk.push(add(mitte,add(mul(e1,radius*Math.cos(w)),mul(e2,radius*Math.sin(w))))); }
  return pk;
}
function scheibe(mitte,radius,normale,fuell,strich,beschr,farbe){
  const pk=kreisPunkte(mitte,radius,normale,96).map(p=>p2(p)).filter(Boolean);
  if(pk.length<9) return;
  ctx.beginPath(); pk.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
  ctx.fillStyle=fuell; ctx.fill(); ctx.strokeStyle=strich; ctx.lineWidth=1.2; ctx.stroke();
  if(beschr){ let e1=kreuz(normale,[0,0,1]); if(betrag(e1)<1e-6) e1=kreuz(normale,[0,1,0]);
    const q=p2(add(mitte,mul(norm(e1),radius)));
    if(q) text(beschr,q[0]+6,q[1],farbe,{sz:12,fett:true,rand:'rgba(7,11,24,.8)'}); }
}
function malEbenen(){
  const S=D.sys, t=S.t;
  const zielP=rahmen(ortZ(AKT_ZIEL,S.t));
  const weite=betrag(sub(zielP,KAM.pos))*Math.tan(KAM.fov/2*RAD);
  const ep=rahmen(ortZ('erde',t));
  const mRel=tt=>sub(ortZ('mond',tt),ortZ('erde',tt));           /* so, wie gezeichnet wird */
  const nMond=norm(kreuz(mRel(t),mRel(t+KOERPER.mond.T/4)));
  const rMond=betrag(sub(ortZ('mond',t),ortZ('erde',t)))*1.25;
  /* Von weitem die ganze Ekliptik um die Sonne, aus der Nähe beide Ebenen um die Erde -
     dann sieht man den Winkel von 5,1° zwischen ihnen. */
  if(weite>0.08) scheibe(rahmen(ortZ('sonne',t)),1.6,[0,0,1],'rgba(74,144,226,.10)','rgba(74,144,226,.55)','Erdbahnebene','#9ec5f3');
  else scheibe(ep,rMond,[0,0,1],'rgba(74,144,226,.12)','rgba(74,144,226,.6)','Erdbahnebene','#9ec5f3');
  scheibe(ep,rMond,nMond,'rgba(226,232,240,.10)','rgba(226,232,240,.6)','Mondbahnebene','#e2e8f0');
  const O=(KOERPER.mond.O+KOERPER.mond.dO*t)*RAD;
  const kn=[Math.cos(O),Math.sin(O),0];
  linie3([add(ep,mul(kn,-rMond*1.15)),add(ep,mul(kn,rMond*1.15))],'#fbbf24',1.6,0.9,[7,5]);
  const kq=p2(add(ep,mul(kn,rMond*1.15)));
  if(kq) text('Knotenlinie',kq[0]+6,kq[1],'#fbbf24',{sz:12});
}
function bahnDauer(id){
  const S=D.sys;
  if(S.bezug==='erde'){
    if(id==='mond') return KOERPER.mond.T;
    if(id==='erde') return 0;
    if(id==='sonne') return KOERPER.erde.T;
    return 1/Math.abs(1/KOERPER[id].T-1/KOERPER.erde.T);     /* synodische Periode: die Schleifen */
  }
  if(id==='sonne') return 0;
  if(id==='mond') return KOERPER.erde.T;
  return KOERPER[id].T;
}
function malBahnen(){
  const S=D.sys;
  const zielP=rahmen(ortZ(AKT_ZIEL,S.t));
  const weite=betrag(sub(zielP,KAM.pos))*Math.tan(KAM.fov/2*RAD);     /* halbe Bildhöhe in AE */
  const passt=r=>r<40*weite;
  for(const id of ['venus','erde','mars']){
    const P=bahnDauer(id); if(!P) continue;
    const pk=[];
    for(let i=0;i<=240;i++){ const tt=S.t+P*i/240; pk.push(sub(ortZ(id,tt),nullPunkt(tt))); }
    let rm=0; pk.forEach(q=>{ rm=Math.max(rm,betrag(sub(q,zielP))); });
    if(!passt(rm)) continue;
    linie3(pk,KOERPER[id].farbe,1.5,0.65);
  }
  /* Der Mond läuft um die Erde - seine Bahn gehört an die Erde, nicht um die Sonne gelegt. */
  { const ep=rahmen(ortZ('erde',S.t)), P=KOERPER.mond.T, pk=[];
    for(let i=0;i<=160;i++){ const tt=S.t+P*i/160;
      pk.push(add(ep,sub(ortZ('mond',tt),ortZ('erde',tt)))); }
    let rm=0; pk.forEach(q=>{ rm=Math.max(rm,betrag(sub(q,zielP))); });
    if(passt(rm)) linie3(pk,KOERPER.mond.farbe,1.1,0.5); }
  if(S.bezug==='erde'){                                       /* die Sonne läuft im geozentrischen Bild mit */
    const P=KOERPER.erde.T, pk=[];
    for(let i=0;i<=240;i++){ const tt=S.t+P*i/240; pk.push(sub(ortZ('sonne',tt),nullPunkt(tt))); }
    let rm=0; pk.forEach(q=>{ rm=Math.max(rm,betrag(sub(q,zielP))); });
    if(passt(rm)) linie3(pk,KOERPER.sonne.farbe,1.5,0.65);
  }
}
/* Wie tief steckt der Körper im Schatten des anderen? 0 = frei, 1 = ganz im Kernschatten */
function imSchatten(id,t){
  if(id!=='mond') return 0;
  const L=schattenLageZ('erde','mond',t); if(L.s<=0) return 0;
  const R=radZ('mond')*AE, kern=Math.max(0,L.kern);
  if(L.r<kern-R) return 1;
  if(L.r<kern+R) return 0.7;
  if(L.r<L.halb+R) return 0.25;
  return 0;
}
/* Am Himmel misst der Mond nur ein halbes Grad - im weiten Blick sind das wenige
   Bildpunkte, da ist von der Phase nichts zu sehen. Darum wird er größer gezeichnet,
   solange er nicht dicht bei der Sonne steht (dort käme sonst eine falsche Finsternis
   heraus). Beim Hineinzoomen gilt wieder das wahre Maß. */
const mondGross=()=>AKT_VON==='ort'&&sep('erde','mond','sonne',D.sys.t)>5;
/* ---------- ein Körper mit Lichtgrenze ---------- */
function malKoerper(id,p3){
  const q=p2(p3); if(!q) return;
  let rho=F*radZ(id)/q[2];
  if(id==='mond'&&mondGross()) rho=Math.max(rho,VH*0.012);
  const farbe=KOERPER[id].farbe;
  if(id==='sonne'){
    const g=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],Math.max(rho*4,22));
    g.addColorStop(0,'rgba(255,214,102,.55)'); g.addColorStop(1,'rgba(255,214,102,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q[0],q[1],Math.max(rho*4,22),0,7); ctx.fill();
    ctx.fillStyle='#ffd34d'; ctx.beginPath(); ctx.arc(q[0],q[1],Math.max(rho,1.6),0,7); ctx.fill();
  } else {
    const sonneP=rahmen(ortZ('sonne',D.sys.t));
    const s=norm(sub(sonneP,p3)), zurKam=norm(sub(KAM.pos,p3));
    const cosA=clamp(dot(s,zurKam),-1,1);
    const phi=Math.atan2(-dot(s,KAM.u),dot(s,KAM.r));
    const r=Math.max(rho,0.8);
    const vf=imSchatten(id,D.sys.t);
    const hell=vf>0.5?'#8a4526':(vf>0?dunkler(farbe,1-0.55*vf):farbe);   /* im Kernschatten kupferrot */
    ctx.fillStyle=dunkler(farbe,0.22);                        /* Nachtseite */
    ctx.beginPath(); ctx.arc(q[0],q[1],r,0,7); ctx.fill();
    if(cosA>-0.999){                                          /* beleuchteter Teil */
      ctx.beginPath();
      ctx.ellipse(q[0],q[1],r,r,phi,-Math.PI/2,Math.PI/2);
      const rx=Math.abs(r*cosA);
      if(cosA>0) ctx.ellipse(q[0],q[1],rx,r,phi,Math.PI/2,Math.PI*1.5);
      else ctx.ellipse(q[0],q[1],rx,r,phi,Math.PI/2,-Math.PI/2,true);
      ctx.closePath(); ctx.fillStyle=hell; ctx.fill();
    }
    if(id==='erde'&&rho>13) erdNetz(p3,rho,q);
    if(id==='erde'&&rho>7) ortMarke(p3,radZ('erde'),rho);
    if(rho<2.4){                                              /* zu klein zum Sehen: Fundring */
      ctx.strokeStyle=rgba(farbe,0.55);
      ctx.lineWidth=1; ctx.beginPath(); ctx.arc(q[0],q[1],7.5,0,7); ctx.stroke();
    }
  }
  if(D.sys.namen){
    /* Der Mond steht dicht bei der Erde - sein Name gehört darüber, sonst liegen beide aufeinander. */
    const ab=Math.max(rho,7.5)+9*K, oben=(id==='mond');
    text(KOERPER[id].name,q[0],q[1]+(oben?-ab:ab),'#e8edf6',{al:'center',sz:12,fett:true,rand:'rgba(7,11,24,.85)'});
  }
}
/* Gradnetz und Achse der Erde - macht die Jahreszeiten sichtbar */
function erdNetz(p3,rho,q){
  const R=radZ('erde'), n=ERDACHSE;
  const zurKam=norm(sub(KAM.pos,p3));
  /* Länge 0 steht dort, wo die Sternzeit sie hinstellt - so passen Gradnetz und Ortsmarke
     zum Blick vom Ort aus zusammen. */
  const th=GMST(D.sys.t)*RAD;
  const e1=norm(add(mul(AEQ_X,Math.cos(th)),mul(AEQ_Y,Math.sin(th))));
  const e2=kreuz(n,e1);
  const pkt=(br,la)=>add(p3,mul(add(add(mul(e1,Math.cos(br)*Math.cos(la)),mul(e2,Math.cos(br)*Math.sin(la))),
                                    mul(n,Math.sin(br))),R));
  const sicht=p=>dot(norm(sub(p,p3)),zurKam)>0.02;
  const zug=(pk,farbe,br)=>{ ctx.beginPath(); let auf=false;
    for(const p of pk){ const s=sicht(p), qq=s?p2(p):null;
      if(!qq){ auf=false; continue; }
      if(auf) ctx.lineTo(qq[0],qq[1]); else { ctx.moveTo(qq[0],qq[1]); auf=true; } }
    ctx.strokeStyle=farbe; ctx.lineWidth=br; ctx.stroke(); };
  [[0,'rgba(255,255,255,.55)',1.2],[23.4393,'rgba(255,214,102,.5)',1],[-23.4393,'rgba(255,214,102,.5)',1],
   [66.5607,'rgba(147,197,253,.5)',1],[-66.5607,'rgba(147,197,253,.5)',1]].forEach(([b,f,w])=>{
    const pk=[]; for(let i=0;i<=72;i++) pk.push(pkt(b*RAD,2*Math.PI*i/72)); zug(pk,f,w); });
  for(let m=0;m<12;m++){ const pk=[];
    for(let i=0;i<=48;i++) pk.push(pkt(-Math.PI/2+Math.PI*i/48,m*Math.PI/6)); zug(pk,'rgba(255,255,255,.25)',0.8); }
  const a1=add(p3,mul(n,R*1.5)), a2=add(p3,mul(n,-R*1.5));
  linie3([a1,a2],'rgba(255,255,255,.75)',1.6,1,[6,4]);
  const na=p2(a1); if(na) text('N',na[0],na[1]-8*K,'#e8edf6',{al:'center',sz:11,rand:'rgba(7,11,24,.8)'});
}
/* Der gewählte Beobachtungsort als Fähnchen auf der Erdkugel - auch im anschaulichen
   Modell, damit man sieht, wo man beim Blick in den Himmel steht. */
function ortMarke(p3,R,rho){
  const Rh=ortRahmen(D.sys.t), zurKam=norm(sub(KAM.pos,p3));
  if(dot(Rh.zen,zurKam)<0.03) return;                        /* liegt auf der Rückseite */
  const q=p2(add(p3,mul(Rh.zen,R))); if(!q) return;
  ctx.fillStyle='#f43f5e'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(q[0],q[1],Math.max(2.5,Math.min(5,rho*0.08)),0,7); ctx.fill(); ctx.stroke();
  if(rho>16) text(Rh.o.n,q[0]+7*K,q[1]-6*K,'#ffe4e6',{sz:11.5,fett:true,rand:'rgba(7,11,24,.85)'});

/* ============================================================
   Der Himmel über dem gewählten Ort
   ============================================================ */
const VS='\uFE0E';                                        /* zwingt die Schriftform statt des Emojis */
const TIERKREIS=[['♈','Widder'],['♉','Stier'],['♊','Zwillinge'],['♋','Krebs'],['♌','Löwe'],['♍','Jungfrau'],
  ['♎','Waage'],['♏','Skorpion'],['♐','Schütze'],['♑','Steinbock'],['♒','Wassermann'],['♓','Fische']]
  .map(([z,n])=>[z+VS,n]);
/* Linienzug aus Richtungen (unendlich weit), an der Kamera abgeschnitten */
function zugRichtung(dirs,farbe,breite,alpha,strich){
  ctx.beginPath(); let auf=false;
  for(const d of dirs){ const q=p2r(d);
    if(!q){ auf=false; continue; }
    if(auf) ctx.lineTo(q[0],q[1]); else { ctx.moveTo(q[0],q[1]); auf=true; } }
  ctx.strokeStyle=farbe; ctx.lineWidth=breite; ctx.globalAlpha=alpha==null?1:alpha;
  ctx.setLineDash(strich||[]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
}
/* Ekliptik als Linie am Himmel, dazu die zwölf Tierkreiszeichen */
function malEkliptik(){
  const bogen=[]; for(let l=0;l<=360;l+=2) bogen.push([Math.cos(l*RAD),Math.sin(l*RAD),0]);
  zugRichtung(bogen,'rgba(250,204,21,.55)',1.5);
  for(let k=0;k<12;k++){                                     /* Grenzen der Zeichen */
    const l=k*30*RAD, d=[Math.cos(l),Math.sin(l),0];
    const q=p2r(d), q2=p2r(norm(add(d,[0,0,0.035])));
    if(q&&q2){ ctx.strokeStyle='rgba(250,204,21,.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(q[0],q[1]); ctx.lineTo(q2[0],q2[1]); ctx.stroke(); }
  }
  TIERKREIS.forEach(([sym,nm],i)=>{
    const l=(i*30+15)*RAD, q=p2r([Math.cos(l),Math.sin(l),0]); if(!q) return;
    if(q[0]<VX-60||q[0]>VX+VW+60||q[1]<VY-40||q[1]>VY+VH+40) return;
    text(sym,q[0],q[1]-13*K,'#fcd34d',{al:'center',sz:16,fett:true,rand:'rgba(7,11,24,.85)'});
    text(nm,q[0],q[1]+2*K,'#d9bb63',{al:'center',sz:11.5,rand:'rgba(7,11,24,.85)'});
  });
  const we=p2r([1,0,0]);
  if(we) text('Frühlingspunkt',we[0],we[1]+16*K,'#fcd34d',{al:'center',sz:11,rand:'rgba(7,11,24,.85)'});
}
/* Tagbogen: Wo steht der Körper im Lauf eines Tages über diesem Ort? */
function malTagbogen(id,farbe){
  const t0=D.sys.t, R0=ortRahmen(t0), pk=[];
  for(let dt=-0.5;dt<=0.5001;dt+=1/144){
    const t=t0+dt, R=ortRahmen(t);
    const ah=azHoch(R,sub(ortW(id,t),standOrt('ort',t)));
    pk.push(himmelRichtung(R0,ah.az,ah.hoch));
  }
  zugRichtung(pk,farbe,1.4,0.85,[6,5]);
}
/* Boden, Horizont und Himmelsrichtungen. Weil die Kamera den Zenit als „oben" hat,

/* Die Horizontkuppel über dem gewählten Ort: der Himmel, den man von dort aus sieht.
   Von außen betrachtet zeigt sie, was über und was unter dem Horizont steht. Der Radius
   zählt in gezeichneten Erdradien - maßstabsgetreu reicht sie bei 60 bis zum Mond. */
const kuppelRadius=()=>Math.pow(10,clamp(D.sys.kuppel===undefined?78:D.sys.kuppel,-20,200)/100);
function malKuppel(){
  const S=D.sys;
  if(!S.kuppelAn||AKT_VON==='ort') return;                 /* am Ort steht man mitten darin */
  const t=S.t, R=ortRahmen(t);
  const p=rahmen(add(ortZ('erde',t),mul(R.zen,radZ('erde'))));
  const r=kuppelRadius()*radZ('erde');
  const kreis=kreisPunkte(p,r,R.zen,96);
  const pk=kreis.map(q=>p2(q)).filter(Boolean);
  if(pk.length>8){                                          /* Horizontebene andeuten */
    ctx.beginPath(); pk.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.fillStyle='rgba(244,63,94,.09)'; ctx.fill();
  }
  linie3(kreis,'rgba(244,63,94,.85)',1.5);
  [[0,'N'],[90,'O'],[180,'S'],[270,'W']].forEach(([az,nm])=>{
    const bogen=[];
    for(let h=0;h<=90;h+=5) bogen.push(add(p,mul(himmelRichtung(R,az*RAD,h*RAD),r)));
    linie3(bogen,'rgba(244,63,94,.5)',1.1);
    const q=p2(add(p,mul(himmelRichtung(R,az*RAD,0),r*1.06)));
    if(q) text(nm,q[0],q[1],'#fda4af',{al:'center',sz:11.5,fett:true,rand:'rgba(7,11,24,.85)'});
  });
  [30,60].forEach(h=>{ const kr=[];
    for(let a=0;a<=360;a+=6) kr.push(add(p,mul(himmelRichtung(R,a*RAD,h*RAD),r)));
    linie3(kr,'rgba(244,63,94,.28)',1); });
  const z=p2(add(p,mul(R.zen,r)));
  if(z) text('Zenit über '+R.o.n,z[0],z[1]-10*K,'#fda4af',{al:'center',sz:11.5,fett:true,rand:'rgba(7,11,24,.85)'});
}
/* ---------- Schattenkegel ---------- */
function malKegel(p3,Rae,richtung,laenge,rEnde,alpha,rand){
  const basis=kreisPunkte(p3,Rae,richtung,24), ende=kreisPunkte(add(p3,mul(richtung,laenge)),rEnde,richtung,24);
  const pk=[];
  for(const p of basis.concat(ende)){ const q=p2(p); if(q) pk.push([q[0],q[1]]); }
  if(pk.length<3) return;
  const h=huelle(pk); if(h.length<3) return;
  ctx.beginPath(); h.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
  ctx.fillStyle='#000'; ctx.globalAlpha=alpha; ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle=rand; ctx.lineWidth=1; ctx.stroke();
}
function malSchatten(){
  const t=D.sys.t, sonneP=rahmen(ortZ('sonne',t)), f=sfaktor();
  for(const id of ['erde','mond']){
    if(imSchatten(id,t)>0.5) continue;      /* wer selbst im Kernschatten steckt, wirft keinen */
    const p=rahmen(ortZ(id,t)), R=radZ(id);
    const dir=norm(sub(p,sonneP));
    const dS=betrag(sub(p,sonneP));
    const tanK=f*(radW('sonne')-radW(id))/dS, tanH=f*(radW('sonne')+radW(id))/dS;
    const L=R/tanK;                                          /* Länge des Kernschattens */
    const LH=L*1.6;
    malKegel(p,R,dir,LH,R+LH*tanH,0.18,'rgba(226,232,240,.14)');   /* Halbschatten */
    malKegel(p,R,dir,L,0,0.6,'rgba(226,232,240,.3)');              /* Kernschatten */
    /* Beschriftung, sobald der Kegel breit genug ist, um etwas zu erkennen */
    const qk=p2(add(p,mul(dir,L*0.45)));
    if(qk&&F*R*0.55/qk[2]>7){
      text('Kernschatten',qk[0],qk[1],'#cbd5e1',{al:'center',sz:11.5,fett:true,rand:'rgba(7,11,24,.85)'});
      const qh=p2(add(p,mul(dir,LH*0.85)));
      if(qh) text('Halbschatten',qh[0],qh[1]+F*(R+LH*0.85*tanH)/qh[2]*0.75,'#94a3b8',
        {al:'center',sz:11.5,rand:'rgba(7,11,24,.85)'});
    }
  }
}

/* ---------- Maßstabsbalken ---------- */
function malMassstab(unten){
  if(D.sys.von==='ort') return;                       /* am Himmel gibt es keine Entfernung zu zeigen */
  const S=D.sys, zielP=rahmen(ortZ(AKT_ZIEL,S.t));
  const d0=betrag(sub(zielP,KAM.pos)); if(!(d0>0)) return;
  const jePx=d0/F;                                           /* AE je Bildpunkt beim Blickziel */
  let roh=120*jePx, km=roh*AE, stufe, einh, wert;
  const schoen=x=>{ const e=Math.pow(10,Math.floor(Math.log10(x))), m=x/e;
    return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e; };
  if(km<2e6){ wert=schoen(km); einh='km'; stufe=wert/AE; }
  else { wert=schoen(roh); einh='AE'; stufe=wert; }
  const px=stufe/jePx; if(!(px>10&&px<W*0.8)) return;
  const x0=W-px-18, y=H-(unten||0)-14;
  ctx.strokeStyle='rgba(226,232,240,.8)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(x0,y-5); ctx.lineTo(x0,y); ctx.lineTo(x0+px,y); ctx.lineTo(x0+px,y-5); ctx.stroke();
  text(zahl(wert,wert<10&&einh==='AE'?(wert<1?2:1):0)+' '+einh,x0+px/2,y-12,'#cbd5e1',{al:'center',sz:12});
}
/* ---------- Die Zeile unter dem Bild ---------- */

/* Der Inhalt einer Ansicht - einmal für das große Bild, einmal für das zweite Fenster */
function szeneMalen(){
  const S=D.sys, t=S.t, amOrt=(AKT_VON==='ort');
  if(S.sterne) malSterne();
  if(S.ebenen){ if(amOrt) malEkliptik(); else malEbenen(); }
  if(S.bahnen){ malBahnen();
    if(amOrt){ malTagbogen('sonne','rgba(253,224,71,.9)'); malTagbogen('mond','rgba(226,232,240,.75)'); } }
  const liste=['sonne','venus','erde','mars','mond'].filter(id=>id!==AKT_VON&&!(amOrt&&id==='erde'))
    .map(id=>({id,p:rahmen(ortZ(id,t))}));
  liste.sort((a,b)=>betrag(sub(b.p,KAM.pos))-betrag(sub(a.p,KAM.pos)));
  liste.forEach(o=>malKoerper(o.id,o.p));
  if(schattenAn()) malSchatten();
  malKuppel();
  if(amOrt) malBoden();
}
const WOHER={aussen:'von außen',sonne:'von der Sonne',erde:'von der Erde',mond:'vom Mond',ort:'vom Ort'};
const WORAUF={sonne:'auf die Sonne',erde:'auf die Erde',mond:'auf den Mond',venus:'auf die Venus',mars:'auf den Mars'};
/* Das zweite Fenster zeigt dasselbe Ereignis von einem anderen Standort aus.
   Das Blickziel sucht es sich selbst: Bei einer Sonnenfinsternis oder einem Transit
   schaut man von der Erde zur Sonne, sonst zum Mond. */
/* Welches Ziel sucht sich das Fenster selbst, wenn nichts gewählt ist? */
function pipZielAuto(von,t){
  if(von==='erde'||von==='ort') return (finsternisse(t).sofi||transit(t))?'sonne':'mond';
  if(von==='mond') return 'erde';
  if(von==='sonne') return 'erde';
  return 'erde';
}
const PIP_ZIELE={ aussen:['erde','mond','sonne','venus','mars'],
  sonne:['erde','mond','venus','mars'], erde:['mond','sonne','venus','mars'],
  mond:['erde','sonne','venus','mars'], ort:['mond','sonne','venus','mars'] };
function pipOpt(){
  const S=D.sys, t=S.t, von=S.pip;
  if(!von||von==='aus') return null;
  let ziel=S.pipZiel||'auto';
  if(ziel==='auto'||ziel===von||!(PIP_ZIELE[von]||[]).includes(ziel)) ziel=pipZielAuto(von,t);
  if(von==='aussen'){
    /* Erde und Mond aus der Nähe, die Planeten als Überblick. „anschaulich" taugt aus der
       Nähe nicht - man säße in der aufgeblasenen Erde -, darum dort das Schattenmodell. */
    const nah=(ziel==='erde'||ziel==='mond');
    return {von:'aussen', ziel, dist:nah?0.0075:4.2, az:sonnenLaenge(t)+90, el:nah?12:24,
      stufe:nah?(S.stufe==='ansch'?'schatten':S.stufe):'ansch'};
  }
  if(von==='ort') return {von, ziel, fov:70, panAz:0, panEl:0};    /* der halbe Himmel über dem Ort */
  const d=betrag(sub(ortW(ziel,t),ortW(von,t)));
  const w=2*Math.asin(clamp(radW(ziel)/Math.max(d,1e-9),-1,1))*GRD;
  return {von, ziel, fov:w>0.1?clamp(w*8,0.3,40):25, panAz:0, panEl:0};
}
let pipStand=null;
function pipZielFeld(von,ziel,bx,by,bw){
  const sel=$('selPipZiel'); if(!sel) return;
  if(!von){ sel.hidden=true; pipStand=null; return; }
  if(pipStand!==von){                                 /* Liste nur bei neuem Standort neu bauen */
    pipStand=von; sel.innerHTML='';
    const mk=(v,t)=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; sel.appendChild(o); };
    mk('auto','Ziel: automatisch');
    (PIP_ZIELE[von]||[]).forEach(id=>mk(id,WORAUF[id]));
  }
  sel.value=(D.sys.pipZiel&&[...sel.options].some(o=>o.value===D.sys.pipZiel))?D.sys.pipZiel:'auto';
  sel.title='Worauf das zweite Fenster schaut – gerade '+WORAUF[ziel];
  sel.hidden=false;
  sel.style.left=Math.round(bx)+'px'; sel.style.top=Math.round(by)+'px'; sel.style.width=Math.round(bw)+'px';
}
function malPip(){

function zeichneSystem(){
