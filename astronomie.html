/* ---------- Blick auf einen Körper: Antippen und weicher Flug ---------- */
/* Ein kurzer Tipp auf einen Körper richtet den Blick auf ihn, die Kamera gleitet hinüber.
   Ein Tipp auf eine der vier Jahres-Erden springt zugleich zu ihrem Datum - dort steht
   die Erde dann wirklich. Ein Tipp ins Leere oder ins zweite Fenster tut nichts. */
function flugSchritt(jetzt){
  const dt=Math.min(0.08,(jetzt-flugLetzte)/1000); flugLetzte=jetzt;
  if(FLUG){ FLUG.u+=dt/FLUG_DAUER; if(FLUG.u>=1) FLUG=null; }
  flugId=FLUG?requestAnimationFrame(flugSchritt):0;
  zeichne();
}
/* Wie weit weg ist gut? So, dass der Körper das Bild füllt - aber je Tipp höchstens
   viermal näher, damit ein Fehlgriff nicht den Überblick kostet. */
const zielAbstand=id=>clamp(Math.max(15*radZ(id),D.sys.dist/4),0.00006,40);
function blickAuf(id,tz){
  const S=D.sys;
  if(typeof tz==='number'){ S.t=tz; S.lauf=false; laufStopp(); }
  if(S.ziel!==id&&S.von!==id){ FLUG={von:S.ziel,u:0,dist0:S.dist}; S.ziel=id; }
  if(S.von==='aussen') S.dist=zielAbstand(id);
  else { S.panAz=0; S.panEl=0; fovPassend(); }   /* vom Körper aus rückt das Ziel in die Mitte */
  if(FLUG&&!flugId){ flugLetzte=performance.now(); flugId=requestAnimationFrame(flugSchritt); }
  toast('Blick '+(WORAUF[id]||'auf '+id));
}
/* Welcher Körper liegt unter dem Finger? Der vorderste, der nah genug dran ist. */
function getroffen(x,y){
  const S=D.sys, t=S.t; let best=null;
  const pruef=(id,p,tz)=>{ const q=p2(p); if(!q) return;
    const fass=Math.max(umriss(bildRadius(id,q)),20*K);
    if(Math.hypot(q[0]-x,q[1]-y)>fass) return;
    if(!best||q[2]<best.tiefe) best={id,tiefe:q[2],t:tz};
  };
  for(const id of ['sonne','merkur','venus','erde','mars','mond']){
    if(id===AKT_VON||!zeigeKoerper(id)) continue;
    if(AKT_VON==='ort'&&id==='erde') continue;
    pruef(id,rahmen(ortZ(id,t)));
  }
  if(S.jahrErden&&AKT_VON==='aussen') jahresPunkte(t).forEach(e=>{
    const p=rahmen(ortZ('erde',e.t)), q=p2(p); if(!q) return;
    const fass=Math.max(F*radZ('erde')/q[2],ERD_MIND*K,20*K);
    if(Math.hypot(q[0]-x,q[1]-y)>fass) return;
    if(!best||q[2]<best.tiefe) best={id:'erde',tiefe:q[2],t:e.t};
  });
  return best;
}
function tippAuf(cx,cy){
  if(D.tab!=='system') return;
  const r=cv.getBoundingClientRect(), x=cx-r.left, y=cy-r.top;
  if(PIP_RECT&&x>=PIP_RECT[0]&&x<=PIP_RECT[0]+PIP_RECT[2]
     &&y>=PIP_RECT[1]&&y<=PIP_RECT[1]+PIP_RECT[3]) return;   /* zweites Fenster bleibt */
  VX=0; VY=0; VW=W; VH=H; kameraSetzen();        /* nach dem Zeichnen steht die PiP-Kamera */
  const tr=getroffen(x,y);
  if(!tr) return;                                /* ins Leere getippt */
  blickAuf(tr.id,tr.t);
  oberflaeche(); zeichne(); sync(true);
}

/* ---------- Ziehen, Zoomen ---------- */
function zoomen(f){
  const S=D.sys;
  if(S.von==='aussen') S.dist=clamp(S.dist*f,0.00006,40);
  else S.fov=clamp(S.fov*f,0.08,90);
}
const zeiger=new Map();
cv.addEventListener('pointerdown',e=>{ if(D.tab!=='system') return;
  zeiger.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,
    zeit:performance.now(),tipp:zeiger.size===0});
  if(zeiger.size>1) zeiger.forEach(z=>{ z.tipp=false; });     /* zweiter Finger: kein Tipp */
});
cv.addEventListener('pointermove',e=>{
  if(D.tab!=='system') return; const p=zeiger.get(e.pointerId); if(!p) return; e.preventDefault();
  const S=D.sys;
  if(zeiger.size===1){
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    if(Math.abs(dx)+Math.abs(dy)<0.5) return;
    if(S.von==='aussen'){ S.az-=dx*0.4; S.el=clamp(S.el+dy*0.4,-88,88); }
    else { const f=Math.max(0.05,S.fov/45); S.panAz-=dx*0.22*f; S.panEl=clamp(S.panEl+dy*0.22*f,-88,88); }
    p.x=e.clientX; p.y=e.clientY; zeichne(); return;
  }
  const vor=[...zeiger.values()].map(q=>({x:q.x,y:q.y}));
  p.x=e.clientX; p.y=e.clientY;
  const nach=[...zeiger.values()];
  if(vor.length>=2){
    const d0=Math.hypot(vor[0].x-vor[1].x,vor[0].y-vor[1].y), d1=Math.hypot(nach[0].x-nach[1].x,nach[0].y-nach[1].y);
    if(d0>4&&d1>4) zoomen(d0/d1);
    zeichne();
  }
},{passive:false});
const zeigerWeg=e=>{ const z=zeiger.get(e.pointerId);
  if(!zeiger.delete(e.pointerId)) return;
  if(z&&z.tipp&&Math.hypot(e.clientX-z.x0,e.clientY-z.y0)<8&&performance.now()-z.zeit<450) tippAuf(e.clientX,e.clientY);
  sync(true); };
cv.addEventListener('pointerup',zeigerWeg); cv.addEventListener('pointercancel',zeigerWeg);
cv.addEventListener('wheel',e=>{ if(D.tab!=='system') return; e.preventDefault();
  zoomen(e.deltaY<0?1/1.12:1.12); zeichne(); sync(); },{passive:false});
cv.addEventListener('touchstart',e=>{ if(D.tab==='system') e.preventDefault(); },{passive:false});
cv.addEventListener('touchmove',e=>{ if(D.tab==='system') e.preventDefault(); },{passive:false});

/* ============================================================
   Zustand teilen und mit der Tafel abgleichen
   ============================================================ */
function zustand(){ return JSON.parse(JSON.stringify(D)); }
function uebernimm(d){
  d=d||{}; const std=standard(), neu=Object.assign({},std,d);
  ['sys','erat','mond','sonne','stern'].forEach(k=>{ neu[k]=Object.assign({},std[k],d[k]||{}); });
  /* älterer Stand kannte nur „ansch: true/false" */
  if(d.sys&&typeof d.sys.stufe!=='string'&&typeof d.sys.ansch==='boolean')
    neu.sys.stufe=d.sys.ansch?'ansch':'echt';
  if(!['echt','ansch','schatten'].includes(neu.sys.stufe)) neu.sys.stufe='ansch';
  delete neu.sys.ansch;
  neu.sys.sf=clamp(+neu.sys.sf||SF_STD,2,12);
  /* Früher stand im Regler nur der Betrag (log), die Zeit lief immer vorwärts. Jetzt
     trägt er auch die Richtung: Reglerwert = alter Wert + 325. */
  /* Früher stand der Winkel ε (Aristarch) auf der Mondseite - er gehört jetzt zur
     Sonnenseite, die Mondseite rechnet mit der Parallaxe. */
  if(d.mond&&typeof d.mond.eps==='number'&&!(d.sonne&&typeof d.sonne.eps==='number')){
    neu.sonne.eps=d.mond.eps; neu.sonne.mass=!!d.mond.mass;
    if(typeof d.mond.hilf==='boolean') neu.sonne.hilf=d.mond.hilf;
  }
  delete neu.mond.eps; delete neu.mond.hilf;
  delete neu.sonne.basis; delete neu.sonne.fehler; delete neu.sonne.strahl;
  { const alt=d.sys||{};                           /* der Standard liefert tempo2 schon mit */
    if(typeof alt.tempo2!=='number'&&typeof alt.tempo==='number')
      neu.sys.tempo2=clamp(alt.tempo+300+T_NULL,-T_MAX,T_MAX);
    if(typeof alt.tempoAlt2!=='number'&&typeof alt.tempoAlt==='number')
      neu.sys.tempoAlt2=clamp(alt.tempoAlt+300+T_NULL,-T_MAX,T_MAX); }
  delete neu.sys.tempo; delete neu.sys.tempoAlt;
  if(!HILFE[neu.tab]) neu.tab='system';
  neu.fontSize=clamp(+neu.fontSize||14,10,26);
  D=neu; schriftAnwenden();
  if(D.sys.lupe) D.sys.tempo2=tempoRicht()*tempoWert(lupeTempo());   /* Zeitlupe und Tempo gehören zusammen */
}
let syncT=null;
function post(){ if(window.parent===window) return;   /* allein geöffnet: nicht an sich selbst senden */
  try{ parent.postMessage({type:'embed-data',data:zustand()},'*'); }catch(e){} }
function sync(sofort){ if(sofort){ clearTimeout(syncT); syncT=null; post(); return; }
  if(!syncT) syncT=setTimeout(()=>{ syncT=null; post(); },250); }
addEventListener('message',e=>{
  if(e.source!==window&&(window.parent===window||e.source!==window.parent)) return;   /* eigene Nachrichten ignorieren */
  const m=e.data; if(!m||m.type!=='embed-data'||!m.data) return;
  uebernimm(m.data); setzeTab(D.tab); resize(); laufPruefen();
  if(window.TafelModus&&TafelModus.refresh) TafelModus.refresh();
});
if(window.TafelShot) TafelShot.buttons($('shotBtns'),()=>TafelShot.rasterize($('cvbox'),{exclude:'#hint,#selPipZiel',pad:0}),'btn tafelEdit');
if(window.TafelModus&&TafelModus.anTafel) TafelModus.anTafel({ button:false, after:()=>resize() });
window.addEventListener('resize',resize);
window.addEventListener('load',()=>{
  schriftAnwenden();
  const geteilt=window.TafelTeilen&&TafelTeilen.istGeteilt();
  if(window.TafelTeilen&&!geteilt)
    TafelTeilen.knopf($('barR'),'astronomie.html',()=>({w:'astro',d:zustand()}),{cls:'btn'});
  setzeTab(D.tab); resize();
  if(window.ResizeObserver) new ResizeObserver(resize).observe($('cvbox'));
  if(geteilt){ TafelTeilen.nurBenutzen('#shotBtns');
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='astro'&&p.d) TafelTeilen.einspielen(p.d); }).catch(()=>{});
    return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
});
