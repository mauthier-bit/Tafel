/* ============================================================
   Zwei Hilfen für den Unterricht: die vier Erden im Jahreslauf
   und die Bahn, die der gewählte Ort durch die Erddrehung zieht.
   ============================================================ */
/* Sind die vier Erden im Jahreslauf eingeblendet, werden sie und die wirkliche Erde
   groß genug gezeichnet, dass man Achse und Tag-Nacht-Grenze erkennt. */
const ERD_MIND=24;
let jahrCache=null;
function jahresPunkte(t0){
  if(jahrCache&&Math.abs(jahrCache.t0-t0)<5) return jahrCache.liste;
  const liste=[['fruehling','Frühlingsanfang'],['sommer','Sommeranfang'],
               ['herbst','Herbstanfang'],['winter','Winteranfang']]
    .map(([art,nm])=>{ const t=suchen(art,t0-2); return t===null?null:{t,nm}; }).filter(Boolean);
  jahrCache={t0,liste}; return liste;
}
/* Eine halbdurchsichtige Erde zu einem anderen Zeitpunkt - mit Tag- und Nachtseite
   und der Achse, die immer in dieselbe Richtung zeigt. */
function malErdeGeist(t,beschr){
  const p=rahmen(ortZ('erde',t)), q=p2(p); if(!q) return;
  /* Mindestgröße, sonst ist von Achse und Lichtgrenze nichts zu sehen. */
  const rho=Math.max(F*radZ('erde')/q[2],ERD_MIND*K);
  const s=norm(sub(rahmen(ortZ('sonne',t)),p)), zurKam=norm(sub(KAM.pos,p));
  const cosA=clamp(dot(s,zurKam),-1,1), phi=Math.atan2(-dot(s,KAM.u),dot(s,KAM.r));
  ctx.globalAlpha=0.55;
  ctx.fillStyle=dunkler(KOERPER.erde.farbe,0.22);
  ctx.beginPath(); ctx.arc(q[0],q[1],rho,0,7); ctx.fill();
  if(cosA>-0.999){ lichtPfad(q[0],q[1],rho,phi,cosA); ctx.fillStyle=KOERPER.erde.farbe; ctx.fill(); }
  ctx.globalAlpha=1;
  /* Die Achse im Bild - sie zeigt bei allen vier Erden in dieselbe Richtung. */
  const qa=p2(add(p,mul(ERDACHSE,radZ('erde'))));
  if(qa){ let dx=qa[0]-q[0], dy=qa[1]-q[1]; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.setLineDash([4,3]);
    /* innen blass, außen kräftig - wie bei der großen Erde */
    const achsStueck=(von,bis,br,al)=>{ ctx.globalAlpha=al; ctx.lineWidth=br;
      ctx.beginPath(); ctx.moveTo(q[0]+dx*von,q[1]+dy*von); ctx.lineTo(q[0]+dx*bis,q[1]+dy*bis); ctx.stroke(); };
    achsStueck(-rho*1.7,-rho,1.4,1); achsStueck(rho,rho*1.7,1.4,1); achsStueck(-rho,rho,1,0.3);
    ctx.globalAlpha=1; ctx.setLineDash([]);
    text('N',q[0]+dx*rho*2.1,q[1]+dy*rho*2.1,'#e2e8f0',{al:'center',sz:10,rand:'rgba(7,11,24,.85)'}); }
  /* Die Bahn des Ortes gehört auch auf die Kopien - dann sieht man den langen Sommer-
     und den kurzen Wintertag an denselben vier Erden. */
  if(D.sys.tagbahn) ortsbahnAuf(p,radBild(rho,q),t,0.8,0.8);
  const unten=q[1]>VY+VH*0.72;
  text(beschr,q[0],q[1]+(unten?-(rho+16*K):rho+14*K),'#cbd5e1',
    {al:'center',sz:11.5,fett:true,rand:'rgba(7,11,24,.85)'});
}
function malJahresErden(){
  if(!D.sys.jahrErden) return;
  jahresPunkte(D.sys.t).forEach(e=>malErdeGeist(e.t,e.nm+' · '+datumText(e.t)));
}
/* Wie lange ist die Sonne an diesem Ort über dem Horizont? */
function tagLaenge(t){
  const o=ORTE[D.sys.ort]||ORTE[0], ph=o.b*RAD;
  const sd=norm(sub(ortW('sonne',t),ortW('erde',t)));
  const dek=Math.asin(clamp(dot(sd,ERDACHSE),-1,1));
  const c=-Math.tan(ph)*Math.tan(dek);
  if(c<=-1) return {h:24, art:'Mitternachtssonne', dek};
  if(c>=1)  return {h:0,  art:'Polarnacht', dek};
  return {h:2*Math.acos(c)*GRD/15, art:null, dek};
}
/* Wann steht die Sonne über diesem Ort am höchsten? Die Erde muss sich noch so weit
   drehen, bis die Sternzeit des Ortes die Rektaszension der Sonne erreicht. */
function naechsterMittag(t){
  const o=ORTE[D.sys.ort]||ORTE[0], lam=sonnenLaenge(t)*RAD, eps=SCHIEF*RAD;
  const ra=Math.atan2(Math.sin(lam)*Math.cos(eps),Math.cos(lam))*GRD;
  const d=(((ra-(GMST(t)+o.l))%360)+360)%360;
  return t+d/360.9856;
}
const stundenText=h=>zahl(Math.floor(h+1e-9),0)+' h '+zahl(Math.round((h-Math.floor(h+1e-9))*60),0)+' min';
/* Der Breitenkreis des Ortes: Tagstück hell, Nachtstück blau - so wird die Tageslänge sichtbar. */
/* Der Breitenkreis des Ortes auf einer gezeichneten Erdkugel: heller Teil Tag, blauer
   Nacht. Radius und Zeitpunkt kommen von außen - so läuft die Bahn auch auf den vier
   Erden des Jahreslaufs und auf jeder vergrößerten Kugel richtig mit. */
function ortsbahnAuf(E,Rz,t,alpha,dick){
  const o=ORTE[D.sys.ort]||ORTE[0], br=o.b*RAD;
  const sDir=norm(sub(rahmen(ortZ('sonne',t)),E));
  const pkt=th=>add(E,mul(add(mul(add(mul(AEQ_X,Math.cos(th)),mul(AEQ_Y,Math.sin(th))),Math.cos(br)),
                             mul(ERDACHSE,Math.sin(br))),Rz*1.008));
  const zurKam=norm(sub(KAM.pos,E)), hell=[],dunkel=[];
  for(let g=0;g<=360;g+=2){ const q=pkt(g*RAD), n=norm(sub(q,E));
    if(dot(n,zurKam)<=0){ hell.push(null); dunkel.push(null); continue; }   /* Rückseite */
    const tag=dot(n,sDir)>0;
    hell.push(tag?q:null); dunkel.push(tag?null:q); }
  /* Deutlich kräftiger als das Gradnetz, damit man die beiden Stücke auseinanderhält. */
  linie3(dunkel,'#38bdf8',2.2*(dick||1),(alpha==null?1:alpha)*0.95,[6,4]);
  linie3(hell,'#fbbf24',3.4*(dick||1),alpha==null?1:alpha);
}
/* Sehstrahl Erde – Mars: Die gestrichelte Linie zeigt, in welcher Richtung Mars von der
   Erde aus steht. Läuft die Zeit, schwenkt sie mit - und bei der Schleife eine Weile
   zurück. Sie geht etwas über Mars hinaus, damit man die Richtung am Himmel sieht. */
function malSehstrahl(){
  if(!D.sys.sehstrahl||AKT_VON!=='aussen'||!zeigeKoerper('mars')) return;
  const t=D.sys.t, E=rahmen(ortZ('erde',t)), M=rahmen(ortZ('mars',t));
  const d=sub(M,E); if(!(betrag(d)>0)) return;
  const bis=add(E,mul(d,1.3));
  linie3([E,bis],'rgba(217,100,58,.9)',1.6,1,[7,5]);
  const q=p2(bis);
  if(q&&q[0]>-60&&q[0]<W+60&&q[1]>-20&&q[1]<H)
    text('Sehstrahl zum Mars',q[0]+6*K,q[1],'#d9643a',{sz:12,fett:true,rand:'rgba(7,11,24,.8)'});
}
/* Eine Bahnebene geht durch die Kugeln hindurch - gezeichnet wird sie aber vor ihnen,
   also verschwindet ihr vorderer Teil hinter dem Körper. Dieser Teil wird hier
   nachgetragen: Sichtbar ist die Sichel zwischen dem Umriss der Kugel und dem vorderen
   Halbkreis des Schnittkreises (dort schneidet die Ebene die Oberfläche). */
function ebeneVorKugel(eb,id){
  const C=rahmen(ortZ(id,D.sys.t)), q=p2(C); if(!q) return;
  const rho=bildRadius(id,q); if(rho<6) return;                  /* zu klein, um etwas zu sehen */
  const R=radBild(rho,q), rs=umriss(rho);
  const ab=dot(sub(C,eb.mitte),eb.normale);                      /* Abstand Kugelmitte – Ebene */
  if(Math.abs(ab)>=R*0.999) return;                              /* die Ebene trifft nicht */
  const Cs=sub(C,mul(eb.normale,ab)), r=Math.sqrt(Math.max(R*R-ab*ab,0));
  const zurKam=norm(sub(KAM.pos,C));
  const pk=kreisPunkte(Cs,r,eb.normale,96); pk.pop();            /* letzter Punkt ist der erste */
  const vorn=pk.map(x=>dot(norm(sub(x,C)),zurKam)>0);
  let anf=-1;
  for(let i=0;i<pk.length;i++) if(vorn[i]&&!vorn[(i+pk.length-1)%pk.length]){ anf=i; break; }
  if(anf<0) return;                                              /* ganz vorn oder ganz hinten */
  const bogen=[];
  for(let i=0;i<pk.length;i++){ const j=(anf+i)%pk.length; if(!vorn[j]) break;
    const qq=p2(pk[j]); if(qq) bogen.push(qq); }
  if(bogen.length<3) return;
  const A=bogen[0], B=bogen[bogen.length-1], Mb=bogen[bogen.length>>1];
  const wi=x=>Math.atan2(x[1]-q[1],x[0]-q[0]);
  const seite=x=>(x[0]-A[0])*(B[1]-A[1])-(x[1]-A[1])*(B[0]-A[0]);
  const wA=wi(A), wB=wi(B);
  const auf=(w)=>[q[0]+rs*Math.cos(w),q[1]+rs*Math.sin(w)];
  const mod=v=>((v%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  const mUhr=auf(wB+mod(wA-wB)/2);                               /* Mitte des Bogens im Uhrzeigersinn */
  const gegen=!(seite(mUhr)*seite(Mb)>0);                        /* derselbe Seite wie die Sichel? */
  ctx.save();
  ctx.beginPath();
  bogen.forEach((x,i)=>i?ctx.lineTo(x[0],x[1]):ctx.moveTo(x[0],x[1]));
  ctx.arc(q[0],q[1],rs,wB,wA,gegen);
  ctx.closePath();
  ctx.fillStyle=eb.fuell; ctx.fill();
  ctx.restore();
  /* die Schnittlinie auf der Kugel - dort tritt die Ebene aus der Oberfläche */
  ctx.strokeStyle=eb.strich; ctx.lineWidth=1.2; ctx.globalAlpha=0.75;
  ctx.beginPath(); bogen.forEach((x,i)=>i?ctx.lineTo(x[0],x[1]):ctx.moveTo(x[0],x[1])); ctx.stroke();
  ctx.globalAlpha=1;
}
function malEbenenVorn(){
  for(const eb of EBENEN) for(const id of ['erde','mond']){
    if(id===AKT_VON||!zeigeKoerper(id)) continue;
    ebeneVorKugel(eb,id);
  }
}
function malOrtsbahn(){
  if(!D.sys.tagbahn) return;
  const t=D.sys.t, E=rahmen(ortZ('erde',t)), q=p2(E); if(!q) return;
  ortsbahnAuf(E,radBild(erdRho(q),q),t,1);
}
/* ---------- Schattenkegel ---------- */
/* Wo trifft die Strecke A→B zuerst die Kugel? Dort hört der Schattenkegel auf: Der
   Mondschatten läuft nicht durch die Erde hindurch, er endet auf ihrer Oberfläche. */
function bisKugel(A,B,M,R){
  const d=sub(B,A), w=sub(M,A), dd=dot(d,d); if(dd<1e-24) return B;
  const tc=dot(w,d)/dd, h2=R*R-(dot(w,w)-tc*tc*dd);
  if(h2<=0) return B;                                        /* verfehlt die Kugel */
  const t=tc-Math.sqrt(h2/dd);
  return (t<=0||t>=1)?B:add(A,mul(d,t));
}
function malKegel(p3,Rae,richtung,laenge,rEnde,alpha,rand,stopp){
  const basis=kreisPunkte(p3,Rae,richtung,24);
  let ende=kreisPunkte(add(p3,mul(richtung,laenge)),rEnde,richtung,24);
  if(stopp) ende=ende.map((q,i)=>bisKugel(basis[i],q,stopp.M,stopp.R));   /* auf der Kugel aufhören */
  const pk=[];
  for(const p of basis.concat(ende)){ const q=p2(p); if(q) pk.push([q[0],q[1]]); }
  if(pk.length<3) return;
  const h=huelle(pk); if(h.length<3) return;
  ctx.beginPath(); h.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
  ctx.fillStyle='#000'; ctx.globalAlpha=alpha; ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle=rand; ctx.lineWidth=1; ctx.stroke();
}
/* ---------- Schattenflecken auf der Kugel ---------- */
/* Die Mitte des Flecks: Trifft die Schattenachse die Kugel, ist es ihr Eintrittspunkt,
   sonst der Punkt der Kugel, der der Achse am nächsten liegt. */
function fleckMitte(E,R,M,dir){
  const w=sub(E,M), tc=dot(w,dir), h2=R*R-(dot(w,w)-tc*tc);
  if(h2>0&&tc>0) return add(M,mul(dir,tc-Math.sqrt(h2)));
  const v=sub(add(M,mul(dir,tc)),E);
  return betrag(v)<1e-12?sub(E,mul(dir,R)):add(E,mul(norm(v),R));
}
/* Richtungen um eine Mitte herum: Winkelabstand a, Richtung th. Gerechnet wird mit
   Einheitsnormalen, nicht mit Punkten - die Kugel kann größer gezeichnet sein, als
   gerechnet wird (am Ort wird der Mond vergrößert); dann liegt derselbe Fleck nur
   weiter außen auf der Kugel. */
function kugelUm(n0){
  let b1=kreuz(n0,[0,0,1]); if(betrag(b1)<1e-6) b1=kreuz(n0,[0,1,0]);
  b1=norm(b1); const b2=kreuz(n0,b1);
  return (a,th)=>add(mul(n0,Math.cos(a)),
    mul(add(mul(b1,Math.cos(th)),mul(b2,Math.sin(th))),Math.sin(a)));
}
/* Ein Schattenfleck, direkt auf die gezeichnete Kugel gelegt: Von der Mitte aus wird in
   72 Richtungen der Rand gesucht. Begrenzt wird der Fleck vom Schatten selbst, von der
   Lichtgrenze und vom Rand der sichtbaren Halbkugel - so liegt er immer auf der Kugel.
   radius(s) sagt, wie weit der Schatten im Abstand s von der Quelle reicht. */
function malFleck(E,Rt,Rm,M,dir,radius,fuell,rand,mind){
  const sonneP=rahmen(ortZ('sonne',D.sys.t)), zurKam=norm(sub(KAM.pos,E));
  const gr=randGrenze(Rm,betrag(sub(KAM.pos,E)),0.015);      /* Rand der sichtbaren Halbkugel */
  const drin=n=>{ const X=add(E,mul(n,Rt));
    if(dot(n,zurKam)<=gr) return false;                      /* Rückseite der Kugel */
    if(dot(n,norm(sub(sonneP,X)))<=0) return false;          /* Nachtseite */
    const v=sub(X,M), s=dot(v,dir); if(s<=0) return false;
    const rs=radius(s); if(rs<=0) return false;              /* hinter der Kegelspitze */
    return betrag(sub(v,mul(dir,s)))<rs; };
  /* Mitte der Suche: Jeder Punkt des Flecks taugt, aber nicht jeder Punkt der Kugel liegt
     im Fleck. Zuerst wird die Mitte des sichtbaren Tages probiert (dort liegt ein großer
     Schatten wie der Erdschatten auf dem Mond), dann der Punkt an der Schattenachse (dort
     liegt ein kleiner Fleck wie der Mondschatten auf der Erde), dann die Mitte der Scheibe;
     bleibt alles draußen, wird der sichtbare Tag ringsum abgesucht. */
  const zurSonne=norm(sub(sonneP,E)), summe=add(zurKam,zurSonne);
  const hellN=norm(betrag(summe)>1e-6?summe:zurKam);
  const achsN=norm(sub(fleckMitte(E,Rt,M,dir),E));
  let n0=[hellN,achsN,zurKam].find(drin)||null;
  if(!n0){
    const auf0=kugelUm(hellN);
    for(let i=1;i<=10&&!n0;i++) for(let j=0;j<16&&!n0;j++){
      const n=auf0(i*0.15,j*Math.PI/8); if(drin(n)) n0=n; }
    if(!n0) return null; }
  const auf=kugelUm(n0), mal=n=>p2(add(E,mul(n,Rm)));
  const qm=mal(n0); if(!qm) return null;
  /* Jede Grenze (Schattenrand, Lichtgrenze, Kugelrand) schneidet einen Strahl von der Mitte
     aus genau einmal - darum findet die Halbierung den Rand sicher, bis zu 180° weit. Der
     Gegenpunkt der Mitte liegt immer hinter der Kugel, ist also draußen. */
  const pk=[];
  for(let j=0;j<72;j++){ const th=2*Math.PI*j/72;
    let lo=0, hi=Math.PI;
    for(let k=0;k<17;k++){ const mi=(lo+hi)/2; if(drin(auf(mi,th))) lo=mi; else hi=mi; }
    const q=mal(auf(lo,th)); if(q) pk.push(q); }
  if(pk.length<20) return null;
  /* Schräg auf die Kugel gesehen ist der Fleck stark verkürzt. Darum wird auch gemessen,
     wie weit er nach oben und unten reicht - sonst läge die Beschriftung mitten darauf. */
  let rpx=0, oben=0, unten=0;
  pk.forEach(q=>{ rpx=Math.max(rpx,Math.hypot(q[0]-qm[0],q[1]-qm[1]));
    oben=Math.max(oben,qm[1]-q[1]); unten=Math.max(unten,q[1]-qm[1]); });
  ctx.beginPath();
  if(mind&&rpx<mind){ ctx.arc(qm[0],qm[1],mind,0,7); rpx=oben=unten=mind; }  /* winzig: als Punkt */
  else { pk.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); }
  /* Mehrere Füllungen nacheinander: Ein Stern davor heißt „multiplizieren“ - so wird das
     Blau darunter gedämpft, erst dann kommt das Rot darauf. Ein einfaches rotes Tuch über
     dem hellen Blau sähe sonst violett aus. */
  ctx.save();
  (Array.isArray(fuell)?fuell:[fuell]).forEach(f=>{
    const m=f.charAt(0)==='*';
    ctx.globalCompositeOperation=m?'multiply':'source-over';
    if(m&&ctx.globalCompositeOperation!=='multiply') return;   /* kann dieser Browser nicht */
    ctx.fillStyle=m?f.slice(1):f; ctx.fill(); });
  ctx.restore();
  ctx.strokeStyle=rand; ctx.lineWidth=1.3; ctx.stroke();
  return {q:qm, r:rpx, oben, unten};
}
function malSchatten(){
  const t=D.sys.t, sonneP=rahmen(ortZ('sonne',t)), f=sfaktor();
  for(const id of ['erde','mond']){
    if(!zeigeKoerper(id)) continue;         /* ausgeblendet: auch kein Schatten */
    if(imSchatten(id,t)>0.5) continue;      /* wer selbst im Kernschatten steckt, wirft keinen */
    const p=rahmen(ortZ(id,t)), R=radZ(id);
    const dir=norm(sub(p,sonneP));
    const dS=betrag(sub(p,sonneP));
    const tanK=f*(radW('sonne')-radW(id))/dS, tanH=f*(radW('sonne')+radW(id))/dS;
    const L=R/tanK;                                          /* Länge des Kernschattens */
    const LH=L*1.6;
    /* Jeder der beiden wirft seinen Schatten auf den anderen: der Mondschatten auf die
       Erde, der Erdschatten auf den Mond. Gerechnet wird mit der Kugel, die wirklich
       gezeichnet wird - sonst passen Kegel und Fleck nicht zum Bild. */
    const zid=(id==='mond')?'erde':'mond';
    let ziel=null;
    { const Z=rahmen(ortZ(zid,t)), qz=p2(Z);
      if(qz&&fleckeAuf(zid,qz)){ const rho=Math.max(bildRadius(zid,qz),0.8), Rz=radBild(rho,qz);
        ziel={id:zid, p:Z, R:Rz, q:qz, rho:umriss(rho),      /* geklammert wird der Umriss */
              sicht:dot(norm(sub(fleckMitte(Z,Rz,p,dir),Z)),norm(sub(KAM.pos,Z)))>0}; } }
    /* Nur der Mondschatten endet auf der Kugel. Der Erdschatten muss über den Mond
       hinausreichen - sonst sähe man nicht, wie tief der Mond darin steckt. */
    const stopp=(ziel&&id==='mond')?{M:ziel.p,R:ziel.R}:null;
    /* Der Schatten beginnt an der Lichtgrenze und liegt HINTER der Kugel. Darum wird die
       gezeichnete Kugel ausgespart: Sonst legt sich die dunkle Fläche über ihre beleuchtete
       Seite - beim Blick von der Sonne her sogar über die ganze Scheibe. */
    const qm=p2(p), rm=qm?Math.max(umriss(bildRadius(id,qm)),0.8):0;
    const frei=q=>(!qm||Math.hypot(q[0]-qm[0],q[1]-qm[1])>rm+6*K)
               &&(!ziel||Math.hypot(q[0]-ziel.q[0],q[1]-ziel.q[1])>ziel.rho+6*K);
    const ausKreis=(c,r)=>{ ctx.beginPath(); ctx.rect(VX,VY,VW,VH);
      ctx.moveTo(c[0]+r,c[1]); ctx.arc(c[0],c[1],r,0,7);   /* eigener Anfang: sonst zieht arc eine Linie dorthin */
      ctx.clip('evenodd'); };                              /* mehrere clip() schneiden sich */
    ctx.save();
    if(qm) ausKreis(qm,rm);
    /* Auf der getroffenen Kugel liegen die Flecken - ein dunkler Schleier des Kegels
       daruber waere nur im Weg, also wird sie ausgespart. Beim Mondschatten gilt das nur,
       wenn der Fleck auf der Rueckseite liegt: Sonst klaffte zwischen Kugelrand und Fleck
       eine Luecke, denn der Kegel endet ja erst auf der Flaeche. */
    if(ziel&&(id==='erde'||!ziel.sicht)) ausKreis(ziel.q,ziel.rho);
    malKegel(p,R,dir,LH,R+LH*tanH,0.18,'rgba(226,232,240,.14)',stopp);   /* Halbschatten */
    malKegel(p,R,dir,L,0,0.6,'rgba(226,232,240,.3)',stopp);              /* Kernschatten */
    ctx.restore();
    /* Beschriftung, sobald der Kegel breit genug ist und nicht auf der Kugel läge */
    const qk=p2(add(p,mul(dir,L*0.45)));
    if(qk&&F*R*0.55/qk[2]>7&&frei(qk)){
      text('Kernschatten',qk[0],qk[1],'#cbd5e1',{al:'center',sz:11.5,fett:true,rand:'rgba(7,11,24,.85)'});
      const qh=p2(add(p,mul(dir,LH*0.85)));
      if(qh&&frei(qh)) text('Halbschatten',qh[0],qh[1]+F*(R+LH*0.85*tanH)/qh[2]*0.75,'#94a3b8',
        {al:'center',sz:11.5,rand:'rgba(7,11,24,.85)'});
    }
  }
}

/* Die Schattenflecken gehören zur Kugel, nicht zum Kegel - darum werden sie in JEDER
   Ansicht gezeichnet, auch im zweiten Fenster und vom Ort aus: So sieht man von der Erde
   aus, wie der Erdschatten über den Mond wandert. Auf der Erde liegen sie rötlich auf
   dem Blau, auf dem Mond kupferrot - genau die Farbe, die er in einer totalen Finsternis
   annimmt. */
function malFlecken(){
  const t=D.sys.t, sonneP=rahmen(ortZ('sonne',t)), f=sfaktor();
  for(const id of ['erde','mond']){          /* id wirft den Schatten, zid fängt ihn auf */
    if(!zeigeKoerper(id)) continue;          /* ein ausgeblendeter Mond wirft keinen Schatten */
    const zid=(id==='mond')?'erde':'mond';
    if(zid===AKT_VON||(AKT_VON==='ort'&&zid==='erde')) continue;   /* die wird nicht gezeichnet */
    const Z=rahmen(ortZ(zid,t)), qz=p2(Z);
    if(!qz||!fleckeAuf(zid,qz)) continue;
    const Rt=radZ(zid), Rm=radBild(Math.max(bildRadius(zid,qz),0.8),qz);
    const p=rahmen(ortZ(id,t)), R=radZ(id), dS=betrag(sub(p,sonneP));
    if(!(dS>0)) continue;
    const dir=norm(sub(p,sonneP));
    const tanK=f*(radW('sonne')-radW(id))/dS, tanH=f*(radW('sonne')+radW(id))/dS;
    const aufErde=(zid==='erde');
    /* Der Fleck liegt auf der Kugel - der Schattenwerfer steht davor, wenn man von der
       Sonne her schaut. Dann wird seine Scheibe ausgespart, sonst läge der Halbschatten
       über dem Mond, der ihn wirft. */
    const qw=p2(p), rw=qw?Math.max(umriss(bildRadius(id,qw)),0.8):0;
    ctx.save();
    if(qw&&qw[2]<qz[2]){ ctx.beginPath(); ctx.rect(VX,VY,VW,VH);
      ctx.moveTo(qw[0]+rw,qw[1]); ctx.arc(qw[0],qw[1],rw,0,7);   /* eigener Anfang: sonst zieht arc eine Linie dorthin */
      ctx.clip('evenodd'); }
    const hf=malFleck(Z,Rt,Rm,p,dir,s=>R+s*tanH,
      aufErde?['*rgb(255,120,100)','rgba(220,60,50,.3)']:['*rgb(214,196,190)'],
      aufErde?'rgba(248,113,113,.7)':'rgba(248,180,160,.35)',0);
    const kf=malFleck(Z,Rt,Rm,p,dir,s=>R-s*tanK,
      aufErde?'rgba(127,17,17,.92)':'*rgb(196,105,58)',   /* über dem Halbschatten genau #8a4526 */
      aufErde?'rgba(254,202,202,.95)':'rgba(252,165,165,.7)',aufErde?2.6*K:0);
    if(aufErde){                               /* auf dem kleinen Mond wäre das zu viel */
      if(hf&&hf.r>44*K&&kf) text('teilweise',hf.q[0],hf.q[1]-hf.oben-7*K,'#fca5a5',
        {al:'center',sz:11,rand:'rgba(7,11,24,.85)'});
      if(kf&&kf.r>4*K) text('total',kf.q[0],kf.q[1]+kf.unten+9*K,'#fecaca',
        {al:'center',sz:11,fett:true,rand:'rgba(7,11,24,.85)'});
    }
    ctx.restore();
  }
}

/* ---------- Maßstabsbalken ---------- */
function malMassstab(unten){
  if(D.sys.von==='ort') return;                       /* am Himmel gibt es keine Entfernung zu zeigen */
  const S=D.sys, zielP=rahmen(ortZ(AKT_ZIEL,S.t));
  const d0=betrag(sub(zielP,KAM.pos)); if(!(d0>0)) return;
  const jePx=d0/F;                                           /* AE je Bildpunkt beim Blickziel */
  let roh=120*jePx, km=roh*AE, stufe, einh, wert;
  const schoen=x=>{ const e=Math.pow(10,Math.floor(Math.log10(x))), m=x/e;
    return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e; };
  if(km<2e6){ wert=schoen(km); einh='km'; stufe=wert/AE; }
  else { wert=schoen(roh); einh='AE'; stufe=wert; }
  const px=stufe/jePx; if(!(px>10&&px<W*0.8)) return;
  const x0=W-px-18, y=H-(unten||0)-14;
  ctx.strokeStyle='rgba(226,232,240,.8)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(x0,y-5); ctx.lineTo(x0,y); ctx.lineTo(x0+px,y); ctx.lineTo(x0+px,y-5); ctx.stroke();
  text(zahl(wert,wert<10&&einh==='AE'?(wert<1?2:1):0)+' '+einh,x0+px/2,y-12,'#cbd5e1',{al:'center',sz:12});
}

/* Der Inhalt einer Ansicht - einmal für das große Bild, einmal für das zweite Fenster */
function szeneMalen(){
  const S=D.sys, t=S.t, amOrt=(AKT_VON==='ort');
  malSterne();                         /* der Sternhimmel gehört immer dazu */
  if(S.ebenen){ if(amOrt) malEkliptik(); else malEbenen(); }
  if(S.aequator&&amOrt) malAequator();
  if(S.bahnen){ malBahnen();
    if(amOrt){ malTagbogen('sonne','rgba(253,224,71,.9)');
      if(zeigeKoerper('mond')) malTagbogen('mond','rgba(226,232,240,.75)'); } }
  malEpizykel();
  malSehstrahl();
  if(!amOrt) malJahresErden();
  const liste=['sonne','merkur','venus','erde','mars','mond']
    .filter(id=>id!==AKT_VON&&!(amOrt&&id==='erde')&&zeigeKoerper(id))
    .map(id=>({id,p:rahmen(ortZ(id,t))}));
  liste.sort((a,b)=>betrag(sub(b.p,KAM.pos))-betrag(sub(a.p,KAM.pos)));
  liste.forEach(o=>malKoerper(o.id,o.p));
  if(S.ebenen&&!amOrt) malEbenenVorn();     /* die Ebenen gehen durch die Kugeln hindurch */
  if(schattenAn()) malSchatten();
  malFlecken();                        /* liegen auf der Kugel, also über dem Kegel */
  if(!amOrt) malOrtsbahn();
  malKuppel();
  if(amOrt) malBoden();
}
/* Deferent und Epizykel: Im geozentrischen Bild zerfällt die Bewegung eines Planeten in
   zwei Kreise. Bei den inneren Planeten (Merkur, Venus) trägt der Deferent den Mittelpunkt
   des Epizykels mit der Sonne um die Erde, und der Planet läuft auf dem Epizykel um diesen
   Mittelpunkt; beim Mars ist es umgekehrt - der Deferent ist seine eigene Bahn, der
   Epizykel die Erdbahn. Beides zusammen ergibt genau die Schleifenbahn, die man sieht:
   geozentrischer Ort = (Planet − Sonne) + (Sonne − Erde). Ptolemäus hat es so beschrieben. */
function malEpizykel(){
  const S=D.sys;
  if(!S.epizykel||S.bezug!=='erde'||AKT_VON!=='aussen') return;
  const t0=S.t, E0=rahmen(ortZ('erde',t0));
  for(const id of ['merkur','venus','mars']){
    if(!zeigeKoerper(id)) continue;
    const innen=KOERPER[id].a<1;
    const mitte=t=>innen?sub(ortW('sonne',t),ortW('erde',t)):sub(ortW(id,t),ortW('sonne',t));
    const arm  =t=>innen?sub(ortW(id,t),ortW('sonne',t)):sub(ortW('sonne',t),ortW('erde',t));
    const PD=innen?KOERPER.erde.T:KOERPER[id].T;        /* Umlauf auf dem Deferenten */
    const PE=innen?KOERPER[id].T:KOERPER.erde.T;        /* Umlauf auf dem Epizykel */
    const farbe=KOERPER[id].farbe, C0=add(E0,mitte(t0));
    const def=[]; for(let i=0;i<=240;i++) def.push(add(E0,mitte(t0+PD*i/240)));
    linie3(def,farbe,1.3,0.45,[6,5]);
    const epi=[]; let oben=null;
    for(let i=0;i<=160;i++){ const pp=add(C0,arm(t0+PE*i/160)); epi.push(pp);
      const qq=p2(pp); if(qq&&(!oben||qq[1]<oben[1])) oben=qq; }
    linie3(epi,farbe,1.4,0.8);
    linie3([E0,C0],'rgba(226,232,240,.45)',1.1,1,[3,3]);          /* Deferentenarm */
    linie3([C0,add(C0,arm(t0))],rgba(farbe,0.95),1.6);            /* Epizykelarm */
    const qc=p2(C0); if(!qc) continue;
    ctx.strokeStyle=rgba(farbe,0.95); ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(qc[0],qc[1],3.2,0,7); ctx.stroke();
    /* Die Schrift an den höchsten Punkt des Epizykels - bei Merkur und Venus liegen die
       Mittelpunkte beide in der Sonne, dort lägen auch die Namen übereinander. */
    if(oben&&Math.hypot(oben[0]-qc[0],oben[1]-qc[1])>22)
      text('Epizykel '+KOERPER[id].name,oben[0],oben[1]-9*K,rgba(farbe,1),
        {al:'center',sz:10.5,fett:true,rand:'rgba(7,11,24,.85)'});
  }
}
const WOHER={aussen:'von außen',sonne:'von der Sonne',erde:'von der Erde',mond:'vom Mond',ort:'vom Ort'};
const WORAUF={sonne:'auf die Sonne',erde:'auf die Erde',mond:'auf den Mond',merkur:'auf den Merkur',venus:'auf die Venus',mars:'auf den Mars'};
/* Das zweite Fenster zeigt dasselbe Ereignis von einem anderen Standort aus.
   Das Blickziel sucht es sich selbst: Bei einer Sonnenfinsternis oder einem Transit
   schaut man von der Erde zur Sonne, sonst zum Mond. */
/* Welches Ziel sucht sich das Fenster selbst, wenn nichts gewählt ist? */
function pipZielAuto(von,t){
  if(von==='erde'||von==='ort') return (finsternisse(t).sofi||transit(t))?'sonne':'mond';
  if(von==='mond') return 'erde';
  if(von==='sonne') return 'erde';
  return 'erde';
}
const PIP_ZIELE={ aussen:['erde','mond','sonne','merkur','venus','mars'],
  sonne:['erde','mond','merkur','venus','mars'], erde:['mond','sonne','merkur','venus','mars'],
  mond:['erde','sonne','merkur','venus','mars'], ort:['mond','sonne','merkur','venus','mars'] };
function pipOpt(){
  const S=D.sys, t=S.t, von=S.pip;
  if(!von||von==='aus') return null;
  let ziel=S.pipZiel||'auto';
  if(ziel==='auto'||ziel===von||!(PIP_ZIELE[von]||[]).includes(ziel)) ziel=pipZielAuto(von,t);
  if(von==='aussen'){
    /* Erde und Mond aus der Nähe, die Planeten als Überblick. „anschaulich" taugt aus der
       Nähe nicht - man säße in der aufgeblasenen Erde -, darum dort das Schattenmodell. */
    const nah=(ziel==='erde'||ziel==='mond');
    return {von:'aussen', ziel, dist:nah?0.0075:4.2, az:sonnenLaenge(t)+90, el:nah?12:24,
      stufe:nah?(S.stufe==='ansch'?'schatten':S.stufe):'ansch'};
  }
  if(von==='ort') return {von, ziel, fov:70, panAz:0, panEl:0};    /* der halbe Himmel über dem Ort */
  /* Zeigt das große Bild das Schattenmodell, wird auch hier überhöht - dann dauert die
     Finsternis in beiden Fenstern gleich lang. Der Ausschnitt wächst mit. */
  const ueb=(D.sys.stufe==='schatten')?clamp(D.sys.sf||SF_STD,2,12):1;
  const d=betrag(sub(ortW(ziel,t),ortW(von,t)));
  const w=2*Math.asin(clamp(radW(ziel)*ueb/Math.max(d,1e-9),-1,1))*GRD;
  /* Der Körper soll ein Viertel der Fensterhöhe füllen - bei acht war er kaum zu erkennen. */
  return {von, ziel, fov:w>0.1?clamp(w*4,0.3,40):25, panAz:0, panEl:0,
    himmelUeb:ueb>1?((ziel==='mond'||ziel==='erde')?'alles':'groesse'):false};
}
let pipStand=null;
function pipZielFeld(von,ziel,bx,by,bw){
  const sel=$('selPipZiel'); if(!sel) return;
  if(!von){ sel.hidden=true; pipStand=null; return; }
  if(pipStand!==von){                                 /* Liste nur bei neuem Standort neu bauen */
    pipStand=von; sel.innerHTML='';
    const mk=(v,t)=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; sel.appendChild(o); };
    mk('auto','Ziel: automatisch');
    (PIP_ZIELE[von]||[]).forEach(id=>mk(id,WORAUF[id]));
  }
  sel.value=(D.sys.pipZiel&&[...sel.options].some(o=>o.value===D.sys.pipZiel))?D.sys.pipZiel:'auto';
  sel.title='Worauf das zweite Fenster schaut – gerade '+WORAUF[ziel];
  sel.hidden=false;
  sel.style.left=Math.round(bx)+'px'; sel.style.top=Math.round(by)+'px'; sel.style.width=Math.round(bw)+'px';
}
let PIP_RECT=null;                 /* Lage des zweiten Fensters - dort tippt man nicht */
function malPip(){
  const o=pipOpt();
  if(!o){ pipZielFeld(null); PIP_RECT=null; return; }
  const bw=Math.min(W*0.33,H*0.44,330), bh=bw*0.74;
  const bx=W-bw-10, by=34*K;
  PIP_RECT=[bx,by,bw,bh];
  ctx.save();
  ctx.beginPath(); ctx.rect(bx,by,bw,bh); ctx.clip();
  ctx.fillStyle='#070b18'; ctx.fillRect(bx,by,bw,bh);
  VX=bx; VY=by; VW=bw; VH=bh;
  kameraSetzen(o);
  szeneMalen();
  ctx.restore();
  ctx.strokeStyle='rgba(226,232,240,.55)'; ctx.lineWidth=1.5;
  ctx.strokeRect(bx+0.75,by+0.75,bw-1.5,bh-1.5);
  ctx.fillStyle='rgba(7,11,24,.72)'; ctx.fillRect(bx+1,by+bh-20*K,bw-2,19*K);
  ctx.save();                                   /* die Zeile darf nicht aus dem Fenster ragen */
  ctx.beginPath(); ctx.rect(bx+1,by+bh-20*K,bw-2,19*K); ctx.clip();
  text(WOHER[o.von]+' '+WORAUF[o.ziel]+(o.himmelUeb?' · überhöht':''),
    bx+8,by+bh-10*K,'#cbd5e1',{sz:12,fett:true});
  ctx.restore();
  pipZielFeld(o.von,o.ziel,bx,by+bh+6,bw);
}
function zeichneSystem(){
  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);
  VX=0; VY=0; VW=W; VH=H;
  kameraSetzen();
  szeneMalen();
  malPip();
  VX=0; VY=0; VW=W; VH=H; kameraSetzen();          /* für Maßstab und Infozeile zurückstellen */
  malMassstab(malInfoSystem());
  const notizen=[];
  if(schattenStufe()) notizen.push('Schattenmodell – quer überhöht: Mondbahn '+grad(neigungUeb(),0)
    +' statt 5,1° geneigt, Erde und Mond '+zahl(sfaktor(),0)+'-fach');
  const lupeF=D.sys.von==='aussen'?nahLupeHinweis():1;

function ereignisName(art,t){
  let nm=EREIG_NAME[art]||'Ereignis';
  if(art==='sofi') nm=finsternisse(t).sofi||nm;
  if(art==='mofi') nm=finsternisse(t).mofi||nm;
  return nm;

function listeFuellen(ab){
  const sel=$('selListe'); if(!sel) return;
  const t0=(ab===undefined?D.sys.t:ab), eintraege=[];
  const nimm=(art,n)=>{ let t=t0;
    for(let i=0;i<n;i++){ const tt=suchen(art,t); if(tt===null) break; eintraege.push({t:tt,art}); t=tt+1; } };
  nimm('sofi',4); nimm('mofi',4); nimm('neumond',2); nimm('vollmond',2);
  nimm('opposition',2); nimm('sommer',2); nimm('winter',2); nimm('transit',2);
  /* Eine Finsternis ist immer auch Neumond oder Vollmond - dann reicht der eine Eintrag. */
  const fins=eintraege.filter(e=>e.art==='sofi'||e.art==='mofi');
  const liste=eintraege.filter(e=>!((e.art==='neumond'||e.art==='vollmond')&&fins.some(f=>Math.abs(f.t-e.t)<0.4)));
  liste.sort((a,b)=>a.t-b.t);
  sel.innerHTML='<option value="" hidden>wählen …</option>';
  const gg=document.createElement('optgroup'); gg.label='Grundfälle (ohne Datum)';
  Object.keys(GRUNDFALL).forEach(k=>{ const o=document.createElement('option');
    o.value='g:'+k; o.textContent=GRUNDFALL[k].name; gg.appendChild(o); });
  sel.appendChild(gg);
  const gd=document.createElement('optgroup'); gd.label='Nächste Ereignisse mit Datum';
  sel.appendChild(gd);
  liste.forEach((e,i)=>{
    const o=document.createElement('option'); o.value=String(i);
    o.dataset.t=String(e.t); o.dataset.art=e.art;
    o.textContent=datumText(e.t)+' · '+ereignisName(e.art,e.t);
    gd.appendChild(o);
  });
  /* Am Ende weiterblättern: Die Liste wird ab dem letzten Eintrag neu gefüllt. */
  if(liste.length){
    const letzt=liste[liste.length-1].t;
    const o=document.createElement('option'); o.value='mehr'; o.dataset.t=String(letzt);
    o.textContent='▸ weiter ab '+datumText(letzt);
    gd.appendChild(o);
  }
  listeStand=t0; wahlZeigen();
}
/* Nach dem Neufüllen soll das gewählte Ereignis im Feld stehen bleiben - sonst steht
   dort wieder „wählen …", obwohl eben etwas gewählt wurde. */
function wahlZeigen(){
  const sel=$('selListe'); if(!sel) return;
  const w=D.sys.wahl;
  if(w&&w.art==='grund'&&GRUNDFALL[w.key]){ sel.value='g:'+w.key; if(sel.value) return; }
  if(w&&w.art==='datum'){
    for(const o of sel.options)
      if(o.dataset.art===w.ereignis&&Math.abs(+o.dataset.t-w.t)<0.5){ sel.value=o.value; return; }
    /* Die Liste beginnt beim jetzigen Zeitpunkt - das eben angesprungene Ereignis steht
       also nicht mehr darin. Es kommt als eigene Zeile dazu, damit im Feld steht,
       was gewählt ist. */
    const gd=sel.querySelectorAll('optgroup')[1]||sel;
    const o=document.createElement('option');
    o.value='w'; o.dataset.t=String(w.t); o.dataset.art=w.ereignis;
    o.textContent=datumText(w.t)+' · '+ereignisName(w.ereignis,w.t);
    gd.insertBefore(o,gd.firstChild);
    sel.value='w'; return;
  }
  sel.value='';
}
function listePruefen(){
  const sel=$('selListe'); if(!sel) return;
  const erste=sel.options[1];
  /* Nur nachfüllen, wenn die Zeit über den ersten Eintrag hinausgelaufen ist - wer
     vorgeblättert hat, soll seine Liste behalten. */
  if(!erste||listeStand===null||D.sys.t>+erste.dataset.t+1) listeFuellen();

function springeZu(t,art){

/* ============================================================
   Gemeinsames für die vier Geometrie-Seiten
   ============================================================ */
/* Lange Sätze umbrechen - auf der Tafel ist das Werkzeug oft schmal. */
function umbruch(txt,maxW,sz,fett){
  ctx.font=schrift(sz,fett);
  if(ctx.measureText(txt).width<=maxW) return [txt];
  const worte=txt.split(' '), raus=[]; let zeile='';
  for(const w of worte){
    const probe=zeile?zeile+' '+w:w;
    if(ctx.measureText(probe).width>maxW&&zeile){ raus.push(zeile); zeile=w; }
    else zeile=probe;
  }
  if(zeile) raus.push(zeile);
  return raus;
}
function zeilenBauen(zeilen){                       /* [{t,f,sz,fett}] → umgebrochene Liste */
  const raus=[];
  zeilen.forEach(z=>{ const sz=z.sz||13;
    umbruch(z.t,W-24,sz,z.fett).forEach(t=>raus.push({t,f:z.f,sz,fett:z.fett,h:Math.max(17,sz*1.35)*K})); });
  return raus;
}
function infoHell(zeilen){
  const zl=zeilenBauen(zeilen);
  let hoch=12; zl.forEach(z=>hoch+=z.h);
  ctx.fillStyle='rgba(255,255,255,.93)'; ctx.fillRect(0,H-hoch,W,hoch);
  ctx.strokeStyle='#e2e7ef'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,H-hoch+.5); ctx.lineTo(W,H-hoch+.5); ctx.stroke();
  let y=H-hoch+8;
  zl.forEach(z=>{ y+=z.h/2; text(z.t,12,y,z.f||'#475569',{sz:z.sz,fett:z.fett}); y+=z.h/2; });
  return hoch;
}
function pfeilBogen(cx,cy,r,w1,w2,farbe,beschr){
  ctx.strokeStyle=farbe; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(cx,cy,r,w1,w2); ctx.stroke();
  if(beschr){ const wm=(w1+w2)/2;
    text(beschr,cx+Math.cos(wm)*(r+12*K),cy+Math.sin(wm)*(r+12*K),farbe,{al:'center',sz:13,fett:true,rand:'#fff'}); }
}
function rechterWinkel(px,py,d1,d2,gr,farbe){
  const a=[px+d1[0]*gr,py+d1[1]*gr], b=[px+d2[0]*gr,py+d2[1]*gr];
  ctx.strokeStyle=farbe; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(a[0]+d2[0]*gr,a[1]+d2[1]*gr);
  ctx.lineTo(b[0],b[1]); ctx.stroke();
}

/* ============================================================
   Seite 2: Erdumfang nach Eratosthenes
   ============================================================ */
const U_WAHR=40075, KM_JE_GRAD=U_WAHR/360, SONNENDEK=23.4393;
const schattenW=b=>b-SONNENDEK;
/* Ort B liegt fest auf dem Wendekreis: Dort steht die Sonne im Zenit und wirft keinen
   Schatten - genau der Fall, von dem Eratosthenes ausging (Syene). Gemessen wird nur der
   Schattenwinkel bei A. */
const ERAT_BSP=[
  {n:'Alexandria (Eratosthenes)',a:31},
  {n:'Hamburg',a:53.5},
  {n:'Amberg',a:49.5},
  {n:'Nordkap',a:71},
  {n:'Kairo',a:30},
  {n:'dicht bei Syene',a:24}
];
/* Flaches Modell: Dieselben Schattenwinkel verlangen eine nahe Sonne. Ihre Höhe folgt
   aus dem Strahlensatz - und faellt fuer jedes Ortspaar anders aus. Genau daran
   scheitert das Modell. */
function flacheSonne(bA,bB,f){
  const a1=schattenW(bA)+(f||0), a2=schattenW(bB);
  const tA=Math.tan(a1*RAD), tB=Math.tan(a2*RAD);
  const sKm=(bA-bB)*KM_JE_GRAD;                        /* A nördlich von B: positiv */
  const h=(Math.abs(tA-tB)<1e-9)?Infinity:sKm/(tA-tB);
  return {h, tA, tB, sKm, fussKm:tA*h};                /* fussKm: Fußpunkt der Sonne, von A aus */
}
function erdumfang(bA,bB,f){
  const a1=schattenW(bA)+(f||0), a2=schattenW(bB);
  const alpha=Math.abs(a1-a2), s=Math.abs(bA-bB)*KM_JE_GRAD;
  return {alpha,s,U:alpha<1e-9?Infinity:s*360/alpha};
}
/* Die drei Zeilen unter dem Bild - je nach Modell. */
function eratZeilen(flach,bA,bB,f){
  const e=erdumfang(bA,bB,f), abw=(e.U-U_WAHR)/U_WAHR*100;
  const fl=flacheSonne(bA,bB,f);
  let zeilen;
  if(!flach){
    const rE=e.U/(2*Math.PI), abwR=(rE-R_ERDE)/R_ERDE*100;
    zeilen=[
      {t: e.alpha<0.05 ? 'A liegt fast auf dem Wendekreis – ohne Schattenwinkel geht es nicht'
         : 'Erdradius r = U / (2π) = '+zahl(rE,0)+' km   ('+(abwR>=0?'+':'−')+zahl(Math.abs(abwR),1)+' % gegenüber 6 378 km)',
       f:'#1f2430',sz:16,fett:true},
      {t:'Erdumfang U = s · 360°/α = '+zahl(e.U,0)+' km · α = Schattenwinkel bei A = '+grad(e.alpha)
        +' · bei B steht die Sonne im Zenit (kein Schatten) · Entfernung s = '+zahl(e.s,0)+' km'},
      {t: e.alpha<0.05 ? 'Ohne Winkelunterschied lässt sich nichts ausrechnen – deshalb nahm Eratosthenes zwei weit entfernte Orte.'
         : 'Ein halbes Grad Messfehler verschiebt den Umfang um rund '+zahl(e.U*0.5/e.alpha,0)
           +' km. Je kleiner α, desto stärker schlägt jeder Fehler durch. Mit r geht es weiter: Die Mondentfernung hängt daran.'}
    ];
  } else {
    const andere=ERAT_BSP.slice(0,4).map(b=>b.n.replace(/ \(.*\)/,'')+' '+zahl(flacheSonne(b.a,SONNENDEK,0).h,0)+' km').join(' · ');
    zeilen=[
      {t: !isFinite(fl.h)||fl.h<=0 ? 'Mit diesen beiden Messungen kommt im flachen Modell gar keine Sonne heraus'
         : 'Im flachen Modell stünde die Sonne nur h = '+zahl(fl.h,0)+' km hoch – '
           +zahl(AE/fl.h,0)+'-mal zu niedrig', f:'#1f2430',sz:16,fett:true},
      {t:'h = s / (tan α_A − tan α_B) = '+zahl(fl.sKm,0)+' km / (tan '+grad(Math.abs(schattenW(bA)+f))
        +' − tan '+grad(Math.abs(schattenW(bB)))+')   ·   in Wirklichkeit: 149 600 000 km'},
      {t:'Dieselbe Rechnung mit anderen Ortspaaren: '+andere+' – jedes Paar ergibt etwas anderes. '
        +'Auf der Kugel passt dagegen ein einziger Wert zu allen Messungen.'}
    ];
  }
  return zeilen;
}
/* Maßstab und Lage des flachen Bildes. A steht rechts, B links - genau wie auf der
   Kugel, wo Norden nach rechts zeigt; nur so geht das eine Bild weich ins andere über. */
function flachLage(fl,HV){
  const y0=HV*0.86, stab=32;
  const xmin=Math.min(0,fl.sKm,fl.fussKm), xmax=Math.max(0,fl.sKm,fl.fussKm);
  const spanne=Math.max(xmax-xmin,1)*1.25;
  const jeKm=(isFinite(fl.h)&&fl.h>0)?Math.min(W*0.72/spanne,(HV*0.62)/fl.h):W*0.72/spanne;
  return {y0, stab, jeKm, X:km=>W*0.5-(km-(xmin+xmax)/2)*jeKm};   /* +km geht nach links */
}
/* ---------- weicher Übergang Kugel ↔ flache Erde ---------- */
/* Beim Umschalten wird der Bogen zwischen den beiden Orten gerade gezogen und dabei
   herangezoomt. Die Sonnenstrahlen laufen dadurch von selbst zusammen: Je flacher die
   Erde, desto näher muss die Sonne stehen, damit dieselben Schattenwinkel herauskommen.
   Gerechnet wird mit dem Mittelpunktswinkel g zwischen den beiden Orten - er geht von
   alpha (Kugel) auf null (flach), der Krümmungsradius also von 6371 km ins Unendliche. */
const ERAT_DAUER=1.2;                               /* Sekunden für den ganzen Übergang */
let eratM=0, eratZiel=0, eratId=0, eratLetzte=0;
const eratWeich=x=>x<0.5?2*x*x:1-Math.pow(1-x,2)*2;  /* sanft anfahren und ausrollen */
function eratSchritt(jetzt){
  const dt=Math.min(0.08,(jetzt-eratLetzte)/1000); eratLetzte=jetzt;
  const v=dt/ERAT_DAUER;
  eratM=eratZiel>eratM?Math.min(eratZiel,eratM+v):Math.max(eratZiel,eratM-v);
  /* erst den nächsten Schritt anmelden, dann zeichnen: zeichneErat lässt den Übergang
     einrasten, solange keiner angemeldet ist. */
  eratId=(eratM===eratZiel)?0:requestAnimationFrame(eratSchritt);
  zeichne();
}
function eratUebergang(zu){
  eratZiel=zu?1:0;
  if(eratId) cancelAnimationFrame(eratId);
  eratLetzte=performance.now(); eratId=requestAnimationFrame(eratSchritt);
}
function zeichneEratUeber(roh){
  const E=D.erat, bA=E.a, bB=SONNENDEK, f=E.fehler/100, m=eratWeich(clamp(roh,0,1));
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const fl=flacheSonne(bA,bB,f);
  const hoch=infoHell(eratZeilen(E.flach,bA,bB,f));   /* der Text des Ziels steht schon da */
  const HV=H-hoch;
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,HV); ctx.clip();   /* nichts in die Textzeilen malen */
  const a1=schattenW(bA)+f, a2=schattenW(bB);        /* gemessene Schattenwinkel */

  else { const tief=(W+H)*2;
    const e1=ortP(umax), e2=ortP(-umax);
    ctx.lineTo(e1[0]-aus[0]*tief,e1[1]-aus[1]*tief);
    ctx.lineTo(e2[0]-aus[0]*tief,e2[1]-aus[1]*tief); ctx.closePath(); }
  ctx.fillStyle='rgba('+Math.round(mi(239,146))+','+Math.round(mi(246,64))+','+Math.round(mi(255,14))+','+mi(1,0.08).toFixed(2)+')';
  ctx.fill();

    ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(qq[0],qq[1],3.8,0,7); ctx.fill();
    text(nm,qq[0]+nb[0]*(stabPx+12*K),qq[1]+nb[1]*(stabPx+12*K),farbe,{al:'center',sz:14,fett:true,rand:'#fff'});
    /* Schatten: so lang, wie der gemessene Winkel es verlangt, von der Sonne weg */
    const sl=Math.tan(sw*RAD)*stabPx;
    const sch=[qq[0]+tb[0]*sl, qq[1]+tb[1]*sl];
    ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(qq[0],qq[1]); ctx.lineTo(sch[0],sch[1]); ctx.stroke();
    /* der Strahl über die Stabspitze bis zur Schattenspitze */
    ctx.strokeStyle='rgba(234,179,8,.95)'; ctx.lineWidth=1.7;
    const sb=insBild(dA);                       /* ohne Schnittpunkt: von weit her, parallel */
    const her=S?P(S[0],S[1]):[sp[0]+sb[0]*(W+H),sp[1]+sb[1]*(W+H)];
    ctx.beginPath(); ctx.moveTo(her[0],her[1]); ctx.lineTo(sp[0],sp[1]); ctx.lineTo(sch[0],sch[1]); ctx.stroke();
  });
  /* ---- die Sonne, sobald sie ins Bild kommt ---- */
  if(S){
    const qs=P(S[0],S[1]);
    const drin=qs[0]>-W*0.5&&qs[0]<W*1.5&&qs[1]>-H*0.5&&qs[1]<H;
    if(drin){
      ctx.save(); ctx.globalAlpha=clamp((m-0.25)/0.35,0,1);
      const gr=ctx.createRadialGradient(qs[0],qs[1],0,qs[0],qs[1],46);
      gr.addColorStop(0,'rgba(250,204,21,.6)'); gr.addColorStop(1,'rgba(250,204,21,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(qs[0],qs[1],46,0,7); ctx.fill();
      ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(qs[0],qs[1],13,0,7); ctx.fill();
      text('hier m\u00fcsste die Sonne stehen',qs[0],qs[1]-26*K,'#a16207',{al:'center',sz:13,fett:true,rand:'#fff'});
      if(m>0.55&&isFinite(fl.h)&&fl.h>0){
        ctx.globalAlpha=clamp((m-0.55)/0.4,0,1)*0.95;
        /* Fußpunkt: vom Mittelpunkt aus in Richtung Sonne auf die Oberfläche */
        const vx=S[0]-0, vy=S[1]+Rk, vl=Math.hypot(vx,vy)||1;

        ctx.beginPath(); ctx.moveTo(qs[0],qs[1]); ctx.lineTo(fuss[0],fuss[1]); ctx.stroke(); ctx.setLineDash([]);
        text('h \u2248 '+zahl(fl.h,0)+' km',qs[0]+10*K,(qs[1]+fuss[1])/2,'#92400e',{sz:14,fett:true,rand:'#fff'});
      }

    }
  }
  /* ---- Beschriftung am Rand (in beiden Bildern gleich) ---- */
  [[bA,a1,'A','#2563eb'],[bB,a2,'B','#16a34a']].forEach(([br,sw,nm,farbe],i)=>{
    text(nm+': '+grad(br)+' N  \u2013  '+(Math.abs(sw)<0.3?'kein Schatten':'Schattenwinkel '+grad(Math.abs(sw))),

  if(m>0.7){ ctx.save(); ctx.globalAlpha=clamp((m-0.7)/0.3,0,1);

    ctx.restore(); }

}
/* Lupe auf den Z-Winkel: Die Sonnenstrahlen sind parallel, der Erdradius schneidet sie
   als Gerade. Wechselwinkel an geschnittenen Parallelen sind gleich groß - genau deshalb
   ist der Schattenwinkel bei A so groß wie der Mittelpunktswinkel α. Ohne diesen Schritt
   bleibt die Rechnung des Eratosthenes ein Trick statt einer Begründung. */
function bogenKurz(x,y,r,wa,wb,farbe,txt){
  let d=wb-wa;
  while(d>Math.PI) d-=2*Math.PI;
  while(d<-Math.PI) d+=2*Math.PI;
  pfeilBogen(x,y,r,Math.min(wa,wa+d),Math.max(wa,wa+d),farbe,txt);
}
function zWinkelLupe(bA,bB,f,uS,HV){
  const bw=Math.min(W*0.38,340), bh=Math.min(bw*0.82,HV*0.56), bx=W-bw-14, by=HV-bh-12;
  ctx.save();
  ctx.beginPath(); ctx.rect(bx,by,bw,bh); ctx.clip();
  ctx.fillStyle='#f8fafc'; ctx.fillRect(bx,by,bw,bh);
  const w=(90-bA)*RAD, uA=[Math.cos(w),-Math.sin(w)];      /* Richtung Erdmitte → A */
  /* Der wahre Winkel ist nur ein paar Grad - in der Lupe wird er auf mindestens 24°
     aufgezogen, sonst liegen die beiden Schenkel aufeinander. Die Zahl bleibt die wahre. */
  const swV=schattenW(bA)+f, gross=Math.abs(swV)<24;
  const bZ=(gross?24:Math.abs(swV))*(swV<0?-1:1);
  const uSz=[Math.cos(w+bZ*RAD),-Math.sin(w+bZ*RAD)];      /* gezeichnete Richtung zur Sonne */
  const lauf=[-uSz[0],-uSz[1]];                            /* so laufen die Strahlen */
  const L=Math.min(bw,bh)*0.66;
  const O=[bx+bw*0.24,by+bh*0.74], A=[O[0]+uA[0]*L,O[1]+uA[1]*L];
  const gerade=(P,d,v,h,farbe,breite,strich)=>{
    ctx.strokeStyle=farbe; ctx.lineWidth=breite; ctx.setLineDash(strich||[]);
    ctx.beginPath(); ctx.moveTo(P[0]-d[0]*v,P[1]-d[1]*v); ctx.lineTo(P[0]+d[0]*h,P[1]+d[1]*h); ctx.stroke();
    ctx.setLineDash([]);
  };
  /* die beiden parallelen Sonnenstrahlen und der Erdradius als Schnittgerade */
  gerade(O,lauf,L*0.95,L*0.75,'rgba(234,179,8,.95)',2);
  gerade(A,lauf,L*0.95,L*0.75,'rgba(234,179,8,.95)',2);
  gerade(O,uA,L*0.45,L*1.5,'#334155',1.8,[7,5]);
  /* Punkte */
  ctx.fillStyle='#16a34a'; ctx.beginPath(); ctx.arc(O[0],O[1],5,0,7); ctx.fill();
  text('Erdmitte',O[0]-14*K,O[1]+13*K,'#16a34a',{al:'right',sz:11.5,fett:true,rand:'#f8fafc'});
  ctx.fillStyle='#2563eb'; ctx.beginPath(); ctx.arc(A[0],A[1],5,0,7); ctx.fill();
  text('A',A[0]+10*K,A[1]-8*K,'#2563eb',{al:'left',sz:13,fett:true});
  /* der Stab bei A steht senkrecht, also in der Richtung des Radius */
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(A[0]+uA[0]*22,A[1]+uA[1]*22); ctx.stroke();
  /* die beiden Wechselwinkel */
  const wOA=Math.atan2(uA[1],uA[0]), wOS=Math.atan2(uSz[1],uSz[0]);
  const wAO=Math.atan2(-uA[1],-uA[0]), wAL=Math.atan2(lauf[1],lauf[0]);
  const sw=Math.abs(schattenW(bA)+f);
  bogenKurz(O[0],O[1],L*0.52,wOA,wOS,'#dc2626','\u03b1 = '+grad(Math.abs(bA-bB)));
  bogenKurz(A[0],A[1],L*0.42,wAO,wAL,'#dc2626',sw<0.3?'0\u00b0':grad(sw));
  text('Z-Winkel an parallelen Strahlen',bx+bw/2,by+15*K,'#334155',{al:'center',sz:12.5,fett:true});
  text('Schattenwinkel bei A = Winkel \u03b1',bx+bw/2,by+bh-(gross?24:11)*K,'#64748b',{al:'center',sz:11.5});
  if(gross) text('(Winkel vergr\u00f6\u00dfert gezeichnet)',bx+bw/2,by+bh-10*K,'#94a3b8',{al:'center',sz:11});
  ctx.restore();
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1.4; ctx.strokeRect(bx+0.75,by+0.75,bw-1.5,bh-1.5);
}

      if(sichtbar){ ctx.strokeStyle='rgba(234,179,8,.9)'; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(x,y0-stab); ctx.lineTo(x+sch,y0); ctx.stroke(); }
      legF.push({nm,br,sw:Math.abs(sw),farbe});
    });
    legF.forEach((L,i)=>text(L.nm+': '+grad(L.br)+' N  –  '+(L.sw<0.3?'kein Schatten':'Schattenwinkel '+grad(L.sw)),
      12,16*K+i*20*K,L.farbe,{sz:13,fett:true,rand:'#fff'}));
    if(sichtbar){
      /* Höhe der Sonne als bemaßte Strecke */
      ctx.strokeStyle='#92400e'; ctx.lineWidth=1.3; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx,y0); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(sx-6,sy+9); ctx.lineTo(sx,sy); ctx.lineTo(sx+6,sy+9);
      ctx.moveTo(sx-6,y0-9); ctx.lineTo(sx,y0); ctx.lineTo(sx+6,y0-9); ctx.stroke();
      text('h ≈ '+zahl(fl.h,0)+' km',sx+10*K,(sy+y0)/2,'#92400e',{sz:14,fett:true,rand:'#fff'});
      const g=ctx.createRadialGradient(sx,sy,0,sx,sy,46); g.addColorStop(0,'rgba(250,204,21,.6)'); g.addColorStop(1,'rgba(250,204,21,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,46,0,7); ctx.fill();
      ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(sx,sy,13,0,7); ctx.fill();
      text('hier müsste die Sonne stehen',sx,sy-26*K,'#a16207',{al:'center',sz:13,fett:true,rand:'#fff'});
    } else if(isFinite(fl.h)&&fl.h>0){
      text('Die Sonne läge außerhalb des Bildes – die Orte liegen zu dicht beieinander.',W/2,HV*0.2,'#92400e',{al:'center',sz:13,fett:true});
    } else {
      text('Diese beiden Messungen passen im flachen Modell zu gar keiner Sonne.',W/2,HV*0.2,'#92400e',{al:'center',sz:13,fett:true});
    }
    text('Zum Vergleich: In Wirklichkeit steht die Sonne 149,6 Mio km hoch.',W/2,HV-10*K,'#94a3b8',{al:'center',sz:12});
  }
}

/* ============================================================
   Seite 3: Entfernung Erde–Mond aus der täglichen Parallaxe
   Vom Mondaufgang bis zum Mond im Zenit dreht sich die Erde fast eine
   Vierteldrehung weiter. Der Beobachter schaut dadurch von zwei Punkten
   aus, die einen Erdradius auseinanderliegen - vor den Sternen rückt der
   Mond dabei um den Winkel p. Im rechtwinkligen Dreieck Erdmitte –
   Beobachter beim Aufgang – Mond liegt R der Parallaxe gegenüber:
       sin p = R / d        also        d = R / sin p
   Der Erdradius kommt von Seite 2 (Eratosthenes), die Mondentfernung
   geht auf Seite 4 weiter (Aristarch). So hängt eine Stufe an der anderen.
   ============================================================ */
const MOND_WAHR=384400;
const R_ERDE=U_WAHR/(2*Math.PI);                 /* Erdradius aus dem gemessenen Umfang */
let mondU=0, mondId=0, mondLetzte=0;             /* Lauf der Erddrehung */
function mondSchritt(jetzt){
  const dt=Math.min(0.08,(jetzt-mondLetzte)/1000); mondLetzte=jetzt;
  mondU+=dt/7;                                   /* sieben Sekunden für die ganze Drehung */
  if(mondU>1.18) mondU=0;                        /* kurz stehen bleiben, dann von vorn */
  mondId=(D.mond.dreh&&D.tab==='mond')?requestAnimationFrame(mondSchritt):0;
  zeichne();
}
function mondDrehPruef(){
  if(D.mond.dreh&&D.tab==='mond'){
    if(!mondId){ mondLetzte=performance.now(); mondId=requestAnimationFrame(mondSchritt); }
  } else if(mondId){ cancelAnimationFrame(mondId); mondId=0; mondU=0; }
}
function zeichneMond(){
  const M=D.mond, p=M.par/100, sinP=Math.sin(p*RAD);
  const dM=R_ERDE/sinP, abw=(dM-MOND_WAHR)/MOND_WAHR*100;
  const dM2=R_ERDE/Math.sin((p+0.1)*RAD);
  const std=(90-p)/15;                           /* Stunden vom Aufgang bis zum Zenit */
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const hoch=infoHell([
    {t:'Erde–Mond = R / sin p = '+zahl(R_ERDE,0)+' km / sin '+grad(p,2)+' = '+zahl(dM,0)+' km'
      +'   ('+(abw>=0?'+':'−')+zahl(Math.abs(abw),1)+' % gegenüber 384 400 km)',f:'#1f2430',sz:16,fett:true},
    {t:'R = Erdradius aus dem Erdumfang · p = Parallaxe: So weit rückt der Mond vor den Sternen, wenn man von '
      +'der Erdmitte zum Beobachter geht · dazwischen dreht sich die Erde '+zahl(std,1)+' Stunden weit'},
    {t:'Schon 0,1° mehr ergäben '+zahl(dM2,0)+' km – ein Unterschied von '+zahl(Math.abs(dM-dM2),0)
      +' km. Die eigene Bewegung des Mondes (0,55° je Stunde) ist dabei herausgerechnet.'}
  ]);
  const HV=H-hoch;
  /* Schematisch wird p aufgeblasen: In Wahrheit liegt der Beobachter beim Aufgang fast
     auf der Linie zur Erdmitte, vom Dreieck wäre nichts zu sehen. */
  const pZ=M.mass?p:14;
  const ex=W*0.2, ey=HV*0.6, abst=W*0.58;
  const Rp=Math.max(abst*Math.sin(pZ*RAD),M.mass?2.5:10);
  const mx=ex+abst, my=ey;
  const dreh=(90-pZ)*RAD;
  const punkt=th=>[ex+Rp*Math.cos(th), ey-Rp*Math.sin(th)];
  const A=punkt(dreh), Z=punkt(0);
  /* --- Erde --- */
  ctx.fillStyle='#eff6ff'; ctx.strokeStyle='#2563eb'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(ex,ey,Rp,0,7); ctx.fill(); ctx.stroke();
  text('Erde',ex,ey+Rp+15*K,'#2563eb',{al:'center',sz:12.5,fett:true,rand:'#fff'});
  /* --- Horizontkuppel über dem Beobachter: Am Aufgang steht der Mond am Rand der
         Kuppel, im Zenit genau oben. --- */
  const kuppel=(th,alpha,farbe,zumMond)=>{
    const P=punkt(th), n=[Math.cos(th),-Math.sin(th)], tg=[-n[1],n[0]], r=Rp*0.45;
    ctx.save(); ctx.globalAlpha=alpha;
    if(r>8){
      ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(P[0]-tg[0]*r,P[1]-tg[1]*r); ctx.lineTo(P[0]+tg[0]*r,P[1]+tg[1]*r); ctx.stroke();
      const w0=Math.atan2(tg[1],tg[0]);
      /* grau statt blau: Die Kuppel gehört zum Beobachter, nicht zur Erdkugel */
      ctx.fillStyle='rgba(100,116,139,.16)'; ctx.strokeStyle='rgba(71,85,105,.75)'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.arc(P[0],P[1],r,w0,w0+Math.PI,true); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if(zumMond){ ctx.strokeStyle=farbe; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(P[0],P[1]); ctx.lineTo(mx,my); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(P[0],P[1],4.5,0,7); ctx.fill();
    ctx.restore();
    return P;
  };
  /* --- Strecken --- */
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.6; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(mx,my); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(A[0],A[1]); ctx.stroke();
  ctx.strokeStyle='#0f766e'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(mx,my); ctx.stroke();
  /* --- Mond --- */
  const rM=Math.max(9,Rp*0.1);
  ctx.fillStyle='#cbd5e1'; ctx.beginPath(); ctx.arc(mx,my,rM,0,7); ctx.fill();
  ctx.strokeStyle='#64748b'; ctx.lineWidth=1.1; ctx.stroke();
  text('Mond',mx,my-rM-12*K,'#334155',{al:'center',sz:12.5,fett:true,rand:'#fff'});
  /* --- die beiden Beobachtungen --- */
  kuppel(dreh,1,'#0f766e',false);
  kuppel(0,0.85,'#7c3aed',true);
  text('Mondaufgang',A[0]-10*K,A[1]-Rp*0.5-10*K,'#0f766e',{al:'center',sz:12.5,fett:true,rand:'#fff'});
  text('der Mond steht am Horizont',A[0]-10*K,A[1]-Rp*0.5+6*K,'#0f766e',{al:'center',sz:11.5,rand:'#fff'});
  text('Mond im Zenit',Z[0]+12*K,Z[1]-13*K,'#7c3aed',{al:'left',sz:12.5,fett:true,rand:'#fff'});
  /* --- Winkel --- */
  /* Der Winkel p am Mond - über die Differenz gerechnet, sonst zieht atan2 beim
     Übergang von +180° auf −180° den Bogen einmal um den ganzen Mond. */
  const wa=Math.atan2(A[1]-my,A[0]-mx);
  let dw=Math.atan2(ey-my,ex-mx)-wa;
  while(dw>Math.PI) dw-=2*Math.PI;
  while(dw<-Math.PI) dw+=2*Math.PI;
  pfeilBogen(mx,my,Math.max(44,abst*0.16),Math.min(wa,wa+dw),Math.max(wa,wa+dw),'#dc2626','p = '+grad(p,2));
  const n1=[(ex-A[0]),(ey-A[1])], l1=Math.hypot(n1[0],n1[1])||1;
  const n2=[(mx-A[0]),(my-A[1])], l2=Math.hypot(n2[0],n2[1])||1;
  if(Rp>14) rechterWinkel(A[0],A[1],[n1[0]/l1,n1[1]/l1],[n2[0]/l2,n2[1]/l2],12,'#dc2626');
  pfeilBogen(ex,ey,Rp*0.62,-dreh,0,'#2563eb','Erddrehung ≈ '+zahl(std,1)+' h');
  /* --- Beschriftung der Strecken --- */
  text('R = '+zahl(R_ERDE,0)+' km',(ex+A[0])/2-10*K,(ey+A[1])/2-6*K,'#2563eb',{al:'right',sz:12.5,fett:true,rand:'#fff'});
  text('d = '+zahl(dM,0)+' km',(ex+mx)/2,ey+20*K,'#64748b',{al:'center',sz:13,fett:true,rand:'#fff'});
  /* --- die laufende Erddrehung --- */
  if(M.dreh){
    const u=clamp(mondU,0,1), th=dreh*(1-u);
    kuppel(th,1,'#dc2626',true);
    const P=punkt(th);
    text('nach '+zahl(std*u,1)+' h',P[0]+Rp*0.1,P[1]-Rp*0.55-8*K,'#dc2626',{al:'center',sz:12.5,fett:true,rand:'#fff'});
  }
  text(M.mass?'maßstabsgetreu: Der Mond steht 60 Erdradien weit weg – p ist wirklich so klein.'
             :'schematisch – der Winkel p ist aufgeblasen, damit das Dreieck zu sehen ist (siehe „maßstabsgetreu“)',
    W/2,16*K,'#94a3b8',{al:'center',sz:12});
  /* --- zweites Fenster: der Blick vom Beobachter aus, wie der Mond aufgeht --- */
  const thJetzt=M.dreh?dreh*(1-clamp(mondU,0,1)):dreh;
  const B=punkt(thJetzt), nB=[Math.cos(thJetzt),-Math.sin(thJetzt)];
  const zum=[mx-B[0],my-B[1]], lz=Math.hypot(zum[0],zum[1])||1;
  const hoehe=Math.asin(clamp((zum[0]*nB[0]+zum[1]*nB[1])/lz,-1,1))*GRD;   /* Höhe über dem Horizont */
  const bw=Math.min(W*0.3,HV*0.5,300), bh=bw*0.64, bx=W-bw-12, by=22*K;
  ctx.save();
  ctx.beginPath(); ctx.rect(bx,by,bw,bh); ctx.clip();
  ctx.fillStyle='#070b18'; ctx.fillRect(bx,by,bw,bh);
  const zz=festerZufall(4711);
  for(let i=0;i<46;i++){ const sx2=bx+zz()*bw, sy2=by+zz()*bh*0.8, gr=0.6+zz()*1.3;
    ctx.fillStyle='rgba(255,255,255,'+(0.3+zz()*0.6).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(sx2,sy2,gr,0,7); ctx.fill(); }
  const hz=by+bh*0.8;                                     /* Horizont im Fenster */
  ctx.fillStyle='#111827'; ctx.fillRect(bx,hz,bw,by+bh-hz);
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(bx,hz+.5); ctx.lineTo(bx+bw,hz+.5); ctx.stroke();
  const bogen=(hh)=>{ const w=hh*RAD;
    return [bx+bw*0.5+Math.cos(w)*bw*0.40, hz-Math.sin(w)*(bh*0.70)]; };
  /* die Bahn, auf der der Mond heraufkommt */
  ctx.strokeStyle='rgba(148,163,184,.35)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  ctx.beginPath(); for(let i=0;i<=40;i++){ const q=bogen(i*90/40); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); } ctx.stroke(); ctx.setLineDash([]);
  const qm=bogen(Math.max(hoehe,0));
  ctx.fillStyle='#e2e8f0'; ctx.beginPath(); ctx.arc(qm[0],qm[1],9,0,7); ctx.fill();
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1; ctx.stroke();
  text('Mond',qm[0],qm[1]-16*K,'#e2e8f0',{al:'center',sz:11.5,fett:true,rand:'rgba(7,11,24,.85)'});
  ctx.fillStyle='rgba(7,11,24,.72)'; ctx.fillRect(bx+1,by+bh-19*K,bw-2,18*K);
  text('Mond '+zahl(Math.max(hoehe,0),0)+'° über dem Horizont',bx+7,by+bh-10*K,'#cbd5e1',{sz:11.5,fett:true});
  ctx.restore();
  ctx.strokeStyle='rgba(100,116,139,.6)'; ctx.lineWidth=1.4; ctx.strokeRect(bx+0.75,by+0.75,bw-1.5,bh-1.5);
}

/* ============================================================
   Seite 4: Entfernung Erde–Sonne nach Aristarch
   Bei genau halbem Mond ist der Winkel Erde–Mond–Sonne ein rechter.
   Misst man im selben Augenblick den Winkel ε zwischen Mond und Sonne
   am Himmel, folgt aus der Mondentfernung von Seite 3:
       Erde–Sonne = Erde–Mond / cos ε
   ============================================================ */
const AE_WAHR=149597870;
function zeichneSonneTab(){
  const P=D.sonne, eps=P.eps/100, cosE=Math.cos(eps*RAD), dS=MOND_WAHR/cosE;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const abw=(dS-AE_WAHR)/AE_WAHR*100;
  const dS2=MOND_WAHR/Math.cos((eps-0.1)*RAD);
  const hoch=infoHell([
    {t:'Erde–Sonne = Erde–Mond / cos ε = 384 400 km / cos '+grad(eps,2)+' = '+zahl(dS/1e6,1)+' Mio km'
      +'   ('+(abw>=0?'+':'−')+zahl(Math.abs(abw),0)+' % gegenüber 149,6 Mio km)',f:'#1f2430',sz:16,fett:true},
    {t:'ε = Winkel zwischen Mond und Sonne am Himmel, gemessen bei genau halbem Mond · cos ε = '+zahl(cosE,5)
      +' · die Sonne steht '+zahl(1/cosE,0)+'-mal weiter weg als der Mond'},
    {t:'Schon 0,1° weniger ergäben '+zahl(dS2/1e6,1)+' Mio km. Aristarch maß um −260 etwa 87° und schloss: '
      +'Sonne 19-mal weiter als der Mond. Die Methode ist richtig, seine Messung war zu ungenau.'}
  ]);
  const HV=H-hoch;
  const Ls=W*0.62, ex=W*0.15, ey=HV*0.78;
  const epsD=P.mass?eps:Math.acos(clamp(Math.pow(cosE,0.18),0.15,0.72))*GRD;
  const Lm=Ls*Math.cos(epsD*RAD);
  const dir=[Math.cos(epsD*RAD),-Math.sin(epsD*RAD)];
  const mx=ex+dir[0]*Lm, my=ey+dir[1]*Lm;
  const sx=ex+Ls, sy=ey;
  /* Strecken */
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.6;
  if(P.hilf){ ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(sx,sy); ctx.stroke(); ctx.setLineDash([]); }
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(mx,my); ctx.stroke();
  ctx.strokeStyle='#eab308'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(sx,sy); ctx.stroke();
  /* Sonne, Erde, Mond */
  const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,34); sg.addColorStop(0,'rgba(250,204,21,.65)'); sg.addColorStop(1,'rgba(250,204,21,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,34,0,7); ctx.fill();
  ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(sx,sy,13,0,7); ctx.fill();
  text('Sonne',sx,sy+28*K,'#a16207',{al:'center',sz:12.5,fett:true});
  ctx.fillStyle='#2563eb'; ctx.beginPath(); ctx.arc(ex,ey,10,0,7); ctx.fill();
  text('Erde',ex,ey+24*K,'#2563eb',{al:'center',sz:12.5,fett:true});
  /* Mond: genau halb beleuchtet, die helle Seite zeigt zur Sonne */
  const zs=Math.atan2(sy-my,sx-mx), rM=9;
  ctx.fillStyle='#64748b'; ctx.beginPath(); ctx.arc(mx,my,rM,0,7); ctx.fill();
  ctx.fillStyle='#e2e8f0'; ctx.beginPath(); ctx.arc(mx,my,rM,zs-Math.PI/2,zs+Math.PI/2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#475569'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(mx,my,rM,0,7); ctx.stroke();
  text('Mond (genau halb)',mx+(epsD>60?14*K:0),my-18*K,'#334155',{al:epsD>60?'left':'center',sz:12.5,fett:true,rand:'#fff'});
  if(P.hilf){
    pfeilBogen(ex,ey,Math.min(64,Lm*0.55),-epsD*RAD,0,'#dc2626','ε = '+grad(eps,2));
    const dE=[(ex-mx),(ey-my)], dS2v=[(sx-mx),(sy-my)];
    const n1=[dE[0]/Lm,dE[1]/Lm], l2=Math.hypot(dS2v[0],dS2v[1]), n2=[dS2v[0]/l2,dS2v[1]/l2];
    rechterWinkel(mx,my,n1,n2,13,'#dc2626');
    text('90°',mx+(n1[0]+n2[0])*26,my+(n1[1]+n2[1])*26,'#dc2626',{al:'center',sz:12,fett:true,rand:'#fff'});
    text('Erde–Sonne = '+zahl(dS/1e6,1)+' Mio km',(ex+sx)/2,ey+22*K,'#a16207',{al:'center',sz:12.5,fett:true,rand:'#fff'});
    text('384 400 km',(ex+mx)/2-12*K,(ey+my)/2,'#2563eb',{al:'right',sz:12.5,fett:true,rand:'#fff'});
  }
  text(P.mass?'maßstabsgetreu: Bei ε = '+grad(eps,2)+' liegt der Mond fast auf der Linie zur Sonne.'
            :'schematisch – der wahre Winkel ist fast ein rechter, siehe „maßstabsgetreu“',
    W/2,16*K,'#94a3b8',{al:'center',sz:12});
  /* So sieht der Halbmond von der Erde aus - das ist der Augenblick, auf den es ankommt. */
  const hx=W*0.16, hy=HV*0.3, hr=Math.min(34,HV*0.12);
  ctx.fillStyle='#475569'; ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fill();
  ctx.fillStyle='#f1f5f9'; ctx.beginPath(); ctx.arc(hx,hy,hr,-Math.PI/2,Math.PI/2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#334155'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.stroke();
  text('genau halber Mond:',hx,hy-hr-26*K,'#334155',{al:'center',sz:12.5,fett:true});
  text('dann ist der Winkel am Mond 90°',hx,hy-hr-10*K,'#64748b',{al:'center',sz:12});
}

/* ============================================================
   Seite 5: Entfernung naher Sterne aus der Parallaxe
   Die Erdbahn ist die Grundlinie: Im Lauf eines Jahres beschreibt
   ein naher Stern vor den fernen eine kleine Ellipse.
   ============================================================ */
const STERNE=[{n:'Proxima Centauri (nächster Stern)',d:424},{n:'Sirius',d:860},
  {n:'61 Cygni (Bessel 1838)',d:1140},{n:'Prokyon',d:1146},{n:'Wega',d:2500}];
let sternU=0, sternId=0, sternLetzte=0;          /* Lauf der Erde auf ihrer Bahn */
function sternSchritt(jetzt){
  const dt=Math.min(0.08,(jetzt-sternLetzte)/1000); sternLetzte=jetzt;
  sternU=(sternU+dt/9)%1;                         /* neun Sekunden für ein Jahr */
  sternId=(D.stern.lauf&&D.tab==='stern')?requestAnimationFrame(sternSchritt):0;
  zeichne();
}
function sternLaufPruef(){
  if(D.stern.lauf&&D.tab==='stern'){
    if(!sternId){ sternLetzte=performance.now(); sternId=requestAnimationFrame(sternSchritt); }
  } else if(sternId){ cancelAnimationFrame(sternId); sternId=0; }
}
const MONATE=['Januar','Februar','M\u00e4rz','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function zeichneStern(){
  const St=D.stern, dLj=St.d/100, dKm=dLj*LJ;
  const p=Math.atan(AE/dKm)*GRD*3600, pc=dLj*LJ/PC;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const hoch=infoHell([
    {t:'Parallaxe p = '+zahl(p,3)+'″   →   Entfernung d = 1 AE / tan p = '+zahl(dLj,2)+' Lichtjahre = '+zahl(pc,2)+' pc',
      f:'#1f2430',sz:16,fett:true},
    {t:'Bei p = 1″ ist ein Stern genau 1 Parsec weit (3,26 Lichtjahre). Die Entfernung ist umgekehrt proportional zum Winkel: d[pc] = 1 / p[″].'},
    {t:'Zum Vergleich: Der Vollmond ist 1 800″ breit – p ist rund '+zahl(1800/p,0)
      +'-mal kleiner. Deshalb gelang die erste Sternparallaxe erst 1838 (Bessel am 61 Cygni), 300 Jahre nach Kopernikus.'}
  ]);
  const HV=H-hoch;
  const sx=W*0.13, sy=HV*0.55, r0=Math.min(W*0.085,HV*0.27);
  /* Sonne und Erdbahn */
  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.ellipse(sx,sy,r0,r0*0.42,0,0,7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(sx,sy,9,0,7); ctx.fill();
  text('Sonne',sx,sy+16*K,'#a16207',{al:'center',sz:12,fett:true,rand:'#fff'});
  const e1=[sx-r0,sy], e2=[sx+r0,sy];
  const posten=[[e1,'Januar','#2563eb'],[e2,'Juli','#16a34a']];
  /* Stern rechts, die Linien mit einer Bruchstelle - und weiter bis zum fernen
     Hintergrund: Dort zeigt sich die Parallaxe als Abstand der beiden Treffpunkte. */
  const stx=W*0.53, sty=HV*0.3, xBg=W*0.70;
  const bgZ=festerZufall(915);
  ctx.strokeStyle='rgba(148,163,184,.5)'; ctx.lineWidth=1.2; ctx.setLineDash([4,5]);
  ctx.beginPath(); ctx.moveTo(xBg,HV*0.07); ctx.lineTo(xBg,HV*0.86); ctx.stroke(); ctx.setLineDash([]);
  for(let i=0;i<26;i++){ const yy=HV*0.07+bgZ()*HV*0.79, xx=xBg+(bgZ()-0.5)*14;
    ctx.fillStyle='rgba(100,116,139,'+(0.35+bgZ()*0.5).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(xx,yy,bgZ()*1.5+0.8,0,7); ctx.fill(); }
  text('ferne Sterne',xBg,HV*0.045,'#64748b',{al:'center',sz:12,fett:true});
  const bisBg=(e)=>{ const t=(xBg-e[0])/Math.max(stx-e[0],1e-6);
    return [xBg, e[1]+(sty-e[1])*t]; };
  posten.forEach(([e,nm,farbe])=>{
    ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(e[0],e[1],6,0,7); ctx.fill();
    text(nm,e[0],e[1]+18*K,farbe,{al:'center',sz:12,fett:true,rand:'#fff'});
    ctx.strokeStyle=farbe; ctx.lineWidth=1.5;
    const mx=(e[0]+stx)/2, my=(e[1]+sty)/2, dx=stx-e[0], dy=sty-e[1], l=Math.hypot(dx,dy);
    const nx=-dy/l, ny=dx/l;
    ctx.beginPath(); ctx.moveTo(e[0],e[1]);
    ctx.lineTo(mx-dx*0.04,my-dy*0.04);
    ctx.lineTo(mx-dx*0.02+nx*6,my-dy*0.02+ny*6);
    ctx.lineTo(mx+dx*0.02-nx*6,my+dy*0.02-ny*6);
    ctx.lineTo(mx+dx*0.04,my+dy*0.04);
    ctx.lineTo(stx,sty); ctx.stroke();
    /* über den Stern hinaus bis zum Hintergrund */
    const bg=bisBg(e);
    ctx.setLineDash([5,4]); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(stx,sty); ctx.lineTo(bg[0],bg[1]); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(bg[0]-6,bg[1]); ctx.lineTo(bg[0]+6,bg[1]); ctx.stroke();
    text(nm.slice(0,3),bg[0]+10*K,bg[1],farbe,{al:'left',sz:11.5,fett:true,rand:'#fff'});
  });
  /* die Erde läuft ihre Bahn ab - dann sieht man, woher die Jahresellipse kommt */
  if(St.lauf){
    const w=Math.PI+2*Math.PI*sternU;
    const ep=[sx+r0*Math.cos(w), sy+r0*0.42*Math.sin(w)];
    const bgL=bisBg(ep);
    ctx.strokeStyle='rgba(220,38,38,.8)'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(ep[0],ep[1]); ctx.lineTo(bgL[0],bgL[1]); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(bgL[0]-7,bgL[1]); ctx.lineTo(bgL[0]+7,bgL[1]); ctx.stroke();
    ctx.fillStyle='#dc2626'; ctx.beginPath(); ctx.arc(ep[0],ep[1],6.5,0,7); ctx.fill();
    text(MONATE[Math.floor(sternU*12)%12],ep[0],ep[1]-14*K,'#dc2626',{al:'center',sz:12,fett:true,rand:'#fff'});
  }
  ctx.fillStyle='#1f2430'; ctx.beginPath(); ctx.arc(stx,sty,7,0,7); ctx.fill();
  ctx.strokeStyle='#1f2430'; ctx.lineWidth=1.2;
  for(let i=0;i<4;i++){ const w=i*Math.PI/4;
    ctx.beginPath(); ctx.moveTo(stx-Math.cos(w)*13,sty-Math.sin(w)*13); ctx.lineTo(stx+Math.cos(w)*13,sty+Math.sin(w)*13); ctx.stroke(); }
  text('naher Stern',stx+18*K,sty,'#1f2430',{sz:12.5,fett:true});
  const wm=Math.atan2(e2[1]-sty,e2[0]-stx), w1=Math.atan2(e1[1]-sty,e1[0]-stx);
  pfeilBogen(stx,sty,42,Math.min(w1,wm),Math.max(w1,wm),'#dc2626','2p = '+zahl(2*p,3)+'″');
  text('Strecke stark verkürzt – der Stern ist '+zahl(dKm/AE/1e3,0)+' Tausend AE weit weg',W*0.36,HV-14*K,'#94a3b8',{al:'center',sz:12});
  /* Himmelsausschnitt: so sieht man den Stern wandern */
  const ix=W*0.845, iy=HV*0.46, ir=Math.min(W*0.13,HV*0.33);
  ctx.fillStyle='#0b1324'; ctx.beginPath(); ctx.arc(ix,iy,ir,0,7); ctx.fill();
  const z=festerZufall(77);
  for(let i=0;i<70;i++){ const w=z()*2*Math.PI, rr=Math.sqrt(z())*ir;
    ctx.fillStyle='rgba(255,255,255,'+(0.3+z()*0.6).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(ix+Math.cos(w)*rr,iy+Math.sin(w)*rr,z()*1.3+0.5,0,7); ctx.fill(); }
  const pxJeBs=St.lupe/100, aPx=p*pxJeBs;
  if(St.spur){ ctx.strokeStyle='rgba(248,250,252,.55)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.ellipse(ix,iy,Math.min(aPx,ir*0.9),Math.min(aPx*0.42,ir*0.9),0,0,7); ctx.stroke(); ctx.setLineDash([]); }
  [[-1,'#60a5fa','Jan'],[1,'#4ade80','Jul']].forEach(([s,farbe,nm])=>{
    const x=ix+s*Math.min(aPx,ir*0.9);
    ctx.strokeStyle=farbe; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(x-5,iy); ctx.lineTo(x+5,iy); ctx.moveTo(x,iy-5); ctx.lineTo(x,iy+5); ctx.stroke();
    text(nm,x,iy-13*K,farbe,{al:'center',sz:11,fett:true}); });
  if(St.lauf){
    const w=Math.PI+2*Math.PI*sternU, aa=Math.min(aPx,ir*0.9);
    const qx=ix+aa*Math.cos(w), qy=iy+aa*0.42*Math.sin(w);
    ctx.fillStyle='#fca5a5'; ctx.beginPath(); ctx.arc(qx,qy,4.5,0,7); ctx.fill();
    ctx.strokeStyle='#dc2626'; ctx.lineWidth=1.2; ctx.stroke();
  }
  text('1″ ≙ '+zahl(pxJeBs,0)+' Bildpunkte (Lupe)',ix,iy+ir+16*K,'#64748b',{al:'center',sz:12});
}

/* ============================================================
   Zeichnen und Laufen
   ============================================================ */
function zeichne(){
  if(!W||!H) return;
  ctx.save();
  if(D.tab==='system') zeichneSystem();
  else if(D.tab==='erat') zeichneErat();
  else if(D.tab==='mond') zeichneMond();
  else if(D.tab==='sonne') zeichneSonneTab();
  else zeichneStern();
  ctx.restore();
}
let letzte=0, laufId=0;
function schleife(jetzt){
  laufId=0;
  if(!(D.tab==='system'&&D.sys.lauf)) return;
  const dt=Math.min(0.1,(jetzt-letzte)/1000); letzte=jetzt;
  D.sys.t+=dt*tempoTage();
  zeichne();
  laufId=requestAnimationFrame(schleife);
}
function laufStart(){ if(laufId) return; letzte=performance.now(); laufId=requestAnimationFrame(schleife); }
function laufStopp(){ if(laufId) cancelAnimationFrame(laufId); laufId=0; }
function laufPruefen(){ if(D.tab==='system'&&D.sys.lauf) laufStart(); else laufStopp(); }

   ============================================================ */
/* Vom Körper aus: Der Ausschnitt soll zum Blickziel passen - der Mond füllt dann das Bild,
   Mars bleibt ein Punkt vor den Sternen. */
function fovPassend(){
  const S=D.sys; if(S.von==='aussen') return;
  if(S.von==='ort'){ S.fov=70; return; }                  /* am Boden sieht man den halben Himmel */
  const d=betrag(sub(ortZ(S.ziel,S.t),ortZ(S.von,S.t)));
  const w=2*Math.asin(clamp(radZ(S.ziel)/Math.max(d,1e-9),-1,1))*GRD;
  S.fov=w>0.1?clamp(w*8,0.3,40):25;
}
function tempoText(){
  const d0=tempoTage();
  if(d0===0) return 'angehalten';
  const vor=(d0<0?'−':''), d=Math.abs(d0);        /* Minuszeichen: die Zeit läuft rückwärts */
  if(D.sys.echt) return vor+'Echtzeit';
  if(d>=365) return vor+zahl(d/365.25,1)+' a/s';
  if(d>=1) return vor+zahl(d,d<10?1:0)+' d/s';
  if(d*24>=1) return vor+zahl(d*24,1)+' h/s';
  return vor+zahl(d*1440,0)+' min/s';
}
function setzeTab(t){
  D.tab=t;
  document.querySelectorAll('#tabs .tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('#bar2 .reihe').forEach(r=>{ r.hidden=r.dataset.tab!==t; });
  $('cvbox').classList.toggle('dunkel',t==='system');
  $('bar3').hidden=(t!=='system');                 /* die zweite Zeile gehört zum Sonnensystem */
  if(t!=='system'){ $('selPipZiel').hidden=true; pipStand=null; }
  $('hint').textContent=t!=='system' ? ''
    : (D.sys.von==='aussen'?'Ziehen = drehen · zwei Finger oder Mausrad = zoomen'
      :(D.sys.von==='ort'?'Ziehen = am Himmel umsehen · zwei Finger oder Mausrad = Ausschnitt'
        :'Ziehen = umsehen · zwei Finger oder Mausrad = Ausschnitt'));
  if(t==='system') listePruefen();
  laufPruefen(); mondDrehPruef(); sternLaufPruef(); oberflaeche(); zeichne();
}

function hilfeZeigen(){
  const h=HILFE[D.tab]||HILFE.system;
  $('hilfeTitel').textContent=h[0]; $('hilfeBody').innerHTML=h[1];
  $('hilfe').hidden=false;
}
$('bHilfe').onclick=()=>{ $('hilfe').hidden?hilfeZeigen():($('hilfe').hidden=true); };
$('hilfeZu').onclick=()=>{ $('hilfe').hidden=true; };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('hilfe').hidden=true; $('setts').open=false; } });

/* ---------- Knöpfe und Regler ---------- */
document.querySelectorAll('#tabs .tb').forEach(b=>b.onclick=()=>{ setzeTab(b.dataset.tab); sync(true); });
const an=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
an('bPlay',()=>{ D.sys.lauf=!D.sys.lauf; oberflaeche(); laufPruefen();
  if(!D.sys.lauf){ listePruefen(); sync(true); } });
an('bZurueck',()=>{ D.sys.t=0; zeichne(); listeFuellen(); sync(true); });
/* Ein Schritt ist so viel wie eine Sekunde Lauf - steht der Regler auf null, nimmt er
   die kleinste Stufe, damit die Knopfe nicht wirkungslos sind. */
const schritt=v=>{ D.sys.t+=v*Math.max(Math.abs(tempoTage()),0.001); zeichne(); sync(); };
an('bSchrittZ',()=>schritt(-1)); an('bSchrittV',()=>schritt(1));

  if(Math.abs(v)<=T_NULL){ v=0; e.target.value='0'; }        /* kleine Einrastung bei null */
