<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>

<script>
const $=id=>document.getElementById(id);
const toast=m=>window.TafelShot&&TafelShot.toast(m);

/* ---------- Zustand ---------- */
const STD={ tab:'k', kmod:'t', lmod:'s',
  d:60, b:10, lam:34, lamQ:12, lamL:12, quell:0, tempo:5, lauf:false, dauer:false, histo:true, sp:'b',
  feld:true, berge:false, taeler:false, imax:false, imin:false, pAn:false, zuege:false, gang:false, diag:false, mikro:false,
  mess:false, psi:true, strom:false, inten:6, sammeln:true, schirm:false,
  px:170, py:28, fontSize:14, edit:true };
let D=Object.assign({},STD);
let ready=false, geteiltesFenster=false;

/* Weltmaße in Zentimetern: der Doppelspalt sitzt bei x = 0, der Schirm bei x = 260.
   Schall mit 343 m/s – aus der Wellenlänge folgt die Tonhöhe (34 cm → 1000 Hz). */
/* Die Quelle steht weit links (QUELLX), damit die Teilchen die Spalte flach genug treffen
   und dahinter zwei saubere Streifen entstehen – zu sehen ist davon aber nur das letzte
   Stück ab XSTART: dort tauchen die Teilchen auf und fliegen auf die Blende zu. */
const WX0=-60, WX1=325, SCHIRM=260, QUELLX=-400, XSTART=-55, CSCHALL=34300;
let cvW=300, cvH=200, sc=1, oxp=0, oyp=0, dpr=1;
const cv=$('cv'), ctx=cv.getContext('2d');
const X=x=>oxp+x*sc, Y=y=>oyp-y*sc;
const xW=px=>(px-oxp)/sc, yW=py=>(oyp-py)/sc;
let yHalb=130;

const wx0=()=>WX0;
function mass(){
  const x0=wx0();
  sc=Math.min(cvW/(WX1-x0), cvH/260);
  oxp=(cvW-(WX1-x0)*sc)/2-x0*sc; oyp=cvH/2;
  yHalb=cvH/(2*sc); }

/* ---------- Quellen (Huygens) ----------
   Ein breiter Spalt ist kein Punkt: er wird in mehrere Elementarwellen zerlegt,
   damit sich die Verbreiterung durch die Spaltbreite von selbst ergibt. */
/* Quantenobjekte rechnen in Nanometern, Schall und Licht in Zentimetern – gerechnet wird
   mit denselben Zahlen, nur Einheit und Wellenlänge gehören zum Reiter. */
const EH=()=>D.tab==='q'?'nm':(D.tab==='l'?'µm':'cm');
const LAM=()=>D.tab==='q'?D.lamQ:(D.tab==='l'?D.lamL:D.lam);
/* Welches Modell wird gerade gerechnet? t = Teilchen, w = Welle, q = Quantenobjekt,
   s = Strahlen. Der Reiter Licht reicht die Modelle der beiden anderen Reiter durch. */
function art(){ if(D.tab==='k') return D.kmod==='t'?'t':'w';
  if(D.tab==='q') return 'q';
  return D.lmod==='p'?'t':D.lmod; }
const spAn=v=>D.sp==='b'||(D.sp==='o'&&v>0)||(D.sp==='u'&&v<0);
const beide=()=>D.sp==='b';
function quellen(nur){
  const n=Math.max(1,Math.min(4,Math.round(D.b/LAM()*3)+1)), aus=[];
  [1,-1].forEach(v=>{ if(nur!==undefined?v!==nur:!spAn(v)) return; const ym=v*D.d/2;
    for(let i=0;i<n;i++){ const t=n===1?0:(i/(n-1)-0.5);
      aus.push({x:0, y:ym+t*D.b, a:1/n}); } });
  return aus; }
/* Amplitude nur aus einem Spalt – daraus wird die Verteilung bei „mit Messung“ und
   bei nur einem offenen Spalt. */
function feldAn1(x,y,v){ const k=2*Math.PI/LAM(); let cr=0, ci=0;
  quellen(v).forEach(s=>{ const dx=x-s.x, dy=y-s.y, r=Math.hypot(dx,dy)||0.01;
    const a=s.a/Math.sqrt(r); cr+=a*Math.cos(k*r); ci+=a*Math.sin(k*r); });
  return Math.hypot(cr,ci); }
function feldAn(x,y){ const k=2*Math.PI/LAM(); let cr=0, ci=0;
  quellen().forEach(s=>{ const dx=x-s.x, dy=y-s.y, r=Math.hypot(dx,dy)||0.01;
    const a=s.a/Math.sqrt(r); cr+=a*Math.cos(k*r); ci+=a*Math.sin(k*r); });
  return {cr, ci, amp:Math.hypot(cr,ci)}; }
/* So laut wäre es, wenn sich alles, was gerade spielt, an dieser Stelle voll verstärkt */
function ampVoll(x,y){ let a=0;
  if(spAn(1)) a+=1/Math.sqrt(Math.hypot(x,y-D.d/2)||0.01);
  if(spAn(-1)) a+=1/Math.sqrt(Math.hypot(x,y+D.d/2)||0.01);
  return a||1e-6; }

/* ---------- Feldbild ---------- */
let GW=0, GH=0, Cr=null, Ci=null, Ink=null, img=null, off=null, octx=null, feldNorm=1, inkNorm=1, feldAlt='';
function feldSchluessel(){ return [D.d,D.b,LAM(),D.sp,GW,GH,Math.round(cvW),Math.round(cvH),wx0()].join('|'); }
function feldBauen(){
  GW=Math.max(60,Math.min(440,Math.round(cvW/2))); GH=Math.max(50,Math.min(330,Math.round(cvH/2)));
  const key=feldSchluessel(); if(key===feldAlt&&Cr) return; feldAlt=key;
  off=document.createElement('canvas'); off.width=GW; off.height=GH; octx=off.getContext('2d');
  img=octx.createImageData(GW,GH);
  Cr=new Float32Array(GW*GH); Ci=new Float32Array(GW*GH); Ink=new Float32Array(GW*GH);
  const k=2*Math.PI/LAM(), q=quellen(), qo=quellen(1), qu=quellen(-1);
  const teilAn=[spAn(1)?qo:[], spAn(-1)?qu:[]];
  let mx=0, mi=0;
  for(let j=0;j<GH;j++){
    const wy=yW((j+0.5)*cvH/GH);
    for(let i=0;i<GW;i++){
      const wx=xW((i+0.5)*cvW/GW), idx=j*GW+i;
      if(wx<1){ Cr[idx]=0; Ci[idx]=0; Ink[idx]=0; continue; }
      let cr=0, ci=0, ink=0;
      for(let t=0;t<2;t++){ const qt=teilAn[t]; if(!qt.length) continue;
        let ar=0, ai=0;
        for(let s=0;s<qt.length;s++){ const dx=wx-qt[s].x, dy=wy-qt[s].y;
          const r=Math.sqrt(dx*dx+dy*dy)||0.01, a=qt[s].a/Math.sqrt(r), ph=k*r;
          ar+=a*Math.cos(ph); ai+=a*Math.sin(ph); }
        cr+=ar; ci+=ai; ink+=ar*ar+ai*ai; }   /* ohne Interferenz zaehlen die Betraege einzeln */
      Cr[idx]=cr; Ci[idx]=ci; Ink[idx]=ink;
      /* Dicht an den Spalten wird die Amplitude beliebig groß (1/√r). Würde man danach
         normieren, bliebe das ganze Feld dahinter blass – deshalb zählt erst ab 40 cm. */
      if(wx>40){ const m=cr*cr+ci*ci; if(m>mx) mx=m; if(ink>mi) mi=ink; } } }
  feldNorm=1/Math.max(1e-6,Math.sqrt(mx)*0.62);
  inkNorm=1/Math.max(1e-9,mi*1.05); }
/* Farben wie in der Wellenwanne: Berg hell, Tal dunkelblau */
function inkMalen(){
  if(!img) return; const d=img.data;
  for(let i=0,j=0;i<GW*GH;i++,j+=4){
    const t=1-Math.min(1,Math.pow(Ink[i]*inkNorm,0.62));
    d[j]=Math.round(15+t*240); d[j+1]=Math.round(38+t*217); d[j+2]=Math.round(86+t*169); d[j+3]=255; }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.drawImage(off,0,0,cvW,cvH); }
/* Beim Schall sind Berge Verdichtungen und Täler Verdünnungen – deshalb dort rot und blau
   um Weiß herum. Das Ψ-Feld der Quantenobjekte bleibt in Blautönen. */
function feldMalen(ph,rotblau){
  if(!img) return; const d=img.data, c=Math.cos(ph), s=Math.sin(ph);
  for(let i=0,j=0;i<GW*GH;i++,j+=4){
    const v=(Ci[i]*c-Cr[i]*s)*feldNorm;
    if(v===0&&Cr[i]===0&&Ci[i]===0){ d[j]=255; d[j+1]=255; d[j+2]=255; d[j+3]=255; continue; }
    const av=Math.min(1,Math.abs(v)*1.1), w=Math.pow(av,0.65);
    if(rotblau){
      if(v>=0){ d[j]=Math.round(255-65*w); d[j+1]=Math.round(255-225*w); d[j+2]=Math.round(255-210*w); }
      else    { d[j]=Math.round(255-225*w); d[j+1]=Math.round(255-185*w); d[j+2]=Math.round(255-75*w); }
      d[j+3]=255; continue; }
    const t=0.5+0.5*Math.sign(v)*w;
    d[j]=Math.round(15+t*223); d[j+1]=Math.round(38+t*208); d[j+2]=Math.round(86+t*169); d[j+3]=255; }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.drawImage(off,0,0,cvW,cvH); }

/* ---------- Quantenobjekte ----------
   Wo ein Objekt auftrifft, entscheidet der Zufall – aber nach der Wahrscheinlichkeit
   |Ψ|² am Schirm. Ohne Messung zählt die Summe der beiden Amplituden (Interferenz),
   mit Messung die Summe der Betragsquadrate (zwei Streifen). */
const QN=241;
let vertAlt='', vertB=null, vertO=null, vertU=null;
function kumAus(fn){ const c=new Float64Array(QN+1);
  for(let i=0;i<QN;i++){ const y=(i/(QN-1)-0.5)*2*yHalb; c[i+1]=c[i]+Math.max(0,fn(y)); }
  const g=c[QN]||1; for(let i=0;i<=QN;i++) c[i]/=g; return c; }
function vertBauen(){
  const key=[D.d,D.b,LAM(),D.sp,Math.round(yHalb*10)].join('|');
  if(key===vertAlt&&vertB) return; vertAlt=key;
  vertB=kumAus(y=>{ const f=feldAn(SCHIRM,y); return f.amp*f.amp; });
  vertO=spAn(1)?kumAus(y=>{ const a=feldAn1(SCHIRM,y,1); return a*a; }):null;
  vertU=spAn(-1)?kumAus(y=>{ const a=feldAn1(SCHIRM,y,-1); return a*a; }):null; }
function zieheAus(c){ if(!c) return 0;
  const r=Math.random(); let lo=0, hi=QN;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(c[m]<=r) lo=m; else hi=m; }
  const sp=(c[lo+1]-c[lo])||1, t=(lo+(r-c[lo])/sp)/(QN-1);
  return (t-0.5)*2*yHalb; }
let qobj=[], qhisto=new Int32Array(121), qtreff=[], qAb=0, qAn=0, qstromT=0;
function qNeu(){ qobj=[]; qhisto=new Int32Array(qhisto.length); qtreff=[]; qAb=0; qAn=0; qstromT=0; qpunkte=[]; }
function qSchuss(){ qobj.push({ph:0, x:XSTART, y:0, ziel:0, sl:0, s:0, L:1}); qAb++; }
function qEntscheiden(o){
  vertBauen();
  if(D.mess&&spAn(1)&&spAn(-1)){ o.sl=Math.random()<0.5?1:-1;
    o.ziel=zieheAus(o.sl>0?vertO:vertU); }
  else if(D.mess){ o.sl=spAn(1)?1:-1; o.ziel=zieheAus(o.sl>0?vertO:vertU); }
  else { o.sl=0; o.ziel=zieheAus(vertB); }
  o.L=Math.hypot(SCHIRM-0,o.ziel-(o.sl?o.sl*D.d/2:0)); o.s=0; o.ph=1; }
function qTick(dt){
  const w=VTEIL*dt;
  for(let i=qobj.length-1;i>=0;i--){ const o=qobj[i];
    if(o.ph===0){ o.x+=w; if(o.x>=0) qEntscheiden(o); continue; }
    o.s+=w;
    if(o.s>=o.L){ qAn++;
      const k=Math.round((o.ziel/yHalb*0.5+0.5)*(qhisto.length-1));
      if(k>=0&&k<qhisto.length) qhisto[k]++;
      qtreff.push({y:o.ziel, t:0}); if(qtreff.length>60) qtreff.shift();
      punkteAuf(qpunkte,o.ziel);
      qobj.splice(i,1); } }
  qtreff.forEach(q=>{ q.t+=dt; });
  while(qtreff.length&&qtreff[0].t>1.6) qtreff.shift(); }
function qMalen(){
  ctx.save();
  qobj.forEach(o=>{
    if(o.ph===0){ ctx.fillStyle='#7e22ce'; ctx.beginPath(); ctx.arc(X(o.x),Y(0),3.6,0,7); ctx.fill(); return; }
    if(!o.sl) return;                       /* ohne Messung ist der Weg unbestimmt */
    const y0=o.sl*D.d/2, t=o.s/o.L;
    ctx.fillStyle='rgba(126,34,206,.85)';
    ctx.beginPath(); ctx.arc(X(0+(SCHIRM-0)*t),Y(y0+(o.ziel-y0)*t),3.6,0,7); ctx.fill(); });
  qtreff.forEach(q=>{ const a=Math.max(0,1-q.t/1.6);
    ctx.fillStyle='rgba(126,34,206,'+(0.25+0.75*a).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(X(SCHIRM),Y(q.y),2.6+3.4*a,0,7); ctx.fill(); });
  ctx.restore(); }

/* ---------- Teilchen ---------- */
let teil=[], histo=new Int32Array(61), getroffen=0, durch=0, abgefeuert=0, dauerT=0;
/* Die Quelle strahlt so breit, dass sie beide Spalte trifft – wer danebenfliegt, wird
   an der Wand geschluckt. Sonst käme bei weitem Spaltabstand nie ein Teilchen durch.
   Die Teilchen sind alle gleich schnell: wie schnell es aussieht, entscheidet allein das
   Tempo der Simulation – genau wie bei der Welle, deren Geschwindigkeit c = λ·f feststeht. */
const VTEIL=170;
function schuss(){
  const amax=Math.atan((D.d/2+D.b/2+14)/Math.abs(QUELLX));
  const a=(Math.random()*2-1)*amax;
  teil.push({x:XSTART, y:(XSTART-QUELLX)*Math.tan(a), vx:VTEIL*Math.cos(a), vy:VTEIL*Math.sin(a)});
  abgefeuert++; }
const tempoF=()=>D.tempo/5;
function teilSchritt(dt){
  const halb=D.b/2;
  for(let i=teil.length-1;i>=0;i--){ const p=teil[i];
    const x0=p.x; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(x0<0&&p.x>=0){
      const t=(0-x0)/(p.x-x0||1), ys=p.y-(p.vy*dt)*(1-t);
      const of1=Math.abs(ys-D.d/2), of2=Math.abs(ys+D.d/2);
      if(of1>halb&&of2>halb){ teil.splice(i,1); continue; }
      durch++; }
    if(Math.abs(p.y)>yHalb+10){ teil.splice(i,1); continue; }
    if(p.x>=SCHIRM){ getroffen++;
      const k=Math.round((p.y/yHalb*0.5+0.5)*(histo.length-1));
      if(k>=0&&k<histo.length) histo[k]++;
      punkteAuf(trefferP,p.y);
      teil.splice(i,1); } } }
/* Fuer die Ansicht des Schirms von vorn bekommt jeder Treffer eine zufaellige Querlage –
   quer zur Spaltrichtung ist ja nichts ausgezeichnet. */
let trefferP=[], qpunkte=[];
function punkteAuf(liste,y){ liste.push({y, z:Math.random()}); if(liste.length>4000) liste.shift(); }
function histoMalen(h,col){
  h=h||histo; let mx=1; for(let i=0;i<h.length;i++) if(h[i]>mx) mx=h[i];
  const breit=(WX1-SCHIRM-6)*sc, hb=cvH/h.length;
  ctx.save(); ctx.fillStyle=col||'#2563eb';
  for(let i=0;i<h.length;i++){ if(!h[i]) continue;
    const l=breit*h[i]/mx, py=Y((i/(h.length-1)-0.5)*2*yHalb);
    ctx.fillRect(X(SCHIRM)+3, py-hb*0.42, l, hb*0.84); }
  ctx.restore(); }

/* ---------- Linien und Punkt P ---------- */
function bogen(c,x0,y0,r){
  const a=Math.acos(Math.max(-1,Math.min(1,0)));
  c.beginPath(); c.arc(X(x0),Y(y0),r*sc,-Math.PI/2,Math.PI/2); c.stroke(); }
/* Wellenberge und Wellentäler lassen sich einzeln einblenden: Berge als durchgezogene,
   Täler als gestrichelte Kreislinien um jeden Spalt. */
function linienMalen(ph){
  /* Die Welle ist sin(k·r − ωt): ein Berg liegt bei k·r − ωt = π/2, also eine Viertel
     Wellenlänge hinter der wandernden Nullstelle. Ohne dieses λ/4 lägen die Linien genau
     auf der Grenze zwischen Verdichtung und Verdünnung (rot/blau). */
  const lam=LAM(), versch=lam*((ph/(2*Math.PI))%1)+lam/4;
  ctx.save(); ctx.lineWidth=2.2;
  [-1,1].forEach(v=>{ if(!spAn(v)) return; const ym=v*D.d/2;
    for(let n=0;n<60;n++){
      const rB=n*lam+versch, rT=rB+lam/2;
      if(rB*sc>cvW*1.6) break;
      if(D.berge&&rB>0){ ctx.strokeStyle='#7f1d1d'; ctx.setLineDash([]); bogen(ctx,0,ym,rB); }
      if(D.taeler&&rT>0){ ctx.strokeStyle='#1e3a8a'; ctx.setLineDash([4,4]); bogen(ctx,0,ym,rT); ctx.setLineDash([]); } } });
  ctx.restore(); }
/* Linien gleichen Gangunterschieds sind Hyperbeln mit den Spalten als Brennpunkten */
function hyperbel(a){
  const e=D.d/2; if(Math.abs(a)>=e) return;
  const b2=e*e-a*a;
  [-1,1].forEach(vz=>{ ctx.beginPath();
    for(let px=X(0);px<=cvW;px+=4){ const xx=xW(px); if(xx<0) continue;
      const yy=vz*a*Math.sqrt(1+xx*xx/b2);
      const py=Y(yy); if(px===X(0)) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
    ctx.stroke(); if(a===0) return; }); }
/* Maxima (Gangunterschied n·λ) und Minima ((n+½)·λ) lassen sich einzeln einblenden */
function intfMalen(){
  const nMax=Math.floor(D.d/LAM());
  ctx.save(); ctx.lineWidth=2;
  if(D.imax){ ctx.strokeStyle='#15803d';
    for(let n=-nMax;n<=nMax;n++) hyperbel(n*LAM()/2); }
  if(D.imin){ ctx.strokeStyle='#b91c1c'; ctx.setLineDash([7,5]);
    for(let n=-nMax-1;n<=nMax;n++) hyperbel((n+0.5)*LAM()/2);
    ctx.setLineDash([]); }
  ctx.restore(); }
/* Der Gangunterschied wird dort gezeigt, wo er entsteht: am Spalt.
   Der Kreisbogen um P durch den näheren Spalt schneidet den längeren Weg – das Stück
   zwischen Bogen und fernerem Spalt ist Δs und steht rot da. */
function gangMalen(){
  const r1=Math.hypot(D.px,D.py-D.d/2), r2=Math.hypot(D.px,D.py+D.d/2);
  const ds=Math.abs(r1-r2), nl=ds/LAM();
  const fern=r1>r2?[0,D.d/2]:[0,-D.d/2], nah=r1>r2?[0,-D.d/2]:[0,D.d/2], kurz=Math.min(r1,r2);
  ctx.save();
  const vx=D.px-fern[0], vy=D.py-fern[1], L=Math.hypot(vx,vy)||1;
  const sx=fern[0]+vx*(ds/L), sy=fern[1]+vy*(ds/L);      /* Schnittpunkt des Bogens */
  if(ds>0.01){
    ctx.setLineDash([5,4]); ctx.lineWidth=1.6; ctx.strokeStyle='#b91c1c';
    const a1=Math.atan2(-(nah[1]-D.py),nah[0]-D.px), a2=Math.atan2(-(sy-D.py),sx-D.px);
    /* immer den kurzen Weg herum – bei Winkeln um ±180° zieht min/max sonst einen Vollkreis */
    let dw=a2-a1; while(dw>Math.PI) dw-=2*Math.PI; while(dw<-Math.PI) dw+=2*Math.PI;
    ctx.beginPath(); ctx.arc(X(D.px),Y(D.py),kurz*sc,a1,a1+dw,dw<0); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth=5.5; ctx.strokeStyle='#dc2626';
    ctx.beginPath(); ctx.moveTo(X(fern[0]),Y(fern[1])); ctx.lineTo(X(sx),Y(sy)); ctx.stroke();
    ctx.fillStyle='#dc2626'; ctx.font='800 '+Math.max(12,fs())+'px sans-serif';
    ctx.textAlign='left'; ctx.textBaseline=fern[1]>0?'bottom':'top';
    ctx.fillText('Δs', X((fern[0]+sx)/2)+8, Y((fern[1]+sy)/2)+(fern[1]>0?-4:4)); }
  ctx.restore();
  const art=Math.abs(nl-Math.round(nl))<0.12?'Verstärkung':(Math.abs(nl-Math.round(nl)-0.5)<0.12||Math.abs(nl-Math.round(nl)+0.5)<0.12?'Auslöschung':'dazwischen');
  return 'Δs = '+zahl(ds)+' cm = '+zahl(nl)+' λ · '+art; }
function punktMalen(){
  const px=X(D.px), py=Y(D.py);
  ctx.save(); ctx.beginPath(); ctx.arc(px,py,7,0,7);
  ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=2.6; ctx.strokeStyle='#7e22ce'; ctx.stroke();
  ctx.fillStyle='#7e22ce'; ctx.font='800 '+Math.max(12,fs())+'px sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText('P',px+10,py-6);
  ctx.restore(); }
/* Zum Diagramm an P gehören die beiden Wellenzüge: entlang jedes Strahls vom Spalt zu P
   wird die Welle quer ausgelenkt gezeichnet. So ist zu sehen, wie viele Wellenlängen auf
   jeden Weg passen – und dass auf den längeren eine mehr (oder eine halbe mehr) geht. */
/* Die beiden Strahlen vom Spalt zu P – sie gehören zu den Wellenzügen wie zum Gangunterschied */
function strahlenMalen(){
  ctx.save(); ctx.lineWidth=2; ctx.strokeStyle='#ea580c';
  [1,-1].forEach(v=>{ if(!spAn(v)) return;
    ctx.beginPath(); ctx.moveTo(X(0),Y(v*D.d/2)); ctx.lineTo(X(D.px),Y(D.py)); ctx.stroke(); });
  ctx.restore(); }
function strahlWellen(ph){
  const k=2*Math.PI/LAM(), amp=Math.max(5,Math.min(12,fs()*0.62))/sc;
  ctx.save(); ctx.lineWidth=1.8; ctx.strokeStyle='rgba(100,116,139,.9)';
  [1,-1].forEach(v=>{ if(!spAn(v)) return;
    const sy=v*D.d/2, dx=D.px-0, dy=D.py-sy, r=Math.hypot(dx,dy)||1;
    const ux=dx/r, uy=dy/r, nx=-uy, ny=ux;
    const n=Math.max(40,Math.min(1200,Math.round(r*sc/2)));
    ctx.beginPath();
    for(let i=0;i<=n;i++){ const t=r*i/n, a=Math.sin(k*t-ph)*amp;
      const wx=ux*t+nx*a, wy=sy+uy*t+ny*a;
      if(i===0) ctx.moveTo(X(wx),Y(wy)); else ctx.lineTo(X(wx),Y(wy)); }
    ctx.stroke(); });
  ctx.restore(); }
function diagMalen(ph){
  const w=Math.max(120,fs()*9), h=Math.max(64,fs()*4.6);
  let x0=X(D.px)+16, y0=Y(D.py)-h-16;
  if(x0+w>cvW-6) x0=X(D.px)-w-16; if(x0<6) x0=6;
  if(y0<6) y0=Y(D.py)+16; if(y0+h>cvH-6) y0=cvH-h-6;
  const r1=Math.hypot(D.px,D.py-D.d/2), r2=Math.hypot(D.px,D.py+D.d/2);
  const k=2*Math.PI/LAM(), a1=1/Math.sqrt(r1||0.01), a2=1/Math.sqrt(r2||0.01);
  const mx=a1+a2;
  ctx.save(); ctx.fillStyle='rgba(255,255,255,.93)'; ctx.strokeStyle='#cfd6e0'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0+4,y0+h/2); ctx.lineTo(x0+w-4,y0+h/2); ctx.strokeStyle='#cbd5e1'; ctx.stroke();
  const kurve=(fn,col,br)=>{ ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=br;
    for(let i=0;i<=60;i++){ const t=i/60*2*Math.PI, u=fn(t);
      const xx=x0+4+(w-8)*i/60, yy=y0+h/2-u/mx*(h/2-5);
      if(i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
    ctx.stroke(); };
  kurve(t=>a1*Math.sin(k*r1-(ph+t)),'rgba(100,116,139,.75)',1.2);
  kurve(t=>a2*Math.sin(k*r2-(ph+t)),'rgba(100,116,139,.75)',1.2);
  kurve(t=>a1*Math.sin(k*r1-(ph+t))+a2*Math.sin(k*r2-(ph+t)),'#7e22ce',2.4);
  ctx.restore(); }

/* ---------- Aufbau zeichnen ---------- */
function aufbauMalen(){
  const dick=5*sc, xb=X(0);
  ctx.save(); ctx.fillStyle='#475569';
  const yo=Y(D.d/2+D.b/2), yu=Y(D.d/2-D.b/2), zo=Y(-D.d/2+D.b/2), zu=Y(-D.d/2-D.b/2);
  ctx.fillRect(xb-dick/2, 0, dick, yo);
  ctx.fillRect(xb-dick/2, yu, dick, zo-yu);
  ctx.fillRect(xb-dick/2, zu, dick, cvH-zu);
  /* Bei den Quantenobjekten wird ein Spalt wirklich zugemacht – das muss man sehen */
  if(D.tab!=='k'){ [1,-1].forEach(v=>{ if(spAn(v)) return;
    const a=Y(v*D.d/2+D.b/2), b2=Y(v*D.d/2-D.b/2);
    ctx.fillRect(xb-dick/2, a, dick, b2-a); }); }
  ctx.restore();
  ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(X(SCHIRM),0); ctx.lineTo(X(SCHIRM),cvH); ctx.stroke();
  ctx.setLineDash([3,6]); ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(SCHIRM),Y(0)); ctx.stroke();
  ctx.restore();
  /* Maßpfeil für den Spaltabstand */
  ctx.save(); ctx.strokeStyle='#64748b'; ctx.fillStyle='#64748b'; ctx.lineWidth=1.4;
  const xm=xb-14; ctx.beginPath(); ctx.moveTo(xm,Y(D.d/2)); ctx.lineTo(xm,Y(-D.d/2)); ctx.stroke();
  ctx.font='700 '+Math.max(11,fs()*0.85)+'px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText('d = '+D.d+' '+EH(), xm-4, Y(0));
  ctx.restore(); }
/* Beim Schall sitzt in jedem Spalt ein Lautsprecher – so ist zu sehen, woher die beiden
   Elementarwellen kommen. */
function lautsprecherMalen(){
  const h=Math.max(13,Math.min(26,D.b*sc*0.9)), t=h*0.45, xb=X(0);
  ctx.save(); ctx.lineWidth=1.6;
  [-1,1].forEach(v=>{ const yc=Y(v*D.d/2), an=spAn(v);
    ctx.strokeStyle=an?'#1f2430':'#b6bfcc'; ctx.fillStyle=an?'#e2e8f0':'#f6f8fb';
    ctx.beginPath();
    ctx.moveTo(xb-t-t, yc-h*0.30); ctx.lineTo(xb-t, yc-h*0.30);
    ctx.lineTo(xb+t*0.5, yc-h*0.62); ctx.lineTo(xb+t*0.5, yc+h*0.62);
    ctx.lineTo(xb-t, yc+h*0.30); ctx.lineTo(xb-t-t, yc+h*0.30); ctx.closePath();
    ctx.fill(); ctx.stroke(); });
  ctx.restore(); }
function teilchenMalen(){

/* Das Messgerät schaut, durch welchen Spalt das Objekt geht – und zerstört damit das
   Interferenzbild. Es sitzt als kleiner Kasten mit Auge an jedem offenen Spalt. */
function messMalen(){
  const h=Math.max(12,Math.min(24,D.b*sc*0.8)), xb=X(0);
  ctx.save();
  [1,-1].forEach(v=>{ if(!spAn(v)) return; const yc=Y(v*D.d/2);
    ctx.fillStyle='#fee2e2'; ctx.strokeStyle='#dc2626'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.rect(xb+h*0.35, yc-h*0.62, h*1.25, h*1.25); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(xb+h*0.97, yc, h*0.3, 0, 7); ctx.stroke(); });
  ctx.restore(); }
/* Der Schirm von vorn: quer zur Spaltrichtung ändert sich nichts, also werden die Streifen
   waagrecht – bei Teilchen und Quantenobjekten als einzelne Einschläge, bei der Welle als
   Helligkeit (dort ist es die Lautstärke). Die Höhe passt zur Seitenansicht daneben. */
function schirmMalen(){
  const w=Math.max(74,Math.min(190,cvW*0.19)), h=cvH*0.84;
  const x0=cvW-w-12, y0=(cvH-h)/2, yz=yy=>y0+h*(0.5-yy/(2*yHalb));
  ctx.save();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.clip();
  const a=art();
  if(a==='s'){
    const n=Math.max(40,Math.round(h/2));
    for(let i=0;i<n;i++){ const yy=(0.5-i/(n-1))*2*yHalb, v=Math.min(1,lichtHell(yy)/1);
      const t=1-v;
      ctx.fillStyle='rgb('+Math.round(24+t*231)+','+Math.round(24+t*231)+','+Math.round(27+t*228)+')';
      ctx.fillRect(x0, y0+h*i/n-0.5, w, h/n+1);
      if(v>0.01){ ctx.fillStyle='rgba(250,204,21,'+(0.9*v).toFixed(3)+')';
        ctx.fillRect(x0, y0+h*i/n-0.5, w, h/n+1); } }
  } else if(a==='w'){
    const n=Math.max(40,Math.round(h/2)); let mx=1e-9, I=[];
    for(let i=0;i<n;i++){ const yy=(0.5-i/(n-1))*2*yHalb, f=feldAn(SCHIRM,yy), v=f.amp*f.amp;
      I.push(v); if(v>mx) mx=v; }
    for(let i=0;i<n;i++){ const t=1-Math.min(1,Math.pow(I[i]/mx,0.6));
      ctx.fillStyle='rgb('+Math.round(15+t*240)+','+Math.round(38+t*217)+','+Math.round(86+t*169)+')';
      ctx.fillRect(x0, y0+h*i/n-0.5, w, h/n+1); }
  } else {
    const liste=a==='q'?qpunkte:trefferP, col=a==='q'?'rgba(126,34,206,.85)':'rgba(37,99,235,.85)';
    ctx.fillStyle=col;
    liste.forEach(q=>{ const py=yz(q.y); if(py<y0-2||py>y0+h+2) return;
      ctx.beginPath(); ctx.arc(x0+6+q.z*(w-12), py, 1.9, 0, 7); ctx.fill(); });
  }
  ctx.restore();
  ctx.fillStyle='#475569'; ctx.font='700 '+Math.max(11,fs()*0.85)+'px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText('Schirm von vorn', x0+w/2, y0-4);
  ctx.restore(); }
/* ---------- Strahlenmodell ----------
   Licht läuft geradeaus. Was durch die Spalte kommt, beleuchtet den Schirm, dazwischen
   bleibt es dunkel. Eine punktförmige Quelle wirft scharfe Schatten; je breiter die Quelle,
   desto breiter der Halbschatten – und ab einer gewissen Breite überlappen sich die beiden
   Lichtflecke. Alles rein geometrisch, von Beugung weiß dieses Modell nichts. */
const LQ=Math.abs(QUELLX), VERG=()=>(LQ+SCHIRM)/LQ;
function lichtBand(v){
  const m=VERG(), e1=v*D.d/2-D.b/2, e2=v*D.d/2+D.b/2, h=(D.quell/2)*(m-1);
  return {a:m*e1-h, b:m*e2+h, k1:m*e1+h, k2:m*e2-h, hw:Math.max(1e-6,D.quell*(m-1))}; }
function lichtHell(y){ let su=0;
  [1,-1].forEach(v=>{ if(!spAn(v)) return; const t=lichtBand(v);
    if(y<=t.a||y>=t.b) return;
    su+=D.quell<=0?1:Math.max(0,Math.min(1,Math.min((y-t.a)/t.hw,(t.b-y)/t.hw))); });
  return su; }
function strahlenMalen(){
  const m=VERG(), x0=wx0();
  ctx.save();
  [1,-1].forEach(v=>{ if(!spAn(v)) return;
    const e1=v*D.d/2-D.b/2, e2=v*D.d/2+D.b/2, t=lichtBand(v);
    const so=-D.quell/2, su=D.quell/2;                    /* Ränder der Quelle */
    const yOl=e2+(x0)*((e2-so)/LQ), yUl=e1+(x0)*((e1-su)/LQ);
    ctx.fillStyle='rgba(250,204,21,.28)';
    ctx.beginPath();
    ctx.moveTo(X(x0),Y(yOl)); ctx.lineTo(X(0),Y(e2)); ctx.lineTo(X(SCHIRM),Y(t.b));
    ctx.lineTo(X(SCHIRM),Y(t.a)); ctx.lineTo(X(0),Y(e1)); ctx.lineTo(X(x0),Y(yUl));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(202,138,4,.85)'; ctx.lineWidth=1.6;
    [[yOl,e2,t.b],[yUl,e1,t.a]].forEach(r=>{ ctx.beginPath();
      ctx.moveTo(X(x0),Y(r[0])); ctx.lineTo(X(0),Y(r[1])); ctx.lineTo(X(SCHIRM),Y(r[2])); ctx.stroke(); });
    /* der Lichtfleck auf dem Schirm: Kern voll, Halbschatten blasser */
    const xs=X(SCHIRM), br=Math.max(6,10*sc/2);
    ctx.fillStyle='rgba(250,204,21,.45)'; ctx.fillRect(xs-br/2, Y(t.b), br, Y(t.a)-Y(t.b));
    if(t.k2>t.k1){ ctx.fillStyle='rgba(234,179,8,.95)'; ctx.fillRect(xs-br/2, Y(t.k2), br, Y(t.k1)-Y(t.k2)); } });
  ctx.restore();
  if(!spAn(1)||!spAn(-1)) return 'ein Spalt offen · ein Lichtfleck';
  const o=lichtBand(1), u=lichtBand(-1);
  return 'Quelle '+D.quell+' µm · '+(o.a<u.b?'die beiden Lichtflecke überlappen sich'
    :'zwei getrennte Lichtflecke – dazwischen Schatten');
}

function malen(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cvW,cvH);
  let info=''; const a=art();
  if(a==='s'){
    aufbauMalen();
    info=strahlenMalen();
  } else if(a==='w'){
    if(D.feld) feldMalen(phase,true);
    if(D.berge||D.taeler) linienMalen(phase);
    if((D.imax||D.imin)&&beide()) intfMalen();
    aufbauMalen(); if(D.tab==='k') lautsprecherMalen();
    if(D.pAn){
      if(D.zuege||(D.gang&&beide())) strahlenMalen();
      if(D.gang&&beide()) info=gangMalen();
      if(D.zuege) strahlWellen(phase);
      punktMalen();
      if(D.diag) diagMalen(phase);
      const f=feldAn(D.px,D.py), rel=f.amp/Math.max(1e-6,ampVoll(D.px,D.py));
      info=(info?info+' · ':'')+'Lautstärke '+Math.round(rel*100)+' %';
    }
    if(!beide()) info=(info?info+' · ':'')+'nur eine Quelle – keine Interferenz';
    info=(info?info+' · ':'')+(D.tab==='k'
      ? 'λ = '+D.lam+' cm · f = '+Math.round(CSCHALL/D.lam)+' Hz'
      : 'λ = '+LAM()+' '+EH());
  } else if(a==='t'){
    aufbauMalen();
    if(D.histo&&!D.schirm) histoMalen();   /* das Fenster zeigt dasselbe besser */
    teilchenMalen();
    info='abgefeuert: '+abgefeuert+' · durch die Spalte: '+durch+' · am Schirm: '+getroffen;
  } else if(a==='q'){
    if(D.psi){ if(D.mess) inkMalen(); else feldMalen(phase); }
    aufbauMalen();
    if(D.mess) messMalen();
    if(D.sammeln&&!D.schirm) histoMalen(qhisto,'#7e22ce');
    qMalen();
    info='Objekte: '+qAb+' · am Schirm: '+qAn;
    info+=' · '+(D.mess?'mit Messung – der Weg ist bekannt: die Streifen verschwinden, übrig bleibt die Summe der beiden Einzelbilder'
      :(beide()?'ohne Messung – jedes Objekt trifft nach |Ψ|² ein'
               :'nur ein Spalt offen – kein Interferenzmuster'));
  }
  if(D.schirm) schirmMalen();
  $('hint').textContent=info; }

let ac=null, osc=null, gain=null;
function tonAn(){
  try{
    if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      ac=new AC(); osc=ac.createOscillator(); gain=ac.createGain();
      gain.gain.value=0; osc.type='sine'; osc.connect(gain); gain.connect(ac.destination); osc.start(); }
    if(ac.state==='suspended') ac.resume();
    return true;
  }catch(e){ return false; } }
function tonStellen(){
  if(!ac||!osc) return;
  const an=D.mikro&&D.pAn&&D.tab==='k'&&D.kmod==='w';
  const f=feldAn(D.px,D.py), rel=an?f.amp/Math.max(1e-6,ampVoll(D.px,D.py)):0;
  osc.frequency.setTargetAtTime(CSCHALL/D.lam, ac.currentTime, 0.04);
  gain.gain.setTargetAtTime(an?0.25*rel:0, ac.currentTime, 0.05); }
function tonAus(){ if(gain&&ac) gain.gain.setTargetAtTime(0, ac.currentTime, 0.03); }

/* ---------- Schleife ---------- */
let letztT=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-letztT)/1000||0); letztT=ts;
  if(D.lauf){
    const st=dt*tempoF(), a=art();
    if(a==='q'){
      qTick(st); phase+=st*2*Math.PI*0.45; if(phase>1e6) phase=0;
      if(D.strom){ qstromT+=st; const ab=1/(D.inten*0.9);
        while(qstromT>ab){ qstromT-=ab; qSchuss(); } }
    } else if(a==='t'){
      teilSchritt(st);
      if(D.dauer){ dauerT+=st; const ab=1/(D.inten*0.9);
        while(dauerT>ab){ dauerT-=ab; schuss(); } }
    } else { phase+=st*2*Math.PI*0.45; if(phase>1e6) phase=0; }
  }
  tonStellen();
  malen();
  requestAnimationFrame(loop); }

  if(zieht==='p'){
    D.px=Math.max(4,Math.min(SCHIRM-2,xW(e.clientX-r.left)));
    D.py=Math.max(-yHalb+4,Math.min(yHalb-4,yW(e.clientY-r.top)));
  } else {
    const neu=Math.round(2*Math.abs(yW(e.clientY-r.top)));
    const w=Math.max(20,Math.min(150,neu));
    if(w!==D.d){ D.d=w; feldAlt=''; feldBauen(); vertAlt=''; knoepfe(); } }
  e.preventDefault(); },{passive:false});
addEventListener('pointerup',()=>{ if(zieht){ zieht=''; sync(); } });

/* ---------- Tafel und Teilen ---------- */
let syncTO=null;
function sync(){ if(window.parent===window) return;
  clearTimeout(syncTO); syncTO=setTimeout(()=>{
    try{ parent.postMessage({type:'embed-data',data:zustand()},'*'); }catch(e){} },250); }
function zustand(){ return D; }
function uebernimm(d){ if(!d) return;
  const s=STD;
  D.tab=['k','q','l'].includes(d.tab)?d.tab:s.tab;
  D.kmod=d.kmod==='w'?'w':'t'; D.lmod=['s','w','p','q'].includes(d.lmod)?d.lmod:'s';
  D.sp=['b','o','u'].includes(d.sp)?d.sp:'b';
  D.d=Math.max(20,Math.min(150,+d.d||s.d));
  D.b=Math.max(2,Math.min(60,+d.b||s.b));
  D.lam=Math.max(10,Math.min(100,+d.lam||s.lam));
  D.lamQ=Math.max(4,Math.min(40,+d.lamQ||s.lamQ));
  D.lamL=Math.max(2,Math.min(40,+d.lamL||s.lamL));
  D.quell=Math.max(0,Math.min(200,+d.quell||0));
  D.tempo=Math.max(1,Math.min(10,+d.tempo||s.tempo));
  ['lauf','dauer','histo','feld','berge','taeler','imax','imin','pAn','zuege','gang','diag',
   'mess','psi','strom','sammeln','schirm'].forEach(k=>{ D[k]=!!d[k]; });
  D.inten=Math.max(1,Math.min(20,+d.inten||6));
  D.mikro=false;                                  /* Ton nie ungefragt einschalten */
  D.px=isFinite(+d.px)?+d.px:s.px; D.py=isFinite(+d.py)?+d.py:s.py;
  D.fontSize=Math.max(10,Math.min(22,+d.fontSize||s.fontSize));
  D.edit=d.edit!==false;
  document.documentElement.style.setProperty('--fs',D.fontSize+'px');
  neuStart(); knoepfe(); resize(); }
function bild(){ if(!window.TafelShot) return null;
  return TafelShot.rasterize($('cvbox'),{scale:2,bg:'#fff',exclude:'#hilfe,#hint'}); }
addEventListener('message',e=>{
  if(e.source!==window&&(window.parent===window||e.source!==window.parent)) return;
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return;
  uebernimm(e.data.data); ready=true;
  if(window.TafelModus) TafelModus.refresh(); });
if(window.TafelTeilen&&!TafelTeilen.istGeteilt())
  TafelTeilen.knopf($('barR'),'doppelspalt.html',()=>({w:'dspalt', d:zustand()}),{cls:'btn'});
addEventListener('resize',resize);

window.addEventListener('load',()=>{
  const geteilt=window.TafelTeilen&&TafelTeilen.istGeteilt();
  geteiltesFenster=!!geteilt;
  if(window.TafelModus&&!geteilt){
    TafelModus.init({get:()=>D.edit!==false, set:v=>{ D.edit=v; resize(); sync(); }});
    $('bar').style.paddingRight='108px';   /* Platz für den schwebenden Knopf Benutzen/Bearbeiten */ }
  document.documentElement.style.setProperty('--fs',(D.fontSize||14)+'px');
  if(window.TafelShot) TafelShot.buttons($('shotBtns'),bild,'btn');
  knoepfe(); resize();
  requestAnimationFrame(ts=>{ letztT=ts; loop(ts); });
  if(window.ResizeObserver) new ResizeObserver(resize).observe($('cvbox'));
  if(geteilt){ TafelTeilen.nurBenutzen(); D.edit=false; ready=true;
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='dspalt'&&p.d) TafelTeilen.einspielen(p.d); }).catch(()=>{});
    return; }
  if(window.parent===window){ ready=true; return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  setTimeout(()=>{ ready=true; },700); });
</script>
