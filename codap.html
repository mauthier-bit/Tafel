<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CODAP</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;}
#codap{position:absolute;inset:0;width:100%;height:100%;border:0;}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a93a2;font-family:-apple-system,sans-serif;font-size:14px;text-align:center;padding:20px;}</style>
</head>
<body>
<div id="hint">CODAP wird geladen … (benötigt Internet)</div>
<iframe id="codap" title="CODAP" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
"use strict";
// CODAP v3 (Concord Consortium, Open Source) – Statistik-Werkzeug zum Erkunden von Daten.
// Läuft auf codap3.concord.org; ohne Internet bleibt nur der Hinweis stehen.
var CODAP='https://codap3.concord.org/?lang=de&hideSplashScreen=yes';
if(navigator.onLine===false){
  document.getElementById('hint').textContent='CODAP konnte nicht geladen werden (kein Internet?).';
  document.getElementById('codap').style.display='none';
} else {
  document.getElementById('codap').src=CODAP;
}
</script>
</body>
</html>
