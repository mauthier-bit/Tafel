<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zufall</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;}
  #wrap{height:100%;display:flex;flex-direction:column;}
  /* ---- Reiter ---- */
  #tabs{display:flex;gap:4px;padding:6px 8px 0;flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;font:700 13px inherit;padding:7px 11px;border:none;border-radius:11px 11px 0 0;background:#eef2f7;color:#53617a;cursor:pointer;white-space:nowrap;}
  .tab.on{background:#3b82f6;color:#fff;}
  .panel{display:none;flex:1;min-height:0;flex-direction:column;padding:8px;gap:7px;}
  .panel.on{display:flex;}
  /* ---- Bedienzeile ---- */
  .ctrl{display:flex;gap:9px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;font-size:13px;flex:none;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  .ctrl>*{flex:0 0 auto;}
  .ctrl::-webkit-scrollbar{height:4px;} .ctrl::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  .ctrl label{display:flex;gap:4px;align-items:center;white-space:nowrap;}
  select{font-size:14px;padding:3px 5px;border:1px solid #cfd6e0;border-radius:8px;font-family:inherit;background:#fff;}
  .step{width:25px;height:25px;border:1px solid #cfd6e0;background:#f8fafc;border-radius:8px;font:700 15px inherit;cursor:pointer;color:#334155;padding:0;}
  .val{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;}
  .sw{border:1px solid #cfd6e0;background:#f8fafc;border-radius:999px;padding:5px 11px;font:700 12px inherit;cursor:pointer;color:#334155;white-space:nowrap;}
  .sw.on{background:#3b82f6;border-color:#3b82f6;color:#fff;}
  .go{font:800 16px inherit;padding:10px;border:none;border-radius:13px;background:#3b82f6;color:#fff;cursor:pointer;flex:none;}
  .go.ghost{background:#eef2f7;color:#334155;}
  .go:disabled{opacity:.45;cursor:default;}
  .zeile{display:flex;gap:7px;flex:none;}
  .info{text-align:center;font-size:15px;color:#334155;min-height:20px;font-weight:700;}
  /* ---- Münze ---- */
  .ctrl input[type=number]{width:62px;padding:3px 5px;border:1px solid #cfd6e0;border-radius:8px;font:600 14px inherit;text-align:center;
    -webkit-user-select:text;user-select:text;}
  #mWv{width:54px;font-weight:800;}
  #mBox{flex:1 1 auto;min-height:0;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;align-content:center;overflow:auto;}
  .muenze{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;
    box-shadow:inset 0 -3px 7px rgba(0,0,0,.2), 0 1px 3px rgba(0,0,0,.18);animation:plop .25s ease;}
  .muenze.k{background:linear-gradient(145deg,#fde68a,#f59e0b);color:#7c2d12;border:2px solid #d97706;}
  .muenze.z{background:linear-gradient(145deg,#f1f5f9,#cbd5e1);color:#475569;border:2px solid #94a3b8;}
  /* ---- Würfel ---- */
  #wBox{flex:1;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;min-height:0;}
  .die{background:#fff;border:2px solid #1f2430;border-radius:14%;box-shadow:0 2px 6px rgba(0,0,0,.12);display:grid;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7%;flex:none;cursor:pointer;transition:background .12s ease;}
  .die.num{display:flex;align-items:center;justify-content:center;font-weight:800;}
  .die>span{display:flex;align-items:center;justify-content:center;}
  .pip{width:82%;aspect-ratio:1;border-radius:50%;background:#1f2430;}
  /* ---- Glücksrad ---- */
  #rCv{flex:1;min-height:0;width:100%;}
  #rRes{text-align:center;font-size:18px;font-weight:800;min-height:24px;color:#2563eb;}
  /* ---- Urne & Verteilen ---- */
  .buehne{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:7px;}
  .kasten{border:1.5px solid #dbe2ea;border-radius:12px;padding:7px 8px 8px;background:#fbfcfe;}
  .kasten>h4{margin:0 0 5px;font:800 11px inherit;letter-spacing:.05em;text-transform:uppercase;color:#93a0b4;}
  .reihe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .kugel{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;cursor:pointer;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.18);transition:opacity .25s ease,transform .25s ease;}
  .kugel.weg{opacity:.16;transform:scale(.82);}
  .platz{border:2px dashed #c3cbd6;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
    color:#aab3c0;font-weight:800;position:relative;}
  .platz .kugel{cursor:default;animation:plop .28s ease;}
  @keyframes plop{from{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}to{transform:scale(1);opacity:1}}
  .platznr{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 10px inherit;color:#93a0b4;}
  .rech{flex:0 1 auto;min-height:0;max-height:46%;overflow:auto;display:none;background:#f4f7fb;border:1px solid #e2e8f0;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.5;}
  .rech.on{display:block;}
  .rech b{color:#1d4ed8;}
  .rech .gross{font-size:16px;font-weight:800;}
  .rech .perm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;}
  .rech .permz{display:flex;gap:3px;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:2px 5px;}
  .mini{width:15px;height:15px;border-radius:50%;flex:none;}
  .hinweis{color:#64748b;}
  /* ---- Ziehen & Verteilen ---- */
  .person{border-radius:50% 50% 45% 45%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.18);transition:opacity .25s ease;}
  .person.weg{opacity:.18;}
  .stuhl{border:2px solid #c3cbd6;border-bottom-width:4px;border-radius:5px 5px 9px 9px;display:flex;align-items:center;justify-content:center;
    flex:none;color:#aab3c0;font-weight:800;background:#fff;position:relative;}
  .stuhl.voll{border-color:#3b82f6;background:#eff6ff;}
  .stuhl .person{animation:plop .28s ease;}
  #vSicht{font-size:13px;font-weight:700;color:#334155;flex:none;}
  #vProd{font-size:15px;font-weight:800;color:#1d4ed8;min-height:20px;flex:none;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div id="wrap">
  <div id="tabs">
    <button class="tab" data-t="muenze">Münze</button>
    <button class="tab on" data-t="wuerfel">Würfel</button>
    <button class="tab" data-t="rad">Glücksrad</button>
    <button class="tab" data-t="urne">Urne</button>
    <button class="tab" data-t="vert">Ziehen &amp; Verteilen</button>
  </div>

  <!-- ================= Münze ================= -->
  <div class="panel" id="p-muenze">
    <div class="ctrl">
      <label>Würfe <button class="step" id="mWm">−</button><input id="mWv" type="number" min="1" max="100" value="1" title="Anzahl der Würfe – auch direkt eintippbar"><button class="step" id="mWp">+</button></label>
      <button class="sw" id="mFair" title="Faire Münze oder gezinkt?">faire Münze · p = 0,5</button>
      <label id="mPWrap" style="display:none">p(Kopf) <input id="mPz" type="number" min="0.01" max="0.99" step="0.05" value="0.7"></label>
      <button class="sw" id="mReset" title="Die Gesamtzählung wieder auf null setzen">↺ Zählung</button>
    </div>
    <div class="buehne" id="mBox"></div>
    <div id="mErg" class="info"></div>
    <div id="mGes" class="info" style="font-size:13px;color:#64748b"></div>
    <button class="go" id="mGo">🪙 Werfen</button>
  </div>

  <!-- ================= Würfel ================= -->
  <div class="panel on" id="p-wuerfel">
    <div class="ctrl">
      <label>Anzahl <select id="wN"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
      <label>Seiten <select id="wS"><option>2</option><option>4</option><option selected>6</option><option>8</option><option>10</option><option>12</option><option>20</option></select></label>
    </div>
    <div id="wBox"></div>
    <div id="wSum" class="info"></div>
    <button class="go" id="wRoll">🎲 Würfeln</button>
  </div>

  <!-- ================= Glücksrad ================= -->
  <div class="panel" id="p-rad">
    <canvas id="rCv"></canvas>
    <div id="rRes">–</div>
    <button class="go" id="rSpin">🎡 Drehen</button>
  </div>

  <!-- ================= Urne ================= -->
  <div class="panel" id="p-urne">
    <div class="ctrl">
      <label>Kugeln <button class="step" id="uNm">−</button><span class="val" id="uNv">6</span><button class="step" id="uNp">+</button></label>
      <label>Züge <button class="step" id="uZm">−</button><span class="val" id="uZv">2</span><button class="step" id="uZp">+</button></label>
      <button class="sw" id="uBack" title="Wird die gezogene Kugel zurückgelegt?">ohne Zurücklegen</button>
      <button class="sw" id="uOrd" title="Zählt die Reihenfolge der gezogenen Kugeln?">Reihenfolge zählt</button>
      <button class="sw" id="uNum" title="Kugeln nummerieren">Nummern</button>
      <button class="sw" id="uFarb" title="Farben der Kugeln (einzelne Kugel antippen geht auch)">🎨 Farben</button>
      <button class="sw" id="uRechSw" title="Anzahl der möglichen Ziehungen zeigen">Rechnung</button>
    </div>
    <div class="buehne">
      <div class="kasten"><h4>Urne</h4><div class="reihe" id="uUrne"></div></div>
      <div class="kasten"><h4 id="uPlTitel">Plätze</h4><div class="reihe" id="uPlaetze" style="gap:12px 10px;padding-bottom:14px"></div></div>
      <div id="uErg" class="info"></div>
    </div>
    <div class="rech" id="uRech"></div>
    <div class="zeile">
      <button class="go" id="uGo" style="flex:1">Ziehen</button>
      <button class="go ghost" id="uReset" title="Alle Kugeln zurück in die Urne">↺</button>
    </div>
  </div>

  <!-- ================= Ziehen und Verteilen ================= -->
  <div class="panel" id="p-vert">
    <div class="ctrl">
      <label>Schüler <button class="step" id="vAm">−</button><span class="val" id="vAv">9</span><button class="step" id="vAp">+</button></label>
      <label>Stühle <button class="step" id="vBm">−</button><span class="val" id="vBv">5</span><button class="step" id="vBp">+</button></label>
      <button class="sw" id="vSwap" title="Schüler und Stühle vertauschen – die Rechnung bleibt dieselbe">⇄ Rollen tauschen</button>
      <button class="sw" id="vRechSw">Rechnung</button>
    </div>
    <div id="vSicht"></div>
    <div class="buehne">
      <div class="kasten"><h4 id="vSTitel">Schüler</h4><div class="reihe" id="vSchueler"></div></div>
      <div class="kasten"><h4 id="vTTitel">Stühle</h4><div class="reihe" id="vStuehle"></div></div>
    </div>
    <div id="vProd"></div>
    <div class="rech" id="vRech"></div>
    <div class="zeile">
      <button class="go" id="vGo" style="flex:1">▶ Ein Platz</button>
      <button class="go ghost" id="vAll" title="Alle Plätze auf einmal">▶▶</button>
      <button class="go ghost" id="vReset">↺</button>
    </div>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const ZAHL=n=>Number(n).toLocaleString('de-DE');
const fak=n=>{ let f=1; for(let i=2;i<=n;i++)f*=i; return f; };

/* Alle vier Reiter teilen sich einen Datensatz. Würfel- und Glücksradfelder liegen
   bewusst ganz oben: so lesen sich auch Tafelobjekte, die noch mit den alten
   Einzelwerkzeugen „Würfel“ und „Glücksrad“ angelegt wurden, ohne Umbau. */
let data={ tab:'wuerfel',
  muenze:{ anzahl:1, gezinkt:false, p:0.7, gesamtK:0, gesamtN:0 },
  n:1, sides:6, colors:[0],
  sectors:[],
  urne:{ anzahl:6, zuege:2, zurueck:false, ordnung:true, nummern:true, schema:1, farben:[] },
  vert:{ a:9, b:5 } };

/* ============================ Münze ============================ */
const M=()=>data.muenze;
let mWurf=[];                                   // zuletzt geworfen: 1 = Kopf, 0 = Zahl
function mPruefen(){ const m=M();
  m.anzahl=Math.max(1,Math.min(100,m.anzahl|0||1));
  m.p=Math.max(0.01,Math.min(0.99,+m.p||0.5));
  m.gesamtK=Math.max(0,m.gesamtK|0); m.gesamtN=Math.max(0,m.gesamtN|0); }
const pKopf=()=>M().gezinkt?M().p:0.5;
function mGroesse(n){ const b=$('mBox'), w=b.clientWidth||280, h=b.clientHeight||160;
  const sp=Math.max(1,Math.floor(Math.sqrt(n*w/Math.max(h,1))));
  const z=Math.ceil(n/sp);
  return Math.max(24,Math.min(90,Math.floor(Math.min((w-7*(sp+1))/sp,(h-7*(z+1))/z)))); }
function mRender(){ mPruefen(); const m=M();
  if(document.activeElement!==$('mWv')) $('mWv').value=m.anzahl;   // beim Tippen nicht dazwischenfunken
  $('mFair').classList.toggle('on',m.gezinkt);
  $('mFair').textContent=m.gezinkt?('gezinkt · p = '+String(m.p).replace('.',',')):'faire Münze · p = 0,5';
  $('mPWrap').style.display=m.gezinkt?'flex':'none'; $('mPz').value=m.p;
  const box=$('mBox'); box.innerHTML='';
  const wurf=mWurf.length?mWurf:new Array(m.anzahl).fill(null);
  const gr=mGroesse(wurf.length);
  wurf.forEach(v=>{ const d=document.createElement('div');
    d.className='muenze '+(v===1?'k':(v===0?'z':'z'));
    d.style.width=d.style.height=gr+'px'; d.style.fontSize=Math.max(11,gr*0.46)+'px';
    if(v===null){ d.style.opacity='.35'; d.textContent='?'; } else d.textContent=v?'K':'Z';
    box.appendChild(d); });
  if(mWurf.length){ const k=mWurf.filter(v=>v).length, n=mWurf.length;
    $('mErg').textContent='Kopf: '+k+' · Zahl: '+(n-k)+(n>1?('  ('+(Math.round(k/n*1000)/10).toString().replace('.',',')+' % Kopf)'):''); }
  else $('mErg').textContent='';
  $('mGes').textContent=m.gesamtN?('Insgesamt '+m.gesamtN+' Würfe · '+m.gesamtK+' Kopf ('+
    (Math.round(m.gesamtK/m.gesamtN*1000)/10).toString().replace('.',',')+' %)'):'';
  $('mGo').textContent=(M().anzahl>1?'🪙 '+M().anzahl+'× werfen':'🪙 Werfen'); }
let mLaeuft=false;
function mWerfen(){ if(mLaeuft)return; const m=M(); mLaeuft=true; const p=pKopf(); let t=0;
  const iv=setInterval(()=>{
    mWurf=Array.from({length:m.anzahl},()=>Math.random()<p?1:0);
    mRender();
    if(++t>=9){ clearInterval(iv); mLaeuft=false;
      m.gesamtN+=mWurf.length; m.gesamtK+=mWurf.filter(v=>v).length; mRender(); sync(); } },60); }
$('mWm').onclick=()=>{ M().anzahl--; mWurf=[]; mRender(); sync(); };
$('mWp').onclick=()=>{ M().anzahl++; mWurf=[]; mRender(); sync(); };
$('mWv').oninput=()=>{ const v=parseInt($('mWv').value,10);
  if(isFinite(v)&&v>=1){ M().anzahl=Math.min(100,v); mWurf=[]; mRender(); sync(); } };
$('mWv').onblur=()=>{ mPruefen(); $('mWv').value=M().anzahl; mRender(); };
$('mWv').onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter'){ $('mWv').blur(); mWerfen(); } };
$('mFair').onclick=()=>{ M().gezinkt=!M().gezinkt; mRender(); sync(); };
$('mPz').oninput=()=>{ M().p=Math.max(0.01,Math.min(0.99,+$('mPz').value||0.5)); mRender(); sync(); };
$('mPz').onkeydown=e=>e.stopPropagation();
$('mReset').onclick=()=>{ M().gesamtK=0; M().gesamtN=0; mWurf=[]; mRender(); sync(); };
$('mGo').onclick=mWerfen;

/* ============================ Würfel ============================ */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const WCOL=[{bg:'#ffffff'},{bg:'#fee2e2'},{bg:'#ffedd5'},{bg:'#fef9c3'},{bg:'#dcfce7'},{bg:'#dbeafe'},{bg:'#ede9fe'},{bg:'#fce7f3'}];
function wColors(){ if(!Array.isArray(data.colors))data.colors=[]; for(let i=0;i<data.n;i++) if(data.colors[i]==null)data.colors[i]=0; data.colors.length=data.n; }
function wDie(val,sides,size,idx){ const d=document.createElement('div');
  d.className='die'; d.style.width=size+'px'; d.style.height=size+'px';
  if(sides===6){ for(let i=0;i<9;i++){ const cell=document.createElement('span'); if(PIPS[val].includes(i)){ const p=document.createElement('span'); p.className='pip'; cell.appendChild(p);} d.appendChild(cell);} }
  else { d.classList.add('num'); d.style.fontSize=(size*0.5)+'px'; d.textContent=val; }
  d.style.background=WCOL[(data.colors[idx]||0)%WCOL.length].bg;
  d.onclick=()=>{ data.colors[idx]=((data.colors[idx]||0)+1)%WCOL.length; d.style.background=WCOL[data.colors[idx]].bg; sync(); };   // Antippen = nächste Farbe
  return d; }
let wVals=[1];
function wRender(vals){ wVals=vals; wColors(); const box=$('wBox'); box.innerHTML='';
  const n=vals.length, cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols), gap=14;
  const cw=box.clientWidth||280, ch=box.clientHeight||200;
  const size=Math.max(40, Math.floor(Math.min((cw-gap*(cols+1))/cols,(ch-gap*(rows+1))/rows)));
  vals.forEach((v,i)=>box.appendChild(wDie(v,data.sides,size,i)));
  $('wSum').textContent = vals.length>1 ? ('Summe: '+vals.reduce((a,b)=>a+b,0)) : ''; }
let wRolling=false;
function wRoll(){ if(wRolling)return; wRolling=true; const n=data.n, s=data.sides; let t=0;
  const iv=setInterval(()=>{ wRender(Array.from({length:n},()=>1+Math.floor(Math.random()*s))); if(++t>=10){ clearInterval(iv); wRolling=false; } },55); }
$('wN').onchange=()=>{ data.n=+$('wN').value; wColors(); wRender(Array.from({length:data.n},()=>1)); sync(); };
$('wS').onchange=()=>{ data.sides=+$('wS').value; wRender(Array.from({length:data.n},()=>1)); sync(); };
$('wRoll').onclick=wRoll;

/* ============================ Glücksrad ============================ */
const PAL=['#ef4444','#f59e0b','#eab308','#22c55e','#0ea5e9','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#84cc16','#6366f1'];
const radDef=()=>Array.from({length:6},(_,i)=>({label:String(i+1),color:PAL[i%PAL.length]}));
let rot=0, rSpinning=false;
const rCv=$('rCv'), rCtx=rCv.getContext('2d');
function rResize(){ const dpr=window.devicePixelRatio||1, w=rCv.clientWidth||300, h=rCv.clientHeight||300;
  rCv.width=Math.round(w*dpr); rCv.height=Math.round(h*dpr); rCtx.setTransform(dpr,0,0,dpr,0,0); rDraw(); }
function rDraw(){ const w=rCv.clientWidth, h=rCv.clientHeight; if(!w||!h)return; rCtx.clearRect(0,0,w,h);
  const secs=data.sectors.length?data.sectors:radDef(), N=secs.length;
  const cx=w/2, cy=h/2, R=Math.min(w,h)/2-18, seg=2*Math.PI/N;   /* Platz für den Zeiger oben */
  for(let i=0;i<N;i++){ const a0=rot+i*seg, a1=a0+seg;
    rCtx.beginPath(); rCtx.moveTo(cx,cy); rCtx.arc(cx,cy,R,a0,a1); rCtx.closePath();
    rCtx.fillStyle=secs[i].color||PAL[i%PAL.length]; rCtx.fill(); rCtx.strokeStyle='#fff'; rCtx.lineWidth=2; rCtx.stroke();
    const mid=a0+seg/2; rCtx.save(); rCtx.translate(cx,cy); rCtx.textBaseline='middle';
    rCtx.fillStyle='#fff'; rCtx.font='bold '+Math.max(12,Math.min(26,R*0.16))+'px -apple-system,sans-serif';
    const t=String(secs[i].label==null?'':secs[i].label), tt=t.length>10?t.slice(0,9)+'…':t;
    if(Math.cos(mid)<0){ rCtx.rotate(mid+Math.PI); rCtx.textAlign='left'; rCtx.fillText(tt,-(R-10),0); }
    else { rCtx.rotate(mid); rCtx.textAlign='right'; rCtx.fillText(tt,R-10,0); }
    rCtx.restore(); }
  rCtx.beginPath(); rCtx.arc(cx,cy,R*0.10,0,7); rCtx.fillStyle='#1f2430'; rCtx.fill();
  const zb=Math.max(11,R*0.085), zl=Math.max(17,R*0.115);
  rCtx.save(); rCtx.shadowColor='rgba(15,23,42,.45)'; rCtx.shadowBlur=6; rCtx.shadowOffsetY=2;

  else h+='&nbsp;&nbsp;Es sind mehr Stühle als Schüler – hier passt die Sicht „Verteilen“ besser.<br>';
  h+='<b>Verteilen – '+v.a+' Schüler, '+v.b+' Stühle:</b><br>';
  if(v.b>=v.a){ for(let i=0;i<Math.min(v.a,6);i++) h+='&nbsp;&nbsp;'+(i+1)+'. Schüler: '+(v.b-i)+' freie Stühle<br>'; if(v.a>6)h+='&nbsp;&nbsp;…<br>'; }
  else h+='&nbsp;&nbsp;Es sind mehr Schüler als Stühle – hier passt die Sicht „Ziehen“ besser.<br>';
  h+='<div style="margin-top:5px">'+ges.join(' · ')+' = <span class="gross">'+ZAHL(gesamt)+'</span> Möglichkeiten.</div>'+
     '<div class="hinweis" style="margin-top:5px">Gezogen wird immer aus der <b>größeren</b> Menge ('+gross+'), die <b>kleinere</b> ('+klein+') liefert die Plätze. '+
     'Deshalb führen '+v.a+' Schüler auf '+v.b+' Stühle und '+v.b+' Schüler auf '+v.a+' Stühle auf dieselbe Rechnung – „⇄ Rollen tauschen“ zeigt es.</div>';
  box.innerHTML=h; }
$('vAm').onclick=()=>{ V().a--; vBelegt=[]; vRender(); sync(); };
$('vAp').onclick=()=>{ V().a++; vBelegt=[]; vRender(); sync(); };
$('vBm').onclick=()=>{ V().b--; vBelegt=[]; vRender(); sync(); };
$('vBp').onclick=()=>{ V().b++; vBelegt=[]; vRender(); sync(); };
$('vSwap').onclick=()=>{ const v=V(), t=v.a; v.a=v.b; v.b=t; vBelegt=[]; vRender(); sync(); };
$('vRechSw').onclick=()=>{ const on=$('vRech').classList.toggle('on'); $('vRechSw').classList.toggle('on',on); vRechnung(); };
$('vGo').onclick=vSchritt;
$('vAll').onclick=()=>{ if(vBelegt.length>=vSchritte()) vBelegt=[]; let n=0; const iv=setInterval(()=>{ vSchritt(); if(vBelegt.length>=vSchritte()||++n>20) clearInterval(iv); },260); };
$('vReset').onclick=()=>{ vBelegt=[]; vRender(); };

/* ============================ Reiter ============================ */
function setTab(t,still){ data.tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
  if(t==='muenze') requestAnimationFrame(mRender);
  if(t==='wuerfel') wRender(wVals);
  if(t==='rad') requestAnimationFrame(rResize);              // erst jetzt hat das Canvas eine Größe
  if(t==='urne') uRender();
  if(t==='vert') vRender();
  if(!still) sync(); }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

/* ============================ Tafel-Anbindung ============================ */
function sync(){ if(window.parent===window) return;   /* allein geöffnet: nicht an sich selbst senden */
  try{ parent.postMessage({type:'embed-data',data},'*'); }catch(e){} }
function uebernehmen(d){
  data.tab=['muenze','wuerfel','rad','urne','vert'].includes(d.tab)?d.tab:(Array.isArray(d.sectors)&&d.sectors.length?'rad':'wuerfel');
  const mz=(d.muenze&&typeof d.muenze==='object')?d.muenze:{};
  data.muenze={ anzahl:mz.anzahl||1, gezinkt:!!mz.gezinkt, p:mz.p||0.7, gesamtK:mz.gesamtK||0, gesamtN:mz.gesamtN||0 };
  data.n=Math.max(1,Math.min(6,d.n||1)); data.sides=Math.max(2,d.sides||6);
  data.colors=Array.isArray(d.colors)?d.colors.slice():[];
  data.sectors=(Array.isArray(d.sectors)&&d.sectors.length)?d.sectors:radDef();
  const u=(d.urne&&typeof d.urne==='object')?d.urne:{};
  data.urne={ anzahl:u.anzahl||6, zuege:u.zuege||2, zurueck:!!u.zurueck, ordnung:u.ordnung!==false,
    nummern:u.nummern!==false, schema:(u.schema|0)%4, farben:Array.isArray(u.farben)?u.farben.slice():[] };
  const v=(d.vert&&typeof d.vert==='object')?d.vert:{};
  data.vert={ a:v.a||9, b:v.b||5 };
  uZug=[]; vBelegt=[]; mWurf=[]; wColors(); uPruefen(); mPruefen(); wVals=Array.from({length:data.n},()=>1);
  $('wN').value=data.n; $('wS').value=data.sides; $('rRes').textContent='–';
  setTab(data.tab,true); }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return;   // eigene Nachrichten ignorieren
  if(e.data&&e.data.type==='embed-data'&&e.data.data) uebernehmen(e.data.data); });
window.addEventListener('resize',()=>{ if(data.tab==='muenze') mRender(); if(data.tab==='wuerfel') wRender(wVals); if(data.tab==='rad') rResize(); if(data.tab==='urne') uRender(); if(data.tab==='vert') vRender(); });
window.addEventListener('load',()=>{
  if(!data.sectors.length) data.sectors=radDef();
  uPruefen(); mPruefen(); setTab(data.tab,true); wRender([1]);
  if(window.ResizeObserver){ new ResizeObserver(()=>{ if(data.tab==='wuerfel') wRender(wVals); }).observe($('wBox')); }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
</script>
</body>
</html>
