<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Einheitenumrechner</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;}
  #wrap{height:100%;display:flex;flex-direction:column;padding:10px;gap:8px;}
  select,input{font-size:var(--fs,16px);padding:7px 8px;border:1px solid #cfd6e0;border-radius:9px;font-family:inherit;background:#fff;color:#1f2430;}
  #kopf{display:flex;gap:7px;align-items:center;flex:none;}
  #kopf select{flex:1;min-width:0;}
  .fsb{flex:none;border:1px solid #cfd6e0;background:#f8fafc;border-radius:9px;padding:6px 10px;font:700 13px -apple-system,sans-serif;cursor:pointer;color:#334155;}
  #q{font-weight:700;}
  #inrow{display:flex;gap:8px;}
  #val{flex:1;min-width:0;-webkit-user-select:text;user-select:text;text-align:right;font-weight:700;}
  #from{flex:none;min-width:96px;}
  #list{flex:1;min-height:0;overflow:auto;border:1px solid #e2e7ef;border-radius:10px;}
  .r{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid #eef2f8;font-size:var(--fs,16px);}
  .r:last-child{border-bottom:none;}
  .r.act{background:#eff6ff;}
  .r .u{color:#334155;font-weight:600;}
  .r .v{font-variant-numeric:tabular-nums;font-weight:700;}
  .r.act .v{color:#2563eb;}
  #tabs{display:flex;gap:4px;flex:none;flex-wrap:wrap;}
  #tabs button{flex:1 1 auto;white-space:nowrap;border:1px solid #cfd6e0;background:#f4f6fa;border-radius:10px;padding:7px;font-weight:700;font-size:calc(var(--fs,16px)*0.86);font-family:-apple-system,sans-serif;color:#53617a;cursor:pointer;}
  #tabs button.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .panel{display:none;flex:1;min-height:0;flex-direction:column;gap:8px;}
  .panel.on{display:flex;}
  #erow{display:flex;gap:7px;align-items:center;}
  #erow select{flex:1;min-width:0;}
  #eSwap{flex:none;border:1px solid #cfd6e0;background:#f8fafc;border-radius:9px;padding:7px 10px;font:700 15px inherit;cursor:pointer;color:#334155;}
  #ebox{flex:1;min-height:0;overflow:auto;border:1px solid #e2e7ef;border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:10px;}
  #ekopf{font-size:calc(var(--fs,16px)*1.7);font-weight:800;color:#2563eb;line-height:1.25;font-variant-numeric:tabular-nums;}
  #etext{font-size:calc(var(--fs,16px)*1.02);line-height:1.5;color:#1f2430;}
  #ebsp{font-size:calc(var(--fs,16px)*0.9);color:#64748b;line-height:1.45;}
  #ebsp b{color:#334155;}
  #ptab{flex:1;min-height:0;overflow:auto;border:1px solid #e2e7ef;border-radius:10px;}
  #ptab table{width:100%;border-collapse:collapse;font-size:calc(var(--fs,16px)*0.88);}
  #ptab th{position:sticky;top:0;background:#f4f6fa;padding:6px 8px;text-align:left;font-size:.86em;color:#5b6472;border-bottom:1px solid #e2e7ef;}
  #ptab td{padding:5px 8px;border-bottom:1px solid #f0f3f8;vertical-align:top;}
  #ptab tr.eins td{background:#eff6ff;font-weight:700;}
  #ptab .z{font-weight:800;color:#2563eb;font-size:1.05em;}
  #ptab .p{font-weight:700;}
  #ptab .pot{font-variant-numeric:tabular-nums;white-space:nowrap;}
  #ptab .bsp{color:#64748b;}
  #grow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex:none;}
  #gWert{flex:1 1 130px;min-width:0;text-align:right;font-weight:700;-webkit-user-select:text;user-select:text;}
  .glab{font-size:calc(var(--fs,16px)*0.88);color:#475569;font-weight:600;}
  .step{border:1px solid #cfd6e0;background:#f8fafc;border-radius:9px;width:32px;height:32px;font:800 17px inherit;cursor:pointer;color:#334155;padding:0;}
  .gval{min-width:20px;text-align:center;font-weight:800;font-size:calc(var(--fs,16px)*1.05);}
  #gbox{flex:1;min-height:0;overflow:auto;border:1px solid #e2e7ef;border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:9px;}
  #gein{font-size:calc(var(--fs,16px)*1.6);font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  #gein .ok{background:#dbeafe;color:#1d4ed8;border-radius:4px;}
  #gein .ent{background:#fee2e2;color:#b91c1c;border-radius:4px;}
  #gein .gr{color:#b6bfcc;}
  #gerg{font-size:calc(var(--fs,16px)*1.7);font-weight:800;color:#16a34a;font-variant-numeric:tabular-nums;}
  #gtext{font-size:calc(var(--fs,16px)*1.02);line-height:1.5;}
  #galt{font-size:calc(var(--fs,16px)*0.9);color:#64748b;line-height:1.45;}
  #gleg{font-size:calc(var(--fs,16px)*0.82);color:#64748b;}
  @media (max-width:430px){ #ptab .bsp{display:none;} }
</style>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>
</head>
<body>
<div id="wrap">
  <div id="kopf"><select id="q"></select><button type="button" class="fsb" id="fsM" title="Schrift kleiner">A−</button><button type="button" class="fsb" id="fsP" title="Schrift größer">A+</button></div>
  <div id="tabs"><button type="button" id="tabU" class="on">Umrechnung</button><button type="button" id="tabE">Erklärung</button><button type="button" id="tabP">Vorsilben</button><button type="button" id="tabG">Gültige Ziffern</button></div>
  <div class="panel on" id="pU">
    <div id="inrow"><input id="val" type="text" inputmode="decimal" value="1"><select id="from"></select></div>
    <div id="list"></div>
  </div>
  <div class="panel" id="pP"><div id="ptab"></div></div>
  <div class="panel" id="pG">
    <div id="grow">
      <input id="gWert" type="text" inputmode="decimal" value="3,14159" placeholder="Zahl eintippen">
      <span class="glab">gültige Ziffern</span>
      <button type="button" class="step" id="gM">−</button><span class="gval" id="gN">3</span><button type="button" class="step" id="gP">+</button>
    </div>
    <div id="gbox">
      <div id="gein"></div>
      <div id="gerg"></div>
      <div id="gtext"></div>
      <div id="galt"></div>
    </div>
  </div>
  <div class="panel" id="pE">
    <div id="erow"><select id="eA"></select><button type="button" id="eSwap" title="Richtung tauschen">⇄</button><select id="eB"></select></div>
    <div id="ebox"><div id="ekopf"></div><div id="etext"></div><div id="ebsp"></div></div>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const F=f=>({to:x=>x*f, from:b=>b/f});
const Q={
  'Dichte (kg/m³)':[['kg/m³',F(1)],['g/cm³',F(1000)],['kg/L',F(1000)],['g/mL',F(1000)],['g/L',F(1)]],
  'Stromstärke (A)':[['A',F(1)],['mA',F(1e-3)],['µA',F(1e-6)],['kA',F(1000)]],
  'Spannung (V)':[['V',F(1)],['mV',F(1e-3)],['kV',F(1000)],['µV',F(1e-6)]],
  'Widerstand (Ω)':[['Ω',F(1)],['mΩ',F(1e-3)],['kΩ',F(1000)],['MΩ',F(1e6)]],
  'Länge (m)':[['km',F(1000)],['m',F(1)],['dm',F(.1)],['cm',F(.01)],['mm',F(1e-3)],['µm',F(1e-6)]],
  'Fläche (m²)':[['km²',F(1e6)],['ha',F(1e4)],['a',F(100)],['m²',F(1)],['dm²',F(.01)],['cm²',F(1e-4)],['mm²',F(1e-6)]],
  'Volumen (m³)':[['m³',F(1)],['L',F(1e-3)],['dm³',F(1e-3)],['mL',F(1e-6)],['cm³',F(1e-6)],['mm³',F(1e-9)],['hl',F(.1)]],
  'Masse (kg)':[['t',F(1000)],['kg',F(1)],['g',F(1e-3)],['mg',F(1e-6)],['µg',F(1e-9)]],
  'Geschwindigkeit (m/s)':[['m/s',F(1)],['km/h',F(1/3.6)],['km/s',F(1000)],['cm/s',F(.01)]],
  'Beschleunigung (m/s²)':[['m/s²',F(1)],['cm/s²',F(.01)],['g (9,81)',F(9.81)]],
  'Kraft (N)':[['N',F(1)],['kN',F(1000)],['mN',F(1e-3)],['MN',F(1e6)]],
  'Temperatur':[['°C',{to:x=>x+273.15,from:b=>b-273.15}],['K',{to:x=>x,from:b=>b}],['°F',{to:x=>(x-32)*5/9+273.15,from:b=>(b-273.15)*9/5+32}]],
  'Impuls (kg·m/s)':[['kg·m/s',F(1)],['g·m/s',F(1e-3)],['t·m/s',F(1000)]],
  'Wärmekapazität (J/K)':[['J/K',F(1)],['kJ/K',F(1000)],['cal/K',F(4.184)]],
  'Kapazität (F)':[['F',F(1)],['mF',F(1e-3)],['µF',F(1e-6)],['nF',F(1e-9)],['pF',F(1e-12)]],
  'Ladung (C)':[['C',F(1)],['mC',F(1e-3)],['µC',F(1e-6)],['nC',F(1e-9)],['Ah',F(3600)],['mAh',F(3.6)]],
  'Leistung (W)':[['W',F(1)],['kW',F(1000)],['MW',F(1e6)],['mW',F(1e-3)],['PS',F(735.49875)]],
  'Magn. Flussdichte (T)':[['T',F(1)],['mT',F(1e-3)],['µT',F(1e-6)],['nT',F(1e-9)],['G',F(1e-4)]],
  'Energie (J)':[['J',F(1)],['kJ',F(1000)],['MJ',F(1e6)],['mJ',F(1e-3)],['Wh',F(3600)],['kWh',F(3.6e6)],['cal',F(4.184)],['kcal',F(4184)],['eV',F(1.602176634e-19)]]
};
let data={ q:'Dichte (kg/m³)', from:'kg/m³', val:'1', tab:'u', eA:'g/cm³', eB:'kg/m³', fontSize:16, gWert:'3,14159', gN:3 };
function applyFont(){ document.documentElement.style.setProperty('--fs',(data.fontSize||16)+'px'); }
function fmt(v){ if(!isFinite(v))return '–'; if(v===0)return '0';
  const a=Math.abs(v); let s = (a>=1e7||a<1e-4) ? v.toExponential(4) : String(Math.round(v*1e8)/1e8);
  return s.replace('.',','); }
function units(){ return Q[data.q]||Q['Länge (m)']; }
function fillQ(){ $('q').innerHTML=Object.keys(Q).map(k=>'<option'+(k===data.q?' selected':'')+'>'+k+'</option>').join(''); }
function fillFrom(){ const us=units(); if(!us.some(u=>u[0]===data.from)) data.from=us[0][0];
  $('from').innerHTML=us.map(u=>'<option'+(u[0]===data.from?' selected':'')+'>'+u[0]+'</option>').join(''); }
function calc(){ const us=units(); const fromU=us.find(u=>u[0]===data.from)||us[0];
  const x=parseFloat(String(data.val).replace(',','.')); const base=isFinite(x)?fromU[1].to(x):NaN;
  $('list').innerHTML=us.map(u=>{ const v=u[1].from(base); return '<div class="r'+(u[0]===data.from?' act':'')+'"><span class="u">'+u[0]+'</span><span class="v">'+fmt(v)+'</span></div>'; }).join(''); }
function render(){ applyFont(); fillQ(); fillFrom(); $('val').value=data.val; $('gWert').value=data.gWert; calc(); setTab(data.tab); }
for(const [id,d] of [['fsM',-1],['fsP',1]]){ $(id).addEventListener('pointerdown',e=>e.preventDefault());
  $(id).onclick=()=>{ data.fontSize=Math.max(10,Math.min(34,(data.fontSize||16)+d)); applyFont(); sync(); }; }
$('q').onchange=()=>{ data.q=$('q').value; const us=units(); data.from=us[0][0]; data.eA=us[0][0]; data.eB=(us[1]||us[0])[0];
  fillFrom(); calc(); if(data.tab==='e') erklaerungBauen(); sync(); };
$('from').onchange=()=>{ data.from=$('from').value; calc(); sync(); };
$('val').addEventListener('input',()=>{ data.val=$('val').value.replace(/[^0-9,.\-]/g,''); if($('val').value!==data.val)$('val').value=data.val; calc(); sync(); });

/* ===================== Reiter „Erklärung" =====================
   Für zwei Einheiten derselben Größe wird die Umrechnungszahl in einer Zeile
   erklärt – wo es sich anbietet mit einem Beispiel aus dem Alltag, sonst über
   die Kantenlänge (Flächen, Volumina) oder über die Zehnerschritte. */
const ERKL={
 'Dichte (kg/m³)':{
  'g/cm³|kg/m³':'In 1 m³ stecken 1 000 000 cm³, und 1 g ist 0,001 kg: 1 000 000 · 0,001 = 1000. Wasser hat also 1 g/cm³ = 1000 kg/m³.',
  'kg/L|g/cm³':'1 L sind 1000 cm³ und 1 kg sind 1000 g – die Tausender kürzen sich weg, die Zahl bleibt gleich.',
  'g/mL|g/cm³':'1 mL ist genau 1 cm³, deshalb steht in beiden Angaben dieselbe Zahl.',
  'g/L|kg/m³':'1 m³ sind 1000 L und 1 kg sind 1000 g – beide Tausender heben sich auf, die Zahl bleibt gleich.',
  'g/cm³|g/L':'1 L sind 1000 cm³: In einem Liter steckt also das Tausendfache der Masse eines Kubikzentimeters.'},
 'Geschwindigkeit (m/s)':{
  'm/s|km/h':'Wer jede Sekunde einen Meter schafft, kommt in einer Stunde 3600 m weit – das sind 3,6 km. Also 1 m/s = 3,6 km/h.',
  'km/s|km/h':'Eine Stunde hat 3600 Sekunden: Aus 1 km je Sekunde werden 3600 km je Stunde.',
  'm/s|cm/s':'1 m sind 100 cm – die Zeit bleibt dieselbe, also zählt nur die Länge.'},
 'Ladung (C)':{
  'C|Ah':'1 Ampere bedeutet 1 Coulomb je Sekunde, und eine Stunde hat 3600 Sekunden: 1 Ah = 3600 C.',
  'C|mAh':'1 mAh ist ein Tausendstel von 1 Ah (3600 C), also 3,6 C.',

 'Energie (J)':{

 'Leistung (W)':{

 'Volumen (m³)':{

const VORS={'k':'tausend','M':'eine Million','G':'eine Milliarde','h':'hundert','da':'zehn',
  'd':'ein Zehntel','c':'ein Hundertstel','m':'ein Tausendstel','µ':'ein Millionstel','n':'ein Milliardstel','p':'ein Billionstel'};
function gross(v){ if(!isFinite(v)) return '–';
  const a=Math.abs(v);
  if(a!==0&&(a>=1e10||a<1e-6)){ const t=v.toExponential(3).split('e');
    return t[0].replace(/0+$/,'').replace(/[.,]$/,'').replace('.',',')+'·10'+hoch(t[1].replace('+','')); }
  let s=String(Math.round(v*1e9)/1e9).replace('.',',').replace('-','−');
  const t=s.split(','); t[0]=t[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return t.join(','); }
const kante=u=>u.replace(/[²³]$/,'');
/* Krumme Faktoren (1 km/h = 0,2777… m/s) werden gerundet und als „≈" gekennzeichnet */
function genau(v){ return !isFinite(v)||v===0||Math.abs(Number(v.toPrecision(6))-v)<Math.abs(v)*1e-12; }
function gr(v){ if(!isFinite(v)) return '–'; if(v===0) return '0';
  return gross(Number(v.toPrecision(genau(v)?6:4))); }
const zeichen=v=>genau(v)?'= ':'≈ ';
function eUnits(){ return units(); }
function eFind(n){ return eUnits().find(u=>u[0]===n)||eUnits()[0]; }
function erklaerungBauen(){
  const us=eUnits();
  if(!us.some(u=>u[0]===data.eA)) data.eA=us[0][0];
  if(!us.some(u=>u[0]===data.eB)) data.eB=(us[1]||us[0])[0];
  if(data.eA===data.eB) data.eB=(us.find(u=>u[0]!==data.eA)||us[0])[0];
  $('eA').innerHTML=us.map(u=>'<option'+(u[0]===data.eA?' selected':'')+'>'+u[0]+'</option>').join('');
  $('eB').innerHTML=us.map(u=>'<option'+(u[0]===data.eB?' selected':'')+'>'+u[0]+'</option>').join('');
  const A=eFind(data.eA), B=eFind(data.eB);
  /* y = m·x + c aus zwei Stützstellen – damit sind auch °C/°F/K abgedeckt */
  const y0=B[1].from(A[1].to(0)), y1=B[1].from(A[1].to(1)), m=y1-y0, c=y0;
  const affin=Math.abs(c)>1e-12;
  $('ekopf').innerHTML = affin
    ? (data.eB+' = '+data.eA+(Math.abs(m-1)<1e-12?'':' · '+gr(m))+(c>0?' + ':' − ')+gr(Math.abs(c)))
    : ('1 '+data.eA+' '+zeichen(m)+gr(m)+' '+data.eB+
       (Math.abs(m-1)<1e-12?'':'<div style="font-size:.55em;font-weight:700;color:#64748b;margin-top:3px">umgekehrt: 1 '+data.eB+' '+zeichen(1/m)+gr(1/m)+' '+data.eA+'</div>'));
  /* Erklärung: feste Zeile, sonst über Kantenlänge oder Zehnerschritte */
  const T=ERKL[data.q]||{};
  let txt=T[data.eA+'|'+data.eB]||T[data.eB+'|'+data.eA]||'';
  if(!txt&&!affin){
    const f=m>=1?m:1/m, gU=m>=1?data.eA:data.eB, kU=m>=1?data.eB:data.eA;
    const dim=/Fläche/.test(data.q)?2:(/Volumen/.test(data.q)&&/[³]/.test(gU)&&/[³]/.test(kU)?3:1);
    const r=Math.pow(f,1/dim);
    if(dim>1&&Math.abs(r-Math.round(r))<1e-9)
      txt='1 '+kante(gU)+' = '+gross(r)+' '+kante(kU)+' – und weil '+(dim===2?'eine Fläche zwei':'ein Volumen drei')+' Längen hat: '+
          new Array(dim).fill(gross(r)).join(' · ')+' = '+gross(f)+'. Also 1 '+gU+' = '+gross(f)+' '+kU+'.';
    else {
      const stufen=Math.log10(f), v=/^(da|[kMGhdcmµnp])/.exec(gU);
      txt='1 '+gU+' = '+gross(f)+' '+kU+'.';
      if(Math.abs(stufen-Math.round(stufen))<1e-9) txt+=' Beim Umrechnen wandert das Komma um '+Math.round(stufen)+' Stelle'+(Math.round(stufen)===1?'':'n')+' nach rechts.';
      if(v&&VORS[v[1]]) txt='Die Vorsilbe „'+v[1]+'" steht für '+VORS[v[1]]+': '+txt;
    }
  }
  $('etext').textContent=txt||('1 '+data.eA+' = '+gross(m)+' '+data.eB+'.');
  /* Beispiel mit einer runden Zahl */
  const bsp=affin?({'K':300,'°F':68}[data.eA]||20):2.5;   // bei Temperaturen eine alltagsnahe Zahl
  const erg=B[1].from(A[1].to(bsp));
  $('ebsp').innerHTML='Beispiel: <b>'+gross(bsp)+' '+data.eA+' '+zeichen(erg)+gr(erg)+' '+data.eB+'</b>';
}

/* ===================== Reiter „Vorsilben" ===================== */
const VORSILBEN=[
 ['Peta','P',15,'eine Billiarde','1 PB (Petabyte) = 1000 TB'],
 ['Tera','T',12,'eine Billion','1 TB Festplatte = 1000 GB'],
 ['Giga','G',9,'eine Milliarde','3 GHz Prozessortakt = 3 000 000 000 Schwingungen je Sekunde'],
 ['Mega','M',6,'eine Million','1 MW Windrad = 1 000 000 W'],
 ['Kilo','k',3,'tausend','1 km = 1000 m · 1 kg = 1000 g'],
 ['Hekto','h',2,'hundert','1 hl = 100 L · 1 ha = 100 a'],
 ['Deka','da',1,'zehn','1 dag = 10 g (heute selten)'],
 ['—','',0,'eins','die Einheit selbst: m, g, s, A'],
 ['Dezi','d',-1,'ein Zehntel','1 dm = 0,1 m · 1 dL = 0,1 L'],
 ['Zenti','c',-2,'ein Hundertstel','1 cm = 0,01 m'],
 ['Milli','m',-3,'ein Tausendstel','1 mm = 0,001 m · 1 mA = 0,001 A'],
 ['Mikro','µ',-6,'ein Millionstel','1 µm = 0,001 mm – ein Haar ist etwa 60 µm dick'],
 ['Nano','n',-9,'ein Milliardstel','grünes Licht hat etwa 500 nm Wellenlänge'],
 ['Piko','p',-12,'ein Billionstel','1 pF – Kondensatoren in der Elektronik'],
 ['Femto','f',-15,'ein Billiardstel','1 fm – so groß ist etwa ein Atomkern']
];
const HOCH={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const hoch=n=>String(n).split('').map(c=>HOCH[c]||c).join('');
function zahlWort(e){ if(e>6||e<-6) return '';            // zu lang zum Ausschreiben
  if(e>=0) return gross(Math.pow(10,e));
  return '0,'+new Array(-e-1).fill('0').join('')+'1'; }
function vorsilbenBauen(){
  let h='<table><tr><th>Vorsilbe</th><th>Zeichen</th><th>Zehnerpotenz</th><th>Bedeutung</th><th class="bsp">Beispiel</th></tr>';
  VORSILBEN.forEach(v=>{ const [name,z,e,wort,bsp]=v; const zahl=zahlWort(e);
    h+='<tr'+(e===0?' class="eins"':'')+'><td class="p">'+name+'</td><td class="z">'+(z||'–')+'</td>'+
       '<td class="pot">10'+hoch(e)+'</td><td>'+wort+(zahl?'<br><span class="pot">'+zahl+'</span>':'')+'</td>'+
       '<td class="bsp">'+bsp+'</td></tr>'; });
  $('ptab').innerHTML=h+'</table>'; }

/* ===================== Reiter „Gültige Ziffern" =====================
   Die eingetippte Zahl wird eingefärbt: blau die Ziffern, die bleiben, rot die
   erste wegfallende (sie entscheidet über das Runden), grau der Rest und die
   führenden Nullen. Darunter steht das Ergebnis und warum es so lautet. */
function gLesen(){ const t=String(data.gWert||'').trim().replace(/\s/g,'');
  const v=parseFloat(t.replace(',','.')); return {t, v}; }
function gMarkieren(t,n){ let sig=-1, gesehen=false, out='', ent=null;
  for(const ch of t){
    if(/[0-9]/.test(ch)){
      if(!gesehen&&ch==='0'){ out+='<span class="gr">'+ch+'</span>'; continue; }   // führende Null zählt nicht
      gesehen=true; sig++;
      if(sig<n) out+='<span class="ok">'+ch+'</span>';
      else if(sig===n){ ent=ch; out+='<span class="ent">'+ch+'</span>'; }
      else out+='<span class="gr">'+ch+'</span>';
    } else out+=(gesehen&&sig>=n)?'<span class="gr">'+ch+'</span>':ch;
  }
  return {html:out, ent, ziffern:sig+1}; }
function gRunden(v,n){ if(!isFinite(v)||v===0) return {fix:'0', wiss:'0', mehrdeutig:false};
  const r=Number(v.toPrecision(n)), e=Math.floor(Math.log10(Math.abs(r)));
  const nk=Math.max(0,n-1-e);
  const fix=r.toFixed(nk).replace('.',',').replace('-','−');
  const m=r/Math.pow(10,e);
  const wiss=m.toFixed(Math.max(0,n-1)).replace('.',',').replace('-','−')+' · 10'+hoch(e);
  return {fix, wiss, mehrdeutig:(nk===0&&/0$/.test(fix)), r, e}; }
function gBauen(){
  $('gN').textContent=data.gN;
  const {t,v}=gLesen(), n=data.gN;
  if(!isFinite(v)){ $('gein').innerHTML=''; $('gerg').textContent='–';
    $('gtext').textContent='Bitte eine Zahl eintippen – auch mit Komma, zum Beispiel 3,14159.'; $('galt').textContent=''; return; }
  const mk=gMarkieren(t,n), rd=gRunden(v,n);
  $('gein').innerHTML=mk.html+'<span id="gleg" style="margin-left:10px">'+
    '<span class="ok" style="padding:0 4px">bleibt</span> <span class="ent" style="padding:0 4px">entscheidet</span> <span class="gr">fällt weg</span></span>';
  const erg=rd.mehrdeutig?rd.wiss:rd.fix;
  const exakt=(Number(v.toPrecision(n))===v);
  $('gerg').innerHTML=(exakt?'= ':'≈ ')+erg;
  let txt='';
  const zuWenig=(mk.ent==null&&mk.ziffern<n);
  if(zuWenig) txt='Die Zahl hat nur '+mk.ziffern+' gültige Ziffer'+(mk.ziffern===1?'':'n')+' – um '+n+' anzugeben, werden hinten Nullen angehängt.';
  else if(mk.ent==null) txt='Die Zahl hat genau '+n+' gültige Ziffer'+(n===1?'':'n')+' – es muss nichts weggerundet werden.';
  else txt='Die erste wegfallende Ziffer ist eine '+mk.ent+' – '+(+mk.ent<5?'kleiner als 5, also wird abgerundet.':'5 oder größer, also wird aufgerundet.');
  if(/^[−-]?0[,.]0/.test(t)) txt+=' Die Nullen am Anfang zählen nicht mit, sie geben nur die Größenordnung an.';
  if(!zuWenig&&!rd.mehrdeutig&&/0$/.test(rd.fix)&&/,/.test(rd.fix)) txt+=' Die Null am Ende muss stehen bleiben – sie zeigt, dass auf '+n+' Ziffern genau gerundet wurde.';
  $('gtext').textContent=txt;
  $('galt').innerHTML = rd.mehrdeutig
    ? ('Als Dezimalzahl wäre es <b>'+rd.fix+'</b> – daran sieht man aber nicht, welche Nullen gelten. Deshalb die Zehnerpotenz.')
    : ((rd.fix!==rd.wiss&&rd.e!==0) ? ('auch: '+rd.wiss) : '');
}
$('gWert').addEventListener('input',()=>{ data.gWert=$('gWert').value.replace(/[^0-9,.\-−eE]/g,'');
  if($('gWert').value!==data.gWert) $('gWert').value=data.gWert; gBauen(); sync(); });
$('gWert').addEventListener('keydown',e=>e.stopPropagation());
$('gM').onclick=()=>{ data.gN=Math.max(1,data.gN-1); gBauen(); sync(); };
$('gP').onclick=()=>{ data.gN=Math.min(6,data.gN+1); gBauen(); sync(); };
function setTab(t){ data.tab=['u','e','p','g'].includes(t)?t:'u';
  [['u','tabU','pU'],['e','tabE','pE'],['p','tabP','pP'],['g','tabG','pG']].forEach(([k,b,pn])=>{
    $(b).classList.toggle('on',data.tab===k); $(pn).classList.toggle('on',data.tab===k); });
  if(data.tab==='e') erklaerungBauen();
  if(data.tab==='p'&&!$('ptab').innerHTML) vorsilbenBauen();
  if(data.tab==='g') gBauen(); }
$('tabU').onclick=()=>{ setTab('u'); sync(); };
$('tabE').onclick=()=>{ setTab('e'); sync(); };
$('tabP').onclick=()=>{ setTab('p'); sync(); };
$('tabG').onclick=()=>{ setTab('g'); sync(); };
$('eA').onchange=()=>{ data.eA=$('eA').value; erklaerungBauen(); sync(); };
$('eB').onchange=()=>{ data.eB=$('eB').value; erklaerungBauen(); sync(); };
$('eSwap').onclick=()=>{ const t=data.eA; data.eA=data.eB; data.eB=t; erklaerungBauen(); sync(); };
function sync(){ if(window.parent===window) return; /* allein geöffnet: nicht an sich selbst senden */ try{ parent.postMessage({type:'embed-data',data},'*'); }catch(e){} }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return;   // eigene Nachrichten ignorieren
  if(e.data&&e.data.type==='embed-data'&&e.data.data){ const d=e.data.data;
  data={ q:Q[d.q]?d.q:'Dichte (kg/m³)', from:d.from||'', val:(d.val!=null?String(d.val):'1'),
    tab:['u','e','p','g'].includes(d.tab)?d.tab:'u', eA:d.eA||'', eB:d.eB||'', fontSize:+d.fontSize||16,
    gWert:(d.gWert!=null?String(d.gWert):'3,14159'), gN:Math.max(1,Math.min(6,+d.gN||3)) }; render(); } });
window.addEventListener('load',()=>{ render(); try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
</script>
