<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stromkreis</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  :root{--fs:14px;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;font-size:var(--fs);}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  #bar{display:flex;gap:4px;padding:6px;border-bottom:1px solid #e2e7ef;align-items:center;flex:none;overflow:hidden;}
  /* links (bis Leitung) und rechts (ab Radierer) bleiben stehen, die Bauteile dazwischen scrollen */
  #barL,#barR{display:flex;gap:4px;align-items:center;flex:none;}
  #barMid{display:flex;gap:4px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:0 2px;}
  #bar.compact #barL .tb span,#bar.compact #barR .tb span{display:none;}   /* sehr schmal: feste Knöpfe nur als Symbol */
  #bar.compact #barL .tb,#bar.compact #barR .tb{min-width:42px;padding:0 3px;}
  #barMid::-webkit-scrollbar{height:5px;} #barMid::-webkit-scrollbar-thumb{background:#c8d0dc;border-radius:3px;}
  #barMid.more{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent);}
  #barMid.more.start{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);}
  #barMid.more.end{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 100%);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 100%);}
  .tb{flex:none;min-width:52px;height:50px;border:1px solid #d6dce5;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 5px;color:#1f2430;font:inherit;}
  .tb svg{width:32px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tb span{font-size:.7em;font-weight:600;white-space:nowrap;}
  .tb.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .tb:disabled{opacity:.35;}
  .sep{width:1px;align-self:stretch;background:#e2e7ef;margin:0 3px;flex:none;}
  #bar2{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid #e2e7ef;align-items:center;flex-wrap:nowrap;flex:none;min-height:44px;font-size:.92em;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  #bar2>*{flex:0 0 auto;}
  #bar2::-webkit-scrollbar{height:4px;} #bar2::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  .lbl{color:#64748b;font-weight:600;}
  .chip{border:1.5px solid #cfd6e0;background:#fff;border-radius:999px;padding:4px 10px;font:inherit;font-weight:700;color:#475569;cursor:pointer;}
  .chip.on{background:#1f2430;border-color:#1f2430;color:#fff;}
  .chip.U.on{background:#b45309;border-color:#b45309;} .chip.I.on{background:#1d4ed8;border-color:#1d4ed8;} .chip.R.on{background:#475569;border-color:#475569;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:5px 10px;font:inherit;font-weight:600;color:#1f2430;cursor:pointer;white-space:nowrap;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.red{color:#dc2626;border-color:#fca5a5;}
  .seg{display:inline-flex;background:#eef1f6;border-radius:9px;padding:2px;gap:2px;}
  .seg button{border:none;background:transparent;border-radius:7px;padding:4px 9px;font:inherit;font-weight:600;color:#475569;cursor:pointer;}
  .seg button.on{background:#fff;color:#1f2430;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .stp{display:inline-flex;align-items:center;gap:4px;}
  .stp button{width:32px;height:32px;border:1px solid #cfd6e0;background:#fff;border-radius:8px;font:inherit;font-size:1.1em;font-weight:700;cursor:pointer;}
  .stp input{width:74px;text-align:right;font:inherit;font-weight:700;padding:5px 6px;border:1px solid #cfd6e0;border-radius:8px;-webkit-user-select:text;user-select:text;}
  .grow{flex:1;}
  #cvbox{flex:1;position:relative;min-height:0;}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  #warn{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap;}
  #hint{position:absolute;left:10px;bottom:8px;font-size:.75em;color:#94a3b8;pointer-events:none;}
  #toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:7px 14px;border-radius:999px;font-size:.9em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:.92;}
  #chart{position:absolute;right:10px;bottom:30px;width:min(460px,64%);height:240px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.16);display:flex;flex-direction:column;overflow:hidden;z-index:5;}
  #chHead{display:flex;align-items:center;gap:4px;padding:4px 6px;border-bottom:1px solid #e2e7ef;cursor:move;touch-action:none;font-size:.85em;flex:none;}
  #chHead b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  #chHead .chip{padding:2px 9px;}
  #chHead .btn{padding:3px 8px;}
  #chHead select{padding:3px 4px;}
  #chCv{flex:1;width:100%;min-height:0;display:block;}
  select{font:inherit;padding:5px 6px;border:1px solid #cfd6e0;border-radius:8px;background:#fff;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar"><div id="barL">
    <button class="tb" id="fNew" title="Neue, leere Schaltung"><svg viewBox="0 0 32 20"><path d="M11 2h8l4 4v12H11Z M19 2v4h4 M17 9v6M14 12h6"/></svg><span>Neu</span></button>
    <button class="tb" id="fSave" title="Schaltung als Datei speichern"><svg viewBox="0 0 32 20"><path d="M10 2h10l3 3v13H10Z M13 2v5h7V2 M13 18v-6h7v6"/></svg><span>Speichern</span></button>
    <button class="tb" id="fLoad" title="Gespeicherte Schaltung laden"><svg viewBox="0 0 32 20"><path d="M7 16V5h6l2 2h10v9Z M16 9v6M13 12l3 3 3-3"/></svg><span>Laden</span></button>
    <button class="tb" id="fClose" title="Stromkreis schließen" hidden><svg viewBox="0 0 32 20"><path d="M11 5l10 10M21 5 11 15"/></svg><span>Schließen</span></button>
    <input type="file" id="fFile" accept=".json,.stromkreis,application/json" hidden>
    <span class="sep"></span>
    <button class="tb" data-tool="sel" title="Auswählen, verschieben, Schalter umlegen"><svg viewBox="0 0 32 20"><path d="M12 2l0 14 3.5-3.5 2.5 5 2-1-2.5-5H22Z" fill="currentColor" stroke="none"/></svg><span>Auswahl</span></button>
    <button class="tb" data-tool="wire" title="Leitung von Punkt zu Punkt ziehen"><svg viewBox="0 0 32 20"><path d="M3 15H15V5H29"/><circle cx="3" cy="15" r="1.6" fill="currentColor"/><circle cx="29" cy="5" r="1.6" fill="currentColor"/></svg><span>Leitung</span></button>
    </div><div id="barMid">
    <button class="tb" data-tool="bat" title="Quelle (Batterie)"><svg viewBox="0 0 32 20"><path d="M2 10H14.5M17.5 10H30M14.5 2V18"/><path d="M17.5 6V14" stroke-width="3.2"/></svg><span>Quelle</span></button>
    <button class="tb" data-tool="ac" title="Wechselspannungsquelle"><svg viewBox="0 0 32 20"><path d="M2 10H10M22 10H30"/><circle cx="16" cy="10" r="6"/><path d="M12.5 10c1-2.6 2.5-2.6 3.5 0s2.5 2.6 3.5 0"/></svg><span>Wechselsp.</span></button>
    <button class="tb" data-tool="sw" title="Schalter"><svg viewBox="0 0 32 20"><path d="M2 12H10M22 12H30M10 12 21 4"/><circle cx="10" cy="12" r="1.4" fill="currentColor"/><circle cx="22" cy="12" r="1.4" fill="currentColor"/></svg><span>Schalter</span></button>
    <button class="tb" data-tool="sw2" title="Wechselschalter (Umschalter)"><svg viewBox="0 0 32 20"><path d="M2 12H9M9 12 20 5M21 5H30M21 15H30"/><circle cx="9" cy="12" r="1.4" fill="currentColor"/><circle cx="21" cy="5" r="1.4" fill="currentColor"/><circle cx="21" cy="15" r="1.4" fill="currentColor"/></svg><span>Wechsler</span></button>
    <button class="tb" data-tool="res" title="Widerstand"><svg viewBox="0 0 32 20"><path d="M2 10H9M23 10H30"/><rect x="9" y="6" width="14" height="8"/></svg><span>Widerstand</span></button>
    <button class="tb" data-tool="lamp" title="Lampe"><svg viewBox="0 0 32 20"><path d="M2 10H10M22 10H30"/><circle cx="16" cy="10" r="6"/><path d="M11.8 5.8 20.2 14.2M20.2 5.8 11.8 14.2"/></svg><span>Lampe</span></button>
    <button class="tb" data-tool="diode" title="Diode (Durchlassrichtung in Pfeilrichtung)"><svg viewBox="0 0 32 20"><path d="M2 10H11M21 10H30M11 4V16L20 10Z M21 4V16"/></svg><span>Diode</span></button>
    <button class="tb" data-tool="motor" title="Motor"><svg viewBox="0 0 32 20"><path d="M2 10H10M22 10H30"/><circle cx="16" cy="10" r="6"/><text x="16" y="13.4" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" stroke="none" font-family="-apple-system,Arial,sans-serif">M</text></svg><span>Motor</span></button>
    <button class="tb" data-tool="npn" title="Transistor (NPN): B links, C oben, E unten"><svg viewBox="0 0 32 20"><circle cx="17" cy="10" r="7.5"/><path d="M2 10H13M13 5V15M13 8 20 3.5V1M13 12 20 16.5V19"/><path d="M17.2 15.6 20 16.5 19.2 13.8" fill="currentColor"/></svg><span>Transistor</span></button>
    <button class="tb" data-tool="coil" title="Spule"><svg viewBox="0 0 32 20"><path d="M2 12H7M25 12H30M7 12a2.25 2.25 0 0 1 4.5 0a2.25 2.25 0 0 1 4.5 0a2.25 2.25 0 0 1 4.5 0a2.25 2.25 0 0 1 4.5 0"/></svg><span>Spule</span></button>
    <button class="tb" data-tool="cap" title="Kondensator"><svg viewBox="0 0 32 20"><path d="M2 10H14M18 10H30"/><path d="M14 3V17M18 3V17" stroke-width="2.6"/></svg><span>Kondensator</span></button>
    <button class="tb" data-tool="amm" title="Strommesser (Amperemeter) – in Reihe schalten"><svg viewBox="0 0 32 20"><path d="M2 10H10M22 10H30"/><circle cx="16" cy="10" r="6"/><text x="16" y="13.4" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" stroke="none" font-family="-apple-system,Arial,sans-serif">A</text></svg><span>Strommesser</span></button>
    <button class="tb" data-tool="volt" title="Spannungsmesser (Voltmeter) – parallel schalten"><svg viewBox="0 0 32 20"><path d="M2 10H10M22 10H30"/><circle cx="16" cy="10" r="6"/><text x="16" y="13.4" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" stroke="none" font-family="-apple-system,Arial,sans-serif">V</text></svg><span>Spannungsm.</span></button>
    </div><div id="barR"><span class="sep"></span>
    <button class="tb" data-tool="erase" title="Bauteil oder Leitungsstück löschen"><svg viewBox="0 0 32 20"><path d="M13 16 8 11l9-9 7 7-7 7Z M13 16H24"/></svg><span>Radierer</span></button>
    <button class="tb" id="bUndo" title="Rückgängig"><svg viewBox="0 0 32 20"><path d="M10 5 5 10l5 5M5 10H20a6 6 0 0 1 0 12"/></svg><span>Zurück</span></button>
    <button class="tb" id="bRedo" title="Wiederholen"><svg viewBox="0 0 32 20"><path d="M22 5l5 5-5 5M27 10H12a6 6 0 0 0 0 12"/></svg><span>Vor</span></button>
    <button class="tb" id="bNew" title="Beispiel laden oder alles löschen"><svg viewBox="0 0 32 20"><rect x="7" y="3" width="18" height="14" rx="2"/><path d="M11 8h10M11 12h6"/></svg><span>Vorlagen</span></button>
  </div></div>
  <div id="bar2"></div>
  <div id="cvbox"><canvas id="cv"></canvas><div id="warn" hidden></div><div id="hint"></div><div id="toast"></div>
    <div id="chart" hidden><div id="chHead"><b id="chTitle">Diagramm</b><span class="grow"></span><button class="chip U on" data-q="U">U</button><button class="chip I on" data-q="I">I</button><select id="chWin"><option value="5">5 s</option><option value="10" selected>10 s</option><option value="30">30 s</option><option value="60">60 s</option></select><button class="btn" id="chPause" title="Anhalten/Weiter">⏸</button><button class="btn" id="chBoard" title="Diagramm als Bild auf die Tafel">🖼</button><button class="btn" id="chClose" title="Diagramm schließen">✕</button></div><canvas id="chCv"></canvas></div></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const GW=1000, RI=0.05, RD=0.2, VF=0.7, GOFF=1e-9, REG=1e-8, SHORT=10;
const INFO={
  bat:  {name:'Quelle',     q:'U', unit:'V', def:6,  list:[1.5,3,4.5,6,9,12,24], min:0.5, max:400},
  ac:   {name:'Wechselspannung', q:'Û', unit:'V', def:6, list:[1.5,3,4.5,6,9,12,24], min:0.5, max:400,
         q2:'f', unit2:'Hz', def2:0.5, list2:[0.1,0.2,0.5,1,2,5,10,50], min2:0.02, max2:100},
  npn:  {name:'Transistor (NPN)'},
  res:  {name:'Widerstand', q:'R', unit:'Ω', def:10, list:[1,2,5,10,20,47,50,100,220,470,1000], min:0.1, max:1e6},
  lamp: {name:'Lampe',      q:'R', unit:'Ω', def:12, list:[2,4,6,12,24,48,100], min:0.5, max:1e5},
  motor:{name:'Motor',      q:'R', unit:'Ω', def:6,  list:[2,4,6,10,20,50], min:0.5, max:1e5},
  cap:  {name:'Kondensator',q:'C', unit:'µF',def:1000,list:[10,47,100,470,1000,2200,4700,10000,47000], min:1, max:1e7},
  coil: {name:'Spule',      q:'L', unit:'H', def:2,  list:[0.1,0.5,1,2,5,10,20,50], min:0.001, max:1000},
  sw:   {name:'Schalter'},
  sw2:  {name:'Wechselschalter'},
  diode:{name:'Diode'},
  amm:  {name:'Strommesser'},
  volt: {name:'Spannungsmesser'} };
const RL=5;                                   // Drahtwiderstand der Spule in Ω
const BETA=100, VBE=0.7, VSAT=0.1, RSAT=0.5;   // Transistor-Modell
let simT=0;                                   // Simulationszeit für Wechselspannung
const defaults=()=>({wires:[],parts:[],show:{U:true,I:true,R:false},flow:true,carrier:'e',zoom:1,ox:null,oy:null,fontSize:14});
let data=defaults();
let tool='sel', sel=null;             // sel: {part:id} oder {wires:[keys]}
let undoSt=[], redoSt=[];
let res=null, dirty=true;

/* ================= Hilfen ================= */
const uid=()=>'p'+Math.random().toString(36).slice(2,9);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }
function fmtNum(v){ const a=Math.abs(v); let s; if(a===0) s='0'; else if(a>=100) s=String(Math.round(v)); else s=String(parseFloat(v.toPrecision(3))); return s.replace('.',','); }
function fmtQ(v,unit){ const a=Math.abs(v), sg=v<0?'−':'';
  if(v<0) return sg+fmtQ(-v,unit);
  if(unit==='A'&&a<1&&a>=0.001) return fmtNum(v*1000)+' mA';
  if(unit==='Ω'&&a>=1000) return fmtNum(v/1000)+' kΩ';
  if((unit==='V'&&a<0.005)||(unit==='A'&&a<0.0005)) return '0 '+unit;
  return fmtNum(v)+' '+unit; }
const ekey=(x,y,o)=>x+','+y+','+o;
const nkey=(x,y)=>x+','+y;
/* Bauteil: Anschluss a liegt auf (x|y), d = Drehung (0 → rechts, 1 → unten, 2 → links, 3 → oben), f = gespiegelt */
function toG(p,u,v){ if(p.f) v=-v; const X=p.x, Y=p.y; switch(p.d){ case 0: return [X+u,Y+v]; case 1: return [X-v,Y+u]; case 2: return [X-u,Y-v]; default: return [X+v,Y-u]; } }
function ends(p){ if(p.type==='npn') return {a:toG(p,0,0),b:toG(p,2,-1),c:toG(p,2,1)};
  const e={a:toG(p,0,0),b:toG(p,2,0)}; if(p.type==='sw2') e.c=toG(p,2,-1); return e; }
function terminals(p){ const e=ends(p); return e.c?[e.a,e.b,e.c]:[e.a,e.b]; }
function partEdges(p){ if(p.type==='npn'){ const a=toG(p,0,0), m=toG(p,1,0); return a[1]===m[1]?[ekey(Math.min(a[0],m[0]),a[1],'h')]:[ekey(a[0],Math.min(a[1],m[1]),'v')]; }
  const {a,b}=ends(p); const x0=Math.min(a[0],b[0]), y0=Math.min(a[1],b[1]);
  return a[1]===b[1]?[ekey(x0,y0,'h'),ekey(x0+1,y0,'h')]:[ekey(x0,y0,'v'),ekey(x0,y0+1,'v')]; }
function edgeEnds(k){ const [x,y,o]=k.split(','); const X=+x,Y=+y; return o==='h'?[[X,Y],[X+1,Y]]:[[X,Y],[X,Y+1]]; }
function snapshot(){ return JSON.stringify({wires:data.wires,parts:data.parts}); }
function pushUndo(){ undoSt.push(snapshot()); if(undoSt.length>60) undoSt.shift(); redoSt=[]; updUndo(); }
function restore(s){ const o=JSON.parse(s); data.wires=o.wires; data.parts=o.parts; sel=null; changed(); }
function updUndo(){ $('bUndo').disabled=!undoSt.length; $('bRedo').disabled=!redoSt.length; }
$('bUndo').onclick=()=>{ if(!undoSt.length) return; redoSt.push(snapshot()); restore(undoSt.pop()); updUndo(); };
$('bRedo').onclick=()=>{ if(!redoSt.length) return; undoSt.push(snapshot()); restore(redoSt.pop()); updUndo(); };
function changed(){ dirty=true; if(chart&&!data.parts.some(q=>q.id===chart.id)) closeChart(); renderBar2(); sync(true); requestDraw(); }

/* ================= Diagramm: zeitlicher Verlauf von U und I am ausgewählten Bauteil ================= */
let chart=null, clockT=0;                         // chart = {id, U, I, win, samples:[{t,U,I}], paused}
function partLabel(p){ const same=data.parts.filter(q=>q.type===p.type); return INFO[p.type].name+(same.length>1?' '+(same.indexOf(p)+1):''); }
function openChart(p){ chart={id:p.id,U:true,I:true,win:+$('chWin').value||10,samples:[],paused:false};
  $('chart').hidden=false; $('chTitle').textContent='📈 '+partLabel(p)+(p.type==='npn'?' (U_CE, I_C)':''); $('chPause').textContent='⏸';
  document.querySelectorAll('#chHead .chip').forEach(b=>b.classList.add('on')); renderBar2(); requestDraw(); }
function closeChart(){ chart=null; $('chart').hidden=true; renderBar2(); requestDraw(); }
function sampleOf(p,r){ let U=r.U, I=r.I; if(p.type==='bat'||p.type==='ac') I=-I; return {U,I}; }   // Quellen: abgegebener Strom positiv
function niceRange(lo,hi){ if(hi-lo<1e-9){ const m=Math.max(Math.abs(hi),1e-3); lo=Math.min(lo,-0*m); hi=hi+m; }
  const raw=(hi-lo)/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag, step=(n<=1?1:n<=2?2:n<=5?5:10)*mag;
  return {lo:Math.floor(lo/step-1e-9)*step, hi:Math.ceil(hi/step+1e-9)*step, step}; }
function drawChart(){ if(!chart) return; const c=$('chCv'), dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight; if(!w||!h) return;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); }
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  const K=Math.min(1.6,(data.fontSize||14)/14), fs=Math.round(11*K);
  const L=52*K, Rm=58*K, T=22*K, B=20*K, pw=w-L-Rm, ph=h-T-B; if(pw<30||ph<20) return;
  const S=chart.samples, tEnd=S.length?(chart.paused?S[S.length-1].t:clockT):clockT, t0=tEnd-chart.win;
  const vis=S.filter(q=>q.t>=t0-0.05);
  const rng=q=>{ let lo=0,hi=0; vis.forEach(v=>{ lo=Math.min(lo,v[q]); hi=Math.max(hi,v[q]); }); if(hi-lo<1e-6) hi=lo+(q==='U'?1:0.1); return niceRange(lo,hi); };
  const rU=rng('U'), rI=rng('I');
  if(chart.U&&chart.I){ const z=r=>-r.lo/(r.hi-r.lo), zz=Math.max(z(rU),z(rI));     // Nulllinien beider Achsen auf gleiche Höhe
    [rU,rI].forEach(r=>{ if(z(r)<zz-1e-9){ if(zz>=1-1e-9) r.lo=Math.min(r.lo,-r.step); else r.lo=-zz/(1-zz)*r.hi; } }); }
  const X=t=>L+(t-t0)/chart.win*pw, Y=(v,r)=>T+ph-(v-r.lo)/(r.hi-r.lo)*ph;
  g.font='600 '+fs+'px -apple-system,BlinkMacSystemFont,sans-serif'; g.lineWidth=1;
  const main=chart.U?rU:rI;                                          // Gitterlinien nach der linken Achse

  'Leeres Blatt':()=>build([],[]) };
/* ================= Datei: Neu, Speichern, Laden, Schließen ================= */
const LS_KEY='tafel_stromkreis';
let savedSnap=null;                                            // Stand der letzten gespeicherten/geladenen Datei
const unsaved=()=>(data.parts.length||data.wires.length)&&snapshot()!==savedSnap;
function applyFile(o,undoable){ if(undoable) pushUndo();
  data.wires=o.wires.filter(k=>typeof k==='string'&&/^-?\d+,-?\d+,[hv]$/.test(k));
  data.parts=o.parts.filter(p=>p&&INFO[p.type]).map(p=>({...p,id:p.id||uid(),x:p.x|0,y:p.y|0,d:(p.d|0)%4}));
  if(o.show) data.show=Object.assign({U:true,I:true,R:false},o.show);
  if(o.carrier) data.carrier=o.carrier==='p'?'p':'e'; if(o.flow!==undefined) data.flow=!!o.flow; if(o.fontSize) data.fontSize=+o.fontSize||14;
  document.documentElement.style.setProperty('--fs',Math.min(18,data.fontSize||14)+'px');
  dyn.clear(); res=null; sel=null; if(chart) closeChart(); fitView(); changed(); }
$('fNew').onclick=()=>{ if(unsaved()&&!confirm('Neue Schaltung beginnen? Nicht gespeicherte Änderungen gehen verloren.')) return;
  pushUndo(); TEMPLATES['Leeres Blatt'](); dyn.clear(); res=null; sel=null; if(chart) closeChart(); savedSnap=null; fitView(); changed(); setTool('sel'); toast('Neue Schaltung'); };
$('fSave').onclick=()=>{ if(!data.parts.length&&!data.wires.length){ toast('Noch keine Schaltung gezeichnet'); return; }
  const name=(prompt('Dateiname:','stromkreis-'+new Date().toISOString().slice(0,10))||'').trim(); if(!name) return;
  const file={app:'tafel-stromkreis',v:1,wires:data.wires,parts:data.parts,show:data.show,flow:data.flow,carrier:data.carrier,fontSize:data.fontSize};
  const blob=new Blob([JSON.stringify(file)],{type:'application/json'}), fname=name.replace(/[\\/:*?"<>|]+/g,'_').replace(/\.json$/i,'')+'.json';
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); savedSnap=snapshot(); toast('Gespeichert: '+fname); };
$('fLoad').onclick=()=>{ if(unsaved()&&!confirm('Andere Schaltung laden? Nicht gespeicherte Änderungen gehen verloren.')) return; $('fFile').value=''; $('fFile').click(); };
$('fFile').onchange=()=>{ const f=$('fFile').files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o||!Array.isArray(o.parts)||!Array.isArray(o.wires)) throw new Error('x');
      applyFile(o,true); savedSnap=snapshot(); setTool('sel'); toast('Geladen: '+f.name); }
    catch(e){ toast('Keine gültige Stromkreis-Datei'); } };
  rd.readAsText(f); };
$('fClose').onclick=()=>{ if(unsaved()&&!confirm('Stromkreis schließen? Die Schaltung bleibt in diesem Browser erhalten, ist aber nicht als Datei gespeichert.')) return;
  post(); if(history.length>1){ history.back(); } else { window.close(); }
  setTimeout(()=>toast('Bitte den Tab über den Browser schließen'),400); };
$('bNew').onclick=()=>{ const b=$('bar2'); b.innerHTML=''; const lab=document.createElement('span'); lab.className='lbl'; lab.textContent='Vorlage:'; b.appendChild(lab);
  Object.keys(TEMPLATES).forEach(k=>{ const bt=document.createElement('button'); bt.className='btn'+(k==='Leeres Blatt'?' red':''); bt.textContent=k;
    bt.onclick=()=>{ if((data.parts.length||data.wires.length)&&k==='Leeres Blatt'&&!confirm('Alles löschen?')) return; pushUndo(); TEMPLATES[k](); dyn.clear(); res=null; sel=null; fitView(); changed(); }; b.appendChild(bt); });
  const x=document.createElement('button'); x.className='btn'; x.textContent='✕'; x.onclick=renderBar2; b.appendChild(x); };

/* ================= Bedienung auf der Zeichenfläche ================= */
function hit(gx,gy){ // Bauteile zuerst
  let best=null, bd=1e9;
  for(const p of data.parts){ const e=ends(p); let d=p.type==='npn'?Math.hypot(gx-toG(p,1.1,0)[0],gy-toG(p,1.1,0)[1])-0.35:distSeg(gx,gy,e.a,e.b); if(e.c) d=Math.min(d,distSeg(gx,gy,e.a,e.c)); if(d<0.45&&d<bd){ bd=d; best={part:p}; } }
  if(best) return best;
  for(const k of data.wires){ const [a,b]=edgeEnds(k); const d=distSeg(gx,gy,a,b); if(d<0.32&&d<bd){ bd=d; best={wire:k}; } }
  return best; }
function distSeg(px,py,a,b){ const vx=b[0]-a[0], vy=b[1]-a[1], L=vx*vx+vy*vy; let t=((px-a[0])*vx+(py-a[1])*vy)/L; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-a[0]-vx*t,py-a[1]-vy*t); }
function lPath(a,b,horizFirst){ const l=[]; const [x0,y0]=a, [x1,y1]=b; const hx=(y)=>{ const s=Math.min(x0,x1), e=Math.max(x0,x1); for(let x=s;x<e;x++) l.push(ekey(x,y,'h')); };
  const vy=(x)=>{ const s=Math.min(y0,y1), e=Math.max(y0,y1); for(let y=s;y<e;y++) l.push(ekey(x,y,'v')); };
  if(horizFirst){ hx(y0); vy(x1); } else { vy(x0); hx(y1); } return l; }
function placementFor(type,start,cur,moved){ let x,y,d;
  if(!moved){ x=Math.round(start[0])-1; y=Math.round(start[1]); d=0; }
  else { const A=[Math.round(start[0]),Math.round(start[1])], dx=cur[0]-start[0], dy=cur[1]-start[1];
    if(Math.abs(dx)>=Math.abs(dy)){ d=dx>0?0:2; x=dx>0?A[0]:A[0]-2; y=A[1]; } else { d=dy>0?1:3; x=A[0]; y=dy>0?A[1]:A[1]-2; } }
  return newPart(type,x,y,d); }
const ptrs=new Map(); let gest=null;
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const rect=cv.getBoundingClientRect(); const sx=e.clientX-rect.left, sy=e.clientY-rect.top; ptrs.set(e.pointerId,{sx,sy});
  if(ptrs.size===2){ ghost=null; const [p1,p2]=[...ptrs.values()]; gest={type:'pinch',d:Math.hypot(p1.sx-p2.sx,p1.sy-p2.sy),mx:(p1.sx+p2.sx)/2,my:(p1.sy+p2.sy)/2}; requestDraw(); return; }
  if(ptrs.size>2) return;
  const g=toGrid(sx,sy);
  if(tool==='sel'){ const h=hit(...g);
    if(h&&h.part){ gest={type:'move',part:h.part,start:g,sx,sy,moved:false,orig:{x:h.part.x,y:h.part.y}}; sel={part:h.part.id}; renderBar2(); }
    else if(h&&h.wire){ sel={wires:wireRun(h.wire)}; gest={type:'pan',sx,sy,ox:data.ox,oy:data.oy,moved:false,keepSel:true}; renderBar2(); }
    else { gest={type:'pan',sx,sy,ox:data.ox,oy:data.oy,moved:false}; } }
  else if(tool==='wire'){ gest={type:'wire',start:[Math.round(g[0]),Math.round(g[1])],sx,sy,hf:null}; }
  else if(tool==='erase'){ gest={type:'erase',did:false}; eraseAt(g); }
  else if(INFO[tool]){ gest={type:'place',start:g,sx,sy,moved:false}; ghost={parts:[placementFor(tool,g,g,false)]}; ghost.bad=!canPlace(ghost.parts[0]); }
  requestDraw(); });
cv.addEventListener('pointermove',e=>{ const pr=ptrs.get(e.pointerId); if(!pr||!gest) return; e.preventDefault();
  const rect=cv.getBoundingClientRect(); pr.sx=e.clientX-rect.left; pr.sy=e.clientY-rect.top; const {sx,sy}=pr; const g=toGrid(sx,sy);
  if(gest.type==='pinch'){ if(ptrs.size<2) return; const [p1,p2]=[...ptrs.values()]; const d=Math.hypot(p1.sx-p2.sx,p1.sy-p2.sy), mx=(p1.sx+p2.sx)/2, my=(p1.sy+p2.sy)/2;
    data.ox+=mx-gest.mx; data.oy+=my-gest.my; if(gest.d>10) zoomBy(d/gest.d,mx,my); gest.d=d; gest.mx=mx; gest.my=my; requestDraw(); return; }
  const far=Math.hypot(sx-gest.sx,sy-gest.sy)>8;
  if(gest.type==='pan'){ if(far) gest.moved=true; if(gest.moved){ data.ox=gest.ox+sx-gest.sx; data.oy=gest.oy+sy-gest.sy; requestDraw(); } }
  else if(gest.type==='move'){ if(far) gest.moved=true; if(!gest.moved) return; const dx=Math.round(g[0]-gest.start[0]), dy=Math.round(g[1]-gest.start[1]);
    const n={...gest.part,x:gest.orig.x+dx,y:gest.orig.y+dy}; ghost={parts:[n],bad:!canPlace(n,gest.part.id)}; requestDraw(); }
  else if(gest.type==='wire'){ const b=[Math.round(g[0]),Math.round(g[1])]; if(gest.hf===null&&(b[0]!==gest.start[0]||b[1]!==gest.start[1])) gest.hf=Math.abs(g[0]-gest.start[0])>=Math.abs(g[1]-gest.start[1]);
    ghost={wires:lPath(gest.start,b,gest.hf!==false)}; requestDraw(); }
  else if(gest.type==='erase'){ eraseAt(g); }
  else if(gest.type==='place'){ if(far) gest.moved=true; const p=placementFor(tool,gest.start,g,gest.moved&&Math.hypot(g[0]-gest.start[0],g[1]-gest.start[1])>0.6); ghost={parts:[p],bad:!canPlace(p)}; requestDraw(); } });
function endPtr(e){ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if(!gest){ return; }
  if(gest.type==='pinch'){ if(ptrs.size===0){ gest=null; sync(true); } return; }
  const G=gest; gest=null;
  if(G.type==='pan'){ if(G.moved) sync(true); else if(!G.keepSel){ sel=null; renderBar2(); } }
  else if(G.type==='move'){ const p=G.part;
    if(!G.moved){ if(p.type==='sw'){ pushUndo(); p.on=!p.on; changed(); toast(p.on?'Schalter geschlossen':'Schalter offen'); }
      else if(p.type==='sw2'){ pushUndo(); p.pos=p.pos?0:1; changed(); } }
    else if(ghost&&!ghost.bad){ const n=ghost.parts[0]; if(n.x!==p.x||n.y!==p.y){ pushUndo(); p.x=n.x; p.y=n.y; removeWiresUnder(p); changed(); } }
    else if(ghost&&ghost.bad) toast('Dort liegt schon ein Bauteil'); }
  else if(G.type==='wire'){ if(ghost&&ghost.wires&&ghost.wires.length){ pushUndo(); const n=addWireEdges(ghost.wires); if(!n) undoSt.pop(); updUndo(); changed(); } }
  else if(G.type==='erase'){ if(G.did) changed(); }
  else if(G.type==='place'){ const p=ghost&&ghost.parts[0]; if(p){ if(ghost.bad) toast('Dort liegt schon ein Bauteil'); else { pushUndo(); removeWiresUnder(p); data.parts.push(p); sel={part:p.id}; changed(); } } }
  ghost=null; requestDraw(); }
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const rect=cv.getBoundingClientRect(); zoomBy(e.deltaY<0?1.1:1/1.1,e.clientX-rect.left,e.clientY-rect.top); },{passive:false});
cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
let eraseUndoPushed=false;
function eraseAt(g){ const h=hit(...g); if(!h) return;
  if(!gest.did){ pushUndo(); gest.did=true; }
  if(h.part){ data.parts=data.parts.filter(q=>q!==h.part); }
  else { const run=new Set(wireRun(h.wire)); data.wires=data.wires.filter(k=>!run.has(k)); }
  dirty=true; sel=null; requestDraw(); }

/* ================= Bild: auf die Tafel / Zwischenablage ================= */
function renderImage(){ const b=bbox(); if(!b) return null; const cell=40, sc=2, m=1.6;
  const labels=(data.show.U||data.show.I||data.show.R)?1:0;
  const x0=b.x0-m-labels*0.4, y0=b.y0-m-labels*0.8, x1=b.x1+m+labels*1.8, y1=b.y1+m;
  const w=Math.ceil((x1-x0)*cell), h=Math.ceil((y1-y0)*cell);
  const c=document.createElement('canvas'); c.width=w*sc; c.height=h*sc; const g=c.getContext('2d'); g.setTransform(sc,0,0,sc,0,0);
  drawScene(g,{W:w,H:h,ox:-x0*cell,oy:-y0*cell,cell,grid:false,charges:false,selection:false});
  return {canvas:c,w,h}; }
function toBoard(){ const im=renderImage(); if(!im){ toast('Noch keine Schaltung gezeichnet'); return; }
  if(window.parent===window){ toast('Nur innerhalb der Tafel möglich'); return; }
  try{ parent.postMessage({type:'embed-image',url:im.canvas.toDataURL('image/png'),w:im.w,h:im.h},'*'); toast('Schaltung als Bild auf die Tafel gelegt'); }catch(e){ toast('Nicht möglich'); } }
function copyImage(){ const im=renderImage(); if(!im){ toast('Noch keine Schaltung gezeichnet'); return; }
  try{
    if(!navigator.clipboard||!window.ClipboardItem) throw new Error('x');
    const blob=new Promise(r=>im.canvas.toBlob(r,'image/png'));
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>toast('Bild in die Zwischenablage kopiert'),()=>toast('Kopieren wurde vom Browser verhindert'));
  }catch(e){ toast('Kopieren wird hier nicht unterstützt'); } }

/* ================= Sync ================= */
let syncT=null;
function post(){ syncT=null; if(window.parent===window){ try{ localStorage.setItem(LS_KEY,JSON.stringify(data)); }catch(e){} return; } try{ parent.postMessage({type:'embed-data',data},'*'); }catch(e){} }
function sync(now){ if(now){ clearTimeout(syncT); post(); return; } if(!syncT) syncT=setTimeout(post,300); }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return; if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return; const d=e.data.data, def=defaults();
  const sameCircuit=JSON.stringify(d.wires||null)===JSON.stringify(data.wires)&&JSON.stringify(d.parts||null)===JSON.stringify(data.parts);
  const keepSel=sel;
  data=Object.assign(def,d,{show:Object.assign(def.show,d.show||{})});
  if(!Array.isArray(data.wires)) data.wires=[]; if(!Array.isArray(data.parts)) data.parts=[];
  data.parts=data.parts.filter(p=>INFO[p.type]).map(p=>({...p,id:p.id||uid(),d:(p.d|0)%4}));
  if(!sameCircuit){ dyn.clear(); res=null; }                 // z. B. nur Schriftgröße aus dem Kontextmenü: Kondensator bleibt geladen
  document.documentElement.style.setProperty('--fs',Math.min(18,data.fontSize||14)+'px');
  if(!data.parts.length&&!data.wires.length&&!d.wires){ TEMPLATES['Einfacher Stromkreis'](); data.ox=null; }
  if(!isFinite(data.ox)||data.ox===null) data.ox=null;
  sel=sameCircuit?keepSel:null; dirty=true; renderBar2(); resize(); });
window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(cv);
setTool('sel'); updUndo(); renderBar2(); resize();
try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
if(window.parent===window){                               // eigenständig: zuletzt bearbeitete Schaltung wiederherstellen
  $('fClose').hidden=false; $('chBoard').hidden=true; document.title='Stromkreis';
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  if(saved&&Array.isArray(saved.parts)&&Array.isArray(saved.wires)&&(saved.parts.length||saved.wires.length)) applyFile(saved,false);
  else { TEMPLATES['Einfacher Stromkreis'](); fitView(); }
  dirty=true; renderBar2(); requestDraw(); }
</script>
