<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bruch</title>
<style>
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  #bar{flex:none;display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #e6eaf0;flex-wrap:wrap;font-size:13px;}
  #bar button,#bar select{border:1px solid #cfd6e0;background:#fff;border-radius:7px;padding:4px 9px;font:600 13px -apple-system,sans-serif;cursor:pointer;color:#1f2430;white-space:nowrap;}
  #bar button.on{background:#e8f0fe;border-color:#93b4f5;}
  #bar button.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  #bar button:disabled{opacity:.4;cursor:default;}
  #tabs{display:inline-flex;border:1px solid #cfd6e0;border-radius:8px;overflow:hidden;}
  #tabs button{border:0;border-radius:0;border-right:1px solid #cfd6e0;}
  #tabs button:last-child{border-right:0;}
  #tabs button.on{background:#2563eb;color:#fff;}
  .sep{width:1px;align-self:stretch;background:#e6eaf0;margin:0 2px;}
  #shotBtns{display:inline-flex;gap:5px;margin-left:auto;}
  .fr{display:inline-flex;flex-direction:column;align-items:center;gap:2px;}
  .fr input{width:calc(var(--fs,16px)*3.2);text-align:center;font:800 calc(var(--fs,16px)*1.05) -apple-system,sans-serif;border:1px solid #cfd6e0;border-radius:7px;padding:2px;color:#1f2430;}
  .fr .fbar{width:calc(var(--fs,16px)*3.2);height:2px;background:#1f2430;}
  #area{flex:1;position:relative;min-height:0;}
  #cv{position:absolute;inset:0;width:100%;height:100%;}
  #hint{position:absolute;left:8px;bottom:6px;font-size:12px;color:#8a93a2;pointer-events:none;}
  .grp{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;}
  #bar .kin{width:52px;text-align:center;font:700 13px -apple-system,sans-serif;border:1px solid #cfd6e0;border-radius:7px;padding:4px;color:#1f2430;}
  #bar button .uico{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .stp{display:inline-flex;align-items:center;gap:2px;}
  .stp button{width:26px;height:28px;border:1px solid #cfd6e0;border-radius:7px;background:#fff;font:800 16px -apple-system,sans-serif;line-height:1;cursor:pointer;color:#1f2430;padding:0;}
  .stp button:active{background:#e8f0fe;}
  #msg{font-size:12.5px;color:#64748b;} #msg.err{color:#dc2626;}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="tabs">
      <button type="button" data-t="1" class="on">Intro</button>
      <button type="button" data-t="2">Darstellung</button>
      <button type="button" data-t="3">Anteile</button>
      <button type="button" data-t="4">Verteilen</button>
      <button type="button" data-t="5">Bruchzahl</button>
      <button type="button" data-t="6">Vergleichen</button>
      <button type="button" data-t="7">+ und −</button>
      <button type="button" data-t="8">· und :</button>
    </span>
    <span class="sep"></span>
    <button type="button" id="bShape" title="Zwischen Kreis und Rechteck wechseln">◯ Kreis</button>
    <select id="skin" title="Aussehen der gefüllten Teile"><option value="plain">einfarbig</option><option value="pizza">🍕 Pizza</option><option value="kuchen">🍰 Kuchen</option><option value="schoko">🍫 Schokolade</option></select>
    <span class="grp" id="g5" hidden>
      <select id="zm" title="Was soll gezeigt werden?"><option value="1">Bruch zeigen</option><option value="2">Wert ablesen</option></select>
      <label style="display:inline-flex;gap:4px;align-items:center;font-weight:600"><input type="checkbox" id="cZval"> Wert anzeigen</label>
      <span id="zG1" style="display:inline-flex;align-items:center;gap:6px"><span class="fr"><input id="zz" type="number" min="0" value="5" inputmode="numeric"><span class="fbar"></span><input id="nz" type="number" min="1" value="4" inputmode="numeric"></span>
      <span style="color:#64748b;margin-left:16px">Zahlenstrahl bis</span><input id="mz" class="kin" type="number" min="1" max="8" value="2" inputmode="numeric"></span>
      <span id="zG2" hidden style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="color:#64748b">von</span><input id="zA" class="kin" type="number" min="-20" max="20" value="0" inputmode="numeric">
        <span style="color:#64748b">bis</span><input id="zB" class="kin" type="number" min="-19" max="21" value="2" inputmode="numeric">
        <span style="color:#64748b">in</span><input id="zT" class="kin" type="number" min="1" max="20" value="4" inputmode="numeric"><span style="color:#64748b">Teile</span></span>
      <label style="display:inline-flex;gap:4px;align-items:center;font-weight:600"><input type="checkbox" id="cMix" checked> gemischte Zahl</label>
      <label style="display:inline-flex;gap:4px;align-items:center;font-weight:600"><input type="checkbox" id="cDec2"> Dezimalbruch</label>
    </span>
    <span class="grp" id="g4" hidden>
      <input id="qz" class="kin" type="number" min="1" max="8" value="2" inputmode="numeric">
      <span style="color:#64748b">Ganze auf</span>
      <input id="qn" class="kin" type="number" min="1" max="8" value="3" inputmode="numeric">
      <span style="color:#64748b">Personen</span>
      <button type="button" id="qAuto" title="Alle Stücke gleichmäßig verteilen">alles verteilen</button>
      <button type="button" id="qReset" title="Verteilung zurücknehmen"><svg viewBox="0 0 24 24" class="uico"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    </span>
    <span class="grp" id="g1">
      <span style="color:#64748b">Ein Ganzes in</span><input id="iN" class="kin" type="number" min="1" max="24" value="4" inputmode="numeric"><span style="color:#64748b">Teile teilen.</span>
      <button type="button" id="iClr" title="Auswahl zurücksetzen">zurücksetzen</button>
      <label style="display:inline-flex;gap:4px;align-items:center;font-weight:600"><input type="checkbox" id="iShow"> Bruch anzeigen</label>
    </span>
    <span class="grp" id="g3" hidden>
      <select id="tm" title="Was ist gesucht?"><option value="1">Bruchteil gesucht</option><option value="2">Ganzes gesucht</option></select>
      <span class="fr"><input id="ta" type="number" min="0" value="2" inputmode="numeric"><span class="fbar"></span><input id="tb" type="number" min="1" value="3" inputmode="numeric"></span>
      <span id="tvon" style="color:#64748b">von</span>
      <label style="display:inline-flex;gap:4px;align-items:center;font-weight:600;order:9"><input type="checkbox" id="cPicA"> Veranschaulichung</label>
      <label style="display:inline-flex;gap:4px;align-items:center;font-weight:600;order:9"><input type="checkbox" id="cCalc"> Rechenweg</label>
      <select id="tq" title="Größe">
        <option value="zeit">Zeit</option><option value="masse">Masse</option><option value="vol">Volumen</option>
        <option value="laenge">Länge</option><option value="flaeche">Fläche</option><option value="geld">Geld</option>
      </select>
      <input id="tv" class="kin num" type="text" min="0" value="1" inputmode="decimal" title="Maßzahl">
      <select id="tu" title="Einheit"></select>
      <span id="stepRow" hidden><button type="button" id="bS1">Schritt 1</button><button type="button" id="bS2">Schritt 2</button></span>
    </span>
    <span class="grp" id="g2" hidden>
      <span class="fr"><input id="z" type="number" min="0" value="1" inputmode="numeric"><span class="fbar"></span><input id="n" type="number" min="1" value="2" inputmode="numeric"></span>
      <button type="button" id="bExp" title="Zähler und Nenner mit der Zahl malnehmen">Erweitern ·</button>
      <input id="k" class="kin" type="number" min="2" value="2" inputmode="numeric">
      <button type="button" id="bRed" title="Zähler und Nenner durch die Zahl teilen">Kürzen :</button>
      <button type="button" id="bGgt" title="So weit wie möglich kürzen">ganz kürzen</button>
      <label style="display:inline-flex;gap:4px;align-items:center;font-weight:600"><input type="checkbox" id="cPic"> Darstellung</label>
      <label style="display:inline-flex;gap:4px;align-items:center;font-weight:600"><input type="checkbox" id="cDec"> Dezimalbruch</label>
    </span>
    <span class="grp" id="g6" hidden>
      <span class="fr"><input id="av" type="number" value="2" inputmode="numeric"><span class="fbar"></span><input id="bv" type="number" min="1" value="3" inputmode="numeric"></span>
      <span style="font-weight:800;font-size:1.2em">?</span>
      <span class="fr"><input id="cvv" type="number" value="3" inputmode="numeric"><span class="fbar"></span><input id="dv" type="number" min="1" value="4" inputmode="numeric"></span>
      <button type="button" id="bVshow" title="Bilder zu den Brüchen zeigen">👁 Bilder</button>
      <span style="color:#64748b">erweitern ·</span><input id="kv" class="kin" type="number" min="2" value="2" inputmode="numeric">
      <button type="button" id="bVa">links</button><button type="button" id="bVb">rechts</button><button type="button" id="bVr" title="Erweiterungen zurücknehmen"><svg viewBox="0 0 24 24" class="uico"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button type="button" id="bVrel" title="Zeichen &lt;, &gt; oder = einsetzen">Zeichen</button>
    </span>
    <span class="grp" id="g7" hidden>
      <span class="fr"><input id="a2" type="number" value="1" inputmode="numeric"><span class="fbar"></span><input id="b2" type="number" min="1" value="2" inputmode="numeric"></span>
      <select id="op2"><option value="+">+</option><option value="−">−</option></select>
      <span class="fr"><input id="c2" type="number" value="1" inputmode="numeric"><span class="fbar"></span><input id="d2" type="number" min="1" value="3" inputmode="numeric"></span>
      <span class="sep"></span>
      <span style="color:#64748b">erweitern ·</span><input id="k2" class="kin" type="number" min="2" value="2" inputmode="numeric">
      <button type="button" id="bE2a" title="Linken Bruch erweitern">links</button>
      <button type="button" id="bE2b" title="Rechten Bruch erweitern">rechts</button>
      <button type="button" id="bE2r" title="Erweiterungen zurücknehmen"><svg viewBox="0 0 24 24" class="uico"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    </span>
    <span class="grp" id="g8" hidden>
      <span class="fr"><input id="a3" type="number" value="1" inputmode="numeric"><span class="fbar"></span><input id="b3" type="number" min="1" value="2" inputmode="numeric"></span>
      <select id="op3"><option value="·">·</option><option value=":">:</option></select>
      <span class="fr"><input id="c3" type="number" value="2" inputmode="numeric"><span class="fbar"></span><input id="d3" type="number" min="1" value="3" inputmode="numeric"></span>
    </span>
    <span id="msg"></span>
    <span id="shotBtns"><button type="button" id="fsM" title="Schrift kleiner">A−</button><button type="button" id="fsP" title="Schrift größer">A+</button></span>
  </div>
  <div id="area"><canvas id="cv"></canvas><div id="hint"></div></div>
</div>
<script src="shot.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d');
const BLUE='#3b82f6', RED='#ef4444', PURPLE='#7c3aed', EMPTY='#eef2f8', LINE='#1f2430';
let D={ v:10, tab:1, iN:4, iSel:[], iShow:false, pic1:false, skin:'plain', ta:2, tb:3, tq:'zeit', tu:1, tv:1, tmode:1, tpic:false, tstep:0, calc:false, qz:2, qn:3, qAss:[], zz:5, nz:4, mz:2, mix:true, zmode:1, zA:0, zB:2, zT:4, zPos:3, zShow:false, shape:'circle', dec:false, av:2,bv:3,cvv:3,dv:4, eva:1,evb:1, kv:2, vshow:false, vrel:false, z:1, n:2, base:2, k:2, a2:1,b2:2,op2:'+',c2:1,d2:3, e2a:1, e2b:1, k2:2, a3:1,b3:2,op3:'·',c3:2,d3:3, fontSize:16, fontBold:false, fontItalic:false };
const toast=m=>window.TafelShot?TafelShot.toast(m):null;
const setMsg=(t,c)=>{ $('msg').textContent=t||''; $('msg').className=c||''; };
const gcd=(a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
const fmtNum=v=>String(Math.round(v*1e4)/1e4).replace('.',',');
const shortFrac=(p,q)=>{ const g=gcd(Math.abs(p)||1,Math.abs(q)||1), P=p/g, Q=q/g; return (Q===1)?String(P):(P+'/'+Q); };
const redTail=(p,q)=>{ const t=shortFrac(p,q); return (t===(p+'/'+q))?'':('  =  '+t); };   // gekürzte Form nur zeigen, wenn sie anders aussieht
const iv=(id,def,min)=>{ let v=Math.floor(+$(id).value); if(!isFinite(v)) v=def; if(min!==undefined&&v<min) v=min; return v; };

/* ---------- Zeichnen ---------- */
/* immer gleicher Zufall – die Verzierung sitzt fest und wandert beim Erweitern nicht */
const rnd=(seed)=>{ let t=seed*16807%2147483647; return ()=>((t=t*16807%2147483647)/2147483647); };
/* abgerundetes Rechteck (ohne ctx.roundRect – das kennen ältere Safari-Versionen nicht) */
function rrect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
/* Die ganze Pizza bzw. Torte wird am Stück gestaltet; die Einteilung machen danach die Striche. */
function foodWhole(shape,x,y,w,h,cx,cy,R,skin,n){ const r=rnd(7);
  const blob=(px,py,rad,col,parts)=>{ ctx.fillStyle=col;
    for(let k=0;k<(parts||3);k++){ ctx.beginPath();
      ctx.ellipse(px+(r()-0.5)*rad*0.9, py+(r()-0.5)*rad*0.9, rad*(0.6+0.5*r()), rad*(0.5+0.5*r()), r()*3.14, 0, 7); ctx.fill(); } };
  const circle=(shape==='circle'), sz=circle?R:Math.min(w,h);
  ctx.save();
  if(circle){ ctx.beginPath(); ctx.arc(cx,cy,R,0,7); } else { ctx.beginPath(); ctx.rect(x,y,w,h); }
  ctx.clip();
  if(skin==='pizza'){
    ctx.fillStyle='#e4632f'; ctx.fill();                                  // Tomatensauce
    const cheese=circle?13:Math.max(6,Math.round(w/h*5));
    for(let k=0;k<cheese;k++){ let px,py;
      if(circle){ const a=(k+0.5)*6.283/cheese+(r()-0.5)*0.6, rr=R*(0.25+0.5*((k%3)/2))+R*0.08*(r()-0.5);   // gleichmäßig über die Pizza
        px=cx+rr*Math.cos(a); py=cy+rr*Math.sin(a); }
      else { px=x+w*(0.06+0.88*r()); py=y+h*(0.18+0.64*r()); }
      blob(px,py,sz*(circle?0.16:0.22),'rgba(250,226,150,.92)',3); }
    if(circle){ ctx.beginPath(); ctx.arc(cx,cy,R*0.985,0,7); ctx.lineWidth=Math.max(4,R*0.1); ctx.strokeStyle='#e8b571'; ctx.stroke(); }
    else { const cb=Math.max(3,h*0.11); ctx.fillStyle='#e8b571'; ctx.fillRect(x,y,w,cb); ctx.fillRect(x,y+h-cb,w,cb); }
    const pep=circle?9:Math.max(5,Math.round(w/h*4));
    for(let k=0;k<pep;k++){ let px,py;
      if(circle){ const a=(k+0.25)*6.283/pep+(r()-0.5)*0.5, rr=R*(0.3+0.45*((k%2)?0.2:0.85))+R*0.06*(r()-0.5);
        px=cx+rr*Math.cos(a); py=cy+rr*Math.sin(a); }
      else { px=x+w*(0.07+0.86*r()); py=y+h*(0.22+0.56*r()); }
      const rad=Math.max(3,sz*(circle?0.085:0.14));
      ctx.beginPath(); ctx.arc(px,py,rad,0,7); ctx.fillStyle='#b9272a'; ctx.fill();
      ctx.beginPath(); ctx.arc(px-rad*0.25,py-rad*0.25,rad*0.28,0,7); ctx.fillStyle='rgba(255,215,170,.65)'; ctx.fill(); }
    ctx.restore(); return; }
  if(skin==='schoko'){
    if(circle){ ctx.fillStyle='#4a2c19'; ctx.fill();                                     // Schokoguss
      ctx.beginPath(); ctx.arc(cx-R*0.32,cy-R*0.34,R*0.46,0,7); ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,R*0.955,0,7); ctx.lineWidth=Math.max(3,R*0.09); ctx.strokeStyle='#7a4e2c'; ctx.stroke();   // Kuchenrand
      for(let k=0;k<40;k++){ const a=r()*6.283, rr=R*0.72*Math.sqrt(r()), px=cx+rr*Math.cos(a), py=cy+rr*Math.sin(a), ln=Math.max(2.5,R*0.085);
        ctx.strokeStyle='rgba(186,130,78,.7)'; ctx.lineWidth=Math.max(1.2,R*0.022); ctx.beginPath();        // Schokoraspel
        ctx.moveTo(px,py); ctx.lineTo(px+ln*Math.cos(a*2),py+ln*Math.sin(a*2)); ctx.stroke(); }
      const cnt=8, sr=Math.max(4,R*0.14);
      for(let k=0;k<cnt;k++){ const a=-Math.PI/2+(k+0.5)*2*Math.PI/cnt, sx=cx+R*0.72*Math.cos(a), sy=cy+R*0.72*Math.sin(a);
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(a+Math.PI/2);                                          // Schokoröllchen
        ctx.fillStyle='#2e1a0e'; rrect(-sr*0.85,-sr*0.45,sr*1.7,sr*0.9,sr*0.32); ctx.fill();
        ctx.fillStyle='#8a5a33'; rrect(-sr*0.85,-sr*0.45,sr*1.7,sr*0.34,sr*0.17); ctx.fill(); ctx.restore(); } }
    else { ctx.fillStyle='#38200f'; ctx.fill();                                          // Zwischenräume der Tafel
      const cols2=Math.max(1,Math.min(40,n||4)), pw=w/cols2;                              // ein Stück je Teil (Nenner)
      const rows2=Math.max(1,Math.min(8,Math.round(h/pw))), ph=h/rows2;                   // Reihen so, dass die Stücke etwa quadratisch sind
      const m=Math.max(0.8,Math.min(pw,ph)*0.1), t=Math.max(1,Math.min(pw,ph)*0.12);
      for(let c=0;c<cols2;c++) for(let q=0;q<rows2;q++){ const px=x+c*pw, py=y+q*ph;
        ctx.fillStyle='#6d4426'; ctx.fillRect(px+m,py+m,pw-2*m,ph-2*m);                                     // Schokostück
        ctx.fillStyle='rgba(255,236,210,.18)'; ctx.fillRect(px+m,py+m,pw-2*m,t); ctx.fillRect(px+m,py+m,t,ph-2*m);
        ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(px+m,py+ph-m-t,pw-2*m,t); ctx.fillRect(px+pw-m-t,py+m,t,ph-2*m); } }
    ctx.restore(); return; }
  /* Kuchen */
  ctx.fillStyle='#c98b52'; ctx.fill();
  if(circle){ ctx.beginPath(); ctx.arc(cx,cy,R*0.955,0,7);                                        // schmaler Zuckerguss-Rand
      ctx.lineWidth=Math.max(3,R*0.09); ctx.strokeStyle='#f6e7d2'; ctx.stroke();
    const cnt=Math.max(4,Math.min(n||8,8)), sr=Math.max(5,R*0.135);
    for(let k=0;k<cnt;k++){ const a=-Math.PI/2+(k+0.5)*2*Math.PI/cnt, sx=cx+R*0.72*Math.cos(a), sy=cy+R*0.72*Math.sin(a);
      ctx.fillStyle='#fffaf2';                                            // Sahnehäubchen
      for(let m=0;m<3;m++){ ctx.beginPath(); ctx.arc(sx+(m-1)*sr*0.5,sy+Math.abs(m-1)*sr*0.22,sr*(m===1?0.9:0.66),0,7); ctx.fill(); }
      ctx.beginPath(); ctx.arc(sx,sy-sr*0.42,sr*0.75,0,7); ctx.fillStyle='#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(sx,sy-sr*0.9,sr*0.46,0,7); ctx.fillStyle='#c81e2b'; ctx.fill();      // Kirsche
      ctx.strokeStyle='#4b7f35'; ctx.lineWidth=Math.max(1.3,sr*0.15); ctx.beginPath();
      ctx.moveTo(sx,sy-sr*1.28); ctx.quadraticCurveTo(sx+sr*0.45,sy-sr*1.8,sx+sr*0.75,sy-sr*1.42); ctx.stroke(); } }
  else { const gl=Math.max(4,h*0.18); ctx.fillStyle='#f3e3cf'; ctx.fillRect(x,y,w,gl);
    const fruit=['#c81e2b','#8e2b6b','#e07a1f','#c81e2b','#7a1f52'];
    const cnt=Math.max(9,Math.min(36,Math.round(w/h*9))), rowsF=3, colsF=Math.ceil(cnt/rowsF);   // gleichmäßig verteilt, leicht versetzt
    for(let k=0;k<cnt;k++){ const cI=k%colsF, rI=Math.floor(k/colsF)%rowsF;
      const px=x+w*((cI+0.5+(r()-0.5)*0.55)/colsF), py=y+gl+(h-gl)*((rI+0.5+(r()-0.5)*0.45)/rowsF), rad=Math.max(2.2,Math.min(h*0.085,w*0.018));
      ctx.beginPath(); ctx.arc(px,py,rad,0,7); ctx.fillStyle=fruit[k%fruit.length]; ctx.fill();
      ctx.beginPath(); ctx.arc(px-rad*0.3,py-rad*0.3,rad*0.3,0,7); ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fill(); } }
  ctx.restore(); }
function drawShape(x,y,w,h,shape,n,cols,opt){ opt=opt||{}; if(!(w>2&&h>2)) return;

/* ---------- Reiter „Anteile und Bruchteile": Anteil von einem Ganzen ---------- */
/* Größen mit ihren Einheiten; f = Faktor zur nächstkleineren Einheit (0 = keine mehr) */
const QTY={
  zeit:{name:'Zeit',pic:'clock',def:1,units:[{u:'d',f:24},{u:'h',f:60},{u:'min',f:60},{u:'s',f:0}]},
  masse:{name:'Masse',pic:'meat',def:1,units:[{u:'t',f:1000},{u:'kg',f:1000},{u:'g',f:1000},{u:'mg',f:0}]},
  vol:{name:'Volumen',pic:'jar',def:1,units:[{u:'hl',f:100},{u:'l',f:1000},{u:'ml',f:0}]},
  laenge:{name:'Länge',pic:'ruler',def:1,units:[{u:'km',f:1000},{u:'m',f:100},{u:'cm',f:10},{u:'mm',f:0}]},
  flaeche:{name:'Fläche',pic:'area',def:3,units:[{u:'km²',f:100},{u:'ha',f:10000},{u:'a',f:100},{u:'m²',f:100},{u:'dm²',f:100},{u:'cm²',f:100},{u:'mm²',f:0}]},

const isWhole=v=>Math.abs(v-Math.round(v))<1e-6*Math.max(1,Math.abs(v));

function partResult(val,q,ui){ const us=QTY[q].units; let v=val, i=ui;

  return {v:Math.round(v),u:us[i].u,i:i}; }

  return (m<1.5?1:(m<3.5?2:(m<7.5?5:10)))*e; };

function partLines(n,fn){ if(!(n>1&&n<=60)) return; ctx.save();

  for(let k=1;k<n;k++) fn(k/n); ctx.restore(); }
function drawClockPic(x,y,sz,fill,have,lines){ const R=sz/2, cx=x+sz/2, cy=y+sz/2;
  const sect=(t0,t1,col)=>{ if(!(t1>t0)) return; ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,-Math.PI/2+t0*2*Math.PI,-Math.PI/2+t1*2*Math.PI); ctx.closePath(); ctx.fillStyle=col; ctx.fill(); };
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fillStyle='#fff'; ctx.fill();
  if(have<1-1e-9) sect(0,have,'rgba(59,130,246,.16)');                   // nur dieser Teil gehört zum Ganzen

/* eine Uhr zeigt eine Stunde (bei Minuten/Sekunden die nächstgrößere Einheit) */
const CLOCK_BASE={d:1,h:1,min:60,s:60};
function drawClocks(xPic,yMid,picW,picH,total,unit,f,parts,fs){

function drawJarPic(x,y,w,h,f,total,cap,unit,fs,parts,noScale){ const topW=w, botW=w*0.74, x0=x+(w-topW)/2;

  ctx.restore(); path(); ctx.strokeStyle=LINE; ctx.lineWidth=2.4; ctx.stroke();
  if(!noScale){ ctx.fillStyle='#8a93a2'; ctx.font='600 '+Math.max(8,fs*0.6)+'px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText(unit,x+w/2,y-fs*0.55); } }
/* Maßband: das Ganze über die volle Breite, Bruchteil farbig */
function drawRulerPic(x,y,w,h,f,total,cap,unit,fs,parts,noScale){ const L=w*total/(cap||total||1), part=L*Math.max(0,Math.min(1,f));

function drawMeatPic(x,y,w,h,f,parts){ const r=h/2, cut=x+Math.max(0,Math.min(1,f))*w;

function drawTabA(w,h){ const fs=D.fontSize, a=Math.max(0,D.ta), b=Math.max(1,D.tb);

    lines=(a===1)?[b+'/'+b+' sind '+F(part)+' · '+b+' '+eq+' '+F(whole)]
      : (b===1)?['1/1 sind '+F(part)+' : '+a+' '+eq+' '+F(whole)]

  }

  let satz;
  if(mode2) satz=[{t:done?(a+'/'+b+' sind '+given+'   →   das Ganze '+eq+' '+F(whole))
                        :(a+'/'+b+' sind '+given+'   →   Wie groß ist das Ganze?')}];
  else if(!done) satz=[{t:a+'/'+b+' von '+given+'   →   Wie groß ist der Bruchteil?'}];
  else satz=[{t:a+'/'+b,cap:'Anteil'},{t:'  von  '},{t:given,cap:'das Ganze'},{t:'  '+eq+'  '},{t:F(part),col:PURPLE,cap:'Bruchteil'}];
  drawSteps(w,h,fs,steps,ops,lines,satz,vis,show,Q,us[ui].u,b,wholeUi,amount); }
/* Ergebniszeile aus Teilen – unter den Kernstücken stehen die Fachbegriffe */
function drawSatz(parts,w,y,size,maxW){ const font=s2=>(D.fontItalic?'italic ':'')+(D.fontBold?'800 ':'700 ')+s2+'px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.save(); let s2=size, tot=0;

  meas(); while(s2>9&&tot>maxW){ s2-=1; meas(); }

    x+=pw; });
  ctx.restore(); return s2; }
/* die Schritte nebeneinander: Bild, Bruch, Wert – dazwischen die Rechenzeichen */
function drawSteps(w,h,fs,steps,ops,lines,satz,vis,show,Q,unit,b,wholeUi,givenUi){
  const cols=steps.length, slot=w/cols, one=(vis===0);
  const noScale=(Q.pic==='ruler'||Q.pic==='jar')&&(!one||D.tmode===2);  // zu klein bei mehreren Bildern – und beim gesuchten Ganzen verrät sie die Lösung
  const nLines=(D.calc?Math.min(vis,lines.length):0), caps=satz.some(p=>p.cap);

      if(Q.pic==='clock'&&one) drawWholePic(cx,yPic,picW,picH,bandW,Q,1,givenUi,unit,fs,1,noScale);   // Uhr: erst nur das Gegebene
      else drawWholePic(cx,yPic,picW,picH,bandW,Q,st.z/b,wholeUi,unit,fs,b,noScale); }
    fracLabel(st.z,b,cx,yFrac,fs*1.3,st.col);

    if(i<vis) label(ops[i],slot*(i+1),yVal,fs*1.15,'#475569'); });
  let y=ySub+fs*1.9;
  for(let i=0;i<nLines;i++){ labelFit(lines[i],w/2,y,fs*1.0,'#8a93a2',w-16); y+=fs*1.7; }
  drawSatz(satz,w,Math.min(h-fs*(caps?1.7:0.9),y),fs*1.3,w-16); }

/* ---------- Reiter „Verteilen": Stücke von oben auf die Teller unten ziehen ---------- */
const PCOL=['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d'];
const qTotal=()=>Math.max(1,Math.min(8,D.qz))*Math.max(1,Math.min(8,D.qn));
function qCheck(){ if(!Array.isArray(D.qAss)||D.qAss.length!==qTotal()) D.qAss=new Array(qTotal()).fill(-1); }
const qCount=p=>D.qAss.filter(v=>v===p).length;
let qDrag=null;
function drawTabQ(w,h){ qCheck();
  const fs=D.fontSize, z=Math.max(1,Math.min(8,D.qz)), n=Math.max(1,Math.min(8,D.qn));
  const cap=fs*1.2, botT=fs*3.2, lab=fs*1.3;
  const topH=Math.max(30,(h-botT-cap*2-lab)*0.46), botH=Math.max(30,(h-botT-cap*2-lab)*0.54);
  const top=cap*1.1, mid=top+topH+cap;
  const food=D.skin&&D.skin!=='plain';
  /* obere Reihe: die ganzen Stücke */
  const gap=fs*0.7, availW=w-gap*(z+1);
  const sw1=Math.max(24,Math.min(availW/z, D.shape==='circle'?topH:topH/0.62)), sh1=D.shape==='circle'?sw1:sw1*0.62;
  const x0=(w-(z*sw1+(z-1)*gap))/2, y1=top+Math.max(0,(topH-sh1)/2);
  D._qTop=[];
  for(let i=0;i<z;i++){ const cols=[];
    for(let k=0;k<n;k++){ const a=D.qAss[i*n+k]; cols.push(a>=0?null:(food?'#000':BLUE)); }
    const bx=x0+i*(sw1+gap);
    drawShape(bx,y1,sw1,sh1,D.shape,n,cols,{skin:D.skin});
    D._qTop.push({x:bx,y:y1,w:sw1,h:sh1,i}); }
  labelFit((z===1?'1 Ganzes':z+' Ganze')+' – jedes in '+n+' Teile geschnitten · Teil nach unten ziehen',w/2,cap*0.5,fs*0.8,'#8a93a2',w-16);
  /* untere Reihe: die Teller */
  const whole=Math.max(1,Math.ceil(z/n)), gap2=fs*0.5, cellW=(w-gap2*(n+1))/n;
  const sw2=Math.max(18,Math.min(cellW/whole-gap2*0.4, D.shape==='circle'?botH-lab:(botH-lab)/0.62));
  const sh2=D.shape==='circle'?sw2:sw2*0.62, y2=mid+Math.max(0,(botH-lab-sh2)/2);
  D._qPlates=[];
  for(let p=0;p<n;p++){ const cx0=gap2+p*(cellW+gap2)+(cellW-(whole*sw2+(whole-1)*gap2*0.4))/2, got=qCount(p);
    for(let q=0;q<whole;q++){ const cnt=Math.max(0,Math.min(n,got-q*n));
      drawShape(cx0+q*(sw2+gap2*0.4),y2,sw2,sh2,D.shape,n,fillCols(n,cnt,PCOL[p%PCOL.length]),{skin:D.skin,tint:true}); }
    const bw=whole*sw2+(whole-1)*gap2*0.4;
    if(qDrag&&qDrag.over===p){ ctx.save(); ctx.strokeStyle=PCOL[p%PCOL.length]; ctx.lineWidth=3; ctx.setLineDash([6,5]);
      ctx.strokeRect(cx0-6,y2-6,bw+12,sh2+12); ctx.restore(); }
    labelFit('Person '+(p+1)+(got?('  ·  '+got+'/'+n):''),cx0+bw/2,y2+sh2+fs*0.8,fs*0.78,PCOL[p%PCOL.length],cellW);
    D._qPlates.push({x:cx0-6,y:y2-6,w:bw+12,h:sh2+12+fs,p}); }
  /* gezogenes Stück am Finger */
  if(qDrag&&qDrag.moved){ const r=Math.max(14,sw1*0.32);
    ctx.save(); ctx.translate(qDrag.x,qDrag.y);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,-0.5,0.5); ctx.closePath();
    ctx.fillStyle=food?'#e4632f':BLUE; ctx.globalAlpha=0.92; ctx.fill();
    ctx.strokeStyle=LINE; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); }
  const offen=D.qAss.filter(v=>v<0).length, gz=Math.floor(z/n), rest=z-gz*n, g=gcd(rest||1,n);
  let res=z+'/'+n+redTail(z,n);
  if(z>n&&rest>0) res+='  =  '+gz+' '+(rest/g)+'/'+(n/g); else if(z>n&&rest===0) res+='  =  '+gz;
  const fair=D.qAss.every(v=>v>=0)&&[...Array(n).keys()].every(p=>qCount(p)===z);
  labelFit(fair?('Jeder hat gleich viel bekommen: '+z+' von '+n+' Teilen, also '+z+'/'+n+'.')
    :(offen?(offen+' Teil(e) sind noch zu verteilen.'):'Noch nicht gleichmäßig verteilt – der Rückgängig-Pfeil setzt zurück.'),
    w/2,h-fs*2.4,fs*0.8,fair?'#16a34a':'#8a93a2',w-16);
  labelFit(z+' : '+n+'  =  '+res,w/2,h-fs*1.05,fs*1.15,LINE,w-16); }
/* welches Teilstück liegt unter dem Finger? */
function qHitTop(x,y){ if(!D._qTop) return null; const n=Math.max(1,Math.min(8,D.qn));
  for(const t of D._qTop){ if(x<t.x||x>t.x+t.w||y<t.y||y>t.y+t.h) continue;
    let k;
    if(D.shape==='circle'){ const R=Math.min(t.w,t.h)/2, cx=t.x+t.w/2, cy=t.y+t.h/2, dx=x-cx, dy=y-cy;
      if(Math.hypot(dx,dy)>R) continue;
      let a=Math.atan2(dy,dx)+Math.PI/2; if(a<0) a+=2*Math.PI; k=Math.floor(a/(2*Math.PI/n))%n; }
    else k=Math.min(n-1,Math.floor((x-t.x)/(t.w/n)));
    const idx=t.i*n+k; return (D.qAss[idx]<0)?idx:null; }
  return null; }
function qHitPlate(x,y){ if(!D._qPlates) return -1;
  for(const pl of D._qPlates) if(x>=pl.x&&x<=pl.x+pl.w&&y>=pl.y&&y<=pl.y+pl.h) return pl.p;
  return -1; }

/* ---------- Reiter „Bruchzahl": der Bruch als Zahl auf dem Zahlenstrahl ---------- */
function drawTabZ(w,h){ if(D.zmode===2) return drawTabZ2(w,h);
  const fs=D.fontSize, n=Math.max(1,D.nz), z=Math.max(0,D.zz), M=Math.max(1,Math.min(8,D.mz));
  const x0=fs*2.2, x1=w-fs*2.2, y=h*0.56, W=x1-x0, unit=W/M, val=z/n;
  ctx.strokeStyle=LINE; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  const ah=Math.max(8,fs*0.7);                                     // Pfeilspitze
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x1-ah,y-ah*0.55); ctx.moveTo(x1,y); ctx.lineTo(x1-ah,y+ah*0.55); ctx.stroke();
  const px=v=>x0+v*unit;
  const total=M*n, small=Math.max(5,Math.min(11,fs*0.55));
  if(total<=200){ ctx.lineWidth=1.2; ctx.strokeStyle='#64748b';
    for(let i=0;i<=total;i++){ if(i%n===0) continue; const x=px(i/n);
      ctx.beginPath(); ctx.moveTo(x,y-small); ctx.lineTo(x,y+small); ctx.stroke(); } }
  ctx.lineWidth=2.4; ctx.strokeStyle=LINE;
  for(let i=0;i<=M;i++){ const x=px(i), one=(i===1);                 // die Eins hervorheben: das Ganze
    ctx.save(); if(one){ ctx.strokeStyle=RED; ctx.lineWidth=3.6; }
    ctx.beginPath(); ctx.moveTo(x,y-small*(one?2.3:1.9)); ctx.lineTo(x,y+small*(one?2.3:1.9)); ctx.stroke(); ctx.restore();
    label(String(i),x,y+small*2.3+fs*1.0,fs*(one?1.25:0.95),one?RED:LINE); }
  const mx=px(Math.min(val,M));
  if(D.zShow){                                                       // Markierung und Bruch erst mit dem Haken
    if(val<=M){ ctx.save(); ctx.strokeStyle=BLUE; ctx.lineWidth=Math.max(6,fs*0.5); ctx.lineCap='butt';   // Anteil von 0 bis zum Bruch
      ctx.beginPath(); ctx.moveTo(x0,y-small*2.6); ctx.lineTo(px(val),y-small*2.6); ctx.stroke(); ctx.restore(); }
    ctx.save(); ctx.strokeStyle=BLUE; ctx.lineWidth=2.6;                                                 // Marke für den Bruch
    ctx.beginPath(); ctx.moveTo(mx,y-small*2.6); ctx.lineTo(mx,y+small*2.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(mx,y,Math.max(4,fs*0.28),0,7); ctx.fillStyle=BLUE; ctx.fill(); ctx.restore(); }
  if(D.zShow) fracLabel(z,n,Math.max(x0+fs,Math.min(x1-fs,mx)),y-small*2.6-fs*2.3,fs*1.25,BLUE);
  const gz=Math.floor(z/n), rest=z-gz*n, g=gcd(rest||1,n);
  let extra=[];
  if(D.mix&&z>n&&rest>0) extra.push(z+'/'+n+' = '+gz+' '+(rest/g)+'/'+(n/g));
  else if(D.mix&&z>0&&rest===0) extra.push(z+'/'+n+' = '+gz);
  if(D.dec) extra.push('= '+fmtNum(val));
  labelFit('Ein Bruch ist auch eine Zahl – er hat einen festen Platz auf dem Zahlenstrahl.',w/2,h-fs*2.4,fs*0.8,'#8a93a2',w-16);
  if(extra.length&&D.zShow) labelFit(extra.join('   '),w/2,h-fs*1.05,fs*1.05,LINE,w-16);
  if(!D.zShow) labelFit('Mit dem Haken „Wert anzeigen“ erscheint der Bruch auf dem Zahlenstrahl.',w/2,h-fs*1.05,fs*1.0,'#8a93a2',w-16);
  if(val>M) labelFit('Der Bruch liegt außerhalb – „bis“ vergrößern.',w/2,fs*1.2,fs*0.85,'#dc2626',w-16); }

/* Unterpunkt „Wert ablesen": Pfeil im Raster verschieben und den Bruch ablesen */
function zGrid(){ const A=Math.round(D.zA), T=Math.max(1,Math.min(20,Math.round(D.zT)));
  const B=Math.max(A+1,Math.round(D.zB)), steps=(B-A)*T;
  if(!(D.zPos>=0)) D.zPos=0; if(D.zPos>steps) D.zPos=steps;
  return {A,B,T,steps}; }
function drawTabZ2(w,h){ const fs=D.fontSize, G=zGrid(), x0=fs*2.4, x1=w-fs*2.4, y=h*0.58, W=x1-x0;
  const unit=W/(G.B-G.A), px=v=>x0+(v-G.A)*unit, small=Math.max(5,Math.min(11,fs*0.55));
  ctx.strokeStyle=LINE; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  const ah=Math.max(8,fs*0.7);
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x1-ah,y-ah*0.55); ctx.moveTo(x1,y); ctx.lineTo(x1-ah,y+ah*0.55); ctx.stroke();
  if(G.steps<=240){ ctx.lineWidth=1.2; ctx.strokeStyle='#64748b';
    for(let i=0;i<=G.steps;i++){ if(i%G.T===0) continue; const x=px(G.A+i/G.T);
      ctx.beginPath(); ctx.moveTo(x,y-small); ctx.lineTo(x,y+small); ctx.stroke(); } }
  ctx.lineWidth=2.4; ctx.strokeStyle=LINE;
  for(let v=G.A;v<=G.B;v++){ const x=px(v);
    ctx.beginPath(); ctx.moveTo(x,y-small*1.9); ctx.lineTo(x,y+small*1.9); ctx.stroke();
    label(String(v),x,y+small*2.1+fs*1.0,fs*0.95,LINE); }
  const mx=px(G.A+D.zPos/G.T);                                        // der Pfeil
  ctx.save(); ctx.fillStyle=RED; ctx.strokeStyle=RED; ctx.lineWidth=Math.max(2.4,fs*0.18);
  ctx.beginPath(); ctx.moveTo(mx,y-fs*3.2); ctx.lineTo(mx,y-fs*0.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx,y-small*0.2); ctx.lineTo(mx-fs*0.5,y-fs*1.1); ctx.lineTo(mx+fs*0.5,y-fs*1.1); ctx.closePath(); ctx.fill();
  ctx.restore();
  D._zAxis={x0,x1,y,A:G.A,T:G.T,steps:G.steps,unit};
  if(D.zShow){ const zn=G.A*G.T+D.zPos, val=zn/G.T, g=gcd(Math.abs(zn)||1,G.T);
    const xTxt=Math.max(x0+fs*1.6,Math.min(x1-fs*1.6,mx));
    if(zn%G.T===0) label(String(zn/G.T),xTxt,y-fs*5.2,fs*1.6,RED);
    else fracLabel(zn,G.T,xTxt,y-fs*5.4,fs*1.4,RED);
    const extra=[];
    if(zn%G.T!==0&&g>1) extra.push(zn+'/'+G.T+' = '+(zn/g)+'/'+(G.T/g));
    const gz=Math.trunc(zn/G.T), rest=Math.abs(zn-gz*G.T);
    if(D.mix&&rest>0&&Math.abs(zn)>G.T){ const g2=gcd(rest,G.T); extra.push(zn+'/'+G.T+' = '+gz+' '+(rest/g2)+'/'+(G.T/g2)); }
    if(D.dec) extra.push('= '+fmtNum(val));
    if(extra.length) labelFit(extra.join('   '),w/2,h-fs*1.05,fs*1.05,LINE,w-16); }
  else labelFit('Wo steht der Pfeil? Mit dem Haken erscheint der Wert.',w/2,h-fs*1.05,fs*1.0,'#8a93a2',w-16);
  labelFit('Pfeil verschieben – er rastet auf den Teilstrichen ein.',w/2,h-fs*2.4,fs*0.8,'#8a93a2',w-16); }

/* ---------- Reiter „Intro": Teile antippen, daraus entsteht der Bruch ---------- */
function iCheck(){ const n=Math.max(1,Math.min(24,D.iN|0)); if(!Array.isArray(D.iSel)||D.iSel.length!==n) D.iSel=new Array(n).fill(false); return n; }
function drawTabI(w,h){ const n=iCheck(), fs=D.fontSize, z=D.iSel.filter(Boolean).length;
  const bot=D.iShow?fs*4.6:fs*1.8, top=fs*0.6, avH=Math.max(30,h-top-bot), avW=Math.max(30,w-fs*1.6);
  let sw,sh;
  if(D.shape==='circle'){ sw=sh=Math.min(avW,avH); }
  else { sw=Math.min(avW,avH*2.6); sh=Math.min(avH,sw*0.42); }
  const x=(w-sw)/2, y=top+(avH-sh)/2;
  const food=D.skin&&D.skin!=='plain';
  const cols=(z===0&&food)?new Array(n).fill(BLUE)         // noch nichts gewählt: erst das Ganze zeigen

  drawShape(x,y,sw,sh,D.shape,n,cols,{skin:D.skin});
  D._iBox={x,y,w:sw,h:sh,n};
  if(D.iShow){ const yb=h-bot+fs*2.2;
    ctx.font='700 '+(fs*1.7)+'px -apple-system,sans-serif';

    labelFit(z+' von '+n+' Teilen',w/2+fs*2.4,yb,fs*1.05,LINE,Math.max(40,w/2-fs*3)); } }
function iHit(x,y){ const b=D._iBox; if(!b) return -1;
  if(x<b.x||x>b.x+b.w||y<b.y||y>b.y+b.h) return -1;
  if(D.shape==='circle'){ const R=Math.min(b.w,b.h)/2, cx=b.x+b.w/2, cy=b.y+b.h/2, dx=x-cx, dy=y-cy;
    if(Math.hypot(dx,dy)>R) return -1;
    let a=Math.atan2(dy,dx)+Math.PI/2; if(a<0) a+=2*Math.PI; return Math.floor(a/(2*Math.PI/b.n))%b.n; }
  return Math.min(b.n-1,Math.floor((x-b.x)/(b.w/b.n))); }

/* ---------- Reiter „Bruch": ein Bruch, erweitern und kürzen ---------- */
function drawTab1(w,h){ const n=Math.max(1,D.n), z=Math.max(0,D.z), fs=D.fontSize*1.1;
  const chain=(D.base!==n&&n%D.base===0&&D.baseZ!==undefined);
  if(!D.pic1){                                                        // ohne Haken: nur der Bruch als Zahl
    const big=Math.max(14,Math.min(fs*3.2,h*0.3,w*(chain?0.13:0.22)));
    ctx.font='700 '+big+'px -apple-system,sans-serif';
    const fw=(a,b)=>Math.max(ctx.measureText(String(a)).width,ctx.measureText(String(b)).width)*1.34+big*0.3;
    const items=[]; if(chain){ items.push({z:D.baseZ,n:D.base,w:fw(D.baseZ,D.base)}); items.push({t:'=',w:big*0.9}); }
    items.push({z:z,n:n,w:fw(z,n)});
    if(D.dec){ const t='=  '+fmtNum(z/n); ctx.font='700 '+(big*0.62)+'px -apple-system,sans-serif';
      items.push({t:t,s:big*0.62,w:ctx.measureText(t).width+big*0.5}); }
    let tot=0; items.forEach(i=>tot+=i.w); let px=(w-tot)/2, y=h/2;
    items.forEach(i=>{ const mx=px+i.w/2;
      if(i.t!==undefined) label(i.t,mx,y,i.s||big*0.8,LINE); else { ctx.font='700 '+big+'px -apple-system,sans-serif'; fracLabel(i.z,i.n,mx,y,big,BLUE); }
      px+=i.w; });
    return; }
  const whole=Math.min(12,Math.max(1,Math.ceil(z/n)||1));
  const cols=Math.ceil(Math.sqrt(whole)), rows=Math.ceil(whole/cols), gap=14, top=fs*2.2;
  const bw=(w-gap*(cols+1))/cols, bh=(h-top-gap*(rows+1))/rows;
  const sw=D.shape==='circle'?Math.min(bw,bh):bw, shh=D.shape==='circle'?sw:Math.min(bh,bw*0.42);
  const totW=cols*sw+(cols-1)*gap, x0=Math.max(gap,(w-totW)/2), y0=top+Math.max(gap,(h-top-(rows*shh+(rows-1)*gap))/2);

/* ---------- Reiter 3: Multiplikation und Division ---------- */
function drawTab3(w,h){ const a=D.a3,b=Math.max(1,D.b3),c=D.c3,d=Math.max(1,D.d3), fs=D.fontSize;
  if(D.op3==='·'){ const W=Math.min(w-fs*3,(h-fs*6)*1.5), x=(w-W)/2, H=Math.min(h-fs*6,W*0.66), y=fs*2.2+Math.max(0,(h-fs*6-H)/2);
    const cw=W/b, ch=H/d;
    for(let i=0;i<b;i++) for(let j=0;j<d;j++){ const inA=i<a, inC=j<c;
      ctx.beginPath(); ctx.rect(x+i*cw,y+j*ch,cw,ch);

    ctx.strokeStyle=LINE; ctx.lineWidth=2.2; ctx.strokeRect(x,y,W,H);

    ctx.save(); ctx.translate(x-fs*0.9,y+H/2); ctx.rotate(-Math.PI/2); label(c+'/'+d+' der Höhe',0,0,fs*0.9,RED); ctx.restore();
    const p=a*c, q=b*d;
    labelFit('Der violette Teil ist das Produkt: '+p+' von '+q+' Kästchen.', w/2, h-fs*2.5, fs*0.8, '#8a93a2', w-16);
    label(a+'/'+b+' · '+c+'/'+d+'  =  '+p+'/'+q+redTail(p,q), w/2, h-fs*1.05, fs*1.1, LINE);
    $('hint').textContent=''; return; }
  /* Division als Umkehraufgabe: gesucht ist die Breite x mit x · c/d = a/b */
  const g0=gcd(Math.abs(a*d)||1,Math.abs(b*c)||1), P=(a*d)/g0, Q=(b*c)/g0;   // x = P/Q

  ctx.save(); ctx.translate(x0-fs*0.9,y0+H2/2); ctx.rotate(-Math.PI/2); label(c+'/'+d+' der Höhe',0,0,fs*0.85,RED); ctx.restore();
  label('gesucht: die Breite x', x0+(W2*boxes+gapX*(boxes-1))/2, y0-fs*1.0, fs*0.9, PURPLE);
  labelFit('Wie breit muss der Streifen sein, damit '+c+'/'+d+' davon '+a+'/'+b+' ergibt?', w/2, h-fs*3.6, fs*0.8, '#8a93a2', w-16);
  labelFit('x · '+c+'/'+d+' = '+a+'/'+b+'   →   x = '+a+'/'+b+' : '+c+'/'+d+' = '+a+'/'+b+' · '+d+'/'+c, w/2, h-fs*2.4, fs*0.92, '#475569', w-16);
  label(a+'/'+b+' : '+c+'/'+d+'  =  '+(a*d)+'/'+(b*c)+redTail(a*d,b*c), w/2, h-fs*1.05, fs*1.1, LINE);
  $('hint').textContent=''; }

  if(D.tab===7&&D._t2boxes) D._t2boxes.forEach((bx,i)=>{ if(hit(bx)) exp2(i===0?'a':'b'); });
  if(D.tab===6&&D._vboxes) D._vboxes.forEach((bx,i)=>{ if(hit(bx)) expV(i===0?'a':'b'); }); });
$('op2').onchange=()=>{ D.op2=$('op2').value; draw(); sync(); };
['a3','b3','c3','d3'].forEach(id=>$(id).addEventListener('input',()=>{ D[id]=iv(id,1,id[0]==='b'||id[0]==='d'?1:undefined); draw(); sync(); }));
$('op3').onchange=()=>{ D.op3=$('op3').value; draw(); sync(); };
for(const [id,dd] of [['fsM',-2],['fsP',2]]){ $(id).addEventListener('pointerdown',e=>e.preventDefault());
  $(id).onclick=()=>{ D.fontSize=Math.max(10,Math.min(40,D.fontSize+dd)); applyFont(); draw(); sync(); }; }
if(window.TafelShot) TafelShot.buttons($('shotBtns'),()=>TafelShot.rasterize($('app'),{exclude:'#bar',pad:6}));
function sync(){ if(window.parent===window) return; try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
addEventListener('message',e=>{ if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return; const d=e.data.data;
  D=Object.assign(D,d); if(!D.n||D.n<1) D.n=2; if(!D.base) D.base=D.n;
  if(!(d.v>=2)) D.tab={1:2,2:7,3:8}[d.tab]||2;                 // ganz alte Objekte
  else if(d.v===3) D.tab={1:2,2:6,3:7,4:8,5:5}[d.tab]||2;
  else if(d.v===4) D.tab={1:2,2:4,3:5,4:6,5:7,6:8}[d.tab]||2;
  else if(d.v===5) D.tab=(d.tab||1)+1;                          // „Intro" kam ganz vorn dazu
  if(!Array.isArray(d.iSel)) D.iSel=[]; if(!(d.iN>=1)) D.iN=4; D.iShow=!!d.iShow;
  if(!(d.v>=7)) D.pic1=true; else D.pic1=!!d.pic1;             // früher war das Bild immer zu sehen
  ['z','n','a2','b2','c2','d2','a3','b3','c3','d3','k2','av','bv','cvv','dv','kv','zz','nz','mz','qz','qn','ta','tb','iN'].forEach(id=>{ if(D[id]!==undefined) $(id).value=D[id]; });
  $('iShow').checked=!!D.iShow; $('cPic').checked=!!D.pic1;
  if(!(d.v>=8)){ const OLD={h:['zeit',1,1],m:['zeit',2,1],l:['vol',1,1],l8:['vol',2,800],kg:['masse',1,1],g6:['masse',2,600],m1:['laenge',1,1],c120:['laenge',2,120]};
    const o=OLD[d.tw]||OLD.h; D.tq=o[0]; D.tu=o[1]; D.tv=o[2]; }                 // früher feste Kombis „1 Stunde", „600 g" …
  D.v=8;
  if(!(d.v>=9)){ D.tpic=true; D.tmode=1; }                                     // früher war das Bild immer zu sehen
  D.v=10;
  if(!QTY[D.tq]) D.tq='zeit'; $('tq').value=D.tq; fillUnits(); $('tv').value=fmtNum(D.tv);
  $('tm').value=String(D.tmode||1); $('tvon').textContent=(D.tmode===2)?'sind':'von';
  $('cPicA').checked=!!D.tpic; $('cCalc').checked=!!D.calc; if(!(d.tstep>=0)) D.tstep=0;
  $('cMix').checked=D.mix!==false; $('cDec2').checked=!!D.dec;
  if(!(d.v>=10)) D.zShow=true;
  if(!(D.zmode===2)) D.zmode=1; $('zm').value=String(D.zmode); ['zA','zB','zT'].forEach(id=>{ if(D[id]!==undefined) $(id).value=D[id]; });
  $('cZval').checked=!!D.zShow; zShowMode();
  if(!D.eva) D.eva=1; if(!D.evb) D.evb=1; $('bVshow').classList.toggle('on',!!D.vshow); $('bVrel').classList.toggle('on',!!D.vrel);
  $('cDec').checked=!!D.dec; if(!D.e2a) D.e2a=1; if(!D.e2b) D.e2b=1;
  $('op2').value=D.op2||'+'; $('op3').value=D.op3||'·';
  $('bShape').textContent=(D.shape==='circle')?'◯ Kreis':'▭ Rechteck'; $('skin').value=D.skin||'plain';
  applyFont(); showTab(); });
/* Zahlenfelder bekommen −/+ Knöpfe (bessere Bedienung mit dem Finger) */
function addSteppers(){ document.querySelectorAll('#bar input[type=number], #bar input.num').forEach(inp=>{
  if(inp.parentNode&&inp.parentNode.classList.contains('stp')) return;
  const wrap=document.createElement('span'); wrap.className='stp';
  inp.parentNode.insertBefore(wrap,inp);
  const mk=(txt,d)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=txt; b.tabIndex=-1;
    b.addEventListener('pointerdown',e=>e.preventDefault());
    b.onclick=()=>{ const lo=inp.getAttribute('min'), hi=inp.getAttribute('max');
      const min=(lo===null||lo==='')?-Infinity:+lo, max=(hi===null||hi==='')?Infinity:+hi;
      const cur=parseFloat(String(inp.value).replace(',','.'))||0;
      const v=Math.round(Math.max(min,Math.min(max,cur+d))*1e4)/1e4;
      inp.value=String(v).replace('.',','); inp.dispatchEvent(new Event('input',{bubbles:true})); inp.dispatchEvent(new Event('change',{bubbles:true})); };
    return b; };
  wrap.appendChild(mk('−',-1)); wrap.appendChild(inp); wrap.appendChild(mk('+',1)); }); }
addEventListener('resize',resize);
window.addEventListener('load',()=>{ addSteppers(); fillUnits(); zShowMode(); applyFont(); showTab(); resize();
  if(window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  try{ if(window.parent!==window) parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
</script>
