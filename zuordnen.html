<!DOCTYPE html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zuordnen</title>
<style>
  :root{--fs:15px;}
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;font-size:var(--fs);}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  #bar{display:flex;gap:4px;padding:6px;border-bottom:1px solid #e2e7ef;align-items:center;flex:none;overflow:hidden;}
  #barL,#barR{display:flex;gap:4px;align-items:center;flex:none;}
  #barMid{display:flex;gap:4px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:0 2px;}
  #bar.compact #barL .tb span,#bar.compact #barR .tb span{display:none;}
  #bar.compact #barL .tb,#bar.compact #barR .tb{min-width:42px;padding:0 3px;}
  .tb{flex:none;min-width:52px;height:50px;border:1px solid #d6dce5;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 5px;color:#1f2430;font:inherit;}
  .tb svg{width:32px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tb span{font-size:.7em;font-weight:600;white-space:nowrap;}
  .tb.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .sep{width:1px;align-self:stretch;background:#e2e7ef;margin:0 3px;flex:none;}
  #bar2{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid #e2e7ef;align-items:center;flex-wrap:nowrap;flex:none;min-height:44px;font-size:.92em;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  #bar2>*{flex:0 0 auto;}
  .lbl{color:#64748b;font-weight:600;} .grow{flex:1 1 auto!important;min-width:4px;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:5px 10px;font:inherit;font-weight:600;color:#1f2430;cursor:pointer;white-space:nowrap;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.red{color:#dc2626;border-color:#fca5a5;}
  #play{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 10px 12px;overflow:hidden;}
  #pool{flex:0 0 auto;min-height:62px;max-height:38%;overflow-y:auto;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
        border:2px dashed #cbd5e1;border-radius:12px;padding:7px;background:#f8fafc;}
  #pool.over{border-color:#2563eb;background:#eff6ff;}
  #zones{flex:1;min-height:0;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  #zones.paare{flex-direction:column;flex-wrap:wrap;overflow-x:auto;overflow-y:auto;align-content:flex-start;gap:6px;}
  #zones.paare .zone{flex:0 0 auto;min-width:min(520px,94%);flex-direction:row;align-items:stretch;border-width:1.5px;}
  #zones.paare .zone h3{min-width:38%;max-width:44%;display:flex;align-items:center;font-size:.95em;}
  #zones.paare .zbody{flex:1;align-items:center;min-height:46px;}
  .zone{flex:1 0 150px;min-width:150px;display:flex;flex-direction:column;border:2px solid var(--c,#2563eb);border-radius:12px;overflow:hidden;background:#fff;}
  .zone.over{box-shadow:0 0 0 3px rgba(37,99,235,.35);}
  .zone h3{margin:0;padding:6px 8px;font-size:.92em;color:#fff;background:var(--c,#2563eb);display:flex;gap:6px;align-items:center;}
  .zone h3 img{height:1.5em;border-radius:4px;}
  .zbody{flex:1;min-height:0;overflow-y:auto;padding:7px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;}
  .karte{border:1.5px solid #cfd6e0;background:#fff;border-radius:10px;padding:6px 10px;font-weight:600;cursor:grab;touch-action:none;
         box-shadow:0 1px 2px rgba(15,23,42,.08);display:flex;align-items:center;gap:6px;max-width:100%;}
  .karte img{max-height:70px;max-width:130px;border-radius:6px;display:block;}
  .karte.ok{border-color:#16a34a;background:#f0fdf4;} .karte.no{border-color:#dc2626;background:#fef2f2;}
  .karte.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 8px 20px rgba(15,23,42,.25);}
  .karte.drag{opacity:.35;}
  #edit{flex:1;min-height:0;display:none;flex-direction:column;padding:8px 12px 12px;gap:6px;}
  #edit textarea{flex:1;min-height:0;width:100%;border:1px solid #cfd6e0;border-radius:10px;padding:10px;font:inherit;line-height:1.45;resize:none;}
  .help{color:#64748b;font-size:.85em;}
  #imgs{display:flex;gap:6px;flex-wrap:wrap;}
  #imgs .ib{position:relative;border:1px solid #cfd6e0;border-radius:8px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72em;}
  #imgs .ib img{height:44px;border-radius:5px;}
</style>
</head><body>
<div id="wrap">
  <div id="bar"><div id="barL">
    <button class="tb tafelEdit" id="bEdit" title="Aufgabe eintragen"><svg viewBox="0 0 32 20"><path d="M8 15h4l11-11-4-4L8 11Z M18 3l4 4"/></svg><span>✎ Aufgabe</span></button>
    <button class="tb tafelEdit" id="fSave" title="Aufgabe als Datei speichern"><svg viewBox="0 0 32 20"><path d="M10 2h10l3 3v13H10Z M13 2v5h7V2 M13 18v-6h7v6"/></svg><span>Speichern</span></button>
    <button class="tb tafelEdit" id="fLoad" title="Aufgabe laden"><svg viewBox="0 0 32 20"><path d="M7 16V5h6l2 2h10v9Z M16 9v6M13 12l3 3 3-3"/></svg><span>Laden</span></button>
    <input type="file" id="fFile" accept=".json,application/json" hidden>
    <input type="file" id="imgFile" accept="image/*" hidden>
    <span class="sep"></span>
    </div><div id="barMid"></div><div id="barR"><span class="sep"></span>
    <button class="tb tafelEdit" id="bMode" title="Darstellung: Gruppenfelder oder paarweise Zuordnung"><svg viewBox="0 0 32 20"><rect x="2" y="3" width="11" height="5" rx="1.2"/><rect x="19" y="3" width="11" height="5" rx="1.2"/><rect x="2" y="12" width="11" height="5" rx="1.2"/><rect x="19" y="12" width="11" height="5" rx="1.2"/><path d="M13 5.5h6M13 14.5h6" stroke-width="1.4"/></svg><span>Paare</span></button>
    <button class="tb" id="bCheck" title="Zuordnung prüfen"><svg viewBox="0 0 32 20"><path d="M8 11l5 5 11-12"/></svg><span>Prüfen</span></button>
    <button class="tb" id="bSol" title="Lösung zeigen"><svg viewBox="0 0 32 20"><circle cx="16" cy="10" r="7"/><path d="M16 6v5l3 2"/></svg><span>Lösung</span></button>
    <button class="tb" id="bMix" title="Neu mischen und von vorn beginnen"><svg viewBox="0 0 32 20"><path d="M4 5h5l14 10h5M4 15h5l4-3M23 2l4 3-4 3M23 12l4 3-4 3"/></svg><span>Mischen</span></button>
    <button class="tb tafelEdit" id="bPrint" title="Aufgabe drucken"><svg viewBox="0 0 32 20"><path d="M10 7V2h12v5 M10 15H7V7h18v8h-3 M10 12h12v6H10Z"/></svg><span>Drucken</span></button>
  </div></div>
  <div id="bar2" class="tafelEdit"></div>
  <div id="play"><div id="pool"></div><div id="zones"></div></div>
  <div id="edit">
    <div class="help">Pro Zeile eine Gruppe: <b>Oberbegriff = Begriff, Begriff, Begriff</b>.
      Für Paare einfach <b>ein</b> Begriff je Zeile. Bilder über <b>🖼 Bild</b> hinzufügen und mit
      <b>[b1]</b>, <b>[b2]</b> … in eine Zeile schreiben.</div>
    <textarea id="ta" spellcheck="false"></textarea>
    <div id="imgs"></div>
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn" id="eImg">🖼 Bild</button><span class="grow"></span>
      <button class="btn" id="eCancel">Abbrechen</button><button class="btn pri" id="eOk">Übernehmen</button>
    </div>
  </div>
</div>
<script src="shot.js"></script>
<script src="modus.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const toast=m=>window.TafelShot&&TafelShot.toast(m);
const COLS=['#2563eb','#0d9488','#b45309','#7c3aed','#be123c','#0369a1','#4d7c0f','#a21caf'];
const DEMO='Säugetiere = Hund, Wal, Fledermaus\nVögel = Amsel, Pinguin, Adler\nReptilien = Schlange, Eidechse, Krokodil';
let D={ v:1, text:DEMO, images:{}, place:{}, order:[], check:{}, shown:false, mode:'auto', fontSize:15, fontBold:false, fontItalic:false };
let cats=[], karten=[];

/* ---------- Aufgabe einlesen ---------- */
function parse(){
  cats=[]; karten=[];
  (D.text||'').split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    const m=t.match(/^(.+?)\s*[=:]\s*(.*)$/);
    const name=(m?m[1]:t).trim();
    const ci=cats.length; cats.push({name,idx:ci});
    const rest=m?m[2]:'';
    rest.split(/\s*[,;]\s*/).forEach(w=>{ const s=w.trim(); if(!s) return;
      karten.push({id:'k'+ci+'_'+karten.length, t:s, cat:ci}); });
  });
  karten.forEach(k=>{ if(!(k.id in D.place)) D.place[k.id]=null; });
  if(!D.check) D.check={};
  if(!D.order.length||D.order.length!==karten.length) mische(false);
}
function mische(reset){
  D.order=karten.map(k=>k.id);
  for(let i=D.order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [D.order[i],D.order[j]]=[D.order[j],D.order[i]]; }
  if(reset!==false){ D.place={}; karten.forEach(k=>D.place[k.id]=null); D.check={}; D.shown=false; }
}
const bildVon=t=>{ const m=String(t).match(/^\[(b\d+)\]$/); return m?D.images[m[1]]:null; };
const textOhneBild=t=>String(t).replace(/\[(b\d+)\]/g,'').trim();

/* ---------- Darstellung ---------- */
function karteEl(k){
  const e=document.createElement('div'); e.className='karte'; e.dataset.id=k.id;
  const img=bildVon(k.t);
  if(img){ const im=document.createElement('img'); im.src=img; e.appendChild(im);
    const rest=textOhneBild(k.t); if(rest) e.appendChild(document.createTextNode(rest)); }
  else e.textContent=k.t;
  const st=(D.check||{})[k.id];
  if(D.shown||st){ e.classList.add(st==='no'?'no':'ok'); }
  e.addEventListener('pointerdown',ev=>dragStart(ev,k,e));
  return e;
}
const paarModus=()=>D.mode==='paare'||(D.mode==='auto'&&cats.length>1&&karten.length===cats.length);
function render(){
  parse();
  const pool=$('pool'); pool.innerHTML=''; pool.dataset.zone='-1';
  const zs=$('zones'); zs.innerHTML='';
  const paare=paarModus(); zs.classList.toggle('paare',paare);
  $('bMode').classList.toggle('on',paare);
  $('bMode').querySelector('span').textContent=paare?'Paare':'Gruppen';
  cats.forEach((c,i)=>{
    const z=document.createElement('div'); z.className='zone'; z.style.setProperty('--c',COLS[i%COLS.length]); z.dataset.zone=String(i);
    const h=document.createElement('h3');
    const img=bildVon(c.name);
    if(img){ const im=document.createElement('img'); im.src=img; h.appendChild(im); const r=textOhneBild(c.name); if(r) h.appendChild(document.createTextNode(r)); }
    else h.textContent=c.name;
    const b=document.createElement('div'); b.className='zbody'; b.dataset.zone=String(i);
    z.append(h,b); zs.appendChild(z);
  });
  D.order.forEach(id=>{
    const k=karten.find(x=>x.id===id); if(!k) return;
    const wo=D.shown?k.cat:D.place[k.id];
    const ziel=(wo===null||wo===undefined)?pool:$('zones').children[wo].querySelector('.zbody');
    if(ziel) ziel.appendChild(karteEl(k));
  });
  renderBar2(); sync();
}
function renderBar2(){
  const bar=$('bar2'); bar.innerHTML='';
  const el=(tag,cls,txt,fn)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; if(fn) e.onclick=fn; bar.appendChild(e); return e; };
  const offen=karten.filter(k=>D.place[k.id]===null||D.place[k.id]===undefined).length;
  el('span','lbl',karten.length+' Karten in '+cats.length+' Gruppen · noch '+offen+' im Vorrat');
  const ids=Object.keys(D.check||{}), geprüft=ids.length;
  if(geprüft){ const ok=ids.filter(i=>D.check[i]==='ok').length;
    el('span','lbl','· '+ok+' von '+geprüft+' richtig'); }
  el('span','sep tafelEdit');
  el('span','lbl tafelEdit','Schrift'); el('button','btn tafelEdit','A−',()=>fontBy(-1)); el('button','btn tafelEdit','A+',()=>fontBy(1));
  el('span','grow');
  if(window.parent!==window) el('button','btn pri tafelEdit','🖼 Bild → Tafel',()=>TafelShot.toBoard(shot()));
  el('button','btn tafelEdit','📋 Kopieren',()=>TafelShot.copy(shot()));
}
const shot=()=>TafelShot.rasterize($('wrap'),{exclude:'#bar,#bar2',pad:8});
function fontBy(d){ D.fontSize=Math.max(10,Math.min(32,(D.fontSize||15)+d));
  document.documentElement.style.setProperty('--fs',D.fontSize+'px'); renderBar2(); sync(); }

/* ---------- Ziehen ---------- */
let drag=null;
function dragStart(ev,k,el){
  if(D.shown) return;
  ev.preventDefault();
  const r=el.getBoundingClientRect();
  const g=el.cloneNode(true); g.classList.add('ghost');
  g.style.left=r.left+'px'; g.style.top=r.top+'px'; g.style.width=r.width+'px';
  document.body.appendChild(g);
  el.classList.add('drag');
  drag={k,el,g,dx:ev.clientX-r.left,dy:ev.clientY-r.top};
  el.setPointerCapture&&el.setPointerCapture(ev.pointerId);
}
addEventListener('pointermove',ev=>{ if(!drag) return;
  drag.g.style.left=(ev.clientX-drag.dx)+'px'; drag.g.style.top=(ev.clientY-drag.dy)+'px';
  const z=zoneUnter(ev.clientX,ev.clientY);
  document.querySelectorAll('.zone,#pool').forEach(e=>e.classList.remove('over'));
  if(z) (z.closest('.zone')||z).classList.add('over');
});
function zoneUnter(x,y){
  drag&&(drag.g.style.display='none');
  const e=document.elementFromPoint(x,y);
  drag&&(drag.g.style.display='');
  if(!e) return null;
  return e.closest('[data-zone]');
}
addEventListener('pointerup',ev=>{ if(!drag) return;
  const z=zoneUnter(ev.clientX,ev.clientY);
  document.querySelectorAll('.zone,#pool').forEach(e=>e.classList.remove('over'));
  drag.g.remove(); drag.el.classList.remove('drag');
  if(z){ const zi=+z.dataset.zone; D.place[drag.k.id]=(zi<0)?null:zi; delete D.check[drag.k.id]; }
  drag=null; render();
});
addEventListener('pointercancel',()=>{ if(!drag) return; drag.g.remove(); drag.el.classList.remove('drag'); drag=null; render(); });

/* ---------- Knöpfe ---------- */
$('bMode').onclick=()=>{ D.mode=paarModus()?'gruppen':'paare'; render();
  toast(paarModus()?'Paarweise Zuordnung':'Zuordnung in Gruppen'); };
$('bCheck').onclick=()=>{
  let ok=0, zu=0; D.check={};
  karten.forEach(k=>{ const p=D.place[k.id];
    if(p===null||p===undefined) return;
    zu++; D.check[k.id]=(p===k.cat)?'ok':'no'; if(p===k.cat) ok++; });
  if(!zu){ toast('Zuerst Karten in die Gruppen ziehen'); return; }
  render(); toast(ok+' von '+zu+' richtig zugeordnet'+(zu<karten.length?' – es fehlen noch Karten':''));
};
$('bSol').onclick=()=>{ D.shown=!D.shown; $('bSol').classList.toggle('on',D.shown);
  D.check={}; render(); toast(D.shown?'Lösung':'Lösung ausgeblendet'); };
$('bMix').onclick=()=>{ mische(true); D.check={}; D.shown=false; $('bSol').classList.remove('on'); render(); toast('Neu gemischt'); };
$('bEdit').onclick=()=>{ $('ta').value=D.text||''; renderImgs(); $('play').style.display='none'; $('edit').style.display='flex'; $('ta').focus(); };
$('eCancel').onclick=()=>{ $('edit').style.display='none'; $('play').style.display='flex'; };
$('eOk').onclick=()=>{ D.text=$('ta').value; D.place={}; D.order=[]; D.check={}; D.shown=false;
  $('edit').style.display='none'; $('play').style.display='flex'; render(); };
$('eImg').onclick=()=>{ $('imgFile').value=''; $('imgFile').click(); };
$('imgFile').onchange=()=>{ const f=$('imgFile').files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const im=new Image();
    im.onload=()=>{ const max=240, sc=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      let n=1; while(D.images['b'+n]) n++;
      D.images['b'+n]=c.toDataURL('image/jpeg',0.82);
      const ta=$('ta'), pos=ta.selectionStart||ta.value.length;
      ta.value=ta.value.slice(0,pos)+'[b'+n+']'+ta.value.slice(pos);
      renderImgs(); toast('Bild als [b'+n+'] eingefügt'); };
    im.src=rd.result; };
  rd.readAsDataURL(f); };
function renderImgs(){ const box=$('imgs'); box.innerHTML='';
  Object.keys(D.images).forEach(k=>{ const d=document.createElement('div'); d.className='ib';
    const im=document.createElement('img'); im.src=D.images[k];
    const t=document.createElement('span'); t.textContent='['+k+']';
    const x=document.createElement('button'); x.className='btn red'; x.textContent='✕'; x.style.padding='1px 6px';
    x.onclick=()=>{ delete D.images[k]; renderImgs(); };
    d.append(im,t,x); box.appendChild(d); }); }
$('fSave').onclick=()=>{ if(!karten.length){ toast('Noch keine Aufgabe'); return; }
  const name=(prompt('Dateiname:','zuordnen-'+new Date().toISOString().slice(0,10))||'').trim(); if(!name) return;
  const blob=new Blob([JSON.stringify({app:'tafel-zuordnen',v:1,text:D.text,images:D.images})],{type:'application/json'});
  const fname=name.replace(/[\\/:*?"<>|]+/g,'_').replace(/\.json$/i,'')+'.json';
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); toast('Gespeichert: '+fname); };
$('fLoad').onclick=()=>{ $('fFile').value=''; $('fFile').click(); };
$('fFile').onchange=()=>{ const f=$('fFile').files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o||typeof o.text!=='string') throw new Error('x');
      D.text=o.text; D.images=o.images||{}; D.place={}; D.order=[]; D.shown=false; render(); toast('Geladen: '+f.name); }
    catch(e){ toast('Keine gültige Zuordnungs-Datei'); } };
  rd.readAsText(f); };
$('bPrint').onclick=()=>{
  if(!window.TafelShot) return;
  const im=TafelShot.rasterize($('wrap'),{exclude:'#bar,#bar2',pad:10,scale:2.5});
  const win=window.open('','_blank'); if(!win){ toast('Bitte Pop-ups erlauben'); return; }
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Zuordnen</title>'+
    '<style>@page{margin:12mm}body{margin:0}img{width:100%}</style></head><body><img src="'+im.canvas.toDataURL('image/png')+'"></body></html>');
  win.document.close(); win.focus(); setTimeout(()=>win.print(),350); };
function barFade(){ const bar=$('bar'), m=$('barMid');
  bar.classList.remove('compact');
  if(m.clientWidth<120) bar.classList.add('compact'); }
addEventListener('resize',barFade);

/* ---------- Tafel-Anbindung ---------- */
let ready=false, syncT=null;
function post(){ syncT=null; if(window.parent===window||!ready) return;
  try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
function sync(){ if(!syncT) syncT=setTimeout(post,250); }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return;
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return;
  D=Object.assign(D,e.data.data); ready=true;
  if(window.TafelModus) TafelModus.refresh();
  if(!D.images) D.images={}; if(!D.place) D.place={}; if(!D.order) D.order=[]; if(!D.check) D.check={};
  document.documentElement.style.setProperty('--fs',(D.fontSize||15)+'px');
  $('bSol').classList.toggle('on',!!D.shown);
  render(); barFade(); });
window.addEventListener('load',()=>{
  document.documentElement.style.setProperty('--fs',(D.fontSize||15)+'px');
  if(window.parent===window&&D.edit===undefined) D.edit=true;
  if(window.TafelModus) TafelModus.init({get:()=>D.edit!==false, set:v=>{ D.edit=v; render(); sync(); }});
  render(); barFade();
  if(window.parent===window){ ready=true; return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  setTimeout(()=>{ ready=true; },700);
});
</script>
</body></html>
