<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Stellenwerttafel</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;-webkit-user-select:none;user-select:none;}
  #wrap{height:100%;display:flex;flex-direction:column;padding:10px;gap:8px;}
  #types{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  #types>*{flex:0 0 auto;}
  #types::-webkit-scrollbar{height:4px;} #types::-webkit-scrollbar-thumb{background:#cfd6e0;border-radius:2px;}
  .tbtn{padding:7px 12px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;}
  .tbtn.on{background:#3b82f6;color:#fff;border-color:#3b82f6;}
  /* Die Groessen stecken in einer Liste, damit die Zeile oben kurz bleibt. */
  .tsel{padding:7px 10px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;font-size:14px;font-family:inherit;font-weight:600;color:#1f2430;cursor:pointer;}
  .tsel.on{background:#3b82f6;color:#fff;border-color:#3b82f6;}
  .hint{font-size:12px;color:#8a93a2;} #swHelp[hidden]{display:none;}
  .dc.bad{background:#fee2e2;box-shadow:inset 0 0 0 2px #dc2626;}
  /* ergaenzte Nullen: noetige stehen wie getippte Ziffern da, ueberfluessige bleiben blass */
  .dc.null0{color:#1f2430;} .dc.null0.unnoetig{color:#9aa4b2;}
  /* Runden: nichts mehr eintippen, dafuer die Stelle antippen, auf die gerundet wird */
  .dc.fest{cursor:pointer;}
  .dc.rundS{background:#ebdcff;box-shadow:inset 0 0 0 2px #7c3aed;color:#5b21b6;font-weight:700;}
  .rval i{font-style:normal;color:#7c3aed;}
  /* Zehnerpotenz: Die angetippte Stelle wird zur Einerstelle - gelb statt lila */
  .dc.zpS{background:#fff3bf;box-shadow:inset 0 0 0 2px #eab308;color:#854d0e;font-weight:700;}
  .rval u{text-decoration:none;color:#a16207;font-weight:800;}
  /* die Ziffer, die uebers Auf- oder Abrunden entscheidet (abschaltbar in den Einstellungen) */
  .dc.entS{background:#faf5ff;box-shadow:inset 0 0 0 2px #c4b5fd;}
  .rval .rhin{font-size:calc(var(--fs,22px)*0.6);font-weight:700;padding:1px 8px;border-radius:999px;margin-left:8px;}
  .rval .rhin.auf{background:#ede9fe;color:#6d28d9;} .rval .rhin.ab{background:#f1f5f9;color:#475569;}
  /* Die beiden Knoepfe tragen die Farbe ihrer Markierung; der Ring sagt, welche Stelle der naechste Tipp setzt. */
  #t-rund.on{background:#7c3aed;border-color:#7c3aed;} #t-zp.on{background:#eab308;border-color:#eab308;color:#1f2430;}
  .tbtn.on.zielt{box-shadow:0 0 0 3px rgba(31,36,48,.22);}
  /* Einstellungsfeld: es wird beim Oeffnen ins Fenster eingepasst (siehe panelSetzen) */
  details.settings{position:relative;}
  details.settings summary{list-style:none;cursor:pointer;}
  details.settings summary::-webkit-details-marker{display:none;}
  .tbtn.rund{border-radius:50%;width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px;}
  .settings .panel{position:fixed;left:10px;top:92px;z-index:20;width:min(360px,calc(100vw - 20px));max-height:calc(100vh - 110px);
    box-sizing:border-box;background:#fff;border:1px solid #cfd6e0;border-radius:10px;display:grid;grid-template-rows:auto minmax(0,1fr);box-shadow:0 10px 30px rgba(0,0,0,.18);}
  .settings .panelKopf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;
    border-bottom:1px solid #e3e8ef;font-weight:700;font-size:15px;user-select:none;-webkit-user-select:none;}
  .settings .panelBody{padding:12px 14px;display:grid;gap:10px;overflow-y:auto;overscroll-behavior:contain;}
  .settings p{margin:0;font-size:12px;color:#64748b;line-height:1.4;}
  .berz{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;}
  .berz b{flex:0 0 66px;}
  .berz .tsel{padding:5px 7px;font-size:13px;}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;color:#1f2430;}
  .chk input{margin-top:2px;flex:none;width:18px;height:18px;}
  #tafelWrap{flex:1;min-height:0;overflow:auto;}
  #tafel{display:inline-flex;flex-direction:column;min-width:100%;}
  .row{display:flex;align-items:stretch;}
  .ugroup{display:flex;flex-direction:column;flex:none;}
  .uhead{text-align:center;font-size:calc(var(--fs,22px)*0.64);padding:5px 4px;cursor:pointer;white-space:nowrap;color:#334155;font-weight:var(--fwh,700);border-radius:8px 8px 0 0;}
  .ugroup.sel .uhead{color:#fff;background:#dc2626;}
  .uhead .kl{font-size:.72em;}                      /* „1/10 s" passt so in eine schmale Spalte */
  .udigits{display:flex;}
  .dc{width:calc(var(--fs,22px)*1.64);height:calc(var(--fs,22px)*2.2);text-align:center;font-size:var(--fs,22px);font-weight:var(--fw,400);font-style:var(--fi,normal);border:1px solid #cbd3df;border-left:none;border-top:none;font-family:inherit;background:#fff;color:#1f2430;padding:0;}
  .ugroup .udigits .dc:first-child{border-left:1px solid #cbd3df;}
  /* Bei Geld stehen alle Euro-Stellen unter einem Kopf - ein Strich alle drei Stellen zeigt die Tausender. */
  .dc.tsd{border-left:1px solid #94a3b8;}
  .ugroup.sel .dc{border-color:#dc2626;}
  .comma{width:calc(var(--fs,22px)*0.73);flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:calc(var(--fs,22px)*1.8);font-weight:900;color:#dc2626;line-height:.5;padding-bottom:4px;}
  .comma.head{align-items:flex-end;color:#dc2626;font-size:calc(var(--fs,22px)*0.72);}
  .ugroup.mk .dc{border-bottom:3px solid #16a34a;}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin-left:4px;color:#15803d;font-variant-numeric:tabular-nums;}
  .frac span:first-child{align-self:stretch;text-align:center;border-bottom:2px solid currentColor;padding:0 3px;}
  .frac span:last-child{padding:0 3px;}
  .comma.pct{color:#2563eb;}
  .comma.head.pct{color:#2563eb;font-weight:800;}
  .rowend{display:flex;align-items:center;gap:8px;padding-left:12px;flex:none;}
  /* Das Ergebnis steht so gross da wie die Ziffern in der Tafel. */
  .rval{font-size:var(--fs,22px);font-weight:800;white-space:nowrap;}
  .rval b{color:#dc2626;}
  .del{border:none;background:#f1f3f7;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;color:#64748b;}
  /* Ergebnis verdecken - dieselbe Bedienung wie beim Funktionsplotter: blaues Auge = verdeckt */
  .rowlead{width:34px;flex:none;display:flex;align-items:center;justify-content:center;}
  .fhide{border:none;background:#eef1f5;width:30px;height:30px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;flex:none;filter:grayscale(1);opacity:.6;font-family:inherit;}
  .fhide.on{background:#dbeafe;filter:none;opacity:1;}
  .verdeckt{display:inline-block;padding:2px 10px;border:1px dashed #cfd6e0;border-radius:8px;background:#f8fafc;color:#94a3b8;letter-spacing:4px;}
  #foot{display:flex;gap:10px;align-items:center;}
  .fb{padding:7px 11px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;font-size:14px;font-family:inherit;cursor:pointer;font-weight:700;color:#1f2430;}
  #add{padding:8px 14px;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
</style>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>
</head>
<body>
<div id="wrap">
  <div id="types">
    <button class="tbtn" id="t-zahl">Zahl</button>
    <select class="tsel" id="gsel" aria-label="Größe" title="Größen: Längen, Flächen, Volumen, Massen, Zeit oder Geld">
      <option value="" hidden>Größen …</option>
      <option value="laenge">Längen</option>
      <option value="flaeche">Flächen</option>
      <option value="volumen">Volumen</option>
      <option value="masse">Massen</option>
      <option value="zeit">Zeit</option>
      <option value="geld">Geld</option>
    </select>
    <button class="tbtn" id="t-misch" title="Wert zusätzlich in gemischten Einheiten zeigen (z. B. 1 h 30 min)">gemischte Einheiten</button>
    <button class="tbtn" id="t-pct" title="Zweites Komma an der Hundertstel-Stelle → Prozent-Darstellung" style="display:none">%-Komma</button>
    <button class="tbtn" id="t-rund" title="Runden: Die Ziffern bleiben stehen; tippe die Stelle an, auf die gerundet werden soll – sie wird lila und rechts steht der gerundete Wert mit ≈">Runden</button>
    <button class="tbtn" id="t-zp" title="Zehnerpotenz: Tippe die Stelle an, die als Einerstelle gelten soll – sie wird gelb und der Wert steht als Zahl mal Zehnerpotenz">Zehnerpotenz</button>
    <button class="tbtn" id="t-null" title="In jede leere Stelle eine Null schreiben – nötige Nullen (Platzhalter) schwarz, überflüssige (vorn und hinten) grau">Nullen ergänzen</button>
    <button class="tbtn" id="t-bruch" title="Zahl als Bruch – Nenner = markierte Stelle (Stelle vorher antippen)" style="display:none">Bruch</button>
    <button class="tbtn rund" id="bHelp" title="Kurzanleitung ein-/ausblenden">?</button>
    <details class="settings" id="setts">
      <summary class="tbtn rund" title="Einstellungen" aria-label="Einstellungen">⚙</summary>
      <div class="panel">
        <div class="panelKopf">Einstellungen<button type="button" class="tbtn rund" id="setZu" title="Einstellungen schließen" aria-label="Einstellungen schließen">✕</button></div>
        <div class="panelBody">
          <p>Welche Stellen die Tafel zeigt – für jede Größe eigen. Ändert man den Bereich der Größe, die gerade in der Tafel steht, fangen ihre Zeilen leer an.</p>
          <div id="berBox"></div>
          <label class="chk"><input type="checkbox" id="setEnt"><span>Beim Runden die <b>entscheidende Ziffer</b> hervorheben und „aufrunden" bzw. „abrunden" dazuschreiben</span></label>
          <button class="fb" id="setStd">Standard wiederherstellen</button>
        </div>
      </div>
    </details>
  </div>
  <div class="hint" id="swHelp" hidden style="padding:0 10px 6px">Ziffern eintippen · auf eine Einheit tippen verschiebt das Komma (bei „Zahl" fest nach den Einern)</div>
  <div id="tafelWrap"><div id="tafel"></div></div>
  <div id="foot"><button id="add">＋ Zeile</button><span style="flex:1"></span><button class="fb tafelEdit" id="fsM" title="Schrift kleiner">A−</button><button class="fb tafelEdit" id="fsP" title="Schrift größer">A+</button><span id="shotBtns" style="display:inline-flex;gap:6px"></span></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* Alle Stellen, die eine Groesse haben kann - von der groessten zur kleinsten:
   [Beschriftung, Ziffern dieser Spalte, Kuerzel]. Welchen Ausschnitt davon die Tafel zeigt,
   sagt data.ber (Einstellungen) - von Haus aus den Bereich STD, also den gewohnten.
   Zeit rechnet nicht in Zehnern: 1 d = 24 h, 1 h = 60 min, 1 min = 60 s, dann Zehntel und
   Hundertstel; ZH sagt, wie viele Hundertstelsekunden eine Einheit wert ist.
   Geld rechnet in Zehnern (1 € = 100 ct). Die Liste fuehrt dort jede Stelle einzeln auf -
   so laesst sich der Bereich stellengenau waehlen -, in der Tafel stehen sie dann unter den
   beiden Einheiten € und ct (siehe baueUnits). */
const ALLE={
  laenge:[['km',1,'km'],['hm',1,'hm'],['dam',1,'dam'],['m',1,'m'],['dm',1,'dm'],['cm',1,'cm'],['mm',1,'mm'],['µm',3,'mum'],['nm',3,'nm']],
  flaeche:[['km²',2,'km2'],['ha',2,'ha'],['a',2,'a'],['m²',2,'m2'],['dm²',2,'dm2'],['cm²',2,'cm2'],['mm²',2,'mm2']],
  volumen:[['km³',3,'km3'],['hm³',3,'hm3'],['dam³',3,'dam3'],['m³',3,'m3'],['dm³',3,'dm3'],['cm³',3,'cm3'],['mm³',3,'mm3']],
  masse:[['Mt',3,'Mt'],['kt',3,'kt'],['t',3,'t'],['kg',3,'kg'],['g',3,'g'],['mg',3,'mg'],['µg',3,'mug']],
  zeit:[['a',2,'a'],['d',2,'d'],['h',2,'h'],['min',2,'min'],['s',2,'s'],['<span class="kl">1/10</span> s',1,'z10'],['<span class="kl">1/100</span> s',1,'z100']],
  geld:[['Brd €',1,'eBrd'],['HB €',1,'eHB'],['ZB €',1,'eZB'],['B €',1,'eB'],['HMrd €',1,'eHMrd'],['ZMrd €',1,'eZMrd'],['Mrd €',1,'eMrd'],['HM €',1,'eHM'],['ZM €',1,'eZM'],['M €',1,'eM'],['HT €',1,'eHT'],['ZT €',1,'eZT'],['T €',1,'eT'],['H €',1,'eH'],['Z €',1,'eZ'],['1 €',1,'eE'],['10 ct',1,'ct10'],['1 ct',1,'ct1'],['0,1 ct',1,'ct01']],

        const r3=u[1]-1-k; inp.className='dc'+((u[2]==='eur'&&r3%3===2)?' tsd':''); inp.type='text'; inp.inputMode='numeric'; inp.maxLength=1; inp.value=rw.dig[c]||'';
        inp.dataset.ri=ri; inp.dataset.c=c;
        /* In das Feld passt nur eine Ziffer - ohne Auswahl liesse sich eine schon dastehende
           (auch eine ergaenzte Null) nicht ueberschreiben, sondern nur loeschen. */
        inp.onfocus=()=>{ if(fest()){ inp.blur(); return; } inp.select(); setTimeout(()=>{ if(document.activeElement===inp) inp.select(); },0); };
        /* Beim Runden setzt ein Tipp die Stelle, auf die gerundet wird - noch einmal tippen hebt sie auf. */
        inp.onclick=()=>{ const z=data.ziel;
          if(z==='runden'&&data.runden){ data.rund=(data.rund===c)?null:c; render(); sync(); return; }
          if(z==='zehner'&&data.zehner){ data.zp=(data.zp===c)?null:c; render(); sync(); } };
        inp.oninput=()=>{ if(fest()){ inp.value=rw.dig[c]||(data.nullen?'0':''); return; }
          inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,1); const alt=rw.dig[c];
          if(inp.value)rw.dig[c]=inp.value; else delete rw.dig[c];
          const gr=grenze(ui);
          if(gr&&gruppenZahl(rw.dig,ui)>gr.max){ if(alt!==undefined)rw.dig[c]=alt; else delete rw.dig[c]; inp.value=alt||'';
            warnBad(inp,gr.name+': nur Werte von 0 bis '+gr.max+' – '+gr.hin); return; }
          updateVals(); sync(); };
        dg.appendChild(inp); col++; }
      g.appendChild(dg); row.appendChild(g);
      if(ui===data.unitIndex&&data.type!=='zeit'){ const cm=document.createElement('div'); cm.className='comma'; cm.textContent=','; row.appendChild(cm); }
      if(showPct&&ui===PCT_IDX()){ const cm=document.createElement('div'); cm.className='comma pct'; cm.textContent=','; row.appendChild(cm); } });
    const end=document.createElement('div'); end.className='rowend';
    const val=document.createElement('div'); val.className='rval'; val.dataset.ri=ri; end.appendChild(val);
    const del=document.createElement('button'); del.className='del'; del.textContent='×'; del.title='Zeile löschen'; del.onclick=()=>{ if(data.rows.length>1){ data.rows.splice(ri,1); render(); sync(); } };
    end.appendChild(del); row.appendChild(end); wrap.appendChild(row); });
  updateVals();
}
function fracOf(dig){ const m=data.mark; if(m===null||m===undefined)return null; const units=UNITS.zahl; let num='',col=0;
  for(let ui=0;ui<=m;ui++){ for(let k=0;k<units[ui][1];k++){ num+=(dig[col]||'0'); col++; } }
  num=num.replace(/^0+(?=\d)/,''); if(num==='')num='0'; const e=EIDX(); const den=m>e?('1'+'0'.repeat(m-e)):'1'; return {num,den}; }
function updateVals(){ zellenMalen(); const units=UNITS[data.type]; document.querySelectorAll('.rval').forEach(el=>{ const rw=data.rows[+el.dataset.ri]; if(rw){
    if(rw.zu){ el.innerHTML='<span class="verdeckt">?</span>'; return; }      /* verdeckt: die Zeile ist eine Aufgabe */
    /* Gerundet steht statt des Dezimalbruchs der gerundete Wert - mit gewelltem Gleichheitszeichen. */
    const eh=(data.type==='zahl')?'':' <b>'+units[data.unitIndex][0]+'</b>';
    if(rundAn()){                      /* mit Zehnerpotenz zusammen: erst runden, dann als Potenz schreiben */
      const auf=rundAuf(rw.dig);
      el.innerHTML='<i>≈</i> '+(zehnerAn()?rundZehnerText(rw.dig):rundWert(rw.dig))+eh
        +(data.zeigEnt?' <span class="rhin '+(auf?'auf':'ab')+'">'+(auf?'aufrunden':'abrunden')+'</span>':'');
      return; }
    if(zehnerAn()){ el.innerHTML='= '+zehnerText(rw.dig)+eh; return; }
    let h='= '+rowValue(rw.dig)+(data.type==='zahl'?'':' <b>'+units[data.unitIndex][0]+'</b>');
    if(data.misch&&data.type!=='zahl') h+=' = <span style="color:#2563eb">'+mischText(rw.dig)+'</span>'; if(data.type==='zahl'&&data.pct) h+=' = <span style="color:#2563eb">'+rowValue(rw.dig,PCT_IDX())+' %</span>'; if(data.type==='zahl'&&data.bruch){ const f=fracOf(rw.dig); if(f) h+=' = <span class="frac"><span>'+f.num+'</span><span>'+f.den+'</span></span>'; } el.innerHTML=h; } }); }
/* Andere Groesse: Die Tafel hat dann andere Spalten - die Zeilen fangen leer an (ihre
   verdeckten Ergebnisse bleiben verdeckt), und die markierten Stellen passen nicht mehr. */
function setzeTyp(t){ if(!UNITS[t]) return;
  data.type=t; data.unitIndex=stdIndex(t); data.rows=data.rows.map(r=>({dig:{},zu:!!r.zu}));
  data.mark=null; data.bruch=false; data.rund=null; data.zp=null;
  if(t==='zeit'){ data.zehner=false; if(data.ziel==='zehner') data.ziel=data.runden?'runden':null; }
  render(); sync(); }
$('t-zahl').onclick=()=>setzeTyp('zahl');
/* Der Platzhalter "Groessen …" ist keine Groesse - dann bleibt alles, wie es ist. */
$('gsel').onchange=e=>{ if(!UNITS[e.target.value]){ render(); return; } setzeTyp(e.target.value); };
$('add').onclick=()=>{ data.rows.push({dig:{}}); render(); sync(); };
for(const [id,d] of [['fsM',-2],['fsP',2]]) $(id).onclick=()=>{ data.fontSize=Math.max(10,Math.min(60,(data.fontSize||22)+d)); render(); sync(); };
if(window.TafelShot) TafelShot.buttons($('shotBtns'),()=>TafelShot.rasterize($('tafel'),{exclude:'.del,.rowlead',pad:8}),'fb tafelEdit');
/* Umschalter „Benutzen / Bearbeiten“ – beim Benutzen bleiben nur die Knöpfe zum Arbeiten */
if(window.TafelModus&&TafelModus.anTafel) TafelModus.anTafel({ button:false,   /* der Umschalter sitzt in der Kopfleiste der Tafel */
  after:()=>{ try{ dispatchEvent(new Event('resize')); }catch(e){} } });
$('t-pct').onclick=()=>{ data.pct=!data.pct; render(); sync(); };
$('t-misch').onclick=()=>{ data.misch=!data.misch; render(); sync(); };
$('t-bruch').onclick=()=>{ data.bruch=!data.bruch; render(); sync(); };
$('t-null').onclick=()=>{ data.nullen=!data.nullen; render(); sync(); };
/* Runden und Zehnerpotenz markieren beide eine Stelle und duerfen zusammen an sein. data.ziel
   sagt, welche Stelle der naechste Tipp setzt - ein Tipp auf den anderen Knopf schaltet um,
   ein Tipp auf den Knopf, der schon dran ist, schaltet ihn aus. */
function modusKnopf(k){
  if(data[k]&&data.ziel===k){ data[k]=false; if(k==='runden') data.rund=null; else data.zp=null;
    data.ziel=data.runden?'runden':(data.zehner?'zehner':null); }
  else { data[k]=true; data.ziel=k;
    if(window.TafelShot) TafelShot.toast(k==='runden'?'Stelle antippen, auf die gerundet werden soll':'Stelle antippen, die als Einerstelle gelten soll'); }
  render(); sync(); }
$('t-rund').onclick=()=>modusKnopf('runden');
$('t-zp').onclick=()=>modusKnopf('zehner');
function sync(){ if(window.parent===window) return; /* allein geöffnet: nicht an sich selbst senden */ try{ parent.postMessage({type:'embed-data',data},'*'); }catch(e){} }
addEventListener('message',e=>{ if(e.source!==window&&(window.parent===window||e.source!==window.parent)) return;   // eigene Nachrichten ignorieren
  if(e.data&&e.data.type==='embed-data'&&e.data.data){ const d=e.data.data;
  data={ type:UNITS[d.type]?d.type:'laenge', unitIndex:(d.unitIndex|0), rows:(Array.isArray(d.rows)&&d.rows.length?d.rows.map(r=>({dig:(r&&r.dig)||{},zu:!!(r&&r.zu)})):[{dig:{}}]), fontSize:d.fontSize||22, fontBold:!!d.fontBold, fontItalic:!!d.fontItalic, pct:!!d.pct, mark:(typeof d.mark==='number'&&d.mark>=0)?d.mark:null, bruch:!!d.bruch, misch:!!d.misch, nullen:!!d.nullen, runden:!!d.runden, rund:(typeof d.rund==='number'&&d.rund>=0)?d.rund:null,
         zehner:!!d.zehner, zp:(typeof d.zp==='number'&&d.zp>=0)?d.zp:null,
         ziel:(d.ziel==='runden'||d.ziel==='zehner')?d.ziel:null, ber:pruefBer(d.ber), zeigEnt:!!d.zeigEnt };
  baueUnits(); berBauen();
  if(data.unitIndex>=UNITS[data.type].length||data.unitIndex<0) data.unitIndex=stdIndex(data.type); render(); } });
window.addEventListener('load',()=>{
  berBauen();
  const geteilt=window.TafelTeilen&&TafelTeilen.istGeteilt();
  if(window.TafelTeilen&&!geteilt)
    TafelTeilen.knopf($('foot'),'stellenwerttafel.html',()=>({w:'swt', d:data}),{cls:'fb'});
  render();
  if(geteilt){ TafelTeilen.nurBenutzen();
    TafelTeilen.empfangen().then(p=>{ if(p&&p.w==='swt'&&p.d) TafelTeilen.einspielen(p.d); }).catch(()=>{});
    return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
$('setEnt').onchange=e=>{ data.zeigEnt=e.target.checked; berSichern(); render(); sync(); };
$('setStd').onclick=()=>{ data.ber=stdBer(); berSichern(); neuAufbauen(data.type); };
$('setZu').onclick=()=>{ $('setts').open=false; };
/* Das Feld haengt am Zahnrad, soll aber nie ueber den Fensterrand hinausragen. */
(()=>{ const det=$('setts'), panel=det.querySelector('.panel'), M=8;
  function panelSetzen(){ if(!det.open) return;
    const r=det.getBoundingClientRect(), w=Math.min(360,innerWidth-2*M);
    panel.style.width=w+'px';
    panel.style.left=Math.round(clamp(r.left,M,Math.max(M,innerWidth-w-M)))+'px';
    panel.style.top=Math.round(r.bottom+6)+'px';
    panel.style.maxHeight=Math.max(140,Math.round(innerHeight-r.bottom-6-M))+'px'; }
  det.addEventListener('toggle',panelSetzen); addEventListener('resize',panelSetzen); })();
$('bHelp').onclick=()=>{ const h=$('swHelp'); h.hidden=!h.hidden; $('bHelp').classList.toggle('on',!h.hidden); };
</script>
