<!DOCTYPE html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glossar</title>
<style>
  :root{--fs:15px;}
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;font-size:var(--fs);}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  #bar{display:flex;gap:4px;padding:6px;border-bottom:1px solid #e2e7ef;align-items:center;flex:none;overflow:hidden;}
  #barL,#barR{display:flex;gap:4px;align-items:center;flex:none;}
  #barMid{display:flex;gap:4px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:0 2px;}
  #bar.compact #barL .tb span,#bar.compact #barR .tb span{display:none;}
  #bar.compact #barL .tb,#bar.compact #barR .tb{min-width:42px;padding:0 3px;}
  #barMid::-webkit-scrollbar{height:5px;} #barMid::-webkit-scrollbar-thumb{background:#c8d0dc;border-radius:3px;}
  .tb{flex:none;min-width:52px;height:50px;border:1px solid #d6dce5;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 5px;color:#1f2430;font:inherit;}
  .tb svg{width:32px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tb span{font-size:.7em;font-weight:600;white-space:nowrap;}
  .tb.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .tb:disabled{opacity:.35;}
  .sep{width:1px;align-self:stretch;background:#e2e7ef;margin:0 3px;flex:none;}
  #bar2{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid #e2e7ef;align-items:center;flex-wrap:nowrap;flex:none;min-height:44px;font-size:.92em;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  #bar2>*{flex:0 0 auto;}
  .lbl{color:#64748b;font-weight:600;}
  .grow{flex:1 1 auto!important;min-width:4px;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:5px 10px;font:inherit;font-weight:600;color:#1f2430;cursor:pointer;white-space:nowrap;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.red{color:#dc2626;border-color:#fca5a5;}
  .chip{border:1.5px solid #cfd6e0;background:#fff;border-radius:999px;padding:4px 11px;font:inherit;font-weight:700;color:#475569;cursor:pointer;}
  .chip.on{background:#1f2430;border-color:#1f2430;color:#fff;}
  input[type=search],#bar2 input{border:1px solid #cfd6e0;border-radius:9px;padding:5px 9px;font:inherit;}
  #view{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 26px;background:#fff;}
  #cards{display:grid;gap:10px;}
  .card{border:1px solid #e2e7ef;border-left:5px solid var(--c,#2563eb);border-radius:12px;padding:9px 12px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.05);cursor:pointer;}
  .card h3{margin:0;font-size:1.04em;display:flex;align-items:center;gap:8px;}
  .card .tag{font-size:.7em;font-weight:700;color:#fff;background:var(--c,#2563eb);border-radius:999px;padding:2px 8px;}
  .card p{margin:6px 0 0;line-height:1.4;color:#334155;}
  .card.zu p{display:none;}
  .card .mehr{float:right;color:#94a3b8;font-weight:700;}
  .lgroup{margin:14px 0 4px;font-weight:800;color:#64748b;letter-spacing:.06em;}
  .lgroup:first-child{margin-top:0;}
  #edit{flex:1;min-height:0;display:none;flex-direction:column;padding:8px 12px 12px;gap:6px;}
  #edit textarea{flex:1;min-height:0;width:100%;border:1px solid #cfd6e0;border-radius:10px;padding:10px;font:inherit;line-height:1.45;resize:none;}
  #edit .help{color:#64748b;font-size:.85em;}
  #empty{color:#8a93a2;text-align:center;padding:30px 10px;}
</style>
</head><body>
<div id="wrap">
  <div id="bar"><div id="barL">
    <button class="tb tafelEdit" id="bEdit" title="Begriffe eintragen und bearbeiten"><svg viewBox="0 0 32 20"><path d="M8 15h4l11-11-4-4L8 11Z M18 3l4 4"/></svg><span>✎ Einträge</span></button>
    <button class="tb tafelEdit" id="fSave" title="Glossar als Datei speichern"><svg viewBox="0 0 32 20"><path d="M10 2h10l3 3v13H10Z M13 2v5h7V2 M13 18v-6h7v6"/></svg><span>Speichern</span></button>
    <button class="tb tafelEdit" id="fLoad" title="Glossar aus Datei laden"><svg viewBox="0 0 32 20"><path d="M7 16V5h6l2 2h10v9Z M16 9v6M13 12l3 3 3-3"/></svg><span>Laden</span></button>
    <input type="file" id="fFile" accept=".json,.txt,text/plain,application/json" hidden>
    <span class="sep"></span>
    </div><div id="barMid">
    <input type="search" id="q" placeholder="suchen …" title="Begriffe und Erklärungen durchsuchen" style="min-width:120px">
    <button class="btn" id="bAll" title="Alle Erklärungen zeigen">alle aufklappen</button>
    <button class="btn" id="bNone" title="Nur die Begriffe zeigen – gut zum Abfragen">alle zuklappen</button>
    <span id="groupChips" style="display:inline-flex;gap:5px;align-items:center"></span>
    </div><div id="barR"><span class="sep"></span>
    <button class="tb" id="bSort" title="Sortierung: alphabetisch oder wie eingegeben"><svg viewBox="0 0 32 20"><path d="M8 3v14M5 14l3 3 3-3"/><path d="M15 5h12M15 10h9M15 15h6"/></svg><span>A → Z</span></button>
    <button class="tb" id="bQuiz" title="Abfragen: Erklärungen sind verdeckt und werden einzeln aufgedeckt"><svg viewBox="0 0 32 20"><path d="M12 7a4 4 0 1 1 5 4c-1 .6-1 1.4-1 2.4"/><circle cx="16" cy="17" r="1.3" fill="currentColor" stroke="none"/></svg><span>Abfragen</span></button>
    <button class="tb tafelEdit" id="bPrint" title="Glossar drucken"><svg viewBox="0 0 32 20"><path d="M10 7V2h12v5 M10 15H7V7h18v8h-3 M10 12h12v6H10Z"/></svg><span>Drucken</span></button>
  </div></div>
  <div id="bar2"></div>
  <div id="view"><div id="cards"></div><div id="empty" hidden></div></div>
  <div id="edit">
    <div class="help">Pro Zeile ein Eintrag: <b>Begriff = Erklärung</b>. Mit <b>#&nbsp;Überschrift</b> beginnt ein neuer Abschnitt (z. B. ein Kapitel).</div>
    <textarea id="ta" spellcheck="false"></textarea>
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn" id="eCancel">Abbrechen</button><button class="btn pri" id="eOk">Übernehmen</button>
    </div>
  </div>
</div>
<script src="shot.js"></script>
<script src="modus.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const toast=m=>window.TafelShot&&TafelShot.toast(m);
const COLS=['#2563eb','#0d9488','#b45309','#7c3aed','#be123c','#0369a1','#4d7c0f','#a21caf'];
const DEMO=`# Mechanik
Geschwindigkeit = Quotient aus zurückgelegtem Weg und benötigter Zeit: v = s : t. Einheit: m/s oder km/h.
Beschleunigung = Änderung der Geschwindigkeit je Zeit: a = Δv : Δt. Einheit: m/s².
Kraft = Ursache für Verformung oder Änderung der Bewegung. Einheit: Newton (N).
Trägheit = Ein Körper behält seine Geschwindigkeit bei, solange keine Kraft auf ihn wirkt.
# Energie
Energie = Fähigkeit eines Körpers, Arbeit zu verrichten. Einheit: Joule (J).
Leistung = Arbeit je Zeit: P = W : t. Einheit: Watt (W).
Wirkungsgrad = Verhältnis von nutzbarer zu zugeführter Energie, immer kleiner als 100 %.`;
let D={ v:1, text:DEMO, sort:'az', quiz:false, open:{}, q:'', group:'', fontSize:15, fontBold:false, fontItalic:false };
let items=[], groups=[];

/* ---------- Text -> Einträge ---------- */
function parse(){
  items=[]; groups=[];
  let g='';
  (D.text||'').split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    if(/^#+\s*/.test(t)){ g=t.replace(/^#+\s*/,'').trim(); if(g&&!groups.includes(g)) groups.push(g); return; }
    const m=t.match(/^([^=:]{1,60})\s*[=:]\s*(.+)$/);
    if(m) items.push({b:m[1].trim(), e:m[2].trim(), g});
    else items.push({b:t, e:'', g});
  });
}
const key=i=>i.b.toLowerCase();
function view(){
  let list=items.slice();
  if(D.group) list=list.filter(i=>i.g===D.group);
  const q=(D.q||'').trim().toLowerCase();
  if(q) list=list.filter(i=>(i.b+' '+i.e).toLowerCase().includes(q));
  if(D.sort==='az') list.sort((a,b)=>key(a).localeCompare(key(b),'de'));
  return list;
}
function colOf(i){ const gi=groups.indexOf(i.g); return gi<0?'#2563eb':COLS[gi%COLS.length]; }
function render(){
  parse();
  const box=$('cards'); box.innerHTML='';
  const list=view();
  $('empty').hidden=list.length>0;
  $('empty').textContent=items.length?'Nichts gefunden':'Noch keine Begriffe – auf „✎ Einträge" tippen';
  let lastG=null;
  list.forEach((it,n)=>{
    if(D.sort!=='az'&&it.g&&it.g!==lastG){ const h=document.createElement('div'); h.className='lgroup'; h.textContent=it.g; box.appendChild(h); lastG=it.g; }
    const c=document.createElement('div');
    const offen=D.quiz?!!D.open[it.b]:(D.open[it.b]!==false);
    c.className='card'+(offen?'':' zu'); c.style.setProperty('--c',colOf(it));
    const tag=(it.g&&(D.sort==='az'||D.group))?'<span class="tag">'+esc(it.g)+'</span>':'';
    c.innerHTML='<h3>'+esc(it.b)+tag+(it.e?'<span class="mehr">'+(offen?'▾':'▸')+'</span>':'')+'</h3>'+(it.e?'<p>'+esc(it.e)+'</p>':'');
    c.onclick=()=>{ if(!it.e) return; D.open[it.b]=!offen; render(); sync(); };
    box.appendChild(c);
  });
  renderChips(); renderBar2(); sync();
}
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderChips(){
  const el=$('groupChips'); el.innerHTML='';
  if(groups.length<2) return;
  const mk=(t,val)=>{ const b=document.createElement('button'); b.className='chip'+(D.group===val?' on':''); b.textContent=t;
    b.onclick=()=>{ D.group=val; render(); }; el.appendChild(b); };
  mk('alle','');
  groups.forEach(g=>mk(g,g));
}
function renderBar2(){
  const bar=$('bar2'); bar.innerHTML='';
  const el=(tag,cls,txt,fn)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; if(fn) e.onclick=fn; bar.appendChild(e); return e; };
  el('span','lbl',items.length+' Begriffe'+(groups.length>1?' in '+groups.length+' Abschnitten':''));
  el('span','sep');
  el('span','lbl','Schrift'); el('button','btn','A−',()=>fontBy(-1)); el('button','btn','A+',()=>fontBy(1));
  el('span','grow');
  if(window.parent!==window) el('button','btn pri tafelEdit','🖼 Bild → Tafel',()=>TafelShot.toBoard(shot()));
  el('button','btn tafelEdit','📋 Kopieren',()=>TafelShot.copy(shot()));
}
const shot=()=>TafelShot.rasterize($('wrap'),{exclude:'#bar,#bar2',pad:8});
function fontBy(d){ D.fontSize=Math.max(10,Math.min(34,(D.fontSize||15)+d));
  document.documentElement.style.setProperty('--fs',D.fontSize+'px'); renderBar2(); sync(); }

/* ---------- Knöpfe ---------- */
$('q').addEventListener('input',()=>{ D.q=$('q').value; render(); });
$('bAll').onclick=()=>{ D.open={}; items.forEach(i=>D.open[i.b]=true); render(); };
$('bNone').onclick=()=>{ D.open={}; items.forEach(i=>D.open[i.b]=false); render(); };
$('bSort').onclick=()=>{ D.sort=(D.sort==='az')?'orig':'az';
  $('bSort').querySelector('span').textContent=D.sort==='az'?'A → Z':'wie eingegeben'; render(); };
$('bQuiz').onclick=()=>{ D.quiz=!D.quiz; $('bQuiz').classList.toggle('on',D.quiz);
  D.open={}; if(!D.quiz) items.forEach(i=>D.open[i.b]=true);
  toast(D.quiz?'Abfragen: Erklärungen sind verdeckt – Karte antippen deckt auf':'Alle Erklärungen sichtbar');
  render(); };
$('bEdit').onclick=()=>{ $('ta').value=D.text||''; $('view').style.display='none'; $('edit').style.display='flex'; $('ta').focus(); };
$('eCancel').onclick=()=>{ $('edit').style.display='none'; $('view').style.display='block'; };
$('eOk').onclick=()=>{ D.text=$('ta').value; $('edit').style.display='none'; $('view').style.display='block'; D.open={}; render(); };
$('fSave').onclick=()=>{ if(!items.length){ toast('Noch keine Begriffe'); return; }
  const name=(prompt('Dateiname:','glossar-'+new Date().toISOString().slice(0,10))||'').trim(); if(!name) return;
  const blob=new Blob([D.text],{type:'text/plain;charset=utf-8'});
  const fname=name.replace(/[\\/:*?"<>|]+/g,'_').replace(/\.(txt|json)$/i,'')+'.txt';
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); toast('Gespeichert: '+fname); };
$('fLoad').onclick=()=>{ $('fFile').value=''; $('fFile').click(); };
$('fFile').onchange=()=>{ const f=$('fFile').files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ let t=String(rd.result||'');
    try{ const o=JSON.parse(t); if(o&&typeof o.text==='string') t=o.text; }catch(e){}
    D.text=t; D.open={}; render(); toast('Geladen: '+f.name); };
  rd.readAsText(f); };
$('bPrint').onclick=()=>{
  if(!window.TafelShot) return;
  const alt=JSON.parse(JSON.stringify(D.open)), wasQuiz=D.quiz;
  D.quiz=false; D.open={}; items.forEach(i=>D.open[i.b]=true); render();
  const im=TafelShot.rasterize($('wrap'),{exclude:'#bar,#bar2',pad:10,scale:2.5});
  D.open=alt; D.quiz=wasQuiz; render();
  const win=window.open('','_blank'); if(!win){ toast('Bitte Pop-ups erlauben'); return; }
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Glossar</title>'+
    '<style>@page{margin:12mm}body{margin:0}img{width:100%}</style></head><body><img src="'+im.canvas.toDataURL('image/png')+'"></body></html>');
  win.document.close(); win.focus(); setTimeout(()=>win.print(),350);
};
function barFade(){ const bar=$('bar'), m=$('barMid');
  bar.classList.remove('compact');
  if(m.scrollWidth>m.clientWidth+2&&m.clientWidth<170) bar.classList.add('compact'); }
addEventListener('resize',barFade);

/* ---------- Tafel-Anbindung ---------- */
let ready=false, syncT=null;
function post(){ syncT=null; if(window.parent===window||!ready) return;
  try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
function sync(){ if(!syncT) syncT=setTimeout(post,250); }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return;
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return;
  D=Object.assign(D,e.data.data); ready=true;
  if(window.TafelModus) TafelModus.refresh();
  document.documentElement.style.setProperty('--fs',(D.fontSize||15)+'px');
  $('q').value=D.q||''; $('bQuiz').classList.toggle('on',!!D.quiz);
  $('bSort').querySelector('span').textContent=D.sort==='az'?'A → Z':'wie eingegeben';
  render(); barFade(); });
window.addEventListener('load',()=>{
  document.documentElement.style.setProperty('--fs',(D.fontSize||15)+'px');
  if(window.parent===window&&D.edit===undefined) D.edit=true;
  if(window.TafelModus) TafelModus.init({get:()=>D.edit!==false, set:v=>{ D.edit=v; render(); sync(); }});
  render(); barFade();
  if(window.parent===window){ ready=true; return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  setTimeout(()=>{ ready=true; },700);
});
</script>
</body></html>
