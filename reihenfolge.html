<!DOCTYPE html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reihenfolge</title>
<style>
  :root{--fs:15px;}
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;font-size:var(--fs);}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  #bar{display:flex;gap:4px;padding:6px;border-bottom:1px solid #e2e7ef;align-items:center;flex:none;overflow:hidden;}
  #barL,#barR{display:flex;gap:4px;align-items:center;flex:none;}
  #barMid{display:flex;gap:4px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:0 2px;}
  #bar.compact .tb span{display:none;}
  #bar.compact .tb{min-width:42px;padding:0 3px;}
  .tb{flex:none;min-width:52px;height:50px;border:1px solid #d6dce5;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 5px;color:#1f2430;font:inherit;}
  .tb svg{width:32px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tb span{font-size:.7em;font-weight:600;white-space:nowrap;}
  .tb.on{background:#2563eb;border-color:#2563eb;color:#fff;}
  .tb:disabled{opacity:.4;cursor:default;}
  .sep{width:1px;align-self:stretch;background:#e2e7ef;margin:0 3px;flex:none;}
  #bar2{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid #e2e7ef;align-items:center;flex-wrap:nowrap;flex:none;min-height:42px;font-size:.92em;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  #bar2>*{flex:0 0 auto;}
  .lbl{color:#64748b;font-weight:600;} .grow{flex:1 1 auto!important;min-width:4px;}
  .btn{border:1px solid #cfd6e0;background:#fff;border-radius:9px;padding:5px 10px;font:inherit;font-weight:600;color:#1f2430;cursor:pointer;white-space:nowrap;}
  .btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn.red{color:#dc2626;border-color:#fca5a5;}

  #kopf{flex:none;padding:8px 12px 0;}
  #kopf h2{margin:0;font-size:1.08em;}
  #kopf .hinweis{color:#8a93a2;font-size:.82em;margin-top:2px;}
  #figur{display:block;margin:6px 0 0;width:min(260px,52%);border:1px solid #e2e7ef;border-radius:10px;background:#fff;cursor:zoom-in;}
  #lupe{position:absolute;inset:0;background:rgba(15,23,42,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:70;}
  #lupe.an{display:flex;} #lupe img{max-width:96%;max-height:92%;background:#fff;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);}
  #liste{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 18px;display:flex;flex-direction:column;gap:7px;}
  .schritt{display:flex;gap:9px;align-items:stretch;border:1.5px solid #d6dce5;border-radius:12px;background:#fff;
    box-shadow:0 1px 2px rgba(15,23,42,.06);touch-action:pan-y;}
  /* Gezogen wird nur am Griff – über der Karte selbst scrollt der Finger wie gewohnt */
  .schritt .nr{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-weight:800;color:#fff;background:#94a3b8;border-radius:10px 0 0 10px;font-size:.95em;
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
  .schritt .nr .griff{font-size:.78em;line-height:1;opacity:.85;letter-spacing:1px;}
  .schritt .nr:active{background:#2563eb;}
  .schritt .txt{flex:1 1 auto;min-width:0;padding:9px 4px 9px 0;line-height:1.4;display:flex;gap:10px;align-items:flex-start;}
  .schritt .txt .t{flex:1 1 auto;min-width:0;}
  .schritt .fig{flex:none;width:152px;border:1px solid #e2e7ef;border-radius:9px;background:#fff;cursor:zoom-in;}
  .schritt.nurBild .txt{justify-content:center;padding:7px 4px 7px 0;}
  .schritt.nurBild .fig{width:min(300px,100%);}
  @media (max-width:470px){ .schritt .txt{flex-direction:column;gap:6px;} .schritt .fig{width:min(200px,100%);} }
  .schritt .pfeile{flex:none;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:4px 6px 4px 0;}
  .schritt .pfeile button{width:30px;height:26px;border:1px solid #e2e7ef;background:#f8fafc;border-radius:7px;
    font:800 13px -apple-system,sans-serif;color:#5b6472;cursor:pointer;padding:0;}
  .schritt .pfeile button:disabled{opacity:.3;}
  .schritt.zieht{position:fixed;z-index:50;box-shadow:0 10px 26px rgba(15,23,42,.25);opacity:.96;}
  .schritt.richtig{border-color:#16a34a;background:#f0fdf4;} .schritt.richtig .nr{background:#16a34a;}
  .schritt.falsch{border-color:#dc2626;background:#fef2f2;} .schritt.falsch .nr{background:#dc2626;}
  .schritt.loesung .nr{background:#2563eb;}
  #platz{border:2px dashed #93b4f5;border-radius:12px;background:#eff6ff;flex:none;}
  #leer{color:#8a93a2;text-align:center;padding:30px 12px;}

  #eingabe{position:absolute;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:12px;z-index:60;}
  #eingabe.an{display:flex;}
  #eIn{background:#fff;border-radius:14px;width:min(680px,96vw);max-height:92vh;display:flex;flex-direction:column;gap:8px;padding:14px;}
  #eIn h3{margin:0;font-size:1.05em;}
  #eIn .hint{color:#64748b;font-size:.84em;}
  #eIn input[type=text]{border:1px solid #cfd6e0;border-radius:9px;padding:7px 9px;font:inherit;}
  #eIn textarea{flex:1;min-height:200px;border:1px solid #cfd6e0;border-radius:10px;padding:9px;font:inherit;line-height:1.45;resize:none;}
  #eIn .row{display:flex;gap:7px;justify-content:flex-end;}
  #eIn .erow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:.9em;}
  #eIn .erow label{display:inline-flex;gap:5px;align-items:center;font-weight:600;}
  #eIn select{border:1px solid #cfd6e0;border-radius:9px;padding:5px 8px;font:inherit;}
  #eigene{position:absolute;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:12px;z-index:61;}
  #eigene.an{display:flex;}
  #gIn{background:#fff;border-radius:14px;width:min(620px,96vw);max-height:88vh;display:flex;flex-direction:column;gap:8px;padding:14px;}
  #gIn h3{margin:0;font-size:1.05em;}
  #gListe{flex:1;min-height:60px;overflow:auto;display:flex;flex-direction:column;gap:6px;}
  #gListe .gz{display:flex;gap:8px;align-items:center;border:1px solid #e2e7ef;border-radius:10px;padding:7px 9px;}
  #gListe .gz .t{flex:1;min-width:0;}
  #gListe .gz .t b{display:block;}
  #gListe .gz .t small{color:#64748b;}
</style>
</head><body>
<div id="wrap">
  <div id="bar"><div id="barL">
    <button class="tb tafelEdit" id="bLib" title="Fertige Argumentationsketten aus der Bibliothek"><svg viewBox="0 0 32 20"><path d="M3.5 17.7h25.5"/><path d="M5.8 17.7V6.4h3.9v11.3"/><path d="M11.1 17.7V2.4h4.4v15.3"/><path d="M16.9 17.7V5.6h3.7v12.1"/><path d="M23.3 17.6l-2.4-9.4h4l2.4 9.4"/></svg><span>Aufgaben</span></button>
    <button class="tb tafelEdit" id="bEdit" title="Eigene Schritte eintragen"><svg viewBox="0 0 32 20"><path d="M8 15h4l11-11-4-4L8 11Z M18 3l4 4"/></svg><span>✎ Schritte</span></button>
    <span class="sep"></span>
    </div><div id="barMid">
    <button class="tb" id="bMix" title="Schritte neu mischen"><svg viewBox="0 0 32 20"><path d="M4 5h5l14 10h5M4 15h5l4-3M23 2l4 3-4 3M23 12l4 3-4 3"/></svg><span>Mischen</span></button>
    <button class="tb" id="bCheck" title="Reihenfolge prüfen"><svg viewBox="0 0 32 20"><path d="M8 11l5 5 11-12"/></svg><span>Prüfen</span></button>
    <button class="tb tafelLoesung" id="bSol" title="Richtige Reihenfolge zeigen"><svg viewBox="0 0 32 20"><circle cx="16" cy="10" r="7"/><path d="M16 6v5l3 2"/></svg><span>Lösung</span></button>
    </div><div id="barR"><span class="sep"></span>
    <button class="tb tafelEdit" id="bPrint" title="Aufgabe drucken"><svg viewBox="0 0 32 20"><path d="M10 7V2h12v5 M10 15H7V7h18v8h-3 M10 12h12v6H10Z"/></svg><span>Drucken</span></button>
    <span id="teilenBtn" style="display:inline-flex"></span>
    <span id="shotBtns" style="display:inline-flex;gap:4px"></span>
  </div></div>
  <div id="bar2">
    <span class="lbl">Schrift</span>
    <button class="btn" id="fsM" title="kleiner">A−</button><button class="btn" id="fsP" title="größer">A+</button>
    <span class="sep"></span>
    <button class="btn" id="bBild" title="Bilder zu den Schritten ein- oder ausblenden" hidden>🖼 Bilder</button>
    <span class="sep" id="bBildSep" hidden></span>
    <span id="stand" class="lbl"></span>
    <span class="grow"></span>
    <button class="btn tafelEdit" id="bEigene" title="Eigene Aufgaben verwalten">📂 Eigene</button>
    <button class="btn red tafelEdit" id="bClear" title="Alle Schritte löschen">Leeren</button>
  </div>
  <div id="kopf"><h2 id="titel"></h2><div class="hinweis" id="hinweis"></div><img id="figur" alt="Figur zur Aufgabe" hidden></div>
  <div id="liste"></div>
</div>

<div id="lupe"><img id="lupeBild" alt=""></div>
<div id="eigene"><div id="gIn">
  <h3>Eigene Aufgaben</h3>
  <div class="hint" style="color:#64748b;font-size:.85em">Auf diesem Gerät gespeichert – sie erscheinen in der Auswahl unter „Eigene Aufgaben".</div>
  <div id="gListe"></div>
  <div class="row" style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
    <button class="btn" id="gExport" title="Alle eigenen Aufgaben als Datei sichern">⬆ Exportieren</button>
    <button class="btn" id="gImport" title="Aufgaben aus einer Datei hinzufügen">⬇ Importieren</button>
    <input type="file" id="gFile" accept=".json,.reihen,application/json" hidden>
    <span class="grow" style="flex:1 1 auto"></span>
    <button class="btn" id="gZu">Schließen</button>
  </div>
</div></div>
<div id="eingabe"><div id="eIn">
  <h3>Schritte eintragen</h3>
  <input type="text" id="eTitel" placeholder="Überschrift, z. B. Beweis: Satz des Thales">
  <div class="erow">
    <label><input type="checkbox" id="eSave"> in meine Bibliothek aufnehmen</label>
    <select id="eFach"><option value="">Fach …</option><option value="M">Mathematik</option><option value="Ph">Physik</option></select>
    <select id="eJg"><option value="0">Jgst. …</option></select>
  </div>
  <div class="hint">Ein Schritt je Zeile, in der <b>richtigen</b> Reihenfolge – gemischt wird beim Übernehmen. Leere Zeilen werden übergangen.</div>
  <textarea id="eTa" spellcheck="false" placeholder="Gegeben ist …&#10;Daraus folgt …&#10;Also gilt …"></textarea>
  <div class="row"><button class="btn" id="eAb">Abbrechen</button><button class="btn pri" id="eOk">Übernehmen</button></div>
</div></div>

<script src="shot.js"></script>
<script src="modus.js"></script>
<script src="lehrplan-glossar.js"></script>
<script src="lehrplan.js"></script>
<script src="reihenfolge-bibliothek.js"></script>
<script src="vendor/qrcode.min.js"></script>

<script>
"use strict";
const $=id=>document.getElementById(id);
const toast=m=>window.TafelShot&&TafelShot.toast(m);

/* D.schritte steht in der richtigen Reihenfolge, D.order ist die aktuelle Anordnung */
let D={ v:1, titel:'Beweis: Satz des Thales',
  schritte:['Gegeben ist ein Halbkreis über der Strecke AB mit dem Mittelpunkt M. Der Punkt C liegt auf dem Halbkreis.',
            'Weil M der Mittelpunkt ist, sind MA, MB und MC Radien desselben Kreises und damit gleich lang.',
            'Die Dreiecke AMC und BMC sind deshalb gleichschenklig.',
            'In einem gleichschenkligen Dreieck sind die Basiswinkel gleich groß.',
            'Der Winkel bei C setzt sich aus diesen beiden Basiswinkeln zusammen.',
            'Die Winkelsumme im Dreieck beträgt 180°, also ist der Winkel bei C genau 90°.'],
  order:[], geprueft:false, shown:false, fontSize:15, edit:true,
  bilder:null, figur:'', bildAn:true, bildModus:'beides', quelle:'' };
let ready=false;

const n=()=>D.schritte.length;
function ordnungPruefen(){ if(!Array.isArray(D.order)||D.order.length!==n()||
    D.order.some(i=>typeof i!=='number'||i<0||i>=n())||new Set(D.order).size!==n()) D.order=D.schritte.map((_,i)=>i); }
function mischen(){ ordnungPruefen(); const o=D.order.slice();
  for(let i=o.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; }
  if(n()>2&&o.every((v,i)=>v===i)) [o[0],o[1]]=[o[1],o[0]];        /* nicht zufällig schon fertig */
  D.order=o; D.geprueft=false; D.shown=false; }

/* ---------- Bilder zu den Schritten ----------
   Drei Darstellungen: Text und Bild, nur Bild (nur wenn jeder Schritt eines hat), nur Text. */
function alleBilder(){ return Array.isArray(D.bilder)&&D.bilder.length===n()&&n()>0&&
  D.bilder.every(b=>typeof b==='string'&&b); }
function modus(){
  let m=D.bildModus;
  if(m!=='bild'&&m!=='text'&&m!=='beides') m=(D.bildAn===false)?'text':'beides';   /* ältere Projekte */
  if(m==='bild'&&!alleBilder()) m='beides';
  return m;
}
function bildZu(idx){ if(modus()==='text'||!Array.isArray(D.bilder)) return '';
  const b=D.bilder[idx]; return (typeof b==='string'&&b)?b:''; }
function hatBilder(){ return !!(D.figur||(Array.isArray(D.bilder)&&D.bilder.some(b=>typeof b==='string'&&b))); }
function lupe(src){ $('lupeBild').src=src; $('lupe').classList.add('an'); }
$('lupe').onclick=()=>$('lupe').classList.remove('an');
$('figur').onclick=()=>{ if(D.figur) lupe(D.figur); };
$('bBild').onclick=()=>{
  const folge=alleBilder()?['beides','bild','text']:['beides','text'];
  const i=folge.indexOf(modus());
  D.bildModus=folge[(i+1)%folge.length];
  D.bildAn=D.bildModus!=='text';                      /* ältere Fassungen lesen weiter bildAn */
  render(); sync();
};

/* ---------- Anzeige ---------- */
function render(){
  ordnungPruefen();
  document.documentElement.style.setProperty('--fs',Math.max(11,Math.min(26,D.fontSize||15))+'px');
  $('titel').textContent=D.titel||'';
  $('titel').hidden=!(D.titel||'').trim();
  $('hinweis').textContent=n()?'Am Griff links ziehen oder mit ▲ ▼ verschieben – über der Karte selbst wischen scrollt die Liste.':'';
  const hatB=hatBilder(), m=modus();
  const fest=document.body.classList.contains('tafelGeteilt');   /* geteilt: Darstellung bleibt, wie sie geteilt wurde */
  $('bBild').hidden=$('bBildSep').hidden=!hatB||fest;
  $('bBild').textContent=m==='bild'?'🖼 nur Bilder':(m==='text'?'🖼 nur Text':'🖼 Text + Bild');
  $('bBild').title=alleBilder()
    ? 'Darstellung wechseln: Text und Bild · nur Bilder · nur Text'
    : 'Bilder zu den Schritten ein- oder ausblenden';
  $('bBild').classList.toggle('pri', hatB&&m!=='text');
  const fg=$('figur'); fg.hidden=!(D.figur&&m!=='text');
  if(!fg.hidden&&fg.getAttribute('src')!==D.figur) fg.src=D.figur;
  const host=$('liste'); host.innerHTML='';
  if(!n()){ host.innerHTML='<div id="leer">Noch keine Schritte – über „Aufgaben“ eine fertige Kette laden oder mit „✎ Schritte“ eigene eintragen.</div>'; stand(); return; }
  D.order.forEach((idx,pos)=>{
    const el=document.createElement('div'); el.className='schritt'; el.dataset.pos=pos;
    if(D.geprueft) el.classList.add(idx===pos?'richtig':'falsch');
    if(D.shown) el.classList.add('loesung');
    const nr=document.createElement('div'); nr.className='nr'; nr.title='zum Verschieben ziehen';
    const nz=document.createElement('div'); nz.textContent=pos+1;
    const gr=document.createElement('div'); gr.className='griff'; gr.textContent='⠿';
    nr.append(nz,gr);
    const tx=document.createElement('div'); tx.className='txt';
    const bq=bildZu(idx);
    const nurBild=(m==='bild'&&bq);
    if(nurBild) el.classList.add('nurBild');
    else { const tz=document.createElement('div'); tz.className='t'; tz.textContent=D.schritte[idx]; tx.appendChild(tz); }
    if(bq){ const im=document.createElement('img'); im.className='fig'; im.src=bq;
      im.alt=nurBild?'Schritt als Bild':'Bild zum Schritt';
      im.title='antippen zum Vergrößern'; im.onclick=()=>lupe(bq); tx.appendChild(im); }
    const pf=document.createElement('div'); pf.className='pfeile';
    const hoch=document.createElement('button'); hoch.textContent='▲'; hoch.title='nach oben'; hoch.disabled=pos===0;
    const run=document.createElement('button'); run.textContent='▼'; run.title='nach unten'; run.disabled=pos===D.order.length-1;
    hoch.onclick=()=>schieben(pos,pos-1); run.onclick=()=>schieben(pos,pos+1);
    pf.append(hoch,run);
    nr.addEventListener('pointerdown',e=>zugStart(e,el,pos));
    el.append(nr,tx,pf); host.appendChild(el);
  });
  stand();
}
function stand(){ const s=$('stand');
  if(!n()){ s.textContent=''; return; }
  if(D.shown){ s.textContent='Lösung – '+n()+' Schritte'; return; }
  if(D.geprueft){ const r=D.order.filter((v,i)=>v===i).length;
    s.textContent=r===n()?('Alles richtig – '+n()+' Schritte'):(r+' von '+n()+' an der richtigen Stelle'); return; }
  s.textContent=n()+' Schritte';
}
function schieben(von,nach){ if(nach<0||nach>=D.order.length) return;
  const o=D.order.slice(); const [x]=o.splice(von,1); o.splice(nach,0,x);
  D.order=o; D.geprueft=false; D.shown=false; render(); sync(); }

/* ---------- Ziehen ---------- */
let zug=null, rollT=null;
function rollen(dy){ clearInterval(rollT); if(!dy){ rollT=null; return; }
  rollT=setInterval(()=>{ const h=$('liste'); h.scrollTop+=dy; },16); }
function zugStart(e,el,pos){
  if(e.button!==undefined&&e.button!==0) return;
  const r=el.getBoundingClientRect();
  zug={el,pos,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,h:r.height,bewegt:false,id:e.pointerId};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.addEventListener('pointermove',zugMove);
  el.addEventListener('pointerup',zugEnde);
  el.addEventListener('pointercancel',zugEnde);
  e.preventDefault();
}
function zugMove(e){
  if(!zug||e.pointerId!==zug.id) return;
  const el=zug.el;
  if(!zug.bewegt){
    zug.bewegt=true;
    const p=document.createElement('div'); p.id='platz'; p.style.height=zug.h+'px';
    el.parentNode.insertBefore(p,el);
    el.classList.add('zieht'); el.style.width=zug.w+'px'; el.style.height=zug.h+'px';
  }
  el.style.left=(e.clientX-zug.dx)+'px'; el.style.top=(e.clientY-zug.dy)+'px';
  const platz=$('platz'), host=$('liste');
  const andere=[...host.children].filter(c=>c!==el&&c!==platz);
  let ziel=andere.length;
  for(let i=0;i<andere.length;i++){ const r=andere[i].getBoundingClientRect();
    if(e.clientY < r.top+r.height/2){ ziel=i; break; } }
  host.insertBefore(platz, andere[ziel]||null);
  /* an den Rändern mitscrollen, damit auch lange Ketten erreichbar bleiben */
  const hr=host.getBoundingClientRect();
  if(e.clientY<hr.top+48) rollen(-10);
  else if(e.clientY>hr.bottom-48) rollen(10);
  else rollen(0);
}
function zugEnde(e){
  rollen(0);
  if(!zug) return;
  const el=zug.el, pos=zug.pos, bewegt=zug.bewegt;
  el.removeEventListener('pointermove',zugMove); el.removeEventListener('pointerup',zugEnde); el.removeEventListener('pointercancel',zugEnde);
  try{ el.releasePointerCapture(zug.id); }catch(err){}
  zug=null;
  if(!bewegt){ return; }
  const platz=$('platz'), host=$('liste');
  let ziel=0;                                  /* so viele Karten stehen vor dem Platzhalter */
  for(const c of host.children){ if(c===platz) break; if(c!==el) ziel++; }
  el.classList.remove('zieht'); el.style.cssText='';
  if(platz) platz.remove();
  const o=D.order.slice(); const [x]=o.splice(pos,1);
  o.splice(Math.max(0,Math.min(o.length,ziel)),0,x);
  D.order=o; D.geprueft=false; D.shown=false; render(); sync();
}

/* ---------- Knöpfe ---------- */
$('bMix').onclick=()=>{ if(!n()) return; mischen(); render(); sync(); };
$('bCheck').onclick=()=>{ if(!n()) return; D.geprueft=true; D.shown=false; render(); sync();
  const r=D.order.filter((v,i)=>v===i).length;
  toast(r===n()?'Alles richtig!':(r+' von '+n()+' stehen an der richtigen Stelle')); };
$('bSol').onclick=()=>{ if(!n()) return; D.order=D.schritte.map((_,i)=>i); D.shown=true; D.geprueft=false; render(); sync(); };
$('bClear').onclick=()=>{ if(!n()) return; if(!confirm('Alle Schritte löschen?'))return;
  D.schritte=[]; D.order=[]; D.titel=''; D.geprueft=false; D.shown=false;
  D.bilder=null; D.figur=''; D.quelle=''; render(); sync(); };
for(const [id,d] of [['fsM',-1],['fsP',1]]) $(id).onclick=()=>{
  D.fontSize=Math.max(11,Math.min(26,(D.fontSize||15)+d)); render(); sync(); };

/* ---------- eigene Schritte ---------- */
$('bEdit').onclick=()=>{ $('eTitel').value=D.titel||'';
  $('eTa').value=D.schritte.map((_,i)=>D.schritte[i]).join('\n');
  $('eingabe').classList.add('an'); $('eTa').focus(); };
$('eAb').onclick=()=>$('eingabe').classList.remove('an');
$('eOk').onclick=()=>{
  const zeilen=$('eTa').value.split(/\r?\n/).map(z=>z.trim()).filter(Boolean);
  if(zeilen.length<2){ toast('Bitte mindestens zwei Schritte eintragen'); return; }
  D.titel=$('eTitel').value.trim(); D.schritte=zeilen; D.bilder=null; D.figur=''; D.quelle=''; mischen();
  if($('eSave').checked) eigeneSichern(D.titel, zeilen, $('eFach').value, $('eJg').value);
  $('eingabe').classList.remove('an'); render(); sync();
  toast(zeilen.length+' Schritte übernommen – jetzt ordnen'); };

/* ---------- eigene Aufgaben (geräteweit gespeichert) ---------- */
const EIGEN_KEY='tafel_reihen_eigene';
function eigeneLesen(){ try{ const a=JSON.parse(localStorage.getItem(EIGEN_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function eigeneSchreiben(a){ try{ localStorage.setItem(EIGEN_KEY,JSON.stringify(a)); }catch(e){ toast('Speichern nicht möglich – Speicher voll?'); } }
function eigeneSichern(titel,schritte,fach,jg){
  const a=eigeneLesen();
  const neu={t:titel||'Eigene Aufgabe', s:schritte.slice(), f:fach||'', j:+jg||0, zeit:Date.now()};
  const i=a.findIndex(x=>x.t===neu.t); if(i>=0) a[i]=neu; else a.push(neu);
  eigeneSchreiben(a); eigeneKnopf();
  toast(i>=0?'In der Bibliothek ersetzt: „'+neu.t+'"':'In die Bibliothek aufgenommen: „'+neu.t+'"');
}
function eigeneKnopf(){ const n=eigeneLesen().length; const b=$('bEigene');
  b.textContent='📂 Eigene'+(n?(' ('+n+')'):''); }
function eigeneListe(){ const host=$('gListe'); host.innerHTML=''; const a=eigeneLesen();
  if(!a.length){ host.innerHTML='<div style="color:#8a93a2;padding:14px;text-align:center">Noch keine eigenen Aufgaben</div>'; return; }
  a.forEach((e,i)=>{ const z=document.createElement('div'); z.className='gz';
    const t=document.createElement('div'); t.className='t';
    t.innerHTML='<b></b><small></small>';
    t.querySelector('b').textContent=e.t;
    t.querySelector('small').textContent=e.s.length+' Schritte'+(e.f?(' · '+(e.f==='M'?'Mathematik':'Physik')):'')+(e.j?(' · Jgst. '+e.j):'');
    const laden=document.createElement('button'); laden.className='btn'; laden.textContent='laden';
    laden.onclick=()=>{ D.titel=e.t; D.schritte=e.s.slice(); D.bilder=null; D.figur=''; D.quelle=''; mischen(); render(); sync();
      $('eigene').classList.remove('an'); toast(e.s.length+' Schritte übernommen – jetzt ordnen'); };
    const weg=document.createElement('button'); weg.className='btn red'; weg.textContent='🗑';
    weg.title='aus der Bibliothek löschen';
    weg.onclick=()=>{ if(!confirm('„'+e.t+'" aus der eigenen Bibliothek löschen?'))return;
      const b=eigeneLesen(); b.splice(i,1); eigeneSchreiben(b); eigeneListe(); eigeneKnopf(); };
    z.append(t,laden,weg); host.appendChild(z); });
}
$('bEigene').onclick=()=>{ eigeneListe(); $('eigene').classList.add('an'); };
$('gZu').onclick=()=>$('eigene').classList.remove('an');
/* Eigene Aufgaben als Datei sichern und auf anderen Geräten wieder einlesen */
$('gExport').onclick=()=>{ const a=eigeneLesen();
  if(!a.length){ toast('Es gibt noch keine eigenen Aufgaben'); return; }
  const blob=new Blob([JSON.stringify({typ:'tafel-reihenfolge', v:1, aufgaben:a},null,1)],{type:'application/json'});
  const l=document.createElement('a'); l.href=URL.createObjectURL(blob);
  l.download='reihenfolge-aufgaben.json'; l.click();
  setTimeout(()=>URL.revokeObjectURL(l.href),2000);
  toast(a.length+(a.length===1?' Aufgabe gesichert':' Aufgaben gesichert')); };
$('gImport').onclick=()=>$('gFile').click();
$('gFile').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  let roh=null;
  try{ roh=JSON.parse(await f.text()); }catch(err){ toast('Die Datei lässt sich nicht lesen'); return; }
  const liste=Array.isArray(roh)?roh:(roh&&Array.isArray(roh.aufgaben)?roh.aufgaben:null);
  if(!liste){ toast('In der Datei stehen keine Aufgaben'); return; }
  const gut=liste.filter(x=>x&&typeof x.t==='string'&&Array.isArray(x.s)&&x.s.length>1&&x.s.every(z=>typeof z==='string'));
  if(!gut.length){ toast('Keine brauchbaren Aufgaben gefunden'); return; }
  const a=eigeneLesen(); let neuZahl=0, ersetzt=0;
  gut.forEach(x=>{ const e2={t:x.t, s:x.s.slice(), f:(x.f==='M'||x.f==='Ph')?x.f:'', j:+x.j||0, zeit:Date.now()};
    const i=a.findIndex(y=>y.t===e2.t); if(i>=0){ a[i]=e2; ersetzt++; } else { a.push(e2); neuZahl++; } });
  eigeneSchreiben(a); eigeneListe(); eigeneKnopf();
  toast(neuZahl+' neu'+(ersetzt?(' · '+ersetzt+' ersetzt'):'')+(gut.length<liste.length?(' · '+(liste.length-gut.length)+' übersprungen'):'')); };

/* ---------- Bibliothek ---------- */
/* Eine Kette samt Veranschaulichungen übernehmen – aus dem Auswahlfenster oder aus einem geteilten Link */
function ketteLaden(d){
  D.titel=d.b; D.schritte=d.schritte.slice(); D.quelle=d.b;
  D.bilder=null; D.figur='';                       /* Bilder werden erst jetzt gezeichnet */
  try{ if(typeof d.bilder==='function'){ const b=d.bilder();
         if(Array.isArray(b)&&b.length===D.schritte.length) D.bilder=b; } }catch(err){}
  try{ if(typeof d.figur==='function') D.figur=d.figur()||''; }catch(err){}
  if(hatBilder()){ D.bildAn=true; if(modus()==='text') D.bildModus='beides'; }
  mischen(); render(); sync();
}
function ketteSuchen(titel){
  if(!(window.TafelReihen&&TafelReihen.verfuegbar())) return null;
  return TafelReihen.daten().find(e=>e.b===titel)||null;
}

if(window.TafelLehrplan&&window.TafelReihen&&TafelReihen.verfuegbar()){
  $('bLib').onclick=()=>TafelLehrplan.oeffnen({ titel:'Fertige Argumentationsketten',
    einheit:'Ketten', suche:'Überschrift oder Anfang …',
    daten:TafelReihen.daten().concat(eigeneLesen().map(e=>({ f:e.f||'', j:e.j||0, g:'Eigene Aufgaben', b:e.t,
      e:e.s.length+' Schritte · '+e.s[0].slice(0,70)+(e.s[0].length>70?' …':''), schritte:e.s.slice() }))),
    hinweis:'Beweise und Ursache-Wirkungs-Ketten – die Schritte werden beim Übernehmen gemischt.',
    uebernehmen:l=>{ const d=l[0]; if(!d||!d.schritte) return;
      ketteLaden(d);
      toast(D.schritte.length+' Schritte übernommen – jetzt ordnen');
      if(l.length>1) setTimeout(()=>toast('Es wird immer nur eine Kette geladen – die erste ausgewählte'),1400); } });
} else { const b=$('bLib'); if(b) b.hidden=true; }

/* ---------- Drucken ---------- */
$('bPrint').onclick=()=>{
  if(!n()){ toast('Keine Schritte zum Drucken'); return; }
  const esc=t=>String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  let h='<h1>'+esc(D.titel||'Reihenfolge')+'</h1><p class="a">Bringe die Schritte in die richtige Reihenfolge.</p><ol class="k">';
  const m=modus();
  if(D.figur&&m!=='text') h+='<p class="fig"><img src="'+D.figur+'"></p>';
  D.order.forEach(i=>{ const b=bildZu(i), nurBild=(m==='bild'&&b);
    h+='<li><span class="kasten"></span><span class="t">'+(nurBild?'':esc(D.schritte[i]))+
       (b?(nurBild?'':'<br>')+'<img src="'+b+'">':'')+'</span></li>'; });
  h+='</ol>';
  const win=window.open('','_blank');
  if(!win){ toast('Bitte Pop-ups erlauben – dann klappt das Drucken'); return; }
  win.document.write('<!DOCTYPE html><meta charset="utf-8"><title>Reihenfolge</title><style>'+
    '@page{margin:14mm}body{font:13.5px/1.5 -apple-system,Arial,sans-serif;color:#111;margin:0}'+
    'h1{font-size:18px;margin:0 0 2mm}p.a{color:#555;margin:0 0 5mm}'+
    'ol.k{list-style:none;padding:0;margin:0}ol.k li{display:flex;gap:4mm;align-items:flex-start;border:1px solid #999;'+
    'border-radius:3mm;padding:3mm 4mm;margin-bottom:3mm}'+
    '.kasten{flex:none;width:9mm;height:9mm;border:1px solid #999;border-radius:2mm}'+
    'ol.k li .t{flex:1}ol.k li img{display:block;margin-top:2mm;width:46mm;border:1px solid #ccc;border-radius:1.5mm}'+
    'p.fig img{width:62mm;border:1px solid #ccc;border-radius:1.5mm}ol.k li{break-inside:avoid}</style>'+h);
  win.document.close(); win.focus();
  setTimeout(()=>{ try{ win.print(); }catch(e){} },350);
};

if(window.TafelShot) TafelShot.buttons($('shotBtns'),()=>TafelShot.rasterize($('wrap'),{exclude:'#bar,#bar2',pad:8}),'btn');

/* ---------- Teilen: Aufgabe per QR-Code an die Klasse ---------- */
if(window.TafelTeilen){
  TafelTeilen.knopf($('teilenBtn'),'reihenfolge.html',()=>{
    if(!n()) return null;
    /* Stammt die Kette aus der Bibliothek, genügt ihr Titel – die Bilder entstehen auf dem Schülergerät neu */
    const m=modus();
    if(D.quelle&&ketteSuchen(D.quelle)) return {w:'r',k:D.quelle,m};
    return {w:'r',t:D.titel,s:D.schritte,m};
  });
}
function geteiltLaden(p){
  if(!p||p.w!=='r') return false;
  const d=p.k&&ketteSuchen(p.k);
  if(d){ ketteLaden(d);
    if(p.m){ D.bildModus=p.m; D.bildAn=p.m!=='text'; render(); }
    return true; }
  if(Array.isArray(p.s)&&p.s.length>1){
    D.titel=p.t||''; D.schritte=p.s.slice(); D.bilder=null; D.figur=''; D.quelle='';
    if(p.m){ D.bildModus=p.m; D.bildAn=p.m!=='text'; }
    mischen(); render(); return true;
  }
  return false;
}

/* ---------- Tafel-Anbindung ---------- */
function sync(){ if(window.parent===window||!ready) return;
  try{ parent.postMessage({type:'embed-data',data:D},'*'); }catch(e){} }
addEventListener('message',e=>{ if(window.parent===window||e.source!==window.parent) return;
  if(!(e.data&&e.data.type==='embed-data'&&e.data.data)) return;
  D=Object.assign(D,e.data.data);
  if(!Array.isArray(D.schritte)) D.schritte=[];
  if(!Array.isArray(D.bilder)||D.bilder.length!==D.schritte.length) D.bilder=null;
  ordnungPruefen(); render();
});
function schmal(){ $('bar').classList.toggle('compact', innerWidth<640); }
addEventListener('resize',schmal);
window.addEventListener('load',()=>{
  const geteilt=window.TafelTeilen&&TafelTeilen.istGeteilt();
  /* In der geteilten Fassung bleibt die Darstellung so, wie die Lehrkraft sie gewählt hat –
     sonst käme man bei „nur Bilder" mit einem Tipp wieder an die Texte. */
  if(geteilt){ TafelTeilen.nurBenutzen('#bSol,#shotBtns,#bBild,#bBildSep'); D.edit=false; }
  else if(window.TafelModus) TafelModus.init({get:()=>D.edit!==false, set:v=>{ D.edit=v; render(); sync(); }});
  for(let j=5;j<=13;j++){ const o=document.createElement('option'); o.value=j; o.textContent='Jgst. '+j; $('eJg').appendChild(o); }
  eigeneKnopf();
  schmal(); ordnungPruefen();
  if(!D.order.length||D.order.every((v,i)=>v===i)) mischen();
  render();
  if(geteilt){ ready=true;
    TafelTeilen.empfangen().then(p=>{ if(!geteiltLaden(p)) toast('Der Link konnte nicht gelesen werden'); })
      .catch(()=>toast('Der Link konnte nicht gelesen werden'));
    return; }
  if(window.parent===window){ ready=true; return; }
  try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){}
  setTimeout(()=>{ ready=true; },700);
});
</script>
</body></html>
